# UI-chrome translations.
#
# SCOPE, deliberately: interface strings only -- nav, hero, buttons, footer.
# The ~1 MB of long-form SEO copy in tools.yaml / intent_pages.yaml stays
# English and stays canonical. Machine-translating 459 pages x N languages is
# exactly the "scaled content abuse" Google's spam policy names, and this site's
# entire traffic plan is organic search -- so bulk translation is a strategic
# decision to take deliberately (with human review and hreflang), not a side
# effect of adding a language switcher.
#
# The calculators themselves are the part that actually crosses languages
# without help: they operate on numbers.
#
# Adding a language: copy the `en` block, translate values, keep keys identical.

