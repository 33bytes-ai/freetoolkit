# Interface strings, keyed (data-i18n="..." in the templates).
#
# Everything else on a page -- calculator labels and results, tool bodies,
# guides, glossary, static pages -- is translated from content/i18n/<lang>/
# (see src/freetoolkit/i18n.py). All of it is applied client-side: English
# stays the only version crawlers see, with no new URLs. Machine-translated
# pages at their own URLs would be the "scaled content abuse" Google's spam
# policy names, on a site whose traffic plan is organic search.
#
# Adding a language: copy the `en` block, translate values, keep keys identical.

