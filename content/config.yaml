# Site-wide configuration consumed by src/freetoolkit/build.py
site:
  name: "FounderCalc"
  tagline: "Free business calculators for indie founders, freelancers and SaaS builders"
  description: >
    FounderCalc is a collection of free, instant business calculators —
    Stripe fees, MRR, LTV/CAC, runway, profit margin, freelance rates and more.
    All math runs in your browser. No sign-up, no uploads, no tracking.
  base_url: "https://foundercalc.dev"
  twitter: ""

  # Flip to true once AdSense application is approved (see docs/MONETIZATION.md).
  # Business/SaaS calculator audience commands RPM of $8–20 vs $1–3 for general tools.
  ads_enabled: false
  adsense_client_id: "ca-pub-6294535713639434"

  # Set to your Formspree form ID to enable the newsletter signup forms: the
  # homepage card and the discreet one in the footer on every page.
  # Get a free form at https://formspree.io — use the 8-character ID from your form URL.
  # Formspree submissions can be forwarded to ConvertKit/Beehiiv via their
  # Zapier integration (both are free-tier) once a list is set up there.
  formspree_id: "xnjewraq"

  # Publisher identity, disclosed on /legal-notice/ as French law requires of
  # any site published from France (LCEN art. 6-III). Each key is available to
  # content/pages/*.md as {{ legal_<key> }}.
  legal:
    name: "Guillaume Malvestio"
    address: "28 rue du Buisson Saint-Louis, 75010 Paris, France"
    siren: "934129537"
    siret: "93412953700023"
    ape: "6201Z — Computer programming"
    registered_on: "5 August 2026"
    vat: "Not applicable — VAT exemption under art. 293 B of the French tax code"

# Navigation categories, in display order.
categories:
  - Payments
  - SaaS Growth Metrics
  - SaaS Retention Metrics
  - Freelance
  - Pricing & Margins
  - Marketing
  - Finance
  - Cash Flow
  - Investment & Returns
  - Valuation
  - Tax & Compliance
  - HR & People
