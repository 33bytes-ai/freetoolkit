: "Der Betrag, den du dem Kunden berechnest. Bei aktivierter Gebührenweitergabe wird er erhöht, damit du nach Gebühren den gewünschten Betrag erhältst."
? "The amount to charge your customer. If pass-through is enabled, this is grossed up so you receive your intended net amount."
: "Der Betrag, den du dem Kunden berechnest. Bei aktivierter Gebührenweitergabe wird er erhöht, damit bei dir der gewünschte Nettobetrag ankommt."
? "The annualized run rate at the end of the forward projection period. Shows what your ARR would be if today's growth rate holds."
: "Die annualisierte Run-Rate am Ende des Projektionszeitraums. Zeigt, wo dein ARR stünde, wenn das heutige Wachstum anhält."
? "The blended rate your business must earn on all assets to satisfy equity and debt holders. Used as the discount rate in DCF valuations."
: "Die Mischrendite, die dein Unternehmen auf sein gesamtes Vermögen erzielen muss, um Eigen- und Fremdkapitalgeber zufriedenzustellen. Wird als Diskontsatz in DCF-Bewertungen verwendet."
? "The complete SaaS unit economics dashboard: CAC payback, LTV:CAC ratio, gross margin, and magic number in one place, for a full efficiency review."
: "Das komplette SaaS-Unit-Economics-Dashboard: CAC-Amortisation, LTV:CAC-Verhältnis, Bruttomarge und Magic Number an einem Ort, für einen vollständigen Effizienz-Check."
"The discount amount in dollars (subtotal × discount %). Applied before tax.": "Der Rabattbetrag (Zwischensumme × Rabatt %). Wird vor Steuern angewendet."
"The discount rate that makes the NPV of all cash flows equal to zero. If IRR > hurdle rate, the investment creates value.": "Der Diskontsatz, bei dem der NPV aller Cashflows null ist. Liegt der IRR über der Mindestrendite, schafft die Investition Wert."
? "The equivalent annual return if this ROI were earned evenly each year. Useful for comparing investments with different time horizons."
: "Die äquivalente Jahresrendite, wenn dieser ROI gleichmäßig jedes Jahr erzielt würde. Nützlich zum Vergleich von Investitionen mit unterschiedlichen Zeiträumen."
? "The fastest way to get your LTV:CAC ratio — enter ARPU, margin, churn, and spend once and get both LTV and CAC together, without filling in two separate calculators."
: "Der schnellste Weg zu deinem LTV:CAC-Verhältnis: ARPU, Marge, Churn und Ausgaben einmal eingeben und LTV und CAC zusammen erhalten, ohne zwei Rechner auszufüllen."
"The final amount to put on your invoice: discounted subtotal + tax.": "Der Endbetrag deiner Rechnung: rabattierte Zwischensumme + Steuer."
? "The largest paid search and display ad platform. Run search, shopping, display, and YouTube ads with built-in ROAS bidding strategies and conversion tracking."
: "Die größte Plattform für Such- und Displaywerbung. Such-, Shopping-, Display- und YouTube-Anzeigen mit integrierten ROAS-Gebotsstrategien und Conversion-Tracking."
