"Calculate MoM, QoQ, and YoY revenue growth rates, CAGR, and time-to-double to benchmark your startup's trajectory.": "Berechne das Umsatzwachstum gegenüber Vormonat, Vorquartal und Vorjahr, die CAGR und die Verdopplungszeit, um den Kurs deines Startups einzuordnen."
? "Calculate Modified Internal Rate of Return — a more accurate investment return metric that corrects IRR's reinvestment rate assumption."
