? "% Promoters − % Detractors. Ranges from {0} to {1}. Benchmark: {2}+ is okay, {3}+ is good, {4}+ is excellent, {5}+ is world-class."
: "% Promotoren − % Kritiker. Spanne von {0} bis {1}. Richtwert: {2}+ ist ok, {3}+ gut, {4}+ exzellent, {5}+ Weltklasse."
