? "((TIE − {0}) ÷ TIE) × {1}. How much EBIT can decline before you can no longer cover interest. A TIE of {2}× means EBIT can drop {3} and you still break even on interest."
: "((TIE − {0}) ÷ TIE) × {1}. Wie stark das EBIT sinken kann, bevor du die Zinsen nicht mehr deckst. Ein TIE von {2}× heißt: Das EBIT kann um {3} fallen und die Zinsen sind noch gedeckt."
? "({0} + monthly growth rate)^{1} − {2}. Annualised equivalent growth rate accounting for compounding. Useful for year-over-year planning."
: "({0} + monatliche Wachstumsrate)^{1} − {2}. Die äquivalente jährliche Wachstumsrate inklusive Zinseszinseffekt. Nützlich für die Jahresplanung."
? "({0} − monthly churn rate)^projection_months. Fraction of the original cohort still active at the end of the horizon. Shows long-run attrition shape."
: "({0} − monatliche Churn-Rate)^Projektionsmonate. Der Anteil der ursprünglichen Kohorte, der am Ende des Horizonts noch aktiv ist. Zeigt den langfristigen Verlauf der Abwanderung."
? "(Actual − Budget) ÷ |Budget| × {0}. Percentage difference between actual and budget. Used to identify material variances — typically anything over {1}–{2} warrants investigation."
: "(Ist − Budget) ÷ |Budget| × {0}. Die prozentuale Abweichung zwischen Ist und Budget. Dient zum Erkennen wesentlicher Abweichungen: Alles über {1}–{2} verdient meist eine Prüfung."
? "(Avg Accounts Payable ÷ COGS) × {0}. Average days before you pay suppliers. Higher DPO improves CCC — but don't exceed supplier terms."
: "(Ø Verbindlichkeiten ÷ Herstellkosten) × {0}. Die durchschnittlichen Tage bis zur Zahlung an Lieferanten. Ein höherer DPO verbessert den CCC, aber überschreite nicht die Lieferantenbedingungen."
? "(Avg Accounts Receivable ÷ Revenue) × {0}. Average days to collect payment after a sale. Benchmark: {1}–{2} days for B{3}; SaaS with upfront billing: ~{4}."
: "(Ø Forderungen ÷ Umsatz) × {0}. Die durchschnittlichen Tage bis zum Zahlungseingang nach einem Verkauf. Richtwert: {1}–{2} Tage im B{3}; SaaS mit Vorauszahlung: ~{4}."
? "(Avg Inventory ÷ COGS) × {0}. How many days of inventory you hold on average. Lower is better — excess inventory ties up working capital."
: "(Ø Lagerbestand ÷ Herstellkosten) × {0}. Wie viele Tage Lagerbestand du im Schnitt hältst. Weniger ist besser: Überbestände binden Working Capital."
? "(Beginning inventory + Ending inventory) ÷ {0}. The denominator used in turnover. More accurate than using period-end inventory alone for seasonal businesses."
: "(Anfangsbestand + Endbestand) ÷ {0}. Der Nenner der Umschlagshäufigkeit. Bei saisonalem Geschäft genauer als nur der Bestand zum Periodenende."
? "(Current ARR − ARR {0} months ago) ÷ ARR {1} months ago. Year-over-year ARR growth. T{2}D{3} targets: triple twice, then double {4} times."
: "(Aktueller ARR − ARR vor {0} Monaten) ÷ ARR vor {1} Monaten. ARR-Wachstum gegenüber dem Vorjahr. T{2}D{3}-Ziel: zweimal verdreifachen, dann {4}-mal verdoppeln."
? "(Current ARR − Prior ARR) ÷ Prior ARR. Year-over-year growth. T{0}D{1} (triple twice, double {2} times) = {3}+ growth in early years."
: "(Aktueller ARR − Vorjahres-ARR) ÷ Vorjahres-ARR. Wachstum gegenüber dem Vorjahr. T{0}D{1} (zweimal verdreifachen, {2}-mal verdoppeln) = {3}+ Wachstum in den ersten Jahren."
? "(Current Assets − Inventory) ÷ Current Liabilities. The 'acid test' — excludes inventory since it may not convert to cash quickly. Target: ≥{0}×."
: "(Umlaufvermögen − Lagerbestand) ÷ kurzfristige Verbindlichkeiten. Der „Säuretest“: ohne Lager, da es sich nicht unbedingt schnell in Cash verwandeln lässt. Ziel: ≥ {0}×."
? "(Current Revenue − Break-Even Revenue) × Contribution Margin. Estimated monthly profit (or loss) relative to break-even. Positive = profitable."
: "(Aktueller Umsatz − Break-even-Umsatz) × Deckungsbeitragsquote. Der geschätzte monatliche Gewinn (oder Verlust) relativ zum Break-even. Positiv = profitabel."
? "(Current Revenue − Break-Even Revenue) ÷ Current Revenue. How far revenue can drop before you lose money. {0}+ is healthy; below {1} is fragile."
: "(Aktueller Umsatz − Break-even-Umsatz) ÷ aktueller Umsatz. Wie weit der Umsatz fallen kann, bevor du Geld verlierst. {0}+ ist gesund; unter {1} ist es fragil."
? "(Current − Previous) ÷ Previous × {0}. Year-over-year or period-over-period revenue growth rate. High-growth SaaS: {1}–{2}+; established companies: {3}–{4}."
: "(Aktuell − Vorperiode) ÷ Vorperiode × {0}. Die Umsatzwachstumsrate gegenüber Vorjahr oder Vorperiode. Wachstarkes SaaS: {1}–{2}+; etablierte Unternehmen: {3}–{4}."
"(Current − Prior) ÷ Prior × {0}. The growth rate between these two specific periods.": "(Aktuell − Vorperiode) ÷ Vorperiode × {0}. Die Wachstumsrate zwischen diesen beiden Perioden."
? "(Discount% ÷ ({0} − Discount%)) × ({1} ÷ Days Gained). The annualized cost of passing on the early payment discount. Compare this to your cost of capital: if your borrowing rate is lower, take the discount."
: "(Skonto % ÷ ({0} − Skonto %)) × ({1} ÷ gewonnene Tage). Die annualisierten Kosten, wenn du auf Skonto verzichtest. Vergleiche mit deinen Kapitalkosten: Ist dein Kreditzins niedriger, nimm das Skonto."
? "(End − New) ÷ Start × {0}. The % of starting customers still active at period end. B{1} SaaS benchmark: {2}–{3} monthly; {4}–{5} annual."
: "(Ende − Neu) ÷ Start × {0}. Der Anteil der Anfangskunden, der am Periodenende noch aktiv ist. B{1}-SaaS-Richtwert: {2}–{3} monatlich; {4}–{5} jährlich."
? "(Fixed Costs + Target Profit) ÷ Unit Contribution Margin. Units needed to cover fixed costs AND hit your desired profit figure."
: "(Fixkosten + Zielgewinn) ÷ Stückdeckungsbeitrag. Die Stückzahl, um Fixkosten zu decken UND den gewünschten Gewinn zu erreichen."
? "(New MRR + Expansion) ÷ (Contraction + Churn). Above {0} = exceptional growth efficiency. Between {1}–{2} = healthy. Below {3} = you're losing more than you're gaining."
: "(Neuer MRR + Expansion) ÷ (Kontraktion + Churn). Über {0} = außergewöhnlich effizientes Wachstum. Zwischen {1} und {2} = gesund. Unter {3} = du verlierst mehr, als du gewinnst."
? "(New Price − Current Price) ÷ Current Price. The % price change being modelled. Positive = price increase; negative = price cut."
: "(Neuer Preis − aktueller Preis) ÷ aktueller Preis. Die modellierte Preisänderung in %. Positiv = Erhöhung; negativ = Senkung."
? "(New − Old) ÷ |Old| × {0}. Percentage change from the original value to the new value. Positive = increase; negative = decrease."
: "(Neu − Alt) ÷ |Alt| × {0}. Die prozentuale Veränderung vom Ausgangswert zum neuen Wert. Positiv = Anstieg; negativ = Rückgang."
? "(Opportunities × Win Rate × ACV) ÷ Sales Cycle Days. Revenue generated per day from your pipeline. Increasing any of the {0} inputs improves velocity."
: "(Opportunities × Abschlussquote × ACV) ÷ Tage im Verkaufszyklus. Der Umsatz, den deine Pipeline pro Tag erzeugt. Jede der {0} Stellschrauben erhöht die Geschwindigkeit."
"(Original − Sale Price) ÷ Original × {0}. The percentage reduction from the original price.": "(Original − Aktionspreis) ÷ Original × {0}. Die prozentuale Reduzierung gegenüber dem Originalpreis."
? "(Period Revenue ÷ Period Months) × {0}. If you earned {1} in {2} months, your ARR run rate is {3}. An extrapolation, not a guarantee."
: "(Periodenumsatz ÷ Periodenmonate) × {0}. Wenn du in {2} Monaten {1} verdient hast, liegt deine ARR-Run-Rate bei {3}. Eine Hochrechnung, keine Garantie."
? "(Price − Cost) ÷ Cost × {0}. Markup is calculated on cost. A {1} markup means you doubled your cost. Markup is always higher than the equivalent margin percentage."
: "(Preis − Kosten) ÷ Kosten × {0}. Der Aufschlag wird auf die Kosten berechnet. Ein Aufschlag von {1} heißt, du hast deine Kosten verdoppelt. Der Aufschlag ist immer höher als die entsprechende Marge."
? "(Price − Cost) ÷ Price × {0}. Margin is calculated on selling price. A {1} margin ≠ {2} markup — margin on {3} at {4} cost is {5}, markup is {6}."
: "(Preis − Kosten) ÷ Preis × {0}. Die Marge wird auf den Verkaufspreis berechnet. Eine Marge von {1} ≠ ein Aufschlag von {2}: Bei {3} und Kosten von {4} beträgt die Marge {5}, der Aufschlag {6}."
"(Revenue − COGS) ÷ COGS. Shows how much profit you make per dollar of production cost. Useful for pricing strategy.": "(Umsatz − Herstellkosten) ÷ Herstellkosten. Zeigt, wie viel Gewinn du pro Euro Produktionskosten erzielst. Nützlich für die Preisstrategie."
"(Revenue − COGS) ÷ Revenue × {0}. Gross margin percentage. Retail: {1}–{2}; SaaS: {3}–{4}; Manufacturing: {5}–{6}.": "(Umsatz − Herstellkosten) ÷ Umsatz × {0}. Die Bruttomarge in Prozent. Handel: {1}–{2}; SaaS: {3}–{4}; Industrie: {5}–{6}."
"(Revenue − COGS) ÷ Revenue × {0}. Profit after direct costs. SaaS: {1}–{2}; Manufacturing: {3}–{4}; Retail: {5}–{6}.": "(Umsatz − Herstellkosten) ÷ Umsatz × {0}. Gewinn nach direkten Kosten. SaaS: {1}–{2}; Industrie: {3}–{4}; Handel: {5}–{6}."
"(Revenue − COGS) ÷ Revenue. SaaS targets {0}–{1}; retail is typically {2}–{3}.": "(Umsatz − Herstellkosten) ÷ Umsatz. SaaS strebt {0}–{1} an; der Handel liegt meist bei {2}–{3}."
? "(Revenue − Campaign Cost) ÷ Campaign Cost × {0}. Email consistently delivers {1}+ ROI industry-wide, making it the highest ROI channel."
: "(Umsatz − Kampagnenkosten) ÷ Kampagnenkosten × {0}. E-Mail liefert branchenweit konstant {1}+ ROI und ist damit der Kanal mit dem höchsten ROI."
"(Revenue − Costs − Investment) ÷ Investment × {0}. The total return over the entire time horizon, not annualized.": "(Umsatz − Kosten − Investition) ÷ Investition × {0}. Die Gesamtrendite über den gesamten Zeitraum, nicht annualisiert."
? "(Revenue − Marketing Spend) ÷ Marketing Spend × {0}. Return on your marketing investment for this lead channel. Positive = profitable; higher is better."
: "(Umsatz − Marketingbudget) ÷ Marketingbudget × {0}. Die Rendite deiner Marketinginvestition für diesen Kanal. Positiv = profitabel; höher ist besser."
? "(Sale Price − COGS) ÷ Sale Price × {0}. Your gross margin after applying the discount. Watch that discounting doesn't push this below your break-even margin."
: "(Aktionspreis − Herstellkosten) ÷ Aktionspreis × {0}. Deine Bruttomarge nach Rabatt. Achte darauf, dass der Rabatt sie nicht unter deine Break-even-Marge drückt."
? "(Starter price − cost per customer) ÷ Starter price. Actual gross margin at the Starter tier price. SaaS targets: {0}–{1} for hosted software."
: "(Starter-Preis − Kosten pro Kunde) ÷ Starter-Preis. Die tatsächliche Bruttomarge beim Starter-Preis. SaaS-Ziel: {0}–{1} für gehostete Software."
? "(Starting MRR − Churned − Contracted) ÷ Starting MRR × {0}. GRR excludes expansion revenue — it only measures revenue retention from existing customers. Always ≤ {1}."
: "(Start-MRR − Churn − Kontraktion) ÷ Start-MRR × {0}. Die GRR schließt Expansion aus: Sie misst nur die Umsatzbindung bestehender Kunden. Immer ≤ {1}."
? "(Starting customers − Churned) ÷ Starting customers. Percentage of the original cohort still active after the first period. B{0} SaaS benchmark: {1}–{2} after month {3}."
: "(Anfangskunden − Kündigungen) ÷ Anfangskunden. Der Anteil der ursprünglichen Kohorte, der nach der ersten Periode noch aktiv ist. B{0}-SaaS-Richtwert: {1}–{2} nach Monat {3}."
? "(Target AOV − Current AOV) × Monthly Orders. Additional monthly revenue from raising AOV to target, at the same order volume."
: "(Ziel-Warenkorb − aktueller Warenkorb) × monatliche Bestellungen. Zusätzlicher Monatsumsatz, wenn du den Warenkorbwert bei gleichem Volumen aufs Ziel hebst."
? "(Total Cash Flows − Initial Investment) ÷ Initial Investment × {0}, over the analysis period. Undiscounted return on investment across all years."
: "(Summe der Cashflows − Anfangsinvestition) ÷ Anfangsinvestition × {0} über den Analysezeitraum. Die nicht abgezinste Rendite über alle Jahre."
