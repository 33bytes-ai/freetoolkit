"budget-variance-calculator":
  "body": |
    ## Formel der Budgetabweichung

    $$\text{Abweichung} = \text{Ist} - \text{Budget}$$

    $$\text{Abweichung \%} = \frac{\text{Ist} - \text{Budget}}{|\text{Budget}|} \times 100$$

    ### Günstig oder ungünstig

    Ob eine Abweichung „günstig“ ist, hängt von der Art der Position ab:

    | Art der Position | Günstige Bedingung |
    |-----------|---------------------|
    | Umsatz | Ist > Budget (mehr eingenommen als geplant) |
    | Kosten | Ist < Budget (weniger ausgegeben als geplant) |

    ### Wesentlichkeitsschwellen

    Die meisten Organisationen legen Wesentlichkeitsschwellen fest, ab denen Abweichungen untersucht werden. Übliche Regeln:
    - Abweichungen > 5–10 % bei Budgetpositionen über 10.000 $ untersuchen
    - Umsatzabweichungen > 10 % immer untersuchen
    - Kumulierte Abweichungen melden, auch wenn jede einzelne Periode im Toleranzbereich liegt

    ### Arten von Budgetabweichungen

    - **Preisabweichung**: Der Stückpreis wich vom Budget ab
    - **Mengenabweichung**: Verkaufte oder verbrauchte Menge wich ab
    - **Effizienzabweichung**: Arbeits- oder Materialeinsatz pro Einheit wich ab
    - **Mix-Abweichung**: Die Zusammensetzung der verkauften Produkte oder Leistungen wich vom geplanten Mix ab

    Die Ursache einer Abweichung bestimmt die passende Gegenmaßnahme.

    ### Ratgeber

    - [Was ist eine Budgetabweichungsanalyse?](/tools/budget-variance-calculator/#what-is-budget-variance-analysis)
    - [Günstige vs. ungünstige Abweichung: die wichtigsten Unterschiede](/tools/budget-variance-calculator/#favorable-vs-unfavorable-variance)
"cash-conversion-cycle-calculator":
  "body": |
    Der Cash Conversion Cycle (CCC) misst, wie viele Tage das Cash eines
    Unternehmens im operativen Geschäft gebunden ist: von der Bezahlung von
    Lagerbestand oder Vorleistungen bis zum Zahlungseingang der Kunden.

    ## Die CCC-Formel

    **CCC = DIO + DSO − DPO**

    Dabei gilt:
    - **DIO** (Lagerreichweite in Tagen) = durchschnittlicher Lagerbestand ÷ [Herstellkosten](/glossary/#cogs) × 365
    - **DSO** (Forderungslaufzeit) = durchschnittliche Forderungen ÷ Umsatz × 365
    - **DPO** (Verbindlichkeitenlaufzeit) = durchschnittliche Verbindlichkeiten ÷ Herstellkosten × 365

    ## Rechenbeispiel

    Ein Unternehmen mit:
    - Durchschnittlichem Lagerbestand: 500.000 $
    - Jährlichen Herstellkosten: 3 Mio. $
    - Durchschnittlichen Forderungen: 400.000 $
    - Jahresumsatz: 5 Mio. $
    - Durchschnittlichen Verbindlichkeiten: 200.000 $

    - DIO = 500.000 $ ÷ 3 Mio. $ × 365 = 60,8 Tage
    - DSO = 400.000 $ ÷ 5 Mio. $ × 365 = 29,2 Tage
    - DPO = 200.000 $ ÷ 3 Mio. $ × 365 = 24,3 Tage
    - **CCC = 60,8 + 29,2 − 24,3 = 65,7 Tage**

    Im Schnitt sind 65,7 Tage Cash im Working Capital gebunden.

    ## Negativer CCC: der heilige Gral

    Manche Unternehmen, vor allem SaaS (Kunden zahlen im Voraus) und große
    Händler (sie verkaufen, bevor sie Lieferanten bezahlen), erreichen einen
    negativen CCC: Sie kassieren, bevor sie ihre Lieferanten bezahlen müssen.

    Amazon arbeitete jahrelang mit negativem CCC und nutzte Lieferantenkredite
    praktisch als kostenloses Working Capital zur Finanzierung des Wachstums.

    ## Der CCC bei SaaS

    Reine SaaS-Unternehmen haben typischerweise:
    - DIO = 0 (kein physischer Lagerbestand)
    - DSO = je nach Zahlungsbedingungen (0 bei Monatsabos, 30–60 bei Enterprise-Kunden auf Rechnung)
    - DPO = je nach Lieferantenbedingungen (meist 30–60 Tage)

    SaaS mit monatlicher Kartenabrechnung und üblichen Zahlungszielen hat oft
    einen CCC nahe 0 oder negativ.

    ## So verbesserst du den CCC

    **DIO senken**: Lager schneller umschlagen durch bessere Bedarfsprognosen,
    weniger Sicherheitsbestand oder Just-in-time-Beschaffung.

    **DSO senken**: Skonto für frühe Zahlung anbieten, das Mahnwesen
    automatisieren, Zahlungsziele für Neukunden verkürzen, automatische Abbuchung
    einführen.

    **DPO erhöhen**: längere Zahlungsziele mit Lieferanten verhandeln (60–90 statt
    30 Tage). Große Unternehmen tun das systematisch.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet Lagerreichweite (DIO), Forderungslaufzeit (DSO) und
    Verbindlichkeitenlaufzeit (DPO) und fasst sie zum Cash Conversion Cycle
    zusammen.
"dso-calculator":
  "body": |
    ## Was ist die Forderungslaufzeit (DSO)?

    Die Days Sales Outstanding (DSO) messen, wie viele Tage dein Unternehmen im
    Schnitt braucht, um nach einem Verkauf das Geld einzunehmen. Sie gehören zu
    den wichtigsten Working-Capital-Kennzahlen, weil sie direkt beziffern, wie
    viel Cash jeweils in Forderungen gebunden ist.

    **DSO = (Forderungen ÷ gesamte Kreditverkäufe) × Anzahl der Tage**

    Eine niedrigere DSO bedeutet schnelleren Zahlungseingang und weniger Cash in
    offenen Rechnungen. Eine steigende DSO ist ein frühes Warnsignal für
    Inkassoprobleme oder Liquiditätsengpässe bei Kunden.

    ## So liest du deine DSO

    | DSO | Einordnung |
    |---|---|
    | Unter 30 Tage | Hervorragend: Kunden zahlen pünktlich |
    | 30–45 Tage | Gut: passend zu üblichen 30 Tagen Zahlungsziel |
    | 45–60 Tage | Akzeptabel: auf steigenden Trend achten |
    | 60–90 Tage | Erhöht: Inkassoprozess überprüfen |
    | Über 90 Tage | Hoch: deutliche Belastung des Working Capital |

    ## Forderungsumschlag

    Der Forderungsumschlag ist das Gegenstück zur DSO:

    **Forderungsumschlag = gesamte Kreditverkäufe ÷ durchschnittliche Forderungen**

    Ein höherer Umschlag heißt, du kassierst schneller. Er ergänzt die DSO: Ein
    Umschlag von 12× entspricht einer durchschnittlichen DSO von etwa 30 Tagen.

    ## So senkst du die DSO

    1. **Zahlungsziele verkürzen**: für Neukunden von 60 auf 30 Tage
    2. **Skonto anbieten**: „2/10 netto 30“ (2 % Nachlass bei Zahlung innerhalb von 10 Tagen)
    3. **Erinnerungen automatisieren**: nach 7, 14 und 30 Tagen Verzug
    4. **Anzahlungen verlangen**: bei großen Projekten 25–50 % im Voraus
    5. **Mehr Zahlungsarten akzeptieren**: weniger Reibung mit Lastschrift, Karte und Überweisung

    ## Wirkung auf das Working Capital

    Jeder Tag weniger DSO setzt Cash in Höhe deines Tagesumsatzes frei. Bei
    450.000 $ pro Quartal und einer Senkung der DSO von 45 auf 30 Tage setzt du
    15 × (450.000 $ ÷ 90) = **75.000 $ Cash** frei, ohne dass sich der Umsatz
    ändert.

    ## Häufige Fragen

    **Was ist eine gute DSO für ein B2B-SaaS-Unternehmen?**
    B2B-SaaS mit Monatsabos hat oft eine DSO nahe null, weil im Voraus abgebucht
    wird. Bei Jahresverträgen mit Vorabrechnung liegt die DSO meist bei 30–45
    Tagen nach Rechnungsstellung. Mit Abo- und Dienstleistungsumsatz zusammen
    kann die gemischte DSO bei 35–55 Tagen liegen.

    **Wie wirkt sich die DSO auf meine Kreditlinie aus?**
    Kreditgeber prüfen die DSO bei assetbasierten Krediten und
    Forderungsfinanzierung. Eine hohe oder steigende DSO kann auf
    Inkassoprobleme hindeuten und die Beleihungsquote deiner Forderungen senken.
    Eine DSO unter 45 Tagen macht deine Forderungen meist zu üblichen Quoten
    (oft 80–85 %) finanzierbar.
"free-cash-flow-calculator":
  "body": |
    Der Free Cashflow (FCF) ist das Cash, das ein Unternehmen nach Abzug der
    Investitionsausgaben erwirtschaftet. Er ist das ehrlichste Maß dafür, ob ein
    Unternehmen Cash erzeugt: verlässlicher als der Gewinn (den
    Bilanzierungsentscheidungen verzerren können) und aussagekräftiger als das
    Umsatzwachstum allein.

    ## Die Formel

    **FCF = operativer Cashflow − Investitionsausgaben**

    Ein Unternehmen mit 500.000 $ OCF und 80.000 $ Capex erzeugt **420.000 $ FCF**.

    ## Warum der FCF mehr zählt als das EBITDA

    Das EBITDA rechnet nicht zahlungswirksame Aufwendungen heraus, um Ergebnisse
    über verschiedene Kapitalstrukturen vergleichbar zu machen. Der FCF geht
    weiter: Er berücksichtigt die Reinvestitionen, die für den Fortbestand des
    Geschäfts nötig sind. Ein Unternehmen mit hohen Ausgaben für Anlagen kann ein
    starkes EBITDA und einen negativen FCF haben: Es behält tatsächlich kein Cash.

    Bei SaaS ist der Abstand zwischen EBITDA und FCF meist klein (kaum Capex). In
    Hardware, Industrie oder Infrastruktur kann der Capex 30–50 % des operativen
    Cashflows verschlingen, und der FCF weicht deutlich vom EBITDA ab.

    ## Richtwerte für die FCF-Marge

    | Unternehmenstyp | FCF-Marge |
    |---|---|
    | Spitzen-SaaS (Shopify, Veeva) | 20–30 % |
    | Typisches profitables SaaS | 10–20 % |
    | SaaS in Früh- oder Wachstumsphase | 0–10 % |
    | Capex-intensive Unternehmen | -10–+5 % |

    ## FCF-Rendite für die Bewertung

    FCF-Rendite = FCF / Marktkapitalisierung × 100

    Eine FCF-Rendite von 5 % heißt, du zahlst das 20-Fache des FCF. 2 % heißt das
    50-Fache. Faustregel: Über 4–5 % gilt als günstig, unter 1,5 % als teuer.
    Berücksichtige die Wachstumserwartungen: Schnell wachsende Unternehmen
    rechtfertigen niedrigere Renditen.

    ## FCF vs. Free Cashflow to Equity (FCFE)

    Der FCF ist die Cash-Erzeugung auf Unternehmensebene vor dem
    Schuldendienst. Der FCFE zieht die Schuldenzahlungen ab: FCFE = FCF −
    (Tilgung − neue Schulden). Für Eigenkapitalinvestoren, die ein verschuldetes
    Unternehmen bewerten, ist der FCFE aussagekräftiger.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet den Free Cashflow aus operativem Cashflow und Capex, dazu die
    FCF-Marge und optional die FCF-Rendite als Bewertungskontext.
"invoice-discount-calculator":
  "body": |
    ## Formel für Skonto bei früher Zahlung

    Für die Bedingung „2/10 netto 30“ (2 % Skonto bei Zahlung innerhalb von 10 Tagen, sonst fällig nach 30):

    $$\text{Annualisierte Kosten} = \frac{\text{Skonto \%}}{100 - \text{Skonto \%}} \times \frac{365}{\text{Netto-Tage} - \text{Skonto-Tage}}$$

    **Beispiel (2/10 netto 30):**

    $$\frac{2}{98} \times \frac{365}{20} = 37.2\%$$

    Auf ein Skonto von 2/10 netto 30 zu verzichten, entspricht einem Kredit zu 37,2 % effektivem Jahreszins: Fast immer lohnt es sich, das Skonto zu nutzen, wenn du das Cash hast.

    ### Wann du das Skonto nutzen solltest

    Nutze das Skonto, wenn die **annualisierten Kosten des Verzichts** über deinen **Kapitalkosten** liegen (Kosten einer Kreditlinie, Opportunitätskosten des Cash).

    | Dein Kreditzins | Annualisierte Skontokosten | Entscheidung |
    |--------------------|--------------------------|---------- |
    | 8 % | 37,2 % | Skonto nutzen |
    | 8 % | 6 % | Verzichten: Kredit ist günstiger als das verlorene Skonto |

    ### Dynamisches Skonto

    Manche Kreditorenplattformen bieten dynamisches Skonto an: variable Sätze je nach Tagen früherer Zahlung. Mit diesem Rechner bewertest du jedes Angebot, indem du die implizierten annualisierten Kosten berechnest.

    ### Ratgeber

    - [Was bedeutet die Zahlungsbedingung 2/10 netto 30?](/tools/invoice-discount-calculator/#what-is-2-10-net-30)
    - [Wann solltest du Skonto für frühe Zahlung nutzen?](/tools/invoice-discount-calculator/#when-to-take-early-payment-discount)
"operating-cash-flow-calculator":
  "body": |
    Der operative Cashflow (OCF) misst das Cash, das dein Unternehmen tatsächlich
    aus dem Kerngeschäft erwirtschaftet. Anders als der Jahresüberschuss lässt er
    sich kaum durch Bilanzierungsentscheidungen beeinflussen: Entweder ist das
    Geld auf dem Konto angekommen oder nicht.

    ## Die Formel der indirekten Methode

    **OCF = Jahresüberschuss + Abschreibungen + Veränderung des Working Capital**

    Das ist die gängigste Methode (indirekte Methode), weil sie vom leicht
    verfügbaren Jahresüberschuss ausgeht und nicht zahlungswirksame Posten sowie
    zeitliche Verschiebungen korrigiert.

    ## Warum der OCF vom Jahresüberschuss abweicht

    **Abschreibungen** mindern den ausgewiesenen Gewinn, kosten aber kein Cash.
    Ein Server für 10.000 $, über 5 Jahre abgeschrieben, senkt den
    Jahresüberschuss um 2.000 $ pro Jahr, wurde aber im ersten Jahr bezahlt. Wer
    die Abschreibungen wieder hinzurechnet, macht aus dem Buchgewinn einen
    Cash-Gewinn.

    **Veränderungen im Working Capital** spiegeln die zeitliche Lücke zwischen
    Umsatzerfassung und Zahlungseingang:
    - Forderungen **gestiegen** → du hast Kunden Rechnungen gestellt, aber noch nicht kassiert → der OCF liegt unter dem Jahresüberschuss
    - Verbindlichkeiten **gestiegen** → du hast Ware erhalten, aber noch nicht bezahlt → der OCF liegt über dem Jahresüberschuss

    ## Free Cashflow (FCF)

    **FCF = OCF − Investitionsausgaben**

    Der Free Cashflow ist das, was nach Erhalt und Ausbau der Vermögensbasis
    übrig bleibt. Private-Equity-Firmen und erfahrene Investoren bewerten
    Unternehmen damit, weil er das tatsächlich ausschüttbare Cash darstellt.

    | OCF | Capex | FCF | Einordnung |
    |---|---|---|---|
    | +100.000 $ | 5.000 $ | +95.000 $ | Gesund: Das Unternehmen erzeugt Cash |
    | +100.000 $ | 50.000 $ | +50.000 $ | Akzeptabel: hohe Investitionen in Anlagen |
    | +100.000 $ | 120.000 $ | −20.000 $ | Investitionsphase für Wachstum |
    | −50.000 $ | 10.000 $ | −60.000 $ | Cash-Abfluss: externe Finanzierung nötig |

    ## Cash Conversion Ratio

    **Cash Conversion Ratio = OCF ÷ Jahresüberschuss**

    Über 1× erzeugt das Unternehmen mehr Cash als Buchgewinn (gut). Unter 1×
    wächst der Gewinn schneller als die Zahlungseingänge: Behalte die Forderungen
    im Blick. Über 1,5× deutet oft auf hohe Abschreibungen im Verhältnis zum
    Capex hin.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet den operativen Cashflow aus Jahresüberschuss, Abschreibungen und Veränderung des Working Capital, dazu Free Cashflow und Cash Conversion Ratio.
"working-capital-calculator":
  "body": |
    Working Capital ist die Differenz zwischen Umlaufvermögen und kurzfristigen
    Verbindlichkeiten eines Unternehmens. Es misst die kurzfristige Liquidität:
    den operativen Puffer, der den Alltag ohne Cash-Krise am Laufen hält.

    ## Die Formel

    **Working Capital = Umlaufvermögen − kurzfristige Verbindlichkeiten**

    Bei 500.000 $ Umlaufvermögen und 200.000 $ kurzfristigen Verbindlichkeiten
    beträgt das Working Capital 300.000 $. Diese 300.000 $ sind der operative
    Cash-Puffer.

    ## Liquiditätsgrad (Current Ratio)

    **Current Ratio = Umlaufvermögen / kurzfristige Verbindlichkeiten**

    500.000 $ / 200.000 $ = 2,5x. Für jeden Dollar kurzfristiger Verpflichtungen
    stehen 2,50 $ an liquiden Mitteln bereit.

    ## Quick Ratio (Acid Test)

    **Quick Ratio = (Umlaufvermögen − Vorräte) / kurzfristige Verbindlichkeiten**

    Die Quick Ratio lässt die Vorräte weg, weil es dauert, Lagerbestand in Cash
    zu verwandeln. Sie ist ein vorsichtigeres Maß der sofortigen Liquidität.

    ## Richtwerte

    | Current Ratio | Einordnung |
    |---|---|
    | > 2,0x | Stark: reichlich kurzfristiger Puffer |
    | 1,5–2,0x | Gesund: komfortable Liquidität |
    | 1,0–1,5x | Knapp: wenig Spielraum für Fehler |
    | < 1,0x | Warnung: mögliches Liquiditätsrisiko |

    ## Negatives Working Capital

    Manche Unternehmen, vor allem SaaS- und Abo-Firmen, kommen mit negativem
    Working Capital aus. Zahlen Kunden jährlich im Voraus (das erzeugt passive
    Rechnungsabgrenzung, also eine kurzfristige Verbindlichkeit), ist das Working
    Capital negativ, obwohl das Unternehmen kerngesund ist.

    Amazon arbeitete jahrelang mit negativem Working Capital: Kunden zahlten
    sofort, Amazon bezahlte Lieferanten nach 30–45 Tagen. Die Differenz
    finanzierte den Betrieb.

    ## Working Capital und Cash Conversion Cycle

    Working Capital ist der statische Bestand, der [Cash Conversion Cycle](/tools/cash-conversion-cycle-calculator/)
    der dynamische Fluss. Ein Unternehmen kann positives Working Capital und
    trotzdem einen schlechten CCC haben, wenn Forderungen über 90 Tage brauchen.
    Verfolge beide Kennzahlen gemeinsam.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet Working Capital, Current Ratio, Quick Ratio und Working Capital
    in Tagen aus deinem Umlaufvermögen und deinen kurzfristigen
    Verbindlichkeiten.

"payment-fee-comparison":
  "body": |
    Den günstigsten Zahlungsanbieter zu finden ist einfach, sobald du die Zahlen
    nebeneinander siehst. Gib unten deinen typischen Verkaufsbetrag ein, und die
    Vergleichstabelle zeigt sofort die genauen Gebühren und Nettoauszahlungen für
    **Stripe**, **PayPal Standard**, **PayPal Checkout** und **Shopify Payments**
    in allen drei Plänen.

    ## So funktioniert der Gebührenvergleich

    Die Gebühren jedes Anbieters sind mit den veröffentlichten US-Sätzen hinterlegt:

    | Anbieter | Satz | Fixgebühr |
    |-----------|------|-----------|
    | Stripe | 2,9 % | + 0,30 $ |
    | PayPal Standard | 2,99 % | + 0,49 $ |
    | PayPal Checkout | 3,49 % | + 0,49 $ |
    | Shopify Basic | 2,0 % | + 0,25 $ |
    | Shopify (Shopify-Plan) | 1,7 % | + 0,25 $ |
    | Shopify Advanced | 1,5 % | + 0,25 $ |

    ## Wann Shopify Payments günstiger ist

    Shopify Payments schlägt Stripe bei inländischen US-Visa/Mastercard-Zahlungen
    ab etwa 12 $. Bei 100 $ spart Shopify Basic gegenüber Stripe 0,95 $ pro
    Transaktion. Bei 500 $ Monatsvolumen im Basic-Plan (39 $/Monat) ist die
    Rechnung etwa ausgeglichen, bei 50.000 $ pro Monat übersteigt die Ersparnis
    beim Satz die Plangebühr um ein Vielfaches.

    ## Wann du bei Stripe bleiben solltest

    Stripe gewinnt bei Abo-Abrechnung, SaaS-APIs, internationalen Zahlungen (über
    135 Währungen), ACH-Lastschrift, B2B-Rechnungen und Unternehmen, die nicht
    auf Shopify sind. Stripes Entwickler-Ökosystem ist unerreicht. Beziffere mit
    diesem Tool den Gebührenunterschied und wäge ihn gegen Wechselkosten und
    Funktionsbedarf ab.

    ## Häufige Fragen

    **Welcher Zahlungsanbieter hat die niedrigsten Gebühren?**
    Shopify Payments (Advanced-Plan) hat mit 1,5 % + 0,25 $ den niedrigsten Satz,
    setzt aber einen Shopify-Shop und ein Abo für 399 $/Monat voraus. Ohne
    Shopify schlägt Stripe (2,9 % + 0,30 $) PayPal Standard (2,99 % + 0,49 $) bei
    Transaktionen über 15 $.

    **Wie viel günstiger ist Shopify Payments als Stripe?**
    Bei einer Transaktion über 100 $: Shopify Basic kostet 2,25 $, Stripe 3,20 $,
    Shopify ist also 0,95 $ günstiger. Shopify Basic erfordert aber einen Plan
    für 39 $/Monat. Erst ab über 4.100 $ Monatsvolumen deckt die Ersparnis
    gegenüber Stripe die Plangebühr.

    **Ist PayPal teurer als Stripe?**
    Ja. PayPal Standard verlangt 2,99 % + 0,49 $, Stripe 2,9 % + 0,30 $. Bei
    100 $ nimmt PayPal Standard 3,48 $, Stripe 3,20 $: PayPal ist 0,28 $ teurer.
    PayPal Checkout (3,49 % + 0,49 $) ist deutlich teurer als beide.

    **Kann ich Stripe auf Shopify ohne Zusatzgebühren nutzen?**
    Ja, aber Shopify erhebt eine Drittanbieter-Transaktionsgebühr (je nach Plan
    0,5–2 %), wenn du einen anderen Anbieter als Shopify Payments nutzt. Bei
    10.000 $ pro Monat kommen so 50–200 $ Shopify-Aufschlag dazu. Mit Shopify
    Payments (auf Stripes Infrastruktur) entfällt diese Gebühr.
"paypal-fee-calculator":
  "body": |
    PayPal verlangt **3,49 % + 0,49 $** pro inländischer Online-Transaktion, etwas
    mehr als Stripes 2,9 % + 0,30 $. Bei internationalen Zahlungen steigen die
    Gebühren auf **4,99 % + 0,49 $**. Für Kleinstbeträge (unter 10 $) gibt es
    einen Sondertarif: **5 % + 0,05 $**, bei winzigen Beträgen günstiger, aber
    prozentual teuer.

    ## PayPal- und Stripe-Gebühren im Vergleich

    | Szenario | PayPal | Stripe |
    |---|---|---|
    | 10 $ inländisch | 0,84 $ (8,4 %) | 0,59 $ (5,9 %) |
    | 100 $ inländisch | 3,98 $ (4,0 %) | 3,20 $ (3,2 %) |
    | 1.000 $ inländisch | 35,39 $ (3,5 %) | 32,30 $ (3,2 %) |
    | 100 $ international | 5,48 $ (5,5 %) | 4,70 $ (4,7 %) |

    Bei den meisten Beträgen ist Stripe günstiger. PayPals Vorteil ist die
    Vertrautheit bei Kunden: Die Checkout-Conversion kann steigen, wenn PayPal
    als Option angeboten wird.

    ## Gebühren weitergeben
    Wenn du einen bestimmten Nettobetrag erhalten musst, rechnet der Rechner
    hoch: Um genau 100 $ über eine inländische PayPal-Zahlung zu erhalten, musst
    du **104,66 $** berechnen.

    ## PayPal „Freunde & Familie“
    Private Zahlungen („Freunde & Familie“) sind im Inland kostenlos, wenn sie
    per Bankkonto oder PayPal-Guthaben bezahlt werden. Sie für geschäftliche
    Zahlungen zu nutzen, verstößt aber gegen PayPals Nutzungsbedingungen. Du
    riskierst die Kontosperrung, ohne den Verkäuferschutz normaler
    Transaktionen.

    ## Häufige Fragen

    **Berechnet PayPal Gebühren für Rückerstattungen?**
    PayPal erstattet die Fixgebühr von 0,49 $, behält aber den prozentualen Teil
    (3,49 %). Stripe erstattet ebenfalls die Fixgebühr, behält aber auch den
    Prozentsatz.

    **Kann ich PayPal-Gebühren vermeiden?**
    Bei inländischen Überweisungen vom Bankkonto an private Kontakte: ja. Bei
    geschäftlichen Transaktionen senkt nur PayPals Händlertarif-Programm die
    Gebühren, und das erfordert einen Antrag und hohes Transaktionsvolumen. Im
    Allgemeinen ist Stripe für die meisten geschäftlichen Zwecke günstiger.
"shopify-fee-calculator":
  "body": |
    Shopify erhebt auf jeden Verkauf zwei Arten von Gebühren: eine
    **Zahlungsabwicklungsgebühr** (ähnlich Stripes Satz) und eine separate
    **Transaktionsgebühr**, wenn du statt Shopify Payments ein
    Drittanbieter-Gateway nutzt. Beide zu verstehen ist Pflicht für eine genaue
    Margenrechnung.

    ## Shopify-Gebühren nach Plan

    | Plan | Monatsgebühr | Abwicklungssatz | Transaktionsgebühr (Drittanbieter) |
    |---|---|---|---|
    | Basic | 39 $ | 2,9 % + 0,30 $ | 2,0 % |
    | Shopify | 105 $ | 2,6 % + 0,30 $ | 1,0 % |
    | Advanced | 399 $ | 2,4 % + 0,30 $ | 0,5 % |

    Die Transaktionsgebühr fällt *nur* an, wenn du einen anderen Anbieter als
    Shopify Payments nutzt (Stripe, PayPal usw.). Mit Shopify Payments entfällt
    sie komplett.

    ## Shopify Payments oder Drittanbieter-Gateway

    Für die meisten Händler ist Shopify Payments am günstigsten, weil die
    Transaktionsgebühr wegfällt. Ein Verkauf über 100 $ im Basic-Plan über Stripe
    kostet **2,90 $ + 0,30 $ + 2,00 $ = 5,20 $**, mit Shopify Payments nur
    **3,20 $**: 62 % Unterschied.

    Gründe, trotzdem ein Drittanbieter-Gateway zu nutzen:
    - Dein Land wird von Shopify Payments nicht unterstützt (verfügbar in über 17 Ländern)
    - Du brauchst Betrugsschutz, Abos oder Funktionen, die nur dein bisheriges Gateway bietet
    - Risikoreiche Produktkategorien, die Shopify Payments nicht zulässt

    ## Häufige Fragen

    **Fließt die monatliche Plangebühr in die Kosten pro Verkauf ein?**
    Der Rechner zeigt nur Gebühren pro Transaktion. Für die vollen Kosten pro
    Verkauf inklusive Plangebühr teilst du die Monatsgebühr durch die Zahl deiner
    monatlichen Transaktionen und addierst das Ergebnis. Bei 100 Verkäufen pro
    Monat im Basic-Plan macht die Plangebühr 0,39 $ pro Verkauf aus.

    **Lohnt sich ein Upgrade für niedrigere Gebühren?**
    Die Rechnung: Wenn der Wechsel von Basic zu Shopify (66 $ mehr pro Monat)
    0,3 % spart und 1 % Transaktionsgebühr (bei Drittanbieter-Gateway)
    wegfallen lässt, liegt die Gewinnschwelle bei 66 $ / 0,013 = 5.077 $ Umsatz
    pro Monat. Darüber zahlt sich das Upgrade aus.
"stripe-fee-calculator":
  "body": |
    Stripe ist der bevorzugte Zahlungsanbieter für die meisten SaaS-Produkte,
    Marktplätze und Indie-Unternehmen, doch die Gebührenstruktur stellt Gründern
    ständig Fallen. Der Standardsatz liegt bei **2,9 % + 0,30 $** pro
    erfolgreicher Kartenzahlung, aber das ist nur der Ausgangspunkt.

    Internationale Karten (außerhalb der USA ausgegeben) kosten zusätzlich
    **1,5 % Auslandsgebühr**, insgesamt also **4,4 % + 0,30 $**. Wenn du Stripe
    Connect (Stripes Plattform, die Zahlungen zwischen einem Marktplatz und seinen
    Verkäufern verteilt) nutzt, um Zahlungen für verbundene Konten abzuwickeln,
    werden Gebühren und Umsatzaufteilung komplexer. Dieser Rechner deckt alle
    gängigen Fälle ab.

    ## So funktioniert die Stripe-Gebührenberechnung
    1. Gib den Betrag ein, den du dem Kunden berechnen willst.
    2. Wähle, ob die Karte inländisch oder international ist.
    3. Entscheide, ob du die Gebühr selbst trägst oder an den Kunden weitergibst
       (Modus „berechnen, was nötig ist, um den Zielbetrag zu erhalten“).
    4. Der Rechner zeigt die genaue Gebühr, die Nettoauszahlung auf dein
       Bankkonto und im Weitergabe-Modus, was du berechnen musst, um deinen
       Zielbetrag zu erhalten.

    ## Warum „mehr berechnen, um genau das Nötige zu erhalten“ wichtig ist
    Wenn du genau 100 $ von einer inländischen US-Karte erhalten musst, reicht es
    nicht, 100 $ zu berechnen: Nach Stripes 2,9 % + 0,30 $ kämen 96,80 $ an. Für
    genau 100 $ musst du **103,09 $** berechnen (wenn der Kunde die Gebühr zahlt).
    Der Rechner erledigt dieses Hochrechnen automatisch.

    ## Häufige Fragen

    **Ändert sich Stripes Satz mit dem Volumen?**
    Ja. Stripe verhandelt individuelle Preise für Unternehmen mit mehr als etwa
    80.000 $ pro Monat. Für die meisten Indie-Gründer und jungen Unternehmen
    gilt der Standardsatz von 2,9 % + 0,30 $. Der Rechner nutzt den Standardsatz;
    passe das Prozentfeld an deinen verhandelten Satz an.

    **Was ist mit Stripes Zusatzgebühren (Streitfälle, Rückerstattungen, international)?**
    Rückerstattungen geben die prozentuale Gebühr zurück, nicht aber die fixen
    0,30 $. Streitfälle kosten 15 $ unabhängig vom Ausgang (bei Erfolg bekommst du
    sie zurück). Diese Sonderfälle sind nicht in der Berechnung pro Transaktion
    enthalten, sollten aber budgetiert werden.

    **Kann ich den Rechner für Stripe Connect nutzen?**
    Ja. Stripe Connect gibt dieselbe Grundgebühr je nach Konfiguration an die
    Plattform oder das verbundene Konto weiter. Gib den Gesamtbetrag und den
    geltenden kombinierten Satz im Feld für den individuellen Satz ein.

"freelance-project-estimate":
  "body": |
    Freelance-Projekte genau zu kalkulieren ist teils Mathematik, teils
    Risikomanagement. Kalkulierst du zu niedrig, arbeitest du unbezahlte Stunden.
    Kalkulierst du ohne Begründung zu hoch, verlierst du den Auftrag. Dieser
    Rechner startet mit dem, was du weißt (dein Satz, deine geschätzten Stunden
    und ein Risikopuffer), und liefert ein Angebot, das du direkt an den Kunden
    geben kannst.

    ## Die zweiteilige Formel

    **Basisschätzung** = Stundensatz × geschätzte Stunden
    **Gesamtangebot** = Basisschätzung × (1 + Puffer in %)

    Der Puffer ist kein Aufblähen und keine Unehrlichkeit, sondern ein
    Risikopolster für das Unvermeidliche: unklare Anforderungen, wachsender
    Umfang, Korrekturschleifen und Projektmanagement-Zeit, die du nicht
    ausdrücklich geschätzt hast.

    ## Welcher Puffer passt

    | Projektart | Empfohlener Puffer |
    |---|---|
    | Klare Vorgaben, vertraute Arbeit | 10–15 % |
    | Standardprojekt, einige Unbekannte | 20–25 % |
    | Neues Gebiet, unklare Anforderungen | 30–40 % |
    | F&E- / Discovery-Phasen | 50 %+ |

    Studien zu Softwareprojekten zeigen Überschreitungen der ursprünglichen
    Schätzung um 50–80 %. Ein Puffer von 20 % ist nicht aggressiv, sondern
    vorsichtig. Kunden, die den Puffer anzweifeln, sagen dir, dass sie
    Umfangsänderungen erwarten und nicht dafür zahlen wollen.

    ## Festpreis oder Aufwand

    Dieser Rechner erstellt ein **Festpreisangebot**. Alternativen:
    - **Nach Aufwand (Time & Material)**: Du rechnest tatsächliche Stunden zu deinem
      Satz ab. Weniger Risiko für dich, mehr gefühltes Risiko für den Kunden. Am
      besten für laufende oder offene Arbeit.
    - **Wertbasierte Preise**: Der Preis richtet sich nach dem Wert für den Kunden,
      nicht nach deinen Stunden. Schwerer zu positionieren, hebt aber die
      Obergrenze deines Verdiensts auf.

    ## Häufige Fragen

    **Aufschlüsselung zeigen oder nur die Summe?**
    Den meisten Kunden zeigst du nur die Summe. Stundensatz × Stunden aufzuführen
    lädt dazu ein, jede Komponente zu verhandeln, und lässt Kunden deinen Satz mit
    dem Markt vergleichen. Für die Kaufentscheidung reicht die Summe.

    **Wie gehe ich mit Anfragen außerhalb des Umfangs um?**
    Nimm eine Umfangsklausel in deinen Vertrag auf: Alles außerhalb der
    vereinbarten Leistungen wird separat angeboten. Verweise gelassen darauf, wenn
    der Umfang wächst („Gern, ich schicke dir kurz ein Angebot für die
    Zusatzarbeit“), statt es stillschweigend zu schlucken.
"freelance-rate-calculator":
  "body": |
    Einen Freelance-Satz ohne systematische Rechnung festzulegen, ist einer der
    häufigsten Gründe, warum Freelancer zu wenig verlangen. Die Zahl, die du
    brauchst, ist nicht dein altes Gehalt geteilt durch 2.080, sondern diese Zahl
    *plus* Steuern, *plus* Betriebsausgaben, *plus* ein Ausgleich dafür, dass du
    wahrscheinlich nicht jede gearbeitete Stunde abrechnen kannst.

    Dieser Rechner startet mit deinem **jährlichen Einkommensziel** und rechnet
    rückwärts den Mindeststundensatz aus, den du verlangen musst, um es zu
    erreichen, unter Berücksichtigung dreier Faktoren:

    **1. Nicht abrechenbare Zeit.** E-Mails beantworten, Angebote schreiben,
    Buchhaltung und Weiterbildung kosten Zeit, die du Kunden nicht berechnen
    kannst. Die meisten Freelancer rechnen 60–70 % ihrer Arbeitszeit ab.

    **2. Steuern.** Selbstständige zahlen Einkommensteuer *plus*
    Selbstständigen-Abgaben (in den USA Social Security + Medicare ≈ 15,3 %), weil
    Arbeitgeber normalerweise die Hälfte der Lohnabgaben für ihre Angestellten
    übernehmen. Als Freelancer zahlst du beide Hälften.

    **3. Betriebsausgaben.** Software-Abos, Ausstattung, Büro oder Coworking,
    Krankenversicherung, Weiterbildung und Steuerberatung schmälern den Umsatz,
    der dir nach Ausgaben bleibt.

    ## Häufige Fragen

    **Warum wirkt mein „echter Satz“ so viel höher als das, was Angestellte verdienen?**
    Weil er es ist. Ein Vollzeitangestellter mit 100.000 $ Gehalt kostet seinen
    Arbeitgeber insgesamt rund 130.000–145.000 $ (Zusatzleistungen, Lohnabgaben,
    Ausstattung, Büro). Als Freelancer trägst du all das selbst, dazu das Risiko
    nicht abrechenbarer Zeit und von Einkommenslücken zwischen Kunden.

    **Sollte ich jemals unter meinem Mindestsatz arbeiten?**
    Für einen strategischen Kunden, der Referenzen, Empfehlungen oder Zugang zu
    besser bezahlten Aufträgen bringt, ist ein befristeter Rabatt eine legitime
    Geschäftsentscheidung, solange du sie bewusst triffst und nicht, weil du die
    Steuern vergessen hast.

    **Wie erhöhe ich meinen Satz bei Bestandskunden?**
    Kündige es 60–90 Tage vorher an, begründe es mit dem Wert („mein Satz steigt
    auf X, weil ich jetzt Y liefere“) und bleib dabei. Die meisten Kunden, die zum
    neuen Satz bleiben, respektieren deine Zeit danach mehr.
"invoice-total-calculator":
  "body": |
    Rechnungssoftware ist ideal für Stammkunden. Wenn du aber schnell eine Summe
    für ein Angebot, eine Kostenaufstellung für eine Kunden-E-Mail oder eine
    Plausibilitätsprüfung vor dem Rechnungsversand brauchst, ist ein einfacher
    Rechner schneller, als dein Rechnungstool zu öffnen.

    Dieser Rechner verarbeitet bis zu vier Positionen, optional Rabatt und
    Steuer/MwSt., und erstellt eine kopierfertige Textzusammenfassung der
    gesamten Aufstellung.

    ## Wann du diesen Rechner nutzt

    - **Angebotsphase**: die Summe schnell durchrechnen, bevor du dich schriftlich auf einen Preis festlegst
    - **Zwischenstände mit Kunden**: laufende Summe der bisher erledigten Arbeit zeigen
    - **Mehrwährungs-Check**: die Rechnung prüfen, bevor du sie ins Rechnungstool überträgst
    - **Steuerprüfung**: MwSt.- oder Sales-Tax-Betrag vor dem Versand bestätigen

    ## Positionsstrategien für Freelancer

    **Wertorientierte Positionen**: Statt „40 Stunden Entwicklung“ schreibst du
    „Redesign und Entwicklung der Website“. So richtet sich der Blick des Kunden
    auf das Ergebnis statt auf die Zeit.

    **Abrechnung nach Meilensteinen**: Teile Projekte in zwei oder drei Rechnungen
    (z. B. 50 % vorab, 25 % zur Halbzeit, 25 % bei Abgabe). Das schützt dich vor
    Zahlungsausfällen und hilft Kunden bei ihrer Liquidität.

    **Auslagen**: Füge Positionen für Auslagen (Stockfotos, Schriften, Tools,
    Reisen) mit kurzer Beschreibung hinzu. Berechne sie zum Selbstkostenpreis,
    sofern dein Vertrag keinen Aufschlag vorsieht.

    ## Steuern und MwSt.

    Bei B2B-Leistungen innerhalb der EU gilt in der Regel das
    Reverse-Charge-Verfahren: Du berechnest Geschäftskunden in anderen
    EU-Mitgliedstaaten keine MwSt., musst aber „Steuerschuldnerschaft des
    Leistungsempfängers“ auf der Rechnung vermerken. Bei B2C-Leistungen in der EU
    musst du unter Umständen MwSt. zum Satz des Kundenlandes erheben. Klär deine
    Situation mit deiner Steuerberatung.

    Für US-Freelancer fällt in den meisten Bundesstaaten keine Sales Tax auf
    Dienstleistungen an (Ausnahmen: manche digitalen Leistungen). Prüf die Regeln
    deines Bundesstaats, bevor du Steuern berechnest.

    ## Häufige Fragen

    **Wie füge ich mehr als 4 Positionen hinzu?**
    Für längere Rechnungen nutzt du besser ein richtiges Rechnungstool (Bonsai,
    FreshBooks oder HoneyBook sind für Freelancer gemacht). Dieser Rechner ist für
    schnelle Schätzungen und einfache Rechnungen optimiert.

    **Stundensatz zeigen oder nur die Positionssumme?**
    Den meisten Kunden zeigst du nur die Summe pro Leistung. „40 Stunden × 125 $“
    lädt zum Verhandeln des Satzes ein, „Entwicklung: 5.000 $“ positioniert dich
    als jemand, der ein Ergebnis liefert.
"salary-to-hourly-calculator":
  "body": |
    Ob du als Freelancer deinen Satz mit Angestelltengehältern vergleichst, als
    Arbeitgeber eine Vertragsstelle bepreist oder einfach wissen willst, was dein
    Jahresgehalt pro Stunde bedeutet: Dieser Rechner erledigt die Umrechnung
    sofort und ohne Anmeldung.

    Für Bruttowerte ist die Rechnung einfach:
    **Stundensatz** = Jahresgehalt ÷ (Wochen pro Jahr × Stunden pro Woche)

    Standardmäßig gelten 52 Wochen pro Jahr und 40 Stunden pro Woche. Du kannst
    beide Werte anpassen, nützlich für:
    - Teilzeitkräfte (z. B. 20 Stunden pro Woche)
    - Mehr oder weniger als 52 bezahlte Wochen (z. B. bei unbezahltem Urlaub)
    - Angestellte, deren bezahlter Urlaub im Gehalt enthalten ist

    ## Stundensatz vor und nach Steuern

    Der Rechner schätzt einen Stundensatz nach Steuern für die üblichen
    US-Bundessteuerstufen (10 %, 12 %, 22 %, 24 %, 32 %, 35 %, 37 %). Hinweis: Das
    ist eine vereinfachte Schätzung ohne Steuern der Bundesstaaten, Abzüge oder
    Veranlagungsart. Nutze sie für grobe Vergleiche, nicht für die Steuerplanung.

    ## Häufige Fragen

    **Wie rechne ich einen Stundensatz in ein Jahresgehalt zurück?**
    Jährlich = Stundensatz × Stunden pro Woche × Wochen pro Jahr. Bei 40 h und 52
    Wochen: Stundensatz × 2.080 = jährlich.

    **Mein Vertrag nennt X $ pro Tag: Wie rechne ich das um?**
    Teile durch deine täglichen Stunden, um den Stundensatz zu erhalten, und
    multipliziere mit Wochenstunden und Wochen pro Jahr für den Jahreswert. Bei
    8-Stunden-Tagen: Tagessatz × 260 Arbeitstage = jährlich.

    **Warum verlangen Freelancer das 2- bis 3-Fache des vergleichbaren Angestellten-Stundensatzes?**
    Weil Arbeitgeberanteil an den Lohnabgaben, Zusatzleistungen, Ausstattung,
    Verwaltungsaufwand und das Risiko von Einkommenslücken beim Freelancer liegen
    statt beim Unternehmen. Die vollständige Aufschlüsselung findest du im
    Freelance-Stundensatz-Rechner.

"freelance-tax-estimator":
  "body": |
    Als Freelancer oder unabhängiger Auftragnehmer in den USA zahlst du sowohl den
    Arbeitnehmer- ALS AUCH den Arbeitgeberanteil zu Social Security und Medicare,
    zusammen **Self-Employment Tax (SE Tax)** genannt: 15,3 % des Nettogewinns.

    Anders als bei W-2-Angestellten behält niemand Steuern von deinen Zahlungen
    ein. Du musst vierteljährlich Vorauszahlungen leisten (15. April, 16. Juni,
    15. September, 15. Januar), um Säumniszuschläge des IRS zu vermeiden.

    ## So werden Freelance-Steuern berechnet

    **Schritt 1: Nettogewinn** = Bruttoeinnahmen − Betriebsausgaben

    **Schritt 2: SE Tax** = Nettogewinn × 15,3 %
    (Social Security 12,4 % bis 168.600 $ + Medicare 2,9 %, ohne Obergrenze)

    **Schritt 3: Abzug der SE Tax** = SE Tax × 50 %
    (Die Hälfte der SE Tax ist vom zu versteuernden Einkommen abziehbar)

    **Schritt 4: zu versteuerndes Einkommen** = Nettogewinn − SE-Abzug + sonstige Einkünfte

    **Schritt 5: Bundeseinkommensteuer** = Grenzsteuersätze 2024 auf das zu versteuernde Einkommen

    **Schritt 6: Quartalszahlung** = (SE Tax + Bundeseinkommensteuer) ÷ 4

    ## Wichtige Abzüge, die deine Steuerlast senken

    - **Betriebsausgaben**: Software, Ausstattung, Weiterbildung, Arbeitszimmer
    - **Beiträge zur Krankenversicherung**: voll abziehbar, wenn du deine Police selbst zahlst
    - **Altersvorsorge**: SEP-IRA (bis 25 % des Nettogewinns, max. 69.000 $),
      Solo 401(k) (bis 23.000 $ Arbeitnehmeranteil + 25 % Arbeitgeberanteil) oder Roth IRA (7.000 $)
    - **Hälfte der SE Tax**: wird automatisch berechnet und abgezogen

    ## Option S-Corp

    Ab etwa 80.000 $ Nettogewinn sparen manche Freelancer mit der Wahl des
    S-Corp-Status. Du zahlst dir ein „angemessenes Gehalt“ (SE-Tax-pflichtig) und
    entnimmst den Rest als Ausschüttung (nicht SE-Tax-pflichtig). Die Ersparnis
    kann über 5.000 $ pro Jahr liegen, erfordert aber eine Lohnabrechnung und eine
    zusätzliche Steuererklärung. Sprich vorher mit einem Steuerberater (CPA).

    ## Häufige Fragen

    **Wann muss ich vierteljährliche Vorauszahlungen leisten?**
    Wenn du für das Jahr mit 1.000 $ oder mehr Steuern rechnest, verlangt der IRS
    Vorauszahlungen. Fällig sind sie am 15. April, 15. Juni, 15. September und
    15. Januar. Versäumte oder zu niedrige Zahlungen kosten einen Zuschlag
    (derzeit ~8 % pro Jahr auf den fehlenden Betrag).

    **Welche Ausgaben kann ich als Freelancer absetzen?**
    Jede übliche und notwendige Betriebsausgabe: Arbeitszimmer (eigener Raum),
    Software und Abos fürs Geschäft, Weiterbildung, Ausstattung, Internet
    (geschäftlicher Anteil), Berufshaftpflicht, Buchhaltungs- und
    Rechtsberatungskosten sowie Geschäftsreisen.
"payroll-tax-calculator":
  "body": |
    Arbeitgeber-Lohnabgaben erhöhen die Kosten jedes Angestellten um etwa 8–12 %
    zusätzlich zum Grundgehalt. Bei 75.000 $ Gehalt sind das 6.000–9.000 $
    zusätzliche Pflichtabgaben pro Jahr.

    ## Arbeitgeber-Lohnabgaben in den USA (2024)

    | Abgabe | Satz | Bemessungsgrenze |
    |----|------|-----------|
    | Social Security (Arbeitgeber) | 6,2 % | Erste 160.200 $ |
    | Medicare (Arbeitgeber) | 1,45 % | Unbegrenzt |
    | FUTA (Bundes-Arbeitslosenversicherung) | 0,6 %* | Erste 7.000 $ |

    *Nach Anrechnung der bundesstaatlichen Arbeitslosenabgabe. Der eigentliche
    FUTA-Satz beträgt 6 % und wird um bis zu 5,4 % Anrechnung gesenkt.

    ## Bundesstaatliche Abgaben nicht enthalten

    Dieser Rechner umfasst nur Bundesabgaben. Die meisten Bundesstaaten erheben
    zusätzlich eine Arbeitslosenabgabe (SUTA) mit Sätzen von 0,1 % bis über 10 %,
    je nach Einstufung des Arbeitgebers.

    ## Gesamtkosten eines Angestellten

    Die Vollkosten eines Angestellten umfassen:
    - Grundgehalt
    - Arbeitgeber-Lohnabgaben (~8–10 %)
    - Zuschuss zur Krankenversicherung (5.000–15.000 $ pro Jahr)
    - 401(k)-Zuschuss (3–5 % des Gehalts)
    - Ausstattung, Software, Büro

    Für die Budgetplanung rechne mit dem **1,25- bis 1,40-Fachen des Grundgehalts**
    als Gesamtkosten.
"vat-calculator":
  "body": |
    Wenn du einem Kunden in einem Land mit Mehrwertsteuer (Großbritannien, EU,
    Australien usw.) eine Rechnung stellst, musst du wissen, ob dein Preis netto
    (ohne MwSt.) oder brutto (inkl. MwSt.) ist, und den anderen Wert berechnen.
    Verwechselst du das, berechnest du dem Kunden zu wenig oder trägst die Steuer
    versehentlich selbst.

    Dieser Rechner funktioniert in beide Richtungen:

    **Steuer aufschlagen:** Nettopreis × (1 + Satz) = Bruttopreis
    **Steuer herausrechnen:** Bruttopreis ÷ (1 + Satz) = Nettopreis

    Standardsätze sind für gängige Regionen vorbelegt (Großbritannien: 20 %,
    EU-Standard: 20 %/23 %, australische GST: 10 %, kanadische GST: 5 %, USA:
    individuell). Du kannst auch jeden eigenen Satz eingeben.

    ## Wichtige Begriffe

    **Nettopreis (ohne MwSt. / ohne Steuer):** der Preis vor Steuern. Das ist dein
    Umsatz. Die MwSt., die der Kunde zahlt, geht an den Staat, nicht an dich.

    **Bruttopreis (inkl. MwSt.):** der Gesamtbetrag, den der Kunde einschließlich
    Steuer zahlt.

    **Registrierungsschwelle für MwSt. / GST:** In Großbritannien musst du dich für
    die MwSt. registrieren, sobald dein steuerpflichtiger Umsatz in 12 Monaten
    90.000 £ übersteigt (Stand 2024). Darunter berechnest du keine MwSt. und
    führst keine ab. Die US-Sales-Tax hat keine bundesweite Schwelle und
    unterscheidet sich je Bundesstaat.

    ## Häufige Fragen

    **Muss ich auf digitale Produkte für Kunden im Ausland MwSt. berechnen?**
    Nach EU-Recht musst du bei B2C-Verkäufen digitaler Produkte an Kunden in der
    EU die MwSt. zum Satz des Käuferlandes berechnen (EU-Regeln für digitale
    Dienstleistungen). Plattformen wie Stripe Tax, Paddle und Lemon Squeezy
    übernehmen das als „Merchant of Record“ automatisch. B2B-Verkäufe in der EU
    laufen meist über das Reverse-Charge-Verfahren (der Kunde führt die MwSt.
    selbst ab).

    **Was ist der Unterschied zwischen MwSt. und Sales Tax?**
    Die MwSt. wird auf jeder Produktionsstufe erhoben, und Geschäftskunden können
    sie als Vorsteuer zurückholen. Die US-Sales-Tax wird nur beim Endverkauf
    erhoben und ist für Unternehmen nicht erstattungsfähig. Beide trägt der
    Endverbraucher; die Mechanik für Unternehmen ist verschieden.

"commission-calculator":
  "body": |
    ## Was ist eine Vertriebsprovision?

    Eine Vertriebsprovision ist eine variable Vergütung, die als Prozentsatz des erzielten Umsatzes gezahlt wird. Sie richtet die Anreize der Vertriebler an den Umsatzzielen des Unternehmens aus.

    $$\text{Provision} = \text{Umsatz} \times \text{Provisionssatz}$$

    ### OTE-Zielerreichung

    Die OTE (On-Target Earnings, Zielvergütung) ist die Gesamtvergütung eines Vertrieblers bei 100 % Quote:

    $$\text{Zielerreichung} = \frac{\text{Gesamtvergütung}}{\text{OTE}} \times 100$$

    ### Übliche Provisionsmodelle im B2B-SaaS

    | Rolle | Üblicher Provisionssatz | OTE-Aufteilung |
    |------|------------------------|-----------|
    | Account Executive | 8–12 % des [ARR](/glossary/#arr) | 50/50 fix/variabel |
    | SDR/BDR (Sales/Business Development Representative) | 4–8 % auf Pipeline | 70/30 fix/variabel |
    | Vertriebsleitung | 2–4 % auf das Team | 60/40 fix/variabel |
    | CSM (Customer Success Manager) / Account Manager | 5–10 % auf Expansion | 70/30 fix/variabel |

    ### Akzeleratoren

    Die meisten Pläne haben Akzeleratoren über 100 % OTE: Für Umsatz über der Quote steigt der Provisionssatz. Das belohnt Übererfüllung und hält die besten Vertriebler.

    ### Ratgeber

    - [Was ist OTE (On-Target Earnings)?](/tools/commission-calculator/#what-is-on-target-earnings)
    - [So strukturierst du einen Provisionsplan für den Vertrieb](/tools/commission-calculator/#how-to-structure-sales-commission-plan)
"employee-cost-calculator":
  "body": |
    Der häufigste Fehler bei der Personalplanung: das Grundgehalt als Kosten
    anzusetzen. Die echten Arbeitgeberkosten liegen für die meisten
    US-Wissensarbeiter bei **Grundgehalt × 1,25 bis 1,45**, getrieben durch
    Pflicht-Lohnabgaben und Zusatzleistungen.

    ## Woraus sich die Gesamtkosten zusammensetzen

    **1. Arbeitgeber-Lohnabgaben (~7,65 %)**
    - FICA: 6,2 % Social Security (auf die ersten 168.600 $) + 1,45 % Medicare (ohne Obergrenze)
    - FUTA: effektiv 0,6 % Bundes-Arbeitslosenabgabe (auf die ersten 7.000 $ Lohn)
    - SUTA: im Schnitt ~2,7 % bundesstaatliche Arbeitslosenabgabe (auf die ersten 7.000–56.500 $, je nach Bundesstaat)

    **2. Krankenversicherung**
    - Durchschnittliche Arbeitgeberkosten: 8.000–18.000 $ pro Jahr und Angestelltem (KFF-Daten 2024)
    - Familienversicherung: 14.000–22.000 $ pro Jahr
    - Einzelversicherung: 7.000–10.000 $ pro Jahr

    **3. Altersvorsorge (optional)**
    - 401(k)-Zuschuss: meist 3–6 % des Gehalts
    - Bei 100.000 $ Gehalt und 4 % Zuschuss: 4.000 $ pro Jahr

    **4. Bonus und Beteiligungen**
    - Zielbonus für Wissensarbeiter: 10–20 % des Fixgehalts
    - Aktienzuteilungen (RSUs, Restricted Stock Units): 5.000–50.000 $ pro Jahr je nach Level

    ## Die Faustregel 1,25x bis 1,4x

    Ein schnelles Denkmodell: Multipliziere jedes Gehalt mit **1,3**, um die
    Vollkosten zu schätzen (Abgaben + Krankenversicherung + 401k-Zuschuss, ohne
    Bonus). Für bonusberechtigte Rollen kommen 15–20 % hinzu.

    | Gehalt | Abgaben (~8 %) | Leistungen (~12 %) | Gesamt (1,2x) | + 10 % Bonus (1,3x) |
    |---|---|---|---|---|
    | 80.000 $ | 6.120 $ | 9.600 $ | 95.720 $ | 103.720 $ |
    | 120.000 $ | 9.180 $ | 14.400 $ | 143.580 $ | 155.580 $ |
    | 150.000 $ | 11.475 $ | 18.000 $ | 179.475 $ | 194.475 $ |

    ## Auftragnehmer oder Angestellte

    Vergleichst du eine W-2-Einstellung mit einem Auftragnehmer, denk daran, dass
    dessen Satz eigene Steuern und Leistungen enthält. Ein Auftragnehmer für
    75 $ pro Stunde ist nicht 1,3-mal teurer als ein Angestellter: Er zahlt seine
    15,3 % SE Tax und seine Leistungen selbst. Für einen echten Vergleich rechnest
    du erst die Beschäftigungsnebenkosten auf das Gehalt.

    ## Häufige Fragen

    **Welche Lohnabgaben zahlt der Arbeitgeber?**
    Arbeitgeber zahlen FICA (7,65 %: 6,2 % Social Security + 1,45 % Medicare),
    FUTA (effektiv 0,6 % auf die ersten 7.000 $ Lohn) und SUTA
    (bundesstaatliche Arbeitslosenabgabe, 0,6 % bis 8,5 % je nach Bundesstaat und
    Einstufung).

    **Was kostet die Krankenversicherung den Arbeitgeber?**
    Laut der Umfrage 2024 der Kaiser Family Foundation zahlen Arbeitgeber im
    Schnitt 8.435 $ pro Jahr für eine Einzel- und 17.393 $ pro Jahr für eine
    Familienversicherung. Nach den Lohnabgaben ist das die größte Variable im
    Kostenmultiplikator.
"employee-turnover-calculator":
  "body": |
    ## Formel der Fluktuationsrate

    $$\text{Fluktuationsrate} = \frac{\text{Abgänge}}{\text{Durchschnittliche Belegschaft}} \times 100$$

    $$\text{Durchschnittliche Belegschaft} = \frac{\text{Anfangsbestand} + \text{Endbestand}}{2}$$

    ### Branchenrichtwerte

    | Branche | Durchschnittliche jährliche Fluktuation |
    |----------|------------------------|
    | Tech / Software | 10–15 % |
    | Finanzen / Versicherung | 10–15 % |
    | Gesundheitswesen | 15–25 % |
    | Einzelhandel | 25–60 % |
    | Gastronomie & Hotellerie | 50–75 % |
    | Personaldienstleister | 100 %+ |

    ### Die echten Kosten der Fluktuation

    Die SHRM (Society for Human Resource Management) schätzt die Ersatzkosten je nach Rolle auf 33 % bis 200 % des Jahresgehalts:

    | Rolle | Ersatzkosten |
    |------|-----------------|
    | Einstieg / Stundenlohn | 33–50 % des Gehalts |
    | Fachkraft mittlerer Ebene | 50–100 % des Gehalts |
    | Senior / spezialisiert | 100–150 % des Gehalts |
    | Führung / C-Level | 150–200 %+ des Gehalts |

    Dazu zählen: Stellenanzeigen, Personalberater, Interviewzeit, Produktivitätsverlust während der Vakanz, Einarbeitung und Anlaufzeit der neuen Kraft.

    ### Ratgeber

    - [So berechnest du die Fluktuationsrate](/tools/employee-turnover-calculator/#how-to-calculate-employee-turnover-rate)
    - [Die echten Kosten der Mitarbeiterfluktuation](/tools/employee-turnover-calculator/#true-cost-of-employee-turnover)
"employee-turnover-cost-calculator":
  "body": |
    Mitarbeiterfluktuation gehört zu den am stärksten unterschätzten Kosten im
    Unternehmen. Studien der SHRM (Society for Human Resource Management) und von
    Gallup beziffern die echten Ersatzkosten übereinstimmend auf **6–9
    Monatsgehälter** bei typischen Rollen und bis zu **200 %** bei Senior- oder
    hochspezialisierten Positionen.

    ## Bestandteile der Fluktuationskosten

    | Bestandteil | Übliche Kosten |
    |-----------|-------------|
    | Austritt (HR-Verwaltung, Austrittsgespräch, Abfindung) | 3–5 % des Jahresgehalts |
    | Vakanz (verlorene Produktivität, solange die Stelle offen ist) | 50–150 % des Tageslohns × Tage |
    | Recruiting (Jobbörsen, Agenturhonorare, Interviewzeit) | 5–30 % des Jahresgehalts |
    | Einarbeitung und Schulung | 10–20 % des Jahresgehalts |
    | Anlaufzeit bis zur vollen Produktivität | 25–50 % des Jahresgehalts × Anlaufmonate |

    ## SHRM-Richtwerte

    - **Einstieg / Stundenlohn**: ~50 % des Jahresgehalts
    - **Technisch / Fachkraft**: 100–150 % des Jahresgehalts
    - **Senior / Führung**: 200–400 % des Jahresgehalts

    ## Fluktuationskosten senken

    Hebel mit großer Wirkung: strukturiertes Onboarding (halbiert die Anlaufzeit),
    Training für Führungskräfte (der wichtigste Grund für freiwillige Kündigungen),
    marktgerechte Vergütung und Bleibegespräche statt Austrittsgespräche.
"payroll-cost-calculator":
  "body": |
    Einen Mitarbeiter einzustellen kostet deutlich mehr als das angebotene Gehalt.
    Arbeitgeber zahlen Lohnabgaben, finanzieren Zusatzleistungen und tragen
    Gemeinkosten, die 20–40 % auf das Grundgehalt aufschlagen. Dieser Rechner
    beziffert die echten Gesamtkosten.

    ## Was Arbeitgeber an Lohnabgaben zahlen (USA)

    **FICA (Federal Insurance Contributions Act)**
    - Social Security: 6,2 % des Lohns (auf die ersten 168.600 $ im Jahr 2024)
    - Medicare: 1,45 % des gesamten Lohns (plus 0,9 % zusätzliche Medicare über 200.000 $)
    - FICA gesamt: 7,65 % des Lohns

    **FUTA (Bundes-Arbeitslosenabgabe)**
    - 6,0 % auf die ersten 7.000 $ Lohn, nach Anrechnung der bundesstaatlichen Abgabe 0,6 %
    - Effektiv: meist 42 $ pro Angestelltem und Jahr nach Anrechnung

    **SUTA (bundesstaatliche Arbeitslosenabgabe)**
    - Je nach Bundesstaat 0,2 % bis über 8 % auf eine eigene Bemessungsgrundlage (meist die ersten 10.000–40.000 $)
    - Der Standardsatz für neue Arbeitgeber liegt oft bei 2,7 %

    ## Was Zusatzleistungen Arbeitgeber typischerweise kosten

    | Leistung | Übliche Arbeitgeberkosten |
    |---|---|
    | Krankenversicherung (einzeln) | 7.000–15.000 $ pro Jahr |
    | Krankenversicherung (Familie) | 18.000–28.000 $ pro Jahr |
    | 401(k)-Zuschuss (3–5 % des Gehalts) | 3.600–6.000 $ bei 120.000 $ Gehalt |
    | Zahn + Sehen | 600–1.500 $ pro Jahr |
    | Lebensversicherung | 200–500 $ pro Jahr |
    | Bezahlter Urlaub (15 Tage) | ~5,8 % des Gehalts an Kosten |

    ## Die Faustregel 1,25–1,40×

    Eine oft zitierte Regel: Gesamtkosten des Arbeitgebers = 1,25–1,40× des
    Jahresgehalts für US-Vollzeitangestellte mit Standardleistungen. Bei 120.000 $
    Gehalt:
    - 1,25×: 150.000 $ Gesamtkosten pro Jahr
    - 1,35×: 162.000 $ Gesamtkosten pro Jahr

    Höher bei Senior-Angestellten mit umfassenden Leistungen, niedriger bei
    Auftragnehmern (keine Lohnabgaben bei korrekter Einstufung als 1099).

    ## Kostenvergleich Angestellter und Auftragnehmer

    Auftragnehmer (1099) kosten pro Stunde mehr, verursachen aber keine
    Lohnabgaben oder Leistungen. Bei 40 Stunden pro Woche liegt die Schwelle hier:
    - Angestellter mit 120.000 $ = ~58 $ effektive Kosten pro Stunde
    - Ein Auftragnehmer für 75–90 $ pro Stunde kann mehr kosten, erfordert aber keine langfristige Bindung

    Nutze diesen Rechner zusammen mit dem Freelance-Stundensatz-Rechner, um die
    Optionen zu vergleichen.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet die gesamten Arbeitgeberkosten inklusive Lohnabgaben (FICA, FUTA, SUTA) und Zusatzleistungen.

"irr-calculator":
  "body": |
    Der interne Zinsfuß (IRR) ist die annualisierte Rendite, bei der der
    Kapitalwert (NPV) aller Cashflows null ist. Er gehört zu den meistgenutzten
    Kennzahlen in Investitionsrechnung und Investmentanalyse.

    ## IRR-Formel

    Die IRR ist der Wert von r, der erfüllt:

    **0 = CF₀ + CF₁/(1+r) + CF₂/(1+r)² + ... + CFₙ/(1+r)ⁿ**

    Es gibt keine geschlossene Lösung: Die IRR wird iterativ bestimmt
    (Newton-Raphson-Verfahren).

    ## Entscheidungsregel

    - **IRR > WACC (Mindestrendite)**: Projekt annehmen, es schafft Wert
    - **IRR < WACC**: Projekt ablehnen, es vernichtet Wert
    - **IRR = WACC**: Gewinnschwelle, indifferent

    ## Grenzen der IRR

    - **Mehrere IRRs**: Cashflows, die mehr als einmal das Vorzeichen wechseln, können mehrere IRRs ergeben
    - **Größenblindheit**: Die IRR ignoriert die Projektgröße; 50 % IRR auf 1.000 $ sind weniger wert als 20 % auf 1 Mio. $
    - **Reinvestitionsannahme**: Sie unterstellt, dass Zwischen-Cashflows zur IRR reinvestiert werden, was unrealistisch sein kann

    Deshalb wird die IRR meist zusammen mit dem Kapitalwert genutzt, nicht allein.
"mirr-calculator":
  "body": |
    Die MIRR (modifizierter interner Zinsfuß) behebt eine zentrale Schwäche der
    normalen IRR: die Annahme, dass alle Mittelzuflüsse zur IRR selbst reinvestiert
    werden, was meist unrealistisch hoch ist.

    ## MIRR-Formel

    **MIRR = (Endwert der positiven Cashflows zum Reinvestitionssatz / Barwert der negativen Cashflows zum Finanzierungssatz) ^ (1/n) − 1**

    Dabei ist n = Anzahl der Perioden.

    ## MIRR und IRR im Vergleich

    | Aspekt | IRR | MIRR |
    |--------|-----|------|
    | Reinvestitionsannahme | Zur IRR (oft zu hoch) | Zu deinem gewählten Reinvestitionssatz |
    | Problem mehrerer IRRs | Mehrere Lösungen möglich | Immer genau eine Lösung |
    | Typisches Ergebnis | Höher | Niedriger, realistischer |
    | Einsatz | Schnelle Vorauswahl | Gründlichere Investitionsrechnung |

    ## Wann du die MIRR nutzt

    Nutze die MIRR, wenn:
    - die Cashflows zwischen positiv und negativ wechseln (Problem mehrerer IRRs)
    - der Reinvestitionssatz deutlich von der IRR abweicht
    - du Projekte mit unterschiedlicher Laufzeit vergleichen musst
    - Kreditgeber oder erfahrene Investoren sie verlangen

    Übliche MIRR-Schwellen: 15 %+ für Startup- und VC-Investments, 12–18 % für
    Private Equity, 8–12 % für Immobilien, 6–10 % für Infrastruktur.
"npv-calculator":
  "body": |
    Der Kapitalwert (NPV, Net Present Value) zeigt, ob eine Investition Wert schafft
    oder vernichtet, indem er den Barwert künftiger Cashflows mit den
    Anfangskosten vergleicht.

    ## Die Formel

    **Kapitalwert = −Anfangsinvestition + Σ [Cashflow_t / (1 + r)^t]**

    Dabei ist r der Diskontsatz und t die Periode in Jahren.

    Für eine Investition von 100.000 $ bei 10 % Diskontsatz mit jährlichen
    Cashflows von 30.000 $, 35.000 $, 40.000 $, 40.000 $ und 40.000 $:
    Kapitalwert = −100k + 30k/1,1 + 35k/1,21 + 40k/1,331 + 40k/1,464 + 40k/1,611
    Kapitalwert = −100k + 27,3k + 28,9k + 30,0k + 27,3k + 24,8k = **38.300 $**

    Ein positiver Kapitalwert bedeutet, dass die Investition Wert über der
    geforderten Rendite schafft.

    ## Entscheidungsregeln

    | Kapitalwert | Entscheidung |
    |---|---|
    | Positiv (> 0) | Annehmen: schafft Wert über der geforderten Rendite |
    | Null (= 0) | Gewinnschwelle: erzielt genau die geforderte Rendite |
    | Negativ (< 0) | Ablehnen: vernichtet bei diesem Diskontsatz Wert |

    ## Rentabilitätsindex (PI)

    PI = (Kapitalwert + Anfangsinvestition) / Anfangsinvestition

    Der PI misst den geschaffenen Wert pro investiertem Dollar. PI > 1 = positiver
    Kapitalwert. Nützlich, um konkurrierende Projekte bei knappem Kapital zu
    reihen: Ein höherer PI heißt mehr Wert pro eingesetztem Dollar.

    | PI | Einordnung |
    |---|---|
    | > 1,5 | Hervorragende Rendite |
    | 1,1–1,5 | Gute Rendite |
    | 1,0–1,1 | Knappe Rendite |
    | < 1,0 | Vernichtet Wert |

    ## Den richtigen Diskontsatz wählen

    Der Diskontsatz ist die kritischste Eingabe: Kleine Änderungen haben große
    Wirkung.

    **WACC des Unternehmens**: gewichteter Durchschnitt aus Fremdkapitalkosten
    (nach Steuern) und Eigenkapitalkosten. Übliche Spanne: 8–12 % für etablierte
    Unternehmen.

    **Venture / Startup**: Höhere Sätze (20–30 %) spiegeln höheres Risiko. Ein
    Startup kann 25 % Rendite verlangen, um Investoren für das Ausfallrisiko zu
    entschädigen.

    **Mindestrendite (Hurdle Rate)**: Viele Unternehmen legen eine minimal
    akzeptable IRR (15–20 %) fest, mit der Projekte um Kapital konkurrieren.

    Im Zweifel rechne den Kapitalwert mit mehreren Sätzen
    (Sensitivitätsanalyse).

    ## Kapitalwert oder IRR

    Die IRR (interner Zinsfuß) ist der Diskontsatz, bei dem der Kapitalwert null
    ist. Beide messen den Projektwert; der Kapitalwert wird meist bevorzugt, weil:
    - er in Dollar ausgedrückt ist (leichter zu deuten)
    - die IRR bei unkonventionellen Cashflows mehrere Werte liefern kann
    - der Kapitalwert über die Zeit wechselnde Diskontsätze korrekt abbildet

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet den Kapitalwert aus einer Anfangsinvestition und bis zu 5 Jahren
    Cashflows. Gib deinen Diskontsatz (Kapitalkosten) und die erwarteten
    jährlichen Cashflows ein.
"payback-period-calculator":
  "body": |
    Die Amortisationsdauer ist die Zeit, die eine Investition braucht, um genug
    Cashflow zur Deckung ihrer Anfangskosten zu erzeugen. Sie gehört zu den
    meistgenutzten Kennzahlen der Investitionsrechnung, weil sie direkt beantwortet:
    „Wann habe ich mein Geld zurück?“

    ## Formel der einfachen Amortisationsdauer

    **Amortisationsdauer (Jahre) = Anfangsinvestition / jährlicher Netto-Cashflow**

    Bei 200.000 $ Investition und 80.000 $ jährlichem Netto-Cashflow: 200k / 80k = **2,5 Jahre**.

    ## Dynamische Amortisationsdauer

    Die dynamische Amortisationsdauer berücksichtigt den Zeitwert des Geldes, indem
    sie den Cashflow jedes Jahres abzinst:

    **Barwert des Cashflows in Jahr N = jährlicher Cashflow / (1 + Diskontsatz) ^ N**

    Die dynamische Amortisationsdauer ist immer länger als die einfache. Bei 10 %
    Diskontsatz wird aus 2,5 Jahren einfacher Amortisation (200.000 $ Investition,
    80.000 $ pro Jahr) dynamisch etwa 3,1 Jahre.

    ## Richtwerte

    | Amortisationsdauer | Einordnung |
    |---|---|
    | < 6 Monate | Außergewöhnlich: selten, meist Software/SaaS |
    | 6–12 Monate | Hervorragend: schneller Kapitalrückfluss |
    | 1–2 Jahre | Gut: Standard für Marketinginvestitionen |
    | 2–4 Jahre | Akzeptabel: typisch für Anlagegüter |
    | > 4 Jahre | Lang: erfordert stabile, planbare Cashflows |

    ## Grenzen der Amortisationsdauer

    Die Amortisationsdauer ignoriert Cashflows nach der Gewinnschwelle. Eine
    Investition über 200.000 $ mit 2 Jahren Amortisation, die danach 8 Jahre lang
    100.000 $ pro Jahr bringt, ist einer mit genau 80.000 $ pro Jahr weit
    überlegen, obwohl beide dieselbe Amortisationsdauer zeigen.

    **Nutze die Amortisationsdauer zusammen mit ROI und Kapitalwert für eine
    vollständige Investitionsanalyse.**

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet einfache und dynamische Amortisationsdauer aus Anfangsinvestition
    und jährlichen Netto-Cashflows, dazu den ROI am Ende deines
    Analysezeitraums.
"roi-calculator":
  "body": |
    ROI (Return on Investment) ist das universellste Maß für die Effizienz einer
    Investition. Er drückt den Gewinn als Prozentsatz des dafür eingesetzten
    Kapitals aus.

    ## Die Formel

    **ROI = (Nettogewinn / Investitionskosten) × 100**

    Dabei gilt: Nettogewinn = Umsatz − Betriebskosten

    Bei 150.000 $ Umsatz, 50.000 $ Kosten und 100.000 $ Investition:
    - Nettogewinn = 100.000 $
    - ROI = (100.000 $ / 100.000 $) × 100 = **100 %**

    ## Annualisierter ROI

    **Annualisierter ROI = ((1 + ROI/100) ^ (1/Jahre) − 1) × 100**

    Der annualisierte ROI macht unterschiedliche Zeithorizonte vergleichbar. 50 %
    ROI über 2 Jahre entsprechen ~22,5 % pro Jahr, nicht 25 %. Der Zinseszins zählt.

    ## Was ist ein guter ROI?

    Es kommt auf den Kontext an:
    - **Marketing**: 5:1 (5 $ Umsatz pro ausgegebenem Dollar) = 400 % ROI, gilt als gut
    - **Immobilien**: 8–12 % annualisierter ROI, üblich
    - **S&P-500-Durchschnitt**: ~10 % pro Jahr, der Maßstab für passiv angelegtes Kapital
    - **SaaS-Investition**: Ziel über 30 % annualisiert innerhalb von 3 Jahren

    Jeder ROI unter deinen Kapitalkosten (meist 8–15 %) bedeutet, dass die
    Investition Wert vernichtet.

    ## ROI und andere Kennzahlen

    | Kennzahl | Misst | Wann nutzen |
    |---|---|---|
    | ROI | Gesamtrendite auf das Kapital | Effizienz von Investitionen vergleichen |
    | ROAS | Umsatz pro Werbedollar | Speziell fürs Marketing |
    | Amortisationsdauer | Monate bis zur Rückgewinnung der Investition | Liquiditätsplanung |
    | Kapitalwert | Barwert künftiger Erträge | Langfristige Kapitalallokation |

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet ROI, annualisierten ROI, Nettogewinn und Amortisationszeit aus
    Umsatz, Kosten und Anfangsinvestition.
"rule-of-72-calculator":
  "body": |
    Die 72er-Regel ist eine Kopfrechen-Abkürzung, um abzuschätzen, wie lange der
    Zinseszins braucht, um eine Anlage zu verdoppeln.

    ## Formel

    **Verdopplungszeit (Jahre) ≈ 72 ÷ Jahreszins (%)**

    **Nötiger Zins ≈ 72 ÷ Zieljahre**

    ## Warum 72?

    72 ist durch 1, 2, 3, 4, 6, 8, 9, 12 und 24 teilbar, das erleichtert das
    Kopfrechnen. Die exakte Formel lautet **ln(2) ÷ ln(1 + r)**, doch 72/r liegt
    bei Zinssätzen zwischen 2 und 20 % auf 1–2 % genau.

    ## Verdopplungszeit nach Zinssatz

    | Jahreszins | Verdopplungszeit |
    |------------|--------------|
    | 2 % | 36 Jahre |
    | 4 % | 18 Jahre |
    | 6 % | 12 Jahre |
    | 8 % | 9 Jahre |
    | 10 % | 7,2 Jahre |
    | 12 % | 6 Jahre |
    | 24 % | 3 Jahre |
    | 72 % | 1 Jahr |

    ## Die 72er-Regel und Inflation

    Auch für die Inflation gilt die Regel. Bei 3 % Inflation halbiert sich die
    Kaufkraft in 24 Jahren. Deshalb ist eine Rendite über der Inflation für den
    Erhalt realen Vermögens unverzichtbar.

    ## Anwendungen auf exponentielles Wachstum

    Die 72er-Regel funktioniert für jeden exponentiellen Prozess:
    - [ARR](/glossary/#arr)-Wachstumsrate eines SaaS → Jahre bis zur Umsatzverdopplung
    - Bevölkerungswachstum → Verdopplungszeit
    - Schulden zu einem bestimmten Zinssatz → Jahre, bis sich deine Schuld verdoppelt
"wacc-calculator":
  "body": |
    Der WACC (Weighted Average Cost of Capital, gewichtete Kapitalkosten) ist die
    Mindestrendite, die ein Unternehmen auf seine Vermögenswerte erzielen muss, um
    seine Kapitalgeber zufriedenzustellen, Eigen- wie Fremdkapitalgeber. Er dient
    als Mindestrendite für Investitionsentscheidungen und DCF-Bewertungen.

    ## WACC-Formel

    **WACC = (E/V) × Rₑ + (D/V) × Rᵈ × (1 − Tᶜ)**

    Dabei gilt:
    - **E** = Marktwert des Eigenkapitals (Marktkapitalisierung)
    - **D** = Marktwert des Fremdkapitals
    - **V** = E + D (Gesamtkapital)
    - **Rₑ** = Eigenkapitalkosten (%)
    - **Rᵈ** = Fremdkapitalkosten vor Steuern (%)
    - **Tᶜ** = Unternehmenssteuersatz (%)

    Die Eigenkapitalkosten werden meist mit dem CAPM geschätzt: risikofreier Zins +
    Beta × Marktrisikoprämie. Beta misst, wie volatil eine Aktie im Vergleich zum
    Gesamtmarkt ist: Ein Beta von 1,5 heißt, die Aktie schwankt meist 50 % stärker
    als der Markt in beide Richtungen, wofür Investoren eine höhere Rendite
    verlangen.

    ## Warum der Steuersatz zählt

    Fremdkapitalzinsen sind steuerlich abzugsfähig, das schafft ein
    „Steuerschild“. Die Fremdkapitalkosten nach Steuern betragen Rᵈ × (1 − Tᶜ). Bei
    6 % Fremdkapitalkosten und 25 % Steuersatz liegen die effektiven
    Fremdkapitalkosten bei 4,5 %.

    ## WACC-Richtwerte

    | Branche | Üblicher WACC |
    |----------|-------------|
    | SaaS / Software | 8–14 % |
    | Konsumgüter | 6–10 % |
    | Versorger | 4–8 % |
    | Biotech | 12–20 % |

    ## WACC in der Praxis

    - **DCF-Bewertungen**: Der WACC ist der Diskontsatz für künftige Free Cashflows
    - **Investitionsrechnung**: Nur Projekte mit IRR über dem WACC annehmen
    - **Kapitalstruktur**: den Mix aus Eigen- und Fremdkapital so optimieren, dass der WACC minimal wird
    - **Erfolgsmessung**: ROIC über WACC heißt, das Unternehmen schafft ökonomischen Wert

"dcf-calculator":
  "body": |
    Ein DCF-Modell (Discounted Cash Flow) bewertet ein Unternehmen oder eine
    Investition, indem es den Barwert aller erwarteten künftigen Cashflows
    aufsummiert. Es ist die grundlegende Bewertungsmethode der
    Unternehmensfinanzierung.

    ## Die DCF-Formel

    **Unternehmenswert = Σ (FCF_t / (1 + r)^t) + Endwert / (1 + r)^n**

    Dabei ist FCF_t = Free Cashflow in Jahr t, r = Diskontsatz (WACC), n = Prognosejahre.

    **Endwert (Gordon-Growth-Modell, das ewig konstant wachsende Cashflows unterstellt) = FCF_n × (1 + g) / (r − g)**

    Dabei ist g = langfristige Wachstumsrate (muss < r sein).

    ## Richtwerte für den Diskontsatz

    | Unternehmenstyp | Üblicher Diskontsatz |
    |-------------|----------------------|
    | Börsennotiert, Large Cap | 8–10 % |
    | Börsennotiert, Mid Cap | 10–14 % |
    | Privat, Wachstumsphase | 15–25 % |
    | Startup in der Frühphase | 25–40 % |
    | Seed / vor Umsatz | 40–60 % |

    ## Die Bedeutung des Endwerts

    In einem 10-Jahres-DCF macht der Endwert oft 70–90 % des gesamten
    Unternehmenswerts aus. Damit ist die Annahme zum langfristigen Wachstum die
    empfindlichste Variable: Kleine Änderungen von g bewirken große
    Wertänderungen. Führe immer eine Sensitivitätsanalyse durch.

    ## Grenzen des DCF

    Ein DCF ist nur so gut wie deine Cashflow-Prognosen. Am verlässlichsten ist er
    bei:
    - stabilen, reifen Unternehmen mit planbaren Cashflows
    - Unternehmen, die sich mit vertretbarer Sicherheit 5–10 Jahre vorausplanen lassen

    Am wenigsten verlässlich ist er bei Unternehmen ohne Umsatz, stark zyklischen
    Geschäften und Unternehmen, deren Wert vor allem immateriell ist.
"ebitda-multiple-calculator":
  "body": |
    ## Was ist das EBITDA-Multiple?

    Das EV/EBITDA-Multiple (kurz EBITDA-Multiple) ist die gängigste Bewertungskennzahl bei M&A und Private Equity. Es drückt den Unternehmenswert als Vielfaches des EBITDA aus (Ergebnis vor Zinsen, Steuern und Abschreibungen).

    $$\text{Unternehmenswert} = \text{EBITDA} \times \text{EV/EBITDA-Multiple}$$

    ### EBITDA-Multiples nach Branche (2024)

    | Branche | Übliches EV/EBITDA |
    |--------|-------------------|
    | SaaS / wachstumsstarke Tech | 15–30× |
    | B2B-Software (reif) | 8–15× |
    | Industrie | 5–8× |
    | Einzelhandel | 4–7× |
    | Dienstleistung / Beratung | 4–7× |
    | Großhandel | 5–8× |

    ### Unternehmenswert und Eigenkapitalwert

    Der Unternehmenswert schließt die Fremdkapitalgeber ein. Der Eigenkapitalwert ist das, was Aktionäre tatsächlich erhalten:

    $$\text{Eigenkapitalwert} = \text{EV} - \text{Gesamtschulden} + \text{Cash}$$

    ### EBITDA- und Umsatzmultiples

    Umsatzmultiples (EV/Umsatz) nutzt man, wenn das EBITDA negativ oder nahe null ist, was bei wachstumsstarkem SaaS häufig vorkommt. Vergleiche beide, um deine Bewertungsspanne einzugrenzen.

    ### Ratgeber

    - [Was ist EV/EBITDA?](/tools/ebitda-multiple-calculator/#what-is-ev-ebitda)
    - [EBITDA-Multiples nach Branche](/tools/ebitda-multiple-calculator/#ebitda-multiple-by-industry)
"enterprise-value-calculator":
  "body": |
    ## Formel des Unternehmenswerts

    $$\text{EV} = \text{Marktkapitalisierung} + \text{Gesamtschulden} - \text{Cash}$$

    Der Unternehmenswert ist der theoretische Übernahmepreis: was ein Käufer für das ganze Unternehmen zahlen würde, einschließlich der Übernahme seiner Schulden und seines Cash.

    ### Warum EV statt Marktkapitalisierung?

    Die Marktkapitalisierung zeigt nur den Eigenkapitalwert. Der EV berücksichtigt die Kapitalstruktur:

    - **Unternehmen A**: 1 Mrd. $ Marktkapitalisierung, 500 Mio. $ Schulden, 100 Mio. $ Cash → EV = 1,4 Mrd. $
    - **Unternehmen B**: 1 Mrd. $ Marktkapitalisierung, 0 $ Schulden, 100 Mio. $ Cash → EV = 900 Mio. $

    Unternehmen A ist in der Übernahme tatsächlich 56 % teurer, obwohl beide dieselbe Marktkapitalisierung haben. Der EV gleicht das aus.

    ### EV/EBITDA-Richtwerte

    | EV/EBITDA | Kontext |
    |-----------|---------|
    | < 5× | Value / notleidend |
    | 6–10× | Traditionelle Branchen |
    | 10–15× | Wachstum im Mittelstand |
    | 15–25× | Stark wachsende Unternehmen |
    | 25×+ | Premium-SaaS / Hyperwachstum |

    ### EV/Umsatz-Richtwerte

    | EV/Umsatz | Kontext |
    |------------|---------|
    | < 1× | Tiefer Value / rückläufig |
    | 1–3× | Traditionelle Unternehmen |
    | 3–10× | Wachstumsunternehmen |
    | 10×+ | Stark wachsendes SaaS |

    ### Ratgeber

    - [Was ist der Unternehmenswert?](/tools/enterprise-value-calculator/#what-is-enterprise-value)
    - [EV/EBITDA-Multiple: Bedeutung und Branchenrichtwerte](/tools/enterprise-value-calculator/#ev-ebitda-multiple-benchmarks)
"equity-dilution-calculator":
  "body": |
    Verwässerung entsteht jedes Mal, wenn ein Unternehmen neue Anteile ausgibt.
    Erhalten Investoren für ihr Investment neue Anteile, steigt die Gesamtzahl der
    Anteile, und jeder bisherige Gesellschafter hält einen kleineren Prozentsatz,
    obwohl sich seine Anteilszahl nicht ändert.

    ## Die Rechnung

    **Pre-Money-Bewertung**: 5.000.000 $
    **Investment**: 1.000.000 $
    **Post-Money-Bewertung**: 6.000.000 $
    **Anteil des Investors**: 1 Mio. $ / 6 Mio. $ = **16,7 %**

    Hieltest du vor der Runde 60 % (6 Mio. von 10 Mio. Anteilen), hältst du jetzt:
    6 Mio. / (10 Mio. + 2 Mio. neue Anteile) = **50 %**

    Dein Anteil fiel von 60 % auf 50 %: eine **Verwässerung um 10 Prozentpunkte**.

    ## Pre-Money- und Post-Money-Bewertung

    Diese Begriffe sorgen in Finanzierungsverhandlungen für viel Verwirrung:

    **Pre-Money**: der Unternehmenswert vor dem Investment.
    **Post-Money**: Pre-Money + Investmentbetrag.

    Sagt ein Investor „Ich investiere 1 Mio. $ bei 5 Mio. $ Bewertung“, kläre: 5 Mio. $
    pre-money oder post-money? Der Unterschied ist erheblich:
    - 5 Mio. $ pre-money: Der Investor erhält 1 Mio. / 6 Mio. = **16,7 %**
    - 5 Mio. $ post-money: Der Investor erhält 1 Mio. / 5 Mio. = **20 %**

    Gib im Term Sheet immer die Pre-Money-Bewertung an.

    ## Kumulierte Verwässerung über die Runden

    Verwässerung summiert sich. Übliche Verwässerung je Phase:

    | Runde | Verwässerung | Kumulierter Gründeranteil |
    |---|---|---|
    | Pre-Seed (500.000 $) | 10–15 % | 85–90 % |
    | Seed (1–2 Mio. $) | 15–25 % | 65–75 % |
    | Series A (5–10 Mio. $) | 20–30 % | 45–55 % |
    | Series B (20–40 Mio. $) | 15–25 % | 35–45 % |

    Die Verwässerung jeder Runde bezieht sich auf die [Cap Table](/glossary/#cap-table)
    nach der Runde, nicht auf die ursprüngliche. Ein Gründer mit 85 % nach der
    Seed-Runde, der eine Series A mit 20 % Verwässerung aufnimmt, behält
    85 % × 80 % = **68 %**.

    ## Der „Option Pool Shuffle“

    Investoren verlangen oft, vor Abschluss der Runde einen Optionspool zu schaffen
    oder zu vergrößern, was die Gründer zusätzlich verwässert. Ein „Optionspool
    von 20 % post-money“ bei einer 6-Mio.-$-Runde heißt, Anteile in Höhe von 20 %
    der Cap Table nach der Runde zu schaffen. Das verwässert die Gründer vor den
    Investoren und erhöht die effektive Pre-Money-Verwässerung.

    Bilde das ab, indem du die Anteile des Pools vor der Berechnung zu den
    „aktuell ausgegebenen Anteilen“ addierst.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er modelliert die Verwässerung von Gründern und Investoren in einer
    Finanzierungsrunde: Post-Money-Bewertung, neu ausgegebene Anteile und dein
    Anteil nach der Runde.
"pe-ratio-calculator":
  "body": |
    ## KGV-Formel

    $$\text{KGV} = \frac{\text{Aktienkurs}}{\text{Gewinn je Aktie}}$$

    ### Historisches und erwartetes KGV

    - **Historisches KGV**: nutzt die tatsächlichen Gewinne der letzten 12 Monate. Verlässlicher, aber rückwärtsgewandt.
    - **Erwartetes KGV**: nutzt Analystenschätzungen für die nächsten 12 Monate. Relevanter für wachsende Unternehmen, weil es zeigt, was der Markt für die Zukunft einpreist.

    Liegt das erwartete KGV unter dem historischen, erwartet der Markt steigende Gewinne. Liegt es darüber, sinkende.

    ### Gewinnrendite

    $$\text{Gewinnrendite} = \frac{1}{\text{KGV}} \times 100$$

    Die Gewinnrendite ist der Kehrwert des KGV: Sie macht aus einer Bewertung eine Renditekennzahl, vergleichbar mit Anleiherenditen. Ein KGV von 20× = 5 % Gewinnrendite. Vergleiche sie mit der Rendite 10-jähriger Staatsanleihen, um die relative Attraktivität einzuschätzen.

    ### PEG-Ratio (KGV im Verhältnis zum Wachstum)

    $$\text{PEG} = \frac{\text{KGV}}{\text{Erwartetes Gewinnwachstum je Aktie (\%)}}$$

    Peter Lynch machte das PEG als wachstumsbereinigte Bewertungskennzahl bekannt. PEG = 1 heißt, das KGV entspricht der Wachstumsrate: „fair bewertet“. PEG < 1 deutet auf mögliche Unterbewertung hin, PEG > 2 darauf, dass der Kurs sehr hohe Wachstumserwartungen einpreist.

    ### Historisches KGV des S&P 500

    - Langfristiger Durchschnitt: ~15–17×
    - Durchschnitt seit 2010 (Niedrigzinsära): ~20–25×
    - In Rezessionen: oft 10–12×
    - Blasenhochs: 30–40×+

    ### Ratgeber

    - [Was ist das KGV und wie nutzt man es?](/tools/pe-ratio-calculator/#what-is-pe-ratio)
    - [PEG oder KGV: Was eignet sich besser zur Bewertung?](/tools/pe-ratio-calculator/#peg-ratio-vs-pe-ratio)
"price-to-sales-calculator":
  "body": |
    Das Kurs-Umsatz-Verhältnis (KUV, engl. P/S) gehört zu den meistgenutzten
    Bewertungskennzahlen für wachstumsstarke Software- und SaaS-Unternehmen, deren
    Gewinne noch kein verlässlicher Wertmaßstab sind.

    **KUV** = Marktkapitalisierung ÷ Jahresumsatz

    Oder gleichwertig: **EV/Umsatz** = Unternehmenswert ÷ Jahresumsatz

    Bei privaten Unternehmen ist der Zähler die Post-Money-Bewertung der letzten
    Finanzierungsrunde.

    ## KUV-Richtwerte nach Phase (2024)

    | Unternehmensphase | Übliche KUV-Spanne | Hinweise |
    |---|---|---|
    | SaaS in der Frühphase (50 %+ Wachstum) | 8–20x ARR | Seed bis Series A |
    | SaaS in der Wachstumsphase (30–50 %) | 5–12x ARR | Series B bis C |
    | SaaS in der Spätphase (20–30 %) | 3–8x ARR | Vor dem IPO |
    | Börsennotiertes SaaS (10–20 %) | 2–6x Umsatz | Median ~4x im Jahr 2024 |
    | Rückläufige / reife Software | 0,5–2x Umsatz | Spanne für PE-Buyouts |

    Nach der Multiple-Kompression 2021–2022 fielen die KUVs börsennotierter
    SaaS-Unternehmen mit steigenden Zinsen von 20–30x auf 4–8x. Der aktuelle Median
    (2024) liegt bei etwa dem 4- bis 6-Fachen des erwarteten Umsatzes.

    ## Der Zusammenhang mit der Rule of 40

    Hohe KUVs sind gerechtfertigt, wenn der [Rule-of-40](/glossary/#rule-of-40)-Wert
    stark ist. Ein Unternehmen mit 50 % Wachstum und −5 % FCF-Marge (Rule of 40 =
    45 %) wird höher bewertet als eines mit 20 % Wachstum und −15 % Marge (Rule of
    40 = 5 %).

    **Wachstumsbereinigtes KUV** = KUV ÷ Wachstumsrate

    Ein KUV von 10x bei 50 % Wachstum ergibt ein bereinigtes KUV von 0,2x, oft als
    fair angesehen. Über 0,3x kann es ambitioniert sein, unter 0,15x ein
    Schnäppchen.

    ## EV/Umsatz oder KUV

    Bei Unternehmen mit Schulden oder viel Cash ist Unternehmenswert / Umsatz
    genauer als das KUV:

    **EV** = Marktkapitalisierung + Gesamtschulden − Zahlungsmittel

    Die meisten jungen Startups haben kaum Schulden und schrumpfendes Cash, also
    gilt EV ≈ Marktkapitalisierung. Bei Unternehmen mit viel Cash oder Venture
    Debt macht die Bereinigung einen Unterschied.

    ## Häufige Fragen

    **Welches KUV sollte ich für meine Startup-Bewertung ansetzen?**
    In der Series A sind 8–15x ARR für SaaS mit über 80 % Wachstum üblich. In der
    Series B 10–20x ARR für Unternehmen mit starker NRR (120 %+) und über 50 %
    Wachstum. Mit nachlassendem Wachstum sinken diese Werte deutlich: Wer 30 %
    wächst, bekommt meist 4–8x.

    **Wie nutze ich das KUV für den Wettbewerbsvergleich?**
    Suche 5–10 börsennotierte Vergleichsunternehmen mit ähnlichem Wachstum und
    Geschäftsmodell. Nimm den Median ihres KUV und wende ihn auf deinen ARR an, um
    eine grobe Bewertungsspanne zu erhalten. Ziehe 20–30 % Illiquiditätsabschlag
    für private Unternehmen ab. Das ist die am häufigsten genutzte Methode von
    VC-Investoren für Bewertungen ab der Series B.
"tam-sam-som-calculator":
  "body": |
    TAM, SAM und SOM beschreiben deine Marktchance auf drei Genauigkeitsstufen.
    Jedes Investoren-Deck braucht diese Zahlen, und wie du sie definierst, zeigt,
    ob du deinen Markt verstehst.

    ## Die drei Stufen

    **TAM (Total Addressable Market)**: die gesamte weltweite Umsatzchance, wenn
    du 100 % des Marktes erobern würdest. Eine Obergrenze, kein realistisches Ziel.

    **SAM (Serviceable Addressable Market)**: der Teil des TAM, den du mit den
    aktuellen Produktfähigkeiten, deiner geografischen Reichweite und deinem
    Go-to-Market tatsächlich bedienen kannst.

    **SOM (Serviceable Obtainable Market)**: der Teil des SAM, den du in 3–5 Jahren
    angesichts des Wettbewerbs und deiner Vertriebskapazität realistisch gewinnen
    kannst.

    ## Top-down oder Bottom-up

    **Top-down**: Branchenberichte schätzen die Gesamtmarktgröße, und du bestimmst
    deinen Anteil. Schnell, aber ungenau. „Der CRM-Markt ist 50 Mrd. $ groß, wir
    zielen auf 1 %.“

    **Bottom-up**: echte Kunden zählen und mit dem [ACV](/glossary/#acv)
    multiplizieren. Glaubwürdiger. „In den USA gibt es 500.000 mittelständische
    Unternehmen, 30 % haben dieses Problem, 15 % davon erreichen wir mit unserem
    aktuellen Go-to-Market (GTM), bei 15.000 $ ACV = 337 Mio. $ SAM.“

    Investoren bevorzugen Bottom-up, weil es zeigt, dass du den tatsächlichen
    Kundenpool verstehst.

    ## Erwartungen der Investoren nach Phase

    | Phase | Mindest-TAM | Hinweise |
    |---|---|---|
    | Seed | 500 Mio. $ | VCs brauchen Luft für einen Exit über 50 Mio. $ |
    | Series A | 1 Mrd. $+ | Die Fondsrechnung verlangt großes Marktpotenzial |
    | Series B+ | 5 Mrd. $+ | Um Wachstum im großen Maßstab und eine IPO-Story zu rechtfertigen |

    Ein TAM unter 500 Mio. $ ist kein automatisches Ausschlusskriterium:
    Dienstleister und vertikales SaaS können in kleineren Märkten hochprofitable
    Unternehmen mit 50–100 Mio. $ Umsatz aufbauen. VC-finanziertes Hyperwachstum
    braucht aber riesige Märkte.

    ## Häufige Fehler bei der Marktgröße

    **TAM überzählen**: „Der weltweite Markt für Unternehmenssoftware ist 500 Mrd. $
    groß, wir machen Software, also ist unser TAM 500 Mrd. $.“ Falsch. Der TAM muss
    der Markt deiner konkreten Produktkategorie sein.

    **TAM und SAM verwechseln**: „Unser SAM ist der gesamte US-Markt.“ Der SAM
    sollte auf die filtern, an die du heute verkaufen kannst, dein
    [ICP](/glossary/#icp), nicht das ganze Land.

    **Unrealistischer SOM**: „Wir gewinnen in Jahr 3 10 % des Marktes.“ Ohne die
    Go-to-Market-Rechnung (Personal, Kanäle, CAC) ist das unglaubwürdig.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet TAM (Kunden gesamt × Ausgaben), SAM (gefiltert nach deiner
    Reichweite) und SOM (dein erreichbarer Anteil) für die Marktgröße in
    Investoren-Decks.

"ad-roas-calculator":
  "body": |
    ROAS (Return on Ad Spend) ist das direkteste Maß für die Rentabilität einer
    Werbekampagne. Er beantwortet: Wie viel Umsatz hast du pro ausgegebenem
    Werbedollar erzielt?

    **ROAS = Umsatz aus Anzeigen ÷ Werbeausgaben**

    Ein ROAS von 4× heißt: 4 $ Umsatz pro ausgegebenem Dollar. Ob diese 4×
    profitabel sind, hängt aber ganz von deiner Bruttomarge ab.

    ## Warum der ROAS allein nicht zeigt, ob Werbung profitabel ist

    Ein ROAS von 4× bei einem Produkt mit 30 % Marge heißt: 1 $ ausgegeben für 4 $
    Umsatz, aber nur 1,20 $ Rohertrag. Pro ausgegebenem Dollar bleiben also nur
    0,20 $, vor Gemeinkosten. Derselbe ROAS von 4× bei einem SaaS mit 80 % Marge
    bringt 3,20 $ Rohertrag pro ausgegebenem Dollar.

    **Break-even-ROAS = 1 ÷ Bruttomarge in %**

    | Bruttomarge | Break-even-ROAS |
    |---|---|
    | 20 % | 5,0× |
    | 30 % | 3,33× |
    | 40 % | 2,5× |
    | 50 % | 2,0× |
    | 70 % | 1,43× |
    | 80 % | 1,25× |

    ## Ziel-ROAS für eine bestimmte Gewinnmarge

    Für eine Gewinnmarge von 20 % (Gewinn / Umsatz) nutzt du diese Formel:

    **Ziel-ROAS = 1 ÷ (Bruttomarge in % − Ziel-Gewinnmarge in %)**

    Beispiel: 50 % Bruttomarge, 20 % Ziel-Gewinnmarge → 1 ÷ 0,30 = **Ziel-ROAS 3,33×**

    ## ROAS oder ROI: Was ist der Unterschied?

    Der ROAS ist ein Umsatzmultiple, der ROI ein Gewinnmultiple.

    **ROI = (Umsatz − Herstellkosten − Werbeausgaben) ÷ Werbeausgaben × 100**

    4× ROAS bei 50 % Marge = 2 $ Rohertrag pro ausgegebenem Dollar = 100 % ROI.
    2× ROAS bei 50 % Marge = 1 $ Rohertrag pro ausgegebenem Dollar = 0 % ROI (Gewinnschwelle).

    Der ROAS lässt sich leichter in Echtzeit berechnen (keine Herstellkosten pro
    Kanal nötig). Nutze ihn für Kanalvergleiche und Gebotsstrategie, den ROI für
    die abschließende Rentabilitätsbewertung.

    ## Richtwerte nach Werbekanal

    | Kanal | Üblicher ROAS | Hinweise |
    |---|---|---|
    | Google Search (Marke) | 5–20× | Hohe Kaufabsicht, geringe Wettbewerbskosten |
    | Google Shopping | 3–8× | Je nach Produktmarge |
    | Meta / Facebook | 2–5× | Hängt stark von Creative und Zielgruppe ab |
    | TikTok Ads | 1,5–4× | Wachsender Kanal, noch niedrige CPMs |
    | Programmatic Display | 1–3× | Geringere Kaufabsicht; gut fürs Retargeting |

    ## Häufige Fragen

    **Was ist ein guter ROAS?**
    Das hängt ganz von deiner Bruttomarge ab. 4× ROAS sind großartig für ein SaaS
    mit 60 % Marge, aber verheerend für Dropshipping mit 15 % Marge. Berechne
    zuerst deinen Break-even-ROAS: Alles darüber ist profitabel.

    **Wie verbessere ich den ROAS?**
    Drei Hebel: (1) bessere Creatives und Texte für höhere Klickrate und
    Conversion, (2) präziseres Targeting, um Käufer mit hoher Kaufabsicht zu
    erreichen, (3) auf Keywords mit höherer Kaufabsicht bieten und schwach
    konvertierende Platzierungen ausschließen. Auch höhere Preise verbessern den
    ROAS, ohne die Werbeeffizienz zu ändern.

    **Welchen ROAS sollte ich bei Google Ads anpeilen?**
    Google empfiehlt, den Ziel-ROAS zunächst auf das 3- bis 5-Fache deiner
    Gewinnschwelle zu setzen und dann Smart Bidding optimieren zu lassen. Bei neuen
    Kampagnen ohne Conversion-Daten startest du mit manuellem CPC und sammelst 30–50
    Conversions, bevor du auf Ziel-ROAS-Gebote umstellst.
"aov-calculator":
  "body": |
    ## Was ist der durchschnittliche Bestellwert (AOV)?

    Der durchschnittliche Bestellwert ist der mittlere Umsatz pro Transaktion in einem Zeitraum.

    $$\text{Bestellwert} = \frac{\text{Gesamtumsatz}}{\text{Anzahl der Bestellungen}}$$

    ### Warum der Bestellwert der renditestärkste Wachstumshebel ist

    Ein höherer Bestellwert steigert den Umsatz, ohne Kundenakquisitionskosten (CAC) oder Traffic zu erhöhen. 10 % mehr Bestellwert bringen 10 % mehr Umsatz in jeder bestehenden Kundeninteraktion.

    ### Bestellwert-Richtwerte nach Branche

    | Branche | Üblicher Bestellwert |
    |--------|------------|
    | Luxus / Mode | 150–400 $ |
    | Allgemeiner E-Commerce | 50–150 $ |
    | Lebensmittel / Konsumgüter | 40–80 $ |
    | SaaS (pro Transaktion) | 200–500 $ |
    | Digitale Produkte | 15–50 $ |

    ### Umsatz pro Besucher

    $$\text{Umsatz pro Besucher} = \frac{\text{Gesamtumsatz}}{\text{Monatliche Besucher}}$$

    Der Umsatz pro Besucher vereint Conversion-Rate und Bestellwert in einer Kennzahl. Verbesserst du eines davon, steigt er.

    ### Taktiken für einen höheren Bestellwert

    - **Upselling**: im Checkout eine höherwertige Variante anbieten
    - **Cross-Selling**: Empfehlungen „wird oft zusammen gekauft“
    - **Schwellen für Gratisversand**: „Noch 15 $ bis zum Gratisversand“ hebt Bestellungen über eine Untergrenze
    - **Bundles**: Produkte mit leichtem Rabatt bündeln, Kunden geben mehr aus und empfinden Mehrwert
    - **Mengenrabatte**: niedrigerer Stückpreis bei größeren Mengen

    ### Ratgeber

    - [Was ist der durchschnittliche Bestellwert (AOV)?](/tools/aov-calculator/#what-is-average-order-value)
    - [So erhöhst du den durchschnittlichen Bestellwert](/tools/aov-calculator/#how-to-increase-average-order-value)
"conversion-rate-calculator":
  "body": |
    Die Conversion-Rate ist der Anteil der Besucher, die eine gewünschte Aktion
    abschließen: Anmeldung, Kauf, Teststart oder Formularabsendung. Sie gehört zu
    den Kennzahlen mit dem größten Hebel in jedem Wachstumsfunnel, weil ihre
    Verbesserung den Umsatz steigert, ohne mehr Traffic zu brauchen.

    **Conversion-Rate = (Conversions ÷ Besucher) × 100**

    ## Die Formel für die Umsatzwirkung

    **Monatsumsatz = Besucher × Conversion-Rate × Umsatz pro Conversion**

    Bei 10.000 Besuchern, 1,5 % Conversion und 99 $ ARPU: 10.000 × 0,015 × 99 $ = **14.850 $ pro Monat**

    Steigt die Conversion bei gleichem Traffic von 1,5 % auf 2,5 % (relativ +67 %):
    10.000 × 0,025 × 99 $ = **24.750 $ pro Monat**, also **9.900 $ mehr pro Monat**.

    ## Warum CRO oft effizienter ist als Akquise

    Den Traffic zu verdoppeln kostet ungefähr das Doppelte deines
    Marketingbudgets. Die Conversion-Rate zu verdoppeln kostet so viel wie die
    Experimente (Nutzerforschung, A/B-Tests, Landingpage-Redesigns), pro
    gewonnenem Umsatzdollar oft 10-mal weniger.

    Die Rechnung kippt nur, wenn dein Traffic zu gering für statistisch
    signifikante A/B-Tests ist. Unter ~1.000 Besuchern pro Monat und Variante ist
    CRO (Conversion-Rate-Optimierung) Rätselraten. Über 5.000 pro Monat wird sie
    sehr verlässlich.

    ## Richtwerte für die Conversion-Rate

    | Funnel-Stufe | Durchschnitt | Oberes Quartil |
    |---|---|---|
    | Startseite → Preisseite | 10–20 % | 30 %+ |
    | Preisseite → Test | 1–5 % | 8–15 % |
    | Test → zahlend (B2B-SaaS) | 15–25 % | 35 %+ |
    | Bezahlte Akquise (kalt) | 0,5–2 % | 3–5 % |
    | E-Mail-CTA → Kauf | 2–8 % | 10–20 % |

    ## Die fünf wirksamsten CRO-Änderungen

    1. **Klare Headline**: dein Nutzenversprechen in 10 Wörtern, nicht 30. Nutzer lesen zuerst die H1.
    2. **Social Proof im sichtbaren Bereich**: Logoleisten, konkrete Testimonials, G2-/Capterra-Bewertungen
    3. **Weniger Reibung beim CTA**: ein Klick zum Test, keine Kreditkarte, schrittweise Abfrage
    4. **Anker auf der Preisseite**: drei Stufen, die mittlere als „empfohlen“ hervorgehoben
    5. **Exit-Intent und Retargeting**: Besucher zurückholen, die vor der Conversion abspringen

    ## Häufige Fragen

    **Was ist eine gute Conversion-Rate?**
    Das hängt ganz von Funnel-Stufe und Traffic-Quelle ab. Kalter bezahlter
    Traffic mit 0,5–1 % Conversion ist normal, Markensuchen mit 5–15 % sind zu
    erwarten. Konzentriere dich auf Verbesserungen gegenüber deinem eigenen
    Ausgangswert statt auf Branchendurchschnitte.

    **Wie mache ich einen A/B-Test für meine Conversion-Rate?**
    Nutze vor dem Start einen Stichprobenrechner: Um 10 % Verbesserung verlässlich
    zu erkennen, brauchst du rund 1.000 Conversions pro Variante. Lass Tests
    mindestens 2 volle Wochen laufen, um Wochentagseffekte auszugleichen.
"email-list-growth-calculator":
  "body": |
    Eine wachsende E-Mail-Liste gehört zu den wertvollsten Assets, die ein
    eigenfinanziertes Unternehmen aufbauen kann. Anders als Social-Media-Follower
    oder bezahlte Zielgruppen gehört dir deine E-Mail-Liste. Aber eine Liste, die
    nicht wächst, verfällt: Selbst ohne neue Abonnenten schrumpft sie jeden Monat
    durch Abmeldungen und Inaktivität.

    ## Die Wachstumsformel

    **Netto-Monatswachstum = neue Abonnenten − (Listengröße × monatliche Abmelderate)**

    Bei 10.000 Abonnenten und 3 % monatlicher Abmelderate verlierst du pro Monat 300
    Abonnenten aus deinem Bestand. Um zu wachsen, brauchst du mehr als 300 neue
    Abonnenten pro Monat.

    ## Der Listenschwund summiert sich

    Bei 3 % monatlicher Abmelderate verliert eine Liste ohne neue Abonnenten 31 %
    ihrer Größe pro Jahr, bei 5 % sind es 46 %. Deshalb legen E-Mail-Marketer so
    viel Wert auf Reaktivierungskampagnen und Bereinigungsregeln: Inaktive
    Abonnenten blähen die Liste auf und schaden der Zustellbarkeit.

    ## Branchenrichtwerte

    | Kennzahl | Gut | Durchschnitt | Schwach |
    |--------|------|---------|------|
    | Monatliche Abmelderate | < 1,5 % | 2–3 % | > 4 % |
    | Öffnungsrate | > 30 % | 20–25 % | < 15 % |
    | Listenwachstum | > 5 %/Monat | 2–4 %/Monat | < 1 %/Monat |

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet die Wachstumsrate deiner E-Mail-Liste, das Netto-Monatswachstum und die Zeit bis zur Zielgröße der Liste.
"email-roi-calculator":
  "body": |
    E-Mail-Marketing bringt beständig den höchsten ROI aller digitalen
    Marketingkanäle. Die DMA (Data & Marketing Association) nennt eine
    durchschnittliche Rendite von **36–42 $ pro ausgegebenem Dollar**, doch dieser
    Durchschnitt verdeckt enorme Unterschiede. Was ein starkes E-Mail-Programm von
    einem mittelmäßigen trennt, liegt fast ganz bei Öffnungsrate, Klickrate und
    Listenqualität.

    ## Der Umsatzfunnel per E-Mail

    **Öffnungen** = Listengröße × Öffnungsrate
    **Klicks** = Öffnungen × Klickrate
    **Conversions** = Klicks × Conversion-Rate
    **Umsatz** = Conversions × durchschnittlicher Bestellwert

    ## Branchenrichtwerte

    | Kennzahl | B2B-SaaS | E-Commerce | Newsletter |
    |--------|----------|-----------|-----------|
    | Öffnungsrate | 20–30 % | 15–25 % | 30–50 % |
    | Klickrate (von Öffnungen) | 5–12 % | 8–15 % | 4–8 % |
    | Conversion-Rate (von Klicks) | 3–8 % | 2–5 % | 1–3 % |

    ## Warum Listenqualität wichtiger ist als Listengröße

    Eine Liste mit 1.000 Abonnenten und 35 % Öffnungsrate schlägt eine mit 10.000
    Abonnenten und 8 % Öffnungsrate bei Umsatz und Zustellbarkeit. Segmentiere
    deine Liste nach Engagement: Schließe inaktive Abonnenten (90 Tage ohne
    Öffnung) aus, um Zustellbarkeit und Öffnungsraten insgesamt zu verbessern.

    ## Kampagnentypen zum Modellieren

    - **Produktlaunch / Aktion**: einmalige Kampagne an die ganze Liste oder ein Segment
    - **Onboarding-Sequenz**: automatische Sequenz nach der Anmeldung, meist der höchste ROI
    - **Reaktivierungskampagnen**: inaktive Abonnenten zurückgewinnen; meist werden 5–15 % wieder aktiv
    - **Newsletter**: inhaltsgetrieben; weniger direkte Conversion, aber wachsendes Vertrauen des Publikums

    ## Häufige Fragen

    **Wie verbessere ich die Öffnungsraten?**
    Betreffzeilen testen (A/B-Test mit 20 % der Liste vor dem Versand an alle),
    Versandzeit optimieren (meist Dienstag bis Donnerstag, 10–14 Uhr in der Zeitzone
    des Empfängers) und Listenhygiene (inaktive Abonnenten entfernen) sind die drei
    wirksamsten Hebel.

    **Mit welcher Conversion-Rate kann ich rechnen?**
    Das hängt stark vom Angebot ab. Eine starke Aktions-E-Mail an eine warme Liste
    für ein Produkt zu 49 $ kann 5–10 % der Klicks konvertieren. Eine
    Akquise-E-Mail für einen Auftrag über 10.000 $ konvertiert vielleicht 1–2 % der
    Klicks, bringt aber viel Umsatz pro Conversion.
"revenue-per-lead-calculator":
  "body": |
    Der Umsatz pro Lead (RPL) ist die handlungsrelevanteste Kennzahl, um die
    Rentabilität von Marketingkanälen zu vergleichen. Anders als Klickrate oder
    Kosten pro Lead allein berücksichtigt der RPL die Lead-Qualität: Ein Kanal mit
    billigen Leads kann einen miserablen RPL haben, wenn diese Leads nicht
    abschließen oder wenig kaufen.

    ## Die Formel

    **Umsatz pro Lead = Gesamtumsatz / Leads gesamt**

    Bei 480.000 $ Umsatz und 1.200 Leads: RPL = 480.000 $ / 1.200 = **400 $ pro Lead**

    ## Warum der RPL die Kosten pro Lead schlägt

    Die Kosten pro Lead (CPL) messen die Effizienz der Akquise. Doch 10 $ CPL sind
    wertlos, wenn diese Leads nie abschließen. Der RPL misst die Wirksamkeit der
    Akquise: den tatsächlich erzielten Umsatz pro Lead, unabhängig von den Kosten.

    Vergleich der Kanäle:

    | Kanal | Leads | Umsatz | RPL | Ausgaben | CPL | ROI |
    |---|---|---|---|---|---|---|
    | Google Ads | 500 | 200.000 $ | 400 $ | 25.000 $ | 50 $ | 8× |
    | LinkedIn Ads | 100 | 80.000 $ | 800 $ | 20.000 $ | 200 $ | 4× |
    | Organisch | 600 | 200.000 $ | 333 $ | 15.000 $ | 25 $ | 13× |

    Google Ads hat einen höheren RPL als organisch (400 $ gegenüber 333 $). LinkedIn
    hat einen noch höheren RPL (bessere Lead-Qualität), aber auch höhere CPL.
    Organisch hat den besten ROI, aber den niedrigsten RPL.

    **Fazit**: Skaliere zuerst organisch (bester ROI), dann Google Ads (guter ROI,
    skalierbar). LinkedIn ist teuer, bringt aber wertvolle Leads: Halte ein kleines
    Budget für Enterprise.

    ## RPL und CAC

    Der RPL ist eine Kennzahl des Marketingfunnels, der CAC
    (Kundenakquisitionskosten) eine des Vertriebsfunnels. Der Zusammenhang:
    - RPL ÷ Lead-zu-Kunde-Quote = Umsatz pro Kunde (ACV)
    - CPL / Lead-zu-Kunde-Quote = CAC

    Bei 400 $ RPL und 5 % Lead-zu-Kunde-Quote liegt der implizierte ACV bei
    8.000 $. Bei 50 $ CPL und derselben Quote von 5 % liegt dein CAC bei 1.000 $.

    ## Kohorten abgleichen bei langen Vertriebszyklen

    Im B2B mit Zyklen von 60–90 Tagen führt derselbe Zeitraum für Leads und Umsatz
    zu einer Verzerrung. Besser:
    - Leads aus Q1 messen
    - Umsatz aus Q2–Q3 messen, der aus diesen Leads entstand
    - RPL mit 6 Monaten Verzögerung berechnen

    So werden Deals mit langem Zyklus richtig zugeordnet.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet Umsatz und Kosten pro Lead je Kanal, vergleicht den ROI der Kanäle und zeigt, wie viele Leads du für ein Umsatzziel brauchst.
"sales-funnel-calculator":
  "body": |
    ## Was ist ein Sales-Funnel-Rechner?

    Ein Sales-Funnel-Rechner bildet ab, wie Interessenten die einzelnen Stufen deiner Pipeline durchlaufen, vom rohen Lead bis zum abgeschlossenen Kunden, damit du den Umsatz prognostizieren und die schwächste Stufe finden kannst.

    ### Übliche Stufen eines B2B-Funnels

    | Stufe | Übliche Conversion-Rate |
    |-------|------------------------|
    | Lead → MQL | 20–40 % |
    | MQL → SQL | 30–50 % |
    | SQL → Opportunity | 40–60 % |
    | Opportunity → Abschluss | 20–30 % |
    | **Gesamt Lead → Kunde** | **1–5 %** |

    ### Gesamt-Conversion des Funnels

    $$\text{Gesamt-Conversion} = \frac{\text{Neukunden}}{\text{Leads}} \times 100$$

    Eine Gesamt-Conversion von 1–3 % ist im B2B-SaaS üblich. Über 5 % ist hervorragend und deutet meist auf eine starke Marke oder starkes Inbound hin.

    ### Deinen Engpass finden

    Die Stufe mit der im Vergleich zum Richtwert niedrigsten Conversion ist deine Engstelle. Verdoppelst du das Lead-Volumen bei defekter MQL→SQL-Stufe, bekommst du gleich viele Kunden, nur doppelt so viel Verschwendung.

    ### Umsatz aus dem Funnel

    $$\text{Monatsumsatz} = \text{Neukunden} \times \text{ACV}$$

    Modelliere mehrere Szenarien: optimistisch (eine Stufe um 10 % verbessert), Basis und pessimistisch (20 % weniger Leads), um deine Pipeline zu testen.

    ### Ratgeber

    - [Was ist ein Sales-Funnel?](/tools/sales-funnel-calculator/#what-is-a-sales-funnel)
    - [MQL oder SQL: Was ist der Unterschied?](/tools/sales-funnel-calculator/#mql-vs-sql-difference)
"sales-quota-calculator":
  "body": |
    Ein Vertriebsplan beginnt damit, vom Umsatzziel aus rückwärts zu rechnen. Mit
    einem jährlichen Umsatzziel, dem durchschnittlichen Vertragswert (ACV) und der
    Abschlussquote zeigt dieser Rechner genau, wie viele Deals, Leads und wie viel
    Pipeline du erzeugen musst, pro Monat und pro Jahr.

    ## Die Rechnung des umgekehrten Funnels

    **Nötige Deals** = jährliches Umsatzziel ÷ ACV

    **Nötige Leads** = nötige Deals ÷ Abschlussquote

    **Nötige Pipeline** = nötige Leads × ACV (gesamter Pipelinewert, der hineinkommen muss)

    Bei einem Jahresziel von 1 Mio. $, 12.000 $ ACV und 20 % Abschlussquote:
    - 83 nötige Deals
    - 417 nötige qualifizierte Leads
    - ~7 Deals pro Monat, 35 Leads pro Monat

    ## Was das über Einstellungen sagt

    Ein SDR (Sales Development Representative) erzeugt je nach Segment und
    Outbound-Qualität meist 40–80 qualifizierte Leads pro Monat. Verlangt deine
    Rechnung über 200 Leads pro Monat, brauchst du 3–5 SDRs oder eine ausgereifte
    Inbound-Maschine. Modelliere mit diesen Zahlen den Personalbedarf, bevor du
    dich auf einen Umsatzplan festlegst.

    ## Die Eingaben verbessern

    Die wirksamsten Stellschrauben deiner Quotenrechnung:
    - **Abschlussquote**: 5 Prozentpunkte mehr (von 20 % auf 25 %) senken die nötigen Leads um 20 %
    - **ACV**: Ein doppelter ACV halbiert die Zahl der nötigen Deals
    - **Vertriebszyklus**: Kürzere Zyklen bringen mehr Pipeline-Umschläge pro Jahr und bessere Kapitaleffizienz

    ## Häufige Fragen

    **Welche Abschlussquote sollte ich ansetzen?**
    Miss die Abschlussquote vom qualifizierten Lead (vereinbartes
    Discovery-Gespräch) bis zum gewonnenen Deal. Durchschnitt im B2B-SaaS: 15–25 %
    bei KMU, 20–30 % im Mid-Market, 30–40 % bei Enterprise (längerer Funnel,
    qualifiziertere Leads). Kennst du deine Quote noch nicht, starte mit 20 %.

    **Wie wirkt sich der Vertriebszyklus auf die Pipeline aus?**
    Bei 30 Tagen Zyklus dreht sich die Pipeline ~12-mal pro Jahr, bei 90 Tagen
    4-mal. Kürzere Zyklen bringen mehr Daten, schnellere Iteration und geringeren
    Kapitalbedarf für dasselbe Umsatzziel.
"sales-velocity-calculator":
  "body": |
    Sales Velocity misst, wie schnell deine Pipeline zu Umsatz wird, genauer: wie
    viele Umsatzdollar dein Vertriebsteam pro Tag erzeugt. Sie gehört zu den
    handlungsrelevantesten Kennzahlen im B2B-Vertrieb, weil sie Umsatzwachstum in
    vier Hebel zerlegt, die du unabhängig optimieren kannst.

    ## Die Formel

    **Sales Velocity = (Opportunities × Abschlussquote × ACV) / Tage im Vertriebszyklus**

    Bei 50 Opportunities, 25 % Abschlussquote, 8.000 $ ACV und 90 Tagen Zyklus:
    (50 × 0,25 × 8.000 $) / 90 = **1.111 $ pro Tag** → **405.000 $ annualisiert**

    ## Die vier Hebel

    Sales Velocity hat genau vier Eingaben, die sich jeweils unabhängig verbessern
    lassen:

    1. **Zahl der Opportunities**: mehr qualifizierte Pipeline. 20 % mehr
       Opportunities bringen 20 % mehr Velocity (bei sonst gleichen Werten).
    2. **Abschlussquote**: bessere Qualifizierung, stärkere Demos, besseres
       Nachfassen. Von 25 % auf 30 % bringt 20 % mehr Velocity.
    3. **ACV**: Preise, Pakete, Upsell beim Abschluss. Von 8.000 $ auf 10.000 $
       bringt 25 % mehr Velocity.
    4. **Vertriebszyklus**: Von 90 auf 75 Tage verkürzt bringt 20 % mehr Velocity.

    Werden alle vier um je 10 % verbessert, ergibt das multiplikativ **+46 %
    Velocity**, nicht +40 %.

    ## Richtwerte nach Segment

    | Segment | Übliche Sales Velocity |
    |---|---|
    | KMU-SaaS (< 5.000 $ ACV) | 200–500 $ pro Tag |
    | Mid-Market (5.000–50.000 $ ACV) | 500–2.000 $ pro Tag |
    | Enterprise (> 50.000 $ ACV) | 2.000–10.000 $+ pro Tag |

    ## Was dir die Sales Velocity sagt

    **Niedrige Velocity bei guter Abschlussquote**: Die Pipeline ist zu dünn;
    füge oben im Funnel mehr Opportunities hinzu.

    **Niedrige Velocity bei guter Pipeline**: Abschlussquote oder ACV sind das
    Problem; verbessere Qualifizierung oder Preise.

    **Ordentliche Velocity bei langem Zyklus**: Einen kürzeren Zyklus spürst du
    überproportional, weil er im Nenner steht.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet die Sales Velocity (Umsatz pro Tag) aus Pipelinegröße,
    Abschlussquote, durchschnittlichem Vertragswert und Länge des
    Vertriebszyklus.
