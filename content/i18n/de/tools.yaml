"budget-variance-calculator":
  "body": |
    ## Formel der Budgetabweichung

    $$\text{Abweichung} = \text{Ist} - \text{Budget}$$

    $$\text{Abweichung \%} = \frac{\text{Ist} - \text{Budget}}{|\text{Budget}|} \times 100$$

    ### Günstig oder ungünstig

    Ob eine Abweichung „günstig“ ist, hängt von der Art der Position ab:

    | Art der Position | Günstige Bedingung |
    |-----------|---------------------|
    | Umsatz | Ist > Budget (mehr eingenommen als geplant) |
    | Kosten | Ist < Budget (weniger ausgegeben als geplant) |

    ### Wesentlichkeitsschwellen

    Die meisten Organisationen legen Wesentlichkeitsschwellen fest, ab denen Abweichungen untersucht werden. Übliche Regeln:
    - Abweichungen > 5–10 % bei Budgetpositionen über 10.000 $ untersuchen
    - Umsatzabweichungen > 10 % immer untersuchen
    - Kumulierte Abweichungen melden, auch wenn jede einzelne Periode im Toleranzbereich liegt

    ### Arten von Budgetabweichungen

    - **Preisabweichung**: Der Stückpreis wich vom Budget ab
    - **Mengenabweichung**: Verkaufte oder verbrauchte Menge wich ab
    - **Effizienzabweichung**: Arbeits- oder Materialeinsatz pro Einheit wich ab
    - **Mix-Abweichung**: Die Zusammensetzung der verkauften Produkte oder Leistungen wich vom geplanten Mix ab

    Die Ursache einer Abweichung bestimmt die passende Gegenmaßnahme.

    ### Ratgeber

    - [Was ist eine Budgetabweichungsanalyse?](/tools/budget-variance-calculator/#what-is-budget-variance-analysis)
    - [Günstige vs. ungünstige Abweichung: die wichtigsten Unterschiede](/tools/budget-variance-calculator/#favorable-vs-unfavorable-variance)
"cash-conversion-cycle-calculator":
  "body": |
    Der Cash Conversion Cycle (CCC) misst, wie viele Tage das Cash eines
    Unternehmens im operativen Geschäft gebunden ist: von der Bezahlung von
    Lagerbestand oder Vorleistungen bis zum Zahlungseingang der Kunden.

    ## Die CCC-Formel

    **CCC = DIO + DSO − DPO**

    Dabei gilt:
    - **DIO** (Lagerreichweite in Tagen) = durchschnittlicher Lagerbestand ÷ [Herstellkosten](/glossary/#cogs) × 365
    - **DSO** (Forderungslaufzeit) = durchschnittliche Forderungen ÷ Umsatz × 365
    - **DPO** (Verbindlichkeitenlaufzeit) = durchschnittliche Verbindlichkeiten ÷ Herstellkosten × 365

    ## Rechenbeispiel

    Ein Unternehmen mit:
    - Durchschnittlichem Lagerbestand: 500.000 $
    - Jährlichen Herstellkosten: 3 Mio. $
    - Durchschnittlichen Forderungen: 400.000 $
    - Jahresumsatz: 5 Mio. $
    - Durchschnittlichen Verbindlichkeiten: 200.000 $

    - DIO = 500.000 $ ÷ 3 Mio. $ × 365 = 60,8 Tage
    - DSO = 400.000 $ ÷ 5 Mio. $ × 365 = 29,2 Tage
    - DPO = 200.000 $ ÷ 3 Mio. $ × 365 = 24,3 Tage
    - **CCC = 60,8 + 29,2 − 24,3 = 65,7 Tage**

    Im Schnitt sind 65,7 Tage Cash im Working Capital gebunden.

    ## Negativer CCC: der heilige Gral

    Manche Unternehmen, vor allem SaaS (Kunden zahlen im Voraus) und große
    Händler (sie verkaufen, bevor sie Lieferanten bezahlen), erreichen einen
    negativen CCC: Sie kassieren, bevor sie ihre Lieferanten bezahlen müssen.

    Amazon arbeitete jahrelang mit negativem CCC und nutzte Lieferantenkredite
    praktisch als kostenloses Working Capital zur Finanzierung des Wachstums.

    ## Der CCC bei SaaS

    Reine SaaS-Unternehmen haben typischerweise:
    - DIO = 0 (kein physischer Lagerbestand)
    - DSO = je nach Zahlungsbedingungen (0 bei Monatsabos, 30–60 bei Enterprise-Kunden auf Rechnung)
    - DPO = je nach Lieferantenbedingungen (meist 30–60 Tage)

    SaaS mit monatlicher Kartenabrechnung und üblichen Zahlungszielen hat oft
    einen CCC nahe 0 oder negativ.

    ## So verbesserst du den CCC

    **DIO senken**: Lager schneller umschlagen durch bessere Bedarfsprognosen,
    weniger Sicherheitsbestand oder Just-in-time-Beschaffung.

    **DSO senken**: Skonto für frühe Zahlung anbieten, das Mahnwesen
    automatisieren, Zahlungsziele für Neukunden verkürzen, automatische Abbuchung
    einführen.

    **DPO erhöhen**: längere Zahlungsziele mit Lieferanten verhandeln (60–90 statt
    30 Tage). Große Unternehmen tun das systematisch.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet Lagerreichweite (DIO), Forderungslaufzeit (DSO) und
    Verbindlichkeitenlaufzeit (DPO) und fasst sie zum Cash Conversion Cycle
    zusammen.
"dso-calculator":
  "body": |
    ## Was ist die Forderungslaufzeit (DSO)?

    Die Days Sales Outstanding (DSO) messen, wie viele Tage dein Unternehmen im
    Schnitt braucht, um nach einem Verkauf das Geld einzunehmen. Sie gehören zu
    den wichtigsten Working-Capital-Kennzahlen, weil sie direkt beziffern, wie
    viel Cash jeweils in Forderungen gebunden ist.

    **DSO = (Forderungen ÷ gesamte Kreditverkäufe) × Anzahl der Tage**

    Eine niedrigere DSO bedeutet schnelleren Zahlungseingang und weniger Cash in
    offenen Rechnungen. Eine steigende DSO ist ein frühes Warnsignal für
    Inkassoprobleme oder Liquiditätsengpässe bei Kunden.

    ## So liest du deine DSO

    | DSO | Einordnung |
    |---|---|
    | Unter 30 Tage | Hervorragend: Kunden zahlen pünktlich |
    | 30–45 Tage | Gut: passend zu üblichen 30 Tagen Zahlungsziel |
    | 45–60 Tage | Akzeptabel: auf steigenden Trend achten |
    | 60–90 Tage | Erhöht: Inkassoprozess überprüfen |
    | Über 90 Tage | Hoch: deutliche Belastung des Working Capital |

    ## Forderungsumschlag

    Der Forderungsumschlag ist das Gegenstück zur DSO:

    **Forderungsumschlag = gesamte Kreditverkäufe ÷ durchschnittliche Forderungen**

    Ein höherer Umschlag heißt, du kassierst schneller. Er ergänzt die DSO: Ein
    Umschlag von 12× entspricht einer durchschnittlichen DSO von etwa 30 Tagen.

    ## So senkst du die DSO

    1. **Zahlungsziele verkürzen**: für Neukunden von 60 auf 30 Tage
    2. **Skonto anbieten**: „2/10 netto 30“ (2 % Nachlass bei Zahlung innerhalb von 10 Tagen)
    3. **Erinnerungen automatisieren**: nach 7, 14 und 30 Tagen Verzug
    4. **Anzahlungen verlangen**: bei großen Projekten 25–50 % im Voraus
    5. **Mehr Zahlungsarten akzeptieren**: weniger Reibung mit Lastschrift, Karte und Überweisung

    ## Wirkung auf das Working Capital

    Jeder Tag weniger DSO setzt Cash in Höhe deines Tagesumsatzes frei. Bei
    450.000 $ pro Quartal und einer Senkung der DSO von 45 auf 30 Tage setzt du
    15 × (450.000 $ ÷ 90) = **75.000 $ Cash** frei, ohne dass sich der Umsatz
    ändert.

    ## Häufige Fragen

    **Was ist eine gute DSO für ein B2B-SaaS-Unternehmen?**
    B2B-SaaS mit Monatsabos hat oft eine DSO nahe null, weil im Voraus abgebucht
    wird. Bei Jahresverträgen mit Vorabrechnung liegt die DSO meist bei 30–45
    Tagen nach Rechnungsstellung. Mit Abo- und Dienstleistungsumsatz zusammen
    kann die gemischte DSO bei 35–55 Tagen liegen.

    **Wie wirkt sich die DSO auf meine Kreditlinie aus?**
    Kreditgeber prüfen die DSO bei assetbasierten Krediten und
    Forderungsfinanzierung. Eine hohe oder steigende DSO kann auf
    Inkassoprobleme hindeuten und die Beleihungsquote deiner Forderungen senken.
    Eine DSO unter 45 Tagen macht deine Forderungen meist zu üblichen Quoten
    (oft 80–85 %) finanzierbar.
"free-cash-flow-calculator":
  "body": |
    Der Free Cashflow (FCF) ist das Cash, das ein Unternehmen nach Abzug der
    Investitionsausgaben erwirtschaftet. Er ist das ehrlichste Maß dafür, ob ein
    Unternehmen Cash erzeugt: verlässlicher als der Gewinn (den
    Bilanzierungsentscheidungen verzerren können) und aussagekräftiger als das
    Umsatzwachstum allein.

    ## Die Formel

    **FCF = operativer Cashflow − Investitionsausgaben**

    Ein Unternehmen mit 500.000 $ OCF und 80.000 $ Capex erzeugt **420.000 $ FCF**.

    ## Warum der FCF mehr zählt als das EBITDA

    Das EBITDA rechnet nicht zahlungswirksame Aufwendungen heraus, um Ergebnisse
    über verschiedene Kapitalstrukturen vergleichbar zu machen. Der FCF geht
    weiter: Er berücksichtigt die Reinvestitionen, die für den Fortbestand des
    Geschäfts nötig sind. Ein Unternehmen mit hohen Ausgaben für Anlagen kann ein
    starkes EBITDA und einen negativen FCF haben: Es behält tatsächlich kein Cash.

    Bei SaaS ist der Abstand zwischen EBITDA und FCF meist klein (kaum Capex). In
    Hardware, Industrie oder Infrastruktur kann der Capex 30–50 % des operativen
    Cashflows verschlingen, und der FCF weicht deutlich vom EBITDA ab.

    ## Richtwerte für die FCF-Marge

    | Unternehmenstyp | FCF-Marge |
    |---|---|
    | Spitzen-SaaS (Shopify, Veeva) | 20–30 % |
    | Typisches profitables SaaS | 10–20 % |
    | SaaS in Früh- oder Wachstumsphase | 0–10 % |
    | Capex-intensive Unternehmen | -10–+5 % |

    ## FCF-Rendite für die Bewertung

    FCF-Rendite = FCF / Marktkapitalisierung × 100

    Eine FCF-Rendite von 5 % heißt, du zahlst das 20-Fache des FCF. 2 % heißt das
    50-Fache. Faustregel: Über 4–5 % gilt als günstig, unter 1,5 % als teuer.
    Berücksichtige die Wachstumserwartungen: Schnell wachsende Unternehmen
    rechtfertigen niedrigere Renditen.

    ## FCF vs. Free Cashflow to Equity (FCFE)

    Der FCF ist die Cash-Erzeugung auf Unternehmensebene vor dem
    Schuldendienst. Der FCFE zieht die Schuldenzahlungen ab: FCFE = FCF −
    (Tilgung − neue Schulden). Für Eigenkapitalinvestoren, die ein verschuldetes
    Unternehmen bewerten, ist der FCFE aussagekräftiger.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet den Free Cashflow aus operativem Cashflow und Capex, dazu die
    FCF-Marge und optional die FCF-Rendite als Bewertungskontext.
"invoice-discount-calculator":
  "body": |
    ## Formel für Skonto bei früher Zahlung

    Für die Bedingung „2/10 netto 30“ (2 % Skonto bei Zahlung innerhalb von 10 Tagen, sonst fällig nach 30):

    $$\text{Annualisierte Kosten} = \frac{\text{Skonto \%}}{100 - \text{Skonto \%}} \times \frac{365}{\text{Netto-Tage} - \text{Skonto-Tage}}$$

    **Beispiel (2/10 netto 30):**

    $$\frac{2}{98} \times \frac{365}{20} = 37.2\%$$

    Auf ein Skonto von 2/10 netto 30 zu verzichten, entspricht einem Kredit zu 37,2 % effektivem Jahreszins: Fast immer lohnt es sich, das Skonto zu nutzen, wenn du das Cash hast.

    ### Wann du das Skonto nutzen solltest

    Nutze das Skonto, wenn die **annualisierten Kosten des Verzichts** über deinen **Kapitalkosten** liegen (Kosten einer Kreditlinie, Opportunitätskosten des Cash).

    | Dein Kreditzins | Annualisierte Skontokosten | Entscheidung |
    |--------------------|--------------------------|---------- |
    | 8 % | 37,2 % | Skonto nutzen |
    | 8 % | 6 % | Verzichten: Kredit ist günstiger als das verlorene Skonto |

    ### Dynamisches Skonto

    Manche Kreditorenplattformen bieten dynamisches Skonto an: variable Sätze je nach Tagen früherer Zahlung. Mit diesem Rechner bewertest du jedes Angebot, indem du die implizierten annualisierten Kosten berechnest.

    ### Ratgeber

    - [Was bedeutet die Zahlungsbedingung 2/10 netto 30?](/tools/invoice-discount-calculator/#what-is-2-10-net-30)
    - [Wann solltest du Skonto für frühe Zahlung nutzen?](/tools/invoice-discount-calculator/#when-to-take-early-payment-discount)
"operating-cash-flow-calculator":
  "body": |
    Der operative Cashflow (OCF) misst das Cash, das dein Unternehmen tatsächlich
    aus dem Kerngeschäft erwirtschaftet. Anders als der Jahresüberschuss lässt er
    sich kaum durch Bilanzierungsentscheidungen beeinflussen: Entweder ist das
    Geld auf dem Konto angekommen oder nicht.

    ## Die Formel der indirekten Methode

    **OCF = Jahresüberschuss + Abschreibungen + Veränderung des Working Capital**

    Das ist die gängigste Methode (indirekte Methode), weil sie vom leicht
    verfügbaren Jahresüberschuss ausgeht und nicht zahlungswirksame Posten sowie
    zeitliche Verschiebungen korrigiert.

    ## Warum der OCF vom Jahresüberschuss abweicht

    **Abschreibungen** mindern den ausgewiesenen Gewinn, kosten aber kein Cash.
    Ein Server für 10.000 $, über 5 Jahre abgeschrieben, senkt den
    Jahresüberschuss um 2.000 $ pro Jahr, wurde aber im ersten Jahr bezahlt. Wer
    die Abschreibungen wieder hinzurechnet, macht aus dem Buchgewinn einen
    Cash-Gewinn.

    **Veränderungen im Working Capital** spiegeln die zeitliche Lücke zwischen
    Umsatzerfassung und Zahlungseingang:
    - Forderungen **gestiegen** → du hast Kunden Rechnungen gestellt, aber noch nicht kassiert → der OCF liegt unter dem Jahresüberschuss
    - Verbindlichkeiten **gestiegen** → du hast Ware erhalten, aber noch nicht bezahlt → der OCF liegt über dem Jahresüberschuss

    ## Free Cashflow (FCF)

    **FCF = OCF − Investitionsausgaben**

    Der Free Cashflow ist das, was nach Erhalt und Ausbau der Vermögensbasis
    übrig bleibt. Private-Equity-Firmen und erfahrene Investoren bewerten
    Unternehmen damit, weil er das tatsächlich ausschüttbare Cash darstellt.

    | OCF | Capex | FCF | Einordnung |
    |---|---|---|---|
    | +100.000 $ | 5.000 $ | +95.000 $ | Gesund: Das Unternehmen erzeugt Cash |
    | +100.000 $ | 50.000 $ | +50.000 $ | Akzeptabel: hohe Investitionen in Anlagen |
    | +100.000 $ | 120.000 $ | −20.000 $ | Investitionsphase für Wachstum |
    | −50.000 $ | 10.000 $ | −60.000 $ | Cash-Abfluss: externe Finanzierung nötig |

    ## Cash Conversion Ratio

    **Cash Conversion Ratio = OCF ÷ Jahresüberschuss**

    Über 1× erzeugt das Unternehmen mehr Cash als Buchgewinn (gut). Unter 1×
    wächst der Gewinn schneller als die Zahlungseingänge: Behalte die Forderungen
    im Blick. Über 1,5× deutet oft auf hohe Abschreibungen im Verhältnis zum
    Capex hin.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet den operativen Cashflow aus Jahresüberschuss, Abschreibungen und Veränderung des Working Capital, dazu Free Cashflow und Cash Conversion Ratio.
"working-capital-calculator":
  "body": |
    Working Capital ist die Differenz zwischen Umlaufvermögen und kurzfristigen
    Verbindlichkeiten eines Unternehmens. Es misst die kurzfristige Liquidität:
    den operativen Puffer, der den Alltag ohne Cash-Krise am Laufen hält.

    ## Die Formel

    **Working Capital = Umlaufvermögen − kurzfristige Verbindlichkeiten**

    Bei 500.000 $ Umlaufvermögen und 200.000 $ kurzfristigen Verbindlichkeiten
    beträgt das Working Capital 300.000 $. Diese 300.000 $ sind der operative
    Cash-Puffer.

    ## Liquiditätsgrad (Current Ratio)

    **Current Ratio = Umlaufvermögen / kurzfristige Verbindlichkeiten**

    500.000 $ / 200.000 $ = 2,5x. Für jeden Dollar kurzfristiger Verpflichtungen
    stehen 2,50 $ an liquiden Mitteln bereit.

    ## Quick Ratio (Acid Test)

    **Quick Ratio = (Umlaufvermögen − Vorräte) / kurzfristige Verbindlichkeiten**

    Die Quick Ratio lässt die Vorräte weg, weil es dauert, Lagerbestand in Cash
    zu verwandeln. Sie ist ein vorsichtigeres Maß der sofortigen Liquidität.

    ## Richtwerte

    | Current Ratio | Einordnung |
    |---|---|
    | > 2,0x | Stark: reichlich kurzfristiger Puffer |
    | 1,5–2,0x | Gesund: komfortable Liquidität |
    | 1,0–1,5x | Knapp: wenig Spielraum für Fehler |
    | < 1,0x | Warnung: mögliches Liquiditätsrisiko |

    ## Negatives Working Capital

    Manche Unternehmen, vor allem SaaS- und Abo-Firmen, kommen mit negativem
    Working Capital aus. Zahlen Kunden jährlich im Voraus (das erzeugt passive
    Rechnungsabgrenzung, also eine kurzfristige Verbindlichkeit), ist das Working
    Capital negativ, obwohl das Unternehmen kerngesund ist.

    Amazon arbeitete jahrelang mit negativem Working Capital: Kunden zahlten
    sofort, Amazon bezahlte Lieferanten nach 30–45 Tagen. Die Differenz
    finanzierte den Betrieb.

    ## Working Capital und Cash Conversion Cycle

    Working Capital ist der statische Bestand, der [Cash Conversion Cycle](/tools/cash-conversion-cycle-calculator/)
    der dynamische Fluss. Ein Unternehmen kann positives Working Capital und
    trotzdem einen schlechten CCC haben, wenn Forderungen über 90 Tage brauchen.
    Verfolge beide Kennzahlen gemeinsam.

    ## Häufige Fragen

    **Was macht dieser Rechner?**
    Er berechnet Working Capital, Current Ratio, Quick Ratio und Working Capital
    in Tagen aus deinem Umlaufvermögen und deinen kurzfristigen
    Verbindlichkeiten.

"payment-fee-comparison":
  "body": |
    Den günstigsten Zahlungsanbieter zu finden ist einfach, sobald du die Zahlen
    nebeneinander siehst. Gib unten deinen typischen Verkaufsbetrag ein, und die
    Vergleichstabelle zeigt sofort die genauen Gebühren und Nettoauszahlungen für
    **Stripe**, **PayPal Standard**, **PayPal Checkout** und **Shopify Payments**
    in allen drei Plänen.

    ## So funktioniert der Gebührenvergleich

    Die Gebühren jedes Anbieters sind mit den veröffentlichten US-Sätzen hinterlegt:

    | Anbieter | Satz | Fixgebühr |
    |-----------|------|-----------|
    | Stripe | 2,9 % | + 0,30 $ |
    | PayPal Standard | 2,99 % | + 0,49 $ |
    | PayPal Checkout | 3,49 % | + 0,49 $ |
    | Shopify Basic | 2,0 % | + 0,25 $ |
    | Shopify (Shopify-Plan) | 1,7 % | + 0,25 $ |
    | Shopify Advanced | 1,5 % | + 0,25 $ |

    ## Wann Shopify Payments günstiger ist

    Shopify Payments schlägt Stripe bei inländischen US-Visa/Mastercard-Zahlungen
    ab etwa 12 $. Bei 100 $ spart Shopify Basic gegenüber Stripe 0,95 $ pro
    Transaktion. Bei 500 $ Monatsvolumen im Basic-Plan (39 $/Monat) ist die
    Rechnung etwa ausgeglichen, bei 50.000 $ pro Monat übersteigt die Ersparnis
    beim Satz die Plangebühr um ein Vielfaches.

    ## Wann du bei Stripe bleiben solltest

    Stripe gewinnt bei Abo-Abrechnung, SaaS-APIs, internationalen Zahlungen (über
    135 Währungen), ACH-Lastschrift, B2B-Rechnungen und Unternehmen, die nicht
    auf Shopify sind. Stripes Entwickler-Ökosystem ist unerreicht. Beziffere mit
    diesem Tool den Gebührenunterschied und wäge ihn gegen Wechselkosten und
    Funktionsbedarf ab.

    ## Häufige Fragen

    **Welcher Zahlungsanbieter hat die niedrigsten Gebühren?**
    Shopify Payments (Advanced-Plan) hat mit 1,5 % + 0,25 $ den niedrigsten Satz,
    setzt aber einen Shopify-Shop und ein Abo für 399 $/Monat voraus. Ohne
    Shopify schlägt Stripe (2,9 % + 0,30 $) PayPal Standard (2,99 % + 0,49 $) bei
    Transaktionen über 15 $.

    **Wie viel günstiger ist Shopify Payments als Stripe?**
    Bei einer Transaktion über 100 $: Shopify Basic kostet 2,25 $, Stripe 3,20 $,
    Shopify ist also 0,95 $ günstiger. Shopify Basic erfordert aber einen Plan
    für 39 $/Monat. Erst ab über 4.100 $ Monatsvolumen deckt die Ersparnis
    gegenüber Stripe die Plangebühr.

    **Ist PayPal teurer als Stripe?**
    Ja. PayPal Standard verlangt 2,99 % + 0,49 $, Stripe 2,9 % + 0,30 $. Bei
    100 $ nimmt PayPal Standard 3,48 $, Stripe 3,20 $: PayPal ist 0,28 $ teurer.
    PayPal Checkout (3,49 % + 0,49 $) ist deutlich teurer als beide.

    **Kann ich Stripe auf Shopify ohne Zusatzgebühren nutzen?**
    Ja, aber Shopify erhebt eine Drittanbieter-Transaktionsgebühr (je nach Plan
    0,5–2 %), wenn du einen anderen Anbieter als Shopify Payments nutzt. Bei
    10.000 $ pro Monat kommen so 50–200 $ Shopify-Aufschlag dazu. Mit Shopify
    Payments (auf Stripes Infrastruktur) entfällt diese Gebühr.
"paypal-fee-calculator":
  "body": |
    PayPal verlangt **3,49 % + 0,49 $** pro inländischer Online-Transaktion, etwas
    mehr als Stripes 2,9 % + 0,30 $. Bei internationalen Zahlungen steigen die
    Gebühren auf **4,99 % + 0,49 $**. Für Kleinstbeträge (unter 10 $) gibt es
    einen Sondertarif: **5 % + 0,05 $**, bei winzigen Beträgen günstiger, aber
    prozentual teuer.

    ## PayPal- und Stripe-Gebühren im Vergleich

    | Szenario | PayPal | Stripe |
    |---|---|---|
    | 10 $ inländisch | 0,84 $ (8,4 %) | 0,59 $ (5,9 %) |
    | 100 $ inländisch | 3,98 $ (4,0 %) | 3,20 $ (3,2 %) |
    | 1.000 $ inländisch | 35,39 $ (3,5 %) | 32,30 $ (3,2 %) |
    | 100 $ international | 5,48 $ (5,5 %) | 4,70 $ (4,7 %) |

    Bei den meisten Beträgen ist Stripe günstiger. PayPals Vorteil ist die
    Vertrautheit bei Kunden: Die Checkout-Conversion kann steigen, wenn PayPal
    als Option angeboten wird.

    ## Gebühren weitergeben
    Wenn du einen bestimmten Nettobetrag erhalten musst, rechnet der Rechner
    hoch: Um genau 100 $ über eine inländische PayPal-Zahlung zu erhalten, musst
    du **104,66 $** berechnen.

    ## PayPal „Freunde & Familie“
    Private Zahlungen („Freunde & Familie“) sind im Inland kostenlos, wenn sie
    per Bankkonto oder PayPal-Guthaben bezahlt werden. Sie für geschäftliche
    Zahlungen zu nutzen, verstößt aber gegen PayPals Nutzungsbedingungen. Du
    riskierst die Kontosperrung, ohne den Verkäuferschutz normaler
    Transaktionen.

    ## Häufige Fragen

    **Berechnet PayPal Gebühren für Rückerstattungen?**
    PayPal erstattet die Fixgebühr von 0,49 $, behält aber den prozentualen Teil
    (3,49 %). Stripe erstattet ebenfalls die Fixgebühr, behält aber auch den
    Prozentsatz.

    **Kann ich PayPal-Gebühren vermeiden?**
    Bei inländischen Überweisungen vom Bankkonto an private Kontakte: ja. Bei
    geschäftlichen Transaktionen senkt nur PayPals Händlertarif-Programm die
    Gebühren, und das erfordert einen Antrag und hohes Transaktionsvolumen. Im
    Allgemeinen ist Stripe für die meisten geschäftlichen Zwecke günstiger.
"shopify-fee-calculator":
  "body": |
    Shopify erhebt auf jeden Verkauf zwei Arten von Gebühren: eine
    **Zahlungsabwicklungsgebühr** (ähnlich Stripes Satz) und eine separate
    **Transaktionsgebühr**, wenn du statt Shopify Payments ein
    Drittanbieter-Gateway nutzt. Beide zu verstehen ist Pflicht für eine genaue
    Margenrechnung.

    ## Shopify-Gebühren nach Plan

    | Plan | Monatsgebühr | Abwicklungssatz | Transaktionsgebühr (Drittanbieter) |
    |---|---|---|---|
    | Basic | 39 $ | 2,9 % + 0,30 $ | 2,0 % |
    | Shopify | 105 $ | 2,6 % + 0,30 $ | 1,0 % |
    | Advanced | 399 $ | 2,4 % + 0,30 $ | 0,5 % |

    Die Transaktionsgebühr fällt *nur* an, wenn du einen anderen Anbieter als
    Shopify Payments nutzt (Stripe, PayPal usw.). Mit Shopify Payments entfällt
    sie komplett.

    ## Shopify Payments oder Drittanbieter-Gateway

    Für die meisten Händler ist Shopify Payments am günstigsten, weil die
    Transaktionsgebühr wegfällt. Ein Verkauf über 100 $ im Basic-Plan über Stripe
    kostet **2,90 $ + 0,30 $ + 2,00 $ = 5,20 $**, mit Shopify Payments nur
    **3,20 $**: 62 % Unterschied.

    Gründe, trotzdem ein Drittanbieter-Gateway zu nutzen:
    - Dein Land wird von Shopify Payments nicht unterstützt (verfügbar in über 17 Ländern)
    - Du brauchst Betrugsschutz, Abos oder Funktionen, die nur dein bisheriges Gateway bietet
    - Risikoreiche Produktkategorien, die Shopify Payments nicht zulässt

    ## Häufige Fragen

    **Fließt die monatliche Plangebühr in die Kosten pro Verkauf ein?**
    Der Rechner zeigt nur Gebühren pro Transaktion. Für die vollen Kosten pro
    Verkauf inklusive Plangebühr teilst du die Monatsgebühr durch die Zahl deiner
    monatlichen Transaktionen und addierst das Ergebnis. Bei 100 Verkäufen pro
    Monat im Basic-Plan macht die Plangebühr 0,39 $ pro Verkauf aus.

    **Lohnt sich ein Upgrade für niedrigere Gebühren?**
    Die Rechnung: Wenn der Wechsel von Basic zu Shopify (66 $ mehr pro Monat)
    0,3 % spart und 1 % Transaktionsgebühr (bei Drittanbieter-Gateway)
    wegfallen lässt, liegt die Gewinnschwelle bei 66 $ / 0,013 = 5.077 $ Umsatz
    pro Monat. Darüber zahlt sich das Upgrade aus.
"stripe-fee-calculator":
  "body": |
    Stripe ist der bevorzugte Zahlungsanbieter für die meisten SaaS-Produkte,
    Marktplätze und Indie-Unternehmen, doch die Gebührenstruktur stellt Gründern
    ständig Fallen. Der Standardsatz liegt bei **2,9 % + 0,30 $** pro
    erfolgreicher Kartenzahlung, aber das ist nur der Ausgangspunkt.

    Internationale Karten (außerhalb der USA ausgegeben) kosten zusätzlich
    **1,5 % Auslandsgebühr**, insgesamt also **4,4 % + 0,30 $**. Wenn du Stripe
    Connect (Stripes Plattform, die Zahlungen zwischen einem Marktplatz und seinen
    Verkäufern verteilt) nutzt, um Zahlungen für verbundene Konten abzuwickeln,
    werden Gebühren und Umsatzaufteilung komplexer. Dieser Rechner deckt alle
    gängigen Fälle ab.

    ## So funktioniert die Stripe-Gebührenberechnung
    1. Gib den Betrag ein, den du dem Kunden berechnen willst.
    2. Wähle, ob die Karte inländisch oder international ist.
    3. Entscheide, ob du die Gebühr selbst trägst oder an den Kunden weitergibst
       (Modus „berechnen, was nötig ist, um den Zielbetrag zu erhalten“).
    4. Der Rechner zeigt die genaue Gebühr, die Nettoauszahlung auf dein
       Bankkonto und im Weitergabe-Modus, was du berechnen musst, um deinen
       Zielbetrag zu erhalten.

    ## Warum „mehr berechnen, um genau das Nötige zu erhalten“ wichtig ist
    Wenn du genau 100 $ von einer inländischen US-Karte erhalten musst, reicht es
    nicht, 100 $ zu berechnen: Nach Stripes 2,9 % + 0,30 $ kämen 96,80 $ an. Für
    genau 100 $ musst du **103,09 $** berechnen (wenn der Kunde die Gebühr zahlt).
    Der Rechner erledigt dieses Hochrechnen automatisch.

    ## Häufige Fragen

    **Ändert sich Stripes Satz mit dem Volumen?**
    Ja. Stripe verhandelt individuelle Preise für Unternehmen mit mehr als etwa
    80.000 $ pro Monat. Für die meisten Indie-Gründer und jungen Unternehmen
    gilt der Standardsatz von 2,9 % + 0,30 $. Der Rechner nutzt den Standardsatz;
    passe das Prozentfeld an deinen verhandelten Satz an.

    **Was ist mit Stripes Zusatzgebühren (Streitfälle, Rückerstattungen, international)?**
    Rückerstattungen geben die prozentuale Gebühr zurück, nicht aber die fixen
    0,30 $. Streitfälle kosten 15 $ unabhängig vom Ausgang (bei Erfolg bekommst du
    sie zurück). Diese Sonderfälle sind nicht in der Berechnung pro Transaktion
    enthalten, sollten aber budgetiert werden.

    **Kann ich den Rechner für Stripe Connect nutzen?**
    Ja. Stripe Connect gibt dieselbe Grundgebühr je nach Konfiguration an die
    Plattform oder das verbundene Konto weiter. Gib den Gesamtbetrag und den
    geltenden kombinierten Satz im Feld für den individuellen Satz ein.

"freelance-project-estimate":
  "body": |
    Freelance-Projekte genau zu kalkulieren ist teils Mathematik, teils
    Risikomanagement. Kalkulierst du zu niedrig, arbeitest du unbezahlte Stunden.
    Kalkulierst du ohne Begründung zu hoch, verlierst du den Auftrag. Dieser
    Rechner startet mit dem, was du weißt (dein Satz, deine geschätzten Stunden
    und ein Risikopuffer), und liefert ein Angebot, das du direkt an den Kunden
    geben kannst.

    ## Die zweiteilige Formel

    **Basisschätzung** = Stundensatz × geschätzte Stunden
    **Gesamtangebot** = Basisschätzung × (1 + Puffer in %)

    Der Puffer ist kein Aufblähen und keine Unehrlichkeit, sondern ein
    Risikopolster für das Unvermeidliche: unklare Anforderungen, wachsender
    Umfang, Korrekturschleifen und Projektmanagement-Zeit, die du nicht
    ausdrücklich geschätzt hast.

    ## Welcher Puffer passt

    | Projektart | Empfohlener Puffer |
    |---|---|
    | Klare Vorgaben, vertraute Arbeit | 10–15 % |
    | Standardprojekt, einige Unbekannte | 20–25 % |
    | Neues Gebiet, unklare Anforderungen | 30–40 % |
    | F&E- / Discovery-Phasen | 50 %+ |

    Studien zu Softwareprojekten zeigen Überschreitungen der ursprünglichen
    Schätzung um 50–80 %. Ein Puffer von 20 % ist nicht aggressiv, sondern
    vorsichtig. Kunden, die den Puffer anzweifeln, sagen dir, dass sie
    Umfangsänderungen erwarten und nicht dafür zahlen wollen.

    ## Festpreis oder Aufwand

    Dieser Rechner erstellt ein **Festpreisangebot**. Alternativen:
    - **Nach Aufwand (Time & Material)**: Du rechnest tatsächliche Stunden zu deinem
      Satz ab. Weniger Risiko für dich, mehr gefühltes Risiko für den Kunden. Am
      besten für laufende oder offene Arbeit.
    - **Wertbasierte Preise**: Der Preis richtet sich nach dem Wert für den Kunden,
      nicht nach deinen Stunden. Schwerer zu positionieren, hebt aber die
      Obergrenze deines Verdiensts auf.

    ## Häufige Fragen

    **Aufschlüsselung zeigen oder nur die Summe?**
    Den meisten Kunden zeigst du nur die Summe. Stundensatz × Stunden aufzuführen
    lädt dazu ein, jede Komponente zu verhandeln, und lässt Kunden deinen Satz mit
    dem Markt vergleichen. Für die Kaufentscheidung reicht die Summe.

    **Wie gehe ich mit Anfragen außerhalb des Umfangs um?**
    Nimm eine Umfangsklausel in deinen Vertrag auf: Alles außerhalb der
    vereinbarten Leistungen wird separat angeboten. Verweise gelassen darauf, wenn
    der Umfang wächst („Gern, ich schicke dir kurz ein Angebot für die
    Zusatzarbeit“), statt es stillschweigend zu schlucken.
"freelance-rate-calculator":
  "body": |
    Einen Freelance-Satz ohne systematische Rechnung festzulegen, ist einer der
    häufigsten Gründe, warum Freelancer zu wenig verlangen. Die Zahl, die du
    brauchst, ist nicht dein altes Gehalt geteilt durch 2.080, sondern diese Zahl
    *plus* Steuern, *plus* Betriebsausgaben, *plus* ein Ausgleich dafür, dass du
    wahrscheinlich nicht jede gearbeitete Stunde abrechnen kannst.

    Dieser Rechner startet mit deinem **jährlichen Einkommensziel** und rechnet
    rückwärts den Mindeststundensatz aus, den du verlangen musst, um es zu
    erreichen, unter Berücksichtigung dreier Faktoren:

    **1. Nicht abrechenbare Zeit.** E-Mails beantworten, Angebote schreiben,
    Buchhaltung und Weiterbildung kosten Zeit, die du Kunden nicht berechnen
    kannst. Die meisten Freelancer rechnen 60–70 % ihrer Arbeitszeit ab.

    **2. Steuern.** Selbstständige zahlen Einkommensteuer *plus*
    Selbstständigen-Abgaben (in den USA Social Security + Medicare ≈ 15,3 %), weil
    Arbeitgeber normalerweise die Hälfte der Lohnabgaben für ihre Angestellten
    übernehmen. Als Freelancer zahlst du beide Hälften.

    **3. Betriebsausgaben.** Software-Abos, Ausstattung, Büro oder Coworking,
    Krankenversicherung, Weiterbildung und Steuerberatung schmälern den Umsatz,
    der dir nach Ausgaben bleibt.

    ## Häufige Fragen

    **Warum wirkt mein „echter Satz“ so viel höher als das, was Angestellte verdienen?**
    Weil er es ist. Ein Vollzeitangestellter mit 100.000 $ Gehalt kostet seinen
    Arbeitgeber insgesamt rund 130.000–145.000 $ (Zusatzleistungen, Lohnabgaben,
    Ausstattung, Büro). Als Freelancer trägst du all das selbst, dazu das Risiko
    nicht abrechenbarer Zeit und von Einkommenslücken zwischen Kunden.

    **Sollte ich jemals unter meinem Mindestsatz arbeiten?**
    Für einen strategischen Kunden, der Referenzen, Empfehlungen oder Zugang zu
    besser bezahlten Aufträgen bringt, ist ein befristeter Rabatt eine legitime
    Geschäftsentscheidung, solange du sie bewusst triffst und nicht, weil du die
    Steuern vergessen hast.

    **Wie erhöhe ich meinen Satz bei Bestandskunden?**
    Kündige es 60–90 Tage vorher an, begründe es mit dem Wert („mein Satz steigt
    auf X, weil ich jetzt Y liefere“) und bleib dabei. Die meisten Kunden, die zum
    neuen Satz bleiben, respektieren deine Zeit danach mehr.
"invoice-total-calculator":
  "body": |
    Rechnungssoftware ist ideal für Stammkunden. Wenn du aber schnell eine Summe
    für ein Angebot, eine Kostenaufstellung für eine Kunden-E-Mail oder eine
    Plausibilitätsprüfung vor dem Rechnungsversand brauchst, ist ein einfacher
    Rechner schneller, als dein Rechnungstool zu öffnen.

    Dieser Rechner verarbeitet bis zu vier Positionen, optional Rabatt und
    Steuer/MwSt., und erstellt eine kopierfertige Textzusammenfassung der
    gesamten Aufstellung.

    ## Wann du diesen Rechner nutzt

    - **Angebotsphase**: die Summe schnell durchrechnen, bevor du dich schriftlich auf einen Preis festlegst
    - **Zwischenstände mit Kunden**: laufende Summe der bisher erledigten Arbeit zeigen
    - **Mehrwährungs-Check**: die Rechnung prüfen, bevor du sie ins Rechnungstool überträgst
    - **Steuerprüfung**: MwSt.- oder Sales-Tax-Betrag vor dem Versand bestätigen

    ## Positionsstrategien für Freelancer

    **Wertorientierte Positionen**: Statt „40 Stunden Entwicklung“ schreibst du
    „Redesign und Entwicklung der Website“. So richtet sich der Blick des Kunden
    auf das Ergebnis statt auf die Zeit.

    **Abrechnung nach Meilensteinen**: Teile Projekte in zwei oder drei Rechnungen
    (z. B. 50 % vorab, 25 % zur Halbzeit, 25 % bei Abgabe). Das schützt dich vor
    Zahlungsausfällen und hilft Kunden bei ihrer Liquidität.

    **Auslagen**: Füge Positionen für Auslagen (Stockfotos, Schriften, Tools,
    Reisen) mit kurzer Beschreibung hinzu. Berechne sie zum Selbstkostenpreis,
    sofern dein Vertrag keinen Aufschlag vorsieht.

    ## Steuern und MwSt.

    Bei B2B-Leistungen innerhalb der EU gilt in der Regel das
    Reverse-Charge-Verfahren: Du berechnest Geschäftskunden in anderen
    EU-Mitgliedstaaten keine MwSt., musst aber „Steuerschuldnerschaft des
    Leistungsempfängers“ auf der Rechnung vermerken. Bei B2C-Leistungen in der EU
    musst du unter Umständen MwSt. zum Satz des Kundenlandes erheben. Klär deine
    Situation mit deiner Steuerberatung.

    Für US-Freelancer fällt in den meisten Bundesstaaten keine Sales Tax auf
    Dienstleistungen an (Ausnahmen: manche digitalen Leistungen). Prüf die Regeln
    deines Bundesstaats, bevor du Steuern berechnest.

    ## Häufige Fragen

    **Wie füge ich mehr als 4 Positionen hinzu?**
    Für längere Rechnungen nutzt du besser ein richtiges Rechnungstool (Bonsai,
    FreshBooks oder HoneyBook sind für Freelancer gemacht). Dieser Rechner ist für
    schnelle Schätzungen und einfache Rechnungen optimiert.

    **Stundensatz zeigen oder nur die Positionssumme?**
    Den meisten Kunden zeigst du nur die Summe pro Leistung. „40 Stunden × 125 $“
    lädt zum Verhandeln des Satzes ein, „Entwicklung: 5.000 $“ positioniert dich
    als jemand, der ein Ergebnis liefert.
"salary-to-hourly-calculator":
  "body": |
    Ob du als Freelancer deinen Satz mit Angestelltengehältern vergleichst, als
    Arbeitgeber eine Vertragsstelle bepreist oder einfach wissen willst, was dein
    Jahresgehalt pro Stunde bedeutet: Dieser Rechner erledigt die Umrechnung
    sofort und ohne Anmeldung.

    Für Bruttowerte ist die Rechnung einfach:
    **Stundensatz** = Jahresgehalt ÷ (Wochen pro Jahr × Stunden pro Woche)

    Standardmäßig gelten 52 Wochen pro Jahr und 40 Stunden pro Woche. Du kannst
    beide Werte anpassen, nützlich für:
    - Teilzeitkräfte (z. B. 20 Stunden pro Woche)
    - Mehr oder weniger als 52 bezahlte Wochen (z. B. bei unbezahltem Urlaub)
    - Angestellte, deren bezahlter Urlaub im Gehalt enthalten ist

    ## Stundensatz vor und nach Steuern

    Der Rechner schätzt einen Stundensatz nach Steuern für die üblichen
    US-Bundessteuerstufen (10 %, 12 %, 22 %, 24 %, 32 %, 35 %, 37 %). Hinweis: Das
    ist eine vereinfachte Schätzung ohne Steuern der Bundesstaaten, Abzüge oder
    Veranlagungsart. Nutze sie für grobe Vergleiche, nicht für die Steuerplanung.

    ## Häufige Fragen

    **Wie rechne ich einen Stundensatz in ein Jahresgehalt zurück?**
    Jährlich = Stundensatz × Stunden pro Woche × Wochen pro Jahr. Bei 40 h und 52
    Wochen: Stundensatz × 2.080 = jährlich.

    **Mein Vertrag nennt X $ pro Tag: Wie rechne ich das um?**
    Teile durch deine täglichen Stunden, um den Stundensatz zu erhalten, und
    multipliziere mit Wochenstunden und Wochen pro Jahr für den Jahreswert. Bei
    8-Stunden-Tagen: Tagessatz × 260 Arbeitstage = jährlich.

    **Warum verlangen Freelancer das 2- bis 3-Fache des vergleichbaren Angestellten-Stundensatzes?**
    Weil Arbeitgeberanteil an den Lohnabgaben, Zusatzleistungen, Ausstattung,
    Verwaltungsaufwand und das Risiko von Einkommenslücken beim Freelancer liegen
    statt beim Unternehmen. Die vollständige Aufschlüsselung findest du im
    Freelance-Stundensatz-Rechner.

"freelance-tax-estimator":
  "body": |
    Als Freelancer oder unabhängiger Auftragnehmer in den USA zahlst du sowohl den
    Arbeitnehmer- ALS AUCH den Arbeitgeberanteil zu Social Security und Medicare,
    zusammen **Self-Employment Tax (SE Tax)** genannt: 15,3 % des Nettogewinns.

    Anders als bei W-2-Angestellten behält niemand Steuern von deinen Zahlungen
    ein. Du musst vierteljährlich Vorauszahlungen leisten (15. April, 16. Juni,
    15. September, 15. Januar), um Säumniszuschläge des IRS zu vermeiden.

    ## So werden Freelance-Steuern berechnet

    **Schritt 1: Nettogewinn** = Bruttoeinnahmen − Betriebsausgaben

    **Schritt 2: SE Tax** = Nettogewinn × 15,3 %
    (Social Security 12,4 % bis 168.600 $ + Medicare 2,9 %, ohne Obergrenze)

    **Schritt 3: Abzug der SE Tax** = SE Tax × 50 %
    (Die Hälfte der SE Tax ist vom zu versteuernden Einkommen abziehbar)

    **Schritt 4: zu versteuerndes Einkommen** = Nettogewinn − SE-Abzug + sonstige Einkünfte

    **Schritt 5: Bundeseinkommensteuer** = Grenzsteuersätze 2024 auf das zu versteuernde Einkommen

    **Schritt 6: Quartalszahlung** = (SE Tax + Bundeseinkommensteuer) ÷ 4

    ## Wichtige Abzüge, die deine Steuerlast senken

    - **Betriebsausgaben**: Software, Ausstattung, Weiterbildung, Arbeitszimmer
    - **Beiträge zur Krankenversicherung**: voll abziehbar, wenn du deine Police selbst zahlst
    - **Altersvorsorge**: SEP-IRA (bis 25 % des Nettogewinns, max. 69.000 $),
      Solo 401(k) (bis 23.000 $ Arbeitnehmeranteil + 25 % Arbeitgeberanteil) oder Roth IRA (7.000 $)
    - **Hälfte der SE Tax**: wird automatisch berechnet und abgezogen

    ## Option S-Corp

    Ab etwa 80.000 $ Nettogewinn sparen manche Freelancer mit der Wahl des
    S-Corp-Status. Du zahlst dir ein „angemessenes Gehalt“ (SE-Tax-pflichtig) und
    entnimmst den Rest als Ausschüttung (nicht SE-Tax-pflichtig). Die Ersparnis
    kann über 5.000 $ pro Jahr liegen, erfordert aber eine Lohnabrechnung und eine
    zusätzliche Steuererklärung. Sprich vorher mit einem Steuerberater (CPA).

    ## Häufige Fragen

    **Wann muss ich vierteljährliche Vorauszahlungen leisten?**
    Wenn du für das Jahr mit 1.000 $ oder mehr Steuern rechnest, verlangt der IRS
    Vorauszahlungen. Fällig sind sie am 15. April, 15. Juni, 15. September und
    15. Januar. Versäumte oder zu niedrige Zahlungen kosten einen Zuschlag
    (derzeit ~8 % pro Jahr auf den fehlenden Betrag).

    **Welche Ausgaben kann ich als Freelancer absetzen?**
    Jede übliche und notwendige Betriebsausgabe: Arbeitszimmer (eigener Raum),
    Software und Abos fürs Geschäft, Weiterbildung, Ausstattung, Internet
    (geschäftlicher Anteil), Berufshaftpflicht, Buchhaltungs- und
    Rechtsberatungskosten sowie Geschäftsreisen.
"payroll-tax-calculator":
  "body": |
    Arbeitgeber-Lohnabgaben erhöhen die Kosten jedes Angestellten um etwa 8–12 %
    zusätzlich zum Grundgehalt. Bei 75.000 $ Gehalt sind das 6.000–9.000 $
    zusätzliche Pflichtabgaben pro Jahr.

    ## Arbeitgeber-Lohnabgaben in den USA (2024)

    | Abgabe | Satz | Bemessungsgrenze |
    |----|------|-----------|
    | Social Security (Arbeitgeber) | 6,2 % | Erste 160.200 $ |
    | Medicare (Arbeitgeber) | 1,45 % | Unbegrenzt |
    | FUTA (Bundes-Arbeitslosenversicherung) | 0,6 %* | Erste 7.000 $ |

    *Nach Anrechnung der bundesstaatlichen Arbeitslosenabgabe. Der eigentliche
    FUTA-Satz beträgt 6 % und wird um bis zu 5,4 % Anrechnung gesenkt.

    ## Bundesstaatliche Abgaben nicht enthalten

    Dieser Rechner umfasst nur Bundesabgaben. Die meisten Bundesstaaten erheben
    zusätzlich eine Arbeitslosenabgabe (SUTA) mit Sätzen von 0,1 % bis über 10 %,
    je nach Einstufung des Arbeitgebers.

    ## Gesamtkosten eines Angestellten

    Die Vollkosten eines Angestellten umfassen:
    - Grundgehalt
    - Arbeitgeber-Lohnabgaben (~8–10 %)
    - Zuschuss zur Krankenversicherung (5.000–15.000 $ pro Jahr)
    - 401(k)-Zuschuss (3–5 % des Gehalts)
    - Ausstattung, Software, Büro

    Für die Budgetplanung rechne mit dem **1,25- bis 1,40-Fachen des Grundgehalts**
    als Gesamtkosten.
"vat-calculator":
  "body": |
    Wenn du einem Kunden in einem Land mit Mehrwertsteuer (Großbritannien, EU,
    Australien usw.) eine Rechnung stellst, musst du wissen, ob dein Preis netto
    (ohne MwSt.) oder brutto (inkl. MwSt.) ist, und den anderen Wert berechnen.
    Verwechselst du das, berechnest du dem Kunden zu wenig oder trägst die Steuer
    versehentlich selbst.

    Dieser Rechner funktioniert in beide Richtungen:

    **Steuer aufschlagen:** Nettopreis × (1 + Satz) = Bruttopreis
    **Steuer herausrechnen:** Bruttopreis ÷ (1 + Satz) = Nettopreis

    Standardsätze sind für gängige Regionen vorbelegt (Großbritannien: 20 %,
    EU-Standard: 20 %/23 %, australische GST: 10 %, kanadische GST: 5 %, USA:
    individuell). Du kannst auch jeden eigenen Satz eingeben.

    ## Wichtige Begriffe

    **Nettopreis (ohne MwSt. / ohne Steuer):** der Preis vor Steuern. Das ist dein
    Umsatz. Die MwSt., die der Kunde zahlt, geht an den Staat, nicht an dich.

    **Bruttopreis (inkl. MwSt.):** der Gesamtbetrag, den der Kunde einschließlich
    Steuer zahlt.

    **Registrierungsschwelle für MwSt. / GST:** In Großbritannien musst du dich für
    die MwSt. registrieren, sobald dein steuerpflichtiger Umsatz in 12 Monaten
    90.000 £ übersteigt (Stand 2024). Darunter berechnest du keine MwSt. und
    führst keine ab. Die US-Sales-Tax hat keine bundesweite Schwelle und
    unterscheidet sich je Bundesstaat.

    ## Häufige Fragen

    **Muss ich auf digitale Produkte für Kunden im Ausland MwSt. berechnen?**
    Nach EU-Recht musst du bei B2C-Verkäufen digitaler Produkte an Kunden in der
    EU die MwSt. zum Satz des Käuferlandes berechnen (EU-Regeln für digitale
    Dienstleistungen). Plattformen wie Stripe Tax, Paddle und Lemon Squeezy
    übernehmen das als „Merchant of Record“ automatisch. B2B-Verkäufe in der EU
    laufen meist über das Reverse-Charge-Verfahren (der Kunde führt die MwSt.
    selbst ab).

    **Was ist der Unterschied zwischen MwSt. und Sales Tax?**
    Die MwSt. wird auf jeder Produktionsstufe erhoben, und Geschäftskunden können
    sie als Vorsteuer zurückholen. Die US-Sales-Tax wird nur beim Endverkauf
    erhoben und ist für Unternehmen nicht erstattungsfähig. Beide trägt der
    Endverbraucher; die Mechanik für Unternehmen ist verschieden.
