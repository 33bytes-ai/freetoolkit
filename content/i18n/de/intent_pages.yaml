"favorable-vs-unfavorable-variance":
  "title": "Günstige vs. ungünstige Abweichung: die wichtigsten Unterschiede"
  "description": "Wie du erkennst, ob eine Budgetabweichung günstig oder ungünstig ist, warum sich die Richtung zwischen Umsatz- und Kostenpositionen umkehrt, und typische Fehler bei der Einordnung."
  "body": |
    Eine gleich hohe Abweichung kann eine gute oder eine schlechte Nachricht
    sein, je nachdem, auf welcher Budgetposition sie steht. Die Richtung falsch
    zu deuten, ist der häufigste Fehler im Abweichungsreporting.

    ## Die Regel

    | Art der Position | Ist > Budget | Ist < Budget |
    |-----------|-----------------|------------------|
    | Umsatz | Günstig | Ungünstig |
    | Kosten | Ungünstig | Günstig |

    Beim Umsatz ist mehr besser: Das Budget zu übertreffen ist günstig. Bei den
    Kosten ist weniger besser: Unter Budget zu bleiben ist günstig. Die
    Einordnung beschreibt die Wirkung auf den Gewinn, nicht das Vorzeichen der
    Zahl.

    ## Warum das so oft schiefgeht

    Eine Tabelle, die positive Abweichungen einfach grün und negative rot färbt,
    liegt bei Kostenpositionen falsch: Eine „positive“ Kostenabweichung
    (Überschreitung) ist eine schlechte Nachricht, würde aber mit einer naiven
    Farbregel grün markiert. Berechne günstig/ungünstig immer ausdrücklich nach
    Art der Position, statt dich nur auf das Vorzeichen zu verlassen.

    ## Ein Rechenbeispiel

    Marketing mit 50.000 $ budgetiert, 58.000 $ ausgegeben → Abweichung =
    +8.000 $ (16 % darüber) → **ungünstig**, weil eine Kostenposition
    überschritten wurde.

    Umsatz mit 200.000 $ budgetiert, 215.000 $ erreicht → Abweichung = +15.000 $
    (7,5 % darüber) → **günstig**, weil eine Umsatzposition übertroffen wurde.

    Beide Abweichungen sind positive Zahlen. Die eine ist eine gute, die andere
    eine schlechte Nachricht.

    ## Auch günstige Abweichungen verdienen einen Blick

    Eine große günstige Kostenabweichung ist nicht automatisch gut: Vielleicht
    hat sich ein Projekt verzögert (das Geld wird trotzdem ausgegeben, nur
    später) oder der Einstellungsplan wurde nicht erfüllt, was die Leistung
    schmälern kann. Untersuche große günstige Abweichungen genauso gründlich wie
    ungünstige.

    ## Häufige Fragen

    **Heißt „günstig“ immer gut fürs Unternehmen?**
    Nicht unbedingt. Weniger Marketingausgaben können auf der Budgetposition
    günstig, für die Pipeline aber ungünstig sein. Prüfe immer die Folgewirkung,
    nicht nur die Einordnung der Position.

    **Wie zeige ich günstig/ungünstig im Bericht?**
    Die meisten Finanzteams nutzen eine eigene Spalte oder ein Symbol (▲/▼ in
    Farbe), berechnet nach der Regel oben, statt des reinen Vorzeichens. So
    entfällt die Verwechslung von Umsatz und Kosten ganz.

    Nutze den [Budgetabweichungs-Rechner](/tools/budget-variance-calculator/):
    Er ordnet jede Abweichung je nach gewählter Positionsart automatisch als
    günstig oder ungünstig ein.
"what-is-budget-variance-analysis":
  "title": "Was ist eine Budgetabweichungsanalyse?"
  "description": "Ein verständlicher Leitfaden zur Budgetabweichungsanalyse: was sie misst, wie du sie berechnest und wie Finanzteams damit Probleme früh erkennen."
  "body": |
    Bei der Budgetabweichungsanalyse vergleichst du die tatsächlichen
    Finanzergebnisse mit dem Budget und untersuchst die Unterschiede. Sie gehört
    zu den grundlegendsten Disziplinen im Finanzmanagement und wird trotzdem am
    häufigsten ausgelassen.

    ## Die Grundrechnung

    $$\text{Abweichung} = \text{Ist} - \text{Budget}$$

    $$\text{Abweichung \%} = \frac{\text{Ist} - \text{Budget}}{|\text{Budget}|} \times 100$$

    Eine Abweichung allein ist nur eine Zahl. Analysieren heißt zu fragen,
    *warum* es sie gibt und ob sie sich in der nächsten Periode wiederholt.

    ## Warum Finanzteams Abweichungen monatlich analysieren

    Die monatliche Durchsicht erkennt Probleme, solange sie noch billig zu
    beheben sind. Eine Marketingposition, die im ersten Monat 40 % über Budget
    liegt, klärt ein kurzes Gespräch; dieselbe Überschreitung, zwei Quartale
    unbeachtet, wird zur Liquiditätskrise. Die Abweichungsanalyse ist das
    Frühwarnsystem zwischen „Wir haben ein Budget“ und „Wir halten es wirklich
    ein“.

    ## Umsatz- und Kostenabweichungen werden umgekehrt gelesen

    Eine positive Kostenabweichung (mehr ausgegeben als geplant) ist ungünstig.
    Eine positive Umsatzabweichung (mehr eingenommen als geplant) ist günstig.
    Beides zu verwechseln, ist der häufigste Fehler in Finanzpräsentationen:
    Bezeichne Abweichungen immer als günstig/ungünstig, nicht nur als
    positiv/negativ, damit nichts mehrdeutig bleibt.

    ## Drei Fragen, die jede Abweichungsprüfung beantworten sollte

    1. **Zeitverschiebung oder echte Lücke?** Marketingausgaben, die in Monat 2
       statt Monat 1 anfielen, sind keine echte Überschreitung, sondern eine
       Verschiebung.
    2. **Einmalig oder strukturell?** Eine große Einmalausgabe braucht keine
       Prozessänderung. Eine wiederkehrende Überschreitung von 15 % auf derselben
       Position jeden Monat schon.
    3. **Ändert das die Jahresprognose?** Wesentliche Abweichungen sollten deine
       Prognose aktualisieren, statt nur notiert und vergessen zu werden.

    ## Häufige Fragen

    **Ab welcher Größe sollte ich eine Abweichung untersuchen?**
    Die meisten Finanzteams nutzen eine Wesentlichkeitsschwelle, oft 5–10 % der
    budgetierten Position oder einen festen Betrag für kleinere Positionen.
    Darunter ist es normales Rauschen, darüber lohnt sich das Nachforschen.

    **Sollte jede Abteilung ihre eigenen Abweichungen prüfen?**
    Ja: Abteilungsleiter haben den operativen Kontext, den die Finanzabteilung
    nicht hat. Die Finanzabteilung meldet die Abweichung und stellt die Frage,
    die Abteilungsleitung erklärt die Ursache.

    Mit dem [Budgetabweichungs-Rechner](/tools/budget-variance-calculator/)
    berechnest du sofort die Abweichung in Betrag und Prozent für jede Position.
"how-to-reduce-days-sales-outstanding":
  "title": "So senkst du die Forderungslaufzeit (DSO) im B2B-SaaS"
  "description": "Eine hohe DSO bindet Cash in offenen Rechnungen. Dieser Ratgeber zeigt die wirksamsten Hebel, um die DSO im B2B-SaaS zu senken, von Zahlungsbedingungen bis zum automatisierten Mahnwesen."
  "body": |
    Die Forderungslaufzeit (DSO) ist einer der am besten steuerbaren Bestandteile
    des Cash Conversion Cycle. Jeder Tag weniger setzt Working Capital frei.

    Bei 5 Mio. $ ARR und 30 Tagen DSO: 5 Mio. $ ÷ 365 × 30 = **411.000 $ in Forderungen gebunden**.
    Senke die DSO auf 15 Tage: Die Forderungen fallen auf 205.000 $, **206.000 $ sofort frei**.

    ## Hebel 1: jährliche Vorauszahlung mit Rabatt verlangen

    Der stärkste DSO-Hebel im SaaS: 15–20 % Rabatt für jährliche Vorauszahlung.
    Jahreszahler haben DSO = 0, sobald sie zahlen. Monatszahler auf Rechnung haben
    DSO = 30–60.

    Wenn 30 % der Kunden von monatlich auf jährlich wechseln, kann sich die DSO
    halbieren.

    ## Hebel 2: von Rechnung auf automatische Kartenabbuchung umstellen

    Monatliche Rechnungen erzeugen DSO. Automatische Kartenabbuchungen haben
    DSO ≈ 0 (abgesehen von 1–2 Tagen Abwicklung).

    Für Self-Service- und KMU-Kunden: automatische Abbuchung verlangen. Für
    Enterprise: Rechnung beibehalten, aber Bedingungen verschärfen.

    ## Hebel 3: Mahnsequenzen automatisieren

    Richte automatische Erinnerungs-E-Mails ein:
    - 3 Tage vor Fälligkeit: „Rechnung bald fällig“
    - Tag 0 (Fälligkeit): „Rechnung heute fällig“
    - Tag 7: „Rechnung überfällig“
    - Tag 14: „Zweite Mahnung: Zahlung nötig, um eine Unterbrechung des Dienstes zu vermeiden“

    Automatisierte Sequenzen senken die DSO um 30–50 % gegenüber manueller
    Nachverfolgung.

    ## Hebel 4: Standard-Zahlungsziele verkürzen

    60 Tage → 30 Tage → 15 Tage → zahlbar bei Erhalt. Jede Verkürzung senkt die
    maximale DSO direkt. Große Kunden wehren sich vielleicht; bei kleineren
    Konten bleib bei den Standardbedingungen.

    ## Hebel 5: Überweisung für Enterprise verlangen

    Das Rückbuchungsrisiko bei Karten verleitet manche Großkunden zum Verzögern.
    Überweisungen sind schneller und ohne Rückbuchungsrisiko. Biete sie bei
    Enterprise-Rechnungen als Standard an.

    Mit dem [Cash-Conversion-Cycle-Rechner](/tools/cash-conversion-cycle-calculator/)
    siehst du, wie sich eine bessere DSO auf deinen gesamten CCC auswirkt.
"what-is-cash-conversion-cycle":
  "title": "Was ist der Cash Conversion Cycle? Ein Ratgeber zum Working Capital"
  "description": "Der Cash Conversion Cycle (CCC) misst, wie lange Cash im operativen Geschäft gebunden ist. Dieser Ratgeber erklärt DIO, DSO und DPO und wie du mit dem CCC die Effizienz deines Working Capital verbesserst."
  "body": |
    Der Cash Conversion Cycle (CCC) beantwortet eine Frage: Wie viele Tage
    vergehen zwischen deiner Ausgabe für Vorleistungen und dem Zahlungseingang
    deiner Kunden?

    **CCC = Lagerreichweite (DIO) + Forderungslaufzeit (DSO) − Verbindlichkeitenlaufzeit (DPO)**

    Ein niedrigerer CCC heißt, du verwandelst das operative Geschäft schneller in
    Cash und setzt Working Capital für Wachstum frei, ohne zusätzliche
    Finanzierung.

    ## Die drei Bestandteile

    ### DIO: Lagerreichweite in Tagen

    Wie lange Vorräte liegen, bevor sie verkauft werden.

    **DIO = durchschnittlicher Lagerbestand ÷ Herstellkosten × 365**

    Bei 500.000 $ durchschnittlichem Bestand und 3 Mio. $ jährlichen Herstellkosten: DIO = 60,8 Tage.

    Niedrigere DIO = schnellerer Lagerumschlag = weniger Cash im Bestand.

    ### DSO: Forderungslaufzeit

    Wie lange es nach einem Verkauf dauert, bis das Geld eingeht.

    **DSO = durchschnittliche Forderungen ÷ Umsatz × 365**

    Bei 400.000 $ durchschnittlichen Forderungen und 5 Mio. $ Umsatz: DSO = 29,2 Tage.

    Eine hohe DSO deutet auf langsames Inkasso hin: lockere Zahlungsbedingungen,
    späte Rechnungsstellung oder Kunden, die spät zahlen.

    ### DPO: Verbindlichkeitenlaufzeit

    Wie lange du brauchst, um Lieferanten zu bezahlen.

    **DPO = durchschnittliche Verbindlichkeiten ÷ Herstellkosten × 365**

    Bei 200.000 $ durchschnittlichen Verbindlichkeiten und 3 Mio. $ Herstellkosten: DPO = 24,3 Tage.

    Höhere DPO = du hältst das Cash länger = besser fürs Working Capital.

    ## Den CCC für die Planung nutzen

    Unternehmen mit hohem CCC brauchen mehr Working Capital (und oft
    Kreditlinien), um Wachstum zu finanzieren. Unternehmen mit niedrigem oder
    negativem CCC wachsen mit minimaler Fremdfinanzierung.

    Wenn du den Umsatz verdoppeln willst, wächst dein Working-Capital-Bedarf
    ungefähr proportional zum CCC: 65 Tage CCC bei doppeltem Umsatz bedeuten
    doppelt so viel gebundenes Cash.

    Berechne deinen CCC mit dem [Cash-Conversion-Cycle-Rechner](/tools/cash-conversion-cycle-calculator/).
"working-capital-management-saas":
  "title": "Working-Capital-Management für SaaS-Unternehmen"
  "description": "SaaS-Unternehmen haben eine eigene Working-Capital-Dynamik. Dieser Ratgeber erklärt, wie der CCC bei SaaS funktioniert, warum die meisten negatives Working Capital haben und wie du es optimierst."
  "body": |
    Working Capital ist die Differenz zwischen Umlaufvermögen und kurzfristigen
    Verbindlichkeiten. Es gut zu steuern heißt, Cash verfügbar zu haben, wenn du
    es brauchst, ohne dich zu überfinanzieren.

    Für SaaS ist Working-Capital-Management einfacher als für
    Produktunternehmen, aber trotzdem wichtig, vor allem mit wachsender Größe.

    ## Warum SaaS oft negatives Working Capital hat

    Ein SaaS mit jährlicher Abrechnung und monatlichen Verbindlichkeiten hat:
    - **DIO = 0** (kein Lager, alles digital)
    - **DSO ≈ 0** (Kunden zahlen im Voraus oder per automatischer Abbuchung)
    - **DPO = 30–60 Tage** (AWS, Gehälter, Dienstleister werden 30–60 Tage nach der Leistung bezahlt)

    **CCC = 0 + 0 − 45 = −45 Tage**

    Ein negativer CCC heißt, das Unternehmen arbeitet mit Lieferantenkredit: Es
    kassiert, bevor es bezahlen muss. Das erzeugt von selbst Cash.

    Zum Vergleich ein Dienstleister, der mit 30 Tagen Ziel abrechnet und
    Lieferanten nach 60 Tagen bezahlt:
    - DSO = 30 Tage, DPO = 60 Tage
    - CCC = 30 − 60 = −30 Tage (weiterhin negativ, aber weniger)

    ## Wann das Working Capital eines SaaS positiv wird

    Das Working Capital eines SaaS kann positiv werden, wenn:
    - Große Enterprise-Deals mit 30–60 Tagen Ziel abgerechnet werden (Forderungen wachsen)
    - Einstellungen und Ausgaben schneller wachsen als die Zahlungseingänge
    - Passive Rechnungsabgrenzungen aus Jahresverträgen nicht mit Cash-Reserven gedeckt sind

    Ein SaaS mit 10 Mio. $ ARR, davon 50 % Enterprise (45 Tage Zahlungsziel):
    - Enterprise-Forderungen: 5 Mio. $ ÷ 365 × 45 ≈ 616.000 $ jederzeit offen
    - Nicht unerheblich, und bei 20 Mio. $ ARR doppelt so viel, wenn sich die Prozesse nicht ändern

    ## Working Capital im SaaS optimieren

    1. **Jährliche Vorauszahlung** bei Enterprise durchsetzen: weniger Forderungen, bessere DSO
    2. **Monatliche Abrechnung automatisieren** für KMU und Mid-Market: Forderungen verschwinden
    3. **Zahlungsziele verlängern** bei wichtigen Lieferanten (Cloud, Freelancer): höhere DPO
    4. **Eine Kreditlinie für Zeitlücken nutzen**: kurzfristigen Working-Capital-Bedarf
       ohne Verwässerung überbrücken

    Berechne deinen CCC und verfolge dein Working Capital mit dem
    [Cash-Conversion-Cycle-Rechner](/tools/cash-conversion-cycle-calculator/).
"accounts-receivable-turnover-ratio":
  "title": "Forderungsumschlag: Formel, Berechnung und Richtwerte"
  "description": "Wie du den Forderungsumschlag berechnest, was er über die Effizienz deines Inkassos aussagt, und Branchenrichtwerte nach Geschäftsart."
  "body": |
    ## Was ist der Forderungsumschlag?

    Der Forderungsumschlag misst, wie oft pro Periode ein Unternehmen seinen
    durchschnittlichen Forderungsbestand einnimmt:

    **Forderungsumschlag = Netto-Kreditverkäufe ÷ durchschnittliche Forderungen**

    Ein Wert von 12× bedeutet, dass das Unternehmen seinen gesamten
    Forderungsbestand 12-mal pro Jahr einnimmt, also etwa alle 30 Tage.

    ## Forderungsumschlag vs. DSO

    Beide Kennzahlen messen die Inkassogeschwindigkeit aus verschiedenen
    Blickwinkeln:

    | Forderungsumschlag | Entsprechende DSO |
    |---|---|
    | 18× | ~20 Tage |
    | 12× | ~30 Tage |
    | 8× | ~45 Tage |
    | 6× | ~60 Tage |
    | 4× | ~90 Tage |

    **DSO = 365 ÷ Forderungsumschlag**

    ## So berechnest du die durchschnittlichen Forderungen

    Für ein Quartal: (Forderungen zu Beginn + Forderungen am Ende) ÷ 2

    Beispiel:
    - Forderungen zu Beginn von Q3: 120.000 $
    - Forderungen am Ende von Q3: 150.000 $
    - Durchschnittliche Forderungen: 135.000 $
    - Netto-Kreditverkäufe in Q3: 540.000 $
    - Forderungsumschlag (annualisiert): (540.000 $ × 4) ÷ 135.000 $ = 16×
    - Entsprechende DSO: 365 ÷ 16 = 22,8 Tage

    ## Richtwerte nach Branche

    | Branche | Üblicher Umschlag | Übliche DSO |
    |---|---|---|
    | SaaS (Abo) | 18–52× | 7–20 Tage |
    | Professionelle Dienstleistungen | 6–10× | 36–60 Tage |
    | B2B-Industrie | 5–8× | 45–73 Tage |
    | Bau | 4–7× | 52–91 Tage |
    | Gesundheitswesen | 5–9× | 40–73 Tage |

    Berechne Forderungsumschlag und DSO mit dem
    [DSO-Rechner](/tools/dso-calculator/).
"how-to-reduce-dso":
  "title": "So senkst du die DSO und kassierst schneller"
  "description": "Praktische Hebel zur Senkung der Forderungslaufzeit, von besserer Rechnungsstellung über die Kreditpolitik bis zu Zahlungsanreizen."
  "body": |
    ## Warum eine niedrigere DSO zählt

    Jeder Tag weniger DSO setzt Cash in Höhe deines Tagesumsatzes frei. Ein Unternehmen mit 5 Mio. $ Jahresumsatz, das die DSO von 45 auf 30 Tage senkt, setzt ~205.000 $ Working Capital frei.

    ## Konkrete Hebel

    **Schneller abrechnen:**
    - Rechnung am Liefertag schicken, nicht zum Monatsende
    - E-Rechnungen nutzen, um Postlaufzeiten zu vermeiden
    - Wiederkehrende Rechnungen für Abos automatisieren

    **Systematisch nachfassen:**
    - Tag 1 nach Fälligkeit: freundliche Erinnerungs-E-Mail
    - Tag 15: telefonisch nachfassen
    - Tag 30: an die Geschäftsführung eskalieren
    - Ab Tag 45: Inkassoverfahren oder Klärung des Streitfalls

    **Frühe Zahlung belohnen:**
    - Skonto anbieten (siehe [Skonto-Rechner](/tools/invoice-discount-calculator/))
    - Verzugsgebühren erheben (vorher lokale Vorschriften prüfen)
    - Dynamisches Skonto über Kreditoren- und Debitorenplattformen

    **Kreditpolitik anpassen:**
    - Von Neukunden Anzahlung oder Vorauszahlung verlangen
    - Zahlungsziele für säumige Kunden verkürzen
    - Bonität prüfen, bevor du Zahlungsziele gewährst

    ## DSO im Branchenkontext

    Was eine „gute“ DSO ist, hängt stark von Branche und Kundentyp ab:
    - **Einzelhandel**: nahe null (Bar- oder Kartenzahlung)
    - **Kleines B2B**: 20–35 Tage
    - **Enterprise-B2B**: 45–75 Tage
    - **Öffentliche Aufträge**: 60–120 Tage

    Verfolge deine DSO monatlich mit dem [Forderungsumschlag-Rechner](/tools/dso-calculator/).
"what-is-accounts-receivable-turnover":
  "title": "Was ist der Forderungsumschlag?"
  "description": "Definition, Formel und Richtwerte für den Forderungsumschlag und die Forderungslaufzeit (DSO)."
  "body": |
    ## Forderungsumschlag

    Der Forderungsumschlag misst, wie oft pro Jahr ein Unternehmen seinen durchschnittlichen Forderungsbestand einnimmt:

    $$\text{Forderungsumschlag} = \frac{\text{Netto-Kreditverkäufe}}{\text{Durchschnittliche Forderungen}}$$

    Ein Wert von 12 bedeutet, dass du deinen durchschnittlichen Forderungsbestand alle 30 Tage einnimmst.

    ## DSO: Forderungslaufzeit

    Die DSO drückt den Forderungsumschlag in Tagen aus, was den Vergleich mit Zahlungszielen erleichtert:

    $$\text{DSO} = \frac{\text{Durchschnittliche Forderungen}}{\text{Netto-Kreditverkäufe}} \times 365$$

    DSO und Forderungsumschlag sind mathematisch invers: hoher Umschlag = niedrige DSO.

    ## Warum der Forderungsumschlag zählt

    Langsames Inkasso bindet Working Capital. Ein Unternehmen mit 500.000 $ Forderungen, wo 300.000 $ reichen würden, hat unnötig 200.000 $ Cash gebunden, Geld, das den Betrieb finanzieren oder Schulden tilgen könnte.

    Wer den Forderungsumschlag über die Zeit verfolgt, erkennt Inkassotrends, bevor sie zur Liquiditätskrise werden.

    Mit dem [Forderungsumschlag-Rechner](/tools/dso-calculator/) berechnest du Kennzahl und DSO.
"working-capital-impact-of-dso":
  "title": "Wirkung der DSO auf das Working Capital: Schnelleres Inkasso setzt Cash frei"
  "description": "Wie du berechnest, wie viel Cash eine bessere DSO freisetzt, und warum effizientes Inkasso oft der schnellste Weg zu mehr Working Capital ist, ohne Kapital aufzunehmen."
  "body": |
    ## DSO und Working Capital

    Das Working Capital (Umlaufvermögen minus kurzfristige Verbindlichkeiten)
    entscheidet, ob ein Unternehmen seinen Betrieb ohne externe Finanzierung
    stemmen kann. Bei B2B-Unternehmen sind Forderungen meist der größte Posten
    des Umlaufvermögens, die DSO treibt also direkt den Working-Capital-Bedarf.

    ## Die Rechnung

    **Freigesetztes Cash = Tagesumsatz × DSO-Verbesserung (Tage)**

    Tagesumsatz = Jahresumsatz ÷ 365

    Beispiele:
    - Unternehmen mit 2 Mio. $ ARR: 15 Tage weniger DSO setzen **82.000 $** frei
    - Unternehmen mit 5 Mio. $ ARR: 15 Tage weniger DSO setzen **205.000 $** frei
    - Unternehmen mit 10 Mio. $ ARR: 15 Tage weniger DSO setzen **411.000 $** frei

    ## Die DSO als kostenlose Kapitalquelle

    Eine bessere DSO ist wirtschaftlich wie schuldenfreies Kapital:
    - Keine Verwässerung (anders als Eigenkapitalfinanzierung)
    - Keine Zinsen (anders als Fremdkapital)
    - Dauerhafte Verbesserung (anders als ein einmaliger Betriebsmittelkredit)

    Wer die DSO um 20 Tage senkt, „nimmt“ faktisch 20 Tagesumsätze an Working
    Capital auf, ohne Kosten.

    ## Wenn sich die DSO verschlechtert

    Eine steigende DSO ist eines der frühesten Warnsignale für Probleme:

    1. **Liquiditätsengpässe bei Kunden**: Kunden zahlen später, weil ihnen Cash
       fehlt, ein Frühindikator für mögliche Forderungsausfälle
    2. **Qualität der Verkäufe**: Neukunden mit schwächerer Bonität werden
       gewonnen, um den Umsatz zu steigern
    3. **Rechnungsfehler**: Streitfälle halten Zahlungen auf
    4. **Zu wenig Einsatz im Inkasso**: Das Team fasst nicht systematisch nach

    Verfolge deine DSO monatlich und untersuche jeden Anstieg über 5 Tage.
    Nutze den [DSO-Rechner](/tools/dso-calculator/).
"fcf-vs-ebitda":
  "title": "Free Cashflow vs. EBITDA: die wichtigsten Unterschiede für SaaS"
  "description": "FCF und EBITDA messen beide die Cash-Erzeugung, behandeln Investitionsausgaben aber unterschiedlich. Wann welche Kennzahl zählt und warum der FCF der stärkere Indikator ist."
  "body": |
    EBITDA und FCF sind beliebte Maße der Cash-Erzeugung, beantworten aber
    unterschiedliche Fragen. Wer den Unterschied kennt, kommuniziert Zahlen
    klarer gegenüber Investoren und verteilt Kapital besser.

    ## Was das EBITDA misst

    **EBITDA = Jahresüberschuss + Zinsen + Steuern + Abschreibungen auf Sachanlagen + Abschreibungen auf immaterielle Vermögenswerte**

    Das EBITDA bereinigt den Gewinn um:
    - Zinsaufwand (Entscheidungen zur Kapitalstruktur)
    - Steuersätze (Unterschiede zwischen Ländern)
    - Abschreibungen (nicht zahlungswirksame Aufwendungen)

    Das EBITDA eignet sich, um die Profitabilität von Unternehmen mit
    unterschiedlicher Kapitalstruktur, Abschreibungspolitik oder Steuerlast zu
    vergleichen. Es ist auch eine übliche Größe in LBO-Modellen und
    Kreditauflagen (Nettoverschuldung / EBITDA).

    ## Was der FCF misst

    **FCF = operativer Cashflow − Investitionsausgaben**

    Der FCF geht weiter als das EBITDA: Er zieht das tatsächlich investierte
    Cash ab. Anders als Abschreibungen (die das EBITDA hinzurechnet) ist Capex
    echtes Geld, das das Unternehmen verlässt.

    Der FCF beantwortet: „Wie viel Cash bleibt, nachdem die Investitionen für
    Erhalt und Wachstum des Geschäfts bezahlt sind?“

    ## Warum die Lücke zählt

    Bei SaaS mit minimalem Capex (Server, Laptops) gilt EBITDA ≈ FCF. Der
    Unterschied liegt meist bei 2–5 % des Umsatzes.

    Bei kapitalintensiven Geschäften ist die Lücke gewaltig:

    | Geschäftsart | EBITDA-Marge | Capex / Umsatz | FCF-Marge |
    |---|---|---|---|
    | Cloud-SaaS | 20 % | 2 % | 18 % |
    | On-Premise-Software | 25 % | 5 % | 20 % |
    | Telekommunikation | 35 % | 20 % | 15 % |
    | Industrie | 15 % | 12 % | 3 % |

    ## Wann welche Kennzahl

    **Nutze das EBITDA, wenn du:**
    - Unternehmen derselben Branche mit unterschiedlicher Kapitalstruktur vergleichst
    - Verschuldungsgrade berechnest (Nettoverschuldung/EBITDA)
    - LBO- oder M&A-Bewertungen durchführst

    **Nutze den FCF, wenn du:**
    - Eigenkapital bewertest (P/FCF-Multiple)
    - die echte Qualität der Cash-Erzeugung beurteilst
    - über Dividenden oder Aktienrückkäufe entscheidest
    - capex-intensive mit asset-light Geschäftsmodellen vergleichst

    Für Investoren-Reporting ist der FCF das hochwertigere Signal. Das EBITDA
    lässt sich aufpolieren; beim FCF muss das Cash wirklich auf dem Konto sein.

    Berechne den FCF mit dem [Free-Cashflow-Rechner](/tools/free-cash-flow-calculator/).
"how-to-improve-fcf-margin":
  "title": "So verbesserst du die Free-Cashflow-Marge: 5 Hebel für SaaS"
  "description": "FCF-Marge = FCF / Umsatz. Die fünf wirksamsten Hebel, um die FCF-Marge zu steigern, von geringerer Capex-Intensität bis zu besserem Working-Capital-Management."
  "body": |
    Die FCF-Marge ist der Free Cashflow geteilt durch den Umsatz. Sie zu
    verbessern heißt, mehr Cash pro Umsatzdollar zu erzeugen oder die
    Investitionsausgaben zu senken. Hier sind die fünf wirksamsten Hebel für
    Softwareunternehmen.

    ## Hebel 1: Kunden auf jährliche Abrechnung umstellen

    Jährliche Vorauszahlungen verbessern den FCF deutlich, ohne Umsatz oder
    EBITDA zu ändern. Zahlt ein Kunde 12.000 $ im Voraus statt 1.000 $ pro Monat:
    - bleibt die Umsatzerfassung gleich (1/12 pro Monat)
    - ist das eingenommene Cash am ersten Tag 12-mal so hoch
    - verbessert sich das Working Capital um ~11 Monate MRR pro umgestelltem Kunden

    Stellst du 30 % der Monatskunden mit 10 % Rabatt auf jährlich um, kann der
    FCF im Umstellungsjahr um 15–20 % des ARR steigen.

    Taktik: Biete 1–2 Monate Rabatt für jährliche Vorauszahlung. Formuliere es
    als „2 Monate gratis“ statt als Prozentsatz, das wirkt wertvoller.

    ## Hebel 2: Brutto-Capex senken (Infrastruktureffizienz)

    Bei SaaS erscheinen Infrastrukturkosten (Cloud-Rechenleistung, Speicher) oft
    als Betriebskosten statt als Capex. Effizientere Infrastruktur verbessert
    aber direkt den OCF und damit den FCF.

    Übliche Verbesserungen:
    - Reservierte Instanzen richtig dimensionieren (AWS/GCP Savings Plans)
    - Ungenutzte Rechenleistung und Autoscaling-Potenzial finden
    - Datenbankabfragen optimieren, um Rechenkosten zu senken

    20 % mehr Effizienz bei 200.000 $ Cloud-Ausgaben pro Jahr bringen 40.000 $
    mehr OCF: eine direkte FCF-Verbesserung.

    ## Hebel 3: Inkasso verbessern (DSO senken)

    Forderungslaufzeit (DSO) = Forderungen / Umsatz × 365

    Eine hohe DSO heißt, der Umsatz wird erfasst, bevor das Cash da ist: eine
    Working-Capital-Last, die den OCF senkt. Die DSO bei 5 Mio. $ ARR von 45 auf
    30 Tage zu senken, setzt ~200.000 $ Cash frei.

    Taktiken:
    - Vor der Aktivierung eine hinterlegte Karte oder Lastschrift verlangen
    - Mahnsequenzen für fehlgeschlagene Zahlungen automatisieren
    - 1–2 % Skonto auf Enterprise-Rechnungen anbieten

    ## Hebel 4: Zahlungszeitpunkte bei Lieferanten steuern

    Verbindlichkeitenlaufzeit (DPO) = Verbindlichkeiten / Herstellkosten × 365

    Zahlungsziele bei wichtigen Lieferanten von 30 auf 45 Tage zu verlängern,
    bringt Working Capital. Bei 500.000 $ Lieferantenzahlungen pro Jahr ergibt
    die Verlängerung von 30 auf 45 Tage ~20.000 $ zusätzlichen Spielraum.

    Hinweis: Längere Zahlungsziele können Lieferantenbeziehungen belasten. Mach
    das bei großen Lieferanten, die bessere Bedingungen verkraften, nicht bei
    kleinen.

    ## Hebel 5: Capex-Intensität senken

    Bei reinem SaaS ist der Capex meist minimal. Ist er erheblich
    (Rechenzentrums-Hardware, Zukauf von geistigem Eigentum), prüfe:
    - Leasing oder Kauf der Ausrüstung
    - Cloud oder Colocation
    - Aufschub nicht kritischer Investitionen in Phasen mit wenig Wachstum

    Der Wechsel von eigener Hardware in die Cloud erhöht die Betriebskosten, senkt
    aber den Capex, und verbessert meist die FCF-Marge, auch wenn die
    Gesamtkosten ähnlich sind, weil Cloud-Kosten ohnehin nicht zum Capex zählen.

    Verfolge deine FCF-Marge über die Zeit mit dem [Free-Cashflow-Rechner](/tools/free-cash-flow-calculator/).
"what-is-free-cash-flow":
  "title": "Was ist der Free Cashflow? Definition, Formel und warum er zählt"
  "description": "Der Free Cashflow ist der operative Cashflow minus Capex: das echte Maß der Cash-Erzeugung eines Unternehmens. Formel, Richtwerte und warum Investoren den FCF dem Gewinn vorziehen."
  "body": |
    Der Free Cashflow (FCF) ist das Cash, das übrig bleibt, nachdem ein
    Unternehmen die Investitionsausgaben für Erhalt oder Ausbau seiner
    Vermögensbasis bezahlt hat. Es steht für Ausschüttungen an Aktionäre,
    Schuldentilgung oder Reinvestitionen ins Wachstum zur Verfügung.

    **Formel: FCF = operativer Cashflow − Investitionsausgaben**

    ## Warum Investoren auf den FCF schauen

    Buchgewinne lassen sich über Abschreibungspläne, den Zeitpunkt der
    Umsatzerfassung und periodengerechte Buchführung beeinflussen. Cashflow ist
    schwerer zu schönen. Ein Unternehmen mit 10 Mio. $ Gewinn und negativem FCF
    wirkt auf dem Papier profitabel, verbrennt aber Cash.

    Der Free Cashflow ist der Nenner eines der wichtigsten Bewertungsmultiples:
    **Kurs-FCF-Verhältnis (P/FCF)**. Ein Unternehmen, das zum 20-Fachen des FCF
    gehandelt wird (20 $ Marktkapitalisierung pro 1 $ FCF), bietet 5 %
    FCF-Rendite: die Cash-Erzeugung, für die du bezahlst.

    ## Wo du die Eingaben findest

    **Operativer Cashflow**: in der Kapitalflussrechnung unter „Cashflow aus
    laufender Geschäftstätigkeit“. Er beginnt mit dem Jahresüberschuss, rechnet
    nicht zahlungswirksame Aufwendungen (Abschreibungen) hinzu und berücksichtigt
    Veränderungen im Working Capital.

    **Investitionsausgaben (Capex)**: in der Kapitalflussrechnung unter
    „Cashflow aus Investitionstätigkeit“, meist als „Auszahlungen für
    Sachanlagen“ oder „Investitionsausgaben“. Immer eine negative Zahl
    (Mittelabfluss).

    Bei nicht börsennotierten Unternehmen gilt: OCF = Jahresüberschuss +
    Abschreibungen − Zunahme des Working Capital.

    ## FCF und verwandte Kennzahlen

    | Kennzahl | Was sie misst |
    |---|---|
    | Free Cashflow | Cash nach Capex, verfügbar für die Eigentümer |
    | EBITDA | Näherung an den operativen Cashflow vor Capex |
    | Jahresüberschuss | Buchgewinn, enthält nicht zahlungswirksame Posten |
    | Operativer Cashflow | Cash aus dem operativen Geschäft vor Capex |

    Bei SaaS ist der Capex meist gering (Server, Laptops), EBITDA und FCF liegen
    also nah beieinander. Bei kapitalintensiven Geschäften (Industrie,
    Immobilien) kann der FCF deutlich unter dem EBITDA liegen.

    ## Richtwerte für den FCF

    Hochwertige SaaS-Unternehmen erreichen im großen Maßstab 15–30 % FCF-Marge:
    - Veeva Systems: ~30 % FCF-Marge
    - Shopify: ~25 % FCF-Marge
    - HubSpot: ~18 % FCF-Marge
    - Salesforce: ~25 % FCF-Marge

    Unternehmen in der Frühphase (1–10 Mio. $ ARR) haben oft einen negativen FCF
    oder einen nahe null. Das ist normal, wenn die Unit Economics die Investition
    tragen.

    Berechne deinen mit dem [Free-Cashflow-Rechner](/tools/free-cash-flow-calculator/).
"should-you-offer-an-early-payment-discount":
  "title": "Solltest du Skonto für frühe Zahlung anbieten?"
  "description": "Die Rechnung aus Verkäufersicht: ob sich ein Skonto wie 2/10 netto 30 lohnt und wann es sinnvoll ist, eines anzubieten."
  "body": |
    Skonto beschleunigt den Zahlungseingang, ist aber faktisch ein Zins, den du
    zahlst, um früher Geld zu bekommen. Ob sich das lohnt, hängt davon ab, was dir
    das Cash gerade wert ist.

    ## Die implizite Jahresrate eines üblichen Skontos

    Die Bedingung 2/10 netto 30 (2 % Nachlass bei Zahlung innerhalb von 10 Tagen,
    sonst fällig nach 30) heißt: Du verzichtest auf 2 %, um 20 Tage früher als
    üblich bezahlt zu werden. Aufs Jahr gerechnet ergibt das ungefähr:

    $$\text{Impliziter Jahreszins} = \frac{\text{Skonto \%}}{100 - \text{Skonto \%}} \times \frac{365}{\text{Tage früher}}$$

    Für 2/10 netto 30: (2 ÷ 98) × (365 ÷ 20) ≈ **37 % pro Jahr**, ein
    überraschend hoher impliziter Zins für ein scheinbar kleines Skonto von 2 %.

    ## Wann es trotzdem sinnvoll ist

    - **Du hast eine rentablere Verwendung für das Cash**: Wenn dir schnelleres
      Cash einen teureren kurzfristigen Kredit oder eine Kreditlinie erspart, kann
      das Skonto günstiger sein als die alternative Finanzierung
    - **Deine Liquidität ist knapp**: Für ein Unternehmen mit echtem
      Working-Capital-Mangel kann Zahlung nach 10 statt 30 Tagen (oder später,
      denn „netto 30“ heißt in der Praxis oft „netto 45+“) echte Kosten wert sein
    - **Du willst das Ausfallrisiko senken**: Schnellere Zahlung verkürzt das
      Zeitfenster, in dem sich die Lage eines Kunden verschlechtern kann, bevor du
      bezahlt wirst

    ## Wann es sich nicht lohnt

    Wenn deine Liquidität nicht knapp ist und du keine konkrete rentable
    Verwendung für das Cash 20 Tage früher hast, ist ein impliziter Jahreszins von
    37 % und mehr ein teurer Weg, Geschwindigkeit zu kaufen. Die meisten
    Unternehmen in dieser Lage bieten besser kein Skonto an und setzen einfach
    ihre Standardbedingungen konsequent durch.

    ## Eine günstigere Alternative: kürzere Standardziele

    Statt Skonto zu gewähren, verkürze für Neukunden die Standard-Zahlungsziele
    (15 statt 30 Tage) oder verlange bei größeren Rechnungen eine Anzahlung. So
    kommt das Cash schneller, ohne dass du 37 % implizit dafür zahlst.

    ## Häufige Fragen

    **Nutzen die meisten Kunden das Skonto?**
    Die Quote schwankt stark nach Kundentyp und Liquidität. Gut kapitalisierte
    Kunden lassen es oft aus, weil 2 % für sie kaum zählen, während knappe Kunden
    es eher nutzen. Du subventionierst also womöglich genau die Kunden, die sonst
    am ehesten zu spät zahlen würden.

    **Gibt es einen Standard-Skontosatz?**
    2/10 netto 30 ist die gängigste Konvention, aber nichts schreibt diese Zahl
    vor: Berechne den impliziten Jahreszins jeder Kombination aus Nachlass und
    Tagen, bevor du sie anbietest.

    Mit dem [Skonto-Rechner](/tools/invoice-discount-calculator/) berechnest du
    die implizierten annualisierten Kosten jeder Skontobedingung, die du
    erwägst.
"what-is-2-10-net-30":
  "title": "Was bedeutet die Zahlungsbedingung 2/10 netto 30?"
  "description": "Die Bedingung 2/10 netto 30 erklärt: was sie bedeutet, wie du die annualisierten Kosten berechnest und wann Käufer das Skonto nutzen sollten."
  "body": |
    ## 2/10 netto 30 erklärt

    „2/10 netto 30“ ist eine gängige Lieferantenkredit-Bedingung und bedeutet:
    - **2 %** Skonto, wenn die Rechnung innerhalb von **10 Tagen** bezahlt wird
    - Voller Betrag fällig innerhalb von **30 Tagen**, wenn das Skonto nicht genutzt wird

    Auf Rechnungen steht sie als „2/10 N30“.

    ## Die echten Kosten des Skontoverzichts

    Auf ein Skonto von 2/10 netto 30 zu verzichten, entspricht einem Kredit zu 37,2 % effektivem Jahreszins:

    $$\frac{2\%}{98\%} \times \frac{365}{20 \text{ Tage}} = 37.2\%$$

    Du zahlst faktisch 2 %, um das Geld 20 Tage länger zu behalten. Das ist extrem teure Finanzierung.

    ## Wann du auf das Skonto verzichten solltest

    Der einzige rationale Grund für den Verzicht ist, dass deine Kapitalkosten unter den annualisierten Skontokosten liegen, und das ist bei 2/10 netto 30 selten der Fall.

    Wenn du wegen knapper Liquidität wirklich nicht früher zahlen kannst, ist das ein Working-Capital-Problem, das du getrennt lösen solltest. Denk an eine revolvierende Kreditlinie: Zu 8 % Kredit aufzunehmen, um ein Skonto mit 37 % Jahresrendite zu nutzen, lohnt sich eindeutig.

    Mit dem [Skonto-Rechner](/tools/invoice-discount-calculator/) berechnest du die annualisierten Kosten jeder Skontobedingung.
"when-to-take-early-payment-discount":
  "title": "Wann solltest du Skonto für frühe Zahlung nutzen?"
  "description": "Ein Entscheidungsrahmen, ob du Skonto nutzen solltest, mit dem Vergleich der annualisierten Kosten und den Folgen fürs Working Capital."
  "body": |
    ## Nutzen oder verzichten

    Nutze das Skonto, wenn: **annualisierte Skontokosten > deine Kapitalkosten**

    Verzichte, wenn: **annualisierte Skontokosten < deine Kapitalkosten**

    Bei 2/10 netto 30 mit 37,2 % annualisierten Kosten sollte fast jedes Unternehmen das Skonto nutzen. Die Frage ist nur, ob du das Cash hast.

    ## Entscheidungsmatrix

    | Liquidität | Kapitalkosten | Empfehlung |
    |--------------|----------------|----------------|
    | Stark | Beliebiger Satz | Skonto immer nutzen |
    | Knapp | Unter den Skontokosten | Kredit aufnehmen, um das Skonto zu nutzen |
    | Knapp | Über den Skontokosten | Verzichten: Cash zu halten ist günstiger |
    | Krise | Entfällt | Verzichten: Überleben geht vor |

    ## Wenn du selbst Skonto anbietest

    Bietest du Kunden Skonto an (als Verkäufer), dreht sich die Rechnung um: Dann zahlst du. Modelliere die Kosten sorgfältig: 2/10 netto 30 senkt deinen tatsächlich vereinnahmten Umsatz bei Frühzahlern um 2 %.

    Der [Skonto-Rechner](/tools/invoice-discount-calculator/) deckt die Sicht von Käufer und Verkäufer ab.
"free-cash-flow-formula-explained":
  "title": "Free Cashflow: Formel, Beispiele und warum er zählt"
  "description": "Was der Free Cashflow (FCF) ist, wie du ihn aus OCF und Capex berechnest und warum er die wichtigste Kennzahl für die Unternehmensbewertung ist."
  "body": |
    Der Free Cashflow (FCF) ist das Cash, das übrig bleibt, nachdem ein
    Unternehmen seine Betriebskosten und Investitionsausgaben gedeckt hat. Er
    steht für Wachstumsinvestitionen, Schuldentilgung, Dividenden oder den Aufbau
    von Reserven zur Verfügung.

    **Free Cashflow = operativer Cashflow − Investitionsausgaben**

    ## Warum der FCF der Goldstandard der Bewertung ist

    Die meisten ernsthaften Bewertungsmodelle beruhen auf abgezinsten Free
    Cashflows (DCF). Käufer und PE-Firmen bewerten Unternehmen mit einem
    Vielfachen des FCF statt des Umsatzes oder EBITDA, weil der FCF echtes,
    ausschüttbares Geld darstellt.

    Ein Unternehmen, bewertet mit dem 15-Fachen von 500.000 $ FCF pro Jahr, hat
    einen Unternehmenswert von 7,5 Mio. $.

    ## FCF-Rendite: die Abkürzung der Investoren

    **FCF-Rendite = FCF / Unternehmenswert**

    Eine FCF-Rendite von 5 % heißt, du verdienst jährlich 5 % des Kaufpreises als
    freies Cash, grob ein Multiple von 20× FCF. Die meisten Käufer verlangen
    mindestens 5–10 % FCF-Rendite.

    ## Welcher Capex dazugehört

    Zum Capex zählen:
    - Anschaffung von Ausrüstung
    - Büroausbau und Mietereinbauten
    - Aktivierte Softwareentwicklung (bei B2B-SaaS oft erheblich)
    - Fuhrpark und Maschinen

    NICHT zum Capex zählen:
    - Instandhaltungsreparaturen (Aufwand, nicht aktiviert)
    - Software-Abonnements (Betriebsaufwand)
    - F&E-Gehälter (Betriebsaufwand)

    ## Die FCF-Marge als Wachstumsmaßstab

    **FCF-Marge = FCF / Umsatz**

    Für SaaS zählt die FCF-Marge so viel wie das Umsatzwachstum. Die kombinierte
    Kennzahl (Wachstumsrate + FCF-Marge) wird zunehmend als Variante der Rule of
    40 genutzt.

    Mit dem [Rechner für operativen Cashflow](/tools/operating-cash-flow-calculator/)
    berechnest du OCF und FCF aus den Zahlen deiner GuV.
"operating-cash-flow-vs-net-income":
  "title": "Operativer Cashflow vs. Jahresüberschuss: Was ist der Unterschied?"
  "description": "Warum OCF und Jahresüberschuss auseinanderlaufen, was jeder misst und wie du beide zusammen nutzt, um die echte Profitabilität eines Unternehmens zu verstehen."
  "body": |
    Operativer Cashflow und Jahresüberschuss wollen beide die Profitabilität
    messen, erzählen aber sehr unterschiedliche Geschichten. Wer Abschlüsse
    richtig lesen will, muss beide verstehen.

    ## Was der Jahresüberschuss misst

    Der Jahresüberschuss (Gewinn) ist der Umsatz minus aller Kosten, wie in der
    GuV ausgewiesen. Er folgt der periodengerechten Buchführung: Umsatz wird
    erfasst, wenn er verdient ist, Aufwand wird der Periode zugeordnet, zu der er
    gehört.

    Ein Unternehmen kann also einen hohen Jahresüberschuss haben und kein Cash
    erhalten. Wer für 1 Mio. $ auf Rechnung verkauft und nichts kassiert, weist
    1 Mio. $ Jahresüberschuss und 0 $ Cash aus.

    ## Was der OCF misst

    Der operative Cashflow bereinigt den Jahresüberschuss um:

    1. **Nicht zahlungswirksame Aufwendungen** (Abschreibungen,
    aktienbasierte Vergütung): werden hinzugerechnet, weil sie den Gewinn
    mindern, aber kein Cash kosten

    2. **Veränderungen im Working Capital**: Forderungen, Vorräte und
    Verbindlichkeiten, also die zeitliche Lücke zwischen Umsatzerfassung und
    Zahlungseingang bzw. -ausgang

    OCF = Jahresüberschuss + nicht zahlungswirksame Aufwendungen + Veränderung des Working Capital

    ## Warum sie auseinanderlaufen

    **Fall 1: Unternehmen A**, schnelles Wachstum, hohe Forderungen
    Jahresüberschuss: 500.000 $. Kunden schulden 600.000 $ (noch nicht kassiert). OCF: negativ.
    Einordnung: Das Unternehmen ist profitabel, verbrennt aber Cash, um sein Wachstum zu finanzieren.

    **Fall 2: Unternehmen B**, reifes, anlageintensives Geschäft
    Jahresüberschuss: 200.000 $. Abschreibungen auf Anlagen: 300.000 $. OCF: 500.000 $.
    Einordnung: Die echte Cash-Erzeugung ist viel höher, als die GuV zeigt.

    ## Die Verlässlichkeit des OCF

    Erfahrene Investoren ziehen OCF und Free Cashflow dem Jahresüberschuss vor,
    weil:
    - Umsatzerfassung sich manipulieren lässt (vorziehen, aufschieben)
    - Abschreibungspläne Entscheidungen des Managements sind
    - Beim OCF das Geld tatsächlich auf dem Konto ankommen muss

    Ein Unternehmen mit dauerhaft hohem Jahresüberschuss, aber niedrigem OCF
    verdient einen genauen Blick.

    Mit dem [Rechner für operativen Cashflow](/tools/operating-cash-flow-calculator/)
    wandelst du deine GuV-Zahlen in den OCF um und siehst die Lücke.
"working-capital-impact-on-cash-flow":
  "title": "Working Capital und seine Wirkung auf den Cashflow"
  "description": "Wie Veränderungen bei Forderungen, Vorräten und Verbindlichkeiten den operativen Cashflow beeinflussen und wie du das Working Capital steuerst, um mehr Cash zu erzeugen."
  "body": |
    Working Capital ist die Differenz zwischen Umlaufvermögen (Cash, Forderungen,
    Vorräte) und kurzfristigen Verbindlichkeiten (Lieferantenverbindlichkeiten,
    Rückstellungen). Seine Veränderung ist oft der versteckte Treiber der Lücke
    zwischen Jahresüberschuss und operativem Cashflow.

    ## Die Working-Capital-Formel

    **Working Capital = Umlaufvermögen − kurzfristige Verbindlichkeiten**

    **Wirkung von Working-Capital-Veränderungen auf den OCF:**
    - Forderungen **steigen** → Cash ist noch nicht eingegangen → OCF sinkt
    - Vorräte **steigen** → Cash bezahlt, aber noch nicht verkauft → OCF sinkt
    - Verbindlichkeiten **steigen** → du schuldest Geld, hast aber noch nicht bezahlt → OCF steigt

    ## Typische Cash-Abflüsse im Working Capital

    **Langsamer Zahlungseingang**: Ein SaaS mit 1 Mio. $ ARR und 60 Tagen
    Zahlungsziel hat dauerhaft ~165.000 $ in Forderungen gebunden (zwei
    Monatsumsätze). Der Wechsel auf 15 Tage setzt sofort 125.000 $ frei, ohne
    den Umsatz zu ändern.

    **Lageraufbau**: E-Commerce-Händler, die vor der Hochsaison Bestand aufbauen,
    verbrauchen Cash Monate vor dem Umsatz. Sorgfältige Bestandsplanung
    entschärft diese Falle.

    **Vorauszahlungen**: Jahrespläne im Voraus abzurechnen erzeugt negatives
    Working Capital: Du erhältst Cash, bevor du den Umsatz erfasst. Einer der
    Gründe, warum SaaS-Firmen jährliche Vorauszahlung lieben.

    ## So verbesserst du das Working Capital

    1. **Skonto anbieten**: 1–2 % Nachlass bei Zahlung innerhalb von 10 Tagen
    (statt 30) ist für Käufer oft wirtschaftlich sinnvoll und beschleunigt deine
    Zahlungseingänge deutlich.

    2. **Auf jährliche Abrechnung umstellen**: Kunden von monatlich auf jährlich
    umzustellen bringt 12 Monate Cash im Voraus statt jeweils einem.

    3. **Lieferantenbedingungen verhandeln**: Zahlungsziele von 30 auf 60 Tage zu
    verlängern ist eine zinsfreie kurzfristige Finanzierung auf Kosten deiner
    Lieferanten.

    4. **Just-in-time-Lager**: Bei physischen Produkten senkst du die
    Lagerkosten, wenn du näher am tatsächlichen Bedarf bestellst.

    Mit dem [Rechner für operativen Cashflow](/tools/operating-cash-flow-calculator/)
    modellierst du, wie sich ein besseres Working Capital auf deinen Cashflow
    auswirkt.
"how-to-improve-working-capital":
  "title": "So verbesserst du dein Working Capital: 5 bewährte Strategien"
  "description": "Verbessere dein Working Capital, indem du Forderungen schneller einziehst, Lagerbestände steuerst, Zahlungsziele verlängerst und deinen Cash Conversion Cycle optimierst."
  "body": |
    Ein besseres Working Capital hängt an drei Hebeln: schneller kassieren,
    weniger Lager halten und Lieferanten später bezahlen (ohne die Beziehung zu
    beschädigen).

    ## 1. Forderungen schneller einziehen

    Jeder Tag, an dem eine Forderung offen bleibt, kostet Working Capital.
    - Auf automatische Abrechnung umstellen (Stripe-Abos, Lastschrift)
    - 1–2 % Skonto anbieten (lohnt sich oft gegenüber den Zinsen einer Kreditlinie)
    - Automatische Erinnerungen nach 15, 30 und 45 Tagen Verzug schicken
    - Von Neukunden Anzahlung oder Vorauszahlung verlangen

    ## 2. Lagerbestände optimieren

    Überbestand ist Working Capital, das im Lager festsitzt.
    - Mit Bedarfsprognosen den Sicherheitsbestand richtig bemessen
    - Mit wichtigen Lieferanten ein lieferantengesteuertes Lager (VMI) vereinbaren
    - Langsam drehende Artikel finden und abverkaufen

    ## 3. Zahlungsziele verlängern (ohne Lieferantenbeziehungen zu beschädigen)

    Lieferanten am 45. statt am 20. Tag zu bezahlen, setzt 25 Tage Working Capital frei.
    - Mit großen Lieferanten 45 oder 60 Tage Zahlungsziel verhandeln
    - Für kleinere Einkäufe Firmenkarten mit Zahlungsaufschub (30 Tage) nutzen
    - Vorrangig bei Lieferanten verlängern, die auf dein Volumen angewiesen sind

    ## 4. Eine revolvierende Kreditlinie für Lücken nutzen

    Eine Kreditlinie „repariert“ das Working Capital nicht, sie überbrückt
    saisonale Lücken. Halte deine Current Ratio auch nach der Inanspruchnahme
    über 1,5x.

    ## 5. Bei Abo-Geschäften auf jährliche Abrechnung umstellen

    Jährliche Vorauszahlung verwandelt künftige Forderungen in sofortiges Cash.
    SaaS-Unternehmen mit jährlicher Abrechnung kassieren typischerweise 40–60 %
    besser als monatlich abrechnende Wettbewerber.

    Verfolge deine Fortschritte mit dem [Working-Capital-Rechner](/tools/working-capital-calculator/).
"what-is-working-capital":
  "title": "Was ist Working Capital?"
  "description": "Definition, Formel und Praxisleitfaden zum Working Capital: was es bedeutet, wie du es berechnest und wie du es steuerst."
  "body": |
    ## Was ist Working Capital?

    Working Capital ist die Differenz zwischen Umlaufvermögen und kurzfristigen Verbindlichkeiten eines Unternehmens:

    $$\text{Working Capital} = \text{Umlaufvermögen} - \text{Kurzfristige Verbindlichkeiten}$$

    Es ist der kurzfristige finanzielle Puffer, der den laufenden Betrieb finanziert.

    ## Bestandteile

    **Umlaufvermögen** (innerhalb von 12 Monaten in Cash umwandelbar):
    - Zahlungsmittel und Äquivalente
    - Forderungen
    - Vorräte
    - Aktive Rechnungsabgrenzung

    **Kurzfristige Verbindlichkeiten** (innerhalb von 12 Monaten fällig):
    - Lieferantenverbindlichkeiten
    - Kurzfristige Kredite
    - Aufgelaufene Gehälter und Aufwendungen
    - Passive Rechnungsabgrenzung

    ## Positives vs. negatives Working Capital

    **Positives Working Capital** heißt, das Vermögen übersteigt die Verbindlichkeiten: Das Unternehmen kann seinen Betrieb ohne externe Finanzierung stemmen.

    **Negatives Working Capital** heißt, die Verbindlichkeiten übersteigen das Vermögen. Manche Unternehmen arbeiten bewusst so, indem sie kassieren, bevor sie Lieferanten bezahlen (große Händler, Amazon). Für die meisten ist es ein Zeichen für ein Liquiditätsrisiko.

    ## Working Capital in der Finanzanalyse

    Veränderungen im Working Capital wirken direkt auf den Cashflow. Steigende Forderungen oder Vorräte verbrauchen Cash, steigende Verbindlichkeiten schonen es. Deshalb haben schnell wachsende Unternehmen trotz Gewinn oft Liquiditätsprobleme: Wachstum frisst Working Capital.

    Mit dem [Working-Capital-Rechner](/tools/working-capital-calculator/) bewertest du deine Current Ratio.
"working-capital-vs-cash-flow":
  "title": "Working Capital vs. Cashflow: Was ist der Unterschied?"
  "description": "Working Capital ist eine Momentaufnahme der Bilanz, der Cashflow das Geschäft in Bewegung. Wie beide zusammenhängen und warum du beide verfolgen solltest."
  "body": |
    Working Capital und Cashflow messen beide die finanzielle Gesundheit, aber
    aus unterschiedlichen Blickwinkeln. Viele profitable Unternehmen sind
    gescheitert, weil sie das eine ohne das andere gesteuert haben.

    ## Working Capital: die Momentaufnahme

    Working Capital ist eine Bilanzgröße: Es zeigt, wo du zu einem bestimmten
    Zeitpunkt stehst.

    **Working Capital = Umlaufvermögen − kurzfristige Verbindlichkeiten**

    Es beantwortet: „Wenn ich heute alles einfriere, kann ich meine
    kurzfristigen Rechnungen bezahlen?“

    ## Cashflow: die Bewegung

    Der Cashflow (vor allem der operative) misst das netto erwirtschaftete Cash
    über eine Periode: Monat, Quartal oder Jahr.

    Ein Unternehmen kann starkes Working Capital, aber schwachen Cashflow haben,
    wenn:
    - Forderungen hoch sind, aber langsam eingehen (hohe DSO)
    - Vorräte hoch sind, sich aber nicht drehen

    Umgekehrt kann es schwaches Working Capital, aber starken Cashflow haben,
    wenn:
    - Kunden im Voraus zahlen (jährliche SaaS-Abrechnung)
    - Lieferanten lange Zahlungsziele gewähren

    ## Warum beides verfolgen?

    Working Capital zeigt das Liquiditätsrisiko jetzt. Der Cashflow zeigt die
    Richtung: ob sich das Working Capital verbessert oder verschlechtert.

    Unternehmen, die ihr Working Capital mit einer [CCC-Analyse](/tools/cash-conversion-cycle-calculator/)
    neben ihren Cashflow-Prognosen modellieren, vermeiden überraschende
    Liquiditätskrisen.

    Berechne dein Working Capital mit dem [Working-Capital-Rechner](/tools/working-capital-calculator/).
"working-capital-vs-current-ratio":
  "title": "Working Capital vs. Current Ratio: die wichtigsten Unterschiede"
  "description": "Wie Working Capital und Current Ratio die Liquidität unterschiedlich messen und wann du welche Kennzahl nutzt."
  "body": |
    ## Working Capital und Current Ratio

    Beide Kennzahlen bewerten die kurzfristige Liquidität mit denselben Eingaben, drücken das Ergebnis aber unterschiedlich aus:

    | Kennzahl | Formel | Ergebnis |
    |--------|---------|--------|
    | Working Capital | Umlaufvermögen − kurzfristige Verbindlichkeiten | Betrag in Dollar |
    | Current Ratio | Umlaufvermögen ÷ kurzfristige Verbindlichkeiten | Verhältnis / Multiple |

    ## Wann Working Capital nützlicher ist

    Working Capital (der Betrag) ist nützlicher, wenn du:
    - die absolute Liquidität desselben Unternehmens über mehrere Perioden vergleichst
    - deinen Cash-Spielraum in absoluten Zahlen abschätzt
    - Veränderungen im Working Capital für die Cashflow-Analyse berechnest

    ## Wann die Current Ratio nützlicher ist

    Die Current Ratio ist nützlicher, wenn du:
    - Unternehmen unterschiedlicher Größe vergleichst
    - dich an Branchenwerten misst
    - die Einhaltung von Kreditauflagen berichtest

    ## Beispiel

    **Unternehmen A**: 10 Mio. $ Umlaufvermögen, 8 Mio. $ kurzfristige Verbindlichkeiten
    - Working Capital = 2 Mio. $
    - Current Ratio = 1,25×

    **Unternehmen B**: 1 Mio. $ Umlaufvermögen, 800.000 $ kurzfristige Verbindlichkeiten
    - Working Capital = 200.000 $
    - Current Ratio = 1,25×

    Beide haben dieselbe Current Ratio, aber sehr unterschiedliche absolute Liquidität. Das Working Capital unterscheidet sie.

    Mit dem [Working-Capital-Rechner](/tools/working-capital-calculator/) siehst du beides.

"how-to-reduce-stripe-fees":
  "title": "So senkst du deine Stripe-Gebühren: 5 praktische Methoden"
  "description": "Stripe verlangt standardmäßig 2,9 % + 0,30 $. Fünf konkrete Wege, deinen effektiven Stripe-Satz zu senken, von jährlicher Abrechnung bis zur Volumenverhandlung."
  "body": |
    Stripes Standardsatz von **2,9 % + 0,30 $** ist für die meisten Unternehmen
    fix. Der *effektive* Satz, den du zahlst, hängt aber davon ab, wie du deine
    Abrechnung aufbaust und wie viel Volumen du abwickelst. Hier sind fünf
    konkrete Methoden, ihn zu senken.

    ## 1. Von monatlicher auf jährliche Abrechnung wechseln

    Bei einem Plan für 99 $/Monat fällt die Stripe-Gebühr 12-mal an: 3,17 $ pro
    Verlängerung = 38,04 $ pro Jahr. Bei einem entsprechenden Jahresplan für 990 $
    zahlst du sie einmal: 29,01 $. Du sparst 9,03 $ pro Abonnent und Jahr, nur
    durch den anderen Abrechnungsrhythmus, und verbesserst zugleich deinen
    Cashflow.

    ## 2. Den durchschnittlichen Transaktionsbetrag erhöhen

    Die fixen 0,30 $ treffen kleine Transaktionen am härtesten: 6 % bei 5 $,
    0,6 % bei 50 $, 0,06 % bei 500 $. Bundles, Jahrespläne und
    Mindestbestellwerte senken den Anteil der Fixgebühr pro Dollar.

    ## 3. Stripes Optimized Checkout Suite nutzen

    Stripes [Link](https://stripe.com/payments/link) (Checkout mit einem Klick)
    steigert die Conversion typischerweise um 7–30 %, ohne Zusatzgebühr. Mehr
    Conversion heißt mehr Umsatz bei gleichen Abwicklungskosten: Deine
    effektiven Kosten pro Umsatzdollar sinken.

    ## 4. Volumenpreise verhandeln

    Stripe bietet individuelle Preise ab **80.000 $ pro Monat** (etwa 1 Mio. $
    pro Jahr). Der Nachlass variiert, liegt aber meist 0,2–0,5 Prozentpunkte
    unter dem Standardsatz. Melde dich beim Stripe-Vertrieb, wenn du dich dieser
    Schwelle näherst: Sie verhandeln.

    ## 5. ACH-Zahlungen separat abwickeln

    Für US-Banküberweisungen (ACH) verlangt Stripe nur **0,8 % (maximal 5,00 $)**.
    Sind deine Kunden US-Unternehmen, senkt ACH als Zahlungsart für Rechnungen
    über ~500 $ die effektiven Gebühren deutlich. Bei 1.000 $ beträgt die Gebühr
    5 $ (0,5 %) statt 29,30 $ per Karte.

    ## Was du nicht senken kannst

    Unter 1 Mio. $ pro Jahr ist Stripes Gebühr für die meisten Unternehmen nicht
    verhandelbar. Ein kompletter Anbieterwechsel (zu Shopify Payments, Paddle
    oder einem lokalen Acquirer) kann mehr bringen als Optimierung: Im
    [Gebührenvergleich](/tools/payment-fee-comparison/) siehst du die genauen
    Zahlen für deinen durchschnittlichen Transaktionsbetrag.
"lowest-payment-processing-fees-small-business":
  "title": "Die niedrigsten Zahlungsgebühren für kleine Unternehmen (2026)"
  "description": "Stripe, PayPal und Shopify Payments im Vergleich für kleine Unternehmen. Welcher Anbieter hat bei deinem durchschnittlichen Transaktionsbetrag die niedrigsten Gebühren?"
  "body": |
    Für die meisten kleinen Unternehmen sind **Stripe**, **PayPal** und **Shopify
    Payments** die drei wichtigsten Zahlungsanbieter. Welcher am günstigsten ist,
    hängt fast nur von deinem durchschnittlichen Transaktionsbetrag und deinem
    Monatsvolumen ab.

    ## Gebühren auf einen Blick (2026)

    | Anbieter | Satz | Fix | Am besten für |
    |-----------|------|-------|---------|
    | Stripe | 2,9 % | 0,30 $ | SaaS, entwicklerorientiert, APIs |
    | PayPal Standard | 2,99 % | 0,49 $ | Kundenvertrauen, Marktplätze |
    | PayPal Checkout | 3,49 % | 0,49 $ | Conversion über den PayPal-Button |
    | Shopify Basic | 2,0 % | 0,25 $ | E-Commerce mit Plan für 39 $/Monat |
    | Shopify | 1,7 % | 0,25 $ | E-Commerce mit Plan für 105 $/Monat |
    | Shopify Advanced | 1,5 % | 0,25 $ | E-Commerce mit hohem Volumen |

    ## Die Gewinnschwellen

    **Shopify Basic vs. Stripe**: Shopify Basic (Plan für 39 $/Monat) kostet bei
    etwa **3.900 $ Monatsvolumen** gleich viel wie Stripe (die 39 $ Monatsgebühr
    gleichen ~1 % Ersparnis aus). Darüber ist Shopify Basic günstiger, darunter
    gewinnt Stripe.

    **Shopify vs. Stripe bei 100 $ pro Transaktion**:

    | Anbieter | Gebühr auf 100 $ | Dir bleiben |
    |-----------|-------------|---------|
    | Stripe | 3,20 $ | 96,80 $ |
    | PayPal Standard | 3,48 $ | 96,52 $ |
    | Shopify Basic | 2,25 $ | 97,75 $ |
    | Shopify Advanced | 1,75 $ | 98,25 $ |

    ## Welchen solltest du wählen?

    - **Unter 2.000 $ Monatsvolumen** → Stripe (keine Monatsgebühr, beste Entwicklererfahrung)
    - **E-Commerce auf Shopify** → Shopify Payments (niedrigere Sätze, keine externe Transaktionsgebühr)
    - **Endkundengeschäft mit vielen Kaufabbrüchen** → PayPal (die höhere Conversion gleicht den Satz aus)
    - **Über 80.000 $ pro Monat** → mit Stripe verhandeln oder Stripe mit Paddle/FastSpring vergleichen

    Gib deinen durchschnittlichen Transaktionsbetrag in den [Gebührenvergleich](/tools/payment-fee-comparison/)
    ein, um die genauen Gebühren und die günstigste Option für deine Situation zu sehen.
"paypal-fees-for-online-payments":
  "title": "PayPal-Gebühren für Online-Zahlungen: die vollständige Aufschlüsselung"
  "description": "PayPal verlangt 2,99–3,49 % + 0,49 $ für Online-Transaktionen. Die vollständige Gebührenübersicht, wann PayPal konkurrenzfähig ist und wann nicht."
  "body": |
    PayPal hat zwei Hauptpreisstufen für Online-Kartenzahlungen: **PayPal
    Standard** mit 2,99 % + 0,49 $ und **PayPal Checkout** (der gebrandete Button)
    mit 3,49 % + 0,49 $. Der Unterschied zählt für SaaS- und Abo-Geschäfte, bei
    denen die fixen 0,49 $ die Marge kleiner Transaktionen aufzehren.

    ## Wann lohnt sich PayPal?

    PayPals wichtigster Vorteil ist das **Käufervertrauen**: Wer den PayPal-Button
    sieht, schließt oft Käufe ab, die er sonst abbrechen würde, gerade im
    Checkout. Laut einer Studie des Baymard Institute senkt PayPal die
    Abbruchrate beim Gast-Checkout um bis zu 14 % gegenüber einem reinen
    Formular-Checkout.

    Liegt dein durchschnittlicher Bestellwert über 30 $ und verkaufst du direkt
    an Endkunden, kann der Conversion-Gewinn den höheren Satz gegenüber Stripe
    mehr als ausgleichen.

    ## PayPal-Gebühren im Vergleich bei einer Zahlung über 100 $

    | Anbieter | Gebühr | Du erhältst |
    |-----------|-----|------------|
    | Stripe | 3,20 $ | 96,80 $ |
    | PayPal Standard | 3,48 $ | 96,52 $ |
    | PayPal Checkout | 3,98 $ | 96,02 $ |

    Bei 100 $ spart Stripe 0,28–0,78 $ pro Transaktion. Bei 1.000 Transaktionen pro
    Monat sind das 280–780 $ monatlich, was sich bei Wachstum schnell summiert.

    ## PayPal und Abos

    Mit PayPal-Abbuchungsvereinbarungen sind wiederkehrende Zahlungen möglich,
    ohne dass der Kunde jede Zahlung bestätigt. Die Abo-Verwaltung (anteilige
    Abrechnung, Upgrades, Mahnwesen) ist aber begrenzter als bei Stripe Billing.
    Für reines SaaS werden meist Stripes Entwicklertools und die Zuverlässigkeit
    seiner Webhooks bevorzugt.

    ## PayPals Vorteil bei Auslandszahlungen

    PayPal hat lokales Acquiring in über 40 Ländern und wickelt
    Mehrwährungszahlungen nativ ab. Ist ein großer Teil deiner Kunden im Ausland,
    kann PayPals Conversion mit Stripes Gebühren für internationale Karten
    (+1,5 % für Nicht-US-Karten) mithalten.

    Gib im [Gebührenvergleich](/tools/payment-fee-comparison/) deinen
    durchschnittlichen Transaktionsbetrag ein, um den genauen Unterschied in
    Dollar für deine Situation zu sehen.
"stripe-vs-paypal-for-subscriptions":
  "title": "Stripe oder PayPal für wiederkehrende Abos: Was kostet weniger?"
  "description": "Gebührenvergleich von Stripe und PayPal für Abo-Abrechnung, mit Beispielen für monatliche und jährliche Abrechnung und einer Gewinnschwellenrechnung."
  "body": |
    Für Abo-Geschäfte entscheiden Gebühren, Zuverlässigkeit und Funktionstiefe
    zwischen Stripe und PayPal. Hier ist der vollständige Vergleich.

    ## Gebühren bei monatlichen Abos

    Beide Anbieter berechnen bei jeder Verlängerung ihre Standardgebühr:

    | Anbieter | Monatsplan für 49 $ | Jahresplan für 490 $ |
    |-----------|-----------------|-----------------|
    | Stripe | 1,72 $/Verlängerung | 14,51 $ einmalig |
    | PayPal Standard | 1,96 $/Verlängerung | 15,11 $ einmalig |

    Bei einem Plan für 49 $/Monat spart Stripe gegenüber PayPal Standard **2,88 $
    pro Abonnent und Jahr**. Bei 1.000 Abonnenten sind das **2.880 $ pro Jahr**,
    allein durch den Unterschied im Satz.

    ## Abo-Funktionen: Stripe gewinnt

    Stripe Billing ist für SaaS gebaut: anteilige Abrechnung, nutzungsbasierte
    Abrechnung, Testphasen, pausierbare Abos und Mahnwesen (automatische
    Wiederholung fehlgeschlagener Zahlungen). PayPals Abo-APIs funktionieren,
    haben aber nicht dieselbe Tiefe und Zuverlässigkeit.

    Auch PayPals Rückbuchungsquote bei digitalen Abos ist höher als die von
    Stripe, ein kritischer Punkt, denn zu viele Rückbuchungen können dein Konto
    einfrieren.

    ## Nutze unseren Vergleichsrechner

    Gib deinen monatlichen Planpreis in den [Gebührenvergleich](/tools/payment-fee-comparison/)
    ein, um die genaue monatliche Ersparnis eines Anbieterwechsels für deinen
    Abo-Betrag zu sehen.
"stripe-vs-shopify-payments-fees":
  "title": "Stripe oder Shopify Payments: Wann Shopify Payments wirklich günstiger ist"
  "description": "Shopify Payments kann für Onlineshops günstiger sein als Stripe. Dieser Ratgeber zeigt die genauen Volumenschwellen und wann welcher Anbieter gewinnt."
  "body": |
    Shopify Payments und Stripe wirken auf den ersten Blick ähnlich (beide laufen
    auf Stripes Infrastruktur), doch für Shopify-Händler unterscheiden sich die
    Gebühren deutlich.

    ## Der Kernunterschied: der Shopify-Gateway-Aufschlag

    Nutzt du Stripe direkt auf Shopify (statt Shopify Payments), berechnet
    Shopify zusätzlich zu Stripes Gebühren eine **weitere Transaktionsgebühr**:
    - Basic-Plan: +2,0 %
    - Shopify-Plan: +1,0 %
    - Advanced-Plan: +0,5 %

    Damit ist Stripe für Shopify-Händler **deutlich teurer** als Shopify Payments.

    ## Satzvergleich: Shopify Payments vs. Stripe auf Shopify

    Für einen Shopify-Basic-Shop (39 $/Monat) mit 10.000 $ Monatsvolumen:

    | Option | Abwicklungsgebühr | Gateway-Gebühr | Summe pro Monat |
    |--------|---------------|-------------|---------------|
    | Stripe auf Shopify | 320 $ | +200 $ (2 %) | 520 $ |
    | Shopify Payments Basic | 225 $ | 0 $ | 225 $ |

    Shopify Payments spart bei 10.000 $ Volumen **295 $ pro Monat** und deckt die
    Plangebühr von 39 $/Monat damit locker.

    ## Wann Stripe außerhalb von Shopify besser ist

    Wenn du **nicht auf Shopify verkaufst**, ist Stripe die bessere Wahl:
    - Bessere APIs für einen individuellen Checkout
    - Überlegene Abo-Abrechnung
    - Bessere internationale Abdeckung
    - Keine Plattformabhängigkeit

    Vergleiche die genauen Gebühren für deine Transaktionsbeträge mit unserem
    [Gebührenvergleich](/tools/payment-fee-comparison/).
"paypal-fee-on-100-dollars":
  "title": "Wie viel nimmt PayPal bei einer Transaktion über 100 $?"
  "description": "Die genaue PayPal-Gebühr bei einer Zahlung über 100 $: Standard, Checkout und Waren & Dienstleistungen im Vergleich mit Stripe."
  "body": |
    Bei einer **Zahlung über 100 $** per PayPal Standard (Karte) beträgt die Gebühr **3,49 $** (3,49 %):
    - 2,99 % von 100 $ = 2,99 $
    - Fixgebühr = 0,49 $ (USD, inländisch)
    - **Gebühr gesamt = 3,48 $ | Du erhältst = 96,52 $**

    Bei PayPal Checkout (dem neueren Ablauf): **3,98 $ Gebühr | 96,02 $ netto**

    Bei PayPal Waren & Dienstleistungen („Freunde & Familie“ ist nur für private
    Zwecke; geschäftliche Nutzung verstößt gegen PayPals Bedingungen):
    **3,48 $ Gebühr**.

    ## 100 $ im Vergleich: PayPal, Stripe und Square

    | Anbieter | Gebühr auf 100 $ | Netto erhalten |
    |-----------|---------|-------------|
    | PayPal Standard | 3,49 $ | 96,52 $ |
    | PayPal Checkout | 3,98 $ | 96,02 $ |
    | Stripe (inländisch) | 3,20 $ | 96,80 $ |
    | Square (online) | 3,20 $ | 96,80 $ |

    Stripe und Square sind pro 100-$-Transaktion **0,29–0,78 $ günstiger**. Bei
    100 Transaktionen pro Monat spart ein Wechsel 29–78 $ monatlich. Bei 1 Mio. $
    Jahresvolumen sind es 2.900–7.800 $ pro Jahr.

    ## Um genau 100 $ netto von PayPal zu erhalten
    Berechne **103,59 $**, um nach PayPal-Standard-Gebühren genau 100 $ zu erhalten:
    (100 $ + 0,49 $) / (1 − 0,0299) = 103,59 $.
"paypal-fee-on-1000-dollars":
  "title": "Wie viel nimmt PayPal bei einer Transaktion über 1.000 $?"
  "description": "Die genaue PayPal-Gebühr bei einer Zahlung über 1.000 $ und ab wann Mengenrabatte gelten."
  "body": |
    Bei einer **Zahlung über 1.000 $** per PayPal Standard beträgt die Gebühr **30,49 $** (3,05 %):
    - 2,99 % von 1.000 $ = 29,90 $
    - Fixgebühr = 0,49 $
    - **Gebühr gesamt = 30,39 $ | Du erhältst = 969,61 $**

    Bei PayPal Checkout: **35,39 $ Gebühr | 964,61 $ netto**

    ## Ab welchem Volumen bietet PayPal niedrigere Sätze?

    PayPals **Händlertarif**-Programm senkt die Gebühren je nach monatlichem Umsatz:
    - 0–3.000 $/Monat: 2,99 % + 0,49 $ (Standard)
    - 3.001–10.000 $/Monat: 2,89 % + 0,49 $
    - 10.001–100.000 $/Monat: 2,79 % + 0,49 $
    - Ab 100.001 $/Monat: PayPal für individuelle Sätze kontaktieren

    Bei einer Transaktion über 1.000 $ und 50.000 $ Monatsvolumen (2,79 % + 0,49 $):
    Gebühr = **28,39 $ | netto = 971,61 $**, etwa 2 $ Ersparnis pro Transaktion
    gegenüber dem Standardsatz.

    ## ACH / Banküberweisung als Alternative bei 1.000 $
    Bei B2B-Rechnungen über 1.000 $ kostet eine ACH-Überweisung 0 $ (oder pauschal
    1–5 $ bei manchen Anbietern), 30-mal günstiger als PayPal. Ist dein Käufer ein
    Unternehmen, wird es immer üblicher, ACH neben PayPal anzubieten, mit „3 %
    Aufschlag bei PayPal“, was in den meisten US-Bundesstaaten zulässig ist.
"paypal-fees-australia":
  "title": "PayPal-Gebühren in Australien: AUD-Sätze und Vergleich mit Stripe"
  "description": "PayPal-Gebühren für australische Unternehmen: AUD-Sätze, Rechenbeispiele und Vergleich mit Stripe."
  "body": |
    Australische PayPal-Händler zahlen **2,6 % + 0,30 A$** für inländische
    Transaktionen. Bei PayPal Checkout liegt der Satz bei **3,49 % + 0,49 A$**.
    Grenzüberschreitende Transaktionen (außerhalb Australiens ausgegebene Karten)
    kosten 1,5 % zusätzlich.

    ## Beispiele für PayPal-Gebühren in Australien (AUD)

    | Betrag | PayPal Standard | PayPal Checkout | Stripe (AU inländisch) |
    |--------|----------------|----------------|---------------------|
    | 25 A$  | 0,95 A$ (3,8 %) | 1,36 A$ (5,4 %) | 0,74 A$ (2,96 %) |
    | 100 A$ | 2,90 A$ (2,9 %) | 3,98 A$ (4,0 %) | 2,05 A$ (2,05 %) |
    | 500 A$ | 13,30 A$ (2,66 %) | 17,94 A$ (3,6 %) | 9,05 A$ (1,81 %) |

    ## BPAY und Banküberweisung als Alternativen
    Für B2B-Rechnungen in Australien ist BPAY (Überweisung per BSB und
    Kontonummer) für Händler praktisch kostenlos. Bei hohen Rechnungen (ab
    2.000 A$) kann eine Banküberweisung neben PayPal und Karte 2–3 % pro
    Transaktion sparen. Füge mit dem Rechnungsrechner eine Position „Rabatt bei
    Banküberweisung“ als Anreiz hinzu.
"paypal-fees-canada":
  "title": "PayPal-Gebühren in Kanada: CAD-Sätze und Vergleich mit Stripe"
  "description": "PayPal-Gebühren für kanadische Unternehmen: CAD-Sätze, Auslandsgebühren und wann Stripe günstiger ist."
  "body": |
    Kanadische PayPal-Händler zahlen **2,99 % + 0,49 C$** für Standard-PayPal-
    Transaktionen. Bei PayPal Checkout (dem neueren gebrandeten Ablauf) liegt der
    Satz bei **3,49 % + 0,49 C$**. Grenzüberschreitende Transaktionen kosten 1,5 %
    mehr, und die Währungsumrechnung schlägt 3–4 % auf den Wechselkurs auf.

    ## Beispiele für PayPal-Gebühren in Kanada (CAD)

    | Betrag | PayPal Standard | PayPal Checkout | Stripe (CA inländisch) |
    |--------|----------------|----------------|---------------------|
    | 25 C$  | 1,24 C$ (5,0 %) | 1,36 C$ (5,4 %) | 1,03 C$ (4,1 %) |
    | 100 C$ | 3,48 C$ (3,5 %) | 3,98 C$ (4,0 %) | 3,20 C$ (3,2 %) |
    | 500 C$ | 15,44 C$ (3,1 %) | 17,94 C$ (3,6 %) | 14,80 C$ (3,0 %) |

    ## GST/HST auf PayPal-Gebühren
    PayPal berechnet kanadischen Unternehmen je nach Provinz der Registrierung GST
    oder HST auf die Abwicklungsgebühren. Registrierte Unternehmen können sie in
    der Regel als Vorsteuer zurückholen. PayPal stellt monatlich eine
    Gebührenübersicht aus.

    ## PayPal oder Stripe für kanadische Unternehmen
    Stripe ist bei Standard-Kartenzahlungen günstiger (2,9 % + 0,30 C$ gegenüber
    PayPals 2,99 % + 0,49 C$). Der Unterschied wächst mit dem Volumen: Bei
    10.000 C$ pro Monat spart Stripe gegenüber PayPal Standard etwa 24 C$
    monatlich. Stripe bietet außerdem besseren Abo-Support, zuverlässigere
    Webhooks und bessere Entwicklertools.
"paypal-fees-uk":
  "title": "PayPal-Gebühren in Großbritannien: Sätze, Beispiele und Vergleich mit Stripe"
  "description": "Die genauen PayPal-Gebühren für britische Unternehmen: inländische und internationale Sätze mit Rechenbeispielen und Vergleich mit Stripe."
  "body": |
    PayPal berechnet britischen Unternehmen **1,2 % + 30p** für Zahlungen mit
    britischer Debitkarte, **2,99 % + 30p** für normale Kartenzahlungen
    (Visa/Mastercard) und **3,49 % + 49p** für PayPal Checkout. Bei internationalen
    Transaktionen kommen 1,5 % Auslandsgebühr und 3–4 % Aufschlag bei der
    Währungsumrechnung hinzu.

    ## Beispiele für PayPal-Gebühren in Großbritannien (GBP)

    | Betrag | PayPal Standard | PayPal Checkout | Stripe (UK inländisch) |
    |--------|----------------|----------------|---------------------|
    | 10 £ | 0,60 £ (6,0 %) | 0,84 £ (8,4 %) | 0,35 £ (3,5 %) |
    | 50 £ | 1,80 £ (3,6 %) | 2,24 £ (4,5 %) | 0,95 £ (1,9 %) |
    | 100 £ | 3,29 £ (3,3 %) | 3,98 £ (4,0 %) | 1,70 £ (1,7 %) |
    | 500 £ | 15,30 £ (3,1 %) | 17,94 £ (3,6 %) | 7,70 £ (1,54 %) |

    ## Wann sich die höhere PayPal-Gebühr lohnt

    PayPals wichtigster Vorteil für britische Unternehmen ist **Käufervertrauen
    und Conversion-Rate**. Studien zeigen, dass 56 % der britischen Käufer PayPal
    mehr vertrauen, als ihre Kartendaten auf einer unbekannten Website
    einzugeben. Bei Shops mit kaltem Traffic (geringe Markenbekanntheit) kann der
    Conversion-Gewinn durch PayPal die höheren Kosten ausgleichen.

    **Faustregel**: Liegt dein durchschnittlicher Bestellwert unter 30 £ und
    schickst du Traffic aus sozialen Medien zu einer unbekannten Marke, rechtfertigt
    PayPals Conversion-Gewinn wahrscheinlich die Kosten. Für Abo-SaaS oder B2B mit
    hohem Bestellwert ist Stripe fast immer günstiger und besser.
"shopify-basic-vs-shopify-plan-fees":
  "title": "Shopify Basic oder Shopify-Plan: Gebührenunterschied und wann sich ein Upgrade lohnt"
  "description": "Gebührenvergleich von Shopify Basic (39 $/Monat) und Shopify Standard (105 $/Monat): ab wann sich das Upgrade selbst bezahlt."
  "body": |
    Shopify hat drei Hauptpläne: **Basic** (39 $/Monat), **Shopify** (105 $/Monat)
    und **Advanced** (399 $/Monat). Jede Stufe senkt Transaktionsgebühren und
    Kartensätze.

    ## Gebührenvergleich

    | | Basic (39 $/Monat) | Shopify (105 $/Monat) | Advanced (399 $/Monat) |
    |-|---------------|-----------------|-------------------|
    | **Satz Shopify Payments** | 2,0 % + 25¢ | 1,7 % + 25¢ | 1,5 % + 25¢ |
    | **Gebühr Drittanbieter-Gateway** | 2,0 % | 1,0 % | 0,5 % |
    | **Satz Amex / internationale Karten** | 3,5 % | 3,5 % | 3,5 % |

    ## Wann lohnt sich der Wechsel von Basic zu Shopify?

    Das Upgrade kostet **66 $ mehr pro Monat** (105 $ − 39 $). Die Gebühr sinkt bei
    Shopify-Payments-Transaktionen um 0,3 Prozentpunkte.

    **Formel für die Gewinnschwelle**: das Monatsvolumen (GMV), bei dem 0,3 %
    Ersparnis = 66 $ pro Monat, also **22.000 $ GMV pro Monat** (mit Shopify
    Payments).

    Macht dein Shop über Shopify Payments mehr als 22.000 $ pro Monat, sparst du
    mit dem Shopify-Plan netto Geld.

    ## Wann lohnt sich der Wechsel von Shopify zu Advanced?

    Mehrkosten: **294 $ pro Monat**. Gebührensenkung: 0,2 Prozentpunkte bei
    Shopify Payments. Gewinnschwelle: **147.000 $ GMV pro Monat**

    Die meisten Shops wechseln zu Advanced wegen der individuellen Berichte und
    der niedrigeren Drittanbieter-Gateway-Gebühr (0,5 % statt 1,0 %), nicht wegen
    des Unterschieds beim Kartensatz.
"shopify-fees-vs-woocommerce":
  "title": "Shopify-Gebühren vs. WooCommerce: Gesamtkostenvergleich"
  "description": "Vollständiger Kostenvergleich von Shopify und WooCommerce: Plattformgebühr, Transaktionsgebühr, Hosting und GMV an der Gewinnschwelle."
  "body": |
    Shopify und WooCommerce haben grundverschiedene Kostenstrukturen. Shopify
    verlangt eine planbare Monatsgebühr, WooCommerce kostet als Plattform nichts,
    braucht aber Hosting und mehr Wartung.

    ## Monatliche Kosten im Vergleich

    | Kostenposition | Shopify Basic | WooCommerce |
    |----------------|--------------|-------------|
    | Plattformgebühr | 39 $/Monat | 0 $ |
    | Hosting | inklusive | 10–25 $/Monat |
    | Transaktionsgebühr (Stripe) | 2,0 % (ohne SP) oder 0 % (SP) | 0 % |
    | Kartenabwicklung (Stripe) | 2,0 % + 25¢ (SP) | 2,9 % + 30¢ |
    | Domain | ~2 $/Monat | ~2 $/Monat |
    | Wartung / Plugins | 0 $ | 10–50 $/Monat |

    ## Ab welchem GMV wird WooCommerce günstiger?

    Mit Shopify Payments (ohne Transaktionsgebühr) bei 22.000 $ GMV pro Monat im Basic-Plan:
    - Shopify: 39 $ + (22.000 $ × 0,02) = 39 $ + 440 $ = **479 $/Monat**
    - WooCommerce + Stripe: 20 $ + (22.000 $ × 0,029) = 20 $ + 638 $ = **658 $/Monat**

    Bei diesem Volumen ist Shopify Basic mit Shopify Payments sogar **günstiger** als
    WooCommerce + Stripe, weil Shopify Payments (2,0 % + 25¢) weniger kostet als
    Stripes Standardsatz (2,9 % + 30¢).

    WooCommerce gewinnt bei:
    - **Flexibilität**: unbegrenzte Anpassung, beliebiges Hosting, voller Besitz am Code
    - **Sehr kleinem Volumen**: unter 5.000 $ pro Monat, wo die Plattformgebühr dominiert
    - **Keinen Transaktionsgebühren bei jedem Zahlungsanbieter** (anders als Shopifys 2 % für Drittanbieter-Gateways)

    Modelliere deinen Plan und dein Volumen mit dem Shopify-Gebührenrechner oben.
"shopify-payments-vs-stripe":
  "title": "Shopify Payments oder Stripe: Was ist wann günstiger?"
  "description": "Detaillierter Gebührenvergleich zwischen Shopify Payments und einer separaten Stripe-Integration, mit Berechnung des GMV an der Gewinnschwelle."
  "body": |
    Auf Shopify hast du zwei Hauptoptionen für Kartenzahlungen: **Shopify
    Payments** (integriert, ohne Transaktionsgebühr) oder **Stripe über ein
    Drittanbieter-Gateway** (Standardsätze von Stripe plus 0,5–2 %
    Shopify-Transaktionsgebühr).

    ## Gebührenvergleich: Shopify Payments vs. Stripe auf Shopify

    | Plan | Shopify Payments | Stripe + Shopify-Gebühr | Unterschied |
    |------|-----------------|---------------------|-----------|
    | Basic | 2,0 % + 25¢ | 2,9 % + 30¢ + 2,0 % = 4,9 % + 30¢ | +2,9 % |
    | Shopify | 1,7 % + 25¢ | 2,9 % + 30¢ + 1,0 % = 3,9 % + 30¢ | +2,2 % |
    | Advanced | 1,5 % + 25¢ | 2,9 % + 30¢ + 0,5 % = 3,4 % + 30¢ | +1,9 % |

    **Shopify Payments ist fast immer günstiger** für Shops, die überwiegend
    inländische US-Visa/Mastercard-Zahlungen abwickeln. Allein die
    Shopify-Transaktionsgebühr (2 % bei Basic) ist ein hoher Aufschlag für die
    direkte Nutzung von Stripe.

    ## Wann Stripe außerhalb von Shopify sinnvoll ist

    - Du ziehst von Shopify weg und willst deine Stripe-Kundendaten behalten
    - Du brauchst Stripe-spezifische Funktionen (Radar, Connect, Issuing), die Shopify Payments nicht bietet
    - Du verkaufst in einem Land, in dem Shopify Payments nicht verfügbar ist
    - Du hast Abo-Umsätze, die Shopify Payments schlechter abbildet als Stripe Billing

    Für die meisten Shopify-Shops gilt: **Nutze Shopify Payments**. Der Aufschlag
    durch die Transaktionsgebühr bei Stripe ist außer in den genannten Fällen zu
    hoch.
"stripe-fee-on-10-dollars":
  "title": "Wie viel nimmt Stripe bei einer Zahlung über 10 $?"
  "description": "Die genaue Stripe-Gebühr bei einer Transaktion über 10 $, inländisch und international."
  "body": |
    Bei einer **Zahlung über 10 $** mit inländischer US-Karte nimmt Stripe **0,59 $** (effektiv 5,9 %):
    - 2,9 % von 10 $ = 0,29 $
    - Fixgebühr = 0,30 $
    - **Gebühr gesamt = 0,59 $ | Du erhältst = 9,41 $**

    Mit internationaler Karte (4,4 % + 0,30 $): **0,74 $ Gebühr | 9,26 $ netto**.

    ## Warum kleine Zahlungen einen hohen effektiven Satz haben
    Die fixen 0,30 $ wiegen bei kleinen Transaktionen unverhältnismäßig schwer.
    Bei 10 $ sind das schon 3 %, bevor der Prozentanteil dazukommt. Deshalb bietet
    Stripe einen **Kleinstbetragstarif (5 % + 0,05 $)** für berechtigte
    Unternehmen, die überwiegend Transaktionen unter 10 $ abwickeln. Bei 10 $
    ergibt er: 5 % × 10 $ + 0,05 $ = **0,55 $**, etwas günstiger als der
    Standardsatz.

    ## Um genau 10 $ netto zu erhalten
    Um von einer inländischen Karte genau 10 $ zu erhalten, musst du **10,62 $** berechnen
    (Hochrechnung: (10 $ + 0,30 $) / (1 − 0,029) = 10,617 $).

    Nutze den Rechner oben und aktiviere „mehr berechnen, um genau diesen Betrag zu erhalten“.
"stripe-fee-on-100-dollars":
  "title": "Wie viel nimmt Stripe bei einer Zahlung über 100 $?"
  "description": "Die genaue Stripe-Gebühr bei einer Transaktion über 100 $: inländisch (2,9 % + 0,30 $) und international (4,4 % + 0,30 $)."
  "body": |
    Bei einer **Zahlung über 100 $** mit inländischer US-Karte nimmt Stripe **3,20 $** (effektiv 3,2 %):
    - 2,9 % von 100 $ = 2,90 $
    - Fixgebühr = 0,30 $
    - **Gebühr gesamt = 3,20 $ | Du erhältst = 96,80 $**

    Mit internationaler Karte (4,4 % + 0,30 $): **4,70 $ Gebühr | 95,30 $ netto**.

    ## Typische Zahlungen um 100 $

    | Planart | Monatsbetrag | Stripe-Gebühr | Netto pro Abonnent |
    |-----------|---------------|-----------|-------------------|
    | SaaS monatlich | 99 $ | 3,17 $ | 95,83 $ |
    | SaaS monatlich | 100 $ | 3,20 $ | 96,80 $ |
    | E-Commerce | 100 $ | 3,20 $ | 96,80 $ |

    ## Um genau 100 $ netto zu erhalten
    Berechne **103,09 $**, um nach Stripes Gebühr genau 100 $ zu erhalten:
    (100 $ + 0,30 $) / (1 − 0,029) = 103,09 $.

    Nützlich, wenn du den Preis als „100 $ für mich“ statt „100 $ für den Kunden“ festlegen willst.
"stripe-fee-on-1000-dollars":
  "title": "Wie viel nimmt Stripe bei einer Zahlung über 1.000 $?"
  "description": "Die genaue Stripe-Gebühr bei einer Transaktion über 1.000 $ und ab wann Mengenrabatte greifen."
  "body": |
    Bei einer **Zahlung über 1.000 $** mit inländischer US-Karte nimmt Stripe **29,30 $** (effektiv 2,93 %):
    - 2,9 % von 1.000 $ = 29,00 $
    - Fixgebühr = 0,30 $
    - **Gebühr gesamt = 29,30 $ | Du erhältst = 970,70 $**

    Mit internationaler Karte: **44,30 $ Gebühr | 955,70 $ netto**.

    ## Ab welchem Volumen gibt es individuelle Stripe-Preise?

    Stripe verhandelt individuelle Preise ab **80.000 $ Monatsvolumen**. Die Sätze
    liegen je nach Transaktionsmix und Risikoprofil meist bei 2,2–2,5 % +
    0,10–0,20 $. Bei 80.000 $ pro Monat und 2,4 % + 0,15 $ sinkt die Gebühr auf
    1.000 $ auf **24,15 $**, 5,15 $ Ersparnis pro Transaktion gegenüber dem
    Standardpreis.

    ## 1.000 $ ist die ACH-Schwelle

    Stripe unterstützt auch ACH-Banküberweisungen zu **0,8 % (maximal 5 $)**. Bei
    1.000 $ kostet ACH **5,00 $**, 83 % weniger als die Kartenabwicklung. Bei
    B2B-Rechnungen über 500 $ kann ACH neben Kartenzahlung die Kosten deutlich
    senken. Hinweis: ACH braucht 2–5 Werktage bis zur Gutschrift, die
    Kartenautorisierung erfolgt sofort.
"stripe-fee-per-10k-revenue":
  "title": "Wie viel nimmt Stripe bei 10.000 $ Umsatz?"
  "description": "Die genauen Stripe-Gebühren auf 10.000 $ Umsatz, aufgeschlüsselt nach Transaktionsgröße und Kartentyp."
  "body": |
    Stripes Gebühr auf 10.000 $ Umsatz hängt ganz davon ab, wie sich diese
    10.000 $ auf Transaktionen verteilen, denn die **fixen 0,30 $ pro Transaktion**
    wirken bei kleinen Zahlungen viel stärker als bei großen.

    ## Gebühren nach Transaktionsgröße

    Wenn deine 10.000 $ aus einer einzigen Transaktion stammen:

    | Kennzahl | Wert |
    |--------|-------|
    | Bruttoumsatz | 10.000 $ |
    | Stripe-Gebühr (2,9 % + 0,30 $) | 290,30 $ |
    | Nettoauszahlung | 9.709,70 $ |
    | Effektiver Satz | 2,903 % |

    Wenn deine 10.000 $ aus 100 Transaktionen zu 100 $ stammen:

    | Kennzahl | Wert |
    |--------|-------|
    | Bruttoumsatz | 10.000 $ |
    | Stripe-Gebühren (2,9 % + 0,30 $ × 100) | 320,00 $ |
    | Nettoauszahlung | 9.680,00 $ |
    | Effektiver Satz | 3,20 % |

    Wenn deine 10.000 $ aus 1.000 Transaktionen zu 10 $ stammen:

    | Kennzahl | Wert |
    |--------|-------|
    | Bruttoumsatz | 10.000 $ |
    | Stripe-Gebühren (2,9 % + 0,30 $ × 1.000) | 590,00 $ |
    | Nettoauszahlung | 9.410,00 $ |
    | Effektiver Satz | 5,90 % |

    ## Die Kernerkenntnis: Die fixen 0,30 $ wirken regressiv

    Bei einer Transaktion über 10 $ machen 0,30 $ allein schon 3 % aus, mit dem
    Prozentanteil liegt Stripes effektiver Satz bei 5,9 %. Bei 1.000 $ sind 0,30 $
    nur 0,03 %.

    Ist dein durchschnittlicher Bestellwert niedrig (unter 20 $), erwäge:
    - Käufe zu bündeln (z. B. Guthaben aufladen statt Einzelkäufe)
    - Stripes Link zu nutzen, das die Gebühren für Zahlungen ohne vorliegende
      Karte bei wiederkehrenden Kunden senken kann
    - Paddle oder Lemon Squeezy zu prüfen, deren Komplettsätze bei
      Kleinstbetragsmodellen günstiger sein können

    Gib im Rechner oben deinen typischen Transaktionsbetrag ein, um die genaue
    Gebühr und Nettoauszahlung zu sehen.
"stripe-fees-for-subscriptions":
  "title": "Stripe-Gebühren bei wiederkehrenden Abos"
  "description": "Wie Stripe-Gebühren bei monatlichen und jährlichen Abos funktionieren und wie du deine Nettoauszahlung pro Abrechnungszyklus berechnest."
  "body": |
    Wer ein Abo-Geschäft auf Stripe betreibt, zahlt auf jede erfolgreiche
    wiederkehrende Abbuchung dieselbe Gebühr von **2,9 % + 0,30 $** wie bei einer
    Einmalzahlung. Einige Abo-spezifische Feinheiten solltest du aber kennen, bevor
    du deine Preise festlegst.

    ## Zahlst du bei jeder Abbuchung eine Gebühr?

    Ja. Jede erfolgreiche Verlängerung löst eine eigene Transaktionsgebühr aus.
    Zahlt ein Kunde 99 $ pro Monat im Monatsplan, nimmt Stripe bei jeder
    Verlängerung 3,17 $ (2,9 % × 99 $ + 0,30 $), dir bleiben 95,83 $. Über 12 Monate
    zahlst du für einen Abonnenten 38,04 $ Gebühren auf 1.188 $ Bruttoumsatz.

    Bei einem Jahresplan für 990 $ (einmal abgerechnet) fällt die Gebühr einmal an:
    29,01 $, dir bleiben 960,99 $. Netto ist das ähnlich, aber mit einem statt
    zwölf Gebührenabzügen.

    ## Jährliche oder monatliche Abrechnung: die Gebührenrechnung

    Für einen Plan mit 99 $/Monat:

    | Abrechnung | Brutto pro Jahr | Gebühren pro Jahr | Netto pro Jahr |
    |---------|-------------|------------|-----------|
    | Monatlich | 1.188 $ | 38,04 $ | 1.149,96 $ |
    | Jährlich (990 $) | 990 $ | 29,01 $ | 960,99 $ |

    Monatliche Abrechnung bringt pro Jahr 189 $ mehr Bruttoumsatz und selbst nach
    den zusätzlichen Gebühren 188,97 $ mehr netto pro Abonnent. Deshalb bieten
    viele SaaS-Produkte 15–20 % Jahresrabatt an: Der Vorteil fürs Unternehmen liegt
    im besseren Cashflow, nicht in der Nettoauszahlung.

    ## Mahnwesen und fehlgeschlagene Abbuchungen

    Schlägt eine Verlängerung fehl (keine Deckung, abgelaufene Karte), kann Stripe
    die Abbuchung nach einem konfigurierbaren Zeitplan automatisch wiederholen. Der
    Fehlversuch selbst kostet nichts, aber du erhältst den Umsatz nicht.
    Drittanbieter-Tools wie Profitwell Retain steigern die Wiederherstellungsquote
    fehlgeschlagener Zahlungen um 40–60 %.

    ## Internationale Abonnenten

    Abonnenten mit außerhalb der USA ausgegebenen Karten verursachen zusätzlich
    **1,5 % Auslandsgebühr** (insgesamt 4,4 % + 0,30 $). Ist ein großer Teil deiner
    Abonnenten im Ausland, modelliere deinen effektiven Mischsatz entsprechend mit
    dem Rechner unten.

    ## Und Rückerstattungen?

    Erstattest du einem Abonnenten den Betrag, gibt Stripe den Prozentanteil
    (2,9 %) zurück, nicht aber die fixen 0,30 $. Bei einer vollen Erstattung von 99 $
    verlierst du also netto 0,30 $.
"stripe-fees-france":
  "title": "Stripe-Gebühren in Frankreich: EUR-Sätze und Auszahlungsbeispiele"
  "description": "Stripe-Gebühren für französische Unternehmen: 1,5 % + 0,25 € für europäische Karten und frankreichspezifische Zahlungsarten."
  "body": |
    Französische Unternehmen zahlen bei Stripe **1,5 % + 0,25 €** für im EWR
    ausgegebene Karten und **2,5 % + 0,25 €** für Karten außerhalb des EWR
    (Großbritannien, USA, international), genau wie in anderen EU-Ländern.
    Besonders ist in Frankreich die Carte Bancaire (CB), das nationale
    Kartennetz, das die meisten französischen Verbraucher nutzen und das Stripe mit
    derselben Gebührenstruktur unterstützt.

    ## Französische Besonderheiten

    **Carte Bancaire (CB)**: Stripe unterstützt CB im Rahmen der europäischen
    Kartenakzeptanz. Die Gebühr ist dieselbe wie bei Visa/Mastercard, da CB-Karten
    co-gebrandet sind. Keine Zusatzgebühr für CB.

    **Bancontact** (belgienspezifisch, in Frankreich kaum relevant): entfällt.

    **3D Secure**: Frankreich hat eine der höchsten 3DS-Nutzungsraten in Europa.
    Stripe übernimmt die 3DS-Compliance automatisch, ohne Zusatzgebühr pro
    Transaktion.

    ## Beispiele für Stripe-Gebühren in Frankreich (EUR)

    | Betrag | EWR-Karte | Nicht-EWR-Karte |
    |--------|---------|-------------|
    | 50 € | 1,00 € (2,0 %) | 1,50 € (3,0 %) |
    | 150 € | 2,50 € (1,67 %) | 4,00 € (2,67 %) |
    | 1.000 € | 15,25 € (1,53 %) | 25,25 € (2,53 %) |

    Nutze den Rechner oben mit 1,5 % und 0,25 € für Transaktionen mit EWR-Karten in Frankreich.
"stripe-fees-germany":
  "title": "Stripe-Gebühren in Deutschland: EUR-Sätze und Nettoauszahlung"
  "description": "Stripe-Gebühren für deutsche Unternehmen: 1,5 % + 0,25 € für europäische Karten, mit Beispielen und Umsatzsteuer."
  "body": |
    Deutsche Unternehmen zahlen bei Stripe **1,5 % + 0,25 €** für europäische
    Karten (im EWR ausgegebene Visa und Mastercard). Für Karten außerhalb des EWR
    (USA, Großbritannien, international) steigt der Satz auf **2,5 % + 0,25 €**.
    Das gehört dank der EU-Regulierung der Interchange-Gebühren (0,2–0,3 % für
    Verbraucherkarten) zu den niedrigsten Stripe-Sätzen weltweit.

    ## Beispiele für Stripe-Gebühren in Deutschland (EUR)

    | Betrag | EWR-Karte | Nicht-EWR-Karte |
    |--------|---------|-------------|
    | 25 € | 0,63 € (2,5 %) | 0,88 € (3,5 %) |
    | 100 € | 1,75 € (1,75 %) | 2,75 € (2,75 %) |
    | 500 € | 7,75 € (1,55 %) | 12,75 € (2,55 %) |

    ## Umsatzsteuer auf Stripe-Gebühren
    Stripe berechnet deutschen Unternehmen 19 % Umsatzsteuer auf seine Gebühren.
    Umsatzsteuerpflichtige Unternehmen (Umsatzsteuer-ID erforderlich) können sie
    als Vorsteuer abziehen. Stripe stellt monatlich eine Rechnung mit
    Umsatzsteuer in Euro aus.

    ## SEPA-Lastschrift als Alternative
    Bei deutschen Kunden ist die SEPA-Lastschrift eine beliebte Zahlungsart.
    Stripe unterstützt SEPA und berechnet nur 0,8 % (maximal 5 €) pro Transaktion,
    bei großen B2B-Rechnungen deutlich günstiger. Für wiederkehrende Abos mit
    deutschen Großkunden lohnt es sich, SEPA zu aktivieren.

    Nutze den Rechner oben mit individuellem Satz von 1,5 % und 0,25 € für Transaktionen mit EWR-Karten.
"stripe-vs-paypal-fees":
  "title": "Stripe- vs. PayPal-Gebühren: der direkte Vergleich"
  "description": "Genauer Gebührenvergleich zwischen Stripe und PayPal für Standardtransaktionen, Abos und internationale Zahlungen im Jahr 2024."
  "body": |
    Stripe und PayPal sind die zwei häufigsten Zahlungsanbieter für
    Online-Unternehmen. Ihre Standardsätze wirken ähnlich, doch bei der
    Margenoptimierung kommt es auf die Details an.

    ## Standard-Transaktionsgebühren (USA, inländische Karten)

    | Anbieter | Satz | Fixgebühr | Gebühr auf 100 $ | Netto auf 100 $ |
    |-----------|------|-----------|------------|------------|
    | Stripe | 2,9 % | 0,30 $ | 3,20 $ | **96,80 $** |
    | PayPal (PayPal Checkout) | 3,49 % | 0,49 $ | 3,98 $ | **96,02 $** |
    | PayPal (Advanced Card) | 2,89 % | 0,49 $ | 3,38 $ | **96,62 $** |

    Bei einer typischen Transaktion über 100 $ ist Stripe **0,78 $ günstiger** als
    PayPal Checkout. Auf 100.000 $ Umsatz sind das 780 $ Unterschied.

    ## Für Abos und wiederkehrende Abrechnung

    | Anbieter | Abo-Satz | Hinweise |
    |-----------|------------------|-------|
    | Stripe Billing | 2,9 % + 0,30 $ | Inklusive; erweitertes Mahnwesen über Stripe Radar |
    | PayPal Subscriptions | 3,49 % + 0,49 $ | Höherer Satz pro Transaktion |

    Stripe ist bei wiederkehrenden SaaS-Abos durchweg günstiger.

    ## Internationale und grenzüberschreitende Gebühren

    | Anbieter | Auslandsgebühr | Effektiver Gesamtsatz |
    |-----------|-----------------|---------------------|
    | Stripe | +1,5 % | 4,4 % + 0,30 $ |
    | PayPal | +1,5 % | ~5,0 % + 0,49 $ |

    ## Entwicklererfahrung

    Stripes API und Dokumentation gelten weithin als überlegen, wenn du einen
    eigenen Checkout baust. PayPals Hauptvorteil ist die Bekanntheit der Marke und
    die Vertrautheit der Käufer mit „Mit PayPal bezahlen“, was in manchen
    B2C-Kontexten die Conversion steigern kann.

    **Empfehlung:** Für SaaS, Entwicklertools und B2B-Produkte ist Stripe bei
    Gebühren, API-Qualität und Ökosystem (Stripe Atlas, Stripe Tax, Stripe Billing)
    die bessere Wahl. Für Marktplätze oder B2C-Produkte, bei denen PayPals
    vertrauter Checkout die Conversion fördert, kann sich die höhere Gebühr lohnen.

    Modelliere mit dem Stripe-Gebührenrechner oben deine genaue Nettoauszahlung.
    Für PayPal gibst du 3,49 % und 0,49 $ im Feld für den individuellen Satz ein.

