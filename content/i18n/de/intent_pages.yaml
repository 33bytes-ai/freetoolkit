"fixed-price-vs-time-and-materials-quoting":
  "title": "Festpreis oder Aufwand: So wählst du richtig"
  "description": "Die Abwägung zwischen Festpreis und Abrechnung nach Aufwand, wer in welchem Modell das Risiko trägt und wie du pro Projekt das richtige wählst."
  "body": |
    Die zwei vorherrschenden Preismodelle für Freelancer legen das Risiko an
    unterschiedliche Stellen. Wer für ein Projekt das falsche wählt, verschenkt
    entweder Geld oder macht unbezahlte Überstunden.

    ## Die Kernabwägung

    **Festpreis**: Du nennst einen Preis für definierte Leistungen. Dauert das
    Projekt länger als geschätzt, trägst du die Mehrzeit. Dauert es kürzer, behältst
    du die Differenz.

    **Nach Aufwand (Time & Material)**: Du rechnest die tatsächlich gearbeiteten
    Stunden zu deinem Satz ab. Der Kunde trägt das Risiko, dass es länger dauert;
    du wirst für jede Stunde bezahlt, egal wie Schätzung und Realität
    auseinanderliegen.

    ## Wann ein Festpreis gut funktioniert

    - Der Umfang ist klar definiert und ändert sich wahrscheinlich nicht
    - Du hast ähnliche Projekte gemacht und verlässliche Zeitdaten für die Schätzung
    - Der Kunde will Budgetsicherheit und zahlt dafür einen Aufschlag
    - Du kannst einen Puffer einplanen (meist 20–30 %), der normale Überschreitungen abfängt

    ## Wann Aufwand besser ist

    - Anforderungen entwickeln sich noch oder sind zu Beginn wirklich unbekannt
      (Discovery, F&E, neue Themengebiete)
    - Die Zusammenarbeit ist laufend, eher im Retainer-Stil als eine einzelne Leistung
    - Der Kunde braucht Flexibilität, um die Richtung zu ändern, ohne jedes Mal den
      Vertrag neu zu verhandeln

    ## Der hybride Ansatz

    Viele Freelancer bieten eine klar umrissene Phase (etwa Discovery oder einen
    MVP) zum Festpreis an und wechseln für die laufende Arbeit auf Aufwand, sobald
    sich die Anforderungen stabilisiert haben. So beschränkt sich das
    Festpreisrisiko auf den Teil, den du wirklich sicher schätzen kannst.

    ## Auch die Preispsychologie zählt

    Manche Kunden bevorzugen den Festpreis unabhängig von allen Abwägungen, weil er
    zu ihrer internen Budgetierung passt. Schon deshalb kann ein gut begründetes
    Aufwandsangebot gegen einen Festpreis-Wettbewerber verlieren. Achte bei der
    Wahl des Modells auf die Vorliebe des Kunden, nicht nur auf die Projektart.

    ## Häufige Fragen

    **Kann ich später von Aufwand auf Festpreis umstellen?**
    Ja: Wenn du lange genug mit einem Kunden arbeitest, um seinen typischen Umfang
    und seine Änderungswünsche zu kennen, kannst du künftige Phasen viel sicherer
    bepreisen als zu Beginn.

    **Wie gehe ich mit wachsendem Umfang bei Festpreisprojekten um?**
    Definiere die Leistungen ausdrücklich im Vertrag und behandle alles darüber
    hinaus als separat angebotenen Änderungsauftrag. Vereinbare diesen Ablauf vor
    dem Start, nicht erst, wenn der Umfang schon gewachsen ist.

    Mit der [Freelance-Projektkalkulation](/tools/freelance-project-estimate/)
    erstellst du ein Festpreisangebot aus Stundensatz, geschätzten Stunden und
    Risikopuffer.
"freelance-hourly-rate-calculator-guide":
  "title": "Deinen Freelance-Stundensatz festlegen: Was du 2024 verlangen solltest"
  "description": "So berechnest du einen tragfähigen Freelance-Stundensatz, der Steuern, Zusatzleistungen und unbezahlte Verwaltungszeit abdeckt und Spielraum zum Sparen lässt, je nach Rolle und Markt."
  "body": |
    Der häufigste Preisfehler von Freelancern ist, vom Gehaltsvergleich aus
    rückwärts zu rechnen. Hier ist ein Rahmen, der alles berücksichtigt, was ein
    Gehalt nicht abdeckt.

    ## Die echten Kosten der Selbstständigkeit gegenüber einer Anstellung

    Als Freelancer bekommst du nicht mehr:
    - Arbeitgeberanteil an den Lohnabgaben (~8 %)
    - Krankenversicherung (500–1.500 $ pro Monat)
    - Bezahlten Urlaub und Krankheitstage (10–20 Tage pro Jahr = 4–8 % der Zeit)
    - Arbeitgeberzuschuss zur Altersvorsorge 401(k) (3–5 % des Gehalts)
    - Büro und Ausstattung (unterschiedlich)

    Rechne diese Posten zu deinem gewünschten Nettoeinkommen hinzu, um den
    nötigen Bruttoumsatz zu erhalten.

    ## Formel für den Freelance-Satz

    **Nötiger Jahresumsatz = (gewünschtes Netto + Steuern + Zusatzleistungen + Urlaubsausgleich + Gemeinkosten)**
    **Stundensatz = nötiger Jahresumsatz ÷ abrechenbare Stunden**

    Dabei gilt: abrechenbare Stunden = Arbeitsstunden × 65–75 % (für Verwaltung,
    Vertrieb und unbezahlte Arbeit)

    ## Beispiel: Ziel 100.000 $ netto

    | Posten | Betrag |
    |------|--------|
    | Gewünschtes Netto | 100.000 $ |
    | Selbstständigen-Abgaben (15,3 %) | 20.000 $ |
    | Einkommensteuer Bund/Staat (25 %) | 30.000 $ |
    | Krankenversicherung | 12.000 $ |
    | Urlaub (3 Wochen) | 6.000 $ |
    | Nötiger Bruttoumsatz | 168.000 $ |
    | Abrechenbare Stunden (1.600 h × 70 %) | 1.120 |
    | **Mindeststundensatz** | **150 $/h** |

    Mit 150 $ pro Stunde und 1.120 abrechenbaren Stunden erzielst du 168.000 $
    Umsatz und behältst ~100.000 $ netto.

    Mit der [Freelance-Projektkalkulation](/tools/freelance-project-estimate/)
    baust du auf dieser Grundlage Projektangebote.
"how-to-quote-a-freelance-project":
  "title": "So kalkulierst du ein Freelance-Projekt: der vollständige Leitfaden"
  "description": "Schritt für Schritt zu einem Freelance-Angebot, das deine Zeit deckt, deine Marge schützt und den Kunden überzeugt."
  "body": |
    Freelance-Projekte genau zu kalkulieren gehört zu den schwierigsten
    Fähigkeiten. Kalkulierst du zu niedrig, ärgerst du dich über die Arbeit. Zu
    hoch, und du verlierst den Kunden. Hier ist ein Rahmen, der dich jedes Mal zu
    einer vertretbaren, profitablen Zahl führt.

    ## Schritt 1: erst den Umfang, dann den Preis

    Schätze nie Zeit ohne schriftlichen Umfang. Die „einfache Website“ eines
    Kunden kann eine statische Seite mit 5 Unterseiten sein oder ein Onlineshop
    mit 60. Bevor du irgendeine Zahl nennst, schreib Leistungen,
    Korrekturschleifen und das ausdrücklich Ausgeschlossene auf.

    ## Schritt 2: Stunden schätzen, dann mit 1,3–1,5 multiplizieren

    Erfasse 30 Tage lang deine Stunden bei Projekten. Du wirst feststellen, dass
    du systematisch um 30–50 % zu niedrig schätzt. Plane diesen Puffer in jedes
    Angebot ein.

    ## Schritt 3: deinen Satz anwenden

    Dein Satz muss abdecken: dein gewünschtes Nettoeinkommen, Steuern (25–35 %),
    Zusatzleistungen, unbezahlte Verwaltungszeit (20–30 % der Arbeitszeit) und
    das Risiko auftragsloser Zeiten.

    **Mindestsatz = (jährliches Einkommensziel + Steuern + Kosten) / abrechenbare Stunden**

    ## Schritt 4: eine Projektmanagement-Pauschale aufschlagen

    Schlag 10–15 % für Projektmanagement auf die Produktionszeit auf. Meetings,
    E-Mails, Korrekturen und Kundentelefonate sind echte Arbeit, auch wenn sie sich
    wie Overhead anfühlen.

    Mit der [Freelance-Projektkalkulation](/tools/freelance-project-estimate/)
    baust du dein Angebot aus seinen Bestandteilen auf.
"freelance-rate-by-experience":
  "title": "Freelance-Sätze nach Erfahrung und Technologie"
  "description": "Marktübliche Stundensätze für freiberufliche Entwickler, Designer und Berater auf Junior-, Mid- und Senior-Niveau, dazu wie du deinen Mindestsatz berechnest."
  "body": |
    Die Marktsätze für Freelancer schwanken enorm nach Können, Erfahrung,
    Technologie und Region. Die Zahlen unten beruhen auf aggregierten Daten von
    Freelance-Plattformen, Umfragen und direkten Berichten aus der Praxis (Stand
    2024). Nutze sie als Richtwert und finde dann mit dem Rechner oben den
    Mindestsatz, der deine Einkommensziele erreicht.

    ## Sätze für Entwickler (USD, remote)

    | Level | Allgemeine Entwicklung | React/Node | Python/ML | Blockchain/Web3 |
    |-------|------------|-----------|----------|----------------|
    | Junior (0–2 J.) | 35–60 $ | 45–75 $ | 50–80 $ | 60–100 $ |
    | Mid (2–5 J.) | 60–100 $ | 75–130 $ | 90–150 $ | 100–180 $ |
    | Senior (5–10 J.) | 100–180 $ | 120–200 $ | 140–220 $ | 180–300 $ |
    | Principal/Staff | 180–300 $+ | 200–350 $+ | 200–350 $+ | 300–500 $+ |

    ## Sätze für Designer (USD, remote)

    | Level | UI/UX-Design | Marke/Identität | Motion/3D |
    |-------|-------------|--------------|----------|
    | Junior | 40–65 $ | 45–70 $ | 50–80 $ |
    | Mid | 70–110 $ | 80–130 $ | 90–150 $ |
    | Senior | 120–180 $ | 130–200 $ | 150–250 $ |

    ## Sätze für Berater / Strategie (USD)

    Unabhängige Berater für Strategie, Produkt und Wachstum erzielen deutlich
    höhere Sätze, weil ihre Arbeit direkt aufs Geschäft wirkt:

    | Fachgebiet | Stundenspanne |
    |-----------|------------|
    | Produktstrategie | 150–350 $ |
    | Wachstum / Paid Acquisition | 100–250 $ |
    | Daten / Analytics | 100–200 $ |
    | CTO / technischer Berater | 150–400 $ |
    | Fractional CFO | 150–400 $ |

    ## Warum dein Mindestsatz nicht dein tatsächlicher Satz sein sollte

    Der Rechner ermittelt die Untergrenze, unter der du Geld verlierst. Dein
    tatsächlicher Satz sollte die Marktsätze oben plus deinen
    Spezialisierungsaufschlag widerspiegeln. Liegt der Marktsatz für deine
    Fähigkeiten deutlich über deinem berechneten Minimum, verlange den Marktsatz.
    Die Mindestsatz-Rechnung soll verhindern, dass du zu billig bist, nicht deine
    Obergrenze festlegen.
"freelance-rate-vs-salary":
  "title": "Soll ich Freelancer werden? Freelance-Sätze und Angestelltengehalt im Vergleich"
  "description": "Der echte Vergleich zwischen Freelance-Einkommen und Gehalt, unter Berücksichtigung von Steuern, Zusatzleistungen, nicht abrechenbarer Zeit und Einkommenssicherheit."
  "body": |
    Die Frage „Soll ich Freelancer werden?“ wird fast immer falsch gestellt, als
    Vergleich zwischen deinem aktuellen Gehalt und einem Ziel-Stundensatz. Der
    echte Vergleich ist viel differenzierter.

    ## Was dein Arbeitgeber tatsächlich für dich zahlt

    Ein Gehalt von 100.000 $ kostet den Arbeitgeber insgesamt etwa 130.000–145.000 $:

    | Posten | Kosten |
    |-----------|------|
    | Gehalt | 100.000 $ |
    | Lohnabgaben (Arbeitgeberanteil, ~7,65 %) | 7.650 $ |
    | Krankenversicherung (Arbeitgeberanteil) | 8.000–15.000 $ |
    | 401k-Zuschuss (3–6 %) | 3.000–6.000 $ |
    | Ausstattung, Büro | 3.000–8.000 $ |
    | Recruiting, Einarbeitung, Führung | 5.000–15.000 $ |
    | **Gesamtkosten Arbeitgeber** | **~127.000–152.000 $** |

    Als Freelancer trägst du all diese Kosten selbst. 100.000 $ Freelance-Umsatz
    sind, bevor du sie abziehst, netto deutlich weniger wert als 100.000 $ Gehalt.

    ## Der Multiplikator nicht abrechenbarer Zeit

    Freelancer rechnen meist 50–70 % ihrer Arbeitszeit ab. Die übrigen 30–50 %
    gehen in Akquise, Verwaltung, Rechnungen und Leerlauf zwischen Projekten.
    Arbeitest du 2.000 Stunden im Jahr und rechnest 65 % ab, hast du 1.300
    abrechenbare Stunden, um deine gesamten Jahreskosten zu decken.

    Rechne das mit dem Freelance-Stundensatz-Rechner oben für deine Situation
    durch: Der richtige Satz hängt von Einkommensziel, Steuersatz und
    Auslastung ab.

    ## Wann sich Freelancing finanziell lohnt

    Freelancing schlägt die Anstellung finanziell, wenn:
    - dein abrechenbarer Satz das 2,5- bis 3-Fache deines vergleichbaren Angestellten-Stundensatzes beträgt
    - du ganzjährig über 60 % Auslastung halten kannst
    - du eine gleichwertige Krankenversicherung zu vernünftigen Kosten bekommst
    - deine Arbeit Fähigkeiten mit hohem Marktwert pro Stunde erfordert (Spezialisierungsaufschlag)
"how-to-raise-your-freelance-rate-with-existing-clients":
  "title": "So erhöhst du deinen Freelance-Satz bei Bestandskunden"
  "description": "Ein praktischer Ablauf, um deinen Satz bei bestehenden Kunden zu erhöhen, ohne die Beziehung zu verlieren: Zeitpunkt, Formulierung und Umgang mit Widerstand."
  "body": |
    Bei einem neuen Kunden deinen Satz zu erhöhen ist einfach: Du nennst einen
    höheren Preis. Bei jemandem, mit dem du seit einem Jahr arbeitest, ist es ein
    anderes Gespräch, und die meisten Freelancer schieben es viel zu lange auf.

    ## Warum Freelancer Bestandskunden zu selten erhöhen

    Verlustangst wiegt schwerer als das Unbehagen, zu wenig zu verlangen: Einen
    bekannten, verlässlichen Kunden zu verlieren fühlt sich riskanter an als die
    langsamen, unsichtbaren Kosten, Monat für Monat unterbezahlt zu sein. Doch ein
    Kunde, der mit deiner Arbeit zum aktuellen Satz zufrieden ist, bleibt bei
    einer angemessenen Erhöhung sehr wahrscheinlich. Die Angst ist meist größer
    als das tatsächliche Risiko.

    ## Ein einfacher Ablauf

    1. **Kündige es 60–90 Tage vorher an**: genug Zeit, um es einzuplanen, womit
       der Einwand „das kommt jetzt überraschend“ komplett entfällt
    2. **Begründe mit dem Wert, nicht mit Lebenshaltungskosten**: „Mein Satz
       steigt auf X“ kommt besser an als „Ich muss erhöhen, weil meine Kosten
       gestiegen sind“, was zur Verhandlung über deine privaten Ausgaben statt
       über deinen Wert einlädt
    3. **Teile es mit, statt um Erlaubnis zu bitten**: „Ab [Datum] beträgt mein
       Satz X“ ist eine Tatsache über dein Geschäft, keine Bitte, die der Kunde
       ablehnen kann
    4. **Bleib dabei**: Die meisten Kunden, die sich wehren und dann zum neuen Satz
       bleiben, respektieren deine Zeit und Fristen danach mehr

    ## Wie viel und wie oft

    10–20 % Erhöhung ein- bis zweimal im Jahr ist gut vertretbar und kostet selten
    für sich allein einen Kunden. Größere Sprünge (30 % und mehr) lassen sich
    leichter mit deutlich mehr Umfang, Erfahrung oder nachweisbaren Ergebnissen
    seit der letzten Anpassung begründen.

    ## Umgang mit Widerstand

    Kann ein Kunde den neuen Satz nicht tragen, ist das eine nützliche
    Information: Vielleicht hat er die Obergrenze dessen erreicht, was er dir
    zahlen kann. Das ist ein Signal, mehr Energie in Kunden zu stecken, die mit
    deinem Satz mitwachsen können, statt unterbezahlt zu bleiben, um jede
    bestehende Beziehung zu halten.

    ## Häufige Fragen

    **Sollte ich alle Kunden gleichzeitig erhöhen?**
    Nicht unbedingt: Staffle es nach Vertragsverlängerung und teste die Erhöhung
    zuerst bei deiner sichersten Kundenbeziehung, um Vertrauen in den Ablauf zu
    gewinnen.

    **Was, wenn ein Kunde sagt, ein Wettbewerber sei günstiger?**
    Frag, was genau er zu diesem Preis braucht. Oft zeigt sich, dass nicht
    Gleiches mit Gleichem verglichen wird, oder es öffnet ein Gespräch über
    kleineren Umfang, statt die Beziehung ganz zu verlieren.

    Prüfe mit dem [Freelance-Stundensatz-Rechner](/tools/freelance-rate-calculator/),
    ob dein neuer Satz nach Steuern und Ausgaben weiterhin dein
    Mindesteinkommensziel erreicht.
"freelance-invoice-best-practices":
  "title": "Best Practices für Freelance-Rechnungen: Pflichtangaben und schneller bezahlt werden"
  "description": "Was jede Freelance-Rechnung enthalten muss (Pflichtfelder, Zahlungsbedingungen, Verzugsregelung) und bewährte Techniken, um schneller bezahlt zu werden."
  "body": |
    Eine gut aufgebaute Rechnung leistet zweierlei: Sie dokumentiert klar, was du
    geliefert hast, und macht es deinem Kunden so leicht wie möglich zu zahlen.

    ## Pflichtangaben auf der Rechnung

    Jede Rechnung sollte enthalten:
    - Name und Anschrift deines Unternehmens (oder deinen bürgerlichen Namen als Einzelunternehmer)
    - Name und Rechnungsanschrift des Kunden
    - Rechnungsnummer (fortlaufend, nie doppelt)
    - Rechnungsdatum und Fälligkeitsdatum
    - Einzelne Positionen mit Menge, Preis und Positionssumme
    - Zwischensumme, Rabatt (falls vorhanden), Steuer und Gesamtbetrag
    - Zahlungshinweise (Bankverbindung, PayPal, Stripe-Link)
    - Verzugsregelung („1,5 % pro Monat auf überfällige Beträge“)

    ## Zahlungsbedingungen, die Verzug reduzieren

    Die üblichen 30 Tage sind für Freelancer zu lang. Wirksamer sind:
    - **14 Tage** für etablierte Kunden mit gutem Zahlungsverhalten
    - **50 % vorab, 50 % bei Lieferung** für Neukunden oder große Projekte
    - **7 Tage mit 2 % Skonto**: Kunden, die sonst spät zahlen würden, zahlen früh
    - **Kartenabbuchung mit automatischer Wiederholung** (über Stripe) für Retainer-Kunden

    ## Psychologische Kniffe, die funktionieren

    1. **Nutze runde Zahlen** beim Satz und runde auf 5 $: einfacher für
       Kreditorenabteilungen
    2. **Füge einen „Jetzt bezahlen“-Button** mit Zahlungslink ein: weniger Reibung
    3. **Schick die Rechnung innerhalb von 24 Stunden nach Lieferung**: Je frischer,
       desto schneller wird bezahlt
    4. **Erinnere 7 Tage vor Fälligkeit**: ein freundlicher Hinweis, keine Mahnung

    Mit dem [Rechnungsrechner](/tools/invoice-total-calculator/) berechnest du die
    Summe mit korrekt angewendeten Rabatten und Steuern.
"how-to-calculate-invoice-total":
  "title": "So berechnest du eine Rechnungssumme mit Steuern und Rabatten"
  "description": "Schritt für Schritt zur korrekten Rechnungssumme: Positionen, Rabatte, Steuern und Verzugsgebühren."
  "body": |
    Wer die Rechnungssumme korrekt berechnet, vermeidet Streit, bekommt, was ihm
    zusteht, und hält seine Forderungen sauber.

    ## Formel der Rechnungssumme

    **Zwischensumme** = Summe aller Positionen (Menge × Stückpreis)
    **Nach Rabatt** = Zwischensumme × (1 − Rabatt in %)
    **Steuer** = Betrag nach Rabatt × Steuersatz
    **Gesamt** = Betrag nach Rabatt + Steuer

    ## Rabatt vor oder nach Steuern?

    Wende Rabatte immer auf den Nettobetrag an. Die Steuer wird auf den
    rabattierten Preis berechnet, nicht auf den ursprünglichen. Manche
    Rechtsordnungen schreiben das ausdrücklich vor; Steuer vor dem Rabatt zu
    berechnen ist falsch und berechnet deinem Kunden zu viel.

    ## Wann Verzugsgebühren dazukommen

    Nenne auf jeder Rechnung die Zahlungsbedingungen (z. B. „30 Tage netto, 1,5 %
    Verzugsgebühr pro Monat“). Verzugsgebühr = offener Betrag × Monatssatz ×
    Monate im Verzug. Eine Rechnung über 5.000 $, 60 Tage überfällig bei 1,5 % pro
    Monat = 5.000 $ × 1,5 % × 2 = 150 $ Gebühr.

    ## Best Practice für Rechnungsnummern

    Nutze fortlaufende Nummern (INV-001, INV-002 …) oder solche mit Jahrespräfix
    (2024-INV-001). Verwende nie eine Nummer doppelt: Das schafft Chaos in der
    Buchhaltung und kann bei einer Steuerprüfung auffallen.

    Berechne deine Rechnung mit dem [Rechnungsrechner](/tools/invoice-total-calculator/).
"contractor-vs-employee-hourly-rate":
  "title": "Auftragnehmer oder Angestellter: der echte Stundensatz im Vergleich"
  "description": "Wie du Tagessätze von Auftragnehmern und Angestelltengehälter vergleichbar machst: vollständige Stundensatz-Aufschlüsselung mit Zusatzleistungen und Steuern."
  "body": |
    Einen Tagessatz mit einer Festanstellung zu vergleichen ist wie Äpfel mit
    Birnen, solange du nicht alle versteckten Unterschiede in der
    Gesamtvergütung ausgleichst.

    ## Was Angestellte haben und Auftragnehmer nicht

    | Leistung | Jahreswert (Schätzung) |
    |---------|------------------------|
    | Krankenversicherung durch den Arbeitgeber | 6.000–14.000 $ |
    | 401(k)-Zuschuss des Arbeitgebers (4 %) bei 75.000 $ | 3.000 $ |
    | Bezahlter Urlaub (15 Tage) | ~4.300 $ bei 75.000 $ |
    | Lohnabgaben (Arbeitgeberanteil FICA) | 7,65 % des Gehalts |
    | Krankheitstage, Elternzeit | 1.000–5.000 $ |

    Zusatzleistungen machen typischerweise **25–40 % zusätzlich zum Grundgehalt** aus.

    ## Tagessatz in gleichwertiges Gehalt umrechnen

    Ein Auftragnehmer, der 220 Tage à 500 $ abrechnet, verdient brutto 110.000 $. Abzüglich:
    - Selbstständigen-Abgaben: ~15.000 $
    - Keine Arbeitgeberleistungen: −20.000 $ gegenüber der Anstellung
    - 20 % Puffer für Verwaltung und Leerlauf

    Gleichwertiges Gehalt: etwa **75.000–85.000 $**.

    ## Die Faustregel

    **Stundensatz Auftragnehmer ≈ gleichwertiger Angestellten-Stundensatz × 1,5–2**

    Ein Angestellter mit 75.000 $ kostet ~36 $ pro Stunde an Gehalt. Ein
    Auftragnehmer mit vergleichbarer Arbeit muss 55–72 $ pro Stunde verlangen, um
    nach allen Steuern und Kosten gleich vergütet zu sein.

    Modelliere deine genauen Zahlen mit dem [Gehalt-in-Stundensatz-Rechner](/tools/salary-to-hourly-calculator/).
"salary-to-hourly-conversion-guide":
  "title": "Gehalt in Stundensatz: So rechnest du richtig um"
  "description": "Schritt für Schritt vom Jahresgehalt zum Stundensatz, inklusive Teilzeit, Überstunden und effektivem Stundensatz nach Steuern."
  "body": |
    Ein Jahresgehalt in einen Stundensatz umzurechnen klingt einfach: durch
    2.080 Stunden teilen (52 Wochen × 40 Stunden). Das ergibt aber einen
    Bruttowert, der Urlaub, Feiertage, Kosten für Zusatzleistungen und
    Lohnabgaben ignoriert. Hier ist das vollständige Bild.

    ## Grundformel: Gehalt ÷ 2.080

    Ein Gehalt von 75.000 $ ÷ 2.080 Arbeitsstunden = **36,06 $ pro Stunde brutto**.

    Diesen Satz nutzt ein Arbeitgeber für die Überstundenberechnung, und er steht
    auf den meisten Gehaltsabrechnungen. Er ist aber nicht das, was du pro
    tatsächlich gearbeiteter Stunde verdienst.

    ## Bezahlten Urlaub berücksichtigen

    Mit 15 Urlaubstagen + 10 bundesweiten Feiertagen = 25 freie Tage = 200
    Stunden. Du arbeitest 2.080 − 200 = 1.880 Stunden pro Jahr. Dein effektiver
    Stundensatz: 75.000 $ ÷ 1.880 = **39,89 $ pro Stunde**. Du wirst auch für die
    freie Zeit bezahlt, aber wenn du wissen willst, was du pro produktiver Stunde
    kostest, nimm diese Zahl.

    ## Stundensatz nach Steuern

    Bei 22 % effektiver Bundessteuer und 6,2 % FICA:
    - Nettogehalt: 75.000 $ × (1 − 0,22 − 0,062) = ~53.850 $
    - Netto pro Stunde (÷ 2.080): **25,89 $ pro Stunde netto**

    ## Freelance-Satz und Angestelltensatz

    Freelancer müssen Selbstständigen-Abgaben (15,3 %), Zusatzleistungen,
    unbezahlte Verwaltungszeit und das Leerlaufrisiko hinzurechnen. Wer als
    Freelancer das Äquivalent von 75.000 $ erreichen will, muss meist **55–70 $
    pro Stunde** verlangen, um die Gesamtvergütung eines Angestellten zu
    erreichen.

    Modelliere deine Situation mit dem [Gehalt-in-Stundensatz-Rechner](/tools/salary-to-hourly-calculator/).

"freelance-vs-w2-tax-comparison":
  "title": "Steuern als Freelancer vs. W-2-Angestellter: die echten Kosten der Selbstständigkeit"
  "description": "Wie Freelance-Steuern im Vergleich zur W-2-Anstellung ausfallen: die 15,3 % SE Tax erklärt, warum Freelancer 25–30 % zurücklegen müssen und wann es sich lohnt."
  "body": |
    Vergleicht man einen Freelance-Auftrag über 100.000 $ mit 100.000 $ Gehalt,
    hat die Freelance-Option deutlich höhere Steuerkosten, aber auch mehr
    Einkommen vor Abzügen. Hier ist das Gesamtbild.

    ## Der Kernunterschied: SE Tax

    Ein W-2-Angestellter mit 100.000 $ zahlt:
    - Social Security (6,2 %) + Medicare (1,45 %) = **7,65 %** vom Gehalt
    - Der Arbeitgeber zahlt weitere 7,65 % (für den Angestellten unsichtbar)

    Ein Freelancer mit 100.000 $ Nettogewinn zahlt:
    - Beide Anteile: **15,3 %** SE Tax (15.300 $)
    - Die Hälfte (7.650 $) ist vom zu versteuernden Einkommen abziehbar

    Der Selbstständige zahlt also ~7.650 $ mehr Sozialabgaben als ein
    W-2-Angestellter mit gleichem Einkommen.

    ## Der Unterschied bei den Sätzen

    | Einkommen | W-2-Angestellter | Freelancer |
    |---|---|---|
    | 60.000 $ | ~9.000 $ Steuern gesamt | ~16.000 $ Steuern gesamt |
    | 100.000 $ | ~18.000 $ Steuern gesamt | ~28.000 $ Steuern gesamt |
    | 150.000 $ | ~32.000 $ Steuern gesamt | ~44.000 $ Steuern gesamt |

    *Schätzungen für Alleinstehende, Standardabzug, keine weiteren Einkünfte.*

    ## Warum Freelancer oft trotzdem besser dastehen

    1. **Höhere Bruttosätze**: Auftragnehmer verdienen für gleichwertige Arbeit
       meist 20–40 % mehr als Angestellte (das Unternehmen spart die
       Zusatzleistungen).
    2. **Abzüge**: Betriebsausgaben senken das zu versteuernde Einkommen unter das
       W-2-Niveau.
    3. **Altersvorsorge**: SEP-IRA und Solo 401(k) erlauben viel mehr steuerfreie
       Einzahlungen als die 23.000-$-Grenze des 401(k) für Angestellte.
    4. **Flexibilität**: Du kannst wählen, wann du Einkommen verbuchst, es in
       Jahre mit weniger Einkommen verschieben oder Abzüge in starke Jahre
       vorziehen.

    ## Die Gewinnschwelle

    Bietet ein Arbeitgeber 100.000 $ W-2 gegenüber einem Freelance-Auftrag über 115.000 $:
    - Zusätzliche SE Tax ≈ 7.650 $
    - Zusätzliches Einkommen: 15.000 $
    - Nettovorteil Freelance: ~7.350 $ vor Abzügen

    Rechnet man Abzüge hinzu (Arbeitszimmer, Krankenversicherung, Altersvorsorge),
    liegt die Freelance-Option mit 115.000 $ meist deutlich vor 100.000 $ Gehalt.

    Berechne deine Freelance-Steuern mit dem [Freelance-Steuerrechner](/tools/freelance-tax-estimator/).
"quarterly-estimated-tax-dates":
  "title": "Termine für vierteljährliche Steuervorauszahlungen 2024–2025 (Freelance-Ratgeber)"
  "description": "Wann sind die vierteljährlichen Steuervorauszahlungen fällig? Genaue IRS-Fristen für 2024 und 2025, Safe-Harbor-Regeln und was passiert, wenn du eine Zahlung versäumst."
  "body": |
    Der IRS verlangt von Selbstständigen viermal im Jahr Steuervorauszahlungen.
    Versäumte Fristen lösen Säumniszuschläge aus, derzeit etwa 8 % pro Jahr auf
    den Fehlbetrag.

    ## Fälligkeiten 2024

    | Quartal | Zeitraum | Fällig am |
    |---|---|---|
    | Q1 | 1. Jan. – 31. März | **15. April 2024** |
    | Q2 | 1. Apr. – 31. Mai | **17. Juni 2024** |
    | Q3 | 1. Juni – 31. Aug. | **16. September 2024** |
    | Q4 | 1. Sept. – 31. Dez. | **15. Januar 2025** |

    ## Fälligkeiten 2025

    | Quartal | Zeitraum | Fällig am |
    |---|---|---|
    | Q1 | 1. Jan. – 31. März | **15. April 2025** |
    | Q2 | 1. Apr. – 31. Mai | **16. Juni 2025** |
    | Q3 | 1. Juni – 31. Aug. | **15. September 2025** |
    | Q4 | 1. Sept. – 31. Dez. | **15. Januar 2026** |

    ## Safe-Harbor-Regeln

    Du vermeidest Säumniszuschläge, wenn du zahlst:
    - **Option A**: 90 % der Steuerschuld des laufenden Jahres, ODER
    - **Option B**: 100 % der Steuerschuld des Vorjahres (110 %, wenn das AGI über 150.000 $ liegt)

    Option B ist bei Freelancern mit schwankendem Einkommen beliebt: Du zahlst die
    Vorjahressteuer in vier gleichen Raten und musst das laufende Einkommen nicht
    genau vorhersagen.

    ## So zahlst du

    Zahle über [IRS Direct Pay](https://www.irs.gov/payments/direct-pay) (kostenlos,
    ohne Registrierung) oder EFTPS (Electronic Federal Tax Payment System). Die
    meisten Bundesstaaten haben eigene Vorauszahlungen mit ähnlichen Fristen: Sieh
    auf der Website deiner bundesstaatlichen Steuerbehörde nach.

    Schätze deine Zahlung mit dem [Freelance-Steuerrechner](/tools/freelance-tax-estimator/).
"self-employment-tax-deductions":
  "title": "Die wichtigsten Steuerabzüge für Freelancer und Selbstständige"
  "description": "Die wertvollsten Steuerabzüge für Freelancer: Arbeitszimmer, Krankenversicherung, Altersvorsorge, Ausstattung und der Abzug der halben SE Tax erklärt."
  "body": |
    Jeder legitime Betriebsabzug senkt deinen Nettogewinn und damit sowohl deine
    SE Tax (15,3 %) als auch deine Einkommensteuer. Ein Abzug von 10.000 $ bei 30 %
    kombiniertem Satz spart 3.000 $ Steuern.

    ## 1. Die Hälfte der SE Tax

    Der IRS erlaubt dir, 50 % deiner SE Tax vor Berechnung der Einkommensteuer vom
    Bruttoeinkommen abzuziehen. Beträgt deine SE Tax 12.240 $, ziehst du 6.120 $
    ab. Das passiert automatisch, Belege brauchst du keine.

    ## 2. Abzug für das Arbeitszimmer

    **Vereinfachte Methode**: 5 $ pro Quadratfuß eigenem Büroraum (max. 1.500 $)
    **Methode der tatsächlichen Kosten**: Wohnkosten (Hypothek oder Miete,
    Nebenkosten, Versicherung) anteilig nach dem ausschließlich geschäftlich
    genutzten Teil der Wohnung ansetzen.

    Das Büro muss *regelmäßig und ausschließlich* geschäftlich genutzt werden: ein
    Schreibtisch im gemeinsamen Wohnzimmer zählt nicht.

    ## 3. Beiträge zur Krankenversicherung

    Zahlst du deine Krankenversicherung selbst (nicht über den Arbeitgeberplan
    deines Ehepartners), sind 100 % der Beiträge vom Bruttoeinkommen abziehbar
    (nicht nur als Einzelabzug). Das gilt auch für Zahn- und Sehversicherung.

    ## 4. Beiträge zur Altersvorsorge

    - **SEP-IRA**: bis 25 % der Nettoeinkünfte aus selbstständiger Arbeit, max. 69.000 $ (2024)
    - **Solo 401(k)**: 23.000 $ Arbeitnehmerbeitrag + 25 % Arbeitgeberbeitrag
    - **Roth IRA**: 7.000 $ Beitrag, nicht abziehbar, aber steuerfreies Wachstum

    SEP-IRA und Solo 401(k) sind für Freelancer die wirksamsten Abzüge. Bei
    100.000 $ Nettogewinn spart ein voll ausgeschöpfter SEP-IRA ~7.000–10.000 $
    Steuern.

    ## 5. Ausstattung und Software

    Computer, Kameras, Mikrofone, Software-Abos, Cloud-Dienste, Coworking,
    Fachbücher und Kurse: alles abziehbar, wenn es geschäftlich genutzt wird.
    Section 179 erlaubt den vollen Abzug im ersten Jahr statt einer Abschreibung
    über die Zeit.

    ## 6. Professionelle Dienstleistungen

    Kosten für Buchhaltung, Rechtsberatung in geschäftlichen Angelegenheiten und
    Beiträge zur Berufshaftpflicht sind voll abziehbar.

    Schätze deine Steuerlast nach Abzügen mit dem [Freelance-Steuerrechner](/tools/freelance-tax-estimator/).
"employer-payroll-tax-guide-us":
  "title": "Arbeitgeber-Lohnabgaben in den USA: Leitfaden 2024"
  "description": "Vollständiger Leitfaden zu den US-Bundeslohnabgaben für Arbeitgeber (Social Security, Medicare, FUTA) mit Sätzen, Bemessungsgrenzen 2024 und Rechenbeispielen."
  "body": |
    Als Arbeitgeber in den USA zahlst du Lohnabgaben zusätzlich zum Bruttogehalt
    jedes Angestellten. Hier siehst du, was du schuldest und wie es berechnet wird.

    ## Bundes-Lohnabgaben für Arbeitgeber (2024)

    ### Social Security (OASDI): 6,2 %
    Satz: 6,2 % auf Löhne bis 168.600 $ (Bemessungsgrenze 2024, aktuelles Jahr prüfen)
    Der Angestellte zahlt ebenfalls 6,2 %; die gesamte FICA beträgt 12,4 %, je zur Hälfte.

    ### Medicare: 1,45 %
    Satz: 1,45 % auf den gesamten Lohn, ohne Obergrenze.
    Der Angestellte zahlt ebenfalls 1,45 % (+ 0,9 % zusätzliche Medicare auf Löhne über 200.000 $, nur für den Angestellten).

    ### FUTA (Bundes-Arbeitslosenabgabe): 0,6 %
    Satz: 6,0 % auf die ersten 7.000 $ Lohn je Angestelltem.
    Die meisten Arbeitgeber erhalten 5,4 % Anrechnung für die bundesstaatliche Arbeitslosenabgabe (SUTA), womit der effektive Satz auf **0,6 %** sinkt.

    ## Rechenbeispiel: Gehalt 80.000 $

    | Abgabe | Rechnung | Kosten Arbeitgeber |
    |-----|-------------|--------------|
    | Social Security | 80.000 $ × 6,2 % | 4.960 $ |
    | Medicare | 80.000 $ × 1,45 % | 1.160 $ |
    | FUTA | 7.000 $ × 0,6 % | 42 $ |
    | **Gesamt** | | **6.162 $** |

    Gesamte Beschäftigungskosten = 80.000 $ + 6.162 $ = **86.162 $**

    SUTA-Sätze unterscheiden sich je Bundesstaat (0,1 % bis über 10 %) und nach
    bisherigen Entlassungen. Modelliere den Satz deines Bundesstaats immer
    separat.

    Berechne mit dem [Lohnabgaben-Rechner](/tools/payroll-tax-calculator/) die
    Arbeitgeberkosten für jedes Gehalt.
"suta-futa-payroll-taxes-explained":
  "title": "SUTA und FUTA: bundesstaatliche und Bundes-Arbeitslosenabgaben erklärt"
  "description": "Wie FUTA und SUTA bei den Arbeitslosenabgaben des Arbeitgebers zusammenwirken: Sätze, Bemessungsgrenzen, Anrechnung und was eine Neueinstufung auslöst."
  "body": |
    Die meisten US-Arbeitgeber zahlen zwei Arbeitslosenabgaben gleichzeitig: FUTA
    (Bund) und SUTA (Bundesstaat). So greifen sie ineinander.

    ## FUTA: Bundes-Arbeitslosenabgabe

    **Satz**: 6,0 % auf die ersten 7.000 $ Lohn je Angestelltem.
    **Effektiver Nettosatz**: 0,6 % für die meisten Arbeitgeber.
    **Warum niedriger**: Wer SUTA pünktlich und vollständig zahlt, erhält 5,4 %
    Anrechnung, womit der effektive Satz auf 0,6 % sinkt.

    FUTA finanziert die Bundes-Arbeitslosenversicherung und Darlehen an die
    Programme der Bundesstaaten.

    ## SUTA: bundesstaatliche Arbeitslosenabgabe

    Die Sätze hängen vom Bundesstaat und der Einstufung des Arbeitgebers ab:
    - Neue Arbeitgeber: meist 1–4 % (je nach Bundesstaat)
    - Etablierte Arbeitgeber: 0,1 % bis über 10 % (je nach bisherigen Leistungsfällen)
    - Bemessungsgrenzen: von 7.000 $ (Bundesminimum) bis über 62.500 $ (Bundesstaat Washington)

    ## Das Einstufungssystem

    Dein SUTA-Satz wird jedes Jahr anhand deiner Entlassungen neu berechnet:
    - **Wenige Entlassungen** → der Satz sinkt („negative Erfahrung“)
    - **Viele Entlassungen** → der Satz steigt („positive Erfahrung“ im steuerlichen Sinn)

    Arbeitgeber mit umfangreichen Entlassungen können die FUTA-Anrechnung
    verlieren (Bundesstaaten mit gekürzter Anrechnung).

    ## Folgen für Personalentscheidungen

    Bedenke vor einer Entlassung: Schon ein einziger Leistungsantrag kann deinen
    SUTA-Satz für 3 Jahre oder länger erhöhen. Bei 100.000 $ Gehalt und 2 % SUTA
    kostet ein Prozentpunkt mehr ~500 $ pro Jahr und Angestelltem auf die
    Bemessungsgrundlage.

    Berechne mit dem [Lohnabgaben-Rechner](/tools/payroll-tax-calculator/) deine
    Bundesabgaben als Arbeitgeber. Die SUTA addierst du separat nach dem Satz
    deines Bundesstaats.
"vat-on-digital-services":
  "title": "MwSt. auf digitale Dienstleistungen: Regeln für SaaS- und Softwareunternehmen"
  "description": "Wie die MwSt. auf SaaS-Abos, Software und digitale Produkte für Kunden in Großbritannien und der EU anfällt, inklusive der OSS-Schwelle."
  "body": |
    Wenn du SaaS, Softwarelizenzen oder andere digitale Dienstleistungen
    verkaufst, sind die MwSt.-Regeln deutlich komplexer als bei physischen Waren.
    Das musst du wissen.

    ## EU-MwSt. auf digitale Dienstleistungen (das „Bestimmungslandprinzip“)

    Seit 2015 werden digitale Dienstleistungen an EU-Verbraucher dort besteuert,
    wo der **Kunde** sitzt, nicht wo du ansässig bist. Das heißt:

    - Ein US-SaaS, das einem französischen Verbraucher etwas berechnet, muss französische MwSt. (20 %) erheben
    - Ein britisches SaaS, das einem deutschen Unternehmen etwas berechnet, erhebt 0 % (B2B-Reverse-Charge)
    - Ein australischer Entwickler, der eine App an italienische Verbraucher verkauft, muss italienische MwSt. (22 %) erheben

    **EU-OSS-Schwelle**: Übersteigen deine digitalen Verkäufe an EU-Verbraucher
    insgesamt 10.000 € pro Jahr, musst du dich für die MwSt. registrieren (lokal
    oder über den One-Stop-Shop der EU). Darunter darfst du den Satz deines eigenen
    Landes anwenden.

    ## B2B oder B2C: der entscheidende Unterschied

    Die Regeln oben gelten für **B2C** (Verkauf an Verbraucher). Bei **B2B**
    (Verkauf an andere umsatzsteuerlich registrierte Unternehmen) gilt das
    Reverse-Charge-Verfahren:
    - Du berechnest 0 % (bzw. keine MwSt.)
    - Der Geschäftskunde meldet die MwSt. selbst in seinem Land
    - Du musst seine USt-IdNr. einholen und prüfen

    ## Regeln in Großbritannien nach dem Brexit

    Großbritannien hat ein eigenes MwSt.-Regime für digitale Dienstleistungen.
    Nicht britische Unternehmen mit digitalen Verkäufen in Großbritannien über
    8.818 £ pro Jahr müssen sich für die britische MwSt. (derzeit 20 %)
    registrieren und getrennt von der EU-MwSt. Erklärungen abgeben.

    Mit unserem [MwSt.-Rechner](/tools/vat-calculator/) berechnest du den
    richtigen Betrag zu jedem Satz. Aktuelle Schwellen findest du auf der Website
    der Steuerbehörde deines Landes.
"vat-rates-by-country-2024":
  "title": "MwSt.-Sätze nach Land 2024: Großbritannien, EU, Australien, Kanada"
  "description": "Vollständige Liste der MwSt.-/GST-Regelsätze nach Land für 2024, mit ermäßigten Sätzen für Güter des Grundbedarfs und Regeln für digitale Dienstleistungen."
  "body": |
    MwSt., GST (Goods and Services Tax) und Sales Tax sind allesamt
    Verbrauchsteuern, doch Sätze, Regeln und Namen unterscheiden sich je nach
    Land. Hier sind die Regelsätze der häufigsten Handelsziele.

    ## MwSt.-/GST-Regelsätze 2024

    | Land | Regelsatz | Ermäßigter Satz | Hinweise |
    |---------|--------------|--------------|-------|
    | Großbritannien | 20 % | 5 % | 0 % auf Lebensmittel und Kinderartikel |
    | Deutschland | 19 % | 7 % | |
    | Frankreich | 20 % | 5,5 % / 10 % | |
    | Italien | 22 % | 10 % / 5 % | |
    | Spanien | 21 % | 10 % | |
    | Niederlande | 21 % | 9 % | |
    | Schweden | 25 % | 6 % / 12 % | Höchster Satz in der EU |
    | Norwegen | 25 % | 15 % | Nicht in der EU |
    | Australien | GST 10 % | entfällt | Einheitssatz |
    | Kanada | GST 5 % | entfällt | Zzgl. provinzieller PST |
    | Neuseeland | GST 15 % | entfällt | |
    | Indien | GST 18 % | 5 % / 12 % | Mehrere Stufen |
    | USA | 0 % (Bund) | — | Nur Sales Tax der Bundesstaaten |

    ## MwSt.-Regeln für digitale Dienstleistungen

    Verkaufst du digitale Produkte (Software, E-Books, SaaS-Abos) an
    EU-Verbraucher, musst du die MwSt. zum Satz des Kundenlandes berechnen, nicht
    zu dem deines eigenen Landes, auch wenn du außerhalb der EU ansässig bist. Der
    One-Stop-Shop (OSS) der EU vereinfacht das, weil du nur eine EU-MwSt.-Erklärung
    abgibst.

    Großbritannien hat seit dem Brexit ähnliche Regeln: Nicht britische
    Unternehmen, die digitale Dienstleistungen an britische Verbraucher verkaufen,
    müssen sich ab 8.818 £ Umsatz pro Jahr für die britische MwSt. registrieren.

    Mit unserem [MwSt.-Rechner](/tools/vat-calculator/) schlägst du die MwSt. zu
    jedem Satz auf oder rechnest sie heraus.
"vat-reverse-charge-b2b-eu-explained":
  "title": "Das Reverse-Charge-Verfahren bei B2B-Verkäufen in der EU, erklärt"
  "description": "Wie das EU-Reverse-Charge-Verfahren bei grenzüberschreitenden B2B-Verkäufen funktioniert, wann es gilt und was auf deiner Rechnung stehen muss."
  "body": |
    Wenn du digitale Dienstleistungen oder Waren B2B an Kunden in anderen
    EU-Ländern verkaufst, hast du „Reverse Charge“ vermutlich schon auf einer
    Rechnungsvorlage gesehen. Für Verkäufer außerhalb der EU ist es einer der am
    häufigsten missverstandenen Teile der EU-MwSt.

    ## Was Reverse Charge tatsächlich bedeutet

    Normalerweise berechnet der Verkäufer die MwSt. und führt sie ans Finanzamt
    ab. Beim Reverse-Charge-Verfahren erfasst stattdessen der **Käufer** die MwSt.
    selbst: Er meldet sie in seiner eigenen Erklärung als Steuerschuld und (in der
    Regel) als voll abziehbare Vorsteuer, was sich bei einem voll
    vorsteuerabzugsberechtigten Unternehmen zu null saldiert. Der Verkäufer
    berechnet auf der Rechnung **0 % MwSt.**

    ## Wann es gilt

    - Der Verkauf ist **B2B** (der Käufer ist in einem anderen EU-Land für die MwSt. registriert)
    - Der Käufer gibt eine **gültige USt-IdNr.** an, die du prüfst (über das VIES-System der EU)
    - Es gilt **nicht** für B2C-Verkäufe; diese folgen den EU-Regeln für digitale
      Dienstleistungen, bei denen du den Satz des Käuferlandes berechnest

    ## Was auf der Rechnung stehen muss

    - Die USt-IdNr. beider Parteien
    - Der Vermerk „Steuerschuldnerschaft des Leistungsempfängers“ bzw. „Reverse Charge, Art. 196 MwSt-Systemrichtlinie“
    - Kein berechneter MwSt.-Betrag (0 %)

    ## Warum es das gibt

    Reverse Charge erspart einem ausländischen Verkäufer die MwSt.-Registrierung
    in jedem Käuferland für B2B-Geschäfte. Ohne das Verfahren bräuchte ein US-
    oder britisches SaaS-Unternehmen, das an Firmen in allen 27 Mitgliedstaaten
    verkauft, Dutzende lokaler Registrierungen. Die Compliance-Last geht auf den
    Käufer über, der ohnehin registriert ist und die Steuer am besten selbst
    korrekt erfassen kann.

    ## Was schiefgehen kann

    Berechnest du MwSt., wo Reverse Charge hätte gelten müssen, kann der Käufer sie
    nicht auf normalem Weg zurückholen, und du hast eine Steuer vereinnahmt, die
    dir nicht zustand. Umgekehrt kann dich Reverse Charge ohne Prüfung der
    USt-IdNr. (etwa wenn sie ungültig ist oder der Käufer gar nicht registriert
    ist) für die MwSt. haftbar machen, die du hättest berechnen müssen.

    ## Häufige Fragen

    **Muss ich die USt-IdNr. jedes Mal prüfen?**
    Ja: Nutze vor jedem neuen B2B-Kunden die VIES-Abfrage der EU und bewahre einen
    Nachweis der Prüfung in deinen Compliance-Unterlagen auf.

    **Und Verkäufe aus Großbritannien nach dem Brexit?**
    B2B-Verkäufe von Großbritannien in die EU werden meist weiterhin ähnlich
    steuerfrei behandelt, aber die britischen Regeln haben sich vom EU-Rahmen
    entfernt. Prüf die aktuellen Hinweise des HMRC, statt anzunehmen, dass die
    EU-Regeln unverändert gelten.

    Nutze den [MwSt.-Rechner](/tools/vat-calculator/) für übliche Brutto-/Netto-
    Rechnungen bei Geschäften, bei denen MwSt. anfällt.

"commission-accelerators-explained":
  "title": "Provisions-Akzeleratoren im Vertrieb, erklärt"
  "description": "Wie Akzeleratorstufen in Provisionsplänen funktionieren, warum es sie gibt und wie du die Gesamtvergütung bei verschiedenen Zielerreichungen modellierst."
  "body": |
    Ein Akzelerator ist ein höherer Provisionssatz, der greift, sobald ein
    Vertriebler 100 % seiner Quote übertrifft. Er belohnt Übererfüllung, statt den
    Verdienst nach Erreichen des Ziels zu deckeln.

    ## Eine typische Akzeleratorstruktur

    | Zielerreichung | Provisionssatz |
    |-----------|------------------|
    | 0–100 % der Quote | Basissatz (z. B. 10 %) |
    | 100–150 % der Quote | 1,5 × Basissatz (15 %) |
    | Über 150 % der Quote | 2 × Basissatz (20 %) |

    Wer genau die Quote erreicht, bekommt den Basissatz auf den gesamten Umsatz.
    Wer 160 % erreicht, bekommt den Basissatz bis 100 %, den erhöhten Satz auf das
    Band 100–150 % und den Höchstsatz auf alles über 150 %. Jedes Band wird separat
    berechnet und nicht rückwirkend auf die Gesamtsumme angewendet.

    ## Warum Akzeleratoren statt eines festen Satzes

    Ein fester Satz setzt dem Ehrgeiz eine natürliche Grenze: Ist die Quote
    erreicht, sinkt der Anreiz weiterzumachen deutlich, wenn gleich die nächste
    Quote ansteht. Akzeleratoren halten den Anreiz für „noch einen Abschluss“ bis
    zum Periodenende wach, genau das Verhalten, das herausragende Quartale
    ausmacht.

    ## Die Kehrseite: Dezeleratoren

    Manche Pläne enthalten das Gegenteil: einen reduzierten Satz unterhalb einer
    Mindestzielerreichung (z. B. unter 50 % der Quote), damit Vertriebler Deals
    nicht in die nächste Periode schieben, wenn sie die laufende ohnehin verfehlen.
    Dezeleratoren sind seltener als Akzeleratoren und umstrittener, weil sie auch
    für Umstände bestrafen können, die der Vertriebler nicht beeinflusst.

    ## Gesamtvergütung mit Akzeleratoren modellieren

    Um den Jahresverdienst zu schätzen, multipliziere nicht einfach die erwartete
    Zielerreichung mit dem Basissatz, sondern rechne die Provision Band für Band
    anhand der Zielerreichung. Wer konstant 120 % erreicht, verdient mit
    Akzeleratoren deutlich mehr als das 1,2-Fache der Basisprovision.

    ## Häufige Fragen

    **Gelten Akzeleratoren pro Deal oder pro Periode?**
    Fast immer pro Periode (monatlich, vierteljährlich oder jährlich) auf Basis der
    kumulierten Zielerreichung, nicht pro einzelnem Deal.

    **Sind Akzeleratoren für SDRs so üblich wie für AEs?**
    Bei SDRs seltener, weil ihre Vergütung meist an generierte Pipeline statt an
    abgeschlossenen Umsatz gekoppelt ist. Sie werden aber beliebter, weil
    Unternehmen ihre besten SDRs ähnlich wie AEs belohnen wollen.

    Mit dem [Provisionsrechner](/tools/commission-calculator/) modellierst du deine
    Gesamtvergütung und OTE-Zielerreichung bei einem bestimmten Umsatz.
"how-to-structure-sales-commission-plan":
  "title": "So strukturierst du einen Provisionsplan für den Vertrieb"
  "description": "Ein gut gestalteter Provisionsplan richtet die Anreize der Vertriebler an den Umsatzzielen aus. Die Kernbestandteile: OTE, Quotendesign, Auszahlungszeitpunkt, Akzeleratoren und Rückforderungsklauseln."
  "body": |
    Ein Provisionsplan, den Vertriebler verstehen und dem sie vertrauen, ist einer
    der stärksten Hebel für Umsatzwachstum. Ein Plan, der verwirrt oder frustriert,
    erzeugt Fluktuation.

    ## Die 5 Kernbestandteile

    **1. OTE und Aufteilung**: Lege die Gesamtvergütung bei Zielerreichung und die Aufteilung fix/variabel fest. Die meisten SaaS-AE-Pläne zielen auf 50/50 im Mid-Market und 60/40 im Enterprise.

    **2. Quote**: Die Jahresquote sollte das 4- bis 7-Fache der OTE betragen, damit die Unit Economics gesund bleiben. Ein Vertriebler mit 150.000 $ OTE braucht eine Quote von 600.000 $ bis 1 Mio. $ ARR.

    **3. Auszahlungszeitpunkt**: bei Vertragsabschluss, bei Rechnungsstellung oder bei Zahlungseingang. Abschlussbasierte Pläne sind einfacher, zahlungsbasierte schützen vor schlechten Deals.

    **4. Akzeleratoren**: gestaffelte Provisionssätze über 100 % der Quote. Nötig, um Top-Performer zu gewinnen und zu halten.

    **5. Rückforderungen (Clawbacks)**: Die Provision wird zurückgezahlt, wenn ein Kunde innerhalb von 90–180 Tagen kündigt. Das schützt vor erzwungenen Deals und falschen Anreizen.

    ## Häufige Fehler

    - **Verdienstobergrenze**: Deckel demotivieren die Besten, die nach Erreichen des Deckels aufhören. Akzeleratoren sind besser.
    - **Zu komplexe Mechanik**: Kann ein Vertriebler seine Provision nicht im Kopf ausrechnen, ist der Plan zu kompliziert.
    - **Häufige Planänderungen**: Strukturänderungen mitten im Jahr zerstören Vertrauen. Ändere nur zu Beginn des Geschäftsjahres.
"what-is-on-target-earnings":
  "title": "Was ist OTE (On-Target Earnings)?"
  "description": "OTE (On-Target Earnings) ist die jährliche Gesamtvergütung eines Vertrieblers bei genau 100 % Zielerreichung, aus Fixgehalt und variabler Provision. Sie ist der Maßstab für die Gestaltung von Vertriebsvergütungsplänen."
  "body": |
    **On-Target Earnings (OTE)** bezeichnet die Gesamtvergütung bei 100 % Quote. Es ist die Zahl, die Recruiter nennen und auf die Vertriebler hinarbeiten.

    $$\text{OTE} = \text{Fixgehalt} + \text{Provision bei 100 \% Quote}$$

    ## OTE-Aufteilungen

    Das Verhältnis von Fix- zu variabler Vergütung in der OTE:

    | Rolle | Übliche Aufteilung | Begründung |
    |------|--------------|-----------|
    | SDR / BDR | 70/30 | Fokus auf Aktivität, nicht auf abgeschlossenen Umsatz |
    | Account Executive | 50/50 | Ausgewogener Anreiz zum Abschluss |
    | Enterprise-AE | 60/40 | Längere Zyklen; mehr Fixgehalt überbrückt Lücken |
    | Vertriebsleitung | 60/40 | Belohnt die Teamleistung |

    ## Akzeleratoren

    Die meisten gut gestalteten Vergütungspläne haben Akzeleratoren über 100 % OTE: höhere Provisionssätze für Umsatz über der Quote. Übliche Struktur:
    - 0–50 %: 50 % des Standardsatzes
    - 50–100 %: 100 % des Standardsatzes
    - 100–125 %: 150 % des Standardsatzes
    - Über 125 %: 200 % des Standardsatzes

    So werden Übererfüller überproportional belohnt und Top-Performer gehalten.

    ## Warum die OTE zählt

    Wer seine OTE kennt, kann den Umsatz berechnen, der für jedes Einkommensziel nötig ist. Modelliere mit dem Provisionsrechner verschiedene Szenarien der Zielerreichung, bevor du eine neue Stelle annimmst.
"contractor-vs-employee-cost":
  "title": "Kosten von Auftragnehmer und Angestelltem: Wann sich was rechnet"
  "description": "Ein finanzieller Rahmen für die Wahl zwischen Auftragnehmer und Angestelltem: Vollkostenvergleich, risikobereinigte Rechnung und Gewinnschwellenanalyse."
  "body": |
    Die übliche Sicht („Auftragnehmer sind teuer, Angestellte langfristig
    günstiger“) stimmt oft, verlangt aber saubere Rechnung. So vergleichst du.

    ## Die Grundgleichung der Kosten

    **Gesamtkosten Angestellter** = Gehalt × 1,25–1,40 (Abgaben + Leistungen)

    **Kosten Auftragnehmer** = Stundensatz × gearbeitete Stunden

    Bei 100 $ pro Stunde für 2.080 Stunden (Vollzeit): 208.000 $ pro Jahr

    Vergleichbarer Angestellter mit 120.000 $ Gehalt, alles inklusive: 156.000 $ pro Jahr

    Hier ist der Angestellte klar günstiger, aber nur, wenn du jemanden Vollzeit,
    ganzjährig und mit denselben Fähigkeiten brauchst.

    ## Wann Auftragnehmer günstiger sind

    1. **Teilzeitbedarf**: unter 20 Stunden pro Woche (unter 1.040 Stunden pro
       Jahr); die Nebenkosten eines Angestellten verpuffen in ungenutzter
       Kapazität.

    2. **Kurzes Projekt**: 3–6 Monate; du sparst Recruiting, Abfindung und die
       Einrichtung von Leistungen für einen begrenzten Einsatz.

    3. **Spezialwissen**: Ein Spezialist für 200 $ pro Stunde über 40 Stunden
       (8.000 $) ist günstiger, als für eine einmalige Aufgabe einen
       spezialisierten Angestellten für 150.000 $ im Jahr einzustellen.

    4. **Tempo**: Auftragnehmer können in Tagen starten; Angestellte brauchen
       30–90 Tage für Suche und Einarbeitung.

    ## Versteckte Kosten von Angestellten und Auftragnehmern

    | Faktor | Angestellter | Auftragnehmer |
    |---|---|---|
    | Recruitingkosten | 5.000–30.000 $ | Minimal |
    | Einarbeitungszeit | 2–6 Monate | Tage |
    | Abfindungsrisiko | Ja | Nein |
    | Kosten für Leistungen | 15.000–25.000 $ pro Jahr | Keine |
    | Führungsaufwand | Höher | Niedriger |
    | Übertragung geistigen Eigentums | Klar geregelt | Erfordert Vertrag |
    | Compliance-Risiko | Geringer (W-2) | Risiko der Scheinselbstständigkeit |

    ## Die Formel für die Gewinnschwelle

    Ab welchem Satz ist ein Auftragnehmer gleich teuer wie ein Angestellter?

    **Schwellensatz Auftragnehmer** = (Gehalt × 1,30) ÷ benötigte Stunden

    Für einen Angestellten mit 100.000 $, der 1.040 Stunden pro Jahr gebraucht wird: (130.000 $ ÷ 1.040) = **125 $ pro Stunde**

    Verlangt der Auftragnehmer mehr als 125 $ pro Stunde für 1.040 Stunden, ist der
    Angestellte an der Grenze günstiger. Verlangt er weniger, ist der
    Auftragnehmer günstiger.

    Rechne deine Zahlen mit dem [Mitarbeiterkosten-Rechner](/tools/employee-cost-calculator/) durch.
"employee-cost-calculator/employer-payroll-taxes-explained":
  "title": "Arbeitgeber-Lohnabgaben erklärt: FICA, FUTA und SUTA"
  "description": "Was sind Arbeitgeber-Lohnabgaben in den USA? Sätze und Bemessungsgrenzen von FICA, FUTA und SUTA und wie du berechnest, was du als Arbeitgeber schuldest."
  "body": |
    Als Arbeitgeber zahlst du auf den Lohn jedes Angestellten drei Hauptarten von
    Abgaben. Sie kommen zu dem hinzu, was der Angestellte schuldet, und gehen
    direkt von deinem Budget ab.

    ## FICA: Social Security und Medicare

    **Social Security**: 6,2 % auf Löhne bis 168.600 $ (Bemessungsgrenze 2024)
    **Medicare**: 1,45 % auf den gesamten Lohn (ohne Obergrenze)
    **Zusätzliche Medicare**: 0,9 % auf Löhne über 200.000 $, aber das ist der
    Anteil des *Angestellten*, nicht des Arbeitgebers

    **Arbeitgeber-FICA gesamt**: **7,65 %** auf Löhne bis 168.600 $, darüber
    **1,45 %**.

    Bei 100.000 $ Gehalt: FICA = 7.650 $
    Bei 200.000 $ Gehalt: FICA = (168.600 $ × 7,65 %) + (31.400 $ × 1,45 %) = 12.898 $ + 455 $ = 13.353 $

    ## FUTA: Bundes-Arbeitslosenabgabe

    **Satz**: 6 % auf die ersten 7.000 $ Lohn, reduziert auf **effektiv 0,6 %** für
    Arbeitgeber in Bundesstaaten ohne Rückstände beim Bundes-Arbeitslosenfonds
    (alle bis auf wenige)

    **Maximum pro Angestelltem**: 7.000 $ × 0,6 % = **42 $ pro Jahr**

    FUTA ist ein kleiner Posten (42 $ pro Angestelltem), muss aber vierteljährlich
    und jährlich gemeldet werden.

    ## SUTA: bundesstaatliche Arbeitslosenabgabe

    Jeder Bundesstaat legt Bemessungsgrenze und Satz selbst fest:
    - **Kalifornien**: 3,4 % auf die ersten 7.000 $ (Satz für neue Arbeitgeber)
    - **New York**: 3,4 % auf die ersten 12.500 $
    - **Texas**: 2,7 % auf die ersten 9.000 $
    - **Florida**: 2,7 % auf die ersten 7.000 $

    Die Sätze ändern sich mit deiner „Einstufung“: Arbeitgeber mit wenigen
    Entlassungen bekommen mit der Zeit niedrigere Sätze.

    ## Schnellübersicht: Arbeitgeberkosten bei üblichen Gehältern

    | Gehalt | FICA | FUTA | SUTA (Ø 2,7 %) | Gesamt |
    |---|---|---|---|---|
    | 60.000 $ | 4.590 $ | 42 $ | 189 $ | 4.821 $ |
    | 100.000 $ | 7.650 $ | 42 $ | 189 $ | 7.881 $ |
    | 150.000 $ | 11.475 $ | 42 $ | 189 $ | 11.706 $ |

    Berechne die Gesamtkosten eines Angestellten mit dem [Mitarbeiterkosten-Rechner](/tools/employee-cost-calculator/).
"true-cost-of-hiring-an-employee":
  "title": "Die echten Kosten einer Einstellung: mehr als das Grundgehalt"
  "description": "Die vollständige Aufschlüsselung, was ein Angestellter wirklich kostet: Lohnabgaben, Krankenversicherung, 401k und wie du die 1,3x-Regel für die Personalplanung nutzt."
  "body": |
    Verlangt ein Kandidat 120.000 $ Gehalt, kostet er dein Unternehmen tatsächlich
    150.000 bis 175.000 $ pro Jahr. Hier ist der Grund, und wie du dafür planst.

    ## Alle Kosten eines Angestellten

    ### 1. Grundgehalt
    Die Basis. Alles andere wird obendrauf gerechnet.

    ### 2. Arbeitgeber-Lohnabgaben (7,65–8,5 %)

    - **FICA**: 6,2 % Social Security (gedeckelt bei 168.600 $ im Jahr 2024) + 1,45 % Medicare (ohne Obergrenze)
    - **FUTA**: 0,6 % auf die ersten 7.000 $ ≈ 42 $ pro Angestelltem und Jahr
    - **SUTA**: je nach Bundesstaat und Einstufung, im Schnitt ~2,7 % auf die ersten 7.000–56.500 $

    Bei 120.000 $ Gehalt: Lohnabgaben ≈ 9.640 $

    ### 3. Krankenversicherung (die größte Variable)

    Laut der Umfrage 2024 der Kaiser Family Foundation:
    - Einzelversicherung: im Schnitt **8.435 $ pro Jahr** Arbeitgeberanteil
    - Familienversicherung: im Schnitt **17.393 $ pro Jahr** Arbeitgeberanteil

    Bei einem Startup, das allen eine Einzelversicherung bietet: +8.435 $ pro Angestelltem

    ### 4. Altersvorsorge

    - 4 % 401(k)-Zuschuss auf 120.000 $ Gehalt = **4.800 $ pro Jahr**
    - Manche Unternehmen bieten Safe-Harbor-Pläne (3 % unabhängig vom Eigenbeitrag) = **3.600 $ pro Jahr**

    ### 5. Weitere Leistungen

    - Lebens- und Berufsunfähigkeitsversicherung: 300–800 $ pro Jahr
    - Arbeitgeberbeitrag zu FSA/HSA: 500–1.500 $ pro Jahr
    - Weiterbildungsbudget: 500–3.000 $ pro Jahr
    - Aktienoptionen oder RSUs: sehr unterschiedlich

    ## Die vollständige Rechnung

    | Bestandteil | Betrag |
    |---|---|
    | Grundgehalt | 120.000 $ |
    | Lohnabgaben | 9.640 $ |
    | Krankenversicherung (einzeln) | 8.435 $ |
    | 401(k)-Zuschuss (4 %) | 4.800 $ |
    | Weitere Leistungen | 1.000 $ |
    | **Gesamt (ohne Bonus)** | **143.875 $** |

    Multiplikator: 1,20x ohne Bonus, 1,30–1,35x mit 10–15 % Bonus.

    Modelliere deine eigenen Zahlen mit dem [Mitarbeiterkosten-Rechner](/tools/employee-cost-calculator/).
"how-to-calculate-employee-turnover-rate":
  "title": "So berechnest du die Fluktuationsrate"
  "description": "Die Formel der Fluktuationsrate Schritt für Schritt, wie du die durchschnittliche Belegschaft richtig berechnest, und typische Rechenfehler, die du vermeiden solltest."
  "body": |
    Die Fluktuationsrate gehört zu den einfachsten HR-Kennzahlen und lässt sich
    trotzdem leicht verfälschen, wenn man die falsche Belegschaftszahl als Nenner
    nimmt.

    ## Die Formel

    $$\text{Fluktuationsrate} = \frac{\text{Abgänge}}{\text{Durchschnittliche Belegschaft}} \times 100$$

    $$\text{Durchschnittliche Belegschaft} = \frac{\text{Anfangsbestand} + \text{Endbestand}}{2}$$

    ## Ein Rechenbeispiel

    Du startest das Jahr mit 80 Angestellten, beendest es mit 100, und 15 Personen
    sind im Laufe des Jahres gegangen (freiwillig und unfreiwillig zusammen).

    Durchschnittliche Belegschaft = (80 + 100) ÷ 2 = 90
    Fluktuationsrate = 15 ÷ 90 × 100 = **16,7 %**

    Das ist weder 15 ÷ 100 (Endbestand) noch 15 ÷ 80 (Anfangsbestand): Der
    Durchschnitt ist die SHRM-Standardmethode und wird umso wichtiger, je schneller
    du wächst oder schrumpfst.

    ## Monatliche oder jährliche Fluktuation

    Die Monatsfluktuation mal 12 überschätzt die Jahresfluktuation, weil sie den
    kumulativen Effekt ignoriert: Dieselbe Person kann nicht zweimal gehen. Für
    einen genauen Jahreswert summierst du die tatsächlichen Abgänge über 12 Monate
    und teilst durch die durchschnittliche Belegschaft dieser 12 Monate, statt die
    Rate eines einzelnen Monats hochzurechnen.

    ## Freiwillige und unfreiwillige Fluktuation

    Die Gesamtrate vermischt freiwillige Abgänge (Kündigungen durch Angestellte)
    und unfreiwillige (Entlassungen, Kündigungen durch den Arbeitgeber). Verfolge
    sie getrennt: Ein Anstieg freiwilliger Abgänge deutet auf ein Bindungsproblem,
    ein Anstieg unfreiwilliger auf ein Problem bei Einstellung oder
    Leistungsmanagement. Vermischt siehst du nicht, welchen Hebel du ziehen musst.

    ## Häufige Fragen

    **Zählen Renteneintritte zur Fluktuation?**
    Die meisten HR-Teams zählen sie in der Rohquote als freiwillige Abgänge,
    weisen sie in der Analyse aber getrennt aus, weil sie selten vermeidbar sind
    und keine Unzufriedenheit signalisieren.

    **Was zählt als „Abgang“? Auch interne Wechsel?**
    Nein. Interne Wechsel und Beförderungen sind keine Fluktuation; nur wer die
    Organisation ganz verlässt, zählt als Abgang.

    Mit dem [Fluktuationsrechner](/tools/employee-turnover-calculator/) berechnest
    du deine Rate automatisch aus Abgängen und Belegschaft.
"employee-turnover-calculator/true-cost-of-employee-turnover":
  "title": "Die echten Kosten der Mitarbeiterfluktuation"
  "description": "Warum der Ersatz eines Angestellten 33–200 % seines Jahresgehalts kostet, was diese Kosten treibt und wie du die finanziellen Folgen deiner Fluktuationsrate abschätzt."
  "body": |
    Die meisten Führungskräfte unterschätzen Fluktuationskosten, weil sie nur auf
    die sichtbaren Posten schauen (Jobbörsen, Agenturprovisionen) und die viel
    größeren versteckten Kosten von Produktivitätsverlust und Anlaufzeit
    übersehen.

    ## Woraus die Kosten wirklich bestehen

    - **Vakanzkosten**: verlorene Leistung, solange die Stelle leer ist, plus die
      Mehrbelastung der Kollegen, die die Lücke füllen
    - **Recruitingkosten**: Stellenanzeigen, Agenturhonorare (bei externen
      Personalberatern meist 15–25 % des ersten Jahresgehalts) und interne
      Interviewzeit
    - **Einarbeitung und Schulung**: formale Trainings plus die Zeit, die
      Führungskräfte und Kollegen investieren, bis die neue Kraft produktiv ist
    - **Produktivitätsverlust in der Anlaufphase**: Neue Mitarbeitende arbeiten
      typischerweise 3–6 Monate unter voller Leistung, bei spezialisierten oder
      Senior-Rollen auch länger

    ## Die SHRM-Richtwerte

    Die SHRM (Society for Human Resource Management) beziffert die gesamten
    Ersatzkosten auf **33 % des Jahresgehalts bei Einstiegsrollen** bis hin zu
    **150–200 % bei Senior- oder hochspezialisierten Positionen**. Bei einer Stelle
    mit 70.000 $ sind das je nach Seniorität 23.000–140.000 $ pro Abgang.

    ## Warum diese Zahl die meisten Führungskräfte überrascht

    Die Lücke zwischen den „offensichtlichen“ Kosten (Recruitinghonorare, vielleicht
    5.000–10.000 $) und den echten (inklusive monatelanger geringerer Leistung und
    Unruhe im Team) beträgt meist das 5- bis 10-Fache. In einer normalen GuV sind
    Fluktuationskosten kaum sichtbar, weil sie sich über die Personalkosten
    verteilen statt als eigener Posten verbucht zu werden.

    ## Aus der Zahl ein Argument für Mitarbeiterbindung machen

    Bei 20 % Jahresfluktuation in einem 50-köpfigen Team mit durchschnittlich
    80.000 $ Gehalt sind das 10 Abgänge pro Jahr zu vorsichtig geschätzt 75 % des
    Gehalts = 600.000 $ pro Jahr. Eine Bindungsmaßnahme (besseres Onboarding,
    Führungskräftetraining, marktgerechte Gehaltsrunden), die die Fluktuation auf
    15 % senkt, spart 150.000 $ pro Jahr und finanziert damit die meisten
    Programme mühelos.

    ## Häufige Fragen

    **Enthält diese Schätzung Abfindungen?**
    Nicht direkt: Der Rechner konzentriert sich auf Ersatzkosten (Recruiting,
    Vakanz, Einarbeitung). Abfindungen und fortgeführte Leistungen bei
    unfreiwilligen Abgängen rechnest du separat hinzu.

    **Sind die Kosten bei Remote-Stellen anders?**
    Vakanz- und Anlaufkosten sind ähnlich. Recruiting kann günstiger sein (größerer
    Bewerberpool, kein Umzug), das Onboarding dauert ohne persönliche Begleitung
    aber oft länger.

    Mit dem [Fluktuationsrechner](/tools/employee-turnover-calculator/) schätzt du
    die gesamten Fluktuationskosten aus Gehalt, Belegschaft und Fluktuationsrate.
"employee-benefits-cost-calculator":
  "title": "Gesamtkosten eines Angestellten: Leistungen, Abgaben und versteckte Kosten"
  "description": "Die vollen Arbeitgeberkosten eines Angestellten über das Grundgehalt hinaus: Lohnabgaben, Zusatzleistungen, Ausstattung und Gemeinkosten."
  "body": |
    Das Grundgehalt ist nur ein Teil dessen, was ein Angestellter kostet. Für
    Budget- und Einstellungsentscheidungen brauchst du die Vollkosten.

    ## Bestandteile der Arbeitgeberkosten

    **Pflichtkosten** (gesetzlich vorgeschrieben):
    - Social Security: 6,2 % auf die ersten 168.600 $ Lohn
    - Medicare: 1,45 % (ohne Obergrenze)
    - FUTA: 0,6 % auf die ersten 7.000 $
    - Bundesstaatliche Arbeitslosenabgabe (SUTA): 0,5–10 % je nach Bundesstaat und Einstufung
    - Unfallversicherung: 0,1–10 % je nach Branche und Bundesstaat

    **Freiwillige Leistungen** (typischer US-Arbeitgeber):
    - Krankenversicherung: 5.000–15.000 $ pro Jahr und Angestelltem (Arbeitgeberanteil)
    - Zahn/Sehen: 500–1.500 $ pro Jahr
    - 401(k)-Zuschuss: 3–5 % des Gehalts
    - Lebensversicherung: 300–600 $ pro Jahr
    - HSA-Beitrag: 0–2.000 $ pro Jahr

    **Ausstattung und Gemeinkosten**:
    - Laptop und Zubehör: 1.500–3.500 $ (auf das Jahr umgelegt)
    - Softwarelizenzen (Slack, Zoom, Tools): 1.000–3.000 $ pro Jahr
    - Arbeitsplatz und Büro: 3.000–8.000 $ pro Jahr im Büro; ~0 $ remote

    ## Faustregel fürs Budget

    Gesamtkosten Arbeitgeber = Grundgehalt × 1,25–1,45

    Bei 100.000 $ Gehalt: plane 125.000–145.000 $ inklusive aller Kosten ein.

    ## Fluktuation kommt obendrauf

    Geht dieser Angestellte, kommen 50–75 % des Jahresgehalts als Ersatzkosten
    hinzu. Ein Angestellter mit 100.000 $, der geht, kostet weitere
    50.000–75.000 $ für den Ersatz.

    Modelliere mit dem [Fluktuationskosten-Rechner](/tools/employee-turnover-cost-calculator/),
    was jeder Abgang dein Unternehmen tatsächlich kostet.
"employee-turnover-cost-calculator/true-cost-of-employee-turnover":
  "title": "Die echten Kosten der Mitarbeiterfluktuation (und wie du sie senkst)"
  "description": "Forschungsbasierte Aufschlüsselung, was Fluktuation wirklich kostet: Austritt, Vakanz, Recruiting, Einarbeitung und Anlaufzeit bis zur vollen Produktivität."
  "body": |
    Einen Mitarbeiter zu verlieren kostet zwischen 50 % und 200 % seines
    Jahresgehalts. Die Spanne entsteht, weil die meisten Organisationen nur das
    Recruitinghonorar zählen und alles andere übersehen.

    ## Die fünf Kostenbestandteile

    **1. Austrittskosten** (~4 % des Gehalts)
    Austrittsgespräche, HR-Bearbeitung, Schlussabrechnung, höhere
    Arbeitslosenversicherung.

    **2. Vakanzkosten** (Tagessatz × Tage bis zur Besetzung)
    Die Arbeit bleibt liegen (verlorene Leistung) oder wird auf Kollegen verteilt
    (versteckte Produktivitätssteuer). Durchschnittliche Besetzungsdauer: 42 Tage
    über alle Rollen, 84 Tage bei Senior- oder Spezialrollen.

    **3. Recruitingkosten** (~15 % des Gehalts)
    Agenturhonorare liegen bei Fachrollen bei 15–25 %. Internes Recruiting kostet
    im Schnitt 80–100 Stunden pro Einstellung, inklusive Sourcing, Vorauswahl,
    Interviews und Angebot.

    **4. Einarbeitungskosten** (~12 % des Gehalts)
    Schulungen, Dokumentation, Zeit der Führungskraft, IT-Einrichtung,
    Compliance-Trainings.

    **5. Anlaufzeit bis zur Produktivität** (~25 % des Gehalts)
    Neue Mitarbeitende erreichen meist nach 3–6 Monaten 80 % Produktivität. Die
    Lücke zwischen 100 % und 80 % in dieser Zeit ist ein echter Kostenposten in
    deiner GuV.

    **Gesamt: ~56–60 % des Jahresgehalts bei einer Rolle mittlerer Ebene**
    Bei Senior-Rollen (ab Direktorenebene) multiplizierst du mit 1,5–2.

    Modelliere mit dem [Fluktuationskosten-Rechner](/tools/employee-turnover-cost-calculator/),
    was jeder Abgang dein Unternehmen tatsächlich kostet.
"voluntary-vs-involuntary-turnover-cost":
  "title": "Freiwillige und unfreiwillige Fluktuation: Kostenunterschiede"
  "description": "Warum freiwillige und unfreiwillige Fluktuation unterschiedliche Kostenprofile haben und warum die getrennte Erfassung verändert, was du angehen solltest."
  "body": |
    Die gesamten Fluktuationskosten sind als Überblickszahl nützlich, doch
    freiwillige und unfreiwillige Abgänge haben deutlich verschiedene
    Kostenprofile und, wichtiger noch, völlig unterschiedliche Ursachen.

    ## Warum sich das Kostenprofil unterscheidet

    **Freiwillige Fluktuation** (Kündigungen durch Angestellte) ist pro Abgang fast
    immer teurer. Sie ist schwerer vorherzusehen, also bleibt weniger Zeit für die
    Übergabe, der Wissenstransfer ist oft hektisch oder lückenhaft, und die Wirkung
    auf die Stimmung im Team ist meist größer: Freiwillige Abgänge, vor allem von
    Leistungsträgern, können weitere nach sich ziehen („Fluktuationsansteckung“).

    **Unfreiwillige Fluktuation** (Kündigungen, Entlassungen) ist planbarer: Die
    Organisation bestimmt meist den Zeitpunkt, kann Übergabe und Wissenstransfer
    vorbereiten, und die Stimmung leidet womöglich weniger, wenn der Abgang klar mit
    Leistung oder dem Wegfall der Stelle zusammenhing.

    ## Was jede Art signalisiert

    | Art | Häufige Ursachen | Was zu tun ist |
    |------|---------------------|-------------|
    | Freiwillig | Vergütungslücken, schlechte Führung, fehlende Entwicklung, kultureller Fit | Bindungsprogramme, Führungskräftetraining, Vergütungsvergleich |
    | Unfreiwillig | Fehlbesetzungen, Lücken im Leistungsmanagement, Umstrukturierung | Einstellungsprozess, Onboarding, klare Rollen |

    Eine hohe freiwillige Quote zeigt nach innen: Etwas im Arbeitsalltag treibt
    Menschen hinaus. Eine hohe unfreiwillige Quote zeigt auf den
    Einstellungsprozess: Es werden die falschen Leute für die Rolle eingestellt,
    oder die Erwartungen wurden anfangs nicht klar gesetzt.

    ## Bedauerliche und nicht bedauerliche freiwillige Abgänge

    Nicht jeder freiwillige Abgang kostet gleich viel. Einen Leistungsträger zu
    verlieren („bedauerlich“) bringt die vollen Ersatzkosten plus verlorenes Wissen
    und Schwung. Einen schwachen Performer zu verlieren, der ohnehin wohl gegangen
    wäre („nicht bedauerlich“), ähnelt im Kostenprofil eher einem geplanten
    unfreiwilligen Abgang. Erfasse diese Unterscheidung, wenn du genau wissen
    willst, wie sehr Fluktuation dem Geschäft wirklich schadet.

    ## Häufige Fragen

    **Zählen Massenentlassungen wie einzelne Kündigungen?**
    Erfasse sie getrennt: Massenentlassungen folgen der Unternehmensstrategie
    (Kostensenkung, Umstrukturierung), nicht der individuellen Leistung oder
    Einstellungsqualität, und gehören nicht in eine Ursachenanalyse zu
    Fehlbesetzungen.

    **Ändern Abfindungen den Kostenvergleich?**
    Ja: Unfreiwillige Abgänge verursachen oft Abfindungen, die bei freiwilligen
    fehlen. Das gleicht die höheren indirekten Kosten freiwilliger Abgänge
    (Ansteckung, hektische Übergabe) teilweise aus.

    Schätze mit dem [Fluktuationskosten-Rechner](/tools/employee-turnover-cost-calculator/)
    die Gesamtkosten und erfasse freiwillige und unfreiwillige Abgänge in deinen
    eigenen Daten getrennt, um Ursachen zu analysieren.
"employee-vs-contractor-cost-comparison":
  "title": "Kosten von Angestelltem und Auftragnehmer im Vergleich: die echte Rechnung"
  "description": "Ein finanzieller Vergleich zwischen Vollzeitanstellung und 1099-Auftragnehmer, mit Gewinnschwellenrechnung und Szenarien, in denen jeweils das eine günstiger ist."
  "body": |
    Die Entscheidung zwischen Angestelltem und Auftragnehmer ist mehr als ein
    Stundensatzvergleich. Angestellte kosten auf dem Papier mehr pro Stunde
    (Arbeitgebernebenkosten), Auftragnehmer rechnen aber mehr pro Stunde ab. Die
    Gewinnschwelle hängt von Rolle, Dauer und Kosten der Zusatzleistungen ab.

    ## Das Kostenmodell für Angestellte

    Vollzeitangestellter mit 120.000 $ Gehalt:
    - Gehalt: 120.000 $
    - Arbeitgeber-Lohnabgaben: ~9.500 $
    - Krankenversicherung: ~12.000 $ (Arbeitgeberanteil)
    - 401k-Zuschuss (4 %): 4.800 $
    - Weitere Leistungen: ~2.000 $
    - **Gesamt: ~148.300 $ pro Jahr = 71,30 $ pro Stunde** (bei 2.080 Arbeitsstunden)

    Die tatsächlich gearbeiteten Stunden sind aber weniger. Mit 15 Urlaubstagen +
    10 Feiertagen:
    - 2.080 Stunden − 200 Stunden Urlaub/Feiertage = 1.880 effektive Arbeitsstunden
    - **Effektive Kosten: ~78,90 $ pro produktiver Arbeitsstunde**

    ## Das Kostenmodell für Auftragnehmer

    1099-Auftragnehmer für 95 $ pro Stunde:
    - Keine Lohnabgaben (spart ~8 % gegenüber Angestellten)
    - Keine Zusatzleistungen
    - Kein bezahlter Urlaub
    - Keine Aktienbeteiligung
    - **95 $ × 2.000 Stunden = 190.000 $ pro Jahr** (Vollzeitäquivalent)

    ## Die Gewinnschwellenrechnung

    Schwellen-Stundensatz = Gesamtkosten Angestellter / gearbeitete Stunden

    Bei 148.300 $ Gesamtkosten und 2.000 abrechenbaren Stunden: Schwelle = 74,15 $ pro Stunde.

    Verlangt ein Auftragnehmer mehr als 74 $ pro Stunde, ist der Angestellte
    günstiger (langfristig, in Vollzeit). Verlangt er weniger, ist der
    Auftragnehmer günstiger.

    ## Wann Auftragnehmer die bessere Wahl sind

    1. **Kurze Dauer** (unter 12–18 Monaten): Die Anlaufkosten einer Anstellung
    (Recruiting, Einarbeitung, Abfindung) lohnen sich bei kurzen Einsätzen nicht.

    2. **Konkretes Projekt**: Ein Website-Redesign über 3 Monate braucht keine
    Festanstellung.

    3. **Spezialwissen**: Nischenkompetenz, die du für einen begrenzten Zeitraum
    brauchst.

    4. **Internationale Arbeit**: Auftragnehmer in günstigeren Ländern liefern hohe
    Qualität zu deutlich niedrigeren Vollkosten.

    ## Wann Angestellte die bessere Wahl sind

    1. **Dauerhafte Rolle**: Brauchst du jemanden kontinuierlich über 2+ Jahre, wird
    die Anstellung kosteneffizienter.

    2. **Arbeit am Kern-IP**: Angestellte übertragen geistiges Eigentum automatisch
    an den Arbeitgeber. Auftragnehmer brauchen ausdrückliche
    Übertragungsklauseln.

    3. **Kultur und Führung**: Angestellte sind besser integriert und leichter zu
    führen.

    Mit dem [Personalkosten-Rechner](/tools/payroll-cost-calculator/) berechnest du
    die genauen Arbeitgeberkosten für jedes Gehaltsszenario.
"payroll-cost-calculator/employer-payroll-taxes-explained":
  "title": "Arbeitgeber-Lohnabgaben erklärt: FICA, FUTA und SUTA"
  "description": "Ein verständlicher Leitfaden zu den Lohnabgaben, die US-Arbeitgeber zahlen (FICA, FUTA und SUTA), mit Sätzen, Bemessungsgrenzen und wie du gesetzliche Pflichten minimierst."
  "body": |
    Jeder US-Arbeitgeber zahlt zusätzlich zum Lohn drei Kategorien von
    Lohnabgaben. Sie sind Pflicht, unabhängig vom Lohnsteuerabzug und werden
    vollständig vom Arbeitgeber getragen (nicht vom Gehalt des Angestellten
    abgezogen).

    ## FICA (Federal Insurance Contributions Act)

    FICA finanziert Social Security und Medicare.

    | Abgabe | Arbeitgebersatz | Bemessungsgrenze |
    |---|---|---|
    | Social Security | 6,2 % | Erste 168.600 $ (2024) |
    | Medicare | 1,45 % | Gesamter Lohn |
    | **FICA gesamt** | **7,65 %** | |

    Bei 120.000 $ Gehalt: 7,65 % × 120.000 $ = **9.180 $ pro Jahr** Arbeitgeber-FICA.

    Hinweis: Auch der Angestellte zahlt 7,65 % FICA (spiegelbildlich zum
    Arbeitgeber). Bei 120.000 $ beträgt die gesamte FICA (beide Seiten) 18.360 $
    pro Jahr.

    ## FUTA (Federal Unemployment Tax Act)

    FUTA finanziert die Bundes-Arbeitslosenversicherung.
    - Gesetzlicher Satz: 6,0 % auf die ersten 7.000 $ Lohn je Angestelltem
    - Nach Anrechnung der bundesstaatlichen Abgabe: effektiv 0,6 %
    - Maximum pro Angestelltem: 7.000 $ × 0,6 % = **42 $ pro Jahr**

    Die meisten Arbeitgeber zahlen den effektiven Satz von 0,6 %. Die Anrechnung
    entfällt, wenn du mit der bundesstaatlichen Arbeitslosenabgabe im Rückstand
    bist.

    ## SUTA (State Unemployment Tax Act)

    SUTA ist die Arbeitslosenabgabe auf Ebene der Bundesstaaten. Die Sätze
    schwanken stark:

    | Bundesstaat | Satz für neue Arbeitgeber | Bemessungsgrenze |
    |---|---|---|
    | Kalifornien | 3,4 % | 7.000 $ |
    | New York | 3,6 % | 12.500 $ |
    | Texas | 2,7 % | 9.000 $ |
    | Florida | 2,7 % | 7.000 $ |
    | Washington | 1,0–5,7 % | 67.600 $ |

    Die Sätze ändern sich mit deiner „Einstufung“: Arbeitgeber mit weniger
    Leistungsanträgen erhalten nach 3+ Jahren Geschäftstätigkeit niedrigere
    Sätze.

    ## Beispiel für die gesamten Lohnabgaben

    Angestellter in Kalifornien mit 120.000 $ Gehalt, neuer Arbeitgeber:
    - FICA: 9.180 $
    - FUTA: 42 $
    - SUTA: 7.000 $ × 3,4 % = 238 $
    - **Gesamte Arbeitgeber-Lohnabgaben: 9.460 $** (7,9 % des Gehalts)

    Mit dem [Personalkosten-Rechner](/tools/payroll-cost-calculator/) berechnest du
    die gesamten Lohnabgaben und Arbeitgeberkosten für jedes Gehalt und jeden
    Bundesstaat.
"true-cost-of-an-employee":
  "title": "Die echten Kosten eines Angestellten: Was Arbeitgeber tatsächlich zahlen"
  "description": "Vollständige Aufschlüsselung, was eine Vollzeitkraft in den USA kostet (Gehalt, Lohnabgaben, Zusatzleistungen, Gemeinkosten), und die Faustregel 1,25–1,4x."
  "body": |
    Wenn ein Gründer sagt „Ich kann mir keine Einstellung leisten“, vergleicht er
    oft das Gehalt mit seinem Kontostand. Die echten Kosten eines Angestellten
    liegen aber 25–40 % über dem Gehalt. Dieser Ratgeber zeigt, woher die
    Zusatzkosten kommen.

    ## Bestandteile der gesamten Arbeitgeberkosten

    **1. Grundgehalt**: die Zahl im Angebotsschreiben

    **2. Lohnabgaben** (Pflicht):
    - FICA Social Security: 6,2 % des Lohns (bis zur Bemessungsgrenze)
    - FICA Medicare: 1,45 % des gesamten Lohns
    - FUTA: effektiv ~42 $ pro Angestelltem und Jahr nach Anrechnung
    - SUTA: 0,5 % bis über 5 % des Lohns bis zur bundesstaatlichen Grenze

    **3. Zusatzleistungen** (bei Vollzeit erwartet):
    - Krankenversicherung: 500–2.000 $ Arbeitgeberanteil pro Monat
    - 401(k)-Zuschuss: meist 3–5 % des Gehalts
    - Zahn + Sehen: 50–150 $ pro Monat
    - Bezahlter Urlaub: implizite Kosten nicht gearbeiteter Zeit (15–25 Tage pro Jahr)

    **4. Gemeinkosten** (nicht immer ausdrücklich gerechnet):
    - Ausstattung: 1.500–5.000 $ für Laptop und Zubehör
    - Softwarelizenzen: 50–500 $ pro Monat und Angestelltem
    - Büro: 500–3.000 $ pro Monat und Arbeitsplatz (falls zutreffend)
    - Recruiting: meist 15–25 % des ersten Jahresgehalts (einmalig)

    ## Die Regel 1,25–1,40× für die meisten US-Angestellten

    Die meisten Arbeitgeber rechnen fürs Budget mit einem Multiplikator von
    1,25–1,40×.

    | Gehalt | 1,25× | 1,35× |
    |---|---|---|
    | 80.000 $ | 100.000 $ | 108.000 $ |
    | 120.000 $ | 150.000 $ | 162.000 $ |
    | 160.000 $ | 200.000 $ | 216.000 $ |

    Die Spanne 1,35–1,40× ist bei Rollen mit umfassenden Leistungspaketen
    realistischer.

    ## Kosten von Auftragnehmer und Angestelltem

    1099-Auftragnehmer lösen weder Lohnabgaben noch Leistungspflichten aus.
    Dafür verlangen sie meist 40–60 % mehr pro Stunde.

    Faustregel: Brauchst du jemanden für weniger als 18 Monate, kann ein
    Auftragnehmer günstiger sein. Bei längerer Dauer gewinnt meist die
    Vollzeitanstellung.

    Mit dem [Personalkosten-Rechner](/tools/payroll-cost-calculator/) berechnest du
    die genauen Gesamtkosten für jedes Gehalts- und Leistungsszenario.

"irr-formula-excel":
  "title": "So berechnest du die IRR in Excel (Formel und Beispiele)"
  "description": "Schritt-für-Schritt-Anleitung zur Excel-Funktion IKV: Formel, nötige Eingaben, häufige Fehler und wann du stattdessen XINTZINSFUSS nutzt."
  "body": |
    Die Excel-Funktion `IKV` (in der englischen Version `IRR`) ist der schnellste
    Weg, den internen Zinsfuß für konventionelle Cashflows zu berechnen. So nutzt
    du sie richtig.

    ## Syntax von IKV in Excel

    ```
    =IKV(Werte; [Schätzwert])
    ```

    **Werte**: ein Bereich mit den Cashflows (mindestens ein negativer und ein
    positiver Wert). Jahr 0 (Anfangsinvestition) muss in der ersten Zelle stehen.

    **Schätzwert**: optionaler Startwert für die Iteration (Standard 0,1 = 10 %).
    Nur nötig, wenn IKV `#ZAHL!` liefert oder du ein ungewöhnliches Ergebnis
    erwartest.

    ## Beispiel

    In den Zellen A1:A5: -100000, 25000, 30000, 35000, 40000
    Formel: `=IKV(A1:A5)` → **10,48 %**

    Liegt deine Mindestrendite bei 12 %, solltest du diese Investition ablehnen
    (IRR < Mindestrendite).

    ## XINTZINSFUSS oder IKV

    Nutze `XINTZINSFUSS` (`XIRR` im Englischen), wenn Cashflows nicht in
    regelmäßigen jährlichen Abständen anfallen:
    ```
    =XINTZINSFUSS(Werte; Zeitpkte)
    ```

    XINTZINSFUSS ist bei realen Investitionen mit unregelmäßigen Cashflows genauer
    (z. B. vierteljährliche Ausschüttungen, unregelmäßige Kapitalabrufe).

    ## Häufige Fehler

    - **#ZAHL!**: Die IRR konnte nicht konvergieren. Probiere einen anderen
      `Schätzwert` oder prüfe auf mehrere Vorzeichenwechsel (dann besser MIRR).
    - **Jahr 0 vergessen**: Steht die Anfangsinvestition nicht als negativer Wert
      in der ersten Zelle, liefert IKV falsche Ergebnisse.

    Mit dem [IRR-Rechner](/tools/irr-calculator/) im Browser rechnest du sofort,
    ganz ohne Excel.
"irr-vs-npv-which-metric-to-use":
  "title": "IRR oder Kapitalwert: Welche Kennzahl solltest du nutzen?"
  "description": "IRR und Kapitalwert können sich uneinig sein, welches von zwei Projekten besser ist. Hier steht, warum, und welcher Kennzahl du dann trauen solltest."
  "body": |
    IRR und Kapitalwert beruhen auf denselben Cashflows und stimmen meist darin
    überein, ob sich ein einzelnes Projekt lohnt. Beim Vergleich zweier sich
    ausschließender Projekte können sie diese aber in umgekehrter Reihenfolge
    reihen, und dann kommt es darauf an, welcher du traust.

    ## Was jede Kennzahl tatsächlich misst

    Der **Kapitalwert** beantwortet: „Wie viel Wert in heutigen Dollar schafft
    dieses Projekt?“, ein absoluter Betrag.

    Die **IRR** beantwortet: „Welche annualisierte Rendite erzielt dieses
    Projekt?“, ein Prozentsatz, unabhängig von der Projektgröße.

    ## Warum sie sich widersprechen können

    Die IRR ist größenblind. Ein Projekt mit 10.000 $ Einsatz und 50 % IRR schafft
    viel weniger Gesamtwert als eines mit 1.000.000 $ und 20 % IRR, doch nach der
    IRR allein wäre das kleine Projekt „besser“. Der Kapitalwert erfasst dagegen
    den tatsächlich geschaffenen Dollarwert, und darauf kommt es einem Unternehmen
    letztlich an.

    ## Ein Rechenbeispiel

    | Projekt | Investition | IRR | Kapitalwert (10 % Diskontsatz) |
    |---------|-----------|-----|------------------------------|
    | A | 10.000 $ | 45 % | 4.200 $ |
    | B | 500.000 $ | 22 % | 85.000 $ |

    Projekt A „gewinnt“ bei der IRR. Projekt B schafft 20-mal mehr echten Wert.
    Kannst du nur eines wählen und hast das Kapital, ist B trotz niedrigerer IRR
    sehr wahrscheinlich die bessere Wahl. Genau das ist die Falle rein IRR-basierter
    Entscheidungen.

    ## Wann die IRR trotzdem die Hauptkennzahl ist

    - **Auswahl bei knappem Kapital**: Wählst du aus vielen kleinen Projekten und
      ist das Kapital (keine einzelne Ja/Nein-Entscheidung) die Engstelle, kann eine
      Reihung nach IRR zur Maximierung der Rendite pro Dollar richtig sein
    - **Kommunikation mit Nicht-Finanzleuten**: Ein Prozentsatz ist oft
      greifbarer als ein Kapitalwert in Dollar, gerade im Vergleich zu einer
      Mindestrendite

    ## Die Standardempfehlung

    Nutze den Kapitalwert als Hauptkriterium beim Vergleich sich ausschließender
    Projekte unterschiedlicher Größe: Er misst direkt den geschaffenen Wert. Nutze
    die IRR als zweiten Plausibilitätscheck und zur Kommunikation der erwarteten
    Jahresrendite, aber lass sie den Kapitalwert nicht überstimmen, wenn beide
    unterschiedlich reihen.

    ## Häufige Fragen

    **Was, wenn ein Projekt mehrere IRRs hat?**
    Das passiert, wenn Cashflows mehr als einmal das Vorzeichen wechseln (z. B.
    hohe Kosten mitten im Projekt). Der Kapitalwert bleibt dann eindeutig, ein
    weiterer Grund, im Konfliktfall oder bei instabiler IRR auf ihn zu setzen.

    **Löst die MIRR den Widerspruch zwischen IRR und Kapitalwert?**
    Die MIRR behebt die unrealistische Reinvestitionsannahme der IRR, nicht aber
    ihre Größenblindheit: Für die Reihung unterschiedlich großer Projekte bleibt
    der Kapitalwert maßgeblich.

    Nutze den [IRR-Rechner](/tools/irr-calculator/) zusammen mit deiner eigenen
    Kapitalwertrechnung, um beide Kennzahlen für dieselbe Cashflow-Reihe zu sehen,
    bevor du zwischen Projekten entscheidest.
"what-is-a-good-irr-for-a-startup":
  "title": "Was ist eine gute IRR für ein Startup-Investment?"
  "description": "IRR-Richtwerte für Startup-Investments, Venture Capital und Private Equity und wie du die IRR zusammen mit MOIC und Amortisationsdauer liest."
  "body": |
    IRR-Richtwerte (interner Zinsfuß) unterscheiden sich nach Phase, Branche und
    Anlageklasse. Hier siehst du, was Investoren in welchem Kontext als „gut“
    ansehen.

    ## IRR-Richtwerte nach Kontext

    | Kontext | Minimal akzeptable IRR | Ziel-IRR |
    |---------|----------------------|------------|
    | Angel / Pre-Seed | 30 % | 50–100 %+ |
    | Series A / VC | 25 % | 40–60 % |
    | Growth Equity | 20 % | 30–40 % |
    | Private-Equity-Buyout | 15 % | 20–30 % |
    | Projektentwicklung Immobilien | 12 % | 18–25 % |
    | Hürde am Kapitalmarkt | 8–12 % | — |

    ## IRR und MOIC

    Die IRR ist zeitabhängig: Das 3-Fache in 2 Jahren ≈ 73 % IRR, das 3-Fache in 6
    Jahren ≈ 20 % IRR. Der MOIC (Multiple on Invested Capital) ignoriert die Zeit,
    daher nutzen Investoren beides:
    - **IRR**, um Investments mit unterschiedlicher Haltedauer zu vergleichen
    - **MOIC**, um LPs die Größenordnung der Rendite zu vermitteln

    ## Wann die IRR in die Irre führt

    Die IRR unterstellt Reinvestition zum selben Satz. Bei Investments mit hohen
    frühen Cashflows (z. B. schnelle Dividenden) überschätzt sie die
    Gesamtrendite. Nutze die MIRR (modifizierte IRR), wenn der
    Reinvestitionssatz deutlich von der Projekt-IRR abweicht.

    Mit dem [IRR-Rechner](/tools/irr-calculator/) berechnest du IRR und
    Kapitalwert für jede Cashflow-Reihe.
"mirr-excel-formula":
  "title": "MIRR in Excel: Formel, Beispiele und häufige Fehler"
  "description": "So berechnest du die MIRR in Excel mit der eingebauten Funktion, mit Beispielen, Erklärung der Argumente und häufigen Fehlern, die du vermeiden solltest."
  "body": |
    Die Excel-Funktion `QIKV` (`MIRR` in der englischen Version) macht die
    Berechnung einfach. Ein paar Stolperfallen solltest du aber kennen, bevor du
    sie in einem Modell verwendest.

    ## Syntax von QIKV in Excel

    ```
    =QIKV(Werte; Investition; Reinvestition)
    ```

    **Werte**: ein Zellbereich mit den Cashflows (Jahr 0 bis Jahr N). Der erste
    Wert muss negativ sein (Anfangsinvestition).

    **Investition**: der Zinssatz, den du auf negative Cashflows zahlst
    (Finanzierungskosten). Nimm deinen WACC oder deine Fremdkapitalkosten.

    **Reinvestition**: der Zinssatz, den du auf reinvestierte positive Cashflows
    erzielst. Wähle einen vorsichtigen Satz: Rendite von Staatsanleihen,
    Sparzins oder Opportunitätskosten.

    ## Beispiel

    Cashflows: Jahr 0 = −100.000 $, Jahre 1–4 = je 30.000 $.
    Finanzierungssatz = 10 %, Reinvestitionssatz = 8 %.

    ```
    =QIKV(A1:A5; 10%; 8%)
    = 7,83 %
    ```

    Mit der normalen IRR: `=IKV(A1:A5)` = 7,71 %

    Die MIRR liegt hier etwas höher, weil der Reinvestitionssatz (8 %) über der
    IRR (7,71 %) liegt. Die MIRR bewegt sich in Richtung Reinvestitionssatz: Liegt
    dieser unter der IRR, fällt die MIRR niedriger aus als die IRR.

    ## Häufige Fehler

    1. **Jahr 0 vergessen**: Der Bereich muss die Anfangsauszahlung an erster
       Stelle enthalten. Beginnst du bei Jahr 1, ist das Ergebnis falsch.
    2. **Denselben Satz für beide Argumente**: Dann wird die MIRR zu einer bloßen
       IRR-Näherung und verliert ihren Zweck.
    3. **Perioden vermischen**: Die MIRR unterstellt jährliche Perioden, sofern du
       nichts anpasst. Bei monatlichen Cashflows teilst du die Jahressätze durch 12.

    Nutze den [MIRR-Rechner](/tools/mirr-calculator/) im Browser, ganz ohne Excel.
"mirr-vs-irr-which-to-use":
  "title": "MIRR oder IRR: Was nutzt du für die Investitionsrechnung?"
  "description": "Ein praktischer Vergleich von MIRR und IRR für Investitionsentscheidungen: wann was passt und warum die MIRR realistischere Ergebnisse liefert."
  "body": |
    Die IRR ist verbreiteter, die MIRR realistischer. Hier steht, wann und warum du
    welche nutzt.

    ## Das Reinvestitionsproblem der IRR

    Die IRR unterstellt stillschweigend, dass alle positiven Cashflows zur IRR
    selbst reinvestiert werden können. Hat ein Projekt 35 % IRR, wird angenommen,
    dass du die Erträge jedes Jahr zu 35 % reinvestieren kannst, was meist
    unmöglich ist.

    Die MIRR behebt das, indem sie den Finanzierungssatz (Kosten der
    Kapitalaufnahme) vom Reinvestitionssatz (deinen tatsächlichen
    Anlagemöglichkeiten) trennt.

    ## Wann die MIRR besser ist als die IRR

    1. **Mehrere Vorzeichenwechsel in den Cashflows**: Projekte mit
       Kapitalspritzen zwischendurch können mehrere mathematisch gültige IRRs
       liefern. Die MIRR liefert immer genau einen Wert.
    2. **Projekte unterschiedlicher Größe vergleichen**: Die MIRR eignet sich
       besser, um ein Projekt über 500.000 $ mit einem über 5 Mio. $ und anderem
       Cashflow-Muster zu vergleichen.
    3. **Anspruchsvolle Kreditgeber oder Aufsichtsräte verlangen sie**:
       PE-Firmen und erfahrene Investoren bevorzugen oft die MIRR für realistische
       Renditemodelle.

    ## Wann die IRR genügt

    Bei einfachen, konventionellen Cashflows (eine Anfangsauszahlung, danach
    Zuflüsse) liefern IRR und MIRR ähnliche Ergebnisse, und die IRR ist
    bekannter.

    Mit dem [MIRR-Rechner](/tools/mirr-calculator/) berechnest du die MIRR mit
    selbst gewählten Finanzierungs- und Reinvestitionssätzen.
"how-to-choose-discount-rate":
  "title": "So wählst du den richtigen Diskontsatz für die Kapitalwertberechnung"
  "description": "Der Diskontsatz ist die wichtigste Eingabe der Kapitalwertanalyse. So berechnest du WACC, Mindestrendite und Opportunitätskosten, und warum der falsche Satz zu schlechten Entscheidungen führt."
  "body": |
    Der Diskontsatz ist die kritischste Eingabe der Kapitalwertanalyse. Zu
    niedrig, und du nimmst schlechte Investitionen an. Zu hoch, und du lehnst gute
    ab.

    ## Das Prinzip: Opportunitätskosten des Kapitals

    Der Diskontsatz steht für das, was du anderswo bei vergleichbarem Risiko
    verdienen könntest. Bringt der Aktienmarkt bei ähnlichem Risiko 10 %, vernichtet
    jedes Projekt unter 10 % im Vergleich zu dieser Alternative Wert.

    **Grundprinzip**: Der Diskontsatz sollte das Risiko des Projekts
    widerspiegeln, nicht das des Investors oder der durchschnittlichen Projekte des
    Unternehmens.

    ## Methode 1: WACC (gewichtete Kapitalkosten)

    Für Unternehmen mit Fremd- und Eigenkapitalfinanzierung:

    **WACC = (E/V × Re) + (D/V × Rd × (1 − Steuersatz))**

    Dabei gilt:
    - E/V = Eigenkapitalanteil (Eigenkapital / Gesamtwert)
    - Re = Eigenkapitalkosten (z. B. 12–15 % für ein kleines Unternehmen)
    - D/V = Fremdkapitalanteil
    - Rd = Fremdkapitalkosten (Zinssatz der Kredite)
    - Steuersatz = Unternehmenssteuersatz (Zinsen sind abzugsfähig)

    **Beispiel**: 60 % Eigenkapital zu 14 % + 40 % Fremdkapital zu 8 %, Steuersatz 25 %:
    WACC = (0,60 × 14 %) + (0,40 × 8 % × 0,75) = 8,4 % + 2,4 % = **10,8 %**

    ## Methode 2: Mindestrendite (Hurdle Rate)

    Viele Unternehmen legen eine minimal akzeptable IRR für Projekte fest. Das ist
    eine Grundsatzentscheidung, keine Formel. Übliche Mindestrenditen:
    - Großkonzerne: 12–15 %
    - Mittelstand: 15–20 %
    - Startups und Hochrisikoprojekte: 20–30 %
    - Venture Capital: 30–40 %

    ## Methode 3: risikoadjustierter Satz

    Für Projekte mit anderem Risikoprofil als dein Kerngeschäft:
    - Geringes Risiko (Kosteneinsparungen, operative Verbesserungen): WACC − 2–3 Punkte
    - Durchschnittliches Risiko (Ausbau des Kerngeschäfts): WACC
    - Hohes Risiko (neue Märkte, unerprobte Technik): WACC + 5–10 Punkte
    - Spekulativ (Moonshot-Projekte): 25–40 %

    ## Häufige Fehler

    **Nur die Fremdkapitalkosten nehmen**: „Unser Kredit kostet 7 %, also nehmen
    wir 7 %.“ Falsch: Das ignoriert die Eigenkapitalkosten, die deutlich höher
    liegen.

    **Ein fester Satz für alle Projekte**: Eine stabile Industrieinvestition hat
    nicht dasselbe Risiko wie ein Software-Startup. Gleiches Unternehmen, anderes
    Risiko, anderer Satz.

    **Nominaler Satz für reale Cashflows**: Sind die Cashflows inflationsbereinigt
    (real), nimm einen realen Diskontsatz. Sind sie nominal, einen nominalen.

    Starte bei den meisten Entscheidungen mit dem WACC und erhöhe ihn für
    riskantere Projekte. Im Zweifel mach eine Sensitivitätsanalyse: Kapitalwert bei
    8 %, 12 %, 16 % und 20 %.

    Modelliere mit dem [Kapitalwert-Rechner](/tools/npv-calculator/) verschiedene
    Diskontsatz-Szenarien.
"npv-vs-irr":
  "title": "Kapitalwert oder IRR: Welche Kennzahl für Investitionsentscheidungen?"
  "description": "Kapitalwert und IRR bewerten beide Investitionsrenditen, beantworten aber unterschiedliche Fragen. Wann welche passt und warum der Kapitalwert für die Kapitalallokation meist vorgezogen wird."
  "body": |
    Kapitalwert und IRR bewerten beide die Rendite einer Investition, beantworten
    aber leicht unterschiedliche Fragen und können sich manchmal widersprechen.

    ## Kapitalwert: Wert in Dollar

    **Kapitalwert = −Investition + Σ [Cashflow / (1 + r)^t]**

    Der Kapitalwert beantwortet: „Wie viele Dollar Wert schafft diese Investition
    bei meiner geforderten Rendite?“ Das Ergebnis ist ein absoluter Betrag.

    Der Kapitalwert ist direkt anwendbar: Nimm alle Projekte mit positivem
    Kapitalwert an. Beim Vergleich zweier Projekte schafft das mit dem höheren
    Kapitalwert mehr Vermögen (bei gleicher Größe).

    ## IRR: die Rendite an der Gewinnschwelle

    Die IRR ist der Diskontsatz, bei dem der Kapitalwert null ist. Sie beantwortet:
    „Welche Rendite erzielt diese Investition tatsächlich?“ Sie wird in Prozent
    angegeben.

    Für das Beispielprojekt (100.000 $ Investition, 30.000–40.000 $ jährliche
    Cashflows über 5 Jahre) liegt die IRR bei ≈ 23,3 %. Das Projekt erzielt also
    23,3 % pro Jahr.

    Liegt deine Mindestrendite bei 10 %: IRR > 10 % → annehmen. Liegt sie bei 25 %:
    IRR < 25 % → ablehnen.

    ## Wann Kapitalwert und IRR übereinstimmen

    Bei einfachen Investitionen (eine Auszahlung, dann Einzahlungen) stimmen
    Kapitalwert und IRR bei der Annahme- oder Ablehnungsentscheidung immer überein:
    - Positiver Kapitalwert ↔ IRR > Diskontsatz
    - Negativer Kapitalwert ↔ IRR < Diskontsatz

    ## Wann sie sich widersprechen: sich ausschließende Projekte

    Bei der Wahl zwischen zwei konkurrierenden Projekten können Kapitalwert und
    IRR unterschiedlich reihen.

    **Beispiel:**
    - Projekt A: 100.000 $ Investition, IRR 25 %, Kapitalwert 20.000 $ bei 10 %
    - Projekt B: 500.000 $ Investition, IRR 20 %, Kapitalwert 80.000 $ bei 10 %

    Die IRR bevorzugt Projekt A (25 % > 20 %). Der Kapitalwert bevorzugt Projekt B
    (80.000 $ > 20.000 $).

    Was stimmt? **Der Kapitalwert.** Projekt B schafft 80.000 $ Vermögen, Projekt A
    nur 20.000 $. Die IRR führt in die Irre, weil sie die Größe ignoriert.

    ## Wann der Kapitalwert immer vorzuziehen ist

    1. **Unterschiedliche Größen**: Die IRR ignoriert die Projektgröße, der Kapitalwert misst absoluten Wert
    2. **Unkonventionelle Cashflows**: Mehrere Vorzeichenwechsel können mehrere IRRs
       erzeugen, der Kapitalwert hat nur einen Wert
    3. **Wechselnde Diskontsätze**: Ändern sich deine Kapitalkosten von Jahr zu
       Jahr, bildet nur der Kapitalwert das korrekt ab (ein Satz pro Periode)

    ## Wann die IRR nützlich ist

    Die IRR ist in der Kommunikation eingängig: „Dieses Projekt bringt 23,3 % pro
    Jahr“ lässt sich leichter erklären als „dieses Projekt hat 38.000 $ Kapitalwert
    bei 10 % Diskontsatz“.

    Zusammen mit der Kapitalwertanalyse hilft sie auch beim Vergleich von
    Renditen unterschiedlich großer Investitionen.

    **Best Practice**: Rechne beides. Entscheide nach dem Kapitalwert. Nutze die IRR
    für Kontext und Kommunikation.

    Nutze den [Kapitalwert-Rechner](/tools/npv-calculator/) für deine
    Investitionsanalyse.
"what-is-net-present-value":
  "title": "Was ist der Kapitalwert (NPV)? Formel, Beispiele und Entscheidungsregeln"
  "description": "Der Kapitalwert zinst künftige Cashflows auf ihren Barwert ab und zieht die Anfangsinvestition ab. Formel, Einsatzbereiche und wie du den richtigen Diskontsatz wählst."
  "body": |
    Der Kapitalwert (NPV, Net Present Value) beantwortet die grundlegendste Frage
    der Kapitalallokation: Schafft diese Investition Wert oder vernichtet sie ihn?

    **Kapitalwert = −Anfangsinvestition + Σ [Cashflow_t / (1 + r)^t]**

    Dabei ist r der Diskontsatz (Kapitalkosten) und t das Jahr.

    Ein positiver Kapitalwert heißt, die Investition bringt mehr als die
    geforderte Rendite. Ein negativer, dass sie weniger bringt. Die Regel: Nimm
    alle Projekte mit positivem Kapitalwert an.

    ## Warum Cashflows abgezinst werden

    Ein Dollar heute ist mehr wert als ein Dollar in der Zukunft. Kannst du 10 % pro
    Jahr verdienen, werden aus 1.000 $ heute 1.100 $ in einem Jahr. Umgekehrt sind
    1.100 $ in einem Jahr bei 10 % Diskontsatz heute 1.000 $ wert.

    Der Kapitalwert wendet diese Logik auf alle künftigen Cashflows einer
    Investition an:
    - Der Cashflow in Jahr 1 wird mit (1 + r)^1 abgezinst
    - Der in Jahr 2 mit (1 + r)^2
    - Und so weiter...

    Die Summe der abgezinsten Cashflows minus Anfangsinvestition ergibt den
    Kapitalwert.

    ## Ein Rechenbeispiel

    Investition: 100.000 $
    Cashflows: 30.000 $, 35.000 $, 40.000 $, 40.000 $, 40.000 $ über 5 Jahre
    Diskontsatz: 10 %

    | Jahr | Cashflow | Abzinsungsfaktor | Barwert |
    |---|---|---|---|
    | 1 | 30.000 $ | 1/1,10 = 0,909 | 27.273 $ |
    | 2 | 35.000 $ | 1/1,21 = 0,826 | 28.926 $ |
    | 3 | 40.000 $ | 1/1,331 = 0,751 | 30.053 $ |
    | 4 | 40.000 $ | 1/1,464 = 0,683 | 27.321 $ |
    | 5 | 40.000 $ | 1/1,611 = 0,621 | 24.837 $ |
    | **Barwert gesamt** | | | **138.410 $** |

    **Kapitalwert = 138.410 $ − 100.000 $ = 38.410 $**

    Positiver Kapitalwert → annehmen. Diese Investition schafft 38.410 $ Wert über
    der geforderten Rendite von 10 %.

    ## Entscheidungsregeln

    | Kapitalwert | Einordnung |
    |---|---|
    | Positiv | Die Investition schafft Wert: annehmen |
    | Null | Die Investition erzielt genau die geforderte Rendite |
    | Negativ | Die Investition vernichtet Wert: ablehnen |

    Bei konkurrierenden Projekten mit begrenztem Kapital reihst du nach dem
    Rentabilitätsindex (PI = Kapitalwert / Investition).

    ## Die Wirkung des Diskontsatzes

    Dieselbe Investition über 100.000 $ bei verschiedenen Diskontsätzen:
    - 5 % → Kapitalwert = 59.120 $
    - 10 % → Kapitalwert = 38.410 $
    - 15 % → Kapitalwert = 21.610 $
    - 20 % → Kapitalwert = 7.819 $
    - 25 % → Kapitalwert = −3.629 $ (Projekt abgelehnt)

    Die IRR (bei der der Kapitalwert null ist) liegt bei etwa 23,3 %.

    Berechne den Kapitalwert deiner Investition mit dem [Kapitalwert-Rechner](/tools/npv-calculator/).
"discounted-payback-period-explained":
  "title": "Dynamische Amortisationsdauer: Formel, Beispiel und wann du sie nutzt"
  "description": "Die dynamische Amortisationsdauer berücksichtigt den Zeitwert des Geldes. Formel, Rechenbeispiel und warum sie für langfristige Investitionsentscheidungen zählt."
  "body": |
    Die dynamische Amortisationsdauer berücksichtigt den Zeitwert des Geldes: Ein
    Dollar in 3 Jahren ist weniger wert als ein Dollar heute. Diese Variante ist
    deshalb vorsichtiger und bei langen Horizonten genauer.

    ## Die Formel

    Zinse den Cashflow jedes Jahres ab:
    **Barwert von Jahr N = jährlicher Cashflow / (1 + Diskontsatz)^N**

    Summiere dann die abgezinsten Cashflows, bis sie die Anfangsinvestition
    übersteigen.

    ## Rechenbeispiel

    Investition: 200.000 $. Jährlicher Cashflow: 80.000 $. Diskontsatz: 10 %.

    | Jahr | Cashflow | Abzinsungsfaktor | Barwert | Kumulierter Barwert |
    |---|---|---|---|---|
    | 1 | 80.000 $ | 0,909 | 72.727 $ | 72.727 $ |
    | 2 | 80.000 $ | 0,826 | 66.116 $ | 138.843 $ |
    | 3 | 80.000 $ | 0,751 | 60.105 $ | 198.948 $ |
    | 4 | 80.000 $ | 0,683 | 54.641 $ | 253.589 $ |

    Die Gewinnschwelle wird kurz nach Ende von Jahr 3 erreicht (~198.948 $, knapp
    unter 200.000 $): dynamische Amortisation ≈ **3,02 Jahre** statt 2,5 Jahre
    einfach.

    ## Wann du die dynamische Amortisation nutzt

    Nutze die dynamische Amortisationsdauer für:
    - jede Investition mit mehr als 2 Jahren Amortisation
    - hohe Kapitalinvestitionen, bei denen Inflation eine Rolle spielt
    - Entscheidungen mit spürbaren Kapitalkosten (> 5 %)

    Für schnelle Marketingentscheidungen reicht meist die einfache
    Amortisationsdauer.

    Berechne beide mit dem [Amortisationsrechner](/tools/payback-period-calculator/).
"payback-period-saas-investment":
  "title": "Amortisationsdauer bei SaaS-Investitionen: die CAC-Amortisation erklärt"
  "description": "Bei SaaS meint Amortisationsdauer meist die CAC-Amortisation: wie viele Monate es dauert, die Kundenakquisitionskosten zurückzuholen. Richtwerte und Berechnung."
  "body": |
    Bei SaaS meint „Amortisationsdauer“ fast immer die **CAC-Amortisation**: die
    Zahl der Monate, bis die Kosten der Kundengewinnung aus dem Rohertrag dieses
    Kunden zurückgeflossen sind.

    ## Formel der CAC-Amortisation

    **CAC-Amortisation (Monate) = CAC / (monatlicher ARPU × Bruttomarge in %)**

    Bei 2.400 $ CAC, 200 $ ARPU pro Monat und 75 % Bruttomarge:
    - Monatlicher Rohertrag pro Kunde = 200 $ × 75 % = 150 $
    - CAC-Amortisation = 2.400 $ / 150 $ = **16 Monate**

    ## Richtwerte

    | CAC-Amortisation | Einordnung |
    |---|---|
    | < 6 Monate | Außergewöhnlich: produktgetrieben, wenig Vertriebsaufwand |
    | 6–12 Monate | Hervorragend: effizienter Vertrieb |
    | 12–18 Monate | Gut: typisch für SaaS in der Series A |
    | 18–24 Monate | Grenzwertig: vor dem Skalieren verbessern |
    | > 24 Monate | Bedenklich: CAC fließt zu langsam zurück |

    ## Warum das bei SaaS zählt

    24 Monate CAC-Amortisation heißt, du finanzierst 2 Jahre Akquisekosten vor,
    bevor du an einem Kunden verdienst. Bei 5 % monatlichem Churn sind ~70 % der
    Kunden weg, bevor du die Gewinnschwelle erreichst.

    Die CAC-Amortisation unter 12 Monate zu drücken, verbessert die Unit Economics
    deutlich und senkt den Kapitalbedarf des SaaS-Wachstums.

    Berechne deine CAC-Amortisation mit dem [CAC-Rechner](/tools/cac-calculator/)
    und die allgemeine Amortisationsdauer mit dem [Amortisationsrechner](/tools/payback-period-calculator/).
"payback-period-vs-roi":
  "title": "Amortisationsdauer oder ROI: Welche Investitionskennzahl solltest du nutzen?"
  "description": "Die Amortisationsdauer misst, wann du die Gewinnschwelle erreichst, der ROI die Gesamtrendite. Wann du welche nutzt und wie sie sich bei Kapitalentscheidungen ergänzen."
  "body": |
    Amortisationsdauer und ROI bewerten beide Investitionen, beantworten aber
    unterschiedliche Fragen und haben unterschiedliche blinde Flecken.

    ## Amortisationsdauer: „Wann habe ich mein Geld zurück?“

    **Amortisationsdauer = Investition / jährlicher Netto-Cashflow**

    Die Amortisationsdauer konzentriert sich ganz auf die Gewinnschwelle. Sie ist
    einfach, eingängig und nützlich zur Einschätzung des Liquiditätsrisikos: Wie
    lange ist dein Kapital noch im Risiko?

    **Schwäche**: Sie ignoriert alle Cashflows nach der Gewinnschwelle. Eine
    Investition über 100.000 $, die sich in 1 Jahr amortisiert und danach nichts
    mehr bringt, hat dieselbe Amortisationsdauer wie eine, die noch 10 Jahre lang
    100.000 $ pro Jahr erzeugt.

    ## ROI: „Wie hoch ist die Gesamtrendite?“

    **ROI = (gesamte Nettoerträge − Investition) / Investition × 100**

    Der ROI erfasst den Gesamtwert der Investition über den ganzen Zeitraum, nicht
    nur den Zeitpunkt der Gewinnschwelle.

    **Schwäche**: Er berücksichtigt weder den Zeitwert des Geldes noch das
    Liquiditätsrisiko.

    ## Wann du welche nutzt

    - **Amortisationsdauer**: riskante Investitionen aussortieren; Liquidität planen
    - **ROI**: die Gesamteffizienz von Investitionen vergleichen
    - **Beide zusammen**: vollständige Entscheidungen zur Kapitalallokation

    Berechne bei jeder Investition über 10.000 $ beides mit:
    - dem [Amortisationsrechner](/tools/payback-period-calculator/)
    - dem [ROI-Rechner](/tools/roi-calculator/)
"how-to-calculate-roi":
  "title": "So berechnest du den ROI: Formel, Beispiele und häufige Fehler"
  "description": "Die ROI-Formel (Nettogewinn / Investition × 100), Rechenbeispiele und die häufigen Fehler, die ROI-Berechnungen irreführend machen."
  "body": |
    ROI = (Nettogewinn / Investition) × 100

    Das ist die Formel. Schwierig ist, „Nettogewinn“ und „Investition“ richtig zu
    bestimmen.

    ## ROI-Berechnung Schritt für Schritt

    **Schritt 1**: Nettogewinn berechnen
    Nettogewinn = gesamter Umsatz aus der Investition − gesamte damit verbundene Kosten

    Zu den Kosten zählen: direkte Betriebskosten, Arbeitszeit, anteilige
    Gemeinkosten und Opportunitätskosten des Kapitals.

    **Schritt 2**: durch die Investition teilen
    ROI = Nettogewinn / Investitionskosten × 100

    **Beispiel**: Du gibst 50.000 $ für eine Content-Marketing-Kampagne aus. In 12
    Monaten erzeugt sie 200.000 $ zugeordnete Pipeline, die zu 25 % abschließt:
    50.000 $ Umsatz. Die Content-Produktion kostete zusätzlich 10.000 $ laufende
    Arbeit.

    - Nettogewinn = 50.000 $ − 10.000 $ = 40.000 $
    - ROI = 40.000 $ / 50.000 $ × 100 = **80 %**

    ## Häufige Fehler bei der ROI-Berechnung

    **Fehler 1: indirekte Kosten vergessen**
    Arbeitszeit für die Betreuung einer Investition ist echter Aufwand. Ein Tool
    für 10.000 $, das 40 Stunden im Monat Betreuung braucht, kostet bei 60 $ pro
    Stunde zusätzlich 2.400 $ im Monat.

    **Fehler 2: Bruttoumsatz statt Nettogewinn verwenden**
    Ein ROI auf den Bruttoumsatz ignoriert die Herstellkosten. Bringt eine
    Kampagne 100.000 $ Umsatz bei 60.000 $ Produktkosten, liegt der
    Nettobeitrag bei 40.000 $, nicht bei 100.000 $.

    **Fehler 3: nicht annualisieren**
    50 % ROI klingt toll, über 5 Jahre sind das aber nur 8,4 % pro Jahr. Vergleiche
    ROI-Werte immer über denselben Zeithorizont.

    Berechne deinen mit dem [ROI-Rechner](/tools/roi-calculator/).
"marketing-roi-benchmarks":
  "title": "Marketing-ROI-Richtwerte nach Kanal (2024)"
  "description": "Branchenrichtwerte für den Marketing-ROI nach Kanal: E-Mail, SEO, bezahlte Suche, Social Media und Content-Marketing. Sieh, wo deine Kampagnen stehen."
  "body": |
    Der Marketing-ROI schwankt je nach Kanal enorm. Hier sind übliche Richtwerte
    aus Branchenstudien und Praxisdaten.

    ## E-Mail-Marketing

    Durchschnittlicher ROI: **36–42 $ pro ausgegebenem Dollar** (3.500–4.100 %)

    E-Mail führt ROI-Rankings regelmäßig an, weil die variablen Kosten pro Versand
    nahe null liegen, sobald die Liste steht. Kosten für gekaufte Listen drücken
    den ROI über die Lebensdauer bei den meisten Unternehmen auf 500–1.000 %.

    ## SEO (organische Suche)

    Durchschnittlicher ROI: **300–2.000 % über 3 Jahre**

    Der SEO-ROI ist hoch, aber verzögert. Monate 1–6 zeigen oft negativen ROI.
    Monate 12–36 bringen sich aufbauende Erträge, wenn Inhalte ranken. Rechne den
    annualisierten ROI über die vollen 3 Jahre, um fair mit bezahlten Kanälen zu
    vergleichen.

    ## Bezahlte Suche (Google Ads)

    Durchschnittlicher ROAS: **2:1–5:1 je nach Branche**
    Durchschnittlicher ROI nach Margen: **10–30 %** in umkämpften Branchen

    Bezahlte Suche wirkt sofort, ist aber umkämpft. Der ROI sinkt mit steigendem
    Budget (schwächere Keywords, Gebotskonkurrenz). Begrenze das bezahlte Budget
    auf den Bereich mit positivem ROI und investiere den Rest in Kanäle mit
    Zinseszinseffekt.

    ## Content-Marketing

    Durchschnittlicher ROI: **300–1.000 % über 12 Monate**

    Erfordert Investitionen in Qualität und Verbreitung. Die Besten erzielen sich
    aufbauende Erträge, wenn Inhalte Domain-Autorität sammeln.

    ## Social Media (bezahlt)

    Durchschnittlicher ROAS: **1,5:1–3:1**

    Für die meisten B2B-Unternehmen der niedrigste ROI der großen Kanäle. Besser
    für Markenbekanntheit (schwer messbarer ROI) als für Direktreaktion.

    Verfolge deine tatsächlichen Erträge mit dem [ROI-Rechner](/tools/roi-calculator/).
"roi-vs-roas":
  "title": "ROI oder ROAS: Was ist der Unterschied und wann nutzt du welche Kennzahl?"
  "description": "Der ROI misst die Nettorendite auf die Gesamtinvestition, der ROAS den Umsatz pro Werbedollar. Welche Kennzahl du für Marketingentscheidungen nutzt und wie du umrechnest."
  "body": |
    ROI und ROAS messen beide die Marketingeffizienz, aber sie messen
    Unterschiedliches und führen zu unterschiedlichen Entscheidungen.

    ## ROAS: Umsatz pro Werbeausgabe

    **ROAS = den Anzeigen zugeordneter Umsatz / Werbeausgaben**

    Ein ROAS von 4,0 heißt: 4 $ Umsatz pro 1 $ Werbeausgabe.

    Der ROAS ignoriert alle Kosten außer den Werbeausgaben. Eine Kampagne mit
    5,0 ROAS klingt großartig, doch bei 20 % Produktmarge bist du bei null.

    ## ROI: Nettorendite der Investition

    **ROI = (Umsatz − alle Kosten) / Investition × 100**

    Der ROI umfasst Herstellkosten, Fulfillment, Arbeitszeit und die Investition
    selbst.

    Eine Kampagne mit 5,0 ROAS, 20 % Produktmarge und 15 % Fulfillment-Kosten:
    - Nettomarge = 20 % − 15 % = 5 %
    - Umsatz: 500.000 $. Netto aus dem Produkt: 25.000 $.
    - Werbeausgaben: 100.000 $.
    - ROI = (25.000 $ − 100.000 $) / 100.000 $ = **−75 %**

    Dieselbe Kampagne, die mit 5,0 ROAS glänzend aussah, vernichtet tatsächlich
    Wert.

    ## Wann du welche nutzt

    - **ROAS**: einzelne Kampagnen optimieren, Creatives per A/B-Test prüfen
    - **ROI**: strategische Investitionsentscheidungen, Kanäle vergleichen, Budget verteilen

    Nutze den ROAS für die taktische Optimierung, den ROI für strategische
    Entscheidungen.

    Berechne deinen ROI mit dem [ROI-Rechner](/tools/roi-calculator/).
"how-to-use-rule-of-72":
  "title": "So nutzt du die 72er-Regel"
  "description": "Die 72er-Regel mit Beispielen erklärt: So schätzt du per Kopfrechnen die Verdopplungszeit von Geldanlagen, Schulden und Umsatzwachstum."
  "body": |
    Die 72er-Regel ist eine Kopfrechen-Abkürzung: Teile 72 durch einen Jahressatz,
    um abzuschätzen, in wie vielen Jahren sich eine Größe verdoppelt.

    ## Beispiele

    - **Anlage mit 8 % Jahresrendite**: 72 ÷ 8 = **9 Jahre** bis zur Verdopplung
    - **Kreditkarte mit 24 % effektivem Jahreszins**: 72 ÷ 24 = **3 Jahre**, bis sich die Schuld verdoppelt
    - **Inflation von 3 %**: 72 ÷ 3 = **24 Jahre**, bis sich die Preise verdoppeln
    - **SaaS mit 50 % Wachstum pro Jahr**: 72 ÷ 50 = **~1,4 Jahre** bis zur Verdopplung des ARR

    ## Warum funktioniert das?

    Bei einem Satz r beträgt die exakte Verdopplungszeit **ln(2) ÷ ln(1 + r)**.
    Bei kleinen Sätzen ergibt das etwa **0,693 / r**.
    Die Regel nutzt 72 statt 69,3, weil 72 durch mehr gängige Zinssätze teilbar
    ist (2, 3, 4, 6, 8, 9, 12 …).

    ## Genauigkeit

    Am genauesten ist die 72er-Regel bei Sätzen zwischen 6 und 10 % (unter 1 %
    Fehler). Über 20 % nutzt du den [72er-Regel-Rechner](/tools/rule-of-72-calculator/),
    der Näherung und exakte Verdopplungszeit zeigt.
"rule-of-72-vs-exact-compound-interest":
  "title": "72er-Regel oder exakte Zinseszinsformel"
  "description": "Die Näherung der 72er-Regel im Vergleich zur exakten Verdopplungszeit mit Zinseszins: wann du was nutzt und wie groß der Fehler der Abkürzung ist."
  "body": |
    ## Die zwei Formeln

    **72er-Regel**: Jahre ≈ 72 / Jahressatz

    **Exakte Formel**: Jahre = ln(2) / ln(1 + r), mit r als Dezimalzahl

    ## Fehlervergleich

    | Satz | 72er-Regel | Exakt | Fehler |
    |------|-----------|-------|-------|
    | 2 % | 36 Jahre | 35,0 Jahre | +2,9 % |
    | 4 % | 18 Jahre | 17,7 Jahre | +1,9 % |
    | 8 % | 9 Jahre | 9,0 Jahre | 0,0 % |
    | 12 % | 6 Jahre | 6,1 Jahre | −1,9 % |
    | 20 % | 3,6 Jahre | 3,8 Jahre | −5,3 % |
    | 50 % | 1,44 Jahre | 1,71 Jahre | −16 % |

    Für die meisten Finanzentscheidungen bei Sätzen unter 20 % ist die 72er-Regel
    genau genug. Über 20 % (stark wachsende Unternehmen, hochverzinste Schulden)
    nutzt du die exakte Formel.

    Der [72er-Regel-Rechner](/tools/rule-of-72-calculator/) zeigt beide Werte
    nebeneinander, damit du den Unterschied bei jedem Satz siehst.
"wacc-discount-rate-dcf":
  "title": "WACC als Diskontsatz im DCF: ein Praxisleitfaden"
  "description": "So nutzt du den WACC als Diskontsatz in einer DCF-Bewertung, einschließlich der Schätzung der Eigenkapitalkosten junger Unternehmen, und typische Fehler."
  "body": |
    Der WACC (gewichtete Kapitalkosten) ist der Standard-Diskontsatz in
    DCF-Bewertungen (Discounted Cash Flow). So nutzt du ihn richtig und so gehst du
    vor, wenn Lehrbuch-Eingaben fehlen.

    ## WACC im DCF: die Mechanik

    In einem DCF-Modell gilt:
    **Wert = Σ (Free Cashflow_t / (1 + WACC)^t) + Endwert / (1 + WACC)^n**

    Der WACC steht für die geforderte Rendite der gesamten Kapitalstruktur,
    Eigen- wie Fremdkapitalgeber. Abzinsen mit dem WACC ergibt den
    Unternehmenswert; ziehst du die Nettoverschuldung ab, erhältst du den
    Eigenkapitalwert.

    ## WACC für junge Unternehmen schätzen

    Private Unternehmen und Startups haben keine Marktdaten für die
    Eigenkapitalkosten. Mögliche Ansätze:

    **CAPM-Ansatz**: Eigenkapitalkosten = risikofreier Zins + β × (Marktprämie)
    - Risikofreier Zins: Rendite 10-jähriger US-Staatsanleihen (~4,5 % im Jahr 2024)
    - Marktrisikoprämie: 5–6 % (historisch nach Damodaran)
    - Beta: Betas vergleichbarer börsennotierter Unternehmen (0,8–1,5 für SaaS)

    **VC-Hürden-Ansatz**: die Ziel-IRR des Fonds (25–40 % in der Frühphase) als
    Eigenkapitalkosten ansetzen. Sie spiegelt die tatsächlich geforderte Rendite
    der Eigenkapitalgeber.

    **Keine Schulden (vor Umsatz)**: WACC = Eigenkapitalkosten. Keine Gewichtung von
    Fremdkapital nötig.

    ## Häufige WACC-Fehler

    1. **Buchwerte statt Marktwerte** für die Gewichtung von Eigen- und Fremdkapital
    2. **Steuern nicht berücksichtigt** beim Fremdkapitalkosten-Anteil
    3. **WACC bei hoch verschuldeten oder notleidenden Unternehmen**: Nutze den
       Adjusted Present Value (APV), wenn sich die Verschuldung über die Zeit stark
       ändert

    Mit dem [WACC-Rechner](/tools/wacc-calculator/) berechnest du deine
    gewichteten Kapitalkosten für die DCF-Analyse.
"wacc-for-startup-valuation":
  "title": "WACC für die Startup-Bewertung: Welcher Diskontsatz?"
  "description": "So schätzt du den WACC für Startups in der Frühphase, bei denen börsennotierte Vergleichswerte, Beta und Risikoprämien anders greifen als bei börsennotierten Unternehmen."
  "body": |
    Der WACC für Startups ist eher Kunst als Wissenschaft, weil die Eingaben
    (Marktkapitalisierung, Beta, Fremdkapitalkosten) fehlen oder unzuverlässig
    sind. So gehen Praktiker vor.

    ## Warum der klassische WACC bei Startups versagt

    1. **Keine Marktkapitalisierung**: Der Eigenkapitalwert ist privat und sehr unsicher
    2. **Kein Beta**: Es gibt keine historische Kursvolatilität
    3. **Kaum oder kein Fremdkapital**: Die Kapitalstruktur besteht fast nur aus Eigenkapital
    4. **Hohe Ausfallwahrscheinlichkeit**: DCF-Modelle bilden Alles-oder-nichts-Ergebnisse schlecht ab

    ## Wie VCs über Diskontsätze denken

    VCs nutzen den WACC selten ausdrücklich. Stattdessen setzen sie eine
    **Ziel-IRR** von 30–50 % und mehr an (entsprechend einem 10x-Fondsziel mit
    einkalkulierten Ausfällen). Das entspricht einem WACC von 30–50 %, weit über
    dem, was klassische WACC-Modelle nahelegen.

    ## Für DCF-Modelle

    Beim DCF für ein Startup gehen Praktiker meist so vor:
    - Sie starten mit einem **Peer-Group-WACC** vergleichbarer börsennotierter Unternehmen (bei SaaS meist 8–15 %)
    - Sie schlagen eine **Größenprämie** von 3–5 % für private, kleinere Unternehmen auf
    - Sie schlagen eine **unternehmensspezifische Risikoprämie** von 3–10 % für das Umsetzungsrisiko auf

    Effektiver Diskontsatz für Startups: **14–30 %** je nach Phase und Branche.

    Nutze den [WACC-Rechner](/tools/wacc-calculator/) für etablierte Unternehmen
    mit beobachtbaren Eigen- und Fremdkapitalwerten.

"dcf-valuation-startup":
  "title": "DCF-Bewertung für Startups: Welcher Diskontsatz?"
  "description": "So wendest du eine DCF-Analyse auf ein Startup in der Frühphase an: Diskontsatz wählen, Unsicherheit beim Endwert handhaben und warum DCF ohne Umsatz schwierig ist."
  "body": |
    Eine DCF-Analyse ist für Startups schwierig, aber nicht unmöglich. So wendest
    du sie überlegt an, wenn die Cashflows unsicher sind.

    ## Einen Diskontsatz für ein Startup wählen

    Der übliche, per CAPM abgeleitete WACC funktioniert bei Unternehmen ohne Umsatz
    schlecht, weil:
    - es kein börsennotiertes Beta als Referenz gibt
    - kaum oder keine Schulden bestehen
    - das Eigenkapitalrisiko extrem ist

    Praktische Ansätze:
    **VC-Hürden-Methode**: die erwartete VC-Rendite (25–40 % in der Frühphase) als
    Eigenkapitalkosten ansetzen. Sie spiegelt, was Investoren tatsächlich
    verlangen.

    **Diskontsätze nach Phase** (Venture-Capital-Methode):
    - Seed: 50–80 %
    - Series A: 35–50 %
    - Series B: 25–35 %
    - Series C+: 18–25 %
    - Growth Equity: 15–20 %

    ## Das Problem hoher Diskontsätze

    Bei 40 % Diskontsatz sind Cashflows in Jahr 5 nur 18 Cent pro Dollar wert
    (1/(1,4^5) = 0,186). In Jahr 10 sind es 3 Cent. Frühphasen-DCFs hängen daher
    fast vollständig vom Endwert ab, der extrem empfindlich auf
    Wachstumsannahmen reagiert.

    ## Ein ehrlicherer Ansatz für Startups

    Viele Praktiker nutzen stattdessen einen Reverse-DCF: Sie starten beim
    aktuellen Preis (oder der angestrebten Exit-Bewertung) und berechnen die darin
    implizierten Wachstums- und Margenannahmen. Dann fragen sie: Sind diese
    Annahmen realistisch?

    Nutze den [DCF-Rechner](/tools/dcf-calculator/) für die Vorwärtsrechnung und
    behalte dabei die Sensitivität des Endwerts im Blick.
"dcf-vs-comps-valuation":
  "title": "DCF oder Vergleichsunternehmen: Welche Bewertungsmethode?"
  "description": "Wann du DCF und wann die Analyse vergleichbarer Unternehmen für die Bewertung nutzt: Stärken, Schwächen und wann jede Methode verlässliche Ergebnisse liefert."
  "body": |
    Jede Bewertung nutzt mindestens zwei Methoden und gleicht sie ab. Hier steht,
    wann welche am verlässlichsten ist.

    ## DCF (innerer Wert)

    **Nutze sie, wenn**: du verlässliche Cashflow-Prognosen hast, das
    Geschäftsmodell stabil ist und du den fundamentalen Wert unabhängig von der
    Marktstimmung verstehen willst.

    **Stärken**: zwingt zu ausdrücklichen Annahmen über Wachstum und Margen; zeigt
    den Barwert der künftigen Wirtschaftlichkeit; nützlich für Übernahmen und
    LBO-Analysen.

    **Schwächen**: Schlechte Eingaben, schlechte Ergebnisse; kleine Änderungen bei
    Diskontsatz oder langfristigem Wachstum verursachen große Bewertungsschwankungen;
    schwer anwendbar bei Unternehmen ohne Umsatz oder Gewinn.

    ## Analyse vergleichbarer Unternehmen (Comps)

    **Nutze sie, wenn**: es gute börsennotierte Vergleichswerte mit ähnlichem
    Wachstumsprofil gibt, du einen vom Markt bestätigten Plausibilitätscheck willst
    oder eine Finanzierungsrunde vorbereitest.

    **Übliche Multiples**:
    - ARR-Multiple: Umsatz × 4–15 (SaaS, je nach Wachstum)
    - EBITDA-Multiple: 8–15× (profitable Unternehmen)
    - Rohertrags-Multiple: 5–10× (Dienstleistungen, Marktplätze)

    **Stärken**: spiegelt, was Käufer gerade tatsächlich zahlen; leicht zu
    kommunizieren.

    **Schwächen**: Multiples schrumpfen oder wachsen mit der Marktlage;
    „vergleichbare“ Unternehmen sind nicht immer wirklich vergleichbar.

    ## Best Practice: triangulieren

    Nutze den DCF als inneren Anker und die Comps als Realitätscheck am Markt.
    Sagt der DCF 50 Mio. $ und die Comps 25 Mio. $, sind entweder deine Annahmen
    aggressiv oder der Markt preist einen Abschlag auf die Fundamentaldaten ein.

    Mit dem [DCF-Rechner](/tools/dcf-calculator/) baust du deine Bewertung nach
    innerem Wert auf.
"ebitda-multiple-by-industry":
  "title": "EBITDA-Multiples nach Branche (Richtwerte 2024)"
  "description": "EBITDA-Multiples reichen von 4–6× in traditionellen Branchen bis 15–30× bei stark wachsendem SaaS. Dieser Ratgeber zeigt aktuelle Multiples nach Branche, Wachstum und Deal-Größe."
  "body": |
    EBITDA-Multiples spiegeln Wachstumserwartungen, die Qualität wiederkehrender
    Umsätze und die Risikobereitschaft des Marktes. Höheres Wachstum und besser
    planbare Cashflows rechtfertigen höhere Multiples.

    ## EV/EBITDA-Multiples nach Branche (2024)

    | Branche | Unteres Quartil | Median | Oberes Quartil |
    |--------|---------------|--------|----------------|
    | SaaS (ARR > 10 Mio. $, 30 %+ Wachstum) | 15× | 22× | 30×+ |
    | B2B-Software (reif) | 8× | 12× | 18× |
    | Health Tech | 10× | 15× | 22× |
    | Industrie | 4× | 6× | 9× |
    | Distribution / Logistik | 5× | 7× | 10× |
    | Unternehmensdienstleistungen | 5× | 8× | 12× |
    | Einzelhandel | 4× | 6× | 8× |
    | Bau | 3× | 5× | 7× |

    ## Faktoren, die Multiples erhöhen

    - **Umsatzwachstum**: Jede Verbesserung um 10 Prozentpunkte beim Wachstum zum Vorjahr bringt meist 1–2 Multiple-Punkte
    - **Wiederkehrender Umsatz**: Abo- oder Vertragsumsatz wird höher bewertet als Transaktionsumsatz
    - **Bruttomarge**: höhere Marge = höheres Multiple (SaaS mit 70 %+ Marge erzielt einen Aufschlag)
    - **Kundenkonzentration**: Geringe Konzentration (kein Kunde über 10 %) erhöht das Multiple
    - **Kundenbindung**: Eine NRR über 110 % kann das EBITDA-Multiple eines SaaS um 3–5 Punkte erhöhen

    ## Größenaufschlag

    Größere Transaktionen erzielen einen Aufschlag. Unternehmen mit unter 5 Mio. $
    EBITDA werden mit 3–5 Multiple-Punkten Abschlag gegenüber großen
    Vergleichsunternehmen verkauft, wegen des kleineren Käuferkreises, der
    Abhängigkeit von Schlüsselpersonen und des geringeren operativen Hebels.
"how-to-calculate-your-own-ebitda-multiple":
  "title": "So ermittelst du dein eigenes EBITDA-Multiple"
  "description": "Schritt für Schritt zu einem realistischen EV/EBITDA-Multiple für dein Unternehmen, anhand vergleichbarer Transaktionen und angepasst an Größe und Wachstum."
  "body": |
    Branchendurchschnitte für EBITDA-Multiples sind ein Ausgangspunkt, keine
    Antwort: Welches Multiple für dein Unternehmen tatsächlich gilt, hängt von
    Größe, Wachstum und davon ab, wie sehr du den Transaktionen ähnelst, aus denen
    der Durchschnitt stammt.

    ## Schritt 1: mit der Branchenspanne starten

    Nimm die übliche EV/EBITDA-Spanne deiner Branche (als grobe Orientierung: SaaS
    15–30×, B2B-Software 8–15×, Industrie 5–8×, Dienstleistungen 4–7×) als
    Ausgangsrahmen.

    ## Schritt 2: an die Größe anpassen

    Kleinere Unternehmen werden in derselben Branche systematisch mit niedrigeren
    Multiples bewertet als größere: Ein Unternehmen mit 1 Mio. $ EBITDA wird meist
    mit deutlichem Abschlag gegenüber einem mit 20 Mio. $ EBITDA verkauft, weil
    Käufer für Größe, eine starke Managementebene und geringeres
    Schlüsselpersonenrisiko einen Aufschlag zahlen.

    ## Schritt 3: an das Wachstum anpassen

    Ein Unternehmen mit über 30 % Wachstum pro Jahr erzielt meist ein Multiple
    deutlich über dem Branchenmedian; stagnierendes oder sinkendes EBITDA drückt
    das Multiple an das untere Ende der Spanne oder darunter. Das Wachstum ist
    meist der wichtigste Faktor dafür, wo ein Unternehmen in der Spanne landet.

    ## Schritt 4: an Konzentration und Abhängigkeit anpassen

    Starke Kundenkonzentration (wenige Kunden machen den Großteil des Umsatzes),
    Abhängigkeit von einer Schlüsselperson (ohne den Gründer läuft nichts) oder
    wenig wiederkehrender Umsatz senken das Multiple gegenüber Vergleichsfirmen,
    weil der Käufer diese Risiken übernimmt.

    ## Schritt 5: mit EV/Umsatz gegenprüfen

    Ist das EBITDA klein oder schwankend, ist ein EV/Umsatz-Multiple ein nützlicher
    Plausibilitätscheck: Berechne den Unternehmenswert auf beide Arten und prüfe,
    ob die Schätzungen ungefähr übereinstimmen. Eine große Abweichung heißt meist,
    dass eine Annahme (Margenentwicklung, Beständigkeit des Wachstums) überprüft
    werden muss.

    ## Häufige Fragen

    **Wo finde ich echte Multiples vergleichbarer Transaktionen?**
    M&A-Berichte von Beratern, auf deine Branche spezialisierte
    Unternehmensmakler und (für börsennotierte Vergleichswerte) Finanzdatenanbieter
    sind die üblichen Quellen. Ein Makler, der deine Nische kennt, ist oft der
    schnellste Weg zu einer realistischen Zahl.

    **Ist ein höheres Multiple für den Verkäufer immer besser?**
    Nur zusammen mit dem tatsächlichen EBITDA: Ein hohes Multiple auf ein kleines
    EBITDA kann eine niedrigere Gesamtbewertung ergeben als ein moderates Multiple
    auf ein viel größeres EBITDA.

    Mit dem [EBITDA-Multiple-Rechner](/tools/ebitda-multiple-calculator/) wandelst
    du dein EBITDA und das gewählte Multiple in einen geschätzten Unternehmens- und
    Eigenkapitalwert um.
"what-is-ev-ebitda":
  "title": "Was ist EV/EBITDA?"
  "description": "EV/EBITDA (Unternehmenswert zu EBITDA) ist das meistgenutzte Bewertungsmultiple bei M&A und Private Equity. Es misst, wie viel Käufer pro Dollar operativem Ergebnis zahlen, unabhängig von Finanzierungsstruktur und Bilanzierungsentscheidungen."
  "body": |
    **EV/EBITDA** teilt den Unternehmenswert durch das EBITDA (Ergebnis vor Zinsen, Steuern und Abschreibungen). Es ist das Standard-Bewertungsmultiple bei M&A-Transaktionen, weil es die Effekte von Kapitalstruktur, Steuerstrategie und nicht zahlungswirksamen Aufwendungen herausrechnet.

    $$\text{EV/EBITDA} = \frac{\text{Unternehmenswert}}{\text{EBITDA}}$$

    ## Warum EV/EBITDA statt KGV?

    Das KGV (Kurs-Gewinn-Verhältnis) wird von der Verschuldung (Zinsaufwand) und Steueroptimierung beeinflusst. Zwei identische Unternehmen mit unterschiedlicher Verschuldung zeigen sehr unterschiedliche KGVs. EV/EBITDA beseitigt diese Verzerrungen und eignet sich besser für den Vergleich über Kapitalstrukturen hinweg.

    ## Was ist der Unternehmenswert?

    $$\text{EV} = \text{Marktkapitalisierung} + \text{Gesamtschulden} - \text{Cash}$$

    Der EV ist das, was ein Käufer tatsächlich zahlt: Er kauft die Marktkapitalisierung (das Eigenkapital) und übernimmt die Schulden, erhält aber das vorhandene Cash.

    ## EV/EBITDA oder EV/Umsatz

    EV/EBITDA setzt ein positives EBITDA voraus. Bei jungen oder stark wachsenden SaaS-Unternehmen mit EBITDA nahe null nutzen Investoren stattdessen **EV/Umsatz** (ähnlich dem KUV). Wenn Unternehmen reifen und das EBITDA wächst, wechselt der Markt von Umsatz- zu EBITDA-Multiples.

    ## Grenzen

    - Das EBITDA schließt Capex aus: Kapitalintensive Unternehmen wirken bei EV/EBITDA günstiger, als sie sind
    - Add-backs (einmalige Bereinigungen) können das bereinigte EBITDA in Verkäuferpräsentationen aufblähen
    - Für Finanzdienstleister und Versicherungen kaum geeignet
"enterprise-value-vs-market-cap-difference":
  "title": "Unternehmenswert oder Marktkapitalisierung: Was ist der Unterschied?"
  "description": "Die Marktkapitalisierung erfasst nur den Eigenkapitalwert; der Unternehmenswert addiert Schulden und zieht Cash ab und zeigt so die echten Kosten, das ganze Unternehmen zu übernehmen."
  "body": |
    Marktkapitalisierung und Unternehmenswert beantworten beide „Was ist dieses
    Unternehmen wert?“, aber für zwei verschiedene Käufer: einen, der nur das
    Eigenkapital kauft, und einen, der das ganze Geschäft samt Schulden und Cash
    übernimmt.

    ## Die Formeln

    $$\text{Marktkapitalisierung} = \text{Aktienkurs} \times \text{Ausstehende Aktien}$$

    $$\text{Unternehmenswert} = \text{Marktkapitalisierung} + \text{Gesamtschulden} - \text{Zahlungsmittel}$$

    ## Warum Schulden addiert werden

    Übernimmst du ein Unternehmen, erbst du in der Regel neben den Vermögenswerten
    auch seine Schulden. Die echten Kosten der Übernahme umfassen also neben dem
    Aufkauf der Aktionäre auch die Tilgung (oder Übernahme) dieser Schulden. Die
    Marktkapitalisierung allein unterschätzt die echten Kosten eines verschuldeten
    Unternehmens.

    ## Warum Cash abgezogen wird

    Cash in der Bilanz senkt faktisch die Nettokosten der Übernahme, weil der Käufer
    das Cash des Zielunternehmens zur Finanzierung nutzen kann (oder es einfach als
    erhaltenen Vermögenswert verbucht). Deshalb kann ein Unternehmen mit viel Cash
    einen deutlich niedrigeren Unternehmenswert als Marktkapitalisierung haben.

    ## Ein Rechenbeispiel

    Ein Unternehmen hat 500 Mio. $ Marktkapitalisierung, 150 Mio. $ Schulden und 80 Mio. $ Cash:

    $$\text{EV} = 500 \text{ Mio. \$} + 150 \text{ Mio. \$} - 80 \text{ Mio. \$} = 570 \text{ Mio. \$}$$

    Die Marktkapitalisierung von 500 Mio. $ allein würde die tatsächlichen Kosten
    der Übernahme des ganzen Unternehmens um 70 Mio. $ unterschätzen.

    ## Wann EV und Marktkapitalisierung am stärksten auseinanderliegen

    Stark verschuldete Unternehmen (PE-finanziert, kapitalintensive Branchen)
    zeigen einen EV weit über der Marktkapitalisierung. Unternehmen mit viel Cash
    und wenig Schulden (viele reife Softwarefirmen) können einen EV unter der
    Marktkapitalisierung haben, teils deutlich, wenn sie im Verhältnis zu ihrer
    Größe große Cash-Reserven halten.

    ## Warum Bewertungsmultiples den EV nutzen

    EV/EBITDA- und EV/Umsatz-Multiples nutzen gerade den Unternehmenswert, weil er
    unabhängig von der Kapitalstruktur ist: Er macht ein hoch verschuldetes
    Unternehmen mit einem schuldenfreien vergleichbar, weil beide als ganzes
    operatives Geschäft bewertet werden, egal wie es finanziert ist.

    ## Häufige Fragen

    **Kann der Unternehmenswert negativ sein?**
    Selten, aber ja: wenn das Cash Marktkapitalisierung plus Schulden übersteigt,
    was vorkommt, wenn ein Unternehmen deutlich unter seinem Cash-Bestand notiert.
    Ein ungewöhnliches Signal, das du prüfen solltest, statt es hinzunehmen.

    **Welche Zahl nutze ich, um die Größe zweier Unternehmen zu vergleichen?**
    Der Unternehmenswert vergleicht die Größe des operativen Geschäfts genauer,
    weil er nicht durch unterschiedliche Finanzierung verzerrt wird.

    Mit dem [Unternehmenswert-Rechner](/tools/enterprise-value-calculator/)
    berechnest du den EV aus Marktkapitalisierung, Schulden und Cash und rechnest
    zwischen EV und Eigenkapitalwert um.
"ev-ebitda-multiple-benchmarks":
  "title": "EV/EBITDA-Multiple: Bedeutung und Branchenrichtwerte"
  "description": "Das EV/EBITDA-Multiple erklärt, mit Branchenrichtwerten, wie Private Equity es nutzt und wie du das Multiple deines Unternehmens deutest."
  "body": |
    ## EV/EBITDA erklärt

    $$\text{EV/EBITDA} = \frac{\text{Unternehmenswert}}{\text{EBITDA}}$$

    EV/EBITDA misst, wie teuer ein Unternehmen im Verhältnis zu seiner operativen Cash-Erzeugung ist. Es ist das meistgenutzte Übernahmemultiple, weil es unabhängig von der Kapitalstruktur ist und die Wirkung unterschiedlicher Abschreibungspolitik herausrechnet.

    ## Branchenrichtwerte

    | Branche | Übliches EV/EBITDA |
    |----------|-------------------|
    | Technologie / SaaS | 20–40× |
    | Gesundheitswesen | 12–18× |
    | Konsumgüter | 10–15× |
    | Industrie | 7–12× |
    | Öl & Gas | 5–8× |
    | Versorger | 8–12× |
    | Private-Equity-Buyouts | 6–10× |

    ## Warum EV/EBITDA statt KGV?

    - Unbeeinflusst von Unterschieden in der Kapitalstruktur (Verschuldung verzerrt es nicht)
    - Rechnet Unterschiede bei der Abschreibung heraus
    - Funktioniert für Unternehmen ohne Gewinn (EBITDA > Jahresüberschuss)
    - Standardsprache in M&A-Gesprächen

    ## Was treibt ein höheres Multiple?

    - Höhere Wachstumsrate
    - Wiederkehrender bzw. Abo-Umsatz
    - Hohe Wechselkosten / Burggraben
    - Starke Bruttomargen
    - Erfolgsbilanz des Managements

    Mit dem [Unternehmenswert-Rechner](/tools/enterprise-value-calculator/) berechnest du EV/EBITDA- und EV/Umsatz-Multiples.
"what-is-enterprise-value":
  "title": "Was ist der Unternehmenswert?"
  "description": "Der vollständige Leitfaden zum Unternehmenswert: Formel, Bestandteile, Unterschied zur Marktkapitalisierung und Einsatz bei M&A und Bewertung."
  "body": |
    ## Definition des Unternehmenswerts

    Der Unternehmenswert (Enterprise Value, EV) sind die theoretischen Gesamtkosten, ein Unternehmen zu übernehmen:

    $$\text{EV} = \text{Marktkapitalisierung} + \text{Gesamtschulden} - \text{Cash}$$

    Anders als die Marktkapitalisierung berücksichtigt der EV die Kapitalstruktur: Schulden, die ein Käufer übernimmt, und Cash, das er erhält.

    ## EV und Marktkapitalisierung

    | | Marktkapitalisierung | Unternehmenswert |
    |-|-----------|-----------------|
    | **Was er darstellt** | Nur Eigenkapitalwert | Gesamte Übernahmekosten |
    | **Enthält Schulden** | Nein | Ja |
    | **Enthält Cash** | Nein | Zieht es ab |
    | **Einsatz** | Vergleich von Aktienkursen | M&A, DCF-Bewertung |

    ## Bestandteile des Unternehmenswerts

    - **Marktkapitalisierung**: aktueller Aktienkurs × ausstehende Aktien
    - **Gesamtschulden**: alle verzinslichen Verbindlichkeiten (kurz- und langfristig)
    - **Cash**: Zahlungsmittel und Äquivalente werden abgezogen (der Käufer erhält sie)
    - **Minderheitsanteile** (fortgeschritten): einbezogen, wenn Tochtergesellschaften nur teilweise gehalten werden
    - **Vorzugsaktien** (fortgeschritten): wie Schulden addiert

    ## Warum der EV zählt

    Beim Vergleich zweier Unternehmen mit unterschiedlicher Kapitalstruktur liefert der EV den saubereren Vergleich. Ein hoch verschuldetes Unternehmen mit derselben Marktkapitalisierung wie ein schuldenfreier Wettbewerber ist in der Übernahme tatsächlich viel teurer.

    Berechne den Unternehmenswert mit dem [Unternehmenswert-Rechner](/tools/enterprise-value-calculator/).
"cap-table-basics-for-founders":
  "title": "Cap-Table-Grundlagen für Gründer: Struktur, Verwässerung und häufige Fehler"
  "description": "Deine Cap Table hält fest, wem was an deinem Unternehmen gehört. Aufbau, Verwässerung über mehrere Runden, der Optionspool und Fehler, die beim Exit Probleme machen."
  "body": |
    Die Cap Table (Kapitalisierungstabelle) ist das maßgebliche Verzeichnis
    darüber, wer in welcher Form an deinem Unternehmen beteiligt ist. Sie vom
    ersten Tag an richtig zu führen, verhindert teure Probleme bei
    Finanzierungsrunden, Übernahmen oder einem Börsengang.

    ## Was in einer Cap Table steht

    Eine einfache Cap Table hat drei Abschnitte:

    **Stammaktien**: Anteile von Gründern und Mitarbeitenden (meist mit Vesting
    über 4 Jahre und 1 Jahr Cliff). Gründer starten oft mit Stammaktien ohne
    Vesting, doch frühes Gründer-Vesting wird immer üblicher und von Investoren
    positiv gesehen.

    **Vorzugsaktien**: Investorenanteile aus bepreisten Runden (Seed, Series A,
    Series B …). Sie bringen Liquidationspräferenzen und weitere Rechte, die
    Stammaktionäre nicht haben.

    **Optionen / Warrants**: Mitarbeiteroptionen (aus dem ESOP),
    Berater-Warrants und andere derivative Wertpapiere. Optionen vesten meist über 4
    Jahre mit 1 Jahr Cliff und haben einen Ausübungspreis in Höhe des fairen
    Marktwerts (in den USA per 409A-Bewertung) bei Zuteilung.

    ## Voll verwässerte und ausgegebene Anteile

    **Ausgegebene Anteile**: Anteile, die heute tatsächlich jemand hält.

    **Voll verwässerte Anteile**: ausgegebene Anteile plus alle Optionen und
    Warrants, gevestet oder nicht, ausgeübt oder nicht.

    Investoren nennen ihre Beteiligung fast immer voll verwässert: „Ich halte 20 %
    voll verwässert“ heißt 20 % des Gesamtbestands, wenn alle Optionen ausgeübt
    wären. So berechnet man Verwässerung richtig.

    ## Der Optionspool (ESOP)

    Der Mitarbeiteroptionspool reserviert Anteile für künftige Zuteilungen.
    Übliche Größen: 10–20 % der voll verwässerten Anteile.

    Investoren verlangen meist, den Pool *vor* Abschluss ihres Investments zu
    vergrößern, was die Gründer verwässert, nicht die Investoren. Das ist der
    „Option Pool Shuffle“.

    Um ihn klein zu halten: Verhandle die Poolgröße sorgfältig. Reserviere nur,
    was du in den nächsten 18–24 Monaten tatsächlich zuteilen willst. Ein Investor,
    der für ein 5-köpfiges Unternehmen 20 % Pool verlangt, übertreibt: Halte mit
    einem Einstellungsplan dagegen.

    ## Häufige Fehler

    **Kein Vesting für Gründeranteile**: Verlässt ein Mitgründer das Unternehmen im
    ersten Jahr, sollte er nicht alle Anteile behalten. Führe vom ersten Tag an 4
    Jahre Vesting mit 1 Jahr Cliff ein.

    **Keine 83(b)-Election**: In den USA müssen Gründer mit ungevesteten Anteilen
    innerhalb von 30 Tagen nach Zuteilung eine 83(b)-Election einreichen, um ihre
    steuerliche Basis festzuschreiben. Wer die Frist verpasst, riskiert hohe
    Steuern auf fiktives Einkommen, während die Anteile vesten.

    **Unordentliche Cap-Table-Historie**: SAFEs und Wandeldarlehen, die vor einer
    bepreisten Runde nicht gewandelt wurden, schaffen Komplexität. Räum deine Cap
    Table vor der Series A auf.

    **Mündliche Absprachen**: Mündliche Beteiligungsversprechen ohne
    unterschriebene Vereinbarung sind nicht durchsetzbar und führen zu Streit. Halte
    alles schriftlich fest.

    Modelliere mit dem [Verwässerungsrechner](/tools/equity-dilution-calculator/),
    wie sich Finanzierungsrunden auf deine Cap Table auswirken.
"how-much-equity-to-give-investors":
  "title": "Wie viel Beteiligung du Investoren in jeder Phase geben solltest"
  "description": "Richtwerte für die Verwässerung von Gründern in Pre-Seed, Seed, Series A und Series B und wie du die Bewertung verhandelst, um weniger Anteile abzugeben, ohne den Deal zu gefährden."
  "body": |
    Wie viel Beteiligung du Investoren gibst, lässt sich nicht pauschal beantworten,
    aber es gibt klare Marktnormen. Wer sie kennt, verhandelt mit Wissen statt mit
    Raten.

    ## Marktnormen nach Phase

    **Pre-Seed / Friends & Family (100.000–500.000 $)**
    Übliche Verwässerung: 5–15 %
    Bewertungsspanne: 1–5 Mio. $ pre-money
    Investoren: Angels, Freunde, Familie, Micro-VCs

    **Seed (500.000 $–3 Mio. $)**
    Übliche Verwässerung: 15–25 %
    Bewertungsspanne: 3–10 Mio. $ pre-money
    Investoren: Seed-VCs, Angels, Accelerators

    **Series A (3–15 Mio. $)**
    Übliche Verwässerung: 20–30 %
    Bewertungsspanne: 10–30 Mio. $ pre-money
    Investoren: institutionelle VCs (z. B. Sequoia, Andreessen Horowitz, Benchmark)

    **Series B (10–40 Mio. $)**
    Übliche Verwässerung: 15–25 %
    Bewertungsspanne: 30–100 Mio. $ pre-money
    Investoren: Growth Equity, institutionelle VCs

    ## Was Investoren tatsächlich brauchen

    Investoren streben pro Runde meist 15–25 % Beteiligung an. Der Grund ist der
    Portfolioaufbau: Investiert ein VC-Fonds in 30 Unternehmen in der Hoffnung, dass
    3 das 10-Fache zurückbringen, braucht jede Beteiligung eine nennenswerte Größe,
    damit der Fonds Rendite erzielt.

    Ein 100-Mio.-$-Fonds, der 5 Mio. $ für 20 % investiert, hält beim Exit 20 Mio. $
    eines Unternehmens, das 100 Mio. $ wert ist: das 4-Fache des Investments. Bei nur
    10 % bringt dasselbe Unternehmen 10 Mio. $ (2-fach). Die Fondsrechnung zählt.

    ## So verhandelst du eine höhere Bewertung

    **Traktion**: Die stärkste Verhandlungsposition ist Wachstum. 15–20 %
    Wachstum pro Monat, ein starker NPS und zahlende Kunden geben dir Gewicht.

    **Konkurrierende Term Sheets**: Mehrere interessierte Investoren erzeugen
    Preiswettbewerb. Schon ein lockeres Interesse eines zweiten Investors verbessert
    deine Position.

    **Strategischer Wert**: Investoren mit spezieller Expertise (deine Branche, dein
    Go-to-Market) akzeptieren oft einen kleineren Anteil für das Privileg,
    einzusteigen.

    **Gestaffelte Meilensteine**: SAFEs und Wandeldarlehen verschieben die Bewertung
    auf die nächste bepreiste Runde. Hast du noch keinen Umsatz, vermeidet ein SAFE
    mit angemessenem Bewertungsdeckel, dass du vor den ersten Traktionsdaten eine
    feste Bewertung verhandeln musst.

    ## Modell der kumulierten Verwässerung

    Gründer, die 500.000 $ für 10 %, dann 2 Mio. $ für 20 % und dann 10 Mio. $ für 25 % aufnehmen:

    Nach Pre-Seed: 90 % × 100 % = **90 %**
    Nach Seed: 90 % × 80 % = **72 %**
    Nach Series A: 72 % × 75 % = **54 %**

    Mit einem in jeder Runde geschaffenen Optionspool von 10 % halten Gründer bei der
    Series A meist 35–45 %. Das ist normal und gesund.

    Modelliere deine Runde mit dem [Verwässerungsrechner](/tools/equity-dilution-calculator/).
"pre-money-vs-post-money-valuation":
  "title": "Pre-Money- oder Post-Money-Bewertung: der Unterschied und warum er zählt"
  "description": "Pre-Money- und Post-Money-Bewertung bestimmen, wie viel deines Unternehmens Investoren bekommen. Ein Deal mit 5 Mio. $ pre-money und einer mit 5 Mio. $ post-money führen zu sehr unterschiedlichen Anteilen."
  "body": |
    Der Unterschied zwischen Pre-Money- und Post-Money-Bewertung gehört zu den am
    häufigsten verwechselten Begriffen beim Fundraising, und ein Irrtum kann
    Gründer viele Anteile kosten.

    ## Die Definitionen

    **Pre-Money-Bewertung**: der vereinbarte Wert des Unternehmens *vor* dem
    Investment. Der Preis wird verhandelt: Investoren und Gründer einigen sich, was
    das Unternehmen in diesem Moment wert ist, bevor neues Kapital fließt.

    **Post-Money-Bewertung**: Pre-Money + Investment. Das ist der Wert des
    Unternehmens *nach* Abschluss der Runde, wenn das neue Kapital in der Bilanz
    steht.

    **Anteil des Investors = Investment / Post-Money-Bewertung**

    ## Warum das wichtig ist

    Stell dir vor, ein Investor sagt: „Ich investiere 1 Mio. $ bei einer Bewertung
    von 5 Mio. $.“

    **Wenn die 5 Mio. $ pre-money sind:**
    Post-Money = 5 Mio. $ + 1 Mio. $ = 6 Mio. $
    Anteil des Investors = 1 Mio. $ / 6 Mio. $ = **16,7 %**

    **Wenn die 5 Mio. $ post-money sind:**
    Pre-Money = 5 Mio. $ − 1 Mio. $ = 4 Mio. $
    Anteil des Investors = 1 Mio. $ / 5 Mio. $ = **20 %**

    Derselbe Satz, dieselben Zahlen, aber 3,3 Prozentpunkte Unterschied beim
    Investorenanteil. Bei einem späteren Exit wiegt diese Lücke schwer.

    ## Was in Term Sheets steht

    Professionelle Term Sheets geben immer an, ob eine Bewertung pre-money oder
    post-money ist. Standardformulierung: „Die Gesellschaft gibt Anteile zu einem
    Preis je Anteil von X $ aus, was einer Pre-Money-Bewertung von Y $ entspricht.“

    Warnsignale:
    - Eine Bewertung ohne Angabe pre/post
    - „Bewertung von 5 Mio. $“ ohne Kontext
    - Mündliche Absprachen, die vom schriftlichen Term Sheet abweichen

    Im Zweifel frag ausdrücklich: „Sind das 5 Mio. $ pre-money oder post-money?“
    Kein seriöser Investor nimmt dir die Frage übel.

    ## Die Komplikation Optionspool

    Viele Term Sheets verlangen, vor dem Closing einen Optionspool zu schaffen, was
    der Cap Table vor dem Investment Anteile hinzufügt und die Gründer weiter
    verwässert.

    Beispiel: 5 Mio. $ pre-money mit Ausweitung des Optionspools auf 15 %.

    Hast du 10 Mio. Anteile und verlangen die Investoren einen Pool von 15 % nach
    der Runde:
    Neue Optionen = (10 Mio. + neue Optionen + Investorenanteile) × 15 %

    Das wird iterativ gelöst. Der Kernpunkt: Die Ausweitung des Optionspools geht
    *immer* zulasten der Pre-Money-Seite; sie verwässert die bisherigen
    Gesellschafter, nicht die Investoren.

    Modelliere deine Runde mit dem [Verwässerungsrechner](/tools/equity-dilution-calculator/).
"peg-ratio-vs-pe-ratio":
  "title": "PEG oder KGV: Was eignet sich besser zur Bewertung?"
  "description": "Wie das PEG das KGV um das Wachstum bereinigt, wann du welche Kennzahl nutzt und was PEG-Werte über die Bewertung aussagen."
  "body": |
    ## Das Problem mit dem KGV allein

    Ein KGV von 30× wirkt für einen langsam wachsenden Versorger teuer, für ein Softwareunternehmen mit 40 % Gewinnwachstum pro Jahr aber günstig. Das KGV ignoriert das Wachstum.

    ## Das PEG-Ratio

    Peter Lynch machte das PEG als wachstumsbereinigte Bewertungskennzahl bekannt:

    $$\text{PEG} = \frac{\text{KGV}}{\text{Erwartetes Gewinnwachstum je Aktie (\%)}}$$

    Das PEG beseitigt diese Verzerrung, indem es das KGV an den Wachstumserwartungen normiert.

    ## PEG-Werte deuten

    | PEG | Signal |
    |----|--------|
    | < 1,0 | Gemessen am Wachstum womöglich unterbewertet |
    | = 1,0 | „Fair bepreist“: Man zahlt genau für das Wachstum |
    | 1–2 | Moderater Aufschlag für Wachstum |
    | > 2 | Teuer gemessen an den Wachstumserwartungen |

    **Lynchs Faustregel**: Eine Aktie ist attraktiv bepreist, wenn das PEG unter 1 liegt. Diese Heuristik funktioniert am besten bei wachstumsstarken Mid Caps und ist bei reifen, langsam wachsenden Unternehmen weniger verlässlich.

    ## Grenzen des PEG

    - Wachstumsschätzungen sind unsicher: Eine verfehlte Gewinnprognose verändert das PEG stark
    - Weniger aussagekräftig bei Value-Aktien und Dividendenzahlern
    - Berücksichtigt weder Schulden noch Margen noch Kapitalintensität
    - Am besten als Filterwerkzeug nutzen, nicht als alleiniges Kauf- oder Verkaufssignal

    ## Gewinnrendite: eine weitere KGV-Ableitung

    Die Gewinnrendite (1 ÷ KGV × 100) macht aus einer Bewertung eine Renditekennzahl. Vergleiche sie mit der Rendite 10-jähriger Staatsanleihen: Liegt sie nahe daran oder darunter, wirken Aktien risikobereinigt weniger attraktiv.

    Mit dem [KGV-Rechner](/tools/pe-ratio-calculator/) berechnest du historisches und erwartetes KGV, Gewinnrendite und PEG in einem Schritt.
"what-is-pe-ratio":
  "title": "Was ist das KGV und wie nutzt man es?"
  "description": "Der vollständige Leitfaden zum Kurs-Gewinn-Verhältnis: Formel, historisches und erwartetes KGV, historische Durchschnittswerte und wie Investoren es zur Aktienbewertung nutzen."
  "body": |
    ## Das Kurs-Gewinn-Verhältnis (KGV)

    Das KGV misst, wie viel Investoren pro Dollar Unternehmensgewinn zahlen:

    $$\text{KGV} = \frac{\text{Aktienkurs}}{\text{Gewinn je Aktie}}$$

    Ein KGV von 20 heißt, Investoren zahlen 20 $ für jeden Dollar Jahresgewinn.

    ## Historisches und erwartetes KGV

    Das **historische KGV** nutzt den tatsächlich ausgewiesenen Gewinn je Aktie der letzten 12 Monate. Rückwärtsgewandt, aber auf echten Zahlen basierend.

    Das **erwartete KGV** nutzt Analystenschätzungen für die nächsten 12 Monate. Relevanter für wachsende Unternehmen, weil es Erwartungen statt Vergangenheit einpreist.

    Liegt das erwartete KGV unter dem historischen, erwartet der Markt Gewinnwachstum. Liegt es darüber, sinkende Gewinne.

    ## Historische KGV-Richtwerte

    | Zeitraum / Lage | Durchschnittliches KGV |
    |-------------------|------------|
    | Langfristiger Durchschnitt des S&P 500 | 15–17× |
    | Seit 2010 (Niedrigzinsära) | 20–25× |
    | Rezessionstiefs | 10–12× |
    | Höhepunkt der Dotcom-Blase | 40–50×+ |

    ## Grenzen des KGV

    - **Zyklische Unternehmen**: Am Gewinnhoch führt das KGV in die Irre; nutze normalisierte Gewinne
    - **Negativer Gewinn je Aktie**: Für Verlustunternehmen ist das KGV nicht definiert
    - **Unterschiedliche Branchen**: Softwarefirmen notieren naturgemäß mit höherem KGV als Versorger
    - **Bilanzierungsentscheidungen**: Gewinne lassen sich beeinflussen; Cashflow-Multiples sind robuster

    Mit dem [KGV-Rechner](/tools/pe-ratio-calculator/) berechnest du historisches und erwartetes KGV.
"arr-multiple-vs-revenue-multiple":
  "title": "ARR-Multiple oder Umsatzmultiple: die wichtigsten Unterschiede bei der SaaS-Bewertung"
  "description": "ARR-Multiple und Umsatzmultiple bei SaaS-Unternehmen: warum Investoren den ARR nutzen, wie du umrechnest und wann du welches verwendest."
  "body": |
    Bei SaaS-Unternehmen achten Investoren fast immer auf **ARR-Multiples** statt
    auf Umsatzmultiples. Der Unterschied zählt aber nur, wenn ein nennenswerter
    Teil des Umsatzes nicht wiederkehrend ist.

    ## ARR-Multiple

    **ARR-Multiple** = Bewertung ÷ ARR (jährlich wiederkehrender Umsatz)

    Der ARR ist der annualisierte Wert aller laufenden Abo-Verträge. Er schließt aus:
    - einmalige Dienstleistungshonorare
    - nutzungsbasierte Umsätze, die noch nicht vertraglich gebunden sind
    - Umsätze aus unbefristeten Lizenzen

    ## Umsatzmultiple (KUV)

    **Umsatzmultiple** = Bewertung ÷ Gesamtumsatz (bilanziell oder der letzten 12 Monate)

    Bei einem reinen Abo-SaaS gilt ARR ≈ bilanzieller Umsatz, also ARR-Multiple ≈ KUV.

    Bei einem Unternehmen, dessen Umsatz zu 30 % aus Dienstleistungen besteht:
    - ARR = 7 Mio. $ (wiederkehrende Abos)
    - Gesamtumsatz = 10 Mio. $ (inklusive 3 Mio. $ Dienstleistungen)
    - ARR-Multiple = 70 Mio. $ ÷ 7 Mio. $ = 10x
    - Umsatzmultiple = 70 Mio. $ ÷ 10 Mio. $ = 7x

    ## Warum Investoren den ARR bevorzugen

    Dienstleistungsumsatz hat geringere Margen und ist weniger planbar. Investoren
    wollen ihn nicht so teuer bezahlen wie treuen Abo-Umsatz. Das ARR-Multiple
    isoliert den wiederkehrenden Motor.

    Bei nutzungsbasiertem SaaS (Modell AWS, Snowflake, Twilio) nutzen Investoren
    oft die **annualisierte Run Rate** (Umsatz des letzten Monats × 12) statt des
    vertraglichen ARR, weil der Vertragswert den tatsächlichen Umsatz unterschätzen
    kann.

    ## Faustregel

    Sind über 90 % deines Umsatzes wiederkehrend: ARR-Multiple ≈ Umsatzmultiple.

    Sind unter 70 % wiederkehrend: Nutze das ARR-Multiple im Gespräch mit
    Investoren und das Umsatzmultiple für den Vergleich mit börsennotierten
    Unternehmen.

    Berechne dein ARR-Multiple mit dem [KUV-Rechner](/tools/price-to-sales-calculator/).
"ev-revenue-multiple-vs-ps-ratio":
  "title": "EV/Umsatz-Multiple oder KUV: Wann sie sich unterscheiden und warum das zählt"
  "description": "EV/Umsatz und KUV erklärt: wann sie auseinanderlaufen, welche Kennzahl Investoren bevorzugen und wie du den Unternehmenswert deines Unternehmens berechnest."
  "body": |
    EV/Umsatz und KUV messen beide die Bewertung im Verhältnis zum Umsatz. Sie
    unterscheiden sich darin, wie sie den „Wert“ im Zähler definieren.

    ## KUV: Marktkapitalisierung ÷ Umsatz

    **KUV** = Marktkapitalisierung ÷ Jahresumsatz

    Marktkapitalisierung = Aktienkurs × ausstehende Aktien. Bei privaten
    Unternehmen ist es die Post-Money-Bewertung. Die einfachste und bei jungen
    Unternehmen am häufigsten genutzte Kennzahl.

    ## EV/Umsatz: Unternehmenswert ÷ Umsatz

    **EV** = Marktkapitalisierung + Gesamtschulden − Zahlungsmittel

    **EV/Umsatz** = Unternehmenswert ÷ Jahresumsatz

    Der EV gleicht Unterschiede in der Kapitalstruktur aus. Ein Unternehmen mit
    50 Mio. $ Cash in der Bilanz hat einen niedrigeren EV als Marktkapitalisierung:
    Das Cash ist „schon da“ und muss im Multiple nicht bewertet werden.

    ## Wann sie auseinanderlaufen

    Für ein typisches VC-finanziertes SaaS-Startup mit 2 Mio. $ Cash und ohne Schulden:
    - Marktkapitalisierung (post-money): 80 Mio. $
    - EV: 80 Mio. $ − 2 Mio. $ = 78 Mio. $
    - Unterschied: ~2,5 %, praktisch gleich

    Für ein börsennotiertes Unternehmen mit 1 Mrd. $ Cash und 500 Mio. $ Schulden:
    - Marktkapitalisierung: 8 Mrd. $
    - EV: 8 Mrd. $ + 500 Mio. $ − 1 Mrd. $ = 7,5 Mrd. $
    - Unterschied: 6,25 %, relevant

    ## Was nutzen Investoren?

    **Strategische Käufer** bevorzugen EV/Umsatz, weil sie das Unternehmen netto
    nach Cash und Schulden kaufen. Eine Übernahme für 100 Mio. $ bei 10 Mio. $ Cash
    kostet netto 90 Mio. $, und EV/Umsatz bildet das ab.

    **VC-Investoren** nutzen das ARR-Multiple (Post-Money ÷ ARR) oft
    gleichbedeutend mit dem KUV, weil die meisten Unternehmen in Series A/B kaum
    Schulden und wenig Cash im Verhältnis zur Bewertung haben.

    **Analysten am Kapitalmarkt** nutzen EV/Umsatz als Standard, um Unternehmen mit
    unterschiedlicher Kapitalstruktur zu vergleichen.

    Modelliere beide Kennzahlen mit dem [KUV-Rechner](/tools/price-to-sales-calculator/).
"saas-valuation-multiples-2024":
  "title": "SaaS-Bewertungsmultiples 2024: KUV-Richtwerte nach Wachstumsphase"
  "description": "Aktuelle KUV- und EV/Umsatz-Multiples für SaaS im Jahr 2024: börsennotierte Vergleichswerte, Mediane im privaten Markt und wie das Wachstum das Multiple treibt."
  "body": |
    Nach der Multiple-Kompression 2022–2023 haben sich die SaaS-Bewertungen 2024
    stabilisiert. Hier sind die aktuellen Richtwerte, mit denen Investoren
    wachsende Softwareunternehmen bepreisen.

    ## KUV börsennotierter SaaS-Unternehmen (2024)

    Mitte 2024 notierte das mittlere börsennotierte SaaS-Unternehmen bei etwa dem
    **4- bis 6-Fachen des erwarteten Umsatzes**. Das wachstumsstarke oberste
    Quartil (40 %+ ARR-Wachstum) erzielt 8–12x, gegenüber Spitzen von 15–25x im
    Jahr 2021.

    | Wachstumskategorie | Übliche KUV-Spanne (2024) |
    |---|---|
    | Hyperwachstum (50 %+ ARR) | 8–15x |
    | Hohes Wachstum (30–50 % ARR) | 5–10x |
    | Wachstum (20–30 % ARR) | 3–6x |
    | Moderat (10–20 % ARR) | 2–4x |
    | Reif (< 10 % ARR) | 1–2x |

    ## ARR-Multiples im privaten Markt

    Private Bewertungen folgen dem Kapitalmarkt mit 6–12 Monaten Verzögerung. Im
    Jahr 2024:
    - **Seed**: 8–15x ARR (oft vor Umsatz; basierend auf Team und Markt)
    - **Series A**: 8–15x ARR bei über 80 % Wachstum
    - **Series B**: 10–20x ARR bei über 50 % Wachstum und starker NRR
    - **Series C+**: nähert sich börsennotierten Vergleichswerten mit Illiquiditätsabschlag an

    ## Was höhere Multiples treibt

    Höhere Multiples sind gerechtfertigt durch:
    1. **Umsatzwachstum**: der mit Abstand wichtigste Treiber
    2. **Net Revenue Retention**: eine NRR über 120 % bringt 1,5–2x Aufschlag
    3. **Bruttomarge**: 80 %+ sind typisch für SaaS mit hohen Multiples
    4. **Rule of 40**: Wachstum + FCF-Marge über 40 stützt Premium-Multiples
    5. **Marktgröße**: ein nachweislich großer TAM
    6. **Burggraben**: Wechselkosten, Netzwerkeffekte, Datenvorteile

    Berechne dein aktuelles KUV und eine vergleichende Bewertung mit dem
    [KUV-Rechner](/tools/price-to-sales-calculator/).
"how-to-calculate-tam-sam-som":
  "title": "So berechnest du TAM, SAM und SOM für dein Pitch Deck"
  "description": "Schritt für Schritt zur Marktgröße im Investoren-Deck: Top-down- und Bottom-up-Methoden für TAM, SAM und SOM mit Rechenbeispielen."
  "body": |
    TAM, SAM und SOM fürs Pitch Deck zu berechnen, ist mehr als eine Bevölkerung
    mit durchschnittlichen Ausgaben zu multiplizieren. Investoren wollen sehen,
    dass du deinen konkreten Markt verstehst, nicht nur, dass du eine große Zahl
    findest.

    ## Schritt 1: den Markt genau definieren

    Definiere vor dem Rechnen, wer dein Kunde ist. Je enger deine Definition,
    desto glaubwürdiger werden SAM und SOM.

    **Zu breit**: „KMU-Softwaremarkt“
    **Zu eng**: „SaaS-Firmen mit 10–50 Mitarbeitenden in San Francisco, die Salesforce nutzen“
    **Richtig**: „B2B-SaaS-Firmen mit 10–200 Mitarbeitenden in Nordamerika mit eigenem Vertriebsteam“

    Deine Marktdefinition sollte deinem ICP (Ideal Customer Profile) entsprechen:
    den Kunden, die du tatsächlich ansprichst und an die du verkaufst.

    ## Schritt 2: TAM berechnen (top-down)

    Top-down nutzt vorhandene Marktforschung:

    1. Suche Analystenberichte (Gartner, Forrester, IDC), die den Gesamtmarkt deiner
       Kategorie schätzen
    2. Gibt es keinen, nutze eine Näherung: die Gesamtausgaben in der Kategorie, die
       du ersetzt
    3. Rechne auf deinen Preis um: Gibt der Markt 10 Mrd. $ für Altsoftware aus und
       kostet dein SaaS-Ersatz 30 % weniger, liegt der Disruptions-TAM bei 7 Mrd. $,
       der aktuelle TAM bei 10 Mrd. $

    **Beispiel**: Der Markt für Projektmanagement-Software wird auf 7,3 Mrd. $ pro
    Jahr geschätzt (Quelle: Grand View Research). TAM = **7,3 Mrd. $**.

    ## Schritt 3: TAM berechnen (bottom-up, glaubwürdiger)

    Bottom-up zählt Kunden und multipliziert mit dem ACV:

    1. Definiere deinen ICP: US-Unternehmen mit 20–500 Mitarbeitenden im Bereich professionelle Dienstleistungen
    2. Zähle: LinkedIn zeigt 85.000 Unternehmen mit diesem Profil
    3. Quote: Marktforschung zeigt, dass 40 % das konkrete Problem haben, das du löst = 34.000
    4. Durchschnittlicher ACV: 12.000 $ pro Jahr

    TAM = 34.000 × 12.000 $ = **408 Mio. $**

    So erhältst du einen glaubwürdigen, belegbaren TAM, den Investoren
    hinterfragen können.

    ## Schritt 4: SAM berechnen

    Der SAM filtert den TAM nach deiner aktuellen Reichweite:
    - Geografie: Du verkaufst heute nur an US-Unternehmen → Ausland herausfiltern
    - Sprache: Produkt nur auf Englisch → nicht englischsprachige Märkte herausfiltern
    - Tech-Stack: integrationsabhängiges Produkt → nach Kompatibilität filtern
    - Segment: Kanalgrenzen → nach Unternehmensgröße filtern, die du tatsächlich gewinnen kannst

    Sind 60 % deines TAM mit deinen aktuellen Einschränkungen erreichbar:
    SAM = 408 Mio. $ × 0,60 = **245 Mio. $**

    ## Schritt 5: SOM berechnen

    Der SOM ist eine Rechnung zur Vertriebskapazität, kein Marktprozentsatz:

    Einstellungsplan in Jahr 3: 8 AEs × 20 Abschlüsse pro Jahr × 12.000 $ ACV = **1,92 Mio. $ ARR**
    Das ist dein SOM: der Markt, den du in 3 Jahren realistisch bedienen kannst.

    Den SOM als Anteil am SAM auszudrücken, ist zweitrangig: 1,92 Mio. $ / 245 Mio. $
    = 0,78 %, klein, aber glaubwürdig für ein 3 Jahre altes Unternehmen.

    Modelliere deine Zahlen mit dem [TAM-SAM-SOM-Rechner](/tools/tam-sam-som-calculator/).
"top-down-vs-bottom-up-market-sizing":
  "title": "Top-down oder Bottom-up: Welcher Marktgrößen-Ansatz überzeugt Investoren?"
  "description": "Top-down nutzt Branchenberichte, Bottom-up zählt Kunden und multipliziert mit dem ACV. Investoren bevorzugen Bottom-up: So baust du ein glaubwürdiges Bottom-up-Modell."
  "body": |
    Bei der Präsentation der Marktgröße zählt die Berechnung so viel wie die Zahl.
    Investoren haben Tausende Top-down-Folien mit demselben Gartner-Bericht
    gesehen. Eine Bottom-up-Analyse zeigt, dass du deine echten Kunden verstehst.

    ## Top-down-Marktgröße

    **Methode**: Mit einem Branchenbericht starten und deinen Anteil herausschneiden.

    **Beispiel**:
    „Der weltweite Markt für HR-Software ist 16,5 Mrd. $ groß (Gartner, 2025).
    Wir konzentrieren uns auf KMU-Lohnabrechnung, 15 % des Marktes = 2,5 Mrd. $ TAM.“

    **Vorteile**: schnell; nutzt glaubwürdige Drittquellen.

    **Nachteile**: ungenau; eine große Zahl findet jeder; zeigt kein
    Kundenverständnis. Investoren wischen Top-down-Folien oft mit „Wir wissen, dass
    ihr einen Gartner-Bericht genommen habt“ beiseite.

    **Wann nutzen**: für Kontext und Glaubwürdigkeit durch anerkannte Quellen.
    Immer zusammen mit Bottom-up.

    ## Bottom-up-Marktgröße

    **Methode**: potenzielle Kunden zählen und mit dem durchschnittlichen Umsatz multiplizieren.

    **Beispiel für ein B2B-HR-Tool**:
    - Zielgruppe: US-Unternehmen mit 20–200 Mitarbeitenden im Bereich professionelle Dienstleistungen
    - Datenquellen: Bureau of Labor Statistics + LinkedIn-Suche
    - Anzahl: ~180.000 passende Unternehmen
    - Filter: ~40 % sind mit ihrer aktuellen HR-Lösung unzufrieden = 72.000 aktive Interessenten
    - Durchschnittlicher ACV: 8.000 $ pro Jahr

    Bottom-up-TAM = 72.000 × 8.000 $ = **576 Mio. $**

    **Vorteile**: konkret; belastbar; zeigt, dass du deinen Käufer verstehst.

    **Nachteile**: zeitaufwendig; braucht teils nicht öffentliche Daten;
    Schätzungen summieren sich.

    ## Ein Bottom-up-Modell aufbauen

    **Schritt 1: mit firmografischen Daten starten**
    Zähle mit LinkedIn Sales Navigator, Bombora, ZoomInfo oder Apollo die
    Unternehmen, die zu deinem ICP passen. Filtere nach Größe, Branche, Region und
    Tech-Stack.

    **Schritt 2: den Anteil mit deinem Problem schätzen**
    Umfragen, Kundeninterviews oder Näherungsdaten (z. B. Stellenanzeigen für die
    Rolle, die du unterstützt) helfen abzuschätzen, welcher Anteil deines ICP das
    Problem tatsächlich hat.

    **Schritt 3: Conversion und durchschnittlichen ACV schätzen**
    Nutze deine aktuelle Conversion-Rate und deinen ACV als Näherung, im Wissen,
    dass sie sich beim Wechsel in größere Segmente oder mit neuen Funktionen ändern
    können.

    **Schritt 4: mit Top-down abgleichen**
    Prüfe, ob die Bottom-up-Zahl plausibel in den Top-down-Ausschnitt passt:
    576 Mio. $ für US-Dienstleistungsunternehmen sind etwa ein Viertel des weltweiten
    KMU-Lohnabrechnungssegments (2,5 Mrd. $), glaubwürdig für ein Land und eine
    Branche. Übersteigt die Bottom-up-Zahl das Top-down-Segment oder ist sie nur ein
    winziger Bruchteil davon, geh der Ursache nach.

    ## Beides im Pitch zeigen

    | Aufbau der Folie | Inhalt |
    |---|---|
    | Linke Spalte | Top-down: „Der weltweite HR-Software-Markt ist 16,5 Mrd. $ groß; wir bewegen uns im Segment KMU-Lohnabrechnung (2,5 Mrd. $)“ |
    | Rechte Spalte | Bottom-up: „180.000 US-Unternehmen passen zu unserem ICP. 40 % haben das Problem = 72.000 Unternehmen × 8.000 $ ACV = 576 Mio. $“ |
    | Fußzeile | „In den ersten 24 Monaten konzentrieren wir uns auf die 576-Mio.-$-Chance bei US-KMU; internationale Expansion bis Jahr 3.“ |

    Dieser Aufbau zeigt Sorgfalt und Triangulation: Investoren sehen zwei
    Methoden, die übereinstimmen.

    Modelliere deinen TAM mit dem [TAM-SAM-SOM-Rechner](/tools/tam-sam-som-calculator/).
"what-tam-do-investors-want-to-see":
  "title": "Welchen TAM wollen Investoren sehen? Erwartungen von VCs nach Phase"
  "description": "Die Fondsrechnung von VCs verlangt große Märkte. Die Mindesterwartungen an den TAM je Finanzierungsphase, warum manche Investoren Märkte mit 500 Mio. $ ablehnen und wie du kleine Märkte darstellst."
  "body": |
    Welchen Mindest-TAM Investoren sehen wollen, hängt von Fondsgröße, Phase und
    Renditezielen ab. Wer die Rechnung hinter ihren Erwartungen versteht, stellt
    seinen Markt richtig dar.

    ## Die Fondsrechnung hinter den TAM-Anforderungen

    VCs zielen auf das 3-Fache des Fondsvolumens. Ein 100-Mio.-$-Fonds muss 300 Mio. $ zurückbringen.
    Angenommen: 30 Investments, 3 Gewinner, 27 Ausfälle (typisches Potenzgesetz).
    Die 3 Gewinner müssen zusammen 300 Mio. $ bringen: je ~100 Mio. $.

    Damit ein Gewinner 100 Mio. $ bringt, muss der Fonds beim Exit 20 % halten, und der Exit muss über 500 Mio. $ liegen.

    Bei einem 10-fachen Umsatzmultiple (typisch für SaaS) entspricht ein Exit von 500 Mio. $ einem ARR von 50 Mio. $.
    Damit 50 Mio. $ ARR plausibel sind, braucht das Unternehmen ~5–10 % Marktanteil.
    Also: Mindest-TAM, damit die Rechnung aufgeht = **500 Mio. $ bis 1 Mrd. $**.

    Kleinere Fonds (30 Mio. $) können Unternehmen mit 200 Mio. $ TAM finanzieren. Größere Fonds (500 Mio. $) brauchen TAMs über 5 Mrd. $.

    ## TAM-Erwartungen nach Phase

    **Angel / Pre-Seed (100.000–500.000 $)**
    TAM: ab 200 Mio. $ akzeptabel
    Angels gehen mehr Risiko ein; die Tickets sind klein, die Renditeerwartungen
    unterschiedlich. Ihnen sind Team und erste Traktion wichtiger als die
    TAM-Rechnung.

    **Seed (500.000 $–3 Mio. $)**
    TAM: mindestens 500 Mio. $, besser 1 Mrd. $+
    Seed-Fonds haben noch geringere Renditeanforderungen als Series-A-Fonds.
    Problemdefinition und erste Kennzahlen wiegen schwerer als die Marktgröße.

    **Series A (3–15 Mio. $)**
    TAM: mindestens 1 Mrd. $, besser 3 Mrd. $+
    In der Series A beweist du Wiederholbarkeit und Skalierung. VCs wollen einen
    klaren Weg zu über 10 Mio. $ ARR in einem Markt mit Luft bis 100 Mio. $ sehen.

    **Series B+ (15–100 Mio. $+)**
    TAM: über 5 Mrd. $ erforderlich
    Die Series B setzt auf Marktführerschaft. Du brauchst einen Markt, der groß
    genug für ein börsennotiertes Unternehmen ist (über 100 Mio. $ ARR).

    ## Was tun mit einem „kleinen“ TAM?

    Liegt dein TAM bei 200–500 Mio. $, hast du drei Optionen:

    **1. Den Markt neu fassen**: Schaust du zu eng darauf?
    Aus einem TAM von 2 Mrd. $ für „Buchhaltungssoftware für US-Kleinunternehmen“
    wird ein TAM von 20 Mrd. $ für eine „globale Finanzplattform für
    Kleinunternehmen“, sofern die Expansion glaubwürdig ist.

    **2. Wege ohne VC wählen**: Bootstrapping, umsatzbasierte Finanzierung oder
    PE- und Family-Office-Investoren haben andere Renditeanforderungen. Viele
    hervorragende Unternehmen mit 20–50 Mio. $ Umsatz sind in „kleinen“ Märkten
    entstanden.

    **3. Angrenzende Märkte zeigen**: Belege, dass du den Kern-TAM als Sprungbrett
    in benachbarte Märkte nutzt. AWS begann mit Cloud-Speicher, HubSpot mit
    E-Mail-Marketing.

    Bemiss deinen Markt mit dem [TAM-SAM-SOM-Rechner](/tools/tam-sam-som-calculator/).
