"Cash Flow":
  "body": |
    Profitable Unternehmen scheitern, weil ihnen das Geld ausgeht. Gewinn ist ein
    Buchhaltungsergebnis, Cash ein Kontostand, und in der Lücke dazwischen
    entstehen die meisten vermeidbaren Insolvenzen. Diese Rechner messen diese
    Lücke.

    ## Welcher Rechner passt

    **Operativer Cashflow** und **Free Cashflow** zeigen, was das Unternehmen
    tatsächlich erwirtschaftet, nachdem Working Capital und Investitionsausgaben
    berücksichtigt sind; der FCF ist die Zahl, die Wachstum finanziert oder
    Schulden tilgt. **Cash Conversion Cycle** und **DSO** messen, wie lange Cash
    zwischen der Bezahlung von Lieferanten und dem Zahlungseingang von Kunden
    gebunden ist; wer diesen Zyklus verkürzt, setzt Cash frei, ohne eine Runde
    aufzunehmen. **Working Capital** bemisst den Puffer, den das Unternehmen für
    den laufenden Betrieb braucht, **Skonto** beziffert, was ein Nachlass für
    frühe Zahlung kostet, und **Budgetabweichung** vergleicht Plan und Ist, damit
    eine Lücke im zweiten Monat auffällt und nicht erst im sechsten.

    ## Was die Zahlen bedeuten

    Ein steigender DSO ist in kleinen Unternehmen eines der frühesten
    verlässlichen Warnsignale: Meist ist entweder das Inkasso nachlässiger
    geworden oder die Kunden stehen selbst unter Druck, und beides verschlimmert
    sich unbemerkt. Ein negativer Cash Conversion Cycle (Kunden zahlen, bevor die
    Lieferanten bezahlt werden) ist ein echter struktureller Vorteil und ein
    großer Grund, warum Abo-Modelle und Marktplätze ihr Wachstum aus dem
    operativen Geschäft finanzieren können, was ein klassischer Händler nicht
    kann.

"Payments":
  "body": |
    Zahlungsgebühren sind meist der größte Posten, den ein kleines Unternehmen
    nie verhandelt. Bei 2,9 % + 0,30 $ gibt ein Unternehmen mit 30.000 $
    Kartenumsatz pro Monat rund 10.500 $ im Jahr ab, mehr als die meisten Gründer
    für Software ausgeben. Diese Rechner gibt es, damit diese Zahl auf der
    Monatsabrechnung keine Überraschung mehr ist.

    ## Welcher Rechner passt

    Starte mit dem **Gebührenvergleich**, wenn du einen Zahlungsanbieter
    auswählst oder einen Wechsel erwägst: Er stellt Stripe, PayPal und alle drei
    Shopify-Payments-Pläne für einen Verkaufsbetrag nebeneinander und zeigt die
    genaue Nettoauszahlung. Nutze die einzelnen Rechner für **Stripe**,
    **PayPal** und **Shopify**, wenn dein Anbieter feststeht und du eine genaue
    Zahl brauchst: Jeder berücksichtigt Details, die der Vergleich vereinfacht,
    darunter internationale Karten, verhandelte Sätze und das Hochrechnen eines
    Betrags, damit nach Gebühren genau die gewünschte Summe ankommt.

    ## Die Fehler, die sie verhindern

    Zwei Fehler tauchen ständig auf. Erstens: die beworbenen Prozentsätze zu
    vergleichen und die Fixgebühr zu übersehen. Bei einem Verkauf über 5 $
    machen Stripes 0,30 $ allein schon 6 % aus, deshalb zerstören
    Kleinstbeträge Margen, die in der Tabelle gut aussehen. Zweitens: die
    Aufschläge für grenzüberschreitende Zahlungen und Währungsumrechnung zu
    vergessen (bei Stripe 1,5 % bzw. 1 % extra). Sie machen einen ausländischen
    Kunden beim gleichen Preis still und leise deutlich weniger profitabel als
    einen inländischen.

"Freelance":
  "body": |
    Selbstständige Arbeit wird öfter falsch bepreist als schlecht verkauft. Der
    typische Fehler: ein Wunschgehalt durch 2.080 Stunden teilen und das Ergebnis
    anbieten. Das ignoriert jede nicht abrechenbare Stunde und alle Kosten, die
    früher der Arbeitgeber getragen hat.

    ## Welcher Rechner passt

    Starte mit dem **Freelance-Stundensatz**: Er rechnet vom benötigten Einkommen
    rückwärts und schlägt nicht abrechenbare Zeit, unbezahlten Urlaub,
    Krankheitstage, Betriebsausgaben und Selbstständigen-Abgaben wieder auf, die
    ein Angestelltengehalt verdeckt. **Gehalt in Stundensatz** rechnet ein
    Stellenangebot in den gleichwertigen Freelance-Satz um, der ehrliche
    Vergleich zwischen Auftrag und Anstellung. **Projektkalkulation** bepreist
    Festpreisarbeit mit Risikopuffer, und der **Rechnungsrechner** erledigt das
    fertige Dokument inklusive Steuern und mehrerer Positionen.

    ## Was die Zahlen bedeuten

    Realistisch rechnet ein Solo-Freelancer 50–70 % seiner Zeit ab, nicht 100 %.
    Vertriebsgespräche, Angebote, Verwaltung, Rechnungen und Marketing sind echte
    Stunden, die kein Kunde direkt bezahlt. Bei 60 % Auslastung ergibt ein
    Einkommensziel von 100.000 $ über 46 Arbeitswochen rund 120 $ pro Stunde vor
    Steuern und Ausgaben, nicht die 52 $, die eine naive Division durch 2.080
    Stunden nahelegt. Kalkulierst du mit der ersten Zahl, trägt sich das Geschäft;
    mit der zweiten geht es langsam ein.

"Tax & Compliance":
  "body": |
    Steuern sind die Kosten, die bei Preisentscheidungen am häufigsten vergessen
    werden und am ehesten als unangenehme Überraschung kommen. Diese Rechner
    liefern Planungsschätzungen, damit das Geld zurückgelegt wird, bevor es
    ausgegeben ist.

    ## Welcher Rechner passt

    **MwSt.** schlägt die Mehrwertsteuer zu jedem Satz auf oder rechnet sie
    heraus, auch rückwärts von einem Bruttobetrag. Genau das bringt die meisten
    durcheinander: 20 % MwSt. herauszurechnen heißt, durch 1,2 zu teilen, nicht
    20 % abzuziehen. **Freelance-Steuern** schätzt, was Selbstständige von jeder
    Rechnung zurücklegen sollten. **Lohnabgaben** deckt die Arbeitgeberseite ab,
    die Erst-Arbeitgeber am meisten überrascht.

    ## Was die Zahlen bedeuten

    Die nützlichste Gewohnheit, die sie fördern: Steuern beim Zahlungseingang
    zurücklegen, nicht erst bei der Erklärung. Wer als Freelancer 25–30 % jeder
    Zahlung am Tag des Eingangs auf ein separates Konto überweist, steht nie vor
    einer Quartalszahlung, die er nicht begleichen kann. Sätze, Schwellen und
    Freibeträge ändern sich je nach Land und Steuerjahr, und diese Rechner dienen
    der Planung, nicht der Steuererklärung: Prüf die aktuellen Werte beim
    Finanzamt oder mit deiner Steuerberatung, bevor du etwas einreichst.

"HR & People":
  "body": |
    Personal ist in den meisten Dienstleistungs- und Softwareunternehmen der
    größte Kostenblock und wird am häufigsten nur mit dem Grundgehalt budgetiert.
    Diese Rechner beziffern die echte Zahl.

    ## Welcher Rechner passt

    **Mitarbeiterkosten** und **Personalkosten** ermitteln die Vollkosten: Gehalt
    plus Arbeitgeberabgaben, Zusatzleistungen, Ausstattung, Software und
    Arbeitsplatz, die zusammen meist 25–40 % auf das Grundgehalt aufschlagen.
    **Fluktuationskosten** beziffert einen Weggang: Recruiting, Kündigungsfrist,
    Einarbeitung und die Monate geringerer Leistung, bis die Nachfolge produktiv
    ist. **Fluktuationsrate** verfolgt die Quote selbst, und **Provision**
    modelliert variable Vergütung, damit ein Vertriebsplan vor dem Angebot gegen
    die Marge geprüft werden kann.

    ## Was die Zahlen bedeuten

    Einen Mitarbeiter zu ersetzen kostet einschließlich Produktivitätsverlust
    häufig zwischen sechs Monaten und zwei Jahren seines Gehalts, und die Zahl
    steigt mit Seniorität und Spezialisierung. Diese Zahl gehört neben jede
    Bindungsentscheidung: Eine Gehaltserhöhung, ein Weiterbildungsbudget oder
    flexible Arbeitszeiten wirken für sich teuer, sind aber oft viel günstiger als
    der Weggang, den sie verhindern. Prüfe Provisionsmodelle gegen den
    Deckungsbeitrag statt gegen den Umsatz: Ein Plan, der auch bei rabattierten
    Deals gut zahlt, belohnt stillschweigend Rabatte.

"Investment & Returns":
  "body": |
    Jede Investitionsentscheidung ist ein Vergleich mit den Alternativen,
    einschließlich der, nichts zu tun. Diese Rechner geben diesem Vergleich eine
    belastbare Zahl, statt sich auf das Gefühl zu verlassen, ein Projekt „lohne
    sich wohl“.

    ## Welcher Rechner passt

    **ROI** ist die einfache, zeitblinde Variante: nützlich für schnelle
    Vergleiche, irreführend bei langen Horizonten, weil ein Dollar in fünf Jahren
    wie ein Dollar heute zählt. **Kapitalwert** und **IRR** korrigieren das, indem
    sie künftige Cashflows abzinsen, und die **MIRR** behebt die optimistische
    Annahme der IRR, dass Zwischen-Cashflows zur IRR selbst reinvestiert werden.
    **WACC** liefert den Diskontsatz, den diese Modelle brauchen: die gemischten
    Kosten von Fremd- und Eigenkapital, die das Unternehmen finanzieren. Die
    **Amortisationsdauer** beantwortet die Frage nach dem Cash-Risiko statt nach
    der Rendite: Wie lange dauert es, bis das Geld zurück ist? Die **72er-Regel**
    ist die Faustformel dafür, wie lange ein Zinssatz braucht, um eine Summe zu
    verdoppeln.

    ## Was die Zahlen bedeuten

    Kapitalwert und IRR können sich widersprechen. Dann gilt bei sich
    ausschließenden Projekten der Kapitalwert, weil er geschaffenen Wert misst und
    keinen Satz. Beide sind nur so gut wie die Cashflow-Prognose darunter, und
    dort liegt die eigentliche Unsicherheit. Rechne jedes Modell mit einem
    pessimistischen, einem erwarteten und einem optimistischen Szenario: Ein
    Projekt, das die Hürde nur im optimistischen Fall nimmt, ist eine Wette, keine
    Investition.

"Valuation":
  "body": |
    Bewertung ist eine Verhandlung, die auf Rechnung beruht, kein Ergebnis der
    Rechnung. Diese Rechner liefern die belastbare Spanne, von der das Gespräch
    ausgeht, und machen sichtbar, welche Annahmen den Ausschlag geben.

    ## Welcher Rechner passt

    **DCF** ist die Methode aus ersten Prinzipien: Cashflows prognostizieren,
    abzinsen und sehen, was das Unternehmen aus eigener Kraft wert ist.
    **EBITDA-Multiple**, **KGV** und **KUV** sind der Vergleichsansatz: schneller,
    am Markt verankert und die Art, wie die meisten Transaktionen kleiner
    Unternehmen und SaaS-Firmen tatsächlich bepreist werden. **Unternehmenswert**
    verbindet beides, indem er den Eigenkapitalwert um Schulden und Cash bereinigt:
    die Zahl, die ein Käufer verhandelt. **TAM/SAM/SOM** beziffert die Chance, auf
    der eine Wachstumsstory ruht, und **Verwässerung** zeigt, was Gründern nach
    jeder Finanzierungsrunde bleibt.

    ## Was die Zahlen bedeuten

    Multiples schwanken stark mit Wachstum und Branche: Ein SaaS mit über 40 %
    Wachstum pro Jahr erzielte historisch ein Vielfaches des Umsatzmultiples eines
    SaaS mit 10 %, und private Unternehmen werden gegenüber börsennotierten
    Vergleichswerten mit einem Illiquiditätsabschlag gehandelt. Sieh jedes
    einzelne Multiple als Mitte einer breiten Spanne. Bei der Verwässerung
    unterschätzen Gründer regelmäßig den kumulierten Effekt: Drei Runden mit je
    20 % lassen rund 51 % übrig, nicht 40 %, weil jede Runde die
    Post-Money-Cap-Table verwässert und nicht die ursprüngliche.

"Marketing":
  "body": |
    Marketingausgaben lassen sich verteidigen, wenn sie am Umsatz gemessen werden
    statt an Aktivität. Diese Rechner übersetzen Kampagnenkennzahlen in die
    Zahlen, mit denen ein Finanzgespräch tatsächlich arbeitet: Kosten pro
    gewonnenem Kunden, Rendite pro ausgegebenem Dollar und den Umsatz, den ein
    bestimmter Funnel bringt.

    ## Welcher Rechner passt

    **ROAS** ist das Arbeitspferd im Performance-Marketing (Umsatz pro
    Werbedollar), während **Conversion-Rate** und **Sales-Funnel** zeigen, an
    welcher Stelle eines mehrstufigen Wegs Interessenten tatsächlich verloren
    gehen. **Umsatz pro Lead** und **durchschnittlicher Bestellwert** sind die
    beiden Eingaben, die ein Funnel-Modell wertvoll machen: Wer eine davon
    verbessert, hebt jede nachfolgende Stufe. **Sales Velocity** fasst Zahl der
    Deals, Dealgröße, Abschlussquote und Zykluslänge in einer Zahl zusammen, wie
    schnell eine Pipeline Umsatz erzeugt, meist hilfreicher als jede der vier
    allein. **E-Mail-ROI** und **Listenwachstum** decken den Kanal mit der höchsten
    gemessenen Rendite und dem langsamsten Zinseszinseffekt ab.

    ## Was die Zahlen bedeuten

    Ein ROAS von 4:1 ist ein gängiges Ziel, aber eine Bruttozahl: Über die Marge
    sagt er nichts. Bei 25 % Bruttomarge erreicht ein ROAS von 4:1 vor
    Gemeinkosten gerade die Gewinnschwelle. Bewerte Kampagnen nach dem
    Deckungsbeitrag nach Herstellkosten und am Kundenwert statt am Erstkauf, sonst
    schaltest du genau die Kanäle ab, die dir die treuesten Kunden bringen.
