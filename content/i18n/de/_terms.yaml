# German finance vocabulary: reuse in every batch. Du-form, as in i18n.yaml.
free cash flow: Free Cashflow (FCF)
operating cash flow: operativer Cashflow (OCF)
capital expenditures (capex): Investitionsausgaben (Capex)
revenue: Umsatz
market cap: Marktkapitalisierung
margin / gross margin: Marge / Bruttomarge
runway: Runway (Liquiditätsreichweite)
burn / burn rate: Burn (Cash-Verbrauch)
churn: Churn (Kündigungsrate)
MRR / ARR: MRR / ARR (unverändert)
working capital: Working Capital (Umlaufvermögen minus kurzfristige Verbindlichkeiten)
accounts receivable / payable: Forderungen / Verbindlichkeiten aus Lieferungen und Leistungen
net income: Nettogewinn
break-even: Break-even (Gewinnschwelle)
calculator: Rechner
founder: Gründer
