"budget-variance-calculator":
  "body": |
    ## Fórmula de la desviación presupuestaria

    $$\text{Desviación} = \text{Real} - \text{Presupuesto}$$

    $$\text{Desviación \%} = \frac{\text{Real} - \text{Presupuesto}}{|\text{Presupuesto}|} \times 100$$

    ### Favorable o desfavorable

    Que una desviación sea «favorable» depende del tipo de partida:

    | Tipo de partida | Condición favorable |
    |-----------|---------------------|
    | Ingresos | Real > presupuesto (se ingresó más de lo previsto) |
    | Gastos | Real < presupuesto (se gastó menos de lo previsto) |

    ### Umbrales de materialidad

    La mayoría de organizaciones fijan umbrales de materialidad para investigar desviaciones. Reglas habituales:
    - Investigar desviaciones > 5–10 % en partidas de más de $10k
    - Investigar siempre desviaciones de ingresos > 10 %
    - Señalar desviaciones acumuladas aunque cada periodo esté dentro de la tolerancia

    ### Tipos de desviación presupuestaria

    - **Desviación en precio**: el precio unitario fue distinto del presupuestado
    - **Desviación en volumen**: la cantidad vendida o consumida fue distinta
    - **Desviación en eficiencia**: el consumo de mano de obra o material por unidad fue distinto
    - **Desviación en mix**: la combinación de productos o servicios vendidos difiere del mix previsto

    Entender el origen de una desviación determina la acción correctora adecuada.

    ### Guías

    - [¿Qué es el análisis de desviaciones presupuestarias?](/tools/budget-variance-calculator/#what-is-budget-variance-analysis)
    - [Desviación favorable o desfavorable: diferencias clave](/tools/budget-variance-calculator/#favorable-vs-unfavorable-variance)
"cash-conversion-cycle-calculator":
  "body": |
    El ciclo de conversión de caja (CCC) mide cuántos días está inmovilizada la
    caja de una empresa en la operación, desde que paga el inventario o los
    insumos hasta que cobra a sus clientes.

    ## La fórmula del CCC

    **CCC = DIO + DSO − DPO**

    Donde:
    - **DIO** (días de inventario) = inventario medio ÷ [coste de ventas](/glossary/#cogs) × 365
    - **DSO** (periodo medio de cobro) = cuentas por cobrar medias ÷ ingresos × 365
    - **DPO** (periodo medio de pago) = cuentas por pagar medias ÷ coste de ventas × 365

    ## Ejemplo de cálculo

    Una empresa con:
    - Inventario medio: $500k
    - Coste de ventas anual: $3M
    - Cuentas por cobrar medias: $400k
    - Ingresos anuales: $5M
    - Cuentas por pagar medias: $200k

    - DIO = $500k ÷ $3M × 365 = 60,8 días
    - DSO = $400k ÷ $5M × 365 = 29,2 días
    - DPO = $200k ÷ $3M × 365 = 24,3 días
    - **CCC = 60,8 + 29,2 − 24,3 = 65,7 días**

    De media, la empresa tiene 65,7 días de caja atrapados en capital circulante.

    ## CCC negativo: el santo grial

    Algunos negocios, sobre todo SaaS (los clientes pagan por adelantado) y los
    gigantes del retail (venden antes de pagar a proveedores), logran un CCC
    negativo: cobran antes de tener que pagar a sus proveedores.

    Amazon operó durante años con un CCC negativo, usando en la práctica el
    crédito de proveedores como capital circulante gratuito para financiar su
    crecimiento.

    ## El CCC en un SaaS

    Un SaaS puro suele tener:
    - DIO = 0 (sin inventario físico)
    - DSO = según las condiciones de pago (0 en suscripciones mensuales, 30–60 en grandes cuentas facturadas)
    - DPO = según las condiciones de los proveedores (normalmente 30–60 días)

    Un SaaS con cobro mensual con tarjeta y pagos a proveedores estándar suele
    tener un CCC cercano a 0 o negativo.

    ## Cómo mejorar el CCC

    **Reducir el DIO**: rotar el inventario más rápido con mejores previsiones de
    demanda, menos stock de seguridad o compras just-in-time.

    **Reducir el DSO**: ofrecer descuentos por pronto pago, automatizar el cobro,
    acortar los plazos de los nuevos clientes y usar la facturación automática.

    **Aumentar el DPO**: negociar plazos de pago más largos con los proveedores
    (60–90 días en lugar de 30). Las grandes empresas lo hacen sistemáticamente.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula los días de inventario, el periodo medio de cobro y el periodo medio
    de pago, y los combina en el ciclo de conversión de caja.
"dso-calculator":
  "body": |
    ## ¿Qué es el periodo medio de cobro (DSO)?

    El DSO (Days Sales Outstanding) mide cuántos días tarda de media tu negocio
    en cobrar tras una venta. Es una de las métricas de capital circulante más
    importantes, porque cuantifica directamente cuánta caja está bloqueada en
    cuentas por cobrar en cada momento.

    **DSO = (cuentas por cobrar ÷ ventas a crédito totales) × número de días**

    Un DSO más bajo significa cobrar antes y tener menos caja atrapada en
    facturas pendientes. Un DSO al alza es una alerta temprana de problemas de
    cobro o de tensión de caja en tus clientes.

    ## Cómo interpretar tu DSO

    | DSO | Interpretación |
    |---|---|
    | Menos de 30 días | Excelente: los clientes pagan puntualmente |
    | 30–45 días | Bueno: en línea con un plazo estándar a 30 días |
    | 45–60 días | Aceptable: vigila si tiende a subir |
    | 60–90 días | Elevado: revisa tu proceso de cobro |
    | Más de 90 días | Alto: impacto notable en el capital circulante |

    ## Rotación de cuentas por cobrar

    La rotación de cuentas por cobrar es la relación inversa al DSO:

    **Rotación = ventas a crédito totales ÷ cuentas por cobrar medias**

    Cuanto mayor la rotación, antes cobras. Complementa al DSO: una rotación de
    12× implica un DSO medio de unos 30 días.

    ## Cómo reducir el DSO

    1. **Acortar los plazos de pago**: pasar de 60 a 30 días con los clientes nuevos
    2. **Ofrecer descuentos por pronto pago**: «2/10 neto 30» (2 % de descuento si se paga en 10 días)
    3. **Automatizar recordatorios**: enviarlos a los 7, 14 y 30 días del vencimiento
    4. **Pedir anticipos**: en proyectos grandes, cobrar un 25–50 % por adelantado
    5. **Aceptar más medios de pago**: menos fricción con domiciliación, tarjeta y transferencia

    ## Impacto en el capital circulante

    Cada día de DSO que ganas libera una caja igual a tus ventas diarias. Si
    facturas $450.000 al trimestre y bajas el DSO de 45 a 30 días, liberas
    15 × ($450.000 ÷ 90) = **$75.000 de caja** sin cambiar los ingresos.

    ## Preguntas frecuentes

    **¿Cuál es un buen DSO para una SaaS B2B?**
    Las SaaS B2B con suscripción mensual suelen tener un DSO casi nulo porque la
    suscripción se cobra por adelantado. En contratos anuales facturados por
    adelantado, el DSO suele ser de 30–45 días tras la factura. Si combinas
    suscripciones y servicios profesionales, tu DSO combinado puede estar entre
    35 y 55 días.

    **¿Cómo afecta el DSO a mi línea de crédito?**
    Los prestamistas miran el DSO al conceder préstamos respaldados por activos y
    financiación de facturas. Un DSO alto o creciente puede indicar problemas de
    cobro y reducir el porcentaje de anticipo sobre tus cuentas por cobrar.
    Mantener el DSO por debajo de 45 días suele hacer tus cuentas por cobrar
    financiables a los porcentajes habituales (normalmente 80–85 %).
"free-cash-flow-calculator":
  "body": |
    El flujo de caja libre (FCF) es la caja que genera un negocio después de
    descontar las inversiones de capital. Es la medida más fiel de la capacidad
    de una empresa para generar caja: más fiable que el beneficio (que las
    decisiones contables pueden distorsionar) y más útil que el crecimiento de
    ingresos por sí solo.

    ## La fórmula

    **FCF = flujo de caja operativo − inversiones de capital**

    Una empresa con $500k de OCF y $80k de capex genera **$420k de FCF**.

    ## Por qué el FCF importa más que el EBITDA

    El EBITDA suma de nuevo los cargos que no son caja para comparar resultados
    entre estructuras de capital. El FCF va más allá: tiene en cuenta la
    reinversión necesaria para sostener el negocio. Una empresa que invierte
    mucho en equipos puede tener un EBITDA sólido y un FCF negativo: en realidad
    no está reteniendo caja.

    En una SaaS, la diferencia entre EBITDA y FCF suele ser pequeña (el capex es
    mínimo). En hardware, industria o infraestructuras, el capex puede consumir
    el 30–50 % del flujo de caja operativo, y el FCF se aleja mucho del EBITDA.

    ## Referencias de margen FCF

    | Tipo de empresa | Margen FCF |
    |---|---|
    | SaaS de primer nivel (Shopify, Veeva) | 20–30 % |
    | SaaS rentable típica | 10–20 % |
    | SaaS en fase inicial o de crecimiento | 0–10 % |
    | Negocios con mucho capex | -10–+5 % |

    ## Rentabilidad FCF para valorar

    Rentabilidad FCF = FCF / capitalización bursátil × 100

    Una rentabilidad FCF del 5 % significa que pagas 20× el FCF. Un 2 % significa
    50× el FCF. En general, por encima del 4–5 % se considera barato y por debajo
    del 1,5 %, caro. Ajústalo a las expectativas de crecimiento: las empresas de
    alto crecimiento justifican rentabilidades más bajas.

    ## FCF frente a flujo de caja libre para el accionista (FCFE)

    El FCF es la generación de caja de la empresa antes del servicio de la deuda.
    El FCFE resta los pagos de deuda: FCFE = FCF − (amortización de deuda − deuda
    nueva). Para un inversor en capital que valora una empresa endeudada, el FCFE
    es más relevante.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el flujo de caja libre a partir del flujo de caja operativo y el
    capex, además del margen FCF y, opcionalmente, la rentabilidad FCF para
    contextualizar la valoración.
"invoice-discount-calculator":
  "body": |
    ## Fórmula del descuento por pronto pago

    Para una condición «2/10 neto 30» (2 % de descuento si se paga en 10 días; si no, vence a 30):

    $$\text{Coste anualizado} = \frac{\text{Descuento \%}}{100 - \text{Descuento \%}} \times \frac{365}{\text{Días neto} - \text{Días de descuento}}$$

    **Ejemplo (2/10 neto 30):**

    $$\frac{2}{98} \times \frac{365}{20} = 37.2\%$$

    Renunciar a un descuento 2/10 neto 30 equivale a pedir prestado a una TAE del 37,2 %: casi siempre compensa aprovecharlo si tienes la caja.

    ### Cuándo aprovechar el descuento

    Aprovecha el descuento por pronto pago cuando el **coste anualizado de renunciar a él** supere tu **coste de capital** (coste de una línea de crédito, coste de oportunidad de la caja).

    | Tu tipo de financiación | Coste anualizado del descuento | Decisión |
    |--------------------|--------------------------|---------- |
    | 8 % | 37,2 % | Aprovechar el descuento |
    | 8 % | 6 % | Renunciar: financiarse sale más barato que perder el descuento |

    ### Descuento dinámico

    Algunas plataformas de cuentas por pagar ofrecen descuento dinámico: tipos variables según los días de adelanto. Usa esta calculadora para evaluar cualquier oferta calculando su coste anualizado implícito.

    ### Guías

    - [¿Qué es la condición de pago 2/10 neto 30?](/tools/invoice-discount-calculator/#what-is-2-10-net-30)
    - [¿Cuándo aprovechar un descuento por pronto pago?](/tools/invoice-discount-calculator/#when-to-take-early-payment-discount)
"operating-cash-flow-calculator":
  "body": |
    El flujo de caja operativo (OCF) mide la caja que el negocio genera realmente
    con su actividad principal. A diferencia del beneficio neto, cuesta
    manipularlo con decisiones contables: el dinero llegó a tu cuenta bancaria o
    no llegó.

    ## La fórmula del método indirecto

    **OCF = beneficio neto + amortizaciones + variación del capital circulante**

    Es el método más habitual (método indirecto), porque parte del beneficio neto,
    fácil de obtener, y ajusta las partidas que no son caja y los desfases
    temporales.

    ## Por qué el OCF difiere del beneficio neto

    **La amortización** reduce el beneficio contable pero no consume caja. Un
    servidor de $10k amortizado en 5 años reduce el beneficio neto en $2k al año,
    pero se pagó el primer año. Sumar de nuevo las amortizaciones convierte el
    beneficio contable en beneficio en caja.

    **La variación del capital circulante** refleja el desfase entre reconocer un
    ingreso y cobrarlo:
    - Cuentas por cobrar **al alza** → has facturado pero aún no has cobrado → el OCF es menor que el beneficio neto
    - Cuentas por pagar **al alza** → has recibido la mercancía pero aún no la has pagado → el OCF es mayor que el beneficio neto

    ## Flujo de caja libre (FCF)

    **FCF = OCF − inversiones de capital**

    El flujo de caja libre es lo que queda tras mantener y ampliar la base de
    activos. Es la métrica que usan los fondos de private equity y los inversores
    sofisticados para valorar empresas, porque representa la caja realmente
    distribuible.

    | OCF | Capex | FCF | Interpretación |
    |---|---|---|---|
    | +$100k | $5k | +$95k | Sano: el negocio genera caja |
    | +$100k | $50k | +$50k | Aceptable: fuerte inversión en activos |
    | +$100k | $120k | −$20k | Fase de inversión para crecer |
    | −$50k | $10k | −$60k | Drenaje de caja: necesita financiación externa |

    ## Ratio de conversión de caja

    **Ratio de conversión de caja = OCF ÷ beneficio neto**

    Por encima de 1×, el negocio genera más caja que beneficio contable (buena
    señal). Por debajo de 1×, el beneficio avanza más rápido que los cobros:
    vigila las cuentas por cobrar. Por encima de 1,5×, suele indicar
    amortizaciones elevadas en relación con el capex.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el flujo de caja operativo a partir del beneficio neto, las amortizaciones y la variación del capital circulante, además del flujo de caja libre y el ratio de conversión de caja.
"working-capital-calculator":
  "body": |
    El capital circulante es la diferencia entre el activo corriente y el pasivo
    corriente de un negocio. Mide la liquidez a corto plazo: el colchón operativo
    que mantiene el día a día sin una crisis de caja.

    ## La fórmula

    **Capital circulante = activo corriente − pasivo corriente**

    Con $500k de activo corriente y $200k de pasivo corriente, el capital
    circulante es de $300k. Esos $300k son el colchón de caja operativo.

    ## Ratio de liquidez

    **Ratio de liquidez = activo corriente / pasivo corriente**

    $500k / $200k = 2,5x. Por cada $1 de obligaciones a corto plazo hay $2,50 de
    activos líquidos disponibles.

    ## Prueba ácida

    **Prueba ácida = (activo corriente − inventario) / pasivo corriente**

    La prueba ácida excluye el inventario porque convertirlo en caja lleva
    tiempo. Es una medida más prudente de la liquidez inmediata.

    ## Referencias

    | Ratio de liquidez | Valoración |
    |---|---|
    | > 2,0x | Sólido: amplio colchón a corto plazo |
    | 1,5–2,0x | Sano: liquidez cómoda |
    | 1,0–1,5x | Justo: poco margen de error |
    | < 1,0x | Alerta: posible riesgo de liquidez |

    ## Capital circulante negativo

    Algunos negocios, sobre todo SaaS y empresas de suscripción, pueden operar con
    capital circulante negativo. Si los clientes pagan el año por adelantado (lo
    que genera ingresos diferidos, un pasivo corriente), el capital circulante
    será negativo aunque el negocio esté perfectamente sano.

    Amazon funcionó durante años con capital circulante negativo: los clientes
    pagaban al instante y Amazon pagaba a sus proveedores a 30–45 días. Esa
    diferencia financiaba la operación.

    ## Capital circulante y ciclo de conversión de caja

    El capital circulante es el saldo estático; el [ciclo de conversión de caja](/tools/cash-conversion-cycle-calculator/)
    es el flujo dinámico. Un negocio puede tener capital circulante positivo y un
    CCC pésimo si tarda más de 90 días en cobrar. Sigue ambas métricas a la vez.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el capital circulante, el ratio de liquidez, la prueba ácida y los
    días de capital circulante a partir de tu activo y pasivo corrientes.

"payment-fee-comparison":
  "body": |
    Elegir el procesador de pagos más barato para tu negocio es sencillo en
    cuanto ves los números lado a lado. Introduce tu importe de venta habitual y
    la tabla comparativa se actualiza al instante con las comisiones exactas y el
    neto que recibes con **Stripe**, **PayPal Standard**, **PayPal Checkout** y
    **Shopify Payments** en cada uno de sus tres planes.

    ## Cómo funciona la comparación

    La estructura de comisiones de cada procesador usa sus tarifas públicas en EE. UU.:

    | Procesador | Tarifa | Comisión fija |
    |-----------|------|-----------|
    | Stripe | 2,9 % | + $0,30 |
    | PayPal Standard | 2,99 % | + $0,49 |
    | PayPal Checkout | 3,49 % | + $0,49 |
    | Shopify Basic | 2,0 % | + $0,25 |
    | Shopify (plan Shopify) | 1,7 % | + $0,25 |
    | Shopify Advanced | 1,5 % | + $0,25 |

    ## Cuándo sale más barato Shopify Payments

    Shopify Payments supera a Stripe en transacciones nacionales de EE. UU. con
    Visa/Mastercard por encima de unos $12. A $100, Shopify Basic ahorra $0,95
    por transacción frente a Stripe. Con $500 al mes de volumen en el plan Basic
    ($39/mes), las cuentas quedan más o menos igual; pero con $50.000 al mes el
    ahorro en tarifa supera con creces la cuota del plan.

    ## Cuándo quedarse con Stripe

    Stripe gana en: facturación de suscripciones, APIs SaaS, pagos
    internacionales (más de 135 divisas), adeudo directo ACH, facturación B2B y
    negocios que no están en Shopify. Su ecosistema para desarrolladores no tiene
    rival. Usa esta herramienta para cuantificar la diferencia de comisiones y
    compárala con el coste de cambiar y tus necesidades de funcionalidades.

    ## Preguntas frecuentes

    **¿Qué procesador de pagos tiene las comisiones más bajas?**
    Shopify Payments (plan Advanced) tiene la tarifa más baja, 1,5 % + $0,25,
    pero exige una tienda Shopify y una suscripción de $399/mes. Fuera de
    Shopify, Stripe (2,9 % + $0,30) supera a PayPal Standard (2,99 % + $0,49) en
    transacciones de más de $15.

    **¿Cuánto más barato es Shopify Payments que Stripe?**
    En una transacción de $100: Shopify Basic cobra $2,25 y Stripe $3,20, así que
    Shopify sale $0,95 más barato. Pero Shopify Basic exige un plan de $39/mes.
    Necesitarías más de $4.100 al mes de volumen para que el ahorro frente a
    Stripe cubra el plan.

    **¿PayPal cobra más que Stripe?**
    Sí. PayPal Standard cobra 2,99 % + $0,49 frente al 2,9 % + $0,30 de Stripe.
    En una transacción de $100, PayPal Standard se queda $3,48 y Stripe $3,20:
    PayPal es $0,28 más caro. PayPal Checkout (3,49 % + $0,49) es bastante más
    caro que ambos.

    **¿Puedo usar Stripe en Shopify sin pagar comisiones extra?**
    Sí, pero Shopify cobra una comisión por transacción de terceros (0,5 %–2 %
    según tu plan) si usas cualquier procesador que no sea Shopify Payments. Con
    $10.000 al mes, eso suma $50–$200 en recargos de Shopify. Shopify Payments
    (que funciona sobre la infraestructura de Stripe) elimina esa comisión.
"paypal-fee-calculator":
  "body": |
    PayPal cobra **3,49 % + $0,49** por transacción online nacional, algo más que
    el 2,9 % + $0,30 de Stripe. En pagos internacionales, la comisión sube a
    **4,99 % + $0,49**. Los micropagos (transacciones de menos de $10) tienen una
    tarifa especial: **5 % + $0,05**, más barata en importes muy pequeños pero cara
    en porcentaje.

    ## Comisiones de PayPal frente a Stripe

    | Caso | PayPal | Stripe |
    |---|---|---|
    | $10 nacional | $0,84 (8,4 %) | $0,59 (5,9 %) |
    | $100 nacional | $3,98 (4,0 %) | $3,20 (3,2 %) |
    | $1.000 nacional | $35,39 (3,5 %) | $32,30 (3,2 %) |
    | $100 internacional | $5,48 (5,5 %) | $4,70 (4,7 %) |

    En la mayoría de importes, Stripe es más barato. La ventaja de PayPal es que
    los consumidores lo conocen: ofrecerlo como opción puede mejorar la
    conversión en el checkout.

    ## Modo de repercutir la comisión
    Si necesitas recibir un importe neto concreto, la calculadora hace el ajuste
    al alza: para recibir exactamente $100 con un cobro PayPal nacional, tendrías
    que cobrar **$104,66**.

    ## PayPal «Amigos y familiares»
    Los pagos personales («Amigos y familiares») son gratuitos en transacciones
    nacionales financiadas con cuenta bancaria o saldo PayPal, pero usarlos para
    pagos de negocio incumple las condiciones de PayPal. Te arriesgas al cierre
    de la cuenta, sin la protección al vendedor de las transacciones estándar.

    ## Preguntas frecuentes

    **¿PayPal cobra por los reembolsos?**
    PayPal devuelve la comisión fija de $0,49 pero se queda con la parte
    porcentual (3,49 %) al reembolsar. Stripe, en cambio, devuelve la comisión
    fija pero también se queda con el porcentaje.

    **¿Se pueden evitar las comisiones de PayPal?**
    En transferencias nacionales desde cuenta bancaria a contactos personales,
    sí. En transacciones de negocio, la única forma de reducirlas es el programa
    de tarifa para comerciantes de PayPal, que exige solicitarlo y demostrar un
    volumen alto. En general, Stripe ofrece comisiones más bajas en la mayoría de
    usos profesionales.
"shopify-fee-calculator":
  "body": |
    Shopify cobra dos tipos de comisiones en cada venta: una **comisión de
    procesamiento de pago** (parecida a la de Stripe) y una **comisión por
    transacción** aparte si usas una pasarela de pago de terceros en lugar de
    Shopify Payments. Entender ambas es imprescindible para calcular bien el
    margen.

    ## Estructura de comisiones de Shopify por plan

    | Plan | Cuota mensual | Tarifa de procesamiento | Comisión por transacción (terceros) |
    |---|---|---|---|
    | Basic | $39 | 2,9 % + $0,30 | 2,0 % |
    | Shopify | $105 | 2,6 % + $0,30 | 1,0 % |
    | Advanced | $399 | 2,4 % + $0,30 | 0,5 % |

    La comisión por transacción se aplica *solo* si usas un procesador distinto
    de Shopify Payments (Stripe, PayPal, etc.). Con Shopify Payments desaparece
    por completo.

    ## Shopify Payments frente a pasarelas de terceros

    Para la mayoría de comerciantes, Shopify Payments es la opción más barata
    porque elimina la comisión por transacción. Una venta de $100 en el plan Basic
    con Stripe cuesta **$2,90 + $0,30 + $2,00 = $5,20**, frente a solo **$3,20**
    con Shopify Payments: un 62 % de diferencia.

    Motivos para usar igualmente una pasarela de terceros:
    - Tu país no está cubierto por Shopify Payments (disponible en más de 17 países)
    - Necesitas herramientas antifraude, suscripciones o funciones que solo tiene tu pasarela actual
    - Categorías de producto de alto riesgo que Shopify Payments no admite

    ## Preguntas frecuentes

    **¿La cuota mensual cuenta en el coste por venta?**
    La calculadora muestra solo las comisiones por transacción. Para un coste
    completo por venta con la cuota incluida, divide la cuota mensual entre tu
    número de transacciones al mes y súmalo al total por transacción. Con 100
    ventas al mes en el plan Basic, la cuota supone $0,39 por venta.

    **¿Debería subir de plan para pagar menos comisiones?**
    Las cuentas: si pasar de Basic a Shopify ($66 más al mes) ahorra un 0,3 % y
    elimina un 1 % de comisión por transacción (con pasarela de terceros),
    cubres costes con $66 / 0,013 = $5.077 de ventas al mes. Por encima de ese
    volumen, subir de plan compensa.
"stripe-fee-calculator":
  "body": |
    Stripe es el procesador de pagos preferido por la mayoría de productos SaaS,
    marketplaces y negocios independientes, pero su estructura de comisiones
    confunde constantemente a los fundadores. La tarifa estándar es **2,9 % +
    $0,30** por cobro con tarjeta correcto, pero eso es solo el punto de partida.

    Las tarjetas internacionales (emitidas fuera de EE. UU.) añaden una
    **comisión transfronteriza del 1,5 %**, hasta un total de **4,4 % + $0,30**.
    Si usas Stripe Connect (la plataforma de Stripe para repartir pagos entre un
    marketplace y sus vendedores) para cobrar en nombre de cuentas conectadas, las
    comisiones y el reparto de ingresos se complican. Esta calculadora cubre todos
    los casos habituales.

    ## Cómo funciona el cálculo de comisiones de Stripe
    1. Introduce el importe que quieres cobrar al cliente.
    2. Indica si la tarjeta es nacional o internacional.
    3. Elige si absorbes la comisión o la repercutes al cliente
       (modo «cobrar lo necesario para recibir»).
    4. La calculadora muestra la comisión exacta, el neto que llega a tu cuenta
       bancaria y, en modo repercusión, cuánto cobrar para recibir tu objetivo.

    ## Por qué importa «cobrar más para recibir exactamente lo que necesitas»
    Si necesitas recibir exactamente $100 de una tarjeta nacional de EE. UU., no
    puedes cobrar $100 sin más: recibirías $96,80 tras el 2,9 % + $0,30 de Stripe.
    Para recibir exactamente $100 tienes que cobrar **$103,09** (si el cliente paga
    la comisión). Esta calculadora hace el ajuste al alza automáticamente.

    ## Preguntas frecuentes

    **¿Cambia la tarifa de Stripe según el volumen?**
    Sí. Stripe negocia precios a medida con negocios que procesan más de unos
    $80k al mes. Para la mayoría de fundadores independientes y empresas en fase
    inicial se aplica el 2,9 % + $0,30 estándar. La calculadora usa la tarifa
    estándar; ajusta el campo del porcentaje a tu tarifa negociada.

    **¿Y las comisiones adicionales de Stripe (disputas, reembolsos, internacional)?**
    Los reembolsos devuelven la comisión porcentual pero no los $0,30 fijos. Las
    disputas cuestan $15 sea cual sea el resultado (se devuelven si ganas). Estos
    casos no están en el cálculo por transacción, pero conviene presupuestarlos.

    **¿Puedo usarla para Stripe Connect?**
    Sí. Stripe Connect traslada la misma comisión base a la plataforma o a la
    cuenta conectada según tu configuración. Introduce el cobro total y la tarifa
    combinada aplicable en el campo de tarifa personalizada.

"freelance-project-estimate":
  "body": |
    Presupuestar bien un proyecto freelance es en parte matemáticas y en parte
    gestión del riesgo. Si te quedas corto, trabajas horas sin cobrar. Si te pasas
    sin justificarlo, pierdes el trabajo. Esta calculadora parte de lo que sabes
    (tu tarifa, tus horas estimadas y un colchón para imprevistos) y genera un
    presupuesto que puedes entregar directamente al cliente.

    ## La fórmula en dos partes

    **Estimación base** = tarifa por hora × horas estimadas
    **Presupuesto total** = estimación base × (1 + % de imprevistos)

    El margen de imprevistos no es relleno ni deshonestidad: es un colchón de
    riesgo que cubre lo inevitable, como requisitos poco claros, ampliaciones de
    alcance, rondas de revisión y el tiempo de gestión del proyecto que no
    estimaste de forma explícita.

    ## Qué porcentaje de imprevistos usar

    | Tipo de proyecto | Margen recomendado |
    |---|---|
    | Especificación clara, trabajo conocido | 10–15 % |
    | Proyecto estándar, algunas incógnitas | 20–25 % |
    | Ámbito nuevo, requisitos poco claros | 30–40 % |
    | Fases de I+D o descubrimiento | 50 % o más |

    Los estudios sobre proyectos de software muestran desviaciones del 50–80 %
    sobre las estimaciones iniciales. Un 20 % de imprevistos no es agresivo, es
    prudente. El cliente que discute el margen te está diciendo que espera cambios
    de alcance y no piensa pagarlos.

    ## Precio cerrado o por horas

    Esta calculadora genera un **presupuesto de precio cerrado**. Alternativas:
    - **Por horas (tiempo y materiales)**: facturas las horas reales a tu tarifa.
      Menos riesgo para ti, más riesgo percibido para el cliente. Funciona mejor en
      trabajos continuos o abiertos.
    - **Precio por valor**: el precio sigue el valor que percibe el cliente, no tus
      horas. Más difícil de plantear, pero elimina el techo de tus ingresos.

    ## Preguntas frecuentes

    **¿Muestro el desglose o solo el total?**
    A la mayoría de clientes, muéstrales solo el total. Desglosar tarifa × horas
    invita a negociar cada componente y hace que comparen tu tarifa con el
    mercado. El total es todo lo que necesitan para decidir.

    **¿Cómo gestiono las peticiones fuera del alcance?**
    Añade una cláusula de alcance a tu contrato: cualquier trabajo fuera de los
    entregables definidos se presupuesta aparte. Recúrrela con calma cuando el
    alcance crezca («Encantado de hacerlo; te envío un presupuesto rápido por el
    trabajo extra») en lugar de absorberlo en silencio.
"freelance-rate-calculator":
  "body": |
    Fijar una tarifa freelance sin un cálculo sistemático es una de las formas más
    habituales de cobrar de menos. La cifra que necesitas no es tu antiguo salario
    dividido entre 2.080: es esa cifra *más* impuestos, *más* gastos del negocio,
    *más* un ajuste porque probablemente no puedas facturar todas las horas que
    trabajas.

    Esta calculadora parte de tu **objetivo de ingresos anuales** y calcula hacia
    atrás la tarifa por hora mínima que debes cobrar para alcanzarlo, teniendo en
    cuenta tres factores:

    **1. Tiempo no facturable.** Responder emails, redactar propuestas, llevar la
    contabilidad y formarte llevan tiempo que no puedes facturar. La mayoría de
    freelancers facturan el 60–70 % de sus horas de trabajo.

    **2. Impuestos.** Un autónomo paga el impuesto sobre la renta *más* las
    cotizaciones de autónomo (Seguridad Social + Medicare en EE. UU. ≈ 15,3 %),
    porque normalmente el empleador paga la mitad de las cotizaciones de sus
    empleados. Como freelance, pagas las dos mitades.

    **3. Gastos del negocio.** Suscripciones de software, equipos, oficina o
    coworking, seguro médico, formación y gestoría reducen los ingresos que te
    quedan después de gastos.

    ## Preguntas frecuentes

    **¿Por qué mi «tarifa real» parece mucho más alta de lo que ganan los empleados?**
    Porque lo es. Un empleado a tiempo completo que gana $100k le cuesta a su
    empresa unos $130–145k en total (beneficios, cotizaciones, equipo, oficina).
    Como freelance cubres todo eso tú mismo, además de asumir el riesgo del tiempo
    no facturable y de los huecos de ingresos entre clientes.

    **¿Debería cobrar alguna vez por debajo de mi tarifa mínima?**
    Con un cliente estratégico que te aporta portfolio, recomendaciones o te abre
    la puerta a trabajos mejor pagados, un descuento temporal es una decisión de
    negocio válida, siempre que la tomes de forma consciente y no porque olvidaste
    los impuestos.

    **¿Cómo subo la tarifa a clientes actuales?**
    Avisa con 60–90 días, apóyate en el valor («mi tarifa sube a X porque ahora
    entrego Y») y mantente firme. La mayoría de clientes que se quedan con la nueva
    tarifa acaban respetando más tu tiempo.
"invoice-total-calculator":
  "body": |
    El software de facturación es ideal para clientes recurrentes, pero cuando
    necesitas un total rápido para una propuesta, un desglose de costes para un
    email a un cliente o una comprobación antes de enviar una factura, una
    calculadora sencilla es más rápida que abrir tu herramienta de facturación.

    Esta calculadora admite hasta cuatro líneas, un descuento y un impuesto/IVA
    opcionales, y genera un resumen en texto del desglose completo listo para
    copiar y pegar.

    ## Cuándo usar esta calculadora

    - **Fase de propuesta**: modelar el total rápidamente antes de comprometerte con un precio por escrito
    - **Revisiones con el cliente**: mostrar el total acumulado del trabajo hecho a mitad de proyecto
    - **Comprobación multidivisa**: verificar las cuentas antes de pegarlas en tu herramienta de facturación
    - **Comprobación fiscal**: confirmar el importe del IVA o del impuesto antes de enviar

    ## Estrategias de líneas de factura para freelancers

    **Líneas basadas en valor**: en lugar de «40 horas de desarrollo», usa
    «Rediseño y desarrollo web» como descripción. El cliente se fija en el
    entregable, no en el tiempo.

    **Facturación por hitos**: divide los proyectos en dos o tres facturas (por
    ejemplo, 50 % al inicio, 25 % a mitad y 25 % a la entrega). Te protege frente a
    impagos y ayuda al cliente a gestionar su caja.

    **Gastos**: añade líneas para los gastos suplidos (fotos de stock, tipografías,
    herramientas, viajes) con una breve descripción. Factúralos a coste salvo que
    tu contrato prevea un margen.

    ## IVA e impuestos

    En servicios B2B dentro de la UE suele aplicarse la inversión del sujeto
    pasivo: no cobras IVA a clientes empresa de otros Estados miembros, pero la
    factura debe indicar «Inversión del sujeto pasivo». En servicios B2C dentro de
    la UE, puede que tengas que cobrar el IVA al tipo del país del cliente.
    Consulta a tu asesor para tu caso concreto.

    En EE. UU., el impuesto sobre ventas no suele aplicarse a los servicios en la
    mayoría de estados (con excepciones en algunos servicios digitales). Revisa
    las normas de tu estado antes de cobrarlo.

    ## Preguntas frecuentes

    **¿Cómo añado más de 4 líneas?**
    Para facturas más largas, usa una herramienta de facturación de verdad (Bonsai,
    FreshBooks o HoneyBook están pensadas para freelancers). Esta calculadora está
    optimizada para estimaciones rápidas y facturas sencillas.

    **¿Muestro la tarifa por hora o solo el total de la línea?**
    A la mayoría de clientes, muéstrales solo el total por entregable. «40 horas ×
    $125» invita a negociar la tarifa; «Desarrollo: $5.000» te posiciona como
    alguien que entrega un resultado.
"salary-to-hourly-calculator":
  "body": |
    Tanto si eres freelance y comparas tu tarifa con salarios de empleados, como
    si eres empresa y pones precio a un puesto por contrato, o simplemente quieres
    saber cuánto supone tu salario anual por hora, esta calculadora hace la
    conversión al instante y sin registro.

    El cálculo es sencillo para importes brutos:
    **Tarifa por hora** = salario anual ÷ (semanas al año × horas por semana)

    Por defecto se asumen 52 semanas al año y 40 horas a la semana. La calculadora
    permite ajustar ambas cifras, algo útil para:
    - Trabajo a tiempo parcial (por ejemplo, 20 horas a la semana)
    - Personas con más o menos de 52 semanas pagadas (por ejemplo, con permisos sin sueldo)
    - Empleados con las vacaciones pagadas incluidas en el salario

    ## Tarifa por hora antes y después de impuestos

    La calculadora ofrece una tarifa por hora estimada después de impuestos para
    los tramos habituales del impuesto federal de EE. UU. (10 %, 12 %, 22 %, 24 %,
    32 %, 35 %, 37 %). Ojo: es una estimación simplificada que no tiene en cuenta
    impuestos estatales, deducciones ni situación familiar. Úsala para
    comparaciones aproximadas, no para planificar impuestos.

    ## Preguntas frecuentes

    **¿Cómo paso una tarifa por hora a salario anual?**
    Anual = por hora × horas por semana × semanas al año. Con 40 h y 52 semanas:
    por hora × 2.080 = anual.

    **Mi contrato dice $X al día: ¿cómo lo convierto?**
    Divide entre tus horas diarias para obtener la tarifa por hora y multiplica por
    tus horas semanales y semanas al año para el anual. Con jornadas de 8 horas:
    tarifa diaria × 260 días laborables = anual.

    **¿Por qué los freelancers cobran 2–3 veces la tarifa por hora de un empleado equivalente?**
    Porque la parte de cotizaciones del empleador, los beneficios, el equipo, la
    gestión y el riesgo de huecos de ingresos los asume el freelance y no la
    empresa. Consulta la calculadora de tarifa freelance para el desglose completo.

"freelance-tax-estimator":
  "body": |
    Como freelance o contratista independiente en EE. UU., pagas tanto la parte
    del empleado COMO la del empleador de las cotizaciones de Social Security y
    Medicare, llamadas en conjunto **self-employment tax (SE tax)**: un 15,3 % del
    beneficio neto.

    A diferencia de los empleados W-2, nadie te retiene impuestos de tus cobros.
    Debes hacer pagos estimados trimestrales (15 de abril, 16 de junio, 15 de
    septiembre y 15 de enero) para evitar las penalizaciones del IRS por pago
    insuficiente.

    ## Cómo se calculan los impuestos de un freelance

    **Paso 1: beneficio neto** = ingresos brutos − gastos del negocio

    **Paso 2: SE tax** = beneficio neto × 15,3 %
    (Social Security 12,4 % hasta $168.600 + Medicare 2,9 %, sin límite)

    **Paso 3: deducción de la SE tax** = SE tax × 50 %
    (Puedes deducir la mitad de la SE tax de la base imponible)

    **Paso 4: base imponible** = beneficio neto − deducción SE + otros ingresos

    **Paso 5: impuesto federal sobre la renta** = tramos marginales de 2024 aplicados a la base imponible

    **Paso 6: pago trimestral** = (SE tax + impuesto federal) ÷ 4

    ## Deducciones clave que reducen la factura

    - **Gastos del negocio**: software, equipos, formación, despacho en casa
    - **Primas del seguro médico**: totalmente deducibles si pagas tu propia póliza
    - **Aportaciones a la jubilación**: SEP-IRA (hasta el 25 % del beneficio neto, máx. $69k),
      Solo 401(k) (hasta $23k como empleado + 25 % como empleador) o Roth IRA ($7k)
    - **La mitad de la SE tax**: se calcula y deduce automáticamente

    ## La opción de tributar como S-Corp

    A partir de unos $80.000 de beneficio neto, algunos freelancers ahorran
    eligiendo el estatus de S-Corp. Te pagas un «salario razonable» (sujeto a SE
    tax) y te llevas el resto como distribución (no sujeta a SE tax). El ahorro
    puede superar los $5.000 al año, pero exige gestionar nóminas y presentar una
    declaración adicional. Consulta con un asesor (CPA) antes de decidir.

    ## Preguntas frecuentes

    **¿Cuándo tengo que hacer pagos estimados trimestrales?**
    Si esperas deber $1.000 o más de impuestos en el año, el IRS exige pagos
    estimados trimestrales. Los vencimientos son el 15 de abril, 15 de junio,
    15 de septiembre y 15 de enero. No pagar o pagar de menos conlleva una
    penalización (actualmente ~8 % anual sobre el importe no pagado).

    **¿Qué gastos puedo deducir como freelance?**
    Cualquier gasto de negocio ordinario y necesario: despacho en casa (espacio
    dedicado), software y suscripciones del negocio, formación, equipos, internet
    (parte profesional), seguro de responsabilidad profesional, honorarios
    contables y legales, y viajes de negocio.
"payroll-tax-calculator":
  "body": |
    Las cotizaciones del empleador suman aproximadamente un 8–12 % al coste de
    cada empleado, además de su salario base. Para un empleado de $75.000, eso
    supone $6.000–$9.000 al año en impuestos obligatorios adicionales.

    ## Cotizaciones del empleador en EE. UU. (2024)

    | Impuesto | Tipo | Base |
    |----|------|-----------|
    | Social Security (empleador) | 6,2 % | Primeros $160.200 |
    | Medicare (empleador) | 1,45 % | Sin límite |
    | FUTA (desempleo federal) | 0,6 %* | Primeros $7.000 |

    *Después del crédito por el impuesto estatal de desempleo. El tipo FUTA real
    es del 6 %, reducido con un crédito de hasta el 5,4 %.

    ## Impuestos estatales no incluidos

    Esta calculadora solo cubre las cotizaciones federales. La mayoría de estados
    tienen además un impuesto estatal de desempleo (SUTA) con tipos del 0,1 % a
    más del 10 % según el historial del empleador.

    ## Coste total de un empleado

    El coste completo de un empleado incluye:
    - Salario base
    - Cotizaciones del empleador (~8–10 %)
    - Aportación al seguro médico ($5.000–$15.000 al año)
    - Aportación al 401(k) (3–5 % del salario)
    - Equipo, software, oficina

    Para presupuestar, calcula **1,25–1,40× el salario base** como coste total.
"vat-calculator":
  "body": |
    Cuando facturas a un cliente de un país con IVA (Reino Unido, UE, Australia,
    etc.), necesitas saber si tu precio es sin IVA (neto) o con IVA (bruto) y
    calcular el otro. Equivocarte de sentido significa cobrar de menos al cliente
    o asumir el impuesto sin querer.

    Esta calculadora funciona en los dos sentidos:

    **Añadir el impuesto:** precio neto × (1 + tipo) = precio bruto
    **Quitar el impuesto:** precio bruto ÷ (1 + tipo) = precio neto

    Los tipos estándar vienen precargados para las regiones habituales (Reino
    Unido: 20 %, UE por defecto: 20 %/23 %, GST de Australia: 10 %, GST de Canadá:
    5 %, EE. UU.: personalizado). También puedes introducir cualquier tipo.

    ## Conceptos clave

    **Precio neto (sin IVA / sin impuestos):** el precio antes de impuestos. Es lo
    que ingresas como facturación. El IVA que paga el cliente va a Hacienda, no a
    ti.

    **Precio bruto (con IVA):** el total que paga el cliente, impuestos incluidos.

    **Umbral de registro de IVA / GST:** en Reino Unido, debes registrarte a
    efectos de IVA cuando tu facturación sujeta de los últimos 12 meses supera las
    £90.000 (en 2024). Por debajo, no cobras IVA ni tienes que ingresarlo. El
    impuesto sobre ventas de EE. UU. no tiene umbral federal y varía según el
    estado.

    ## Preguntas frecuentes

    **¿Cobro IVA en productos digitales a clientes extranjeros?**
    Las normas de la UE exigen cobrar el IVA al tipo del país del comprador en las
    ventas B2C de productos digitales a clientes de la UE (las normas de
    «servicios digitales» de la UE). Plataformas como Stripe Tax, Paddle y Lemon
    Squeezy lo gestionan automáticamente como «merchant of record». Las ventas B2B
    dentro de la UE suelen usar la inversión del sujeto pasivo (el cliente declara
    el IVA).

    **¿Qué diferencia hay entre IVA e impuesto sobre ventas?**
    El IVA se recauda en cada fase de la producción y los clientes empresa pueden
    recuperarlo. El impuesto sobre ventas de EE. UU. solo se cobra en la venta
    final al por menor y las empresas no pueden recuperarlo. El consumidor final
    soporta ambos; lo que cambia es la mecánica para las empresas.

"commission-calculator":
  "body": |
    ## ¿Qué es una comisión de ventas?

    Una comisión de ventas es una retribución variable que se paga como porcentaje de los ingresos generados. Alinea los incentivos del comercial con los objetivos de ingresos de la empresa.

    $$\text{Comisión} = \text{Ingresos} \times \text{Tasa de comisión}$$

    ### Cumplimiento del OTE

    El OTE (On-Target Earnings, retribución objetivo) es la retribución total de un comercial al 100 % de su cuota:

    $$\text{Cumplimiento} = \frac{\text{Retribución total}}{\text{OTE}} \times 100$$

    ### Estructuras de comisión habituales en SaaS B2B

    | Puesto | Tasa de comisión habitual | Reparto del OTE |
    |------|------------------------|-----------|
    | Account Executive | 8–12 % del [ARR](/glossary/#arr) | 50/50 fijo/variable |
    | SDR/BDR (desarrollo de ventas / negocio) | 4–8 % sobre el pipeline | 70/30 fijo/variable |
    | Responsable de ventas | 2–4 % sobre el equipo | 60/40 fijo/variable |
    | CSM (Customer Success Manager) / Account Manager | 5–10 % sobre la expansión | 70/30 fijo/variable |

    ### Aceleradores

    La mayoría de planes incluyen aceleradores por encima del 100 % del OTE: la tasa de comisión sube para los ingresos que superan la cuota. Premia el sobrecumplimiento y retiene a los mejores comerciales.

    ### Guías

    - [¿Qué es el OTE (retribución objetivo)?](/tools/commission-calculator/#what-is-on-target-earnings)
    - [Cómo estructurar un plan de comisiones de ventas](/tools/commission-calculator/#how-to-structure-sales-commission-plan)
"employee-cost-calculator":
  "body": |
    El error más común al presupuestar plantilla es usar el salario base como
    coste. El coste real para la empresa de un empleado es **salario base × 1,25 a
    1,45** para la mayoría de profesionales del conocimiento en EE. UU., por las
    cotizaciones obligatorias y los beneficios.

    ## Qué compone el coste total de un empleado

    **1. Cotizaciones del empleador (~7,65 %)**
    - FICA: 6,2 % de Social Security (sobre los primeros $168.600) + 1,45 % de Medicare (sin límite)
    - FUTA: 0,6 % efectivo de desempleo federal (sobre los primeros $7.000 de salario)
    - SUTA: ~2,7 % de media de desempleo estatal (sobre los primeros $7.000–$56.500, según el estado)

    **2. Seguro médico**
    - Coste medio para la empresa: $8.000–$18.000 al año por empleado (datos KFF 2024)
    - Cobertura familiar: $14.000–$22.000 al año
    - Cobertura individual: $7.000–$10.000 al año

    **3. Aportaciones a la jubilación (opcional)**
    - Aportación al 401(k): normalmente un 3–6 % del salario
    - Con $100k de salario y un 4 % de aportación: $4.000 al año

    **4. Bonus y acciones**
    - Bonus objetivo de profesionales del conocimiento: 10–20 % del fijo
    - Concesiones de acciones (RSU, acciones restringidas): $5.000–$50.000 al año según el nivel

    ## La regla práctica de 1,25x a 1,4x

    Un modelo mental rápido: multiplica cualquier salario por **1,3** para estimar
    el coste completo (cotizaciones + seguro médico + 401k, sin bonus). Suma un
    15–20 % en puestos con bonus.

    | Salario | Cotizaciones (~8 %) | Beneficios (~12 %) | Total (1,2x) | + 10 % de bonus (1,3x) |
    |---|---|---|---|---|
    | $80.000 | $6.120 | $9.600 | $95.720 | $103.720 |
    | $120.000 | $9.180 | $14.400 | $143.580 | $155.580 |
    | $150.000 | $11.475 | $18.000 | $179.475 | $194.475 |

    ## Contratistas frente a empleados

    Al comparar una contratación W-2 con un contratista, recuerda que la tarifa del
    contratista incluye sus propios impuestos y beneficios. Un contratista a $75 la
    hora no es 1,3 veces más caro que un empleado: paga él mismo su SE tax del
    15,3 % y sus beneficios. Para comparar de verdad, suma primero al salario el
    coste completo del empleo.

    ## Preguntas frecuentes

    **¿Qué cotizaciones paga el empleador?**
    El empleador paga FICA (7,65 %: 6,2 % de Social Security + 1,45 % de
    Medicare), FUTA (0,6 % efectivo sobre los primeros $7.000 de salario) y SUTA
    (desempleo estatal, del 0,6 % al 8,5 % según el estado y el historial).

    **¿Cuánto le cuesta el seguro médico al empleador?**
    Según la encuesta 2024 de la Kaiser Family Foundation, los empleadores pagan de
    media $8.435 al año por cobertura individual y $17.393 al año por cobertura
    familiar. Es la mayor variable del multiplicador de coste después de las
    cotizaciones.
"employee-turnover-calculator":
  "body": |
    ## Fórmula de la tasa de rotación

    $$\text{Tasa de rotación} = \frac{\text{Bajas}}{\text{Plantilla media}} \times 100$$

    $$\text{Plantilla media} = \frac{\text{Plantilla inicial} + \text{Plantilla final}}{2}$$

    ### Referencias por sector

    | Sector | Rotación anual media |
    |----------|------------------------|
    | Tecnología / software | 10–15 % |
    | Finanzas / seguros | 10–15 % |
    | Sanidad | 15–25 % |
    | Comercio minorista | 25–60 % |
    | Hostelería y restauración | 50–75 % |
    | Empresas de trabajo temporal | 100 % o más |

    ### El coste real de la rotación

    La SHRM (Society for Human Resource Management) estima que el coste de sustitución va del 33 % al 200 % del salario anual según el puesto:

    | Puesto | Coste de sustitución |
    |------|-----------------|
    | Nivel inicial / por horas | 33–50 % del salario |
    | Profesional de nivel medio | 50–100 % del salario |
    | Senior / especializado | 100–150 % del salario |
    | Dirección / comité ejecutivo | 150–200 % o más del salario |

    Los costes incluyen: anuncios, honorarios de headhunters, tiempo de entrevistas, pérdida de productividad mientras la vacante está abierta, incorporación y curva de aprendizaje del nuevo empleado.

    ### Guías

    - [Cómo calcular la tasa de rotación de empleados](/tools/employee-turnover-calculator/#how-to-calculate-employee-turnover-rate)
    - [El coste real de la rotación de empleados](/tools/employee-turnover-calculator/#true-cost-of-employee-turnover)
"employee-turnover-cost-calculator":
  "body": |
    La rotación de empleados es uno de los costes más subestimados en una
    empresa. Los estudios de la SHRM (Society for Human Resource Management) y
    Gallup sitúan de forma constante el coste real de sustitución en **6–9 meses
    de salario anual** en puestos habituales, y hasta el **200 %** en puestos
    senior o muy especializados.

    ## Componentes del coste de la rotación

    | Componente | Coste habitual |
    |-----------|-------------|
    | Salida (gestión de RR. HH., entrevista de salida, indemnización) | 3–5 % del salario anual |
    | Vacante (productividad perdida con el puesto sin cubrir) | 50–150 % del salario diario × días |
    | Selección (portales de empleo, agencias, tiempo de entrevistas) | 5–30 % del salario anual |
    | Incorporación y formación | 10–20 % del salario anual |
    | Curva hasta la plena productividad | 25–50 % del salario anual × meses de curva |

    ## Referencias de la SHRM

    - **Nivel inicial / por horas**: ~50 % del salario anual
    - **Técnico / profesional**: 100–150 % del salario anual
    - **Senior / directivo**: 200–400 % del salario anual

    ## Reducir el coste de la rotación

    Palancas de alto impacto: una incorporación estructurada (reduce a la mitad la
    curva de aprendizaje), la formación de los mandos (la primera causa de bajas
    voluntarias), comparar la retribución con el mercado y hacer entrevistas de
    permanencia en lugar de entrevistas de salida.
"payroll-cost-calculator":
  "body": |
    Contratar a un empleado cuesta bastante más que el salario que ofreces. El
    empleador paga cotizaciones, financia beneficios y asume gastos generales que
    suman un 20–40 % al salario base. Esta calculadora cuantifica el coste real
    total.

    ## Lo que paga el empleador en cotizaciones (EE. UU.)

    **FICA (Federal Insurance Contributions Act)**
    - Social Security: 6,2 % del salario (sobre los primeros $168.600 en 2024)
    - Medicare: 1,45 % de todo el salario (más un 0,9 % de Medicare adicional por encima de $200k)
    - FICA total: 7,65 % del salario

    **FUTA (impuesto federal de desempleo)**
    - 6,0 % sobre los primeros $7.000 de salario, reducido al 0,6 % tras el crédito por desempleo estatal
    - Tipo efectivo: normalmente $42 por empleado y año tras el crédito

    **SUTA (impuesto estatal de desempleo)**
    - Varía según el estado: del 0,2 % a más del 8 % sobre una base estatal (normalmente los primeros $10.000–$40.000)
    - El tipo por defecto para un empleador nuevo suele ser del 2,7 %

    ## Lo que suelen costar los beneficios al empleador

    | Beneficio | Coste habitual para el empleador |
    |---|---|
    | Seguro médico (individual) | $7.000–$15.000 al año |
    | Seguro médico (familiar) | $18.000–$28.000 al año |
    | Aportación al 401(k) (3–5 % del salario) | $3.600–$6.000 sobre un salario de $120k |
    | Dental + visión | $600–$1.500 al año |
    | Seguro de vida | $200–$500 al año |
    | Vacaciones pagadas (15 días) | ~5,8 % del salario en coste |

    ## La regla práctica de 1,25–1,40×

    Una regla muy citada: coste total para el empleador = 1,25–1,40× el salario
    anual en empleados a tiempo completo de EE. UU. con beneficios estándar. Con
    un salario de $120k:
    - 1,25×: $150.000 de coste total al año
    - 1,35×: $162.000 de coste total al año

    Más alto en empleados senior con beneficios completos; más bajo en
    contratistas (sin cotizaciones si están bien clasificados como 1099).

    ## Comparación de costes entre empleado y contratista

    Los contratistas (1099) cuestan más por hora, pero sin cotizaciones ni
    beneficios. En un encargo de 40 horas semanales, el equilibrio:
    - Empleado de $120k = ~$58 la hora de coste efectivo
    - Un contratista a $75–90 la hora puede costar más, pero sin compromiso a largo plazo

    Usa esta calculadora junto con la calculadora de tarifa freelance para
    comparar opciones.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el coste total para el empleador, incluidas las cotizaciones (FICA, FUTA, SUTA) y los beneficios.

"irr-calculator":
  "body": |
    La tasa interna de retorno (TIR) es la tasa de rentabilidad anualizada que hace
    que el valor actual neto (VAN) de todos los flujos de caja sea cero. Es una de
    las métricas más usadas en presupuestos de capital y análisis de inversiones.

    ## Fórmula de la TIR

    La TIR es el valor de r que cumple:

    **0 = CF₀ + CF₁/(1+r) + CF₂/(1+r)² + ... + CFₙ/(1+r)ⁿ**

    No tiene solución cerrada: la TIR se calcula por iteraciones (método de
    Newton-Raphson).

    ## Regla de decisión

    - **TIR > WACC (tasa mínima exigida)**: aceptar el proyecto, crea valor
    - **TIR < WACC**: rechazar el proyecto, destruye valor
    - **TIR = WACC**: equilibrio, indiferente

    ## Limitaciones de la TIR

    - **Varias TIR**: flujos que cambian de signo más de una vez pueden dar varias TIR
    - **Ceguera de escala**: la TIR ignora el tamaño del proyecto; un 50 % sobre $1.000 vale menos que un 20 % sobre $1M
    - **Hipótesis de reinversión**: supone que los flujos intermedios se reinvierten a la TIR, lo que puede ser poco realista

    Por eso la TIR suele usarse junto al VAN y no de forma aislada.
"mirr-calculator":
  "body": |
    La TIRM (tasa interna de retorno modificada) corrige un fallo clave de la TIR
    estándar: suponer que todas las entradas de caja se reinvierten a la propia
    TIR, lo que suele ser demasiado optimista.

    ## Fórmula de la TIRM

    **TIRM = (VF de los flujos positivos a la tasa de reinversión / VA de los flujos negativos a la tasa de financiación) ^ (1/n) − 1**

    Donde n = número de periodos.

    ## TIRM frente a TIR

    | Aspecto | TIR | TIRM |
    |--------|-----|------|
    | Hipótesis de reinversión | A la TIR (a menudo demasiado alta) | A la tasa de reinversión que indiques |
    | Problema de varias TIR | Puede tener varias soluciones | Siempre una única solución |
    | Resultado típico | Más alto | Más bajo y realista |
    | Uso | Primer filtro rápido | Presupuesto de capital más riguroso |

    ## Cuándo usar la TIRM

    Usa la TIRM cuando:
    - Los flujos del proyecto alternan entre positivos y negativos (problema de varias TIR)
    - La tasa de reinversión es muy distinta de la TIR
    - Necesitas comparar proyectos de distinta duración
    - Los prestamistas o inversores sofisticados lo exigen

    Umbrales habituales de TIRM: 15 % o más en inversiones de startups o capital
    riesgo, 12–18 % en private equity, 8–12 % en inmobiliario y 6–10 % en
    infraestructuras.
"npv-calculator":
  "body": |
    El valor actual neto (VAN) te dice si una inversión crea o destruye valor,
    comparando el valor actual de los flujos de caja futuros con el coste inicial.

    ## La fórmula

    **VAN = −inversión inicial + Σ [flujo de caja_t / (1 + r)^t]**

    Donde r es la tasa de descuento y t el periodo en años.

    Para una inversión de $100k con una tasa de descuento del 10 % y flujos anuales
    de $30k, $35k, $40k, $40k y $40k:
    VAN = −100k + 30k/1,1 + 35k/1,21 + 40k/1,331 + 40k/1,464 + 40k/1,611
    VAN = −100k + 27,3k + 28,9k + 30,0k + 27,3k + 24,8k = **$38,3k**

    Un VAN positivo significa que la inversión crea valor por encima de la
    rentabilidad exigida.

    ## Reglas de decisión

    | VAN | Decisión |
    |---|---|
    | Positivo (VAN > 0) | Aceptar: crea valor por encima de la rentabilidad exigida |
    | Cero (VAN = 0) | Equilibrio: rinde exactamente lo exigido |
    | Negativo (VAN < 0) | Rechazar: destruye valor a esta tasa de descuento |

    ## Índice de rentabilidad (IR)

    IR = (VAN + inversión inicial) / inversión inicial

    El IR mide el valor creado por cada dólar invertido. IR > 1 = VAN positivo.
    Sirve para ordenar proyectos que compiten cuando el capital es limitado: a
    mayor IR, más valor por dólar invertido.

    | IR | Interpretación |
    |---|---|
    | > 1,5 | Rentabilidad excelente |
    | 1,1–1,5 | Buena rentabilidad |
    | 1,0–1,1 | Rentabilidad marginal |
    | < 1,0 | Destruye valor |

    ## Elegir la tasa de descuento adecuada

    La tasa de descuento es el dato más crítico: pequeños cambios tienen grandes
    efectos.

    **WACC de la empresa**: media ponderada del coste de la deuda (después de
    impuestos) y del coste del capital. Rango habitual: 8–12 % en empresas
    consolidadas.

    **Capital riesgo / startup**: tasas más altas (20–30 %) reflejan más riesgo.
    Una startup puede exigir un 25 % para compensar a los inversores por el riesgo
    de fracaso.

    **Tasa mínima exigida**: muchas empresas fijan una TIR mínima aceptable
    (15–20 %) para que los proyectos compitan por la asignación de capital.

    Si tienes dudas, calcula el VAN con varias tasas (análisis de sensibilidad).

    ## VAN frente a TIR

    La TIR (tasa interna de retorno) es la tasa de descuento con la que el VAN es
    cero. Ambos miden el valor de un proyecto; en general se prefiere el VAN
    porque:
    - El VAN está en dólares (más fácil de interpretar)
    - La TIR puede dar varios valores con flujos no convencionales
    - El VAN maneja bien tasas de descuento que cambian con el tiempo

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el VAN a partir de una inversión inicial y hasta 5 años de flujos de
    caja. Introduce tu tasa de descuento (coste de capital) y los flujos anuales
    previstos.
"payback-period-calculator":
  "body": |
    El periodo de recuperación es el tiempo que necesita una inversión para
    generar los flujos de caja suficientes para recuperar su coste inicial. Es una
    de las métricas de presupuesto de capital más usadas porque responde
    directamente a: «¿Cuándo recupero mi dinero?»

    ## Fórmula del periodo de recuperación simple

    **Periodo de recuperación (años) = inversión inicial / flujo neto anual**

    Con $200k de inversión y $80k de flujo neto anual: 200k / 80k = **2,5 años**.

    ## Periodo de recuperación descontado

    El periodo descontado tiene en cuenta el valor temporal del dinero
    descontando el flujo de cada año:

    **VA del flujo del año N = flujo anual / (1 + tasa de descuento) ^ N**

    El periodo descontado siempre es más largo que el simple. Con un 10 % de
    descuento, una inversión de $200k con $80k al año y recuperación simple de 2,5
    años pasa a unos 3,1 años descontada.

    ## Referencias

    | Periodo de recuperación | Valoración |
    |---|---|
    | < 6 meses | Excepcional: raro, sobre todo en software/SaaS |
    | 6–12 meses | Excelente: retorno rápido del capital |
    | 1–2 años | Bueno: estándar en inversiones de marketing |
    | 2–4 años | Aceptable: habitual en bienes de equipo |
    | > 4 años | Largo: exige flujos estables y previsibles |

    ## Limitaciones del periodo de recuperación

    El periodo de recuperación ignora los flujos posteriores al punto de
    equilibrio. Una inversión de $200k que se recupera en 2 años y luego genera
    $100k al año durante 8 años más es muy superior a otra que genera exactamente
    $80k al año, aunque ambas muestren el mismo periodo.

    **Usa el periodo de recuperación junto al ROI y al VAN para un análisis de
    inversión completo.**

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el periodo de recuperación simple y descontado a partir de la
    inversión inicial y los flujos netos anuales, además del ROI al final del
    periodo de análisis.
"roi-calculator":
  "body": |
    El ROI (retorno de la inversión) es la medida más universal de la eficiencia de
    una inversión. Expresa el beneficio como porcentaje del capital empleado para
    generarlo.

    ## La fórmula

    **ROI = (beneficio neto / coste de la inversión) × 100**

    Donde beneficio neto = ingresos − costes operativos

    Con $150k de ingresos, $50k de costes y $100k de inversión:
    - Beneficio neto = $100k
    - ROI = ($100k / $100k) × 100 = **100 %**

    ## ROI anualizado

    **ROI anualizado = ((1 + ROI/100) ^ (1/años) − 1) × 100**

    El ROI anualizado permite comparar horizontes distintos. Un ROI del 50 % en 2
    años equivale a ~22,5 % anual, no a un 25 %. La capitalización importa.

    ## ¿Qué es un buen ROI?

    Todo depende del contexto:
    - **Marketing**: un retorno de 5 a 1 ($5 de ingresos por cada $1 gastado) = 400 % de ROI, se considera bueno
    - **Inmobiliario**: un 8–12 % de ROI anualizado es lo habitual
    - **Media del S&P 500**: ~10 % anual, la referencia del capital pasivo
    - **Inversión SaaS**: apunta a más del 30 % anualizado en 3 años

    Cualquier ROI por debajo de tu coste de capital (normalmente 8–15 %) significa
    que la inversión destruye valor.

    ## El ROI frente a otras métricas

    | Métrica | Mide | Cuándo usarla |
    |---|---|---|
    | ROI | Rentabilidad total del capital | Comparar la eficiencia de inversiones |
    | ROAS | Ingresos por dólar publicitario | Específica de marketing |
    | Periodo de recuperación | Meses para recuperar la inversión | Planificación de caja |
    | VAN | Valor actual de los retornos futuros | Asignación de capital a largo plazo |

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el ROI, el ROI anualizado, el beneficio neto y el periodo de
    recuperación a partir de ingresos, costes e inversión inicial.
"rule-of-72-calculator":
  "body": |
    La regla del 72 es un atajo de cálculo mental para estimar cuánto tarda el
    interés compuesto en duplicar una inversión.

    ## Fórmula

    **Tiempo para duplicar (años) ≈ 72 ÷ tasa anual (%)**

    **Tasa necesaria ≈ 72 ÷ años objetivo**

    ## ¿Por qué 72?

    72 es divisible entre 1, 2, 3, 4, 6, 8, 9, 12 y 24, lo que facilita el cálculo
    mental. La fórmula exacta es **ln(2) ÷ ln(1 + r)**, pero 72/r acierta con un
    margen del 1–2 % para tasas entre el 2 % y el 20 %.

    ## Tiempo para duplicar según la tasa

    | Tasa anual | Tiempo para duplicar |
    |------------|--------------|
    | 2 % | 36 años |
    | 4 % | 18 años |
    | 6 % | 12 años |
    | 8 % | 9 años |
    | 10 % | 7,2 años |
    | 12 % | 6 años |
    | 24 % | 3 años |
    | 72 % | 1 año |

    ## La regla del 72 y la inflación

    La inflación también sigue la regla. Con un 3 % de inflación, el poder
    adquisitivo se reduce a la mitad en 24 años. Por eso ganar por encima de la
    inflación es esencial para conservar el patrimonio real.

    ## Aplicaciones al crecimiento exponencial

    La regla del 72 funciona con cualquier proceso exponencial:
    - Tasa de crecimiento del [ARR](/glossary/#arr) de una SaaS → años para duplicar ingresos
    - Crecimiento de la población → tiempo para duplicarse
    - Deuda a un tipo de interés dado → años para duplicar lo que debes
"wacc-calculator":
  "body": |
    El WACC (coste medio ponderado del capital) es la rentabilidad mínima que una
    empresa debe obtener de sus activos para satisfacer a quienes la financian,
    tanto accionistas como acreedores. Sirve como tasa mínima exigida en las
    decisiones de inversión y en las valoraciones por DCF.

    ## Fórmula del WACC

    **WACC = (E/V) × Rₑ + (D/V) × Rᵈ × (1 − Tᶜ)**

    Donde:
    - **E** = valor de mercado del capital (capitalización bursátil)
    - **D** = valor de mercado de la deuda
    - **V** = E + D (capital total)
    - **Rₑ** = coste del capital propio (%)
    - **Rᵈ** = coste de la deuda antes de impuestos (%)
    - **Tᶜ** = tipo del impuesto de sociedades (%)

    El coste del capital propio suele estimarse con el CAPM: tasa libre de riesgo +
    beta × prima de riesgo de mercado. La beta mide la volatilidad de una acción
    respecto al mercado: una beta de 1,5 significa que la acción suele moverse un
    50 % más que el mercado en ambos sentidos, y por eso los inversores exigen más
    rentabilidad para mantenerla.

    ## ¿Por qué importa el tipo impositivo?

    Los intereses de la deuda son deducibles, lo que crea un «escudo fiscal». El
    coste de la deuda después de impuestos es Rᵈ × (1 − Tᶜ). Una empresa con un 6 %
    de coste de la deuda y un 25 % de impuestos tiene un coste efectivo de la deuda
    del 4,5 %.

    ## Referencias de WACC

    | Sector | WACC habitual |
    |----------|-------------|
    | SaaS / software | 8–14 % |
    | Bienes de consumo | 6–10 % |
    | Eléctricas y servicios públicos | 4–8 % |
    | Biotecnología | 12–20 % |

    ## El WACC en la práctica

    - **Valoración por DCF**: el WACC es la tasa de descuento aplicada a los flujos de caja libres futuros
    - **Presupuesto de capital**: aceptar solo proyectos con TIR superior al WACC
    - **Estructura de capital**: optimizar la combinación de deuda y capital para minimizar el WACC
    - **Medición del rendimiento**: un ROIC superior al WACC significa que la empresa crea valor económico

"dcf-calculator":
  "body": |
    Un modelo DCF (descuento de flujos de caja) valora un negocio o una inversión
    sumando el valor actual de todos los flujos de caja futuros esperados. Es el
    método de valoración fundamental de las finanzas corporativas.

    ## La fórmula del DCF

    **Valor empresarial = Σ (FCF_t / (1 + r)^t) + valor terminal / (1 + r)^n**

    Donde FCF_t = flujo de caja libre del año t, r = tasa de descuento (WACC), n = años de previsión.

    **Valor terminal (modelo de Gordon, que supone que los flujos crecen a un ritmo constante para siempre) = FCF_n × (1 + g) / (r − g)**

    Donde g = tasa de crecimiento terminal (debe ser < r).

    ## Referencias de tasa de descuento

    | Tipo de empresa | Tasa de descuento habitual |
    |-------------|----------------------|
    | Gran empresa cotizada | 8–10 % |
    | Mediana empresa cotizada | 10–14 % |
    | No cotizada en crecimiento | 15–25 % |
    | Startup en fase inicial | 25–40 % |
    | Seed / sin ingresos | 40–60 % |

    ## La importancia del valor terminal

    En un DCF a 10 años, el valor terminal suele suponer el 70–90 % del valor
    empresarial total. Eso convierte la hipótesis de crecimiento terminal en la
    variable más sensible: pequeños cambios en g producen grandes cambios de valor.
    Haz siempre un análisis de sensibilidad.

    ## Limitaciones del DCF

    Un DCF vale lo que valgan tus previsiones de flujos. Es más fiable en:
    - Negocios estables y maduros con flujos previsibles
    - Negocios que puedes proyectar a 5–10 años con una confianza razonable

    Es menos fiable en empresas sin ingresos, negocios muy cíclicos y empresas en
    las que domina el valor intangible.
"ebitda-multiple-calculator":
  "body": |
    ## ¿Qué es el múltiplo de EBITDA?

    El múltiplo EV/EBITDA (o múltiplo de EBITDA) es la métrica de valoración más habitual en fusiones y adquisiciones y en private equity. Expresa el valor empresarial como múltiplo del EBITDA (beneficio antes de intereses, impuestos, depreciaciones y amortizaciones).

    $$\text{Valor empresarial} = \text{EBITDA} \times \text{Múltiplo EV/EBITDA}$$

    ### Referencias de múltiplos de EBITDA por sector (2024)

    | Sector | EV/EBITDA habitual |
    |--------|-------------------|
    | SaaS / tecnología de alto crecimiento | 15–30× |
    | Software B2B (maduro) | 8–15× |
    | Industria | 5–8× |
    | Comercio minorista | 4–7× |
    | Servicios / consultoría | 4–7× |
    | Distribución | 5–8× |

    ### Valor empresarial frente a valor del capital

    El valor empresarial incluye a los acreedores. El valor del capital es lo que reciben realmente los accionistas:

    $$\text{Valor del capital} = \text{EV} - \text{Deuda total} + \text{Caja}$$

    ### Múltiplos de EBITDA frente a múltiplos de ingresos

    Los múltiplos de ingresos (EV/ingresos) se usan cuando el EBITDA es negativo o casi nulo, algo habitual en SaaS de alto crecimiento. Compara ambos para acotar tu rango de valoración.

    ### Guías

    - [¿Qué es el múltiplo EV/EBITDA?](/tools/ebitda-multiple-calculator/#what-is-ev-ebitda)
    - [Múltiplo de EBITDA por sector](/tools/ebitda-multiple-calculator/#ebitda-multiple-by-industry)
"enterprise-value-calculator":
  "body": |
    ## Fórmula del valor empresarial

    $$\text{EV} = \text{Capitalización bursátil} + \text{Deuda total} - \text{Caja}$$

    El valor empresarial es el precio teórico de adquisición: lo que pagaría un comprador por hacerse con todo el negocio, asumiendo su deuda y quedándose con su caja.

    ### ¿Por qué el EV y no la capitalización?

    La capitalización solo refleja el valor del capital. El EV tiene en cuenta la estructura de capital:

    - **Empresa A**: $1.000M de capitalización, $500M de deuda, $100M de caja → EV = $1.400M
    - **Empresa B**: $1.000M de capitalización, $0 de deuda, $100M de caja → EV = $900M

    Comprar la empresa A cuesta en realidad un 56 % más, aunque ambas tengan la misma capitalización. El EV lo corrige.

    ### Referencias de EV/EBITDA

    | EV/EBITDA | Contexto |
    |-----------|---------|
    | < 5× | Valor / en dificultades |
    | 6–10× | Sectores tradicionales |
    | 10–15× | Crecimiento en mid-market |
    | 15–25× | Negocios de alto crecimiento |
    | 25×+ | SaaS premium / hipercrecimiento |

    ### Referencias de EV/ingresos

    | EV/ingresos | Contexto |
    |------------|---------|
    | < 1× | Valor profundo / en declive |
    | 1–3× | Negocios tradicionales |
    | 3–10× | Negocios en crecimiento |
    | 10×+ | SaaS de alto crecimiento |

    ### Guías

    - [¿Qué es el valor empresarial?](/tools/enterprise-value-calculator/#what-is-enterprise-value)
    - [Múltiplo EV/EBITDA: qué significa y referencias por sector](/tools/enterprise-value-calculator/#ev-ebitda-multiple-benchmarks)
"equity-dilution-calculator":
  "body": |
    La dilución se produce cada vez que una empresa emite nuevas acciones. Cuando
    los inversores reciben acciones nuevas a cambio de su inversión, el número
    total de acciones aumenta y cada accionista existente tiene un porcentaje menor,
    aunque su número de acciones no cambie.

    ## Las cuentas

    **Valoración pre-money**: $5.000.000
    **Inversión**: $1.000.000
    **Valoración post-money**: $6.000.000
    **Participación del inversor**: $1M / $6M = **16,7 %**

    Si tenías el 60 % antes de la ronda (6M de 10M de acciones), ahora tienes:
    6M / (10M + 2M acciones nuevas) = **50 %**

    Tu participación bajó del 60 % al 50 %: una **dilución de 10 puntos**.

    ## Valoración pre-money y post-money

    Estos términos generan mucha confusión en las negociaciones de financiación:

    **Pre-money**: el valor de la empresa antes de la inversión.
    **Post-money**: pre-money + importe invertido.

    Cuando un inversor dice «invierto $1M con una valoración de $5M», aclara: ¿$5M
    pre-money o post-money? La diferencia es importante:
    - $5M pre-money: el inversor obtiene 1M / 6M = **16,7 %**
    - $5M post-money: el inversor obtiene 1M / 5M = **20 %**

    Especifica siempre la valoración pre-money en la term sheet.

    ## Dilución acumulada entre rondas

    La dilución se acumula. Dilución habitual por fase:

    | Ronda | Dilución | Participación acumulada de los fundadores |
    |---|---|---|
    | Pre-seed ($500k) | 10–15 % | 85–90 % |
    | Seed ($1–2M) | 15–25 % | 65–75 % |
    | Serie A ($5–10M) | 20–30 % | 45–55 % |
    | Serie B ($20–40M) | 15–25 % | 35–45 % |

    En cada ronda la dilución se aplica sobre la [tabla de capitalización](/glossary/#cap-table)
    posterior a la ronda, no sobre la original. Un fundador con el 85 % tras el
    seed que levanta una serie A con un 20 % de dilución conserva 85 % × 80 % =
    **68 %**.

    ## El «option pool shuffle»

    Los inversores suelen exigir crear o ampliar un pool de opciones antes de
    cerrar la ronda, lo que aumenta la dilución de los fundadores. Un «pool de
    opciones del 20 % post-money» en una ronda de $6M significa crear acciones
    equivalentes al 20 % de la tabla posterior a la ronda. Diluye a los fundadores
    antes que a los inversores y aumenta la dilución efectiva pre-money.

    Modélalo sumando las acciones del pool a las «acciones en circulación» antes de
    usar la calculadora.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Modela la dilución de fundadores e inversores en una ronda de financiación:
    valoración post-money, acciones nuevas emitidas y tu porcentaje de
    participación tras la ronda.
"pe-ratio-calculator":
  "body": |
    ## Fórmula del PER

    $$\text{PER} = \frac{\text{Precio de la acción}}{\text{BPA}}$$

    ### PER histórico y PER estimado

    - **PER histórico**: usa los beneficios reales de los últimos 12 meses. Más fiable, pero mira al pasado.
    - **PER estimado**: usa las estimaciones de los analistas para los próximos 12 meses. Más relevante en empresas en crecimiento: muestra lo que el mercado descuenta para el futuro.

    Si el PER estimado es menor que el histórico, el mercado espera que los beneficios crezcan. Si es mayor, espera que bajen.

    ### Rentabilidad por beneficio

    $$\text{Rentabilidad por beneficio} = \frac{1}{\text{PER}} \times 100$$

    La rentabilidad por beneficio es la inversa del PER: convierte la valoración en una métrica de rentabilidad comparable a la de los bonos. Un PER de 20× = 5 % de rentabilidad por beneficio. Compárala con la rentabilidad del bono a 10 años para valorar su atractivo relativo.

    ### Ratio PEG (PER respecto al crecimiento)

    $$\text{PEG} = \frac{\text{PER}}{\text{Crecimiento esperado del BPA (\%)}}$$

    Peter Lynch popularizó el PEG como métrica de valoración ajustada al crecimiento. PEG = 1 significa que el PER iguala la tasa de crecimiento: valoración «justa». Un PEG < 1 sugiere una posible infravaloración; un PEG > 2 indica que el precio descuenta expectativas de crecimiento muy altas.

    ### Contexto histórico del PER del S&P 500

    - Media a largo plazo: ~15–17×
    - Media desde 2010 (era de tipos bajos): ~20–25×
    - En recesiones: suele caer a 10–12×
    - Picos de burbuja: 30–40× o más

    ### Guías

    - [¿Qué es el PER y cómo se usa?](/tools/pe-ratio-calculator/#what-is-pe-ratio)
    - [PEG o PER: ¿cuál es mejor para valorar?](/tools/pe-ratio-calculator/#peg-ratio-vs-pe-ratio)
"price-to-sales-calculator":
  "body": |
    El ratio precio/ventas (P/S) es una de las métricas de valoración más usadas en
    empresas de software y SaaS de alto crecimiento, cuyos beneficios todavía no
    son una guía fiable de su valor.

    **Ratio P/S** = capitalización bursátil ÷ ingresos anuales

    O, de forma equivalente: **EV/ingresos** = valor empresarial ÷ ingresos anuales

    En empresas no cotizadas, el numerador es la valoración post-money de la última
    ronda de financiación.

    ## Referencias de P/S por fase (2024)

    | Fase de la empresa | Rango de P/S habitual | Notas |
    |---|---|---|
    | SaaS en fase inicial (crecimiento del 50 % o más) | 8–20x el ARR | Del seed a la serie A |
    | SaaS en crecimiento (30–50 %) | 5–12x el ARR | Series B a C |
    | SaaS en fase avanzada (20–30 %) | 3–8x el ARR | Pre-IPO |
    | SaaS cotizada (10–20 %) | 2–6x los ingresos | Mediana ~4x en 2024 |
    | Software maduro o en declive | 0,5–2x los ingresos | Rango de compras de private equity |

    Tras la compresión de múltiplos de 2021–2022, los P/S de las SaaS cotizadas
    cayeron de 20–30x a 4–8x con la subida de tipos. La mediana actual (2024) de
    las SaaS cotizadas es de unas 4–6 veces los ingresos previstos.

    ## La conexión con la regla del 40

    Los múltiplos de P/S altos se justifican cuando la puntuación de la [regla del 40](/glossary/#rule-of-40)
    es sólida. Una empresa que crece un 50 % con un margen FCF del −5 % (regla del
    40 = 45 %) cotiza con múltiplos más altos que otra que crece un 20 % con un −15 %
    de margen (regla del 40 = 5 %).

    **P/S ajustado al crecimiento** = P/S ÷ tasa de crecimiento

    Un P/S de 10x con un 50 % de crecimiento da un P/S ajustado de 0,2x, que a
    menudo se considera valor justo. Por encima de 0,3x puede estar exigente; por
    debajo de 0,15x puede ser una oportunidad.

    ## EV/ingresos frente a P/S

    En empresas con deuda o mucha caja, el valor empresarial / ingresos es más
    preciso que el P/S:

    **EV** = capitalización + deuda total − caja y equivalentes

    La mayoría de startups en fase inicial tienen poca deuda y una caja que se va
    consumiendo, así que EV ≈ capitalización. En empresas con mucha caja o con
    deuda venture, el ajuste importa.

    ## Preguntas frecuentes

    **¿Qué P/S debería buscar para valorar mi startup?**
    En serie A, 8–15x el ARR es habitual en SaaS que crecen más del 80 %. En serie
    B, 10–20x el ARR en empresas con un NRR fuerte (120 % o más) y más del 50 % de
    crecimiento. Estas cifras bajan mucho cuando se frena el crecimiento: una
    empresa que crece al 30 % suele obtener 4–8x.

    **¿Cómo uso el P/S para compararme con la competencia?**
    Busca 5–10 comparables cotizadas con tasas de crecimiento y modelos parecidos.
    Toma el P/S mediano. Aplícalo a tu ARR para obtener un rango de valoración
    aproximado. Descuenta un 20–30 % por iliquidez si eres una empresa no cotizada.
    Es el método más usado por los inversores de capital riesgo en valoraciones de
    serie B en adelante.
"tam-sam-som-calculator":
  "body": |
    TAM, SAM y SOM definen tu oportunidad de mercado en tres niveles de
    precisión. Toda presentación para inversores necesita estas cifras, y cómo las
    defines muestra si entiendes tu mercado.

    ## Los tres niveles

    **TAM (mercado total direccionable)**: la oportunidad total de ingresos a
    nivel mundial si capturaras el 100 % del mercado. Es un techo, no un objetivo
    realista.

    **SAM (mercado direccionable servible)**: la parte del TAM que puedes atender
    de verdad con las capacidades actuales del producto, tu alcance geográfico y
    tu estrategia comercial.

    **SOM (mercado obtenible)**: la parte del SAM que puedes captar de forma
    realista en 3–5 años, teniendo en cuenta la competencia y la escala de tu
    estrategia comercial.

    ## Dimensionamiento descendente o ascendente

    **Descendente (top-down)**: los informes del sector estiman el tamaño total
    del mercado y tú identificas tu porcentaje. Rápido, pero impreciso. «El
    mercado de CRM es de $50.000M y apuntamos al 1 %.»

    **Ascendente (bottom-up)**: cuenta clientes reales y multiplícalos por el
    [ACV](/glossary/#acv). Más creíble. «En EE. UU. hay 500.000 empresas medianas,
    el 30 % tiene este problema, podemos llegar al 15 % de ellas con nuestro GTM
    (estrategia comercial) actual, a $15k de ACV = $337M de SAM.»

    Los inversores prefieren el enfoque ascendente porque demuestra que conoces el
    universo real de clientes.

    ## Expectativas de los inversores por fase

    | Fase | TAM mínimo | Notas |
    |---|---|---|
    | Seed | $500M | Los VC necesitan margen para una salida de más de $50M |
    | Serie A | $1.000M o más | Las cuentas del fondo exigen un gran mercado potencial |
    | Serie B en adelante | $5.000M o más | Para justificar el crecimiento a escala y el relato de salida a bolsa |

    Un TAM por debajo de $500M no descalifica automáticamente: los negocios de
    servicios y el SaaS vertical pueden construir negocios muy rentables de
    $50–100M de ingresos en mercados más pequeños. Pero el hipercrecimiento
    financiado por VC exige mercados enormes.

    ## Errores habituales al dimensionar el mercado

    **Inflar el TAM**: «El mercado mundial de software empresarial es de
    $500.000M, hacemos software, así que nuestro TAM es de $500.000M.» Error. El
    TAM debe ser el mercado de tu categoría de producto concreta.

    **Confundir TAM y SAM**: «Nuestro SAM es todo el mercado de EE. UU.» El SAM
    debe filtrar a quién puedes vender hoy, tu [ICP](/glossary/#icp), no todo el
    país.

    **SOM poco realista**: «Captaremos el 10 % del mercado el año 3.» Sin las
    cuentas comerciales (plantilla, canales, CAC), no es creíble.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula el TAM (clientes totales × gasto), el SAM (filtrado según tu alcance)
    y el SOM (tu cuota alcanzable) para dimensionar el mercado en presentaciones
    para inversores.

"ad-roas-calculator":
  "body": |
    El ROAS (retorno de la inversión publicitaria) es la medida más directa de la
    rentabilidad de una campaña. Responde a: por cada dólar invertido en anuncios,
    ¿cuántos ingresos generaste?

    **ROAS = ingresos de los anuncios ÷ inversión publicitaria**

    Un ROAS de 4× significa que generaste $4 de ingresos por cada $1 invertido.
    Pero que ese 4× sea rentable depende por completo de tu margen bruto.

    ## Por qué el ROAS por sí solo no dice si los anuncios son rentables

    Un ROAS de 4× con un producto de margen del 30 % significa que gastaste $1 para
    generar $4 de ingresos, pero solo $1,20 de beneficio bruto: te quedan apenas
    $0,20 por dólar invertido, antes de gastos generales. El mismo ROAS de 4× en un
    SaaS con un 80 % de margen da $3,20 de beneficio bruto por cada $1 invertido.

    **ROAS de equilibrio = 1 ÷ % de margen bruto**

    | Margen bruto | ROAS de equilibrio |
    |---|---|
    | 20 % | 5,0× |
    | 30 % | 3,33× |
    | 40 % | 2,5× |
    | 50 % | 2,0× |
    | 70 % | 1,43× |
    | 80 % | 1,25× |

    ## ROAS objetivo para un margen de beneficio concreto

    Si quieres un margen de beneficio del 20 % (beneficio / ingresos), usa esta
    fórmula:

    **ROAS objetivo = 1 ÷ (% de margen bruto − % de margen de beneficio objetivo)**

    Ejemplo: 50 % de margen bruto y 20 % de margen objetivo → 1 ÷ 0,30 = **ROAS objetivo de 3,33×**

    ## ROAS frente a ROI: ¿en qué se diferencian?

    El ROAS es un múltiplo de ingresos. El ROI es un múltiplo de beneficio.

    **ROI = (ingresos − coste de ventas − inversión publicitaria) ÷ inversión publicitaria × 100**

    Un ROAS de 4× con un 50 % de margen = $2 de beneficio bruto por $1 invertido = 100 % de ROI.
    Un ROAS de 2× con un 50 % de margen = $1 de beneficio bruto por $1 invertido = 0 % de ROI (equilibrio).

    El ROAS es más fácil de calcular en tiempo real (no necesita el coste de ventas
    por canal). Úsalo para comparar canales y definir la estrategia de pujas. Usa
    el ROI para la evaluación final de rentabilidad.

    ## Referencias por canal publicitario

    | Canal | ROAS habitual | Notas |
    |---|---|---|
    | Google Search (marca) | 5–20× | Alta intención, bajo coste competitivo |
    | Google Shopping | 3–8× | Varía según el margen del producto |
    | Meta / Facebook | 2–5× | Depende mucho de la creatividad y la audiencia |
    | TikTok Ads | 1,5–4× | Canal en crecimiento, CPM aún bajos |
    | Display programático | 1–3× | Menor intención; bueno para retargeting |

    ## Preguntas frecuentes

    **¿Qué es un buen ROAS?**
    Depende por completo de tu margen bruto. Un ROAS de 4× es excelente para un
    SaaS con un 60 % de margen, pero terrible para un dropshipping con un 15 %.
    Calcula primero tu ROAS de equilibrio: todo lo que lo supere es rentable.

    **¿Cómo mejoro el ROAS?**
    Tres palancas: (1) mejores creatividades y textos para mejorar el CTR y la
    conversión, (2) una segmentación más precisa para llegar a compradores con alta
    intención, (3) pujar por palabras clave de más intención y excluir ubicaciones
    que convierten poco. Subir precios también mejora el ROAS sin cambiar la
    eficiencia publicitaria.

    **¿Qué ROAS debo fijar en Google Ads?**
    Google recomienda fijar el ROAS objetivo en 3–5 veces tu equilibrio como punto
    de partida y dejar que Smart Bidding optimice. En campañas nuevas sin datos de
    conversión, empieza con CPC manual y reúne 30–50 conversiones antes de pasar a
    la puja por ROAS objetivo.
"aov-calculator":
  "body": |
    ## ¿Qué es el ticket medio (AOV)?

    El ticket medio es el ingreso medio por transacción en un periodo dado.

    $$\text{Ticket medio} = \frac{\text{Ingresos totales}}{\text{Número de pedidos}}$$

    ### Por qué el ticket medio es la palanca de crecimiento con mayor retorno

    Subir el ticket medio aumenta los ingresos sin aumentar el coste de adquisición de clientes (CAC) ni el tráfico. Una mejora del 10 % en el ticket medio aporta un 10 % más de ingresos en cada interacción con clientes existentes.

    ### Referencias de ticket medio por sector

    | Sector | Ticket medio habitual |
    |--------|------------|
    | Lujo / moda | $150–400 |
    | E-commerce general | $50–150 |
    | Alimentación / gran consumo | $40–80 |
    | SaaS (por transacción) | $200–500 |
    | Productos digitales | $15–50 |

    ### Ingresos por visitante

    $$\text{Ingresos por visitante} = \frac{\text{Ingresos totales}}{\text{Visitantes mensuales}}$$

    Los ingresos por visitante combinan la tasa de conversión y el ticket medio en una sola métrica. Mejorar cualquiera de los dos los mejora.

    ### Tácticas para subir el ticket medio

    - **Upselling**: ofrecer una versión superior en el checkout
    - **Venta cruzada**: recomendaciones de «comprados juntos habitualmente»
    - **Umbrales de envío gratis**: «Añade $15 más para el envío gratis» empuja los pedidos por encima de un mínimo
    - **Packs**: combinar productos con un ligero descuento; el cliente gasta más y percibe valor
    - **Descuentos por volumen**: precio unitario más bajo para cantidades mayores

    ### Guías

    - [¿Qué es el ticket medio?](/tools/aov-calculator/#what-is-average-order-value)
    - [Cómo aumentar el ticket medio](/tools/aov-calculator/#how-to-increase-average-order-value)
"conversion-rate-calculator":
  "body": |
    La tasa de conversión es el porcentaje de visitantes que completan una acción
    deseada: registro, compra, inicio de prueba o envío de un formulario. Es una
    de las métricas con más apalancamiento de cualquier embudo de crecimiento,
    porque mejorarla aumenta los ingresos sin necesitar más tráfico.

    **Tasa de conversión = (conversiones ÷ visitantes) × 100**

    ## La fórmula del impacto en ingresos

    **Ingresos mensuales = visitantes × tasa de conversión × ingresos por conversión**

    Con 10.000 visitantes, un 1,5 % de conversión y un ARPU de $99: 10.000 × 0,015 × $99 = **$14.850 al mes**

    Subir la conversión del 1,5 % al 2,5 % (un 67 % más en relativo) con el mismo tráfico:
    10.000 × 0,025 × $99 = **$24.750 al mes**, **$9.900 más al mes**.

    ## Por qué la CRO suele ser más eficiente que la adquisición

    Duplicar el tráfico cuesta más o menos el doble de tu presupuesto de
    marketing. Duplicar la tasa de conversión cuesta lo que valgan los
    experimentos (investigación de usuarios, tests A/B, rediseños de landing
    pages), a menudo 10 veces menos por dólar de ingresos ganado.

    Las cuentas solo fallan cuando el tráfico es demasiado bajo para hacer tests
    A/B estadísticamente significativos. Por debajo de ~1.000 visitantes al mes por
    variante, la CRO (optimización de la tasa de conversión) es adivinar. Por
    encima de 5.000 al mes, se vuelve muy fiable.

    ## Referencias de tasa de conversión

    | Fase del embudo | Media | Cuartil superior |
    |---|---|---|
    | Inicio → página de precios | 10–20 % | 30 %+ |
    | Página de precios → prueba | 1–5 % | 8–15 % |
    | Prueba → pago (SaaS B2B) | 15–25 % | 35 %+ |
    | Adquisición de pago (en frío) | 0,5–2 % | 3–5 % |
    | CTA de email → compra | 2–8 % | 10–20 % |

    ## Los cinco cambios de CRO con más impacto

    1. **Titular claro**: tu propuesta de valor en 10 palabras, no en 30. Los usuarios leen primero el H1.
    2. **Prueba social en la parte visible**: logos, testimonios concretos, valoraciones en G2/Capterra
    3. **Menos fricción en la llamada a la acción**: un clic para la prueba, sin tarjeta, divulgación progresiva
    4. **Anclaje en la página de precios**: tres planes con el del medio destacado como «recomendado»
    5. **Intención de salida y retargeting**: recuperar a los visitantes que se van sin convertir

    ## Preguntas frecuentes

    **¿Qué es una buena tasa de conversión?**
    Depende por completo de la fase del embudo y de la fuente de tráfico. Que el
    tráfico de pago en frío convierta al 0,5–1 % es normal. Que la búsqueda de
    marca convierta al 5–15 % es lo esperado. Céntrate en mejorar respecto a tu
    propia base más que respecto a las medias del sector.

    **¿Cómo hago un test A/B de mi tasa de conversión?**
    Usa una calculadora de tamaño de muestra antes de empezar: necesitas unas
    1.000 conversiones por variante para detectar con fiabilidad una mejora del
    10 %. Mantén los tests al menos 2 semanas completas para controlar el efecto
    del día de la semana.
"email-list-growth-calculator":
  "body": |
    El crecimiento de la lista de email es uno de los activos más valiosos que
    puede construir un negocio autofinanciado. A diferencia de los seguidores en
    redes sociales o las audiencias de pago, tu lista de email es un activo tuyo.
    Pero una lista que no crece se deteriora: aunque no entre ningún suscriptor
    nuevo, las bajas y la inactividad la reducen cada mes.

    ## La fórmula de crecimiento

    **Crecimiento neto mensual = suscriptores nuevos − (tamaño de la lista × tasa de bajas mensual)**

    Con 10.000 suscriptores y un 3 % de bajas mensuales, pierdes 300 suscriptores
    al mes de tu base actual. Para crecer necesitas más de 300 suscriptores nuevos
    al mes.

    ## El deterioro de la lista se acumula

    Con un 3 % de bajas mensuales, una lista sin suscriptores nuevos pierde un 31 %
    de su tamaño al año. Con un 5 %, pierde un 46 %. Por eso los profesionales del
    email se obsesionan con las campañas de reactivación y las políticas de
    limpieza: los suscriptores inactivos inflan el tamaño de la lista y dañan la
    entregabilidad.

    ## Referencias del sector

    | Métrica | Buena | Media | Mala |
    |--------|------|---------|------|
    | Bajas mensuales | < 1,5 % | 2–3 % | > 4 % |
    | Tasa de apertura | > 30 % | 20–25 % | < 15 % |
    | Crecimiento de la lista | > 5 %/mes | 2–4 %/mes | < 1 %/mes |

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula la tasa de crecimiento de la lista de email, el crecimiento neto mensual y el tiempo para alcanzar el tamaño de lista objetivo.
"email-roi-calculator":
  "body": |
    El email marketing ofrece de forma constante el ROI más alto de todos los
    canales digitales. La DMA (Data & Marketing Association) informa de un retorno
    medio de **$36–42 por cada $1 invertido**, pero esa media esconde una
    variación enorme. La diferencia entre un programa de email excelente y uno
    mediocre está casi por completo en la tasa de apertura, la tasa de clics y la
    calidad de la lista.

    ## El embudo de ingresos del email

    **Aperturas** = tamaño de la lista × tasa de apertura
    **Clics** = aperturas × tasa de clics
    **Conversiones** = clics × tasa de conversión
    **Ingresos** = conversiones × ticket medio

    ## Tasas de referencia del sector

    | Métrica | SaaS B2B | E-commerce | Newsletter |
    |--------|----------|-----------|-----------|
    | Tasa de apertura | 20–30 % | 15–25 % | 30–50 % |
    | Tasa de clics (sobre aperturas) | 5–12 % | 8–15 % | 4–8 % |
    | Tasa de conversión (sobre clics) | 3–8 % | 2–5 % | 1–3 % |

    ## Por qué importa más la calidad que el tamaño de la lista

    Una lista de 1.000 suscriptores con un 35 % de apertura supera a una de 10.000
    con un 8 % tanto en ingresos como en entregabilidad. Segmenta tu lista por
    interacción: excluye a los suscriptores inactivos (sin aperturas en 90 días)
    para mejorar la entregabilidad y las tasas de apertura en toda la lista.

    ## Tipos de campaña que conviene modelar

    - **Lanzamiento de producto / promoción**: campaña puntual a toda la lista o a un segmento
    - **Secuencia de bienvenida**: secuencia automática que se activa con el registro, normalmente la de mayor ROI
    - **Campañas de reactivación**: recuperar suscriptores inactivos; suelen reactivar al 5–15 %
    - **Newsletter**: basada en contenido; menos conversión directa, pero acumula confianza de la audiencia

    ## Preguntas frecuentes

    **¿Cómo mejoro las tasas de apertura?**
    Probar asuntos (test A/B con el 20 % de la lista antes del envío completo),
    optimizar la hora de envío (normalmente de martes a jueves entre las 10:00 y las
    14:00 en la zona horaria del destinatario) y mantener limpia la lista (quitar a
    los suscriptores sin interacción) son las tres palancas con más impacto.

    **¿Qué tasa de conversión puedo esperar?**
    Depende mucho de la oferta. Un buen email promocional a una lista caliente para
    un producto de $49 puede convertir el 5–10 % de los clics. Un email de
    prospección para un contrato de $10k puede convertir el 1–2 % de los clics, pero
    generar muchos ingresos por conversión.
"revenue-per-lead-calculator":
  "body": |
    Los ingresos por lead (RPL) son la métrica más útil para comparar la
    rentabilidad de los canales de marketing. A diferencia del CTR (tasa de clics)
    o del coste por lead por sí solos, el RPL tiene en cuenta la calidad del lead:
    un canal que genera leads baratos puede tener un RPL pésimo si esos leads no
    cierran o compran poco.

    ## La fórmula

    **Ingresos por lead = ingresos totales / leads totales**

    Con $480k de ingresos y 1.200 leads: RPL = $480k / 1.200 = **$400 por lead**

    ## Por qué el RPL supera al coste por lead

    El coste por lead (CPL) mide la eficiencia de la captación. Pero un CPL de $10
    no vale nada si esos leads nunca cierran. El RPL mide la eficacia de la
    captación: los ingresos reales generados por lead, cueste lo que cueste.

    Compara canales:

    | Canal | Leads | Ingresos | RPL | Inversión | CPL | ROI |
    |---|---|---|---|---|---|---|
    | Google Ads | 500 | $200k | $400 | $25k | $50 | 8× |
    | LinkedIn Ads | 100 | $80k | $800 | $20k | $200 | 4× |
    | Orgánico | 600 | $200k | $333 | $15k | $25 | 13× |

    Google Ads tiene un RPL más alto que el orgánico ($400 frente a $333). LinkedIn
    tiene un RPL aún más alto (leads de más calidad), pero también un CPL mayor. El
    orgánico tiene el mejor ROI pero el RPL más bajo.

    **Conclusión**: escala primero el orgánico (mejor ROI). Después Google Ads (buen
    ROI, escalable). LinkedIn es caro pero genera leads de alto valor: mantén un
    presupuesto pequeño para grandes cuentas.

    ## RPL frente a CAC

    El RPL es una métrica del embudo de marketing; el CAC (coste de adquisición de
    clientes), del embudo de ventas. La relación:
    - RPL ÷ tasa de conversión de lead a cliente = ingresos por cliente (ACV)
    - CPL / tasa de conversión de lead a cliente = CAC

    Si el RPL es de $400 y la conversión de lead a cliente es del 5 %, el ACV
    implícito es de $8.000. Si el CPL es de $50 con la misma conversión del 5 %, tu
    CAC es de $1.000.

    ## Cruzar cohortes en ciclos de venta largos

    En B2B con ciclos de 60–90 días, usar el mismo periodo para leads e ingresos
    crea un desajuste. Es mejor:
    - Medir los leads captados en el T1
    - Medir los ingresos cerrados en T2–T3 procedentes de esos leads
    - Calcular el RPL con 6 meses de desfase

    Así la atribución de las ventas de ciclo largo es precisa.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula los ingresos por lead y el coste por lead de cada canal, compara el ROI de los canales y te dice cuántos leads necesitas para alcanzar un objetivo de ingresos.
"sales-funnel-calculator":
  "body": |
    ## ¿Qué es una calculadora de embudo de ventas?

    Una calculadora de embudo de ventas modela el avance de los prospectos por cada fase del pipeline, desde el lead en bruto hasta el cliente cerrado, para proyectar ingresos e identificar la fase más débil.

    ### Fases habituales de un embudo B2B

    | Fase | Tasa de conversión habitual |
    |-------|------------------------|
    | Lead → MQL | 20–40 % |
    | MQL → SQL | 30–50 % |
    | SQL → oportunidad | 40–60 % |
    | Oportunidad → cierre | 20–30 % |
    | **Total lead → cliente** | **1–5 %** |

    ### Conversión total del embudo

    $$\text{Conversión total} = \frac{\text{Clientes nuevos}}{\text{Leads}} \times 100$$

    Una conversión total del 1–3 % es lo habitual en SaaS B2B. Por encima del 5 % es excelente y suele indicar una marca o un inbound fuertes.

    ### Encontrar tu cuello de botella

    La fase con la tasa de conversión más baja respecto a la referencia es tu restricción. Duplicar el volumen de leads con una fase MQL→SQL rota produce el mismo número de clientes, solo con el doble de desperdicio.

    ### Ingresos del embudo

    $$\text{Ingresos mensuales} = \text{Clientes nuevos} \times \text{ACV}$$

    Modela varios escenarios: optimista (mejorar una fase un 10 %), base y pesimista (los leads caen un 20 %) para poner a prueba tu pipeline.

    ### Guías

    - [¿Qué es un embudo de ventas?](/tools/sales-funnel-calculator/#what-is-a-sales-funnel)
    - [MQL o SQL: ¿en qué se diferencian?](/tools/sales-funnel-calculator/#mql-vs-sql-difference)
"sales-quota-calculator":
  "body": |
    Crear un plan de ventas empieza por calcular hacia atrás desde el objetivo de
    ingresos. Con un objetivo anual, un valor medio de contrato (ACV) y una tasa de
    cierre, esta calculadora muestra exactamente cuántas ventas, leads y pipeline
    necesitas generar, por mes y por año.

    ## Las cuentas del embudo inverso

    **Ventas necesarias** = objetivo de ingresos anual ÷ ACV

    **Leads necesarios** = ventas necesarias ÷ tasa de cierre

    **Pipeline necesario** = leads necesarios × ACV (valor total de pipeline que tiene que entrar)

    Si tu objetivo anual es de $1M, el ACV de $12k y la tasa de cierre del 20 %:
    - 83 ventas necesarias
    - 417 leads cualificados necesarios
    - ~7 ventas al mes, 35 leads al mes

    ## Lo que dice sobre la contratación

    Un SDR (representante de desarrollo de ventas) genera normalmente 40–80 leads
    cualificados al mes según el segmento y la calidad de la prospección. Si tus
    cuentas exigen más de 200 leads al mes, necesitas 3–5 SDR o un motor inbound
    maduro. Usa estas cifras para modelar la plantilla antes de comprometerte con
    un plan de ingresos.

    ## Mejorar los datos de partida

    Los cambios con más impacto en tus cuentas de cuota:
    - **Tasa de cierre**: 5 puntos más (del 20 % al 25 %) reducen un 20 % los leads necesarios
    - **ACV**: duplicar el ACV reduce a la mitad las ventas necesarias
    - **Ciclo de ventas**: ciclos más cortos dan más vueltas de pipeline al año y mejor eficiencia del capital

    ## Preguntas frecuentes

    **¿Qué tasa de cierre uso?**
    Mide la tasa de cierre desde el lead cualificado (llamada de descubrimiento
    agendada) hasta la venta cerrada. Medias en SaaS B2B: 15–25 % en pymes, 20–30 %
    en mid-market y 30–40 % en enterprise (embudo más largo, leads más
    cualificados). Si aún no conoces tu tasa de cierre, empieza con un 20 %.

    **¿Cómo afecta el ciclo de ventas al pipeline?**
    Un ciclo de 30 días hace girar el pipeline ~12 veces al año; uno de 90 días, 4
    veces. Los ciclos más cortos dan más datos, iteraciones más rápidas y menos
    necesidad de caja para el mismo objetivo de ingresos.
"sales-velocity-calculator":
  "body": |
    La velocidad de ventas mide lo rápido que tu pipeline se convierte en ingresos:
    en concreto, cuántos dólares de ingresos genera tu equipo comercial al día. Es
    una de las métricas más útiles en ventas B2B porque descompone el crecimiento
    de ingresos en cuatro palancas que puedes optimizar por separado.

    ## La fórmula

    **Velocidad de ventas = (oportunidades × tasa de cierre × ACV) / días del ciclo de ventas**

    Con 50 oportunidades, un 25 % de cierre, $8.000 de ACV y un ciclo de 90 días:
    (50 × 0,25 × $8.000) / 90 = **$1.111 al día** → **$405k anualizados**

    ## Las cuatro palancas

    La velocidad de ventas tiene exactamente cuatro datos de entrada, y cada uno se
    puede mejorar por separado:

    1. **Número de oportunidades**: más pipeline cualificado. Un 20 % más de
       oportunidades suma un 20 % de velocidad (con lo demás constante).
    2. **Tasa de cierre**: mejor cualificación, demos más sólidas, mejor
       seguimiento. Subir del 25 % al 30 % suma un 20 % de velocidad.
    3. **ACV**: precios, paquetes, upsell al cierre. Subir de $8k a $10k suma un
       25 % de velocidad.
    4. **Ciclo de ventas**: acortarlo de 90 a 75 días suma un 20 % de velocidad.

    Mejorar las cuatro un 10 % cada una se multiplica hasta **+46 % de velocidad**,
    no +40 %.

    ## Referencias por segmento

    | Segmento | Velocidad de ventas habitual |
    |---|---|
    | SaaS pymes (ACV < $5k) | $200–500 al día |
    | Mid-market (ACV $5k–$50k) | $500–2.000 al día |
    | Enterprise (ACV > $50k) | $2.000–10.000+ al día |

    ## Qué te dice la velocidad de ventas

    **Velocidad baja con buena tasa de cierre**: la cobertura de pipeline es
    escasa; añade oportunidades en la parte alta del embudo.

    **Velocidad baja con buen pipeline**: el problema es la tasa de cierre o el
    ACV; mejora la cualificación o los precios.

    **Velocidad aceptable con ciclo largo**: acortar el ciclo tiene un impacto
    enorme porque está en el denominador.

    ## Preguntas frecuentes

    **¿Qué hace esta calculadora?**
    Calcula la velocidad de ventas (ingresos al día) a partir del tamaño del
    pipeline, la tasa de cierre, el valor medio de contrato y la duración del ciclo
    de ventas.
