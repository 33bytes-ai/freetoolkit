? "((TIE − {0}) ÷ TIE) × {1}. How much EBIT can decline before you can no longer cover interest. A TIE of {2}× means EBIT can drop {3} and you still break even on interest."
: "((TIE − {0}) ÷ TIE) × {1}. Cuánto puede caer el EBIT antes de que dejes de cubrir los intereses. Un TIE de {2}× significa que el EBIT puede caer un {3} y seguirías cubriendo los intereses."
? "({0} + monthly growth rate)^{1} − {2}. Annualised equivalent growth rate accounting for compounding. Useful for year-over-year planning."
: "({0} + tasa de crecimiento mensual)^{1} − {2}. La tasa de crecimiento anual equivalente, teniendo en cuenta la capitalización. Útil para planificar año a año."
? "({0} − monthly churn rate)^projection_months. Fraction of the original cohort still active at the end of the horizon. Shows long-run attrition shape."
: "({0} − tasa de churn mensual)^meses_de_proyección. La fracción de la cohorte original que sigue activa al final del horizonte. Muestra la forma del desgaste a largo plazo."
? "(Actual − Budget) ÷ |Budget| × {0}. Percentage difference between actual and budget. Used to identify material variances — typically anything over {1}–{2} warrants investigation."
: "(Real − presupuesto) ÷ |presupuesto| × {0}. La diferencia porcentual entre lo real y lo presupuestado. Sirve para detectar desviaciones importantes: por encima de {1}–{2} suele merecer análisis."
? "(Avg Accounts Payable ÷ COGS) × {0}. Average days before you pay suppliers. Higher DPO improves CCC — but don't exceed supplier terms."
: "(Cuentas por pagar medias ÷ coste de ventas) × {0}. Los días medios antes de pagar a proveedores. Un DPO más alto mejora el CCC, pero sin superar las condiciones del proveedor."
? "(Avg Accounts Receivable ÷ Revenue) × {0}. Average days to collect payment after a sale. Benchmark: {1}–{2} days for B{3}; SaaS with upfront billing: ~{4}."
: "(Cuentas por cobrar medias ÷ ingresos) × {0}. Los días medios para cobrar tras una venta. Referencia: {1}–{2} días en B{3}; SaaS con cobro por adelantado: ~{4}."
? "(Avg Inventory ÷ COGS) × {0}. How many days of inventory you hold on average. Lower is better — excess inventory ties up working capital."
: "(Inventario medio ÷ coste de ventas) × {0}. Cuántos días de inventario mantienes de media. Cuanto menos, mejor: el exceso de inventario inmoviliza capital circulante."
? "(Beginning inventory + Ending inventory) ÷ {0}. The denominator used in turnover. More accurate than using period-end inventory alone for seasonal businesses."
: "(Inventario inicial + inventario final) ÷ {0}. El denominador de la rotación. Más preciso que usar solo el inventario de cierre en negocios estacionales."
? "(Current ARR − ARR {0} months ago) ÷ ARR {1} months ago. Year-over-year ARR growth. T{2}D{3} targets: triple twice, then double {4} times."
: "(ARR actual − ARR de hace {0} meses) ÷ ARR de hace {1} meses. Crecimiento interanual del ARR. Objetivo T{2}D{3}: triplicar dos veces y luego duplicar {4} veces."
? "(Current ARR − Prior ARR) ÷ Prior ARR. Year-over-year growth. T{0}D{1} (triple twice, double {2} times) = {3}+ growth in early years."
: "(ARR actual − ARR anterior) ÷ ARR anterior. Crecimiento interanual. T{0}D{1} (triplicar dos veces, duplicar {2} veces) = {3}+ de crecimiento en los primeros años."
? "(Current Assets − Inventory) ÷ Current Liabilities. The 'acid test' — excludes inventory since it may not convert to cash quickly. Target: ≥{0}×."
: "(Activo corriente − inventario) ÷ pasivo corriente. La «prueba ácida»: excluye el inventario porque puede no convertirse rápido en caja. Objetivo: ≥ {0}×."
? "(Current Revenue − Break-Even Revenue) × Contribution Margin. Estimated monthly profit (or loss) relative to break-even. Positive = profitable."
: "(Ingresos actuales − ingresos de equilibrio) × margen de contribución. El beneficio (o pérdida) mensual estimado respecto al punto de equilibrio. Positivo = rentable."
? "(Current Revenue − Break-Even Revenue) ÷ Current Revenue. How far revenue can drop before you lose money. {0}+ is healthy; below {1} is fragile."
: "(Ingresos actuales − ingresos de equilibrio) ÷ ingresos actuales. Cuánto pueden caer los ingresos antes de perder dinero. {0}+ es sano; por debajo de {1} es frágil."
? "(Current − Previous) ÷ Previous × {0}. Year-over-year or period-over-period revenue growth rate. High-growth SaaS: {1}–{2}+; established companies: {3}–{4}."
: "(Actual − anterior) ÷ anterior × {0}. La tasa de crecimiento de ingresos interanual o entre periodos. SaaS de alto crecimiento: {1}–{2}+; empresas consolidadas: {3}–{4}."
"(Current − Prior) ÷ Prior × {0}. The growth rate between these two specific periods.": "(Actual − anterior) ÷ anterior × {0}. La tasa de crecimiento entre estos dos periodos."
? "(Discount% ÷ ({0} − Discount%)) × ({1} ÷ Days Gained). The annualized cost of passing on the early payment discount. Compare this to your cost of capital: if your borrowing rate is lower, take the discount."
: "(Descuento % ÷ ({0} − descuento %)) × ({1} ÷ días ganados). El coste anualizado de renunciar al descuento por pronto pago. Compáralo con tu coste de capital: si tu tipo de financiación es menor, toma el descuento."
? "(End − New) ÷ Start × {0}. The % of starting customers still active at period end. B{1} SaaS benchmark: {2}–{3} monthly; {4}–{5} annual."
: "(Final − nuevos) ÷ inicio × {0}. El % de clientes iniciales que siguen activos al final del periodo. Referencia SaaS B{1}: {2}–{3} mensual; {4}–{5} anual."
? "(Fixed Costs + Target Profit) ÷ Unit Contribution Margin. Units needed to cover fixed costs AND hit your desired profit figure."
: "(Costes fijos + beneficio objetivo) ÷ margen de contribución unitario. Las unidades necesarias para cubrir los costes fijos Y alcanzar el beneficio deseado."
? "(New MRR + Expansion) ÷ (Contraction + Churn). Above {0} = exceptional growth efficiency. Between {1}–{2} = healthy. Below {3} = you're losing more than you're gaining."
: "(Nuevo MRR + expansión) ÷ (contracción + churn). Por encima de {0} = eficiencia de crecimiento excepcional. Entre {1} y {2} = sano. Por debajo de {3} = pierdes más de lo que ganas."
? "(New Price − Current Price) ÷ Current Price. The % price change being modelled. Positive = price increase; negative = price cut."
: "(Precio nuevo − precio actual) ÷ precio actual. La variación de precio modelada en %. Positivo = subida; negativo = bajada."
? "(New − Old) ÷ |Old| × {0}. Percentage change from the original value to the new value. Positive = increase; negative = decrease."
: "(Nuevo − antiguo) ÷ |antiguo| × {0}. La variación porcentual del valor original al nuevo. Positivo = aumento; negativo = disminución."
? "(Opportunities × Win Rate × ACV) ÷ Sales Cycle Days. Revenue generated per day from your pipeline. Increasing any of the {0} inputs improves velocity."
: "(Oportunidades × tasa de éxito × ACV) ÷ días del ciclo de venta. Los ingresos que genera tu pipeline cada día. Mejorar cualquiera de los {0} datos aumenta la velocidad."
"(Original − Sale Price) ÷ Original × {0}. The percentage reduction from the original price.": "(Original − precio rebajado) ÷ original × {0}. La reducción porcentual respecto al precio original."
? "(Period Revenue ÷ Period Months) × {0}. If you earned {1} in {2} months, your ARR run rate is {3}. An extrapolation, not a guarantee."
: "(Ingresos del periodo ÷ meses del periodo) × {0}. Si ingresaste {1} en {2} meses, tu run rate de ARR es {3}. Es una extrapolación, no una garantía."
? "(Price − Cost) ÷ Cost × {0}. Markup is calculated on cost. A {1} markup means you doubled your cost. Markup is always higher than the equivalent margin percentage."
: "(Precio − coste) ÷ coste × {0}. El markup se calcula sobre el coste. Un markup de {1} significa que duplicaste tu coste. El markup siempre es mayor que el margen equivalente."
? "(Price − Cost) ÷ Price × {0}. Margin is calculated on selling price. A {1} margin ≠ {2} markup — margin on {3} at {4} cost is {5}, markup is {6}."
: "(Precio − coste) ÷ precio × {0}. El margen se calcula sobre el precio de venta. Un margen de {1} ≠ un markup de {2}: sobre {3} con un coste de {4}, el margen es {5} y el markup {6}."
"(Revenue − COGS) ÷ COGS. Shows how much profit you make per dollar of production cost. Useful for pricing strategy.": "(Ingresos − coste de ventas) ÷ coste de ventas. Muestra cuánto beneficio obtienes por cada euro de coste de producción. Útil para fijar precios."
"(Revenue − COGS) ÷ Revenue × {0}. Gross margin percentage. Retail: {1}–{2}; SaaS: {3}–{4}; Manufacturing: {5}–{6}.": "(Ingresos − coste de ventas) ÷ ingresos × {0}. El porcentaje de margen bruto. Comercio: {1}–{2}; SaaS: {3}–{4}; industria: {5}–{6}."
"(Revenue − COGS) ÷ Revenue × {0}. Profit after direct costs. SaaS: {1}–{2}; Manufacturing: {3}–{4}; Retail: {5}–{6}.": "(Ingresos − coste de ventas) ÷ ingresos × {0}. El beneficio tras los costes directos. SaaS: {1}–{2}; industria: {3}–{4}; comercio: {5}–{6}."
"(Revenue − COGS) ÷ Revenue. SaaS targets {0}–{1}; retail is typically {2}–{3}.": "(Ingresos − coste de ventas) ÷ ingresos. Los SaaS apuntan a {0}–{1}; el comercio suele estar en {2}–{3}."
? "(Revenue − Campaign Cost) ÷ Campaign Cost × {0}. Email consistently delivers {1}+ ROI industry-wide, making it the highest ROI channel."
: "(Ingresos − coste de la campaña) ÷ coste de la campaña × {0}. El email ofrece de forma constante {1}+ de ROI en todos los sectores, lo que lo convierte en el canal más rentable."
"(Revenue − Costs − Investment) ÷ Investment × {0}. The total return over the entire time horizon, not annualized.": "(Ingresos − costes − inversión) ÷ inversión × {0}. El retorno total en todo el horizonte, sin anualizar."
? "(Revenue − Marketing Spend) ÷ Marketing Spend × {0}. Return on your marketing investment for this lead channel. Positive = profitable; higher is better."
: "(Ingresos − gasto en marketing) ÷ gasto en marketing × {0}. El retorno de tu inversión en marketing para este canal. Positivo = rentable; cuanto más alto, mejor."
? "(Sale Price − COGS) ÷ Sale Price × {0}. Your gross margin after applying the discount. Watch that discounting doesn't push this below your break-even margin."
: "(Precio rebajado − coste de ventas) ÷ precio rebajado × {0}. Tu margen bruto tras aplicar el descuento. Vigila que el descuento no lo baje de tu margen de equilibrio."
? "(Starter price − cost per customer) ÷ Starter price. Actual gross margin at the Starter tier price. SaaS targets: {0}–{1} for hosted software."
: "(Precio Starter − coste por cliente) ÷ precio Starter. El margen bruto real al precio del plan Starter. Objetivos SaaS: {0}–{1} para software alojado."
? "(Starting MRR − Churned − Contracted) ÷ Starting MRR × {0}. GRR excludes expansion revenue — it only measures revenue retention from existing customers. Always ≤ {1}."
: "(MRR inicial − churn − contracción) ÷ MRR inicial × {0}. El GRR excluye los ingresos por expansión: solo mide la retención de ingresos de los clientes existentes. Siempre ≤ {1}."
? "(Starting customers − Churned) ÷ Starting customers. Percentage of the original cohort still active after the first period. B{0} SaaS benchmark: {1}–{2} after month {3}."
: "(Clientes iniciales − bajas) ÷ clientes iniciales. El porcentaje de la cohorte original que sigue activo tras el primer periodo. Referencia SaaS B{0}: {1}–{2} tras el mes {3}."
? "(Target AOV − Current AOV) × Monthly Orders. Additional monthly revenue from raising AOV to target, at the same order volume."
: "(Ticket medio objetivo − ticket medio actual) × pedidos mensuales. Los ingresos mensuales adicionales al subir el ticket medio al objetivo, con el mismo volumen de pedidos."
? "(Total Cash Flows − Initial Investment) ÷ Initial Investment × {0}, over the analysis period. Undiscounted return on investment across all years."
: "(Flujos de caja totales − inversión inicial) ÷ inversión inicial × {0}, durante el periodo de análisis. El retorno de la inversión sin descontar en todos los años."
