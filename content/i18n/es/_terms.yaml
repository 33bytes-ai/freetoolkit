# Spanish (neutral, Spain-leaning) finance vocabulary: reuse in every batch.
free cash flow: flujo de caja libre (FCF)
operating cash flow: flujo de caja operativo (OCF)
capital expenditures (capex): inversiones de capital (capex)
revenue: ingresos
market cap: capitalización bursátil
margin / gross margin: margen / margen bruto
runway: pista de caja (runway)
burn / burn rate: consumo de caja (burn)
churn: cancelaciones (churn)
MRR / ARR: MRR / ARR (sin traducir)
working capital: capital circulante
accounts receivable / payable: cuentas por cobrar / por pagar
net income: beneficio neto
break-even: punto de equilibrio
calculator: calculadora
founder: fundador
