"Cash Flow":
  "body": |
    Hay empresas rentables que quiebran por quedarse sin caja. El beneficio es un
    resultado contable; la caja es un saldo bancario, y en la distancia entre
    ambos se producen la mayoría de las insolvencias evitables. Estas calculadoras
    miden esa distancia.

    ## Cuál necesitas

    **Flujo de caja operativo** y **Flujo de caja libre** muestran lo que el
    negocio genera de verdad una vez descontados el capital circulante y las
    inversiones de capital; el FCF es la cifra que financia el crecimiento o
    devuelve deuda. **Ciclo de conversión de caja** y **DSO** miden cuánto tiempo
    queda atrapada la caja entre pagar a proveedores y cobrar a clientes; acortar
    ese ciclo libera caja sin levantar una ronda. **Capital circulante**
    dimensiona el colchón que el negocio necesita para seguir operando,
    **Descuento de factura** pone precio a ofrecer descuentos por pronto pago, y
    **Desviación presupuestaria** compara lo previsto con lo real para detectar un
    desfase en el segundo mes y no en el sexto.

    ## Qué significan los números

    Un DSO al alza es una de las primeras alertas fiables en una pequeña empresa:
    normalmente significa que el cobro se ha relajado o que los propios clientes
    están bajo presión, y ambas cosas empeoran en silencio. Un ciclo de conversión
    de caja negativo (cobrar a los clientes antes de pagar a los proveedores) es
    una ventaja estructural real, y explica en gran parte por qué los modelos de
    suscripción y los marketplaces pueden financiar su crecimiento con la
    operación, algo que un minorista tradicional no puede hacer.

"Payments":
  "body": |
    Las comisiones de pago suelen ser la mayor partida que una pequeña empresa
    nunca negocia. Al 2,9 % + $0,30, un negocio que procesa $30.000 al mes con
    tarjeta entrega unos $10.500 al año, más de lo que la mayoría de fundadores
    gasta en software. Estas calculadoras existen para que esa cifra deje de ser
    una sorpresa en el extracto mensual.

    ## Cuál necesitas

    Empieza por el **Comparador de comisiones** si estás eligiendo procesador o
    te planteas cambiar: pone Stripe, PayPal y los tres planes de Shopify
    Payments lado a lado para un mismo importe de venta y muestra el neto exacto
    de cada uno. Usa las calculadoras de **Stripe**, **PayPal** y **Shopify**
    cuando ya conoces tu procesador y necesitas una cifra precisa: cada una
    tiene en cuenta los detalles que la comparativa simplifica, como las
    tarjetas internacionales, las tarifas negociadas y el ajuste al alza de un
    cobro para recibir un importe exacto después de comisiones.

    ## Los errores que evitan

    Hay dos errores constantes. El primero es comparar los porcentajes anunciados
    sin tener en cuenta la comisión fija: en una venta de $5, los $0,30 de
    Stripe ya son un 6 %, y por eso las microtransacciones destrozan márgenes que
    parecen correctos en una hoja de cálculo. El segundo es olvidar los recargos
    por pago transfronterizo y conversión de divisa (un 1,5 % y un 1 % extra en
    Stripe), que hacen que un cliente internacional sea bastante menos rentable
    que uno nacional al mismo precio.
