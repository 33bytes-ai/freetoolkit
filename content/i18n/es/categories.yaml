# category name -> {body}: translated category intros from content/categories.yaml.
# Same markdown structure (headings, tables, FAQ bold questions) as English.

"Cash Flow":
  "body": |
    Hay empresas rentables que quiebran por quedarse sin caja. El beneficio es un
    resultado contable; la caja es un saldo bancario, y en la distancia entre
    ambos se producen la mayoría de las insolvencias evitables. Estas calculadoras
    miden esa distancia.

    ## Cuál necesitas

    **Flujo de caja operativo** y **Flujo de caja libre** muestran lo que el
    negocio genera de verdad una vez descontados el capital circulante y las
    inversiones de capital; el FCF es la cifra que financia el crecimiento o
    devuelve deuda. **Ciclo de conversión de caja** y **DSO** miden cuánto tiempo
    queda atrapada la caja entre pagar a proveedores y cobrar a clientes; acortar
    ese ciclo libera caja sin levantar una ronda. **Capital circulante**
    dimensiona el colchón que el negocio necesita para seguir operando,
    **Descuento de factura** pone precio a ofrecer descuentos por pronto pago, y
    **Desviación presupuestaria** compara lo previsto con lo real para detectar un
    desfase en el segundo mes y no en el sexto.

    ## Qué significan los números

    Un DSO al alza es una de las primeras alertas fiables en una pequeña empresa:
    normalmente significa que el cobro se ha relajado o que los propios clientes
    están bajo presión, y ambas cosas empeoran en silencio. Un ciclo de conversión
    de caja negativo (cobrar a los clientes antes de pagar a los proveedores) es
    una ventaja estructural real, y explica en gran parte por qué los modelos de
    suscripción y los marketplaces pueden financiar su crecimiento con la
    operación, algo que un minorista tradicional no puede hacer.

"Payments":
  "body": |
    Las comisiones de pago suelen ser la mayor partida que una pequeña empresa
    nunca negocia. Al 2,9 % + $0,30, un negocio que procesa $30.000 al mes con
    tarjeta entrega unos $10.500 al año, más de lo que la mayoría de fundadores
    gasta en software. Estas calculadoras existen para que esa cifra deje de ser
    una sorpresa en el extracto mensual.

    ## Cuál necesitas

    Empieza por el **Comparador de comisiones** si estás eligiendo procesador o
    te planteas cambiar: pone Stripe, PayPal y los tres planes de Shopify
    Payments lado a lado para un mismo importe de venta y muestra el neto exacto
    de cada uno. Usa las calculadoras de **Stripe**, **PayPal** y **Shopify**
    cuando ya conoces tu procesador y necesitas una cifra precisa: cada una
    tiene en cuenta los detalles que la comparativa simplifica, como las
    tarjetas internacionales, las tarifas negociadas y el ajuste al alza de un
    cobro para recibir un importe exacto después de comisiones.

    ## Los errores que evitan

    Hay dos errores constantes. El primero es comparar los porcentajes anunciados
    sin tener en cuenta la comisión fija: en una venta de $5, los $0,30 de
    Stripe ya son un 6 %, y por eso las microtransacciones destrozan márgenes que
    parecen correctos en una hoja de cálculo. El segundo es olvidar los recargos
    por pago transfronterizo y conversión de divisa (un 1,5 % y un 1 % extra en
    Stripe), que hacen que un cliente internacional sea bastante menos rentable
    que uno nacional al mismo precio.

"Freelance":
  "body": |
    El trabajo independiente se pone mal precio más a menudo de lo que se vende
    mal. El error habitual es dividir un salario objetivo entre 2.080 horas y
    cobrar el resultado, lo que ignora todas las horas no facturables y todos los
    costes que antes asumía un empleador.

    ## Cuál necesitas

    **Tarifa freelance** es el punto de partida: parte de los ingresos que
    necesitas y suma el tiempo no facturable, las vacaciones sin sueldo, los días
    de baja, los gastos del negocio y los impuestos de autónomo que un salario
    oculta. **Salario a tarifa por hora** convierte una oferta de empleo en la
    tarifa freelance equivalente, la comparación honesta para decidir entre un
    contrato y un puesto. **Presupuesto de proyecto** pone precio a un trabajo
    cerrado con un colchón para imprevistos, y **Calculadora de factura** se
    encarga del documento final, con impuestos y varias líneas.

    ## Qué significan los números

    La ocupación facturable realista de un freelance en solitario es del 50–70 %,
    no del 100 %. Llamadas comerciales, propuestas, administración, facturación y
    marketing son horas reales que ningún cliente paga directamente. Con un 60 %
    de ocupación, un objetivo de $100.000 en 46 semanas de trabajo supone unos
    $120 la hora antes de impuestos y gastos, no los $52 que sugiere dividir sin
    más entre 2.080 horas. Presupuesta con la primera cifra y el negocio funciona;
    con la segunda, se va apagando poco a poco.

"Tax & Compliance":
  "body": |
    Los impuestos son el coste que más se olvida al fijar precios y el que más
    probablemente llegue como una sorpresa desagradable. Estas calculadoras dan
    estimaciones de planificación para que el dinero se aparte antes de gastarlo.

    ## Cuál necesitas

    **IVA** añade o quita el impuesto sobre el valor añadido a cualquier tipo,
    incluido el cálculo inverso desde un importe con IVA: el que más confunde,
    porque quitar un 20 % de IVA es dividir entre 1,2, no restar un 20 %.
    **Impuestos freelance** estima lo que un autónomo debería reservar de cada
    factura. **Cotizaciones del empleador** cubre la parte de la empresa, la que
    sorprende a quien contrata por primera vez.

    ## Qué significan los números

    El hábito más útil que fomentan es reservar los impuestos al cobrar, no al
    declarar. Un freelance que pasa un 25–30 % de cada pago a una cuenta aparte el
    mismo día que lo recibe nunca se encuentra con un pago trimestral que no puede
    afrontar. Tipos, umbrales y deducciones cambian según el país y el ejercicio
    fiscal, y estas calculadoras sirven para planificar, no para declarar:
    comprueba las cifras vigentes con la administración tributaria o un asesor
    antes de presentar nada.

"HR & People":
  "body": |
    Las personas son el mayor coste de la mayoría de empresas de servicios y
    software, y el que más a menudo se presupuesta solo con el salario base. Estas
    calculadoras ponen precio a la cifra real.

    ## Cuál necesitas

    **Coste de un empleado** y **Coste de nómina** construyen la cifra completa:
    salario más cotizaciones del empleador, beneficios, equipo, software y espacio
    de trabajo, que juntos suelen sumar un 25–40 % al salario base. **Coste de la
    rotación** pone precio a una salida: selección, preaviso, incorporación y los
    meses de menor rendimiento hasta que el sustituto es productivo. **Rotación de
    empleados** sigue la tasa en sí, y **Comisiones** modela la retribución
    variable para comprobar un plan comercial frente al margen antes de
    ofrecerlo.

    ## Qué significan los números

    Sustituir a un empleado suele costar entre seis meses y dos años de su salario
    si se incluye la pérdida de productividad, y la cifra sube con la antigüedad
    y la especialización. Esa es la cifra que conviene tener al lado de cualquier
    decisión de retención: una subida, un presupuesto de formación o una
    flexibilidad horaria que parece cara por sí sola suele ser mucho más barata
    que la salida que evita. En el diseño de comisiones, compara el plan con el
    margen de contribución y no con los ingresos: un plan que paga bien en una
    venta con descuento premia, sin que se note, el descuento.

"Investment & Returns":
  "body": |
    Toda decisión de inversión es una comparación con las alternativas, incluida
    la de no hacer nada. Estas calculadoras ponen una cifra defendible a esa
    comparación en lugar de fiarse de la intuición de que un proyecto «parece que
    merece la pena».

    ## Cuál necesitas

    El **ROI** es la versión simple, ciega al tiempo: útil para comparaciones
    rápidas, engañosa en horizontes largos porque trata un dólar dentro de cinco
    años igual que un dólar hoy. El **VAN** y la **TIR** lo corrigen descontando
    los flujos futuros, y la **TIRM** corrige la hipótesis optimista de la TIR de
    que la caja intermedia se reinvierte a la propia TIR. El **WACC** da la tasa de
    descuento que necesitan esos modelos: el coste medio de la deuda y del capital
    que financian el negocio. El **periodo de recuperación** responde a la
    pregunta del riesgo de caja, no a la de la rentabilidad: cuánto tarda en
    volver el dinero. La **regla del 72** es el atajo mental para saber cuánto
    tarda una tasa en duplicar una cantidad.

    ## Qué significan los números

    El VAN y la TIR pueden contradecirse, y cuando pasa, en proyectos mutuamente
    excluyentes hay que fiarse del VAN, porque mide el valor creado y no una tasa.
    Ambos valen lo que valga la previsión de flujos que los sostiene, que es donde
    está la incertidumbre real. Calcula cada modelo con un escenario pesimista,
    uno esperado y uno optimista: un proyecto que solo supera el umbral en el
    optimista es una apuesta, no una inversión.

"Valuation":
  "body": |
    La valoración es una negociación informada por los números, no un resultado de
    ellos. Estas calculadoras producen el rango defendible del que parte la
    conversación y hacen explícitas las hipótesis que sostienen el resultado.

    ## Cuál necesitas

    El **DCF** es el método de primeros principios: prever los flujos de caja,
    descontarlos y ver cuánto vale el negocio por sí mismo. **Múltiplo de
    EBITDA**, **PER** y **P/S** son el enfoque por comparables: más rápido,
    anclado al mercado y como se fija realmente el precio en la mayoría de
    operaciones de pequeñas empresas y SaaS. **Valor empresarial** concilia ambos
    ajustando el valor del capital por la deuda y la caja: es la cifra que negocia
    un comprador. **TAM/SAM/SOM** dimensiona la oportunidad en la que se apoya una
    historia de crecimiento, y **Dilución** muestra con cuánto se quedan los
    fundadores tras cada ronda.

    ## Qué significan los números

    Los múltiplos varían muchísimo según el crecimiento y el sector: una SaaS que
    crece más del 40 % anual ha logrado históricamente varias veces el múltiplo de
    ingresos de una que crece al 10 %, y las empresas no cotizadas cotizan con
    descuento por iliquidez frente a sus comparables cotizadas. Toma cualquier
    múltiplo aislado como el punto medio de un rango amplio. En dilución, lo que
    los fundadores subestiman siempre es el efecto acumulado: tres rondas del 20 %
    dejan aproximadamente un 51 %, no un 40 %, porque cada ronda diluye la tabla de
    capitalización post-money y no la original.

"Marketing":
  "body": |
    La inversión en marketing se puede defender cuando se mide frente a los
    ingresos y no frente a la actividad. Estas calculadoras convierten las
    métricas de campaña en las cifras que se usan de verdad en una conversación
    financiera: coste por cliente adquirido, retorno por dólar invertido e
    ingresos que producirá un embudo concreto.

    ## Cuál necesitas

    El **ROAS** es la herramienta básica de la publicidad de respuesta directa
    (ingresos por dólar publicitario), mientras que **Tasa de conversión** y
    **Embudo de ventas** muestran en qué punto de un recorrido de varios pasos se
    pierden realmente los prospectos. **Ingresos por lead** y **Ticket medio** son
    los dos datos que dan valor a un modelo de embudo: mejorar cualquiera de ellos
    eleva todas las fases siguientes. **Velocidad de ventas** combina número de
    oportunidades, tamaño medio, tasa de cierre y duración del ciclo en una cifra
    que indica lo rápido que un pipeline genera ingresos, normalmente más útil que
    cualquiera de los cuatro por separado. **ROI del email** y **Crecimiento de la
    lista** cubren el canal con el mayor retorno medido y la capitalización más
    lenta.

    ## Qué significan los números

    Un ROAS de 4 a 1 es un objetivo habitual, pero es una cifra bruta: no dice nada
    del margen. Con un 25 % de margen bruto, un ROAS de 4 a 1 solo cubre costes
    antes de gastos generales. Juzga las campañas por la contribución después del
    coste de ventas y frente al valor de vida del cliente, no a la primera compra,
    o apagarás los canales que te traen a tus clientes más duraderos.
