"fixed-price-vs-time-and-materials-quoting":
  "title": "Precio cerrado o por horas: cómo elegir"
  "description": "Las ventajas e inconvenientes de presupuestar a precio cerrado o por horas como freelance, quién asume el riesgo en cada modelo y cómo elegir el adecuado en cada proyecto."
  "body": |
    Los dos modelos de precio freelance más habituales colocan el riesgo en sitios
    distintos. Elegir el equivocado para un proyecto significa dejar dinero sobre
    la mesa o trabajar horas extra sin cobrar.

    ## La disyuntiva de fondo

    **Precio cerrado**: presupuestas una cifra para unos entregables definidos. Si
    el proyecto lleva más tiempo del estimado, absorbes las horas extra. Si lleva
    menos, te quedas la diferencia.

    **Por horas (tiempo y materiales)**: facturas las horas reales a tu tarifa. El
    cliente asume el riesgo de que el trabajo lleve más de lo previsto; cobras cada
    hora, sea cual sea la diferencia entre estimación y realidad.

    ## Cuándo funciona bien el precio cerrado

    - El alcance está bien definido y es poco probable que cambie
    - Has hecho proyectos parecidos y tienes datos fiables para estimar
    - El cliente quiere certeza de presupuesto y está dispuesto a pagarla
    - Puedes incluir un colchón de imprevistos (normalmente del 20–30 %) para absorber desviaciones razonables

    ## Cuándo es mejor por horas

    - Los requisitos aún cambian o son realmente desconocidos al principio (fases
      de descubrimiento, I+D, ámbitos nuevos)
    - La colaboración es continua, tipo iguala, más que un entregable concreto
    - El cliente necesita flexibilidad para cambiar de rumbo sin renegociar el
      contrato cada vez

    ## El enfoque híbrido

    Muchos freelancers presupuestan a precio cerrado una fase bien definida (por
    ejemplo, el descubrimiento o la construcción de un MVP) y pasan a facturar por
    horas el trabajo continuo cuando los requisitos se estabilizan. Así limitan el
    riesgo del precio cerrado a la parte del proyecto que pueden estimar con
    confianza.

    ## La psicología del precio también cuenta

    Algunos clientes prefieren el precio cerrado por encima de todo porque encaja
    con cómo presupuestan internamente: incluso una propuesta por horas bien
    argumentada puede perder frente a un competidor con precio cerrado solo por
    eso. Ten en cuenta la preferencia del cliente, no solo el tipo de proyecto,
    para decidir con qué modelo abrir.

    ## Preguntas frecuentes

    **¿Puedo pasar de por horas a precio cerrado más adelante?**
    Sí: cuando llevas tiempo suficiente con un cliente para conocer su alcance
    habitual y su forma de pedir cambios, puedes presupuestar las fases
    siguientes con mucha más seguridad que al principio.

    **¿Cómo gestiono la ampliación de alcance en un proyecto de precio cerrado?**
    Define los entregables de forma explícita en el contrato y trata todo lo que
    quede fuera como una orden de cambio presupuestada aparte. Acordad ese proceso
    antes de empezar, no cuando el alcance ya haya crecido.

    Usa la [calculadora de presupuesto freelance](/tools/freelance-project-estimate/)
    para crear un presupuesto de precio cerrado a partir de tu tarifa por hora,
    tus horas estimadas y un colchón de imprevistos.
"freelance-hourly-rate-calculator-guide":
  "title": "Cómo fijar tu tarifa freelance por hora: cuánto cobrar en 2024"
  "description": "Cómo calcular una tarifa freelance por hora sostenible que cubra impuestos, beneficios, tiempo administrativo no pagado y deje margen para ahorrar, según el puesto y el mercado."
  "body": |
    El error de precio más común en freelance es partir de una comparación con un
    salario. Este es un método que tiene en cuenta todo lo que un salario no
    cubre.

    ## El coste real de ser freelance frente a ser empleado

    Como freelance dejas de recibir:
    - Cotizaciones a cargo del empleador (~8 %)
    - Seguro médico ($500–$1.500 al mes)
    - Vacaciones y bajas pagadas (10–20 días al año = 4–8 % del tiempo)
    - Aportación al plan de pensiones 401(k) (3–5 % del salario)
    - Oficina y equipo (variable)

    Súmalos a los ingresos netos que quieres para obtener la facturación bruta
    necesaria.

    ## Fórmula de la tarifa freelance

    **Facturación anual necesaria = (ingresos netos deseados + impuestos + beneficios + compensación de vacaciones + gastos generales)**
    **Tarifa por hora = facturación anual necesaria ÷ horas facturables**

    Donde horas facturables = horas de trabajo × 65–75 % (para cubrir
    administración, ventas y trabajo no pagado)

    ## Ejemplo: objetivo de $100k netos

    | Concepto | Importe |
    |------|--------|
    | Ingresos netos deseados | $100.000 |
    | Cotizaciones de autónomo (15,3 %) | $20.000 |
    | Impuesto federal/estatal (25 %) | $30.000 |
    | Seguro médico | $12.000 |
    | Vacaciones (3 semanas) | $6.000 |
    | Facturación bruta necesaria | $168.000 |
    | Horas facturables (1.600 h × 70 %) | 1.120 |
    | **Tarifa mínima por hora** | **$150/h** |

    A $150 la hora y 1.120 horas facturables, facturas $168k y te quedan ~$100k
    netos.

    Usa la [calculadora de presupuesto freelance](/tools/freelance-project-estimate/)
    para construir presupuestos a partir de esta tarifa por hora.
"how-to-quote-a-freelance-project":
  "title": "Cómo presupuestar un proyecto freelance: guía completa"
  "description": "Guía paso a paso para crear un presupuesto freelance que cubra tu tiempo, proteja tu margen y convenza al cliente."
  "body": |
    Presupuestar bien un proyecto freelance es una de las habilidades más difíciles
    de desarrollar. Si te quedas corto, acabas odiando el trabajo. Si te pasas,
    pierdes al cliente. Este es un método que te lleva siempre a una cifra
    defendible y rentable.

    ## Paso 1: define el alcance antes del precio

    Nunca estimes tiempos sin un alcance por escrito. La «web sencilla» de un
    cliente puede ser una web estática de 5 páginas o una tienda online de 60.
    Antes de decir ninguna cifra, apunta los entregables, las rondas de revisión y
    lo que queda explícitamente fuera.

    ## Paso 2: estima las horas y multiplica por 1,3–1,5

    Registra tus horas en proyectos durante 30 días. Verás que subestimas de forma
    sistemática un 30–50 %. Incluye ese margen en cada presupuesto.

    ## Paso 3: aplica tu tarifa

    Tu tarifa debe cubrir: los ingresos netos que quieres, los impuestos (25–35 %),
    los beneficios sociales, el tiempo administrativo no pagado (20–30 % de las
    horas de trabajo) y el riesgo de periodos sin clientes.

    **Tarifa freelance mínima = (objetivo de ingresos anuales + impuestos + costes) / horas facturables**

    ## Paso 4: añade una tarifa de gestión de proyecto

    Suma un 10–15 % de gestión de proyecto al tiempo de producción. Reuniones,
    emails, revisiones y llamadas con el cliente son trabajo real aunque parezcan
    gastos generales.

    Usa la [calculadora de presupuesto freelance](/tools/freelance-project-estimate/)
    para construir tu presupuesto por componentes.
"freelance-rate-by-experience":
  "title": "Tarifas freelance por nivel de experiencia y tecnología"
  "description": "Tarifas por hora de mercado para desarrolladores, diseñadores y consultores freelance en niveles junior, medio y senior, y cómo calcular tu tarifa mínima viable."
  "body": |
    Las tarifas de mercado de los freelancers varían muchísimo según la
    habilidad, la experiencia, la tecnología y la geografía. Las cifras de abajo
    se basan en datos agregados de plataformas freelance, encuestas e información
    directa de profesionales en 2024. Úsalas como referencia y después usa la
    calculadora de arriba para encontrar la tarifa mínima que cumple tus objetivos
    de ingresos.

    ## Tarifas de desarrolladores (USD, en remoto)

    | Nivel | Desarrollo general | React/Node | Python/ML | Blockchain/Web3 |
    |-------|------------|-----------|----------|----------------|
    | Junior (0–2 años) | $35–60 | $45–75 | $50–80 | $60–100 |
    | Medio (2–5 años) | $60–100 | $75–130 | $90–150 | $100–180 |
    | Senior (5–10 años) | $100–180 | $120–200 | $140–220 | $180–300 |
    | Principal/Staff | $180–300+ | $200–350+ | $200–350+ | $300–500+ |

    ## Tarifas de diseñadores (USD, en remoto)

    | Nivel | Diseño UI/UX | Marca/Identidad | Motion/3D |
    |-------|-------------|--------------|----------|
    | Junior | $40–65 | $45–70 | $50–80 |
    | Medio | $70–110 | $80–130 | $90–150 |
    | Senior | $120–180 | $130–200 | $150–250 |

    ## Tarifas de consultoría y estrategia (USD)

    Los consultores independientes de estrategia, producto y crecimiento cobran
    tarifas bastante más altas por el impacto directo de su trabajo en el negocio:

    | Especialidad | Rango por hora |
    |-----------|------------|
    | Estrategia de producto | $150–350 |
    | Crecimiento / adquisición de pago | $100–250 |
    | Datos / analítica | $100–200 |
    | CTO / asesor técnico | $150–400 |
    | CFO a tiempo parcial | $150–400 |

    ## Por qué tu tarifa mínima no debe anclar tu tarifa real

    La calculadora da el suelo, la tarifa por debajo de la cual pierdes dinero. Tu
    tarifa real debe reflejar las tarifas de mercado de arriba más la prima por tu
    especialización. Si la tarifa de mercado para tus habilidades está muy por
    encima de tu mínimo calculado, cobra la de mercado. El cálculo del mínimo
    sirve para no cobrar nunca de menos, no para fijar tu techo.
"freelance-rate-vs-salary":
  "title": "¿Me hago freelance? Comparar tarifas freelance con el salario de empleado"
  "description": "La comparación real entre ingresos freelance y salario, teniendo en cuenta impuestos, beneficios, tiempo no facturable y estabilidad de ingresos."
  "body": |
    La pregunta «¿me hago freelance?» casi siempre se plantea mal, como una
    comparación entre tu salario actual y una tarifa por hora objetivo. La
    comparación real tiene muchos más matices.

    ## Lo que tu empresa paga realmente por ti

    Un salario de $100k le cuesta al empleador unos $130–145k en total:

    | Concepto | Coste |
    |-----------|------|
    | Salario | $100.000 |
    | Cotizaciones (parte del empleador, ~7,65 %) | $7.650 |
    | Seguro médico (aportación del empleador) | $8.000–15.000 |
    | Aportación al 401k (3–6 %) | $3.000–6.000 |
    | Equipo, oficina | $3.000–8.000 |
    | Selección, incorporación, gestión | $5.000–15.000 |
    | **Coste total para el empleador** | **~$127–152k** |

    Como freelance asumes todos esos costes tú mismo. Una facturación freelance
    de $100k, antes de descontarlos, vale bastante menos en ingresos netos que un
    salario de $100k.

    ## El multiplicador del tiempo no facturable

    Los freelancers suelen facturar el 50–70 % de sus horas de trabajo. El otro
    30–50 % se va en captar clientes, administración, facturación y tiempos
    muertos entre proyectos. Si trabajas 2.000 horas al año y facturas el 65 %,
    tienes 1.300 horas facturables para cubrir todo tu coste anual.

    Usa la calculadora de tarifa freelance de arriba para hacer estas cuentas con
    tu situación: la tarifa adecuada depende de tu objetivo de ingresos, tu tipo
    impositivo y tu ocupación facturable.

    ## Cuándo compensa económicamente ser freelance

    Ser freelance supera al empleo en lo económico cuando:
    - Tu tarifa facturable es 2,5–3 veces tu tarifa por hora equivalente como empleado
    - Puedes mantener más del 60 % de ocupación facturable todo el año
    - Accedes a un seguro médico equivalente a un coste razonable
    - Tu trabajo requiere habilidades con alto valor por hora (prima de especialización)
"how-to-raise-your-freelance-rate-with-existing-clients":
  "title": "Cómo subir tu tarifa freelance a clientes actuales"
  "description": "Un proceso práctico para subir tu tarifa a clientes con los que ya trabajas sin perder la relación: momento, forma de plantearlo y cómo responder a las objeciones."
  "body": |
    Subir la tarifa a un cliente nuevo es fácil: simplemente presupuestas más
    alto. Subírsela a alguien con quien llevas un año trabajando es otra
    conversación, y la mayoría de freelancers la aplazan mucho más de lo que
    deberían.

    ## Por qué los freelancers suben poco la tarifa a clientes actuales

    La aversión a la pérdida pesa más que la incomodidad de cobrar de menos:
    perder a un cliente conocido y fiable parece más arriesgado que el coste lento
    e invisible de cobrar poco mes tras mes. Pero un cliente contento con tu
    trabajo a la tarifa actual muy probablemente se quedará tras una subida
    razonable; el miedo a perderlo suele ser mayor que el riesgo real.

    ## Un proceso sencillo

    1. **Avisa con 60–90 días** — tiempo suficiente para que el cliente lo
       presupueste, lo que elimina por completo la objeción de «me lo sueltas de
       golpe»
    2. **Apóyate en el valor, no en el coste de la vida** — «mi tarifa sube a X»
       funciona mejor que «necesito subir porque han subido los costes», que
       invita a negociar tus gastos personales en vez del valor que aportas
    3. **Comunícalo, no pidas permiso** — «Mi tarifa será X a partir de [fecha]»
       es un hecho sobre cómo gestionas tu negocio, no una petición que el cliente
       pueda vetar
    4. **Mantente firme** — la mayoría de clientes que protestan y luego se quedan
       con la nueva tarifa respetan más tu tiempo y tus plazos a partir de
       entonces

    ## Cuánto subir y cada cuánto

    Una subida del 10–20 % una o dos veces al año es defendible y rara vez hace
    perder un cliente por sí sola. Los saltos mayores (30 % o más) se justifican
    mejor si van acompañados de un aumento claro de alcance, de seniority o de
    resultados demostrados desde la última actualización.

    ## Cómo responder a las objeciones

    Si un cliente no puede asumir la nueva tarifa, es información útil: quizá haya
    llegado al techo de lo que puede pagarte. Es una señal para dedicar más
    energía a clientes que puedan crecer con tu tarifa, en vez de seguir cobrando
    poco para conservar todas tus relaciones actuales.

    ## Preguntas frecuentes

    **¿Subo la tarifa a todos los clientes a la vez?**
    No necesariamente: escalónalo según la fecha de renovación de cada contrato y
    prueba primero con tu relación más sólida para ganar confianza en el proceso.

    **¿Y si un cliente dice que un competidor cobra menos?**
    Pregúntale qué necesita exactamente a ese precio. A menudo queda claro que no
    se comparan cosas equivalentes, o se abre una conversación sobre reducir el
    alcance en lugar de perder la relación.

    Usa la [calculadora de tarifa freelance](/tools/freelance-rate-calculator/)
    para confirmar que tu nueva tarifa sigue superando tu objetivo de ingresos
    mínimos después de impuestos y gastos.
"freelance-invoice-best-practices":
  "title": "Buenas prácticas de facturación freelance: qué incluir y cómo cobrar antes"
  "description": "Lo que debe incluir toda factura freelance (datos obligatorios, condiciones de pago, recargos por demora) y técnicas probadas para reducir los días hasta el cobro."
  "body": |
    Una factura bien estructurada hace dos cosas: documenta con claridad lo que
    entregaste y hace que pagar sea lo más fácil posible para tu cliente.

    ## Datos obligatorios de la factura

    Toda factura debe incluir:
    - El nombre y la dirección de tu negocio (o tu nombre legal si eres autónomo)
    - El nombre y la dirección de facturación del cliente
    - Número de factura (correlativo, nunca repetido)
    - Fecha de emisión y fecha de vencimiento
    - Líneas detalladas con cantidad, precio y total de cada línea
    - Subtotal, descuento (si lo hay), impuestos e importe total a pagar
    - Instrucciones de pago (datos bancarios, PayPal, enlace de Stripe)
    - Política de recargos por demora («1,5 % mensual sobre saldos vencidos»)

    ## Condiciones de pago que reducen los retrasos

    El pago estándar a 30 días es demasiado lento para un freelance. Más eficaz:
    - **14 días** para clientes consolidados con buen historial de pago
    - **50 % al inicio y 50 % a la entrega** para clientes nuevos o proyectos grandes
    - **7 días con un 2 % de descuento por pronto pago**: los clientes que pagarían tarde pagan antes
    - **Cobro con tarjeta con reintento automático** (con Stripe) para clientes con iguala mensual

    ## Trucos psicológicos que funcionan

    1. **Usa cifras redondas** en tu tarifa y redondea a múltiplos de $5: es más
       fácil de procesar para los departamentos de cuentas por pagar
    2. **Incluye un botón «Pagar ahora»** que lleve a un enlace de pago: eliminas
       fricción
    3. **Envía la factura en las 24 horas siguientes a la entrega**: cuanto más
       reciente, antes se paga
    4. **Haz seguimiento 7 días antes del vencimiento**: un recordatorio amable, no
       una persecución

    Usa la [calculadora de factura](/tools/invoice-total-calculator/) para calcular
    el total con descuentos e impuestos bien aplicados.
"how-to-calculate-invoice-total":
  "title": "Cómo calcular el total de una factura con impuestos y descuentos"
  "description": "Guía paso a paso para calcular bien el total de una factura: líneas, descuentos, impuestos y recargos por demora."
  "body": |
    Calcular bien el total de una factura evita disputas, asegura que cobras lo
    que te deben y mantiene limpias tus cuentas por cobrar.

    ## Fórmula del total de la factura

    **Subtotal** = suma de todas las líneas (cantidad × precio unitario)
    **Tras descuento** = subtotal × (1 − % de descuento)
    **Impuesto** = importe tras descuento × tipo impositivo
    **Total** = importe tras descuento + impuesto

    ## ¿Descuento antes o después de impuestos?

    Aplica siempre el descuento sobre la base imponible. El impuesto se calcula
    sobre el precio con descuento, no sobre el original. Algunas jurisdicciones lo
    exigen expresamente; aplicar el impuesto antes del descuento es incorrecto y
    cobra de más a tu cliente.

    ## Cuándo añadir recargos por demora

    Indica las condiciones de pago en cada factura (por ejemplo, «30 días, recargo
    del 1,5 % mensual»). Recargo = saldo pendiente × tipo mensual × meses de
    retraso. Una factura de $5.000 con 60 días de retraso al 1,5 % mensual =
    $5.000 × 1,5 % × 2 = $150 de recargo.

    ## Buenas prácticas de numeración

    Usa números correlativos (INV-001, INV-002…) o con prefijo de año
    (2024-INV-001). Nunca reutilices un número: crea confusión contable y puede
    llamar la atención en una inspección fiscal.

    Calcula tu factura con la [calculadora de factura](/tools/invoice-total-calculator/).
"contractor-vs-employee-hourly-rate":
  "title": "Contratista o empleado: comparación de la tarifa por hora real"
  "description": "Cómo comparar en igualdad la tarifa diaria de un contratista y el salario de un empleado: desglose completo de la tarifa por hora con beneficios e impuestos."
  "body": |
    Comparar la tarifa diaria de un contratista con un puesto asalariado es como
    comparar peras con manzanas, salvo que ajustes todas las diferencias ocultas
    de la retribución total.

    ## Lo que tienen los empleados y no los contratistas

    | Beneficio | Valor anual (estimado) |
    |---------|------------------------|
    | Seguro médico pagado por la empresa | $6.000–$14.000 |
    | Aportación al 401(k) de la empresa (4 %) sobre $75k | $3.000 |
    | Vacaciones pagadas (15 días) | ~$4.300 sobre $75k |
    | Cotizaciones (FICA del empleador) | 7,65 % del salario |
    | Bajas por enfermedad y parentales | $1.000–$5.000 |

    El conjunto de beneficios suele añadir **un 25–40 % sobre el salario base**.

    ## Convertir una tarifa diaria en salario equivalente

    Un contratista que factura 220 días a $500 al día gana $110.000 brutos. Después de:
    - Cotizaciones de autónomo: ~$15.000
    - Sin beneficios de empresa: −$20.000 frente a ser empleado
    - Un 20 % de colchón para administración y periodos sin clientes

    Valor salarial equivalente: aproximadamente **$75.000–$85.000**.

    ## La regla práctica

    **Tarifa por hora del contratista ≈ tarifa por hora equivalente de empleado × 1,5–2**

    Un empleado de $75k cuesta ~$36 la hora en salario. Un contratista que hace un
    trabajo equivalente necesita cobrar $55–$72 la hora para estar igual de
    retribuido tras impuestos y costes.

    Modela tus cifras exactas con la [calculadora de salario a tarifa por hora](/tools/salary-to-hourly-calculator/).
"salary-to-hourly-conversion-guide":
  "title": "De salario a tarifa por hora: cómo convertirlo bien"
  "description": "Guía paso a paso para convertir un salario anual en tarifa por hora, incluido el tiempo parcial, las horas extra y la tarifa efectiva después de impuestos."
  "body": |
    Convertir un salario anual en tarifa por hora parece sencillo: se divide entre
    2.080 horas (52 semanas × 40 horas). Pero eso da una cifra bruta que ignora
    vacaciones, festivos, coste de los beneficios y cotizaciones. Esta es la
    imagen completa.

    ## Fórmula básica: salario ÷ 2.080

    Un salario de $75.000 ÷ 2.080 horas de trabajo = **$36,06 la hora bruta**.

    Es la tarifa que usa el empleador para calcular las horas extra y la que
    aparece en la mayoría de nóminas. Pero no es lo que ganas realmente por hora
    trabajada.

    ## Tener en cuenta las vacaciones pagadas

    Con 15 días de vacaciones + 10 festivos federales = 25 días libres = 200 horas.
    Trabajas 2.080 − 200 = 1.880 horas al año. Tu tarifa por hora efectiva:
    $75.000 ÷ 1.880 = **$39,89 la hora**. También te pagan por el tiempo que no
    trabajas, pero si quieres saber cuánto cuestas por hora productiva, usa esta
    cifra.

    ## Tarifa por hora después de impuestos

    Con un tipo federal efectivo del 22 % y un 6,2 % de FICA:
    - Salario neto: $75.000 × (1 − 0,22 − 0,062) = ~$53.850
    - Neto por hora (÷ 2.080): **$25,89 la hora netos**

    ## Tarifa freelance frente a tarifa de empleado

    Un freelance debe sumar las cotizaciones de autónomo (15,3 %), los
    beneficios, el tiempo administrativo no pagado y el riesgo de periodos sin
    clientes. Un freelance que quiere el equivalente a $75k suele tener que cobrar
    **$55–$70 la hora** para igualar la retribución total de un empleado.

    Usa la [calculadora de salario a tarifa por hora](/tools/salary-to-hourly-calculator/)
    para modelar tu situación.

"freelance-vs-w2-tax-comparison":
  "title": "Impuestos freelance frente a empleado W-2: el coste real de ser autónomo"
  "description": "Cómo se comparan los impuestos de un freelance con los de un empleado W-2: la SE tax del 15,3 % explicada, por qué apartar un 25–30 % y cuándo compensa."
  "body": |
    Al comparar un contrato freelance de $100k con un salario de $100k, la opción
    freelance tiene un coste fiscal bastante mayor, pero también más ingresos antes
    de deducciones. Esta es la imagen completa.

    ## La diferencia clave: la SE tax

    Un empleado W-2 con $100k paga:
    - Social Security (6,2 %) + Medicare (1,45 %) = **7,65 %** de su nómina
    - La empresa paga otro 7,65 % (invisible para el empleado)

    Un freelance con $100k de beneficio neto paga:
    - Las dos partes: **15,3 %** de SE tax ($15.300)
    - Puede deducir la mitad ($7.650) de su base imponible

    Así que el autónomo paga ~$7.650 más en cotizaciones que el empleado W-2 con
    los mismos ingresos.

    ## La diferencia de tipos

    | Ingresos | Empleado W-2 | Freelance |
    |---|---|---|
    | $60.000 | ~$9.000 de impuestos en total | ~$16.000 de impuestos en total |
    | $100.000 | ~$18.000 de impuestos en total | ~$28.000 de impuestos en total |
    | $150.000 | ~$32.000 de impuestos en total | ~$44.000 de impuestos en total |

    *Estimaciones para declarante individual, deducción estándar y sin otros ingresos.*

    ## Por qué los freelancers suelen salir ganando

    1. **Tarifas brutas más altas**: los contratistas suelen ganar un 20–40 % más
       que los empleados por un trabajo equivalente (la empresa no paga beneficios).
    2. **Deducciones**: los gastos del negocio reducen la base imponible por
       debajo del equivalente W-2.
    3. **Planes de jubilación**: SEP-IRA y Solo 401(k) permiten proteger mucho más
       que el límite de $23.000 del 401(k) de un empleado.
    4. **Flexibilidad**: puedes elegir cuándo reconocer ingresos, diferirlos a años
       con menos ingresos o adelantar deducciones a años altos.

    ## El análisis de equilibrio

    Si una empresa ofrece $100k en W-2 frente a un contrato freelance de $115k:
    - SE tax extra ≈ $7.650
    - Ingresos extra: $15.000
    - Ventaja neta del freelance: ~$7.350 antes de deducciones

    Suma las deducciones (despacho en casa, seguro médico, jubilación) y la opción
    freelance de $115k suele quedar bastante por delante de los $100k.

    Calcula tus impuestos de freelance con el [estimador de impuestos freelance](/tools/freelance-tax-estimator/).
"quarterly-estimated-tax-dates":
  "title": "Fechas de los pagos trimestrales de impuestos estimados 2024–2025 (guía freelance)"
  "description": "¿Cuándo vencen los pagos trimestrales de impuestos estimados? Plazos exactos del IRS para 2024 y 2025, reglas de «safe harbor» y qué pasa si te saltas un pago."
  "body": |
    El IRS exige a los trabajadores autónomos pagar impuestos estimados cuatro
    veces al año. Saltarse un plazo conlleva penalizaciones por pago insuficiente,
    ahora mismo de alrededor del 8 % anual sobre lo que falta.

    ## Vencimientos de 2024

    | Trimestre | Periodo cubierto | Vencimiento |
    |---|---|---|
    | T1 | 1 ene – 31 mar | **15 de abril de 2024** |
    | T2 | 1 abr – 31 may | **17 de junio de 2024** |
    | T3 | 1 jun – 31 ago | **16 de septiembre de 2024** |
    | T4 | 1 sep – 31 dic | **15 de enero de 2025** |

    ## Vencimientos de 2025

    | Trimestre | Periodo cubierto | Vencimiento |
    |---|---|---|
    | T1 | 1 ene – 31 mar | **15 de abril de 2025** |
    | T2 | 1 abr – 31 may | **16 de junio de 2025** |
    | T3 | 1 jun – 31 ago | **15 de septiembre de 2025** |
    | T4 | 1 sep – 31 dic | **15 de enero de 2026** |

    ## Reglas de «safe harbor»

    Evitas las penalizaciones si pagas:
    - **Opción A**: el 90 % del impuesto del año en curso, O
    - **Opción B**: el 100 % del impuesto del año anterior (110 % si tu AGI supera $150.000)

    La opción B es popular entre freelancers con ingresos variables: pagas lo que
    debiste el año pasado en cuatro plazos iguales, sin tener que prever con
    precisión los ingresos del año.

    ## Cómo pagar

    Paga en [IRS Direct Pay](https://www.irs.gov/payments/direct-pay) (gratis, sin
    registro) o mediante EFTPS (Electronic Federal Tax Payment System). La mayoría
    de estados tienen sus propios pagos estimados con plazos parecidos: consulta la
    web de la agencia tributaria de tu estado.

    Estima tu pago con el [estimador de impuestos freelance](/tools/freelance-tax-estimator/).
"self-employment-tax-deductions":
  "title": "Las principales deducciones fiscales para freelancers y autónomos"
  "description": "Las deducciones fiscales más valiosas para freelancers: despacho en casa, seguro médico, jubilación, equipos y la deducción de la mitad de la SE tax explicada."
  "body": |
    Cada deducción legítima del negocio reduce tu beneficio neto y, con él, tanto
    tu SE tax (15,3 %) como tu impuesto sobre la renta. Una deducción de $10.000 a
    un tipo combinado del 30 % ahorra $3.000 en impuestos.

    ## 1. La mitad de la SE tax

    El IRS te permite deducir el 50 % de tu SE tax de los ingresos brutos antes de
    calcular el impuesto sobre la renta. Si tu SE tax es de $12.240, deduces
    $6.120. Es automático: no necesitas justificantes.

    ## 2. Deducción por despacho en casa

    **Método simplificado**: $5 por pie cuadrado de espacio de oficina dedicado (máximo $1.500)
    **Método de gastos reales**: prorratear los gastos de la vivienda (hipoteca o
    alquiler, suministros, seguro) según el porcentaje de la casa usado
    exclusivamente para el negocio.

    La oficina debe usarse *de forma regular y exclusiva* para el negocio: un
    escritorio en un salón compartido no cuenta.

    ## 3. Primas del seguro médico

    Si pagas tu propio seguro médico (no a través del plan de empresa de tu
    pareja), el 100 % de las primas se deduce de los ingresos brutos (no solo como
    deducción detallada). Incluye seguros dental y de visión.

    ## 4. Aportaciones a la jubilación

    - **SEP-IRA**: hasta el 25 % de los ingresos netos como autónomo, máximo $69.000 (2024)
    - **Solo 401(k)**: $23.000 como empleado + 25 % como empleador
    - **Roth IRA**: $7.000 de aportación; no deducible, pero crece libre de impuestos

    SEP-IRA y Solo 401(k) son las deducciones con más impacto para un freelance.
    Con $100k de beneficio neto, un SEP-IRA al máximo ahorra ~$7.000–$10.000 en
    impuestos.

    ## 5. Equipos y software del negocio

    Ordenadores, cámaras, micrófonos, suscripciones de software, servicios cloud,
    coworking, libros y cursos profesionales: todo es deducible si se usa para el
    negocio. La sección 179 permite deducir el coste completo el primer año en
    lugar de amortizarlo.

    ## 6. Servicios profesionales

    Los honorarios de contabilidad, los gastos legales del negocio y las primas
    del seguro de responsabilidad profesional son totalmente deducibles.

    Estima tus impuestos después de deducciones con el [estimador de impuestos freelance](/tools/freelance-tax-estimator/).
"employer-payroll-tax-guide-us":
  "title": "Cotizaciones del empleador en EE. UU.: guía 2024"
  "description": "Guía completa de las cotizaciones federales del empleador en EE. UU. (Social Security, Medicare, FUTA) con tipos, bases de 2024 y ejemplos de cálculo."
  "body": |
    Como empleador en EE. UU., pagas cotizaciones además del salario bruto de cada
    empleado. Esto es lo que debes y cómo se calcula.

    ## Cotizaciones federales del empleador (2024)

    ### Social Security (OASDI): 6,2 %
    Tipo: 6,2 % sobre salarios hasta $168.600 (base de 2024; confirma la del año en curso)
    El empleado también paga un 6,2 %; la FICA total es del 12,4 %, a partes iguales.

    ### Medicare: 1,45 %
    Tipo: 1,45 % sobre todo el salario, sin límite.
    El empleado también paga un 1,45 % (+ 0,9 % de Medicare adicional sobre salarios de más de $200k, solo a cargo del empleado).

    ### FUTA (impuesto federal de desempleo): 0,6 %
    Tipo: 6,0 % sobre los primeros $7.000 del salario de cada empleado.
    La mayoría de empleadores reciben un crédito del 5,4 % por pagar el impuesto estatal de desempleo (SUTA), lo que reduce el tipo efectivo al **0,6 %**.

    ## Ejemplo de cálculo: salario de $80.000

    | Impuesto | Cálculo | Coste para el empleador |
    |-----|-------------|--------------|
    | Social Security | $80.000 × 6,2 % | $4.960 |
    | Medicare | $80.000 × 1,45 % | $1.160 |
    | FUTA | $7.000 × 0,6 % | $42 |
    | **Total** | | **$6.162** |

    Coste laboral total = $80.000 + $6.162 = **$86.162**

    Los tipos SUTA varían según el estado (0,1 %–más del 10 %) y el historial de
    despidos. Modela siempre aparte el tipo de tu estado.

    Usa la [calculadora de cotizaciones del empleador](/tools/payroll-tax-calculator/)
    para calcular el coste de cualquier salario.
"suta-futa-payroll-taxes-explained":
  "title": "SUTA y FUTA: los impuestos de desempleo estatal y federal explicados"
  "description": "Cómo se combinan FUTA y SUTA en los impuestos de desempleo del empleador: tipos, bases, mecánica del crédito y qué provoca un ajuste por historial."
  "body": |
    La mayoría de empleadores en EE. UU. pagan dos sistemas de impuestos de
    desempleo a la vez: FUTA (federal) y SUTA (estatal). Así interactúan.

    ## FUTA: impuesto federal de desempleo

    **Tipo**: 6,0 % sobre los primeros $7.000 del salario de cada empleado.
    **Tipo efectivo neto**: 0,6 % para la mayoría de empleadores.
    **Por qué es más bajo**: los empleadores que pagan la SUTA a tiempo y completa
    reciben un crédito del 5,4 %, que reduce el tipo efectivo al 0,6 %.

    La FUTA financia el sistema federal de seguro de desempleo y los préstamos a
    los programas estatales.

    ## SUTA: impuesto estatal de desempleo

    Los tipos varían según el estado y el historial del empleador:
    - Empleadores nuevos: normalmente 1–4 % (según el estado)
    - Empleadores consolidados: del 0,1 % a más del 10 % (según el historial de prestaciones)
    - Bases salariales: desde $7.000 (mínimo federal) hasta más de $62.500 (estado de Washington)

    ## El sistema de calificación por historial

    Tu tipo SUTA se recalcula cada año según tu historial de despidos:
    - **Pocos despidos** → el tipo baja («experiencia negativa»)
    - **Muchos despidos** → el tipo sube («experiencia positiva» en sentido fiscal)

    Los empleadores con despidos masivos pueden perder el crédito FUTA (estados con
    reducción de crédito).

    ## Impacto en las decisiones de contratación

    Antes de despedir, ten en cuenta que una sola solicitud de prestación puede
    subir tu tipo SUTA durante 3 años o más. Con un salario de $100k y un 2 % de
    SUTA, subir un punto = ~$500 al año por empleado sobre la base.

    Usa la [calculadora de cotizaciones del empleador](/tools/payroll-tax-calculator/)
    para calcular tus cotizaciones federales. Añade la SUTA aparte según el tipo
    de tu estado.
"vat-on-digital-services":
  "title": "IVA en servicios digitales: normas para SaaS y empresas de software"
  "description": "Cómo se aplica el IVA a las suscripciones SaaS, el software y los productos digitales vendidos a clientes de Reino Unido y la UE, incluido el umbral de la ventanilla única (OSS)."
  "body": |
    Si vendes SaaS, licencias de software u otros servicios digitales, las normas
    de IVA son bastante más complejas que con bienes físicos. Esto es lo que
    necesitas saber.

    ## IVA de la UE en servicios digitales (el «principio de destino»)

    Desde 2015, los servicios digitales vendidos a consumidores de la UE tributan
    donde está el **cliente**, no donde estás tú. Esto significa que:

    - Una SaaS estadounidense que cobra a un consumidor francés debe aplicar el IVA francés (20 %)
    - Una SaaS británica que cobra a una empresa alemana aplica el 0 % (inversión del sujeto pasivo B2B)
    - Un desarrollador australiano que vende una app a consumidores italianos debe aplicar el IVA italiano (22 %)

    **Umbral OSS de la UE**: si tus ventas digitales totales a consumidores de la
    UE superan los 10.000 € al año, debes registrarte a efectos de IVA (en cada
    país o mediante la ventanilla única OSS de la UE). Por debajo, puedes aplicar
    el tipo de tu propio país.

    ## B2B o B2C: la distinción clave

    Las normas anteriores se aplican al **B2C** (venta a consumidores). En **B2B**
    (venta a otras empresas registradas a efectos de IVA) se aplica la inversión
    del sujeto pasivo:
    - Facturas al 0 % (o sin IVA)
    - El cliente empresa declara el IVA en su propio país
    - Debes obtener y verificar su número de IVA

    ## Normas de Reino Unido tras el Brexit

    Reino Unido tiene su propio régimen de IVA para servicios digitales. Las
    empresas no británicas con ventas digitales en Reino Unido de más de £8.818 al
    año deben registrarse en el IVA británico (actualmente del 20 %) y presentar
    declaraciones separadas de las de la UE.

    Usa nuestra [calculadora de IVA](/tools/vat-calculator/) para calcular el
    importe correcto a cualquier tipo, y consulta los umbrales vigentes en la web
    de la administración tributaria de tu país.
"vat-rates-by-country-2024":
  "title": "Tipos de IVA por país en 2024: Reino Unido, UE, Australia, Canadá"
  "description": "Lista completa de tipos generales de IVA/GST por país en 2024, con los tipos reducidos para bienes esenciales y las normas de servicios digitales."
  "body": |
    El IVA, el GST (impuesto sobre bienes y servicios) y el impuesto sobre ventas
    son impuestos al consumo, pero sus tipos, normas y nombres cambian según el
    país. Estos son los tipos generales de los destinos comerciales más habituales.

    ## Tipos generales de IVA/GST en 2024

    | País | Tipo general | Tipo reducido | Notas |
    |---------|--------------|--------------|-------|
    | Reino Unido | 20 % | 5 % | 0 % en alimentación y artículos infantiles |
    | Alemania | 19 % | 7 % | |
    | Francia | 20 % | 5,5 % / 10 % | |
    | Italia | 22 % | 10 % / 5 % | |
    | España | 21 % | 10 % | |
    | Países Bajos | 21 % | 9 % | |
    | Suecia | 25 % | 6 % / 12 % | El más alto de la UE |
    | Noruega | 25 % | 15 % | Fuera de la UE |
    | Australia | GST 10 % | N/A | Tipo único |
    | Canadá | GST 5 % | N/A | Más el PST provincial |
    | Nueva Zelanda | GST 15 % | N/A | |
    | India | GST 18 % | 5 % / 12 % | Varios tramos |
    | Estados Unidos | 0 % (federal) | — | Solo impuesto estatal sobre ventas |

    ## Normas de IVA para servicios digitales

    Si vendes productos digitales (software, ebooks, suscripciones SaaS) a
    consumidores de la UE, debes aplicar el IVA al tipo del país del cliente, no
    al de tu país, aunque estés fuera de la UE. La ventanilla única OSS de la UE lo
    simplifica permitiendo presentar una sola declaración de IVA europea.

    Reino Unido tiene normas parecidas desde el Brexit: las empresas no británicas
    que venden servicios digitales a consumidores británicos deben registrarse en
    el IVA británico si sus ventas superan £8.818 al año.

    Usa nuestra [calculadora de IVA](/tools/vat-calculator/) para añadir o quitar el
    IVA a cualquier tipo.
"vat-reverse-charge-b2b-eu-explained":
  "title": "La inversión del sujeto pasivo del IVA en ventas B2B en la UE, explicada"
  "description": "Cómo funciona la inversión del sujeto pasivo del IVA europeo en ventas B2B transfronterizas, cuándo se aplica y qué debe aparecer en la factura."
  "body": |
    Si vendes servicios digitales o bienes B2B a clientes de otros países de la UE,
    seguramente has visto «inversión del sujeto pasivo» en una plantilla de
    factura: es una de las partes del IVA europeo que peor entienden los
    vendedores de fuera de la UE.

    ## Qué significa realmente la inversión del sujeto pasivo

    Normalmente, el vendedor cobra el IVA y lo ingresa en Hacienda. Con la
    inversión del sujeto pasivo, es el **comprador** quien autoliquida el IVA: lo
    declara en su propia declaración como IVA devengado y (normalmente) como IVA
    soportado totalmente deducible, lo que da cero para una empresa con plena
    deducción. El vendedor factura con **0 % de IVA**.

    ## Cuándo se aplica

    - La venta es **B2B** (el comprador está registrado a efectos de IVA en otro país de la UE)
    - El comprador facilita un **número de IVA válido** que tú verificas (con el sistema VIES de la UE)
    - **No** se aplica a las ventas B2C, que siguen las normas de IVA de la UE para
      servicios digitales (tipo del país del comprador)

    ## Qué debe aparecer en la factura

    - Los números de IVA de ambas partes
    - La mención «Inversión del sujeto pasivo» o «Inversión del sujeto pasivo, artículo 196 de la Directiva del IVA de la UE»
    - Ningún importe de IVA (0 %)

    ## Por qué existe

    La inversión del sujeto pasivo evita que un vendedor extranjero tenga que
    registrarse en el IVA de cada país comprador en sus ventas B2B: sin ella, una
    SaaS estadounidense o británica que vende a empresas de los 27 Estados
    miembros necesitaría decenas de registros locales. Traslada la carga de
    cumplimiento al comprador, que ya tiene registro de IVA y es quien mejor puede
    autoliquidarlo correctamente.

    ## Qué puede salir mal

    Cobrar IVA cuando debía aplicarse la inversión impide que el comprador lo
    recupere por la vía normal y supone haber cobrado un impuesto que no tocaba. Y
    al revés: aplicar la inversión sin verificar el número de IVA del comprador
    (porque es inválido o el comprador no está realmente registrado) puede dejarte
    como responsable del IVA que deberías haber cobrado.

    ## Preguntas frecuentes

    **¿Tengo que verificar el número de IVA cada vez?**
    Sí: usa la herramienta VIES de la UE antes de cada nuevo cliente B2B y guarda
    constancia de la verificación en tu expediente de cumplimiento.

    **¿Y las ventas desde Reino Unido tras el Brexit?**
    Las ventas B2B de Reino Unido a la UE suelen seguir teniendo un tratamiento
    similar a tipo cero, pero las normas británicas se han separado del marco
    europeo: consulta las indicaciones actuales de HMRC en lugar de dar por hecho
    que las normas de la UE se aplican sin cambios.

    Usa la [calculadora de IVA](/tools/vat-calculator/) para los cálculos habituales
    con y sin IVA en las operaciones en las que sí se aplica.

"commission-accelerators-explained":
  "title": "Los aceleradores de comisiones de ventas, explicados"
  "description": "Cómo funcionan los tramos de aceleradores en los planes de comisiones, por qué existen y cómo modelar la retribución total con distintos niveles de cumplimiento."
  "body": |
    Un acelerador es una tasa de comisión más alta que se activa cuando un
    comercial supera el 100 % de su cuota: es el mecanismo que premia el
    sobrecumplimiento en lugar de poner techo a las ganancias al alcanzar el
    objetivo.

    ## Una estructura de aceleradores típica

    | Cumplimiento | Tasa de comisión |
    |-----------|------------------|
    | 0–100 % de la cuota | Tasa base (por ejemplo, 10 %) |
    | 100–150 % de la cuota | 1,5 × la tasa base (15 %) |
    | Más del 150 % de la cuota | 2 × la tasa base (20 %) |

    Un comercial que cierra justo en su cuota cobra la tasa base sobre todos los
    ingresos. Uno que cierra al 160 % cobra la tasa base hasta el 100 %, la tasa
    acelerada en el tramo 100–150 % y la tasa máxima en todo lo que supera el
    150 %: cada tramo se calcula por separado, sin aplicarse de forma retroactiva
    al total.

    ## Por qué usar aceleradores en lugar de una tasa fija

    Una tasa fija crea un techo natural a la ambición: una vez alcanzada la cuota,
    el incentivo marginal para seguir empujando cae mucho si justo después viene
    otra cuota. Los aceleradores mantienen vivo durante todo el periodo el
    incentivo de cerrar «una venta más», justo el comportamiento que genera
    trimestres excepcionales.

    ## La otra cara: los deceleradores

    Algunos planes incluyen lo contrario: una tasa reducida por debajo de un
    cumplimiento mínimo (por ejemplo, menos del 50 % de la cuota), para evitar que
    los comerciales aplacen ventas al periodo siguiente cuando saben que no
    llegarán en el actual. Los deceleradores son menos habituales que los
    aceleradores y más polémicos, porque también pueden castigar a comerciales por
    circunstancias ajenas a ellos.

    ## Modelar la retribución total con aceleradores

    Para estimar las ganancias anuales, no multipliques sin más el cumplimiento
    esperado por la tasa base: calcula la comisión tramo a tramo según el
    porcentaje de cumplimiento. Un comercial que cierra siempre al 120 % gana
    bastante más de 1,2 veces la comisión a tasa base cuando se tienen en cuenta
    los aceleradores.

    ## Preguntas frecuentes

    **¿Los aceleradores se aplican por venta o por periodo?**
    Casi siempre por periodo (mensual, trimestral o anual) según el cumplimiento
    acumulado, no por venta individual.

    **¿Son habituales los aceleradores para SDR además de AE?**
    Menos en SDR, cuya retribución suele depender del pipeline generado y no de los
    ingresos cerrados, pero cada vez más empresas los usan para premiar a sus
    mejores SDR igual que a los AE.

    Usa la [calculadora de comisiones](/tools/commission-calculator/) para modelar
    tu retribución total y tu cumplimiento del OTE con un nivel de ingresos dado.
"how-to-structure-sales-commission-plan":
  "title": "Cómo estructurar un plan de comisiones de ventas"
  "description": "Un buen plan de comisiones alinea los incentivos de los comerciales con los objetivos de ingresos. Sus componentes clave son el OTE, el diseño de la cuota, el calendario de pagos, los aceleradores y las cláusulas de devolución."
  "body": |
    Un plan de comisiones que los comerciales entienden y en el que confían es una
    de las herramientas de crecimiento más potentes. Un plan que los confunde o
    frustra genera rotación.

    ## Los 5 componentes clave

    **1. OTE y reparto**: define la retribución total al 100 % de la cuota y el reparto fijo/variable. La mayoría de planes de AE en SaaS apuntan a 50/50 en mid-market y 60/40 en enterprise.

    **2. Cuota**: la cuota anual debe ser 4–7 veces el OTE para que el negocio mantenga una economía unitaria sana. Un comercial con $150k de OTE necesita una cuota de $600k–$1M de ARR.

    **3. Calendario de pagos**: pagar a la firma del contrato, a la facturación o al cobro. Los planes a la firma son más sencillos; los planes al cobro protegen frente a malas ventas.

    **4. Aceleradores**: tasas de comisión escalonadas por encima del 100 % de la cuota. Imprescindibles para atraer y retener a los mejores.

    **5. Devoluciones (clawbacks)**: la comisión se devuelve si el cliente se da de baja en 90–180 días. Protege frente a ventas forzadas e incentivos mal alineados.

    ## Errores habituales

    - **Poner techo a las ganancias**: los techos desmotivan a los mejores, que dejan de empujar al alcanzarlo. Los aceleradores funcionan mejor.
    - **Mecánicas demasiado complejas**: si un comercial no puede calcular su comisión de cabeza, el plan es demasiado complejo.
    - **Cambios frecuentes**: cambiar la estructura del plan a mitad de año erosiona la confianza. Haz cambios solo al inicio del ejercicio.
"what-is-on-target-earnings":
  "title": "¿Qué es el OTE (On-Target Earnings)?"
  "description": "El OTE (On-Target Earnings) es la retribución anual total de un comercial exactamente al 100 % de su cuota, sumando salario fijo y comisión variable. Es la referencia para diseñar planes de retribución comercial."
  "body": |
    El **OTE (On-Target Earnings)** define la retribución total al 100 % de la cuota. Es la cifra que citan los reclutadores y a la que apuntan los comerciales.

    $$\text{OTE} = \text{Salario fijo} + \text{Comisión al 100 \% de la cuota}$$

    ## Repartos del OTE

    La proporción entre fijo y variable en el OTE:

    | Puesto | Reparto habitual | Motivo |
    |------|--------------|-----------|
    | SDR / BDR | 70/30 | Se centra en la actividad, no en ingresos cerrados |
    | Account Executive | 50/50 | Incentivo equilibrado para cerrar |
    | AE enterprise | 60/40 | Ciclos más largos; más fijo para cubrir huecos |
    | Responsable de ventas | 60/40 | Premia el rendimiento del equipo |

    ## Aceleradores

    La mayoría de planes bien diseñados incluyen aceleradores por encima del 100 % del OTE: tasas de comisión más altas para los ingresos por encima de la cuota. Estructura habitual:
    - 0–50 %: 50 % de la tasa estándar
    - 50–100 %: 100 % de la tasa estándar
    - 100–125 %: 150 % de la tasa estándar
    - Más del 125 %: 200 % de la tasa estándar

    Este diseño premia de forma más que proporcional a quienes superan objetivos y retiene a los mejores.

    ## Por qué importa el OTE

    Un comercial que conoce su OTE puede calcular los ingresos necesarios para alcanzar cualquier objetivo de retribución. Usa la calculadora de comisiones para modelar distintos escenarios de cumplimiento antes de aceptar un nuevo puesto.
"contractor-vs-employee-cost":
  "title": "Coste de un contratista frente a un empleado: cuándo tiene sentido cada uno"
  "description": "Un marco financiero para decidir entre contratar a un contratista o a un empleado: comparación del coste completo, cálculo ajustado al riesgo y análisis del punto de equilibrio."
  "body": |
    La idea habitual («los contratistas son caros, los empleados salen más baratos
    a largo plazo») suele ser cierta, pero exige hacer bien las cuentas. Así se
    compara.

    ## La ecuación de coste básica

    **Coste total del empleado** = salario × 1,25–1,40 (cotizaciones + beneficios)

    **Coste del contratista** = tarifa por hora × horas trabajadas

    Con una tarifa de $100 durante 2.080 horas (jornada completa): $208.000 al año

    Empleado equivalente con $120k de salario, todo incluido: $156.000 al año

    En este caso el empleado sale claramente más barato, pero solo si necesitas a
    alguien a jornada completa, todo el año y con las mismas habilidades.

    ## Cuándo salen más baratos los contratistas

    1. **Necesidad a tiempo parcial**: menos de 20 horas a la semana (menos de
       1.040 horas al año); el sobrecoste del empleado se desperdicia en capacidad
       ociosa.

    2. **Proyecto corto**: 3–6 meses; evitas costes de selección, indemnizaciones
       y alta de beneficios para un encargo limitado.

    3. **Habilidades especializadas**: un especialista a $200 la hora durante
       40 horas ($8.000) cuesta menos que contratar a un especialista de $150k al
       año para un trabajo puntual.

    4. **Rapidez**: un contratista puede empezar en días; un empleado lleva 30–90
       días de búsqueda e incorporación.

    ## Costes ocultos de empleados y contratistas

    | Factor | Empleado | Contratista |
    |---|---|---|
    | Coste de selección | $5k–$30k | Mínimo |
    | Tiempo de incorporación | 2–6 meses | Días |
    | Riesgo de indemnización | Sí | No |
    | Coste de beneficios | $15k–$25k al año | Ninguno |
    | Carga de gestión | Mayor | Menor |
    | Cesión de propiedad intelectual | Clara | Requiere contrato |
    | Riesgo de cumplimiento | Menor (W-2) | Riesgo de clasificación errónea |

    ## La fórmula del punto de equilibrio

    ¿A qué tarifa se iguala un contratista con un empleado?

    **Tarifa de equilibrio del contratista** = (salario × 1,30) ÷ horas necesarias

    Para un empleado de $100k que se necesita 1.040 horas al año: ($130k ÷ 1.040) = **$125 la hora**

    Si el contratista cobra más de $125 la hora por 1.040 horas, el empleado sale
    más barato en el margen. Si cobra menos, sale más barato el contratista.

    Haz tus cuentas con la [calculadora de coste de un empleado](/tools/employee-cost-calculator/).
"employee-cost-calculator/employer-payroll-taxes-explained":
  "title": "Cotizaciones del empleador explicadas: FICA, FUTA y SUTA"
  "description": "¿Qué son las cotizaciones del empleador en EE. UU.? Tipos y bases de FICA, FUTA y SUTA, y cómo calcular lo que debes como empleador."
  "body": |
    Como empleador, pagas tres grandes categorías de cotizaciones sobre el
    salario de cada empleado. Son aparte de lo que debe el empleado y salen
    directamente de tu presupuesto.

    ## FICA: Social Security y Medicare

    **Social Security**: 6,2 % sobre salarios hasta $168.600 (base de 2024)
    **Medicare**: 1,45 % sobre todo el salario (sin límite)
    **Medicare adicional**: 0,9 % sobre salarios de más de $200.000, pero es la
    parte del *empleado*, no del empleador

    **FICA total del empleador**: **7,65 %** sobre salarios hasta $168.600 y
    **1,45 %** por encima.

    Con $100k de salario: FICA = $7.650
    Con $200k de salario: FICA = ($168.600 × 7,65 %) + ($31.400 × 1,45 %) = $12.898 + $455 = $13.353

    ## FUTA: impuesto federal de desempleo

    **Tipo**: 6 % sobre los primeros $7.000, reducido a un **0,6 % efectivo** para
    empleadores de estados al corriente con el fondo federal de desempleo (todos
    salvo unos pocos)

    **Máximo por empleado**: $7.000 × 0,6 % = **$42 al año**

    La FUTA es un coste menor ($42 por empleado), pero hay que declararla cada
    trimestre y cada año.

    ## SUTA: impuesto estatal de desempleo

    Cada estado fija su base y su tipo:
    - **California**: 3,4 % sobre los primeros $7.000 (tipo de empleador nuevo)
    - **Nueva York**: 3,4 % sobre los primeros $12.500
    - **Texas**: 2,7 % sobre los primeros $9.000
    - **Florida**: 2,7 % sobre los primeros $7.000

    Los tipos cambian según tu «calificación por historial»: los empleadores con
    pocos despidos consiguen tipos más bajos con el tiempo.

    ## Referencia rápida: coste para el empleador con salarios habituales

    | Salario | FICA | FUTA | SUTA (media 2,7 %) | Total |
    |---|---|---|---|---|
    | $60.000 | $4.590 | $42 | $189 | $4.821 |
    | $100.000 | $7.650 | $42 | $189 | $7.881 |
    | $150.000 | $11.475 | $42 | $189 | $11.706 |

    Calcula el coste total de un empleado con la [calculadora de coste de un empleado](/tools/employee-cost-calculator/).
"true-cost-of-hiring-an-employee":
  "title": "El coste real de contratar a un empleado: más allá del salario base"
  "description": "El desglose completo de lo que cuesta de verdad un empleado: cotizaciones, seguro médico, 401k y cómo usar la regla del 1,3x para presupuestar plantilla."
  "body": |
    Cuando un candidato pide $120.000 de salario, el coste real para tu empresa
    está entre $150.000 y $175.000 al año. Aquí tienes el porqué y cómo
    presupuestarlo.

    ## Todos los costes de un empleado

    ### 1. Salario base
    La base. Todo lo demás se calcula encima.

    ### 2. Cotizaciones del empleador (7,65–8,5 %)

    - **FICA**: 6,2 % de Social Security (con límite de $168.600 en 2024) + 1,45 % de Medicare (sin límite)
    - **FUTA**: 0,6 % sobre los primeros $7.000 ≈ $42 por empleado al año
    - **SUTA**: según el estado y el historial, ~2,7 % de media sobre los primeros $7.000–$56.500

    Con $120k de salario: cotizaciones ≈ $9.640

    ### 3. Seguro médico (la mayor variable)

    Según la encuesta 2024 de la Kaiser Family Foundation:
    - Cobertura individual: **$8.435 al año** de media a cargo de la empresa
    - Cobertura familiar: **$17.393 al año** de media a cargo de la empresa

    En una startup que ofrece cobertura individual a toda la plantilla: +$8.435 por empleado

    ### 4. Jubilación

    - Aportación del 4 % al 401(k) sobre $120k = **$4.800 al año**
    - Algunas empresas ofrecen planes Safe Harbor (3 % no condicionado) = **$3.600 al año**

    ### 5. Otros beneficios

    - Seguro de vida e invalidez: $300–$800 al año
    - Aportación de la empresa a FSA/HSA: $500–$1.500 al año
    - Presupuesto de formación: $500–$3.000 al año
    - Stock options o RSU: muy variable

    ## Las cuentas completas

    | Componente | Importe |
    |---|---|
    | Salario base | $120.000 |
    | Cotizaciones | $9.640 |
    | Seguro médico (individual) | $8.435 |
    | Aportación 401(k) (4 %) | $4.800 |
    | Otros beneficios | $1.000 |
    | **Total (sin bonus)** | **$143.875** |

    Multiplicador: 1,20x sin bonus, 1,30–1,35x con un bonus del 10–15 %.

    Usa la [calculadora de coste de un empleado](/tools/employee-cost-calculator/)
    para modelar tus cifras concretas.
"how-to-calculate-employee-turnover-rate":
  "title": "Cómo calcular la tasa de rotación de empleados"
  "description": "La fórmula paso a paso de la tasa de rotación, cómo calcular bien la plantilla media y los errores de cálculo habituales que conviene evitar."
  "body": |
    La tasa de rotación es una de las métricas de RR. HH. más fáciles de calcular,
    y una de las más fáciles de desvirtuar usando la plantilla equivocada como
    denominador.

    ## La fórmula

    $$\text{Tasa de rotación} = \frac{\text{Bajas}}{\text{Plantilla media}} \times 100$$

    $$\text{Plantilla media} = \frac{\text{Plantilla inicial} + \text{Plantilla final}}{2}$$

    ## Un ejemplo con números

    Empiezas el año con 80 empleados, lo terminas con 100 y 15 personas se
    marcharon durante el año (bajas voluntarias e involuntarias juntas).

    Plantilla media = (80 + 100) ÷ 2 = 90
    Tasa de rotación = 15 ÷ 90 × 100 = **16,7 %**

    No es 15 ÷ 100 (plantilla final) ni 15 ÷ 80 (plantilla inicial): usar la media
    es el método estándar de la SHRM, y pesa más cuanto más rápido creces o te
    reduces.

    ## Rotación mensual o anual

    Calcular la rotación mensual y multiplicarla por 12 sobrestima la anual,
    porque no tiene en cuenta el efecto acumulado: el mismo empleado no puede irse
    dos veces. Para una cifra anual precisa, suma las bajas reales de los 12 meses
    y divídelas entre la plantilla media de esos 12 meses, en lugar de anualizar la
    tasa de un solo mes.

    ## Rotación voluntaria e involuntaria

    La tasa total mezcla bajas voluntarias (dimisiones) e involuntarias
    (despidos, ceses). Síguelas por separado: un pico de bajas voluntarias indica
    un problema de retención; uno de involuntarias, un problema de selección o de
    gestión del rendimiento. Mezclarlas oculta qué palanca tocar.

    ## Preguntas frecuentes

    **¿Las jubilaciones cuentan como rotación?**
    La mayoría de equipos de RR. HH. las cuentan como bajas voluntarias en la tasa
    bruta, pero las separan en el análisis, porque rara vez se pueden evitar y no
    indican insatisfacción.

    **¿Qué cuenta como «baja»? ¿Incluye los traslados internos?**
    No. Los traslados y ascensos internos no son rotación; solo cuentan las
    personas que dejan la organización por completo.

    Usa la [calculadora de rotación de empleados](/tools/employee-turnover-calculator/)
    para calcular tu tasa automáticamente a partir de las bajas y la plantilla.
"employee-turnover-calculator/true-cost-of-employee-turnover":
  "title": "El coste real de la rotación de empleados"
  "description": "Por qué sustituir a un empleado cuesta entre el 33 % y el 200 % de su salario anual, qué impulsa ese coste y cómo estimar el impacto financiero total de tu tasa de rotación."
  "body": |
    La mayoría de responsables subestiman el coste de la rotación porque solo miran
    las partidas visibles (portales de empleo, comisiones de agencias) e ignoran
    los costes ocultos, mucho mayores, de la productividad perdida y la curva de
    aprendizaje.

    ## Qué compone realmente el coste

    - **Coste de la vacante**: la producción perdida mientras el puesto está vacío,
      más la carga para los compañeros que cubren el hueco
    - **Coste de selección**: anuncios, honorarios de agencias (normalmente un
      15–25 % del salario del primer año con reclutadores externos) y tiempo de
      entrevistas interno
    - **Incorporación y formación**: programas de formación y el tiempo que
      mandos y compañeros dedican a que la nueva persona sea productiva
    - **Pérdida de productividad en la curva**: una nueva incorporación suele rendir
      por debajo de su nivel pleno durante 3–6 meses, a veces más en puestos
      especializados o senior

    ## Las referencias de la SHRM

    La SHRM (Society for Human Resource Management) sitúa el coste total de
    sustitución en **un 33 % del salario anual en puestos de nivel inicial**, hasta
    **un 150–200 % en puestos senior o muy especializados**. En un puesto de
    $70.000, eso son $23.000–$140.000 por salida según la antigüedad.

    ## Por qué esta cifra sorprende a la mayoría de directivos

    La diferencia entre el coste «evidente» (honorarios de selección, quizá
    $5.000–$10.000) y el real (que incluye meses de productividad por debajo del
    máximo y el trastorno para el equipo) suele ser de 5 a 10 veces. El coste de la
    rotación es casi invisible en una cuenta de resultados normal porque se reparte
    en la masa salarial en lugar de figurar como partida propia.

    ## Convertir la cifra en un caso de negocio para retener talento

    Con una rotación anual del 20 % en un equipo de 50 personas con un salario
    medio de $80.000, son 10 salidas al año a, siendo prudentes, el 75 % del
    salario: $600.000 al año. Una iniciativa de retención (mejor incorporación,
    formación de mandos, revisiones salariales) que baje la rotación al 15 % ahorra
    $150.000 al año, lo que financia de sobra la mayoría de programas.

    ## Preguntas frecuentes

    **¿Esta estimación incluye las indemnizaciones?**
    No directamente: la calculadora se centra en el coste de sustitución
    (selección, vacante, incorporación). Suma aparte las indemnizaciones y la
    continuidad de beneficios en las salidas involuntarias.

    **¿Es distinto el coste en puestos en remoto?**
    Los costes de vacante y de curva son parecidos; la selección puede salir más
    barata (más candidatos, sin reubicación), pero la incorporación suele tardar
    más sin acompañamiento presencial.

    Usa la [calculadora de rotación de empleados](/tools/employee-turnover-calculator/)
    para estimar el coste total de la rotación a partir del salario, la plantilla y
    la tasa de rotación.
"employee-benefits-cost-calculator":
  "title": "Coste total de un empleado: beneficios, cotizaciones y costes ocultos que paga la empresa"
  "description": "Desglose del coste completo de un empleado para la empresa, más allá del salario base: cotizaciones, beneficios, equipo y gastos generales."
  "body": |
    El salario base es solo una parte de lo que cuesta un empleado. Para
    presupuestar y decidir contrataciones necesitas el coste completo.

    ## Componentes del coste para el empleador

    **Costes obligatorios** (por ley):
    - Social Security: 6,2 % sobre los primeros $168.600
    - Medicare: 1,45 % (sin límite)
    - FUTA: 0,6 % sobre los primeros $7.000
    - Desempleo estatal (SUTA): 0,5–10 % según el estado y el historial
    - Seguro de accidentes laborales: 0,1–10 % según el sector y el estado

    **Beneficios voluntarios** (empleador típico en EE. UU.):
    - Seguro médico: $5.000–$15.000 al año por empleado (aportación de la empresa)
    - Dental/visión: $500–$1.500 al año
    - Aportación al 401(k): 3–5 % del salario
    - Seguro de vida: $300–$600 al año
    - Aportación a HSA: $0–$2.000 al año

    **Equipo y gastos generales**:
    - Portátil y periféricos: $1.500–$3.500 (anualizado)
    - Licencias de software (Slack, Zoom, herramientas): $1.000–$3.000 al año
    - Puesto y oficina: $3.000–$8.000 al año en presencial; ~$0 en remoto

    ## Regla práctica para presupuestar

    Coste total para el empleador = salario base × 1,25–1,45

    Para un salario de $100k: presupuesta $125k–$145k con todo incluido.

    ## La rotación se suma

    Si ese empleado se va, añade un 50–75 % del salario anual como coste de
    sustitución. Un empleado de $100k que se marcha cuesta otros $50k–$75k
    sustituirlo.

    Usa la [calculadora del coste de la rotación](/tools/employee-turnover-cost-calculator/)
    para modelar lo que te cuesta de verdad cada salida.
"employee-turnover-cost-calculator/true-cost-of-employee-turnover":
  "title": "El coste real de la rotación de empleados (y cómo reducirlo)"
  "description": "Desglose basado en estudios de lo que cuesta realmente la rotación: salida, vacante, selección, incorporación y curva de productividad."
  "body": |
    Perder a un empleado cuesta entre el 50 % y el 200 % de su salario anual. El
    rango es tan amplio porque la mayoría de organizaciones solo cuentan los
    honorarios de selección y se olvidan de todo lo demás.

    ## Los cinco componentes del coste

    **1. Costes de salida** (~4 % del salario)
    Entrevistas de salida, gestión de RR. HH., finiquito, aumento de la cotización
    por desempleo.

    **2. Costes de vacante** (coste diario × días hasta cubrir el puesto)
    El trabajo no se hace (producción perdida) o se reparte entre los compañeros
    (impuesto oculto sobre la productividad). Tiempo medio para cubrir un puesto:
    42 días en general; 84 días en puestos senior o especializados.

    **3. Costes de selección** (~15 % del salario)
    Los honorarios de agencia son del 15–25 % en puestos cualificados. La
    selección interna supone de media 80–100 horas por contratación, contando
    búsqueda, criba, entrevistas y ofertas.

    **4. Costes de incorporación** (~12 % del salario)
    Formación, documentación, tiempo del responsable, alta en sistemas y formación
    de cumplimiento.

    **5. Curva hasta la productividad** (~25 % del salario)
    Una nueva incorporación suele alcanzar el 80 % de productividad a los 3–6
    meses. La diferencia entre el 100 % y el 80 % durante ese periodo es un coste
    real en tu cuenta de resultados.

    **Total: ~56–60 % del salario anual en un puesto de nivel medio**
    En puestos senior (dirección y superiores), multiplica por 1,5–2.

    Usa la [calculadora del coste de la rotación](/tools/employee-turnover-cost-calculator/)
    para modelar lo que te cuesta de verdad cada salida.
"voluntary-vs-involuntary-turnover-cost":
  "title": "Rotación voluntaria frente a involuntaria: diferencias de coste"
  "description": "Por qué la rotación voluntaria y la involuntaria tienen perfiles de coste distintos, y por qué seguirlas por separado cambia lo que conviene arreglar."
  "body": |
    El coste total de la rotación sirve como cifra global, pero las salidas
    voluntarias e involuntarias tienen perfiles de coste bastante distintos y, sobre
    todo, apuntan a causas de fondo completamente diferentes.

    ## Por qué difiere el perfil de coste

    La **rotación voluntaria** (dimisiones) casi siempre cuesta más por salida. Es
    más difícil de prever, así que hay menos tiempo para planificar la transición,
    el traspaso de conocimiento suele ser apresurado o incompleto, y el efecto en la
    moral del equipo tiende a ser mayor: las salidas voluntarias, sobre todo de
    buenos profesionales, pueden provocar otras («contagio de la rotación»).

    La **rotación involuntaria** (despidos, ERE) es más previsible y planificable:
    la organización suele controlar el momento, puede preparar con antelación la
    transición y el traspaso, y el efecto en la moral puede ser menor si la salida
    se debió claramente al rendimiento o a la eliminación del puesto.

    ## Qué indica cada tipo

    | Tipo | Causas habituales | Qué arreglar |
    |------|---------------------|-------------|
    | Voluntaria | Brecha salarial, mala gestión, falta de carrera, encaje cultural | Programas de retención, formación de mandos, comparación salarial |
    | Involuntaria | Errores de selección, fallos en la gestión del rendimiento, reestructuración | Proceso de selección, incorporación, claridad del puesto |

    Una tasa voluntaria alta apunta hacia dentro: algo del día a día está echando
    a la gente. Una tasa involuntaria alta apunta al embudo de selección: se
    contrata a personas que no encajan con el puesto o las expectativas no se
    fijaron con claridad desde el principio.

    ## Rotación voluntaria lamentable y no lamentable

    No toda la rotación voluntaria cuesta lo mismo. Perder a un buen profesional
    («lamentable») supone el coste completo de sustitución más la pérdida de
    conocimiento e impulso. Perder a alguien de bajo rendimiento que probablemente
    habría salido de todos modos («no lamentable») tiene un perfil de coste mucho
    más cercano a una salida involuntaria planificada. Registra esta división si
    quieres saber cuánto daña de verdad la rotación al negocio.

    ## Preguntas frecuentes

    **¿Los despidos colectivos cuentan igual que los individuales?**
    Síguelos por separado: los despidos colectivos responden a la estrategia del
    negocio (reducción de costes, reestructuración) y no al rendimiento individual
    ni a la calidad de la selección, así que no deben mezclarse en un análisis de
    errores de contratación.

    **¿Las indemnizaciones cambian la comparación?**
    Sí: las salidas involuntarias suelen conllevar indemnizaciones que las
    voluntarias no tienen, lo que compensa en parte los mayores costes indirectos
    (contagio, traspaso apresurado) típicos de las voluntarias.

    Usa la [calculadora del coste de la rotación](/tools/employee-turnover-cost-calculator/)
    para estimar el coste total y registra por separado la rotación voluntaria e
    involuntaria para analizar sus causas.
"employee-vs-contractor-cost-comparison":
  "title": "Coste de un empleado frente a un contratista: las cuentas reales"
  "description": "Comparación financiera entre contratar a un empleado a jornada completa y a un contratista 1099, con el cálculo del punto de equilibrio y los casos en que cada uno sale más barato."
  "body": |
    La decisión entre empleado y contratista va más allá de comparar tarifas por
    hora. Sobre el papel, el empleado cuesta más por hora (cargas del empleador),
    pero el contratista factura más por hora. El equilibrio depende del puesto, la
    duración y el coste de los beneficios.

    ## El modelo de coste de un empleado

    Empleado a jornada completa con $120.000 de salario:
    - Salario: $120.000
    - Cotizaciones del empleador: ~$9.500
    - Seguro médico: ~$12.000 (aportación de la empresa)
    - Aportación al 401k (4 %): $4.800
    - Otros beneficios: ~$2.000
    - **Total: ~$148.300 al año = $71,30 la hora** (sobre 2.080 horas)

    Pero las horas de trabajo efectivas son menos. Con 15 días de vacaciones + 10
    festivos:
    - 2.080 horas − 200 de vacaciones/festivos = 1.880 horas efectivas
    - **Coste efectivo: ~$78,90 por hora de trabajo productivo**

    ## El modelo de coste de un contratista

    Contratista 1099 a $95 la hora:
    - Sin cotizaciones (ahorro de ~8 % frente al empleado)
    - Sin beneficios
    - Sin vacaciones pagadas
    - Sin acciones
    - **$95 × 2.000 horas = $190.000 al año** (equivalente a jornada completa)

    ## El cálculo del punto de equilibrio

    Tarifa de equilibrio = coste total del empleado / horas trabajadas

    Con $148.300 en total y 2.000 horas facturables: equilibrio = $74,15 la hora.

    Si un contratista cobra más de $74 la hora, el empleado sale más barato (a
    largo plazo y a jornada completa). Si cobra menos, sale más barato el
    contratista.

    ## Cuándo es mejor un contratista

    1. **Duración corta** (menos de 12–18 meses): los costes de alta de un
    empleado (selección, incorporación, indemnización) no compensan en encargos
    cortos.

    2. **Proyecto concreto**: un rediseño web de 3 meses no necesita una
    contratación fija.

    3. **Habilidades especializadas**: conocimiento de nicho que usarás durante un
    periodo definido.

    4. **Trabajo internacional**: contratistas en países con costes más bajos
    pueden entregar alta calidad con un coste completo bastante menor.

    ## Cuándo es mejor un empleado

    1. **Puesto continuo**: si vas a necesitar a alguien de forma continua durante
    más de 2 años, el empleo resulta más eficiente en costes.

    2. **Trabajo sobre propiedad intelectual clave**: los empleados ceden
    automáticamente la PI a la empresa. Los contratistas necesitan cláusulas de
    cesión explícitas.

    3. **Cultura y gestión**: los empleados están más integrados y son más fáciles
    de gestionar.

    Usa la [calculadora de coste de nómina](/tools/payroll-cost-calculator/) para
    calcular el coste exacto para el empleador en cualquier escenario salarial.
"payroll-cost-calculator/employer-payroll-taxes-explained":
  "title": "Cotizaciones del empleador explicadas: FICA, FUTA y SUTA"
  "description": "Guía clara de las cotizaciones que pagan los empleadores en EE. UU. (FICA, FUTA y SUTA), con tipos, bases y cómo minimizar las obligaciones legales."
  "body": |
    Todo empleador en EE. UU. paga tres categorías de cotizaciones además del
    salario del empleado. Son obligatorias, distintas de la retención del impuesto
    sobre la renta y las paga íntegramente el empleador (no se descuentan de la
    nómina del empleado).

    ## FICA (Federal Insurance Contributions Act)

    La FICA financia la Social Security y Medicare.

    | Cotización | Tipo del empleador | Base |
    |---|---|---|
    | Social Security | 6,2 % | Primeros $168.600 (2024) |
    | Medicare | 1,45 % | Todo el salario |
    | **FICA total** | **7,65 %** | |

    Con un salario de $120.000: 7,65 % × $120.000 = **$9.180 al año** de FICA del empleador.

    Nota: el empleado también paga un 7,65 % de FICA (igual que el empleador). Con un
    empleado de $120k, la FICA total (ambas partes) es de $18.360 al año.

    ## FUTA (Federal Unemployment Tax Act)

    La FUTA financia el seguro federal de desempleo.
    - Tipo legal: 6,0 % sobre los primeros $7.000 del salario de cada empleado
    - Tras el crédito por desempleo estatal: 0,6 % efectivo
    - Máximo por empleado: $7.000 × 0,6 % = **$42 al año**

    La mayoría de empleadores pagan el tipo efectivo del 0,6 %. El crédito se
    pierde si te retrasas con el impuesto estatal de desempleo.

    ## SUTA (State Unemployment Tax Act)

    La SUTA es el impuesto de desempleo estatal. Los tipos varían mucho:

    | Estado | Tipo de empleador nuevo | Base |
    |---|---|---|
    | California | 3,4 % | $7.000 |
    | Nueva York | 3,6 % | $12.500 |
    | Texas | 2,7 % | $9.000 |
    | Florida | 2,7 % | $7.000 |
    | Washington | 1,0–5,7 % | $67.600 |

    Los tipos cambian según tu «calificación por historial»: los empleadores con
    menos solicitudes de prestación consiguen tipos más bajos tras 3 o más años de
    actividad.

    ## Ejemplo de cotizaciones totales

    Empleado en California con $120.000 de salario, empleador nuevo:
    - FICA: $9.180
    - FUTA: $42
    - SUTA: $7.000 × 3,4 % = $238
    - **Total de cotizaciones del empleador: $9.460** (7,9 % del salario)

    Usa la [calculadora de coste de nómina](/tools/payroll-cost-calculator/) para
    calcular las cotizaciones totales y el coste para el empleador con cualquier
    salario y estado.
"true-cost-of-an-employee":
  "title": "El coste real de un empleado: lo que pagan de verdad los empleadores"
  "description": "Desglose completo de lo que cuesta contratar a un empleado a jornada completa en EE. UU. (salario, cotizaciones, beneficios, gastos generales) y la regla práctica de 1,25–1,4x."
  "body": |
    Cuando un fundador dice «no puedo permitirme contratar», suele estar
    comparando el salario con su caja. Pero el coste real de un empleado es un
    25–40 % mayor que el salario. Esta guía detalla de dónde sale ese coste extra.

    ## Los componentes del coste total para el empleador

    **1. Salario base**: la cifra de la carta de oferta

    **2. Cotizaciones** (obligatorias):
    - FICA Social Security: 6,2 % del salario (hasta la base máxima)
    - FICA Medicare: 1,45 % de todo el salario
    - FUTA: ~$42 por empleado al año tras el crédito estatal
    - SUTA: del 0,5 % a más del 5 % del salario hasta la base estatal

    **3. Beneficios** (esperados a jornada completa):
    - Seguro médico: $500–$2.000 al mes de aportación de la empresa
    - Aportación al 401(k): normalmente un 3–5 % del salario
    - Dental + visión: $50–$150 al mes
    - Vacaciones pagadas: coste implícito del tiempo no trabajado (15–25 días al año)

    **4. Gastos generales** (no siempre se calculan explícitamente):
    - Equipo: $1.500–$5.000 en portátil y accesorios
    - Licencias de software: $50–$500 al mes por empleado
    - Oficina: $500–$3.000 al mes por puesto (si aplica)
    - Selección: normalmente un 15–25 % del salario del primer año (puntual)

    ## La regla de 1,25–1,40× para la mayoría de empleados en EE. UU.

    La mayoría de empleadores usan un multiplicador de 1,25–1,40× para
    presupuestar.

    | Salario | 1,25× | 1,35× |
    |---|---|---|
    | $80.000 | $100.000 | $108.000 |
    | $120.000 | $150.000 | $162.000 |
    | $160.000 | $200.000 | $216.000 |

    El rango de 1,35–1,40× es más realista en puestos con paquetes de beneficios
    completos.

    ## Coste de un contratista frente a un empleado

    Los contratistas 1099 no generan cotizaciones ni obligaciones de beneficios.
    Pero suelen cobrar un 40–60 % más por hora para compensarlo.

    Regla práctica: si necesitas a alguien menos de 18 meses, un contratista puede
    salir más barato. Si es más tiempo, un empleado a jornada completa suele ganar
    en eficiencia de costes.

    Usa la [calculadora de coste de nómina](/tools/payroll-cost-calculator/) para
    calcular el coste total exacto en cualquier escenario de salario y beneficios.

"irr-formula-excel":
  "title": "Cómo calcular la TIR en Excel (fórmula y ejemplos)"
  "description": "Guía paso a paso para usar la función TIR de Excel: la fórmula, los datos necesarios, los errores habituales y cuándo usar TIR.NO.PER en su lugar."
  "body": |
    La función `TIR` de Excel (`IRR` en la versión inglesa) es la forma más rápida
    de calcular la tasa interna de retorno con flujos convencionales. Así se usa
    correctamente.

    ## Sintaxis de TIR en Excel

    ```
    =TIR(valores; [estimar])
    ```

    **valores**: un rango con los flujos de caja (debe incluir al menos un valor
    negativo y uno positivo). El año 0 (inversión inicial) debe ser la primera
    celda.

    **estimar**: punto de partida opcional para la iteración (0,1 = 10 % por
    defecto). Solo hace falta si TIR devuelve `#¡NUM!` o esperas un resultado
    poco habitual.

    ## Ejemplo

    En las celdas A1:A5: -100000, 25000, 30000, 35000, 40000
    Fórmula: `=TIR(A1:A5)` → **10,48 %**

    Si tu tasa mínima exigida es del 12 %, habría que rechazar esta inversión
    (TIR < tasa mínima).

    ## TIR.NO.PER frente a TIR

    Usa `TIR.NO.PER` (`XIRR` en inglés) cuando los flujos no llegan a intervalos
    anuales regulares:
    ```
    =TIR.NO.PER(valores; fechas)
    ```

    TIR.NO.PER es más precisa en inversiones reales con flujos variables (por
    ejemplo, distribuciones trimestrales o aportaciones de capital irregulares).

    ## Errores habituales

    - **#¡NUM!**: la TIR no ha convergido. Prueba otro valor en `estimar` o revisa
      si hay varios cambios de signo (en ese caso, usa la TIRM).
    - **Olvidar el año 0**: si no incluyes la inversión inicial como valor negativo
      en la primera celda, TIR devuelve un resultado incorrecto.

    Usa la [calculadora de TIR](/tools/irr-calculator/) online para calcularla al
    instante sin Excel.
"irr-vs-npv-which-metric-to-use":
  "title": "TIR o VAN: ¿qué métrica deberías usar?"
  "description": "La TIR y el VAN pueden no coincidir en cuál de dos proyectos es mejor. Aquí se explica por qué y en cuál confiar cuando chocan."
  "body": |
    La TIR y el VAN se construyen con los mismos flujos y suelen coincidir en si un
    proyecto aislado merece la pena. Pero al comparar dos proyectos mutuamente
    excluyentes pueden ordenarlos al revés, y saber en cuál confiar es importante.

    ## Qué mide realmente cada uno

    El **VAN** responde a «¿cuánto valor, en dólares de hoy, crea este proyecto?»:
    una cifra absoluta.

    La **TIR** responde a «¿qué rentabilidad anualizada genera este proyecto?»: un
    porcentaje, independiente del tamaño del proyecto.

    ## Por qué pueden no coincidir

    La TIR es ciega a la escala. Un proyecto de $10.000 con una TIR del 50 % genera
    mucho menos valor total que uno de $1.000.000 con una TIR del 20 %, pero la TIR
    por sí sola diría que el pequeño es «mejor». El VAN, en cambio, recoge el valor
    real creado en dólares, que es lo que al final le importa a una empresa.

    ## Una comparación con números

    | Proyecto | Inversión | TIR | VAN (descuento del 10 %) |
    |---------|-----------|-----|------------------------------|
    | A | $10.000 | 45 % | $4.200 |
    | B | $500.000 | 22 % | $85.000 |

    El proyecto A «gana» por TIR. El proyecto B crea 20 veces más valor real. Si
    solo puedes elegir uno y tienes el capital, B es muy probablemente la mejor
    opción pese a su TIR más baja: justo la trampa en la que cae decidir solo por
    TIR.

    ## Cuándo la TIR sigue siendo la métrica principal adecuada

    - **Filtrado con capital limitado**: cuando eliges entre muchos proyectos
      pequeños y la restricción es el capital (no una única decisión de sí o no),
      ordenar por TIR para maximizar la rentabilidad por dólar puede ser el enfoque
      correcto
    - **Comunicación con personas no financieras**: un porcentaje suele ser más
      intuitivo que un VAN en dólares, sobre todo al compararlo con una tasa mínima

    ## La recomendación estándar

    Usa el VAN como criterio principal para comparar proyectos mutuamente
    excluyentes de distinto tamaño: mide directamente el valor creado. Usa la TIR
    como comprobación secundaria y para comunicar la rentabilidad anualizada
    esperada, pero no dejes que se imponga al VAN cuando ambos ordenan distinto.

    ## Preguntas frecuentes

    **¿Y si un proyecto tiene varias TIR?**
    Pasa cuando los flujos cambian de signo más de una vez (por ejemplo, un gran
    coste a mitad del proyecto). En ese caso el VAN sigue bien definido, otra razón
    para quedarse con el VAN cuando ambos chocan o la TIR parece inestable.

    **¿La TIRM resuelve el desacuerdo entre TIR y VAN?**
    La TIRM corrige la hipótesis de reinversión poco realista de la TIR, pero no su
    ceguera a la escala: para ordenar proyectos de distinto tamaño, sigue siendo el
    VAN en el que hay que confiar.

    Usa la [calculadora de TIR](/tools/irr-calculator/) junto a tu propio cálculo
    del VAN para ver ambas métricas con la misma serie de flujos antes de elegir.
"what-is-a-good-irr-for-a-startup":
  "title": "¿Qué es una buena TIR para invertir en una startup?"
  "description": "Referencias de TIR para inversiones en startups, capital riesgo y private equity, y cómo interpretar la TIR junto al múltiplo (MOIC) y el periodo de recuperación."
  "body": |
    Las referencias de TIR (tasa interna de retorno) varían según la fase, el
    sector y la clase de activo. Esto es lo que los inversores consideran «bueno»
    en cada contexto.

    ## Referencias de TIR por contexto

    | Contexto | TIR mínima aceptable | TIR objetivo |
    |---------|----------------------|------------|
    | Business angel / pre-seed | 30 % | 50–100 % o más |
    | Serie A / capital riesgo | 25 % | 40–60 % |
    | Capital crecimiento | 20 % | 30–40 % |
    | Compra apalancada (private equity) | 15 % | 20–30 % |
    | Promoción inmobiliaria | 12 % | 18–25 % |
    | Umbral del mercado cotizado | 8–12 % | — |

    ## TIR frente a MOIC

    La TIR depende del tiempo: multiplicar por 3 en 2 años = ~73 % de TIR;
    multiplicar por 3 en 6 años = ~20 % de TIR. El MOIC (múltiplo sobre el capital
    invertido) ignora el tiempo, así que los inversores usan ambos:
    - **TIR** para comparar inversiones con periodos de tenencia distintos
    - **MOIC** para comunicar la magnitud del retorno a los LP

    ## Cuándo engaña la TIR

    La TIR supone reinvertir a la misma tasa. En inversiones con grandes flujos al
    principio (por ejemplo, dividendos rápidos), sobrestima la rentabilidad
    combinada. Usa la TIRM (TIR modificada) cuando la tasa de reinversión difiera
    mucho de la TIR del proyecto.

    Usa la [calculadora de TIR](/tools/irr-calculator/) para calcular la TIR y el
    VAN de cualquier serie de flujos de caja.
"mirr-excel-formula":
  "title": "La TIRM en Excel: fórmula, ejemplos y errores habituales"
  "description": "Cómo calcular la TIRM en Excel con la función integrada, con ejemplos, explicación de los argumentos y errores habituales que conviene evitar."
  "body": |
    La función `TIRM` de Excel (`MIRR` en inglés) simplifica el cálculo, pero hay
    algunas trampas que conviene conocer antes de usarla en un modelo.

    ## Sintaxis de TIRM en Excel

    ```
    =TIRM(valores; tasa_financiamiento; tasa_reinversión)
    ```

    **valores**: un rango de celdas con los flujos de caja (del año 0 al año N).
    El primer valor debe ser negativo (inversión inicial).

    **tasa_financiamiento**: el tipo de interés que pagas por los flujos negativos
    (coste de financiación). Usa tu WACC o tu coste de la deuda.

    **tasa_reinversión**: el tipo de interés que obtienes al reinvertir los flujos
    positivos. Usa una tasa prudente: rentabilidad de la deuda pública, tipo de
    ahorro o coste de oportunidad.

    ## Ejemplo

    Flujos: año 0 = −$100.000, años 1–4 = $30.000 cada uno.
    Tasa de financiación = 10 %, tasa de reinversión = 8 %.

    ```
    =TIRM(A1:A5; 10%; 8%)
    = 7,83 %
    ```

    Con la TIR estándar: `=TIR(A1:A5)` = 7,71 %

    Aquí la TIRM es algo mayor porque la tasa de reinversión (8 %) supera la TIR
    (7,71 %). La TIRM se acerca a la tasa de reinversión: cuando esta es inferior a
    la TIR, la TIRM sale más baja que la TIR.

    ## Errores habituales

    1. **No incluir el año 0**: el rango debe contener la salida inicial en la
       primera posición. Si empiezas en el año 1, el resultado es incorrecto.
    2. **Usar la misma tasa en ambos argumentos**: la TIRM queda reducida a una
       simple aproximación de la TIR y pierde su sentido.
    3. **Mezclar periodos**: la TIRM supone periodos anuales salvo que ajustes. Con
       flujos mensuales, divide las tasas anuales entre 12.

    Usa la [calculadora de TIRM](/tools/mirr-calculator/) online, sin necesidad de
    Excel.
"mirr-vs-irr-which-to-use":
  "title": "TIRM o TIR: ¿cuál usar en el presupuesto de capital?"
  "description": "Comparación práctica de la TIRM y la TIR para decisiones de inversión: cuándo conviene cada una y por qué la TIRM da resultados más realistas."
  "body": |
    La TIR se usa más, pero la TIRM es más realista. Aquí se explica cuándo y por
    qué usar cada una.

    ## El problema de la tasa de reinversión en la TIR

    La TIR supone implícitamente que todos los flujos positivos se pueden
    reinvertir a la propia TIR. Si un proyecto tiene una TIR del 35 %, supone que
    puedes reinvertir cada año los retornos al 35 %, algo normalmente imposible.

    La TIRM lo corrige separando la tasa de financiación (coste de endeudarse) de
    la tasa de reinversión (tus oportunidades reales de reinversión).

    ## Cuándo usar la TIRM en lugar de la TIR

    1. **Varios cambios de signo en los flujos**: los proyectos que requieren
       aportaciones de capital a mitad de camino pueden producir varias TIR
       matemáticamente válidas. La TIRM siempre devuelve un único valor.
    2. **Comparar proyectos de distinta escala**: la TIRM funciona mejor para
       comparar un proyecto de $500k con otro de $5M con patrones de flujo
       distintos.
    3. **Prestamistas o consejeros exigentes lo piden**: las firmas de private
       equity y los inversores sofisticados suelen preferir la TIRM para modelar
       la rentabilidad de forma realista.

    ## Cuándo basta con la TIR

    Con flujos simples y convencionales (una salida inicial seguida de entradas),
    la TIR y la TIRM dan resultados parecidos, y la TIR es más conocida.

    Usa la [calculadora de TIRM](/tools/mirr-calculator/) para calcular la TIRM
    con las tasas de financiación y reinversión que elijas.
"how-to-choose-discount-rate":
  "title": "Cómo elegir la tasa de descuento adecuada para calcular el VAN"
  "description": "La tasa de descuento es el dato más importante del análisis del VAN. Aprende a calcular el WACC, la tasa mínima exigida y el coste de oportunidad, y por qué una tasa equivocada lleva a malas decisiones."
  "body": |
    La tasa de descuento es el dato más crítico del análisis del VAN. Si es
    demasiado baja, aceptarás malas inversiones. Si es demasiado alta, rechazarás
    buenas.

    ## El concepto: el coste de oportunidad del capital

    La tasa de descuento representa lo que podrías ganar invirtiendo el dinero en
    otro sitio con un riesgo similar. Si puedes ganar un 10 % en bolsa con un riesgo
    parecido, cualquier proyecto que no rinda al menos un 10 % destruye valor
    frente a esa alternativa.

    **Principio clave**: la tasa de descuento debe reflejar el riesgo del proyecto,
    no el del inversor ni el de los proyectos medios de la empresa.

    ## Método 1: WACC (coste medio ponderado del capital)

    Para empresas financiadas con deuda y capital:

    **WACC = (E/V × Re) + (D/V × Rd × (1 − tipo impositivo))**

    Donde:
    - E/V = peso del capital (capital / valor total)
    - Re = coste del capital propio (por ejemplo, 12–15 % en una pequeña empresa)
    - D/V = peso de la deuda
    - Rd = coste de la deuda (tipo de interés de los préstamos)
    - Tipo impositivo = tipo del impuesto de sociedades (los intereses son deducibles)

    **Ejemplo**: 60 % de capital al 14 % + 40 % de deuda al 8 %, con un 25 % de impuestos:
    WACC = (0,60 × 14 %) + (0,40 × 8 % × 0,75) = 8,4 % + 2,4 % = **10,8 %**

    ## Método 2: tasa mínima exigida

    Muchas empresas fijan una TIR mínima aceptable para sus proyectos (la «hurdle
    rate»). Es una decisión de política, no una fórmula. Tasas mínimas habituales:
    - Grandes empresas: 12–15 %
    - Empresas medianas: 15–20 %
    - Startups y proyectos de alto riesgo: 20–30 %
    - Capital riesgo: 30–40 %

    ## Método 3: tasa ajustada al riesgo

    Para proyectos con un perfil de riesgo distinto al de tu negocio principal:
    - Riesgo bajo (ahorro de costes, mejoras operativas): WACC − 2–3 puntos
    - Riesgo medio (expansión del negocio principal): WACC
    - Riesgo alto (nuevos mercados, tecnología no probada): WACC + 5–10 puntos
    - Especulativo (proyectos muy ambiciosos): 25–40 %

    ## Errores habituales

    **Usar solo el coste de la deuda**: «Nuestro préstamo está al 7 %, así que
    usamos el 7 %». Error: ignora el coste del capital propio, bastante más alto
    que el de la deuda.

    **Una tasa fija para todos los proyectos**: una inversión industrial estable no
    tiene el mismo riesgo que una startup de software. Misma empresa, distinto
    riesgo, distinta tasa.

    **Tasa nominal con flujos reales**: si los flujos están en términos reales
    (ajustados por inflación), usa una tasa real. Si son nominales, una nominal.

    En la mayoría de decisiones, parte del WACC y súbelo en proyectos de más
    riesgo. Si dudas, haz un análisis de sensibilidad: calcula el VAN al 8 %, 12 %,
    16 % y 20 %.

    Usa la [calculadora de VAN](/tools/npv-calculator/) para modelar distintos
    escenarios de tasa de descuento.
"npv-vs-irr":
  "title": "VAN o TIR: qué métrica usar en las decisiones de inversión"
  "description": "El VAN y la TIR evalúan la rentabilidad de una inversión, pero responden a preguntas distintas. Aprende cuándo conviene cada uno y por qué suele preferirse el VAN para asignar capital."
  "body": |
    El VAN y la TIR sirven para evaluar la rentabilidad de una inversión, pero
    responden a preguntas algo distintas y a veces dan señales contradictorias.

    ## El VAN: valor en dólares

    **VAN = −inversión + Σ [flujo de caja / (1 + r)^t]**

    El VAN responde a: «Con la rentabilidad que exijo, ¿cuántos dólares de valor
    crea esta inversión?». El resultado es una cifra absoluta.

    El VAN se puede aplicar directamente: acepta todos los proyectos con VAN
    positivo. Entre dos proyectos, el de mayor VAN crea más riqueza (a igual
    escala).

    ## La TIR: la rentabilidad de equilibrio

    La TIR es la tasa de descuento con la que el VAN es cero. Responde a: «¿Qué
    rentabilidad obtiene realmente esta inversión?». Se expresa en porcentaje.

    En el proyecto de ejemplo ($100k de inversión, $30k–$40k de flujos anuales
    durante 5 años), la TIR ≈ 23,3 %. Es decir, el proyecto rinde un 23,3 % anual.

    Si tu tasa mínima es del 10 %, TIR > 10 % → aceptar. Si es del 25 %, TIR < 25 %
    → rechazar.

    ## Cuándo coinciden el VAN y la TIR

    En inversiones simples (una salida y luego entradas), el VAN y la TIR siempre
    coinciden en aceptar o rechazar:
    - VAN positivo ↔ TIR > tasa de descuento
    - VAN negativo ↔ TIR < tasa de descuento

    ## Cuándo discrepan: proyectos mutuamente excluyentes

    Al elegir entre dos proyectos que compiten, el VAN y la TIR pueden ordenarlos
    de forma distinta.

    **Ejemplo:**
    - Proyecto A: $100k de inversión, TIR del 25 %, VAN de $20k al 10 %
    - Proyecto B: $500k de inversión, TIR del 20 %, VAN de $80k al 10 %

    La TIR favorece al proyecto A (25 % > 20 %). El VAN favorece al B ($80k > $20k).

    ¿Cuál acierta? **El VAN.** El proyecto B crea $80k de riqueza; el A solo $20k.
    La TIR engaña porque ignora la escala.

    ## Cuándo es siempre preferible el VAN

    1. **Escalas distintas**: la TIR ignora el tamaño del proyecto; el VAN mide valor absoluto
    2. **Flujos no convencionales**: varios cambios de signo pueden producir varias
       TIR; el VAN solo tiene un valor
    3. **Tasas de descuento variables**: si tu coste de capital cambia de un año a
       otro, solo el VAN lo gestiona bien (una tasa por periodo)

    ## Cuándo es útil la TIR

    La TIR es intuitiva para comunicar: «Este proyecto rinde un 23,3 % anual» es
    más fácil de explicar que «este proyecto tiene un VAN de $38k al 10 %».

    También sirve para comparar rentabilidades de inversiones de distinto tamaño
    junto con el análisis del VAN.

    **Buena práctica**: calcula ambos. Decide por el VAN. Usa la TIR para el
    contexto y la comunicación.

    Usa la [calculadora de VAN](/tools/npv-calculator/) para tu análisis de
    inversión.
"what-is-net-present-value":
  "title": "¿Qué es el valor actual neto (VAN)? Fórmula, ejemplos y reglas de decisión"
  "description": "El VAN descuenta los flujos de caja futuros a su valor actual y resta la inversión inicial. Aprende la fórmula, cuándo usarlo y cómo elegir la tasa de descuento adecuada."
  "body": |
    El valor actual neto (VAN) responde a la pregunta más básica de la asignación
    de capital: ¿esta inversión crea o destruye valor?

    **VAN = −inversión inicial + Σ [flujo de caja_t / (1 + r)^t]**

    Donde r es la tasa de descuento (coste de capital) y t el año.

    Un VAN positivo significa que la inversión rinde más que la rentabilidad
    exigida. Uno negativo, que rinde menos. La regla: aceptar todos los proyectos
    con VAN positivo.

    ## Por qué se descuentan los flujos

    Un dólar hoy vale más que un dólar en el futuro. Si puedes ganar un 10 % anual,
    $1.000 hoy se convierten en $1.100 dentro de un año. Dicho de otro modo, $1.100
    dentro de un año valen $1.000 hoy con una tasa de descuento del 10 %.

    El VAN aplica esta lógica a todos los flujos futuros de una inversión:
    - El flujo del año 1 se descuenta por (1 + r)^1
    - El del año 2 por (1 + r)^2
    - Y así sucesivamente...

    La suma de los flujos descontados, menos la inversión inicial, es el VAN.

    ## Un ejemplo con números

    Inversión: $100.000
    Flujos: $30k, $35k, $40k, $40k, $40k durante 5 años
    Tasa de descuento: 10 %

    | Año | Flujo | Factor de descuento | Valor actual |
    |---|---|---|---|
    | 1 | $30.000 | 1/1,10 = 0,909 | $27.273 |
    | 2 | $35.000 | 1/1,21 = 0,826 | $28.926 |
    | 3 | $40.000 | 1/1,331 = 0,751 | $30.053 |
    | 4 | $40.000 | 1/1,464 = 0,683 | $27.321 |
    | 5 | $40.000 | 1/1,611 = 0,621 | $24.837 |
    | **VA total** | | | **$138.410** |

    **VAN = $138.410 − $100.000 = $38.410**

    VAN positivo → aceptar. Esta inversión crea $38.410 de valor por encima de la
    rentabilidad exigida del 10 %.

    ## Reglas de decisión

    | VAN | Interpretación |
    |---|---|
    | Positivo | La inversión crea valor: aceptar |
    | Cero | La inversión rinde exactamente lo exigido |
    | Negativo | La inversión destruye valor: rechazar |

    Con proyectos que compiten por un capital limitado, ordénalos por índice de
    rentabilidad (IR = VAN / inversión).

    ## El efecto de la tasa de descuento

    La misma inversión de $100k con distintas tasas:
    - Tasa del 5 % → VAN = $59.120
    - Tasa del 10 % → VAN = $38.410
    - Tasa del 15 % → VAN = $21.610
    - Tasa del 20 % → VAN = $7.819
    - Tasa del 25 % → VAN = −$3.629 (proyecto rechazado)

    La TIR (la tasa con la que el VAN es cero) es de aproximadamente el 23,3 %.

    Calcula el VAN de tu inversión con la [calculadora de VAN](/tools/npv-calculator/).
"discounted-payback-period-explained":
  "title": "Periodo de recuperación descontado: fórmula, ejemplo y cuándo usarlo"
  "description": "El periodo de recuperación descontado tiene en cuenta el valor temporal del dinero. Aprende la fórmula, un ejemplo con números y por qué importa en decisiones de inversión a largo plazo."
  "body": |
    El periodo de recuperación descontado ajusta por el valor temporal del dinero:
    un dólar recibido dentro de 3 años vale menos que un dólar hoy. Por eso esta
    versión es más prudente, y más precisa en inversiones a largo plazo.

    ## La fórmula

    Descuenta el flujo de cada año:
    **VA del año N = flujo anual / (1 + tasa de descuento)^N**

    Después acumula los flujos descontados hasta que superen la inversión inicial.

    ## Ejemplo con números

    Inversión: $200.000. Flujo anual: $80.000. Tasa de descuento: 10 %.

    | Año | Flujo | Factor de descuento | VA | VA acumulado |
    |---|---|---|---|---|
    | 1 | $80k | 0,909 | $72.727 | $72.727 |
    | 2 | $80k | 0,826 | $66.116 | $138.843 |
    | 3 | $80k | 0,751 | $60.105 | $198.948 |
    | 4 | $80k | 0,683 | $54.641 | $253.589 |

    El punto de equilibrio llega justo después de terminar el año 3 (~$198.948,
    apenas por debajo de $200.000): periodo descontado ≈ **3,02 años**, frente a
    2,5 años en simple.

    ## Cuándo usar el periodo descontado

    Usa el periodo de recuperación descontado para:
    - Cualquier inversión con un periodo de recuperación de más de 2 años
    - Inversiones de capital grandes en las que pesa la inflación
    - Decisiones en las que el coste de capital es relevante (> 5 %)

    Para decisiones rápidas de marketing, el periodo simple suele bastar.

    Calcula ambos con la [calculadora del periodo de recuperación](/tools/payback-period-calculator/).
"payback-period-saas-investment":
  "title": "Periodo de recuperación en inversiones SaaS: la recuperación del CAC explicada"
  "description": "En SaaS, el periodo de recuperación suele referirse al del CAC: cuántos meses se tarda en recuperar el coste de adquisición de un cliente. Referencias y cómo calcularlo."
  "body": |
    En SaaS, «periodo de recuperación» casi siempre se refiere al **periodo de
    recuperación del CAC**: los meses que se tarda en recuperar el coste de
    adquirir un cliente con el margen bruto que genera.

    ## Fórmula de la recuperación del CAC

    **Recuperación del CAC (meses) = CAC / (ARPU mensual × % de margen bruto)**

    Con un CAC de $2.400, un ARPU de $200 al mes y un 75 % de margen bruto:
    - Beneficio bruto mensual por cliente = $200 × 75 % = $150
    - Recuperación del CAC = $2.400 / $150 = **16 meses**

    ## Referencias

    | Recuperación del CAC | Valoración |
    |---|---|
    | < 6 meses | Excepcional: product-led, poco contacto comercial |
    | 6–12 meses | Excelente: ventas eficientes |
    | 12–18 meses | Buena: típica de una SaaS en serie A |
    | 18–24 meses | En el límite: mejórala antes de escalar |
    | > 24 meses | Preocupante: el CAC tarda demasiado en recuperarse |

    ## Por qué importa en SaaS

    Una recuperación del CAC de 24 meses significa que financias 2 años de costes
    de adquisición antes de ganar dinero con cada cliente. Con un churn mensual del
    5 %, ~70 % de los clientes se habrán ido antes de llegar al equilibrio.

    Bajar la recuperación del CAC por debajo de 12 meses mejora mucho la economía unitaria y
    reduce el capital que necesita el crecimiento de una SaaS.

    Calcula tu recuperación del CAC con la [calculadora de CAC](/tools/cac-calculator/)
    y el periodo de recuperación general con la [calculadora del periodo de recuperación](/tools/payback-period-calculator/).
"payback-period-vs-roi":
  "title": "Periodo de recuperación o ROI: ¿qué métrica de inversión usar?"
  "description": "El periodo de recuperación mide cuándo llegas al equilibrio; el ROI mide la rentabilidad total. Aprende cuándo usar cada uno y cómo se complementan en las decisiones de capital."
  "body": |
    El periodo de recuperación y el ROI sirven para evaluar inversiones, pero
    responden a preguntas distintas y tienen puntos ciegos distintos.

    ## Periodo de recuperación: «¿Cuándo recupero mi dinero?»

    **Periodo de recuperación = inversión / flujo neto anual**

    El periodo de recuperación se centra por completo en el punto de equilibrio. Es
    sencillo, intuitivo y útil para valorar el riesgo de liquidez: cuánto tiempo
    hasta que tu capital deja de estar en riesgo.

    **Punto débil**: ignora todos los flujos posteriores al equilibrio. Una inversión
    de $100k que se recupera en 1 año y luego no genera nada tiene el mismo periodo
    que otra que genera $100k al año durante 10 años más.

    ## ROI: «¿Cuál es la rentabilidad total?»

    **ROI = (retornos netos totales − inversión) / inversión × 100**

    El ROI recoge el valor total de la inversión durante todo el periodo, no solo
    cuándo llega al equilibrio.

    **Punto débil**: no tiene en cuenta el valor temporal del dinero ni el riesgo de
    liquidez.

    ## Cuándo usar cada uno

    - **Periodo de recuperación**: descartar inversiones de alto riesgo; planificar la caja
    - **ROI**: comparar la eficiencia global de las inversiones
    - **Ambos juntos**: decisiones completas de asignación de capital

    Para cualquier inversión de más de $10k, calcula ambos con:
    - La [calculadora del periodo de recuperación](/tools/payback-period-calculator/)
    - La [calculadora de ROI](/tools/roi-calculator/)
"how-to-calculate-roi":
  "title": "Cómo calcular el ROI: fórmula, ejemplos y errores habituales"
  "description": "Aprende la fórmula del ROI (beneficio neto / inversión × 100), mira ejemplos con números y evita los errores habituales que hacen engañoso el cálculo."
  "body": |
    ROI = (beneficio neto / inversión) × 100

    Esa es la fórmula. Lo difícil es definir bien el «beneficio neto» y la
    «inversión».

    ## Cálculo del ROI paso a paso

    **Paso 1**: calcula el beneficio neto
    Beneficio neto = ingresos totales generados − costes totales asociados a la inversión

    Los costes incluyen: costes operativos directos, tiempo del equipo, reparto de
    gastos generales y coste de oportunidad del capital.

    **Paso 2**: divide entre la inversión
    ROI = beneficio neto / coste de la inversión × 100

    **Ejemplo**: gastas $50k en una campaña de marketing de contenidos. En 12 meses
    genera $200k de pipeline atribuido, que se cierra al 25 %: $50k de ingresos.
    La producción de contenido costó $10k más en trabajo continuo.

    - Beneficio neto = $50k − $10k = $40k
    - ROI = $40k / $50k × 100 = **80 %**

    ## Errores habituales al calcular el ROI

    **Error 1: olvidar los costes indirectos**
    El tiempo del equipo dedicado a gestionar una inversión es un coste real. Una
    herramienta de $10k que exige 40 horas al mes de gestión cuesta $2.400 más al
    mes a $60 la hora.

    **Error 2: usar ingresos brutos en lugar de beneficio neto**
    Un ROI sobre ingresos brutos ignora el coste de ventas. Si una campaña genera
    $100k de ingresos pero el producto cuesta $60k, la contribución neta es de
    $40k, no de $100k.

    **Error 3: no anualizar**
    Un ROI del 50 % suena genial, pero en 5 años es solo un 8,4 % anual. Compara
    siempre el ROI en el mismo horizonte temporal.

    Calcula el tuyo con la [calculadora de ROI](/tools/roi-calculator/).
"marketing-roi-benchmarks":
  "title": "Referencias de ROI de marketing por canal (2024)"
  "description": "Referencias del sector de ROI de marketing por canal: email, SEO, búsqueda de pago, redes sociales y marketing de contenidos. Compara tus campañas."
  "body": |
    El ROI de marketing varía muchísimo según el canal. Estas son referencias
    habituales basadas en estudios del sector y datos de profesionales.

    ## Email marketing

    ROI medio: **$36–$42 por cada $1 invertido** (3.500–4.100 %)

    El email encabeza siempre las clasificaciones de ROI porque el coste variable
    de cada envío es casi nulo una vez creada la lista. El coste de comprar listas
    reduce el ROI a lo largo del tiempo al 500–1.000 % en la mayoría de negocios.

    ## SEO (búsqueda orgánica)

    ROI medio: **300–2.000 % en 3 años**

    El ROI del SEO es alto pero diferido. Los meses 1–6 suelen tener ROI negativo.
    Los meses 12–36 producen retornos acumulativos a medida que el contenido
    posiciona. Calcula el ROI anualizado en todo el periodo de 3 años para
    compararlo de forma justa con los canales de pago.

    ## Búsqueda de pago (Google Ads)

    ROAS medio: **2:1–5:1 según el sector**
    ROI medio después de márgenes: **10–30 %** en sectores competitivos

    La búsqueda de pago es inmediata pero competitiva. El ROI empeora al escalar la
    inversión (palabras clave de peor calidad, competencia en pujas). Limita la
    inversión de pago mientras el ROI sea positivo y lleva el excedente a canales
    acumulativos.

    ## Marketing de contenidos

    ROI medio: **300–1.000 % en 12 meses**

    Requiere invertir en calidad y distribución. Los mejores ven retornos
    acumulativos a medida que el contenido gana autoridad de dominio.

    ## Redes sociales (de pago)

    ROAS medio: **1,5:1–3:1**

    El ROI más bajo de los grandes canales en la mayoría de negocios B2B. Funciona
    mejor para notoriedad de marca (ROI difícil de medir) que para respuesta
    directa.

    Sigue tus retornos reales con la [calculadora de ROI](/tools/roi-calculator/).
"roi-vs-roas":
  "title": "ROI frente a ROAS: en qué se diferencian y cuándo usar cada uno"
  "description": "El ROI mide el retorno neto sobre la inversión total; el ROAS mide los ingresos por dólar publicitario. Qué métrica usar en las decisiones de marketing y cómo pasar de una a otra."
  "body": |
    El ROI y el ROAS miden la eficiencia del marketing, pero miden cosas distintas
    y llevan a decisiones distintas.

    ## ROAS: ingresos sobre inversión publicitaria

    **ROAS = ingresos atribuidos a los anuncios / inversión publicitaria**

    Un ROAS de 4,0 significa: $4 de ingresos por cada $1 de publicidad.

    El ROAS ignora todos los costes salvo la publicidad. Una campaña con un ROAS de
    5,0 parece genial, pero si el margen del producto es del 20 %, estás en
    equilibrio.

    ## ROI: retorno neto sobre la inversión

    **ROI = (ingresos − todos los costes) / inversión × 100**

    El ROI incluye el coste de ventas, la logística, el tiempo del equipo y la
    propia inversión.

    Una campaña con un ROAS de 5,0, un 20 % de margen de producto y un 15 % de
    coste logístico:
    - Margen neto = 20 % − 15 % = 5 %
    - Ingresos: $500k. Neto del producto: $25k.
    - Inversión publicitaria: $100k.
    - ROI = ($25k − $100k) / $100k = **−75 %**

    La misma campaña que parecía genial con un ROAS de 5,0 en realidad destruye
    valor.

    ## Cuándo usar cada uno

    - **ROAS**: optimizar campañas concretas, hacer tests A/B de creatividades
    - **ROI**: decisiones estratégicas de inversión, comparar canales, asignar presupuesto

    Usa el ROAS para la optimización táctica y el ROI para las decisiones
    estratégicas.

    Calcula tu ROI con la [calculadora de ROI](/tools/roi-calculator/).
"how-to-use-rule-of-72":
  "title": "Cómo usar la regla del 72"
  "description": "La regla del 72 explicada con ejemplos: cómo estimar el tiempo para duplicar una inversión, una deuda o el crecimiento de ingresos con un simple cálculo mental."
  "body": |
    La regla del 72 es un atajo de cálculo mental: divide 72 entre una tasa anual
    para estimar cuántos años tarda una cantidad en duplicarse.

    ## Ejemplos

    - **Inversión con un 8 % de rentabilidad anual**: 72 ÷ 8 = **9 años** para duplicarse
    - **Tarjeta de crédito al 24 % TAE**: 72 ÷ 24 = **3 años** para que la deuda se duplique
    - **Inflación del 3 %**: 72 ÷ 3 = **24 años** para que los precios se dupliquen
    - **SaaS que crece un 50 % anual**: 72 ÷ 50 = **~1,4 años** para duplicar el ARR

    ## ¿Por qué funciona?

    Con una tasa r, el tiempo exacto para duplicar es **ln(2) ÷ ln(1 + r)**.
    Con tasas pequeñas, se aproxima a **0,693 / r**.
    La regla usa 72 en lugar de 69,3 porque 72 es divisible entre más tasas
    habituales (2, 3, 4, 6, 8, 9, 12…).

    ## Precisión

    La regla del 72 es más precisa con tasas del 6–10 % (menos del 1 % de error).
    Con tasas de más del 20 %, usa la [calculadora de la regla del 72](/tools/rule-of-72-calculator/),
    que muestra tanto la aproximación como el tiempo exacto para duplicar.
"rule-of-72-vs-exact-compound-interest":
  "title": "Regla del 72 frente a la fórmula exacta del interés compuesto"
  "description": "Compara la aproximación de la regla del 72 con el tiempo exacto para duplicar con interés compuesto. Cuándo usar cada una y cuánto error introduce el atajo."
  "body": |
    ## Las dos fórmulas

    **Regla del 72**: años ≈ 72 / tasa anual

    **Fórmula exacta**: años = ln(2) / ln(1 + r), con r la tasa en decimal

    ## Comparación de errores

    | Tasa | Regla del 72 | Exacto | Error |
    |------|-----------|-------|-------|
    | 2 % | 36 años | 35,0 años | +2,9 % |
    | 4 % | 18 años | 17,7 años | +1,9 % |
    | 8 % | 9 años | 9,0 años | 0,0 % |
    | 12 % | 6 años | 6,1 años | −1,9 % |
    | 20 % | 3,6 años | 3,8 años | −5,3 % |
    | 50 % | 1,44 años | 1,71 años | −16 % |

    En la mayoría de decisiones financieras con tasas por debajo del 20 %, la regla
    del 72 es suficientemente precisa. Por encima del 20 % (empresas de alto
    crecimiento, deuda con intereses altos), usa la fórmula exacta.

    La [calculadora de la regla del 72](/tools/rule-of-72-calculator/) muestra ambos
    valores lado a lado para ver la diferencia con cualquier tasa.
"wacc-discount-rate-dcf":
  "title": "Usar el WACC como tasa de descuento en un DCF: guía práctica"
  "description": "Cómo usar el WACC como tasa de descuento en una valoración DCF, incluido cómo estimar el coste del capital propio en empresas jóvenes, y los errores habituales."
  "body": |
    El WACC (coste medio ponderado del capital) es la tasa de descuento estándar
    en las valoraciones por DCF (descuento de flujos de caja). Así se usa bien y
    qué hacer cuando no hay datos de manual disponibles.

    ## El WACC en un DCF: la mecánica

    En un modelo DCF:
    **Valor = Σ (flujo de caja libre_t / (1 + WACC)^t) + valor terminal / (1 + WACC)^n**

    El WACC representa la rentabilidad exigida por toda la estructura de capital,
    accionistas y acreedores. Descontar al WACC da el valor empresarial; resta la
    deuda neta para obtener el valor del capital.

    ## Estimar el WACC de una empresa joven

    Las empresas no cotizadas y las startups no tienen datos de mercado para el
    coste del capital propio. Enfoques posibles:

    **Enfoque CAPM**: coste del capital propio = tasa libre de riesgo + β × (prima de mercado)
    - Tasa libre de riesgo: rentabilidad del bono del Tesoro de EE. UU. a 10 años (~4,5 % en 2024)
    - Prima de riesgo de mercado: 5–6 % (histórico de Damodaran)
    - Beta: usa las betas de empresas cotizadas comparables (0,8–1,5 en SaaS)

    **Enfoque de la tasa mínima de los VC**: usa la TIR objetivo del fondo (25–40 %
    en fase inicial) como coste del capital propio. Refleja la rentabilidad que
    realmente exigen los inversores.

    **Sin deuda (antes de ingresos)**: WACC = coste del capital propio. No hace
    falta ponderar la deuda.

    ## Errores habituales con el WACC

    1. **Usar valor contable en lugar de valor de mercado** para ponderar capital y deuda
    2. **No ajustar por impuestos** el componente del coste de la deuda
    3. **Usar el WACC en empresas muy apalancadas o en dificultades**: usa el valor
       actual ajustado (APV) cuando el nivel de deuda cambia mucho con el tiempo

    Usa la [calculadora de WACC](/tools/wacc-calculator/) para calcular tu coste
    medio del capital en un análisis DCF.
"wacc-for-startup-valuation":
  "title": "WACC para valorar startups: qué tasa de descuento usar"
  "description": "Cómo estimar el WACC de una startup en fase inicial, donde los comparables cotizados, la beta y las primas de riesgo no funcionan igual que en una empresa cotizada."
  "body": |
    El WACC de una startup es más arte que ciencia porque sus datos
    (capitalización, beta, coste de la deuda) no existen o no son fiables. Así lo
    abordan los profesionales.

    ## Por qué el WACC tradicional no funciona en startups

    1. **Sin capitalización bursátil**: el valor del capital es privado y muy incierto
    2. **Sin beta**: no hay volatilidad histórica del precio que observar
    3. **Poca o ninguna deuda**: la estructura de capital es casi toda capital propio
    4. **Alta probabilidad de fracaso**: los modelos DCF recogen mal los resultados binarios

    ## Cómo piensan los VC la tasa de descuento

    Los VC rara vez usan el WACC de forma explícita. Aplican en su lugar una **TIR
    objetivo** del 30–50 % o más (reflejo de un objetivo de 10x para el fondo
    contando con fracasos). Equivale a usar un WACC del 30–50 %, muy por encima de
    lo que sugerirían los modelos tradicionales.

    ## En modelos DCF

    Al construir un DCF para una startup, los profesionales suelen:
    - Partir de un **WACC de empresas comparables** cotizadas (normalmente 8–15 % en SaaS)
    - Sumar una **prima por tamaño** del 3–5 % por ser una empresa privada y más pequeña
    - Sumar una **prima de riesgo específica** del 3–10 % por el riesgo de ejecución

    Tasa de descuento efectiva de una startup: **14–30 %** según la fase y el
    sector.

    Usa la [calculadora de WACC](/tools/wacc-calculator/) con empresas
    consolidadas cuyo valor de capital y deuda sea observable.

"dcf-valuation-startup":
  "title": "Valoración DCF de startups: qué tasa de descuento usar"
  "description": "Cómo aplicar un DCF a una startup en fase inicial: elegir la tasa de descuento, gestionar la incertidumbre del valor terminal y por qué el DCF es difícil sin ingresos."
  "body": |
    El DCF es difícil de aplicar a una startup, pero no imposible. Así se usa con
    criterio cuando los flujos son inciertos.

    ## Elegir una tasa de descuento para una startup

    El WACC estándar derivado del CAPM funciona mal en empresas sin ingresos
    porque:
    - No hay una beta cotizada de referencia
    - La deuda es mínima o inexistente
    - El riesgo del capital es extremo

    Enfoques prácticos:
    **Método de la tasa mínima de los VC**: usa la rentabilidad que esperan los VC
    (25–40 % en fase inicial) como coste del capital propio. Refleja lo que los
    inversores exigen de verdad.

    **Tasas de descuento por fase** (método del capital riesgo):
    - Seed: 50–80 %
    - Serie A: 35–50 %
    - Serie B: 25–35 %
    - Serie C en adelante: 18–25 %
    - Capital crecimiento: 15–20 %

    ## El problema de las tasas de descuento altas

    Con una tasa del 40 %, los flujos del año 5 valen solo 18 centavos por dólar
    (1/(1,4^5) = 0,186). Los del año 10 valen 3 centavos. Por eso los DCF de fase
    inicial dependen casi por completo del valor terminal, muy sensible a las
    hipótesis de crecimiento.

    ## Un enfoque más honesto para startups

    Muchos profesionales usan en su lugar un DCF inverso: parten del precio actual
    (o de la valoración de salida objetivo) y despejan las hipótesis de
    crecimiento y margen implícitas. Y luego se preguntan: ¿son realistas?

    Usa la [calculadora de DCF](/tools/dcf-calculator/) para la versión directa,
    sin perder de vista la sensibilidad del valor terminal.
"dcf-vs-comps-valuation":
  "title": "DCF o empresas comparables: qué método de valoración usar"
  "description": "Cuándo usar el DCF o el análisis de comparables para valorar un negocio: puntos fuertes, puntos débiles y cuándo cada método da resultados fiables."
  "body": |
    Toda valoración usa al menos dos métodos y los contrasta. Aquí se explica
    cuándo es más fiable cada uno.

    ## DCF (valor intrínseco)

    **Úsalo cuando**: tengas previsiones de flujos fiables, el modelo de negocio
    sea estable y quieras entender el valor fundamental al margen del sentimiento
    del mercado.

    **Puntos fuertes**: obliga a explicitar las hipótesis de crecimiento y margen;
    muestra el valor actual de la economía futura; útil en adquisiciones y LBO.

    **Puntos débiles**: si entra basura, sale basura; pequeños cambios en la tasa
    de descuento o el crecimiento terminal provocan grandes oscilaciones de
    valoración; difícil de usar en empresas sin ingresos o sin beneficios.

    ## Análisis de empresas comparables

    **Úsalo cuando**: haya buenas comparables cotizadas con un perfil de
    crecimiento similar, quieras una comprobación validada por el mercado o estés
    preparando una ronda.

    **Múltiplos habituales**:
    - Múltiplo de ARR: 4–15× los ingresos (SaaS, según el crecimiento)
    - Múltiplo de EBITDA: 8–15× (negocios rentables)
    - Múltiplo de beneficio bruto: 5–10× (servicios, marketplaces)

    **Puntos fuertes**: refleja lo que pagan realmente los compradores ahora; fácil
    de comunicar.

    **Puntos débiles**: los múltiplos se comprimen o amplían con el mercado; las
    empresas «comparables» pueden no serlo tanto.

    ## Buena práctica: triangular

    Usa el DCF como ancla intrínseca y los comparables como contraste con la
    realidad del mercado. Si el DCF da $50M y los comparables $25M, o tus hipótesis
    son agresivas o el mercado aplica un descuento sobre los fundamentales.

    Usa la [calculadora de DCF](/tools/dcf-calculator/) para construir tu caso de
    valor intrínseco.
"ebitda-multiple-by-industry":
  "title": "Múltiplo de EBITDA por sector (referencias 2024)"
  "description": "Los múltiplos de EBITDA van de 4–6× en sectores tradicionales a 15–30× en SaaS de alto crecimiento. Esta guía recoge los múltiplos actuales por sector, crecimiento y tamaño de la operación."
  "body": |
    Los múltiplos de EBITDA reflejan las expectativas de crecimiento, la calidad de
    los ingresos recurrentes y el apetito de riesgo del mercado. Más crecimiento y
    flujos más previsibles justifican múltiplos más altos.

    ## Múltiplos EV/EBITDA por sector (2024)

    | Sector | Cuartil inferior | Mediana | Cuartil superior |
    |--------|---------------|--------|----------------|
    | SaaS (ARR > $10M, 30 %+ de crecimiento) | 15× | 22× | 30×+ |
    | Software B2B (maduro) | 8× | 12× | 18× |
    | Tecnología sanitaria | 10× | 15× | 22× |
    | Industria | 4× | 6× | 9× |
    | Distribución / logística | 5× | 7× | 10× |
    | Servicios empresariales | 5× | 8× | 12× |
    | Comercio minorista | 4× | 6× | 8× |
    | Construcción | 3× | 5× | 7× |

    ## Factores que amplían los múltiplos

    - **Crecimiento de ingresos**: cada 10 puntos más de crecimiento interanual suelen sumar 1–2 veces al múltiplo
    - **Ingresos recurrentes**: los ingresos por suscripción o contrato cotizan con prima frente a los transaccionales
    - **Margen bruto**: más margen = más múltiplo (el 70 %+ de margen del SaaS justifica una prima)
    - **Concentración de clientes**: poca concentración (ningún cliente por encima del 10 %) amplía el múltiplo
    - **Retención**: un NRR superior al 110 % puede sumar 3–5 veces al múltiplo de EBITDA de una SaaS

    ## Prima por tamaño de la operación

    Las operaciones más grandes atraen una prima. Los negocios con menos de $5M de
    EBITDA se venden con un descuento de 3–5 veces frente a comparables grandes,
    por el menor número de compradores, el riesgo de dependencia de personas clave
    y un menor apalancamiento operativo.
"how-to-calculate-your-own-ebitda-multiple":
  "title": "Cómo calcular tu propio múltiplo de EBITDA"
  "description": "Método paso a paso para estimar un múltiplo EV/EBITDA realista para tu negocio, usando transacciones comparables y ajustando por tamaño y crecimiento."
  "body": |
    Los múltiplos de EBITDA medios de un sector son un punto de partida, no una
    respuesta: el múltiplo que se aplica de verdad a tu negocio depende de su
    tamaño, su crecimiento y lo mucho que se parezca a las transacciones con las
    que se calculó la media.

    ## Paso 1: parte del rango del sector

    Busca el rango EV/EBITDA habitual de tu sector (como orientación: SaaS 15–30×,
    software B2B 8–15×, industria 5–8×, servicios 4–7×) como horquilla de partida.

    ## Paso 2: ajusta por tamaño

    Dentro de un mismo sector, los negocios pequeños cotizan sistemáticamente con
    múltiplos más bajos que los grandes: un negocio con $1M de EBITDA suele venderse
    con un descuento notable frente a uno con $20M de EBITDA del mismo sector,
    porque los compradores pagan una prima por la escala, la solidez del equipo
    directivo y un menor riesgo de dependencia de personas clave.

    ## Paso 3: ajusta por crecimiento

    Un negocio que crece más del 30 % al año suele lograr un múltiplo muy por
    encima de la mediana del sector; un EBITDA plano o en caída lleva el múltiplo a
    la parte baja del rango o por debajo. El crecimiento suele ser el factor que
    más determina en qué punto del rango cae un negocio.

    ## Paso 4: ajusta por concentración y dependencia

    Una fuerte concentración de clientes (unos pocos generan la mayoría de los
    ingresos), la dependencia de una persona clave (el negocio no funciona sin el
    fundador) o pocos ingresos recurrentes bajan el múltiplo frente a sus pares,
    porque son riesgos que hereda el comprador.

    ## Paso 5: contrasta con el EV/ingresos

    Si el EBITDA es pequeño o volátil, un múltiplo EV/ingresos sirve de
    comprobación: calcula el valor empresarial de las dos formas y mira si ambas
    estimaciones coinciden más o menos. Una gran diferencia suele indicar que
    alguna hipótesis (evolución del margen, solidez del crecimiento) hay que
    revisarla.

    ## Preguntas frecuentes

    **¿Dónde encuentro múltiplos reales de transacciones comparables?**
    Los informes de asesores de fusiones y adquisiciones, los intermediarios de
    compraventa de empresas especializados en tu sector y, para comparables
    cotizadas, los proveedores de datos financieros son las fuentes habituales. Un
    intermediario que conozca tu nicho suele ser la vía más rápida hacia una cifra
    realista.

    **¿Un múltiplo más alto es siempre mejor para el vendedor?**
    Solo combinado con la cifra real de EBITDA: un múltiplo alto sobre un EBITDA
    pequeño puede dar una valoración total menor que un múltiplo modesto sobre un
    EBITDA mucho mayor.

    Usa la [calculadora de múltiplo de EBITDA](/tools/ebitda-multiple-calculator/)
    para convertir tu EBITDA y el múltiplo elegido en un valor empresarial y un
    valor del capital estimados.
"what-is-ev-ebitda":
  "title": "¿Qué es el EV/EBITDA?"
  "description": "El EV/EBITDA (valor empresarial sobre EBITDA) es el múltiplo de valoración más usado en fusiones y adquisiciones y en private equity. Mide cuánto pagan los compradores por cada dólar de beneficio operativo, al margen de la estructura de financiación y de las decisiones contables."
  "body": |
    El **EV/EBITDA** divide el valor empresarial entre el EBITDA (beneficio antes de intereses, impuestos, depreciaciones y amortizaciones). Es el múltiplo de valoración estándar en fusiones y adquisiciones porque elimina los efectos de la estructura de capital, la estrategia fiscal y los cargos que no son caja.

    $$\text{EV/EBITDA} = \frac{\text{Valor empresarial}}{\text{EBITDA}}$$

    ## ¿Por qué EV/EBITDA y no PER?

    El PER (precio/beneficio) se ve afectado por el apalancamiento (gasto financiero) y la optimización fiscal. Dos negocios idénticos con distinta deuda muestran PER muy distintos. El EV/EBITDA elimina esas distorsiones y es más útil para comparar empresas con estructuras de capital distintas.

    ## ¿Qué es el valor empresarial?

    $$\text{EV} = \text{Capitalización bursátil} + \text{Deuda total} - \text{Caja}$$

    El EV es lo que paga realmente un comprador: adquiere la capitalización (el capital) y asume la deuda, pero recibe la caja disponible.

    ## EV/EBITDA frente a EV/ingresos

    El EV/EBITDA requiere un EBITDA positivo. En SaaS en fase inicial o de alto crecimiento con un EBITDA casi nulo, los inversores usan el **EV/ingresos** (parecido al precio/ventas). A medida que las empresas maduran y crece el EBITDA, el mercado pasa de los múltiplos de ingresos a los de EBITDA.

    ## Limitaciones

    - El EBITDA excluye el capex: los negocios intensivos en capital parecen más baratos de lo que son en EV/EBITDA
    - Los ajustes (partidas extraordinarias) pueden inflar el EBITDA ajustado en las presentaciones del vendedor
    - No es útil en servicios financieros ni en aseguradoras
"enterprise-value-vs-market-cap-difference":
  "title": "Valor empresarial frente a capitalización bursátil: ¿en qué se diferencian?"
  "description": "La capitalización solo recoge el valor del capital; el valor empresarial suma la deuda y resta la caja para mostrar el coste real de comprar todo el negocio."
  "body": |
    La capitalización bursátil y el valor empresarial responden a «¿cuánto vale
    esta empresa?», pero para dos compradores distintos: uno que compra solo el
    capital y otro que compra todo el negocio, con su deuda y su caja.

    ## Las fórmulas

    $$\text{Capitalización} = \text{Precio por acción} \times \text{Acciones en circulación}$$

    $$\text{Valor empresarial} = \text{Capitalización} + \text{Deuda total} - \text{Caja y equivalentes}$$

    ## Por qué se suma la deuda

    Al comprar una empresa, normalmente heredas su deuda junto con sus activos: el
    coste real de la adquisición incluye pagar (o asumir) esa deuda además de
    comprar a los accionistas. La capitalización por sí sola subestima el coste
    real de una empresa endeudada.

    ## Por qué se resta la caja

    La caja del balance reduce en la práctica el coste neto de la adquisición,
    porque el comprador puede usar la propia caja de la empresa para financiar la
    operación (o simplemente contabilizarla como un activo recibido). Por eso una
    empresa con mucha caja puede tener un valor empresarial bastante menor que su
    capitalización.

    ## Un ejemplo con números

    Una empresa tiene $500M de capitalización, $150M de deuda y $80M de caja:

    $$\text{EV} = \$500M + \$150M - \$80M = \$570M$$

    Con solo la capitalización de $500M se subestimaría en $70M lo que cuesta de
    verdad comprar todo el negocio.

    ## Cuándo más se separan el EV y la capitalización

    Las empresas muy apalancadas (participadas por private equity, sectores
    intensivos en capital) muestran un EV muy por encima de su capitalización. Las
    empresas con mucha caja y poca deuda (muchas empresas de software maduras)
    pueden tener un EV por debajo de su capitalización, a veces mucho, si tienen
    grandes reservas de caja en relación con su tamaño.

    ## Por qué los múltiplos usan el EV y no la capitalización

    Los múltiplos EV/EBITDA y EV/ingresos usan el valor empresarial precisamente
    porque es neutral respecto a la estructura de capital: permite comparar en
    igualdad una empresa muy endeudada con otra sin deuda, porque ambas se valoran
    como negocio operativo completo sin importar cómo se financian.

    ## Preguntas frecuentes

    **¿Puede ser negativo el valor empresarial?**
    Rara vez, pero sí: si la caja supera la capitalización más la deuda, algo que
    pasa cuando una empresa cotiza muy por debajo de su caja. Es una señal poco
    habitual que conviene investigar en lugar de darla por buena.

    **¿Qué cifra uso para comparar el tamaño de dos empresas?**
    El valor empresarial compara con más precisión el tamaño del negocio operativo,
    porque no lo distorsionan las diferencias de financiación.

    Usa la [calculadora de valor empresarial](/tools/enterprise-value-calculator/)
    para calcular el EV a partir de la capitalización, la deuda y la caja, y pasar
    del EV al valor del capital.
"ev-ebitda-multiple-benchmarks":
  "title": "Múltiplo EV/EBITDA: qué significa y referencias por sector"
  "description": "El múltiplo EV/EBITDA explicado con referencias por sector, cómo lo usa el private equity y cómo interpretar el múltiplo de tu empresa."
  "body": |
    ## El EV/EBITDA explicado

    $$\text{EV/EBITDA} = \frac{\text{Valor empresarial}}{\text{EBITDA}}$$

    El EV/EBITDA mide lo caro que es un negocio en relación con su generación de caja operativa. Es el múltiplo de adquisición más usado porque es neutral respecto a la estructura de capital y elimina el efecto de las políticas de amortización.

    ## Referencias por sector

    | Sector | EV/EBITDA habitual |
    |----------|-------------------|
    | Tecnología / SaaS | 20–40× |
    | Salud | 12–18× |
    | Bienes de consumo | 10–15× |
    | Industria | 7–12× |
    | Petróleo y gas | 5–8× |
    | Eléctricas y servicios públicos | 8–12× |
    | Compras de private equity | 6–10× |

    ## ¿Por qué EV/EBITDA en lugar de PER?

    - No le afectan las diferencias de estructura de capital (el apalancamiento no lo distorsiona)
    - Elimina las diferencias contables de amortización
    - Funciona con empresas sin beneficios (EBITDA > beneficio neto)
    - Es el lenguaje estándar en las conversaciones de fusiones y adquisiciones

    ## ¿Qué impulsa un múltiplo más alto?

    - Mayor tasa de crecimiento
    - Ingresos recurrentes o por suscripción
    - Altos costes de cambio / ventaja competitiva
    - Márgenes brutos sólidos
    - Trayectoria del equipo directivo

    Usa la [calculadora de valor empresarial](/tools/enterprise-value-calculator/) para calcular los múltiplos EV/EBITDA y EV/ingresos.
"what-is-enterprise-value":
  "title": "¿Qué es el valor empresarial?"
  "description": "Guía completa del valor empresarial: fórmula, componentes, diferencia con la capitalización bursátil y cómo se usa en fusiones y adquisiciones y en valoración."
  "body": |
    ## Definición de valor empresarial

    El valor empresarial (EV) es el coste teórico total de adquirir un negocio:

    $$\text{EV} = \text{Capitalización} + \text{Deuda total} - \text{Caja}$$

    A diferencia de la capitalización, el EV tiene en cuenta la estructura de capital: la deuda que hereda el comprador y la caja que recibe.

    ## EV frente a capitalización

    | | Capitalización | Valor empresarial |
    |-|-----------|-----------------|
    | **Qué representa** | Solo el valor del capital | Coste total de adquisición |
    | **Incluye la deuda** | No | Sí |
    | **Incluye la caja** | No | La resta |
    | **Uso** | Comparar cotizaciones | Fusiones y adquisiciones, valoración DCF |

    ## Componentes del valor empresarial

    - **Capitalización**: precio actual × acciones en circulación
    - **Deuda total**: todos los pasivos con intereses (corto y largo plazo)
    - **Caja**: la caja y sus equivalentes se restan (el comprador los recibe)
    - **Intereses minoritarios** (avanzado): se incluyen si hay filiales participadas parcialmente
    - **Acciones preferentes** (avanzado): se suman como la deuda

    ## Por qué importa el EV

    Al comparar dos empresas con distinta estructura de capital, el EV ofrece una comparación más limpia. Una empresa muy endeudada con la misma capitalización que una rival sin deuda es en realidad mucho más cara de comprar.

    Calcula el valor empresarial con la [calculadora de valor empresarial](/tools/enterprise-value-calculator/).
"cap-table-basics-for-founders":
  "title": "Lo básico de la tabla de capitalización para fundadores: estructura, dilución y errores habituales"
  "description": "Tu tabla de capitalización registra quién posee qué en tu empresa. Aprende su estructura, cómo funciona la dilución entre rondas, el pool de opciones y los errores que causan problemas en la salida."
  "body": |
    La tabla de capitalización (cap table) es el registro oficial de quién tiene
    participación en tu empresa y de qué forma. Hacerla bien desde el primer día
    evita problemas caros en rondas, adquisiciones o salidas a bolsa.

    ## Qué hay en una tabla de capitalización

    Una tabla básica tiene tres secciones:

    **Acciones ordinarias**: las de los fundadores y empleados (normalmente con
    consolidación a 4 años y un año de cliff). Los fundadores suelen empezar con
    acciones ordinarias sin consolidación, aunque añadir vesting a los fundadores
    pronto es cada vez más común y los inversores lo ven con buenos ojos.

    **Acciones preferentes**: las de los inversores en rondas con precio (seed,
    serie A, serie B…). Tienen preferencias de liquidación y otros derechos que no
    tienen las ordinarias.

    **Opciones / warrants**: opciones sobre acciones para empleados (del plan de
    opciones), warrants para asesores y otros instrumentos derivados. Las opciones
    suelen consolidarse en 4 años con un año de cliff y tienen un precio de
    ejercicio igual al valor razonable de mercado (valoración 409A en EE. UU.) en
    la fecha de concesión.

    ## Acciones totalmente diluidas frente a emitidas

    **Acciones emitidas**: las que alguien posee realmente hoy.

    **Acciones totalmente diluidas**: las emitidas más todas las opciones y
    warrants, consolidados o no, ejercidos o no.

    Los inversores casi siempre expresan su participación totalmente diluida:
    «tengo un 20 % totalmente diluido» significa el 20 % del total si se
    ejercieran todas las opciones. Es la forma correcta de calcular la dilución.

    ## El pool de opciones (ESOP)

    El pool de opciones reserva acciones para futuras concesiones a empleados.
    Tamaños habituales: 10–20 % de las acciones totalmente diluidas.

    Los inversores suelen exigir ampliar el pool *antes* de cerrar su inversión, lo
    que diluye a los fundadores, no a los inversores. Es el «option pool shuffle».

    Para minimizarlo, negocia con cuidado el tamaño del pool. Reserva solo lo que
    de verdad vayas a conceder en los próximos 18–24 meses. Un inversor que pide un
    pool del 20 % para una empresa de 5 personas se pasa: responde con un plan de
    contratación.

    ## Errores habituales

    **Sin vesting en las acciones de los fundadores**: si un cofundador se va el
    primer año, no debería quedarse con toda su participación. Pon consolidación a
    4 años con un año de cliff desde el primer día.

    **No presentar la elección 83(b)**: en EE. UU., los fundadores con acciones no
    consolidadas deben presentar la elección 83(b) en los 30 días siguientes a la
    concesión para fijar su base fiscal. Saltarse el plazo puede generar un fuerte
    impuesto sobre ingresos ficticios a medida que se consolidan las acciones.

    **Un historial de la tabla desordenado**: SAFE y notas convertibles sin
    convertir antes de una ronda con precio generan complejidad. Ordena tu tabla
    antes de la serie A.

    **Acuerdos verbales**: las promesas de participación de palabra sin un acuerdo
    firmado no son exigibles y generan disputas. Ponlo todo por escrito.

    Usa la [calculadora de dilución](/tools/equity-dilution-calculator/) para
    modelar cómo afectarán las rondas a tu tabla de capitalización.
"how-much-equity-to-give-investors":
  "title": "Cuánta participación dar a los inversores en cada fase"
  "description": "Referencias de dilución de los fundadores en pre-seed, seed, serie A y serie B, y cómo negociar la valoración para perder menos participación sin romper la operación."
  "body": |
    No hay una respuesta universal sobre cuánta participación dar a los
    inversores, pero sí normas de mercado claras. Conocerlas te permite negociar con
    conocimiento en lugar de a ciegas.

    ## Normas de mercado por fase

    **Pre-seed / amigos y familia ($100k–$500k)**
    Dilución habitual: 5–15 %
    Rango de valoración: $1M–$5M pre-money
    Inversores: business angels, amigos, familia, microfondos

    **Seed ($500k–$3M)**
    Dilución habitual: 15–25 %
    Rango de valoración: $3M–$10M pre-money
    Inversores: fondos seed, business angels, aceleradoras

    **Serie A ($3M–$15M)**
    Dilución habitual: 20–30 %
    Rango de valoración: $10M–$30M pre-money
    Inversores: fondos de capital riesgo institucionales (por ejemplo, Sequoia, Andreessen Horowitz, Benchmark)

    **Serie B ($10M–$40M)**
    Dilución habitual: 15–25 %
    Rango de valoración: $30M–$100M pre-money
    Inversores: fondos de capital crecimiento, fondos de capital riesgo institucionales

    ## Lo que realmente necesitan los inversores

    Los inversores suelen buscar un 15–25 % de participación en cada ronda. El
    motivo es la construcción de cartera: si un fondo invierte en 30 empresas
    esperando que 3 devuelvan 10 veces lo invertido, cada inversión necesita una
    participación relevante para generar rentabilidad al fondo.

    Un fondo de $100M que invierte $5M por un 20 % tiene $20M de una empresa que
    vale $100M en la salida: 4 veces lo invertido. Con solo un 10 %, la misma
    empresa devuelve $10M (2 veces). Las cuentas del fondo importan.

    ## Cómo negociar una valoración más alta

    **Tracción**: la mejor posición negociadora es el crecimiento. Un crecimiento
    mensual del 15–20 %, un buen NPS y clientes de pago te dan fuerza.

    **Term sheets competidoras**: varios inversores interesados generan
    competencia en precio. Incluso un interés informal de un segundo inversor
    mejora tu posición.

    **Valor estratégico**: los inversores con experiencia concreta (tu sector, tu
    estrategia comercial) suelen aceptar menos participación por el privilegio de
    entrar.

    **Hitos escalonados**: los SAFE y las notas convertibles aplazan la valoración
    a la siguiente ronda con precio. Si aún no tienes ingresos, un SAFE con un tope
    de valoración razonable evita negociar una valoración definitiva antes de tener
    datos de tracción.

    ## Modelo de dilución acumulada

    Fundadores que levantan $500k por un 10 %, luego $2M por un 20 % y luego $10M por un 25 %:

    Tras el pre-seed: 90 % × 100 % = **90 %**
    Tras el seed: 90 % × 80 % = **72 %**
    Tras la serie A: 72 % × 75 % = **54 %**

    Con un pool de opciones del 10 % creado en cada ronda, los fundadores suelen
    conservar un 35–45 % en la serie A. Es normal y sano.

    Modela tu ronda con la [calculadora de dilución](/tools/equity-dilution-calculator/).
"pre-money-vs-post-money-valuation":
  "title": "Valoración pre-money y post-money: la diferencia y por qué importa"
  "description": "Las valoraciones pre-money y post-money determinan cuánto de tu empresa se llevan los inversores. Una operación de $5M pre-money y otra de $5M post-money dan repartos muy distintos."
  "body": |
    La diferencia entre valoración pre-money y post-money es uno de los conceptos
    que más se confunden al levantar capital, y equivocarse puede costar a los
    fundadores mucha participación.

    ## Las definiciones

    **Valoración pre-money**: el valor acordado de la empresa *antes* de la
    inversión. El precio se negocia: inversores y fundadores acuerdan cuánto vale
    la empresa en ese momento, antes de entrar capital nuevo.

    **Valoración post-money**: pre-money + inversión. Es el valor de la empresa
    *después* de cerrar la ronda, con el capital nuevo en el balance.

    **Participación del inversor = inversión / valoración post-money**

    ## Por qué importa

    Imagina que un inversor dice: «Invierto $1M con una valoración de $5M».

    **Si $5M es pre-money:**
    Post-money = $5M + $1M = $6M
    Participación del inversor = $1M / $6M = **16,7 %**

    **Si $5M es post-money:**
    Pre-money = $5M − $1M = $4M
    Participación del inversor = $1M / $5M = **20 %**

    La misma frase y los mismos números, pero 3,3 puntos de diferencia en la
    participación del inversor. En una salida posterior, esa diferencia pesa mucho.

    ## Qué dicen las term sheets

    Las term sheets profesionales siempre especifican si la valoración es
    pre-money o post-money. Formato estándar: «La Sociedad emitirá y venderá
    acciones a un precio por acción de $X, que representa una valoración pre-money
    de $Y».

    Señales de alarma:
    - Una valoración sin especificar pre o post
    - «Valoración de $5M» sin contexto
    - Acuerdos verbales que difieren de lo escrito en la term sheet

    Si dudas, pregúntalo claramente: «¿Esos $5M son pre-money o post-money?».
    Ningún inversor serio se ofenderá.

    ## La complicación del pool de opciones

    Muchas term sheets exigen crear un pool de opciones antes del cierre, lo que
    añade acciones a la tabla antes de la inversión y diluye aún más a los
    fundadores.

    Ejemplo: $5M pre-money con una ampliación del pool al 15 %.

    Si tienes 10M de acciones y los inversores exigen un pool del 15 % tras la
    ronda:
    Nuevas opciones = (10M + nuevas opciones + acciones de los inversores) × 15 %

    Se resuelve por iteraciones. Lo clave: la ampliación del pool *siempre* sale
    del lado pre-money; diluye a los accionistas existentes, no a los inversores.

    Modela tu ronda con la [calculadora de dilución](/tools/equity-dilution-calculator/).
"peg-ratio-vs-pe-ratio":
  "title": "Ratio PEG o PER: ¿cuál es mejor para valorar?"
  "description": "Cómo mejora el ratio PEG al PER al ajustar por crecimiento, cuándo usar cada uno y qué indican los valores del PEG sobre la valoración."
  "body": |
    ## El problema del PER por sí solo

    Un PER de 30× parece caro para una eléctrica de bajo crecimiento, pero barato para una empresa de software cuyos beneficios crecen un 40 % anual. El PER ignora el crecimiento.

    ## El ratio PEG

    Peter Lynch popularizó el ratio PEG como métrica de valoración ajustada al crecimiento:

    $$\text{PEG} = \frac{\text{PER}}{\text{Crecimiento esperado del BPA (\%)}}$$

    El PEG elimina ese sesgo al normalizar el PER con las expectativas de crecimiento.

    ## Interpretación del PEG

    | PEG | Señal |
    |----|--------|
    | < 1,0 | Posiblemente infravalorada respecto a su crecimiento |
    | = 1,0 | «Precio justo»: se paga exactamente el crecimiento |
    | 1–2 | Prima moderada por el crecimiento |
    | > 2 | Cara respecto a las expectativas de crecimiento |

    **La regla práctica de Lynch**: una acción tiene un precio atractivo cuando el PEG es inferior a 1. Esta heurística funciona mejor con empresas de crecimiento de tamaño medio; es menos fiable con negocios maduros de bajo crecimiento.

    ## Limitaciones del PEG

    - Las estimaciones de crecimiento son inciertas: un fallo en la previsión de beneficios cambia mucho el PEG
    - Tiene menos sentido en valores de rentabilidad y empresas que pagan dividendos
    - No tiene en cuenta la deuda, los márgenes ni la intensidad de capital
    - Úsalo como herramienta de filtrado, no como señal de compra o venta por sí sola

    ## Rentabilidad por beneficio: otro derivado del PER

    La rentabilidad por beneficio (1 ÷ PER × 100) convierte la valoración en una métrica de rentabilidad. Compárala con la rentabilidad del bono a 10 años: cuando es parecida o inferior, la renta variable resulta menos atractiva ajustada al riesgo.

    Usa la [calculadora de PER](/tools/pe-ratio-calculator/) para calcular de una vez el PER histórico, el PER estimado, la rentabilidad por beneficio y el PEG.
"what-is-pe-ratio":
  "title": "¿Qué es el PER y cómo se usa?"
  "description": "Guía completa del ratio precio/beneficio: fórmula, PER histórico y estimado, medias históricas y cómo lo usan los inversores para valorar acciones."
  "body": |
    ## El ratio precio/beneficio (PER)

    El PER mide cuánto pagan los inversores por cada dólar de beneficio de la empresa:

    $$\text{PER} = \frac{\text{Precio de la acción}}{\text{Beneficio por acción (BPA)}}$$

    Un PER de 20 significa que los inversores pagan $20 por cada $1 de beneficio anual.

    ## PER histórico y PER estimado

    El **PER histórico** usa el BPA real publicado de los últimos 12 meses. Mira al pasado, pero se basa en cifras reales.

    El **PER estimado** usa las estimaciones de BPA de los analistas para los próximos 12 meses. Es más relevante para valorar empresas en crecimiento: descuenta expectativas en lugar de historia.

    Cuando el PER estimado es menor que el histórico, el mercado espera que crezcan los beneficios. Cuando es mayor, espera que bajen.

    ## Referencias históricas del PER

    | Periodo / situación | PER medio |
    |-------------------|------------|
    | Media a largo plazo del S&P 500 | 15–17× |
    | Desde 2010 (era de tipos bajos) | 20–25× |
    | Mínimos en recesión | 10–12× |
    | Pico de la burbuja puntocom | 40–50× o más |

    ## Limitaciones del PER

    - **Empresas cíclicas**: el PER engaña en los picos de beneficios; usa beneficios normalizados
    - **BPA negativo**: el PER no está definido en empresas con pérdidas
    - **Sectores distintos**: las empresas de software cotizan de forma natural con PER más altos que las eléctricas
    - **Decisiones contables**: los beneficios se pueden manipular; los múltiplos de flujo de caja son más robustos

    Usa la [calculadora de PER](/tools/pe-ratio-calculator/) para calcular el PER histórico y el estimado.
"arr-multiple-vs-revenue-multiple":
  "title": "Múltiplo de ARR frente a múltiplo de ingresos: diferencias clave para valorar una SaaS"
  "description": "Múltiplo de ARR frente a múltiplo de ingresos en empresas SaaS: por qué los inversores usan el ARR, cómo pasar de uno a otro y cuál usar en cada caso."
  "body": |
    En empresas SaaS, los inversores casi siempre se fijan en el **múltiplo de
    ARR** y no en el de ingresos, pero la diferencia solo importa cuando una parte
    relevante de los ingresos no es recurrente.

    ## Múltiplo de ARR

    **Múltiplo de ARR** = valoración ÷ ARR (ingresos recurrentes anuales)

    El ARR es el valor anualizado de todos los contratos de suscripción vigentes.
    Excluye:
    - Honorarios puntuales de servicios profesionales
    - Ingresos por uso aún no contratados
    - Ingresos por licencias perpetuas

    ## Múltiplo de ingresos (ratio P/S)

    **Múltiplo de ingresos** = valoración ÷ ingresos totales (contables o de los últimos 12 meses)

    En una SaaS pura de suscripción, ARR ≈ ingresos contables, así que el múltiplo
    de ARR ≈ P/S.

    En una empresa en la que el 30 % de los ingresos son servicios profesionales:
    - ARR = $7M (suscripciones recurrentes)
    - Ingresos totales = $10M (incluidos $3M de servicios)
    - Múltiplo de ARR = $70M ÷ $7M = 10x
    - Múltiplo de ingresos = $70M ÷ $10M = 7x

    ## Por qué los inversores prefieren el ARR

    Los ingresos por servicios tienen menos margen y son menos previsibles. Los
    inversores no quieren pagarlos tan caros como unos ingresos por suscripción
    fieles. El múltiplo de ARR aísla el motor recurrente.

    En SaaS por uso (modelo AWS, Snowflake, Twilio), los inversores suelen usar el
    **run rate anualizado**, los ingresos del último mes × 12, en lugar del ARR
    contratado, que puede quedarse corto frente a los ingresos reales.

    ## Regla práctica

    Si más del 90 % de tus ingresos es recurrente: múltiplo de ARR ≈ múltiplo de
    ingresos.

    Si menos del 70 % es recurrente: usa el múltiplo de ARR con los inversores y el
    de ingresos para compararte con empresas cotizadas.

    Calcula tu múltiplo de ARR con la [calculadora de P/S](/tools/price-to-sales-calculator/).
"ev-revenue-multiple-vs-ps-ratio":
  "title": "Múltiplo EV/ingresos frente a ratio P/S: cuándo difieren y por qué importa"
  "description": "EV/ingresos y ratio P/S explicados: cuándo se separan, cuál prefieren los inversores y cómo calcular el valor empresarial de tu empresa."
  "body": |
    El EV/ingresos y el ratio P/S miden la valoración respecto a los ingresos.
    Se diferencian en cómo definen el «valor» del numerador.

    ## Ratio P/S: capitalización ÷ ingresos

    **P/S** = capitalización bursátil ÷ ingresos anuales

    Capitalización = precio por acción × acciones en circulación. En empresas no
    cotizadas, es la valoración post-money. Es la métrica más sencilla y la más
    usada en empresas jóvenes.

    ## EV/ingresos: valor empresarial ÷ ingresos

    **EV** = capitalización + deuda total − caja y equivalentes

    **EV/ingresos** = valor empresarial ÷ ingresos anuales

    El EV ajusta las diferencias de estructura de capital entre empresas. Una
    empresa con $50M de caja en el balance tiene un EV menor que su capitalización:
    la caja «ya está ahí» y no hay que valorarla en el múltiplo.

    ## Cuándo se separan

    En una startup SaaS financiada por VC con $2M de caja y sin deuda:
    - Capitalización (post-money): $80M
    - EV: $80M − $2M = $78M
    - Diferencia: ~2,5 %, prácticamente iguales

    En una empresa cotizada con $1.000M de caja y $500M de deuda:
    - Capitalización: $8.000M
    - EV: $8.000M + $500M − $1.000M = $7.500M
    - Diferencia: 6,25 %, relevante

    ## ¿Cuál usan los inversores?

    Los **compradores estratégicos** prefieren el EV/ingresos porque compran el
    negocio neto de caja y deuda. Comprar por $100M una empresa con $10M de caja
    cuesta $90M netos: el EV/ingresos lo refleja.

    Los **inversores de capital riesgo** suelen usar el múltiplo de ARR
    (post-money ÷ ARR) de forma intercambiable con el P/S, porque la mayoría de
    empresas en serie A/B tienen poca deuda y poca caja respecto a su valoración.

    Los **analistas de mercados cotizados** usan el EV/ingresos como estándar para
    comparar empresas con distinta estructura de capital.

    Usa la [calculadora de P/S](/tools/price-to-sales-calculator/) para modelar
    ambas métricas.
"saas-valuation-multiples-2024":
  "title": "Múltiplos de valoración SaaS en 2024: referencias de P/S por fase de crecimiento"
  "description": "Múltiplos actuales de P/S y EV/ingresos de SaaS en 2024: comparables cotizadas, medianas del mercado privado y cómo el crecimiento determina el múltiplo."
  "body": |
    Tras la compresión de múltiplos de 2022–2023, las valoraciones SaaS se han
    estabilizado en 2024. Estas son las referencias actuales que usan los
    inversores para poner precio al software en crecimiento.

    ## Múltiplos P/S de SaaS cotizadas (2024)

    A mediados de 2024, la SaaS cotizada mediana cotiza a unas **4–6 veces los
    ingresos previstos**. El cuartil superior de alto crecimiento (ARR creciendo un
    40 % o más) logra 8–12x, frente a los picos de 15–25x de 2021.

    | Categoría de crecimiento | Rango de P/S habitual (2024) |
    |---|---|
    | Hipercrecimiento (ARR +50 % o más) | 8–15x |
    | Alto crecimiento (ARR +30–50 %) | 5–10x |
    | Crecimiento (ARR +20–30 %) | 3–6x |
    | Moderado (ARR +10–20 %) | 2–4x |
    | Madura (ARR < +10 %) | 1–2x |

    ## Múltiplos de ARR en el mercado privado

    Las valoraciones privadas van 6–12 meses por detrás de las cotizadas. En 2024:
    - **Seed**: 8–15x el ARR (a menudo sin ingresos; basado en el equipo y el mercado)
    - **Serie A**: 8–15x el ARR en empresas que crecen más del 80 %
    - **Serie B**: 10–20x el ARR con más del 50 % de crecimiento y un NRR sólido
    - **Serie C en adelante**: converge hacia las comparables cotizadas con descuento por iliquidez

    ## Qué amplía los múltiplos

    Justifican múltiplos más altos:
    1. **Crecimiento de ingresos**: el factor más importante
    2. **Retención neta de ingresos**: un NRR superior al 120 % aporta una prima de 1,5–2x
    3. **Margen bruto**: un 80 % o más, típico de SaaS con múltiplos altos
    4. **Regla del 40**: crecimiento + margen FCF por encima de 40 respalda múltiplos premium
    5. **Tamaño del mercado**: un TAM claramente grande
    6. **Ventaja competitiva**: costes de cambio, efectos de red, ventajas de datos

    Calcula tu P/S actual y una valoración comparable con la
    [calculadora de P/S](/tools/price-to-sales-calculator/).
"how-to-calculate-tam-sam-som":
  "title": "Cómo calcular TAM, SAM y SOM para tu presentación a inversores"
  "description": "Guía paso a paso para dimensionar el mercado en presentaciones a inversores: métodos descendente y ascendente para TAM, SAM y SOM con ejemplos."
  "body": |
    Calcular TAM, SAM y SOM para tu presentación exige algo más que multiplicar una
    población por un gasto medio. Los inversores quieren ver que entiendes tu
    mercado concreto, no solo que sabes encontrar una cifra grande.

    ## Paso 1: define tu mercado con precisión

    Antes de calcular, define quién es tu cliente. Cuanto más precisa sea la
    definición, más creíbles serán tu SAM y tu SOM.

    **Demasiado amplio**: «mercado de software para pymes»
    **Demasiado estrecho**: «empresas SaaS de 10–50 empleados en San Francisco que usan Salesforce»
    **Adecuado**: «empresas SaaS B2B de 10–200 empleados en Norteamérica con equipos comerciales propios»

    La definición de mercado debe coincidir con tu ICP (perfil de cliente ideal):
    los clientes a los que de verdad te diriges y vendes.

    ## Paso 2: calcula el TAM (descendente)

    El enfoque descendente usa estudios de mercado existentes:

    1. Busca informes de analistas (Gartner, Forrester, IDC) que estimen el
       mercado total de tu categoría
    2. Si no existen, usa una aproximación: el gasto total en la categoría que
       sustituyes
    3. Conviértelo a tu precio: si el mercado gasta $10.000M en software
       tradicional y tu SaaS sustituto cuesta un 30 % menos, el TAM disruptivo es
       de $7.000M y el TAM actual de $10.000M

    **Ejemplo**: el mercado de software de gestión de proyectos se estima en
    $7.300M anuales (fuente: Grand View Research). TAM = **$7.300M**.

    ## Paso 3: calcula el TAM (ascendente, más creíble)

    El enfoque ascendente cuenta clientes y multiplica por el ACV:

    1. Define tu ICP: empresas de EE. UU. de 20–500 empleados en servicios profesionales
    2. Cuenta: LinkedIn muestra 85.000 empresas con ese perfil
    3. Tasa de conversión: los estudios indican que el 40 % tiene el problema concreto que resuelves = 34.000
    4. ACV medio: $12.000 al año

    TAM = 34.000 × $12.000 = **$408M**

    Así obtienes un TAM creíble y justificable que los inversores pueden examinar.

    ## Paso 4: calcula el SAM

    El SAM filtra el TAM según tu alcance actual:
    - Geografía: hoy solo vendes a empresas de EE. UU. → excluye el internacional
    - Idioma: producto solo en inglés → excluye mercados de otros idiomas
    - Tecnología: producto dependiente de integraciones → filtra por compatibilidad
    - Segmento: límites de canal → filtra por el tamaño de empresa que puedes cerrar

    Si el 60 % de tu TAM es accesible con tus limitaciones actuales:
    SAM = $408M × 0,60 = **$245M**

    ## Paso 5: calcula el SOM

    El SOM es un cálculo de capacidad comercial, no un porcentaje del mercado:

    Plan de contratación a 3 años: 8 AE × 20 ventas al año × $12k de ACV = **$1,92M de ARR**
    Ese es tu SOM: el mercado que puedes atender de forma realista en 3 años.

    Expresar el SOM como porcentaje del SAM es secundario: $1,92M / $245M = 0,78 %,
    pequeño pero creíble para una empresa de 3 años.

    Usa la [calculadora de TAM SAM SOM](/tools/tam-sam-som-calculator/) para modelar tus cifras.
"top-down-vs-bottom-up-market-sizing":
  "title": "Dimensionamiento descendente o ascendente: ¿en cuál confían los inversores?"
  "description": "El dimensionamiento descendente usa informes del sector; el ascendente cuenta clientes y multiplica por el ACV. Los inversores prefieren el ascendente: así se construye un modelo ascendente creíble."
  "body": |
    Al presentar el tamaño de mercado, cómo lo calculas importa tanto como la
    cifra. Los inversores han visto miles de diapositivas descendentes con el mismo
    informe de Gartner. Un análisis ascendente demuestra que entiendes a tus
    clientes reales.

    ## Dimensionamiento descendente

    **Método**: parte de un informe del sector y recorta tu porcentaje.

    **Ejemplo**:
    «El mercado mundial de software de RR. HH. es de $16.500M (Gartner, 2025).
    Nos centramos en la nómina para pymes, que supone el 15 % del mercado = $2.500M de TAM.»

    **Ventajas**: rápido; usa fuentes externas creíbles.

    **Inconvenientes**: impreciso; cualquiera encuentra una cifra grande; no
    demuestra que entiendas al cliente. Los inversores suelen descartar las
    diapositivas descendentes con un «sabemos que habéis usado un informe de
    Gartner».

    **Cuándo usarlo**: para dar contexto y credibilidad con fuentes reconocidas.
    Siempre junto al ascendente.

    ## Dimensionamiento ascendente

    **Método**: cuenta los clientes potenciales y multiplica por los ingresos medios.

    **Ejemplo para una herramienta de RR. HH. B2B**:
    - Objetivo: empresas de EE. UU. de 20–200 empleados en servicios profesionales
    - Fuentes: Bureau of Labor Statistics + búsqueda en LinkedIn
    - Recuento: ~180.000 empresas encajan
    - Filtro: ~40 % no están satisfechas con su solución de RR. HH. actual = 72.000 clientes potenciales activos
    - ACV medio: $8.000 al año

    TAM ascendente = 72.000 × $8.000 = **$576M**

    **Ventajas**: concreto; defendible; demuestra que entiendes a tu comprador.

    **Inconvenientes**: lleva tiempo; necesita datos que pueden no ser públicos;
    las estimaciones se acumulan.

    ## Construir un modelo ascendente

    **Paso 1: parte de datos firmográficos**
    Usa LinkedIn Sales Navigator, Bombora, ZoomInfo o Apollo para contar las
    empresas que encajan con tu ICP. Filtra por tamaño, sector, geografía y
    tecnología.

    **Paso 2: estima la parte que tiene tu problema**
    Encuestas, entrevistas con clientes o datos indirectos (por ejemplo, ofertas
    de empleo para el puesto que resuelves) ayudan a estimar qué porcentaje de tu
    ICP tiene realmente el problema que resuelves.

    **Paso 3: estima la conversión y el ACV medio**
    Usa tu tasa de conversión y tu ACV actuales como aproximación, asumiendo que
    pueden cambiar si subes de segmento o amplías funciones.

    **Paso 4: contrasta con el descendente**
    Comprueba que la cifra ascendente encaja de forma plausible dentro del recorte
    descendente: $576M para servicios profesionales de EE. UU. son aproximadamente
    una cuarta parte del segmento mundial de nómina para pymes ($2.500M), algo
    creíble para un país y un vertical. Si la cifra ascendente supera el segmento
    descendente, o es una fracción minúscula de él, investiga por qué.

    ## Presentar ambos en un pitch

    | Disposición | Contenido |
    |---|---|
    | Panel izquierdo | Descendente: «El mercado mundial de software de RR. HH. es de $16.500M; operamos en el segmento de nómina para pymes ($2.500M)» |
    | Panel derecho | Ascendente: «180k empresas de EE. UU. encajan con nuestro ICP. El 40 % tiene el problema = 72k empresas × $8k de ACV = $576M» |
    | Pie | «Nuestros primeros 24 meses se centran en la oportunidad de $576M en pymes de EE. UU.; expansión internacional en el año 3.» |

    Esta disposición demuestra rigor y triangulación: los inversores ven dos
    métodos que coinciden.

    Modela tu TAM con la [calculadora de TAM SAM SOM](/tools/tam-sam-som-calculator/).
"what-tam-do-investors-want-to-see":
  "title": "¿Qué TAM quieren ver los inversores? Expectativas de los VC por fase"
  "description": "Las cuentas de los fondos de capital riesgo exigen mercados grandes. Descubre el TAM mínimo esperado en cada ronda, por qué algunos inversores rechazan negocios con un TAM de $500M y cómo plantear mercados pequeños."
  "body": |
    El TAM mínimo que quieren ver los inversores depende del tamaño del fondo, la
    fase y los objetivos de rentabilidad. Entender las cuentas detrás de sus
    expectativas te ayuda a plantear bien tu mercado.

    ## Las cuentas del fondo detrás del TAM exigido

    Los VC buscan devolver 3 veces el fondo. Un fondo de $100M necesita devolver $300M.
    Supón 30 inversiones, 3 ganadoras y 27 fracasos (ley de potencia típica).
    Las 3 ganadoras deben devolver $300M entre todas: ~$100M cada una.

    Para que una ganadora devuelva $100M, el fondo debe tener un 20 % en la salida, y la salida debe superar los $500M.

    Con un múltiplo de 10 veces los ingresos (habitual en SaaS), una salida de $500M = $50M de ARR.
    Para que $50M de ARR tengan sentido, la empresa necesita ~5–10 % de cuota de mercado.
    Por tanto: TAM mínimo para que las cuentas salgan = **$500M–$1.000M**.

    Los fondos pequeños ($30M) pueden financiar empresas con TAM de $200M. Los grandes ($500M) necesitan TAM de más de $5.000M.

    ## Expectativas de TAM por fase

    **Business angels / pre-seed ($100k–$500k)**
    TAM: $200M o más es aceptable
    Los business angels asumen más riesgo; los tickets son pequeños y las
    expectativas de rentabilidad variables. Les importan más el equipo y la
    tracción inicial que las cuentas del TAM.

    **Seed ($500k–$3M)**
    TAM: $500M como mínimo, preferible $1.000M o más
    Los fondos seed aún exigen menos rentabilidad que los de serie A. La
    definición del problema y las primeras métricas pesan más que el tamaño del
    mercado.

    **Serie A ($3M–$15M)**
    TAM: $1.000M como mínimo, preferible $3.000M o más
    En la serie A demuestras que el negocio es repetible y escalable. Los VC
    necesitan ver un camino claro a más de $10M de ARR en un mercado con margen
    para llegar a $100M.

    **Serie B en adelante ($15M–$100M o más)**
    TAM: más de $5.000M
    La serie B apuesta por el liderazgo del mercado. Necesitas un mercado lo
    bastante grande para construir una empresa cotizada (más de $100M de ARR).

    ## Qué hacer con un TAM «pequeño»

    Si tu TAM es de $200M–$500M, tienes tres opciones:

    **1. Replantear el mercado**: ¿lo estás mirando demasiado de cerca?
    Un TAM de «software de contabilidad para pequeñas empresas de EE. UU.» de
    $2.000M se convierte en un TAM de «plataforma global de gestión financiera para
    pequeñas empresas» de $20.000M, si la expansión es creíble.

    **2. Buscar caminos sin VC**: el bootstrapping, la financiación basada en
    ingresos o los inversores de private equity y family offices no tienen las
    mismas exigencias de rentabilidad. Muchos negocios excelentes de $20–50M de
    ingresos se han construido en mercados «pequeños».

    **3. Mostrar expansión a mercados adyacentes**: demuestra que usarás el TAM
    principal para entrar en mercados vecinos. AWS empezó con almacenamiento en la
    nube; HubSpot, con email marketing.

    Usa la [calculadora de TAM SAM SOM](/tools/tam-sam-som-calculator/) para dimensionar tu mercado.

"how-to-calculate-breakeven-roas":
  "title": "Cómo calcular el ROAS de equilibrio"
  "description": "La fórmula del ROAS de equilibrio explicada: cómo hallar el ROAS mínimo para no perder dinero en publicidad de pago según tu margen bruto."
  "body": |
    El ROAS de equilibrio es el retorno de la inversión publicitaria mínimo para
    no perder dinero. Gastas un dólar en anuncios y generas justo los ingresos
    necesarios para cubrir ese dólar y el coste del producto. Beneficio neto: cero.

    ## La fórmula del ROAS de equilibrio

    **ROAS de equilibrio = 1 ÷ % de margen bruto**

    Donde margen bruto = (ingresos − coste de ventas) ÷ ingresos

    Funciona porque:
    - Ingresos de los anuncios = ROAS × inversión publicitaria
    - Beneficio bruto = ingresos × % de margen bruto
    - En el equilibrio: beneficio bruto = inversión publicitaria
    - ROAS × inversión × margen bruto = inversión
    - ROAS = 1 ÷ margen bruto

    ## Ejemplos con números

    **E-commerce: 40 % de margen bruto**
    ROAS de equilibrio = 1 ÷ 0,40 = **2,5×**

    Si gastas $1.000 en anuncios y generas $2.500 de ingresos: $2.500 × 40 % = $1.000
    de beneficio bruto. Los anuncios cuestan $1.000. Neto: cero. Necesitas más de
    2,5× para ganar dinero.

    **SaaS: 75 % de margen bruto**
    ROAS de equilibrio = 1 ÷ 0,75 = **1,33×**

    Los SaaS pueden ser rentables con un ROAS mucho menor porque la mayor parte de
    cada dólar de ingresos es beneficio bruto. Incluso un ROAS de 2× es muy
    rentable con un 75 % de margen.

    **Dropshipping: 20 % de margen bruto**
    ROAS de equilibrio = 1 ÷ 0,20 = **5,0×**

    Los negocios de bajo margen necesitan un ROAS muy alto para ser rentables.
    Google y Meta suben los costes con el tiempo: si no puedes sostener un ROAS de
    5× o más, la publicidad no es viable con márgenes bajos.

    ## Tabla de referencia rápida

    | Margen bruto | ROAS de equilibrio | ¿Rentable con un ROAS de 4×? |
    |---|---|---|
    | 15 % | 6,67× | No (ROI del −40 %) |
    | 25 % | 4,0× | No (0 %, equilibrio) |
    | 35 % | 2,86× | Sí (ROI del 40 %) |
    | 50 % | 2,0× | Sí (ROI del 100 %) |
    | 70 % | 1,43× | Sí (ROI del 180 %) |

    ## ROAS de equilibrio en modelos de valor de vida del cliente

    En negocios de suscripción, juzga los anuncios por el beneficio bruto de toda
    la vida del cliente y no por el primer pedido. La adquisición está en
    equilibrio cuando:

    **LTV × % de margen bruto = CAC**

    Por eso las SaaS pueden justificar adquirir clientes con pérdidas (ROAS por
    debajo del equilibrio) si el LTV es lo bastante alto: la recuperación llega a
    lo largo de meses de suscripción.

    Usa la [calculadora de ROAS](/tools/ad-roas-calculator/) para calcular tu ROAS
    de equilibrio y ver si tus campañas actuales son rentables con tu margen bruto.
"roas-vs-roi-difference":
  "title": "ROAS frente a ROI: ¿en qué se diferencian?"
  "description": "Entiende la diferencia entre ROAS (retorno de la inversión publicitaria) y ROI (retorno de la inversión) en publicidad digital, y cuándo usar cada uno."
  "body": |
    El ROAS y el ROI miden la eficacia publicitaria, pero responden a preguntas
    distintas. Confundirlos lleva a malas decisiones sobre la inversión en
    anuncios.

    ## ROAS: un múltiplo de ingresos

    **ROAS = ingresos de los anuncios ÷ inversión publicitaria**

    El ROAS indica cuántos ingresos genera cada dólar de publicidad. Es rápido, se
    mide por canal y no necesita datos del coste de ventas: por eso las
    plataformas publicitarias (Google, Meta) lo usan de forma nativa en sus
    algoritmos de puja.

    Un ROAS de 5× significa que cada dólar invertido devolvió $5 de ingresos.
    Sencillo.

    ## ROI: un múltiplo de beneficio

    **ROI = (beneficio bruto − inversión publicitaria) ÷ inversión publicitaria × 100**

    Donde beneficio bruto = ingresos × % de margen bruto

    El ROI indica cuánto beneficio genera cada dólar de publicidad. Exige conocer
    tu coste de ventas (o tu margen bruto), algo que el ROAS no necesita.

    ## Por qué dan señales distintas

    | Caso | ROAS | Margen bruto | Beneficio bruto | Inversión | ROI |
    |---|---|---|---|---|---|
    | SaaS de margen alto | 3× | 80 % | $240 | $100 | 140 % |
    | E-commerce de margen medio | 4× | 45 % | $180 | $100 | 80 % |
    | Dropshipping de margen bajo | 5× | 15 % | $75 | $100 | −25 % |

    El ejemplo del dropshipping muestra el peligro de optimizar solo el ROAS: 5×
    suena genial, pero no es rentable con un 15 % de margen.

    ## Cuándo usar el ROAS

    - Comparar canales y optimizar pujas (Smart Bidding de Google, Advantage+ de Meta)
    - Seguir el rendimiento de las campañas en tiempo real
    - Comparar creatividades dentro de un canal

    ## Cuándo usar el ROI

    - Evaluación final de la inversión publicitaria en la cuenta de resultados
    - Comparar la publicidad de pago con otros canales (email, SEO, contenidos)
    - Decisiones de reparto de presupuesto a nivel de dirección financiera o general

    ## La regla práctica

    Usa el ROAS en el día a día. Usa el ROI para decidir presupuestos. Conoce
    siempre tu ROAS de equilibrio (1 ÷ margen bruto) para saber si tu ROAS es
    rentable.

    Usa la [calculadora de ROAS](/tools/ad-roas-calculator/) para convertir tu
    ROAS en ROI al instante indicando tu margen bruto.
"what-is-a-good-roas":
  "title": "¿Qué es un buen ROAS? (por canal y sector)"
  "description": "Qué es un buen retorno de la inversión publicitaria en Google, Meta, TikTok y e-commerce, con fórmulas de ROAS de equilibrio según el margen bruto."
  "body": |
    «¿Qué es un buen ROAS?» es una de las preguntas más buscadas del marketing
    digital, y una de las más engañosas. No hay una respuesta universal: que un 4×
    sea bueno o pésimo depende por completo de tu margen bruto.

    ## La única referencia de ROAS que importa: tu equilibrio

    Antes de comparar tu ROAS con las medias del sector, calcula tu propio
    equilibrio:

    **ROAS de equilibrio = 1 ÷ % de margen bruto**

    Un ROAS de 4× con un 25 % de margen bruto = $4 de ingresos, $1 de beneficio bruto, tras $1 de publicidad = equilibrio.
    Un ROAS de 4× con un 60 % de margen bruto = $4 de ingresos, $2,40 de beneficio bruto, tras $1 de publicidad = 140 % de ROI.

    ## Referencias de ROAS por canal

    | Canal | Rango habitual | Los mejores |
    |---|---|---|
    | Google Search (marca) | 6–15× | 20×+ |
    | Google Shopping | 3–8× | 10×+ |
    | Meta / Facebook | 2–5× | 8×+ |
    | TikTok Ads | 1,5–4× | 6×+ |
    | Display / programático | 1–3× | 5×+ |

    La búsqueda de marca siempre da el ROAS más alto porque capta una demanda que
    ya existe a bajo coste. La prospección sin marca a audiencias frías siempre
    tendrá menos ROAS, pero es imprescindible para crecer.

    ## Referencias de ROAS por sector

    | Sector | ROAS objetivo habitual |
    |---|---|
    | E-commerce (margen bajo) | 4–8× |
    | E-commerce (margen alto) | 3–5× |
    | SaaS (modelo LTV) | 2–4× (sobre CPA) |
    | Generación de leads / B2B | 3–10× (sobre ingresos atribuidos) |
    | Cajas por suscripción | 3–6× |

    ## La forma correcta de fijar un ROAS objetivo

    1. Calcula tu margen bruto (o pídeselo a tu asesor)
    2. Decide el margen de beneficio que quieres obtener de los anuncios (por ejemplo, 20 %)
    3. ROAS objetivo = 1 ÷ (% de margen bruto − % de beneficio objetivo)

    Ejemplo: 50 % de margen bruto y 20 % de beneficio objetivo → 1 ÷ 0,30 = ROAS objetivo de 3,33×.

    Usa la [calculadora de ROAS](/tools/ad-roas-calculator/) para hacer las cuentas
    con tus márgenes y ver al instante tu ROAS de equilibrio y tu ROAS objetivo.
"average-order-value-vs-revenue-per-visitor":
  "title": "Ticket medio frente a ingresos por visitante: cuál optimizar"
  "description": "El ticket medio y los ingresos por visitante miden cosas relacionadas pero distintas. Así sabrás qué palanca moverá de verdad tus ingresos y cuándo centrarte en cada una."
  "body": |
    El ticket medio y los ingresos por visitante suelen moverse juntos, así que los
    equipos tienden a tratarlos como intercambiables. Pero responden a preguntas
    distintas y reaccionan a palancas distintas.

    ## Las fórmulas

    $$\text{Ticket medio} = \frac{\text{Ingresos totales}}{\text{Número de pedidos}}$$

    $$\text{Ingresos por visitante} = \frac{\text{Ingresos totales}}{\text{Visitantes totales}}$$

    Los ingresos por visitante son en realidad el ticket medio × la tasa de
    conversión: ingresos por visitante = ticket medio × (pedidos ÷ visitantes). Esa
    relación es la clave para saber cuál optimizar.

    ## Qué aísla cada uno

    El **ticket medio** aísla el tamaño de la cesta: cuánto gasta cada comprador una
    vez que decide comprar. Depende de upsells, packs y estructura de precios.

    Los **ingresos por visitante** dan la imagen completa: cuánto sacas de *cada*
    visitante, incluidos los que nunca compran. Dependen a la vez del ticket medio
    y de la tasa de conversión.

    ## Por qué optimizar solo el ticket medio puede engañarte

    Un cambio en el checkout que sube el ticket medio un 15 % pero baja la
    conversión un 20 % (por ejemplo, un upsell agresivo que molesta a los
    compradores) es una pérdida neta: los ingresos por visitante caen aunque la
    métrica estrella del ticket medio mejore. Revisa siempre los ingresos por
    visitante, no solo el ticket medio, al evaluar un cambio de monetización.

    ## Cuándo centrarte en el ticket medio o en la conversión

    | Situación | Palanca con más efecto |
    |-----------|----------------------|
    | Mucho tráfico, poca conversión | Tasa de conversión (arregla primero el embudo) |
    | Buena conversión, cestas pequeñas | Ticket medio (packs, upsells, umbral de envío gratis) |
    | Ambos sanos pero el crecimiento se ha frenado | Nuevas fuentes de tráfico o subir el techo del ticket (nuevas referencias, planes) |

    ## Preguntas frecuentes

    **¿Puedo mejorar a la vez el ticket medio y la conversión?**
    Sí: los umbrales de envío gratis y los packs bien colocados suelen mejorar
    ambos a la vez, porque añaden valor percibido sin añadir fricción al checkout.

    **¿Qué métrica presento a los stakeholders?**
    Los ingresos por visitante son la métrica global de salud más completa.
    Presenta el ticket medio y la tasa de conversión como las dos palancas que la
    componen, para que se vea cuál impulsa de verdad sus cambios.

    Usa la [calculadora de ticket medio](/tools/aov-calculator/) para calcular el
    ticket medio y los ingresos por visitante con tus propias cifras de ingresos,
    pedidos y tráfico.
"how-to-increase-average-order-value":
  "title": "Cómo aumentar el ticket medio (7 tácticas probadas)"
  "description": "Aumenta el ticket medio con upsells, ventas cruzadas, umbrales de envío gratis, descuentos por volumen y packs. Cada táctica sube los ingresos sin añadir coste de adquisición."
  "body": |
    Subir el ticket medio es la estrategia de crecimiento más eficiente en capital, porque cada mejora se multiplica por todo tu volumen de pedidos actual. Estas son las tácticas con más impacto, ordenadas por dificultad de implantación.

    ## 1. Umbral de envío gratis

    Fija un pedido mínimo para el envío gratis un 20–30 % por encima de tu ticket medio actual. Cuando el cliente ve «Añade $12,50 para el envío gratis», la mayoría añade otro artículo. Es la táctica de ticket medio con más retorno para productos físicos.

    **Ejemplo**: con un ticket medio de $65, fija el envío gratis en $80. Los estudios muestran que el 30–50 % de los compradores añade artículos para conseguirlo.

    ## 2. Upsells en el checkout

    Ofrece un único upsell relevante en el carrito o en el checkout. Debe:
    - Estar muy relacionado con lo que ya hay en el carrito
    - Costar el 25–50 % del valor del carrito (no más)
    - Presentarse como una mejora, no como un añadido

    ## 3. Packs de productos

    Agrupa productos complementarios con un 5–15 % de descuento frente a comprarlos por separado. Los packs suben el ticket medio Y reducen la fricción de decisión: el cliente compra el pack en lugar de dudar con cada artículo.

    ## 4. Descuentos por volumen

    «Compra 2 y ahorra un 15 %. Compra 3 y ahorra un 25 %.» Los precios por volumen funcionan en consumibles, licencias de software y planes SaaS con varios usuarios. El coste del descuento se compensa con el aumento del ticket medio.

    ## 5. Upsells después de la compra

    Ofrece un upsell justo después de la confirmación de compra (antes de que el cliente se vaya). Las ofertas post-compra suelen convertir al 5–15 % porque la mentalidad de compra sigue activa.

    ## 6. Puntos de fidelidad y recompensas

    Los programas de puntos animan a gastar más por pedido para alcanzar el siguiente nivel. Suben tanto el ticket medio como la frecuencia de compra: un efecto acumulado sobre el valor de vida del cliente.

    ## 7. Recomendaciones de productos

    «Los clientes que compraron X también compraron Y.» Amazon atribuye ~35 % de sus ingresos a las ventas cruzadas de su motor de recomendaciones. Úsalas en las fichas de producto, el carrito y los emails de confirmación de pedido.
"what-is-average-order-value":
  "title": "¿Qué es el ticket medio (AOV)?"
  "description": "El ticket medio (AOV) son los ingresos totales divididos entre el número de transacciones de un periodo. Es una métrica clave en e-commerce y SaaS porque subirlo aumenta los ingresos sin añadir coste de adquisición."
  "body": |
    El **ticket medio (AOV)** mide el ingreso medio generado por transacción.

    $$\text{Ticket medio} = \frac{\text{Ingresos totales}}{\text{Número de pedidos}}$$

    ## Por qué el ticket medio es la métrica con más retorno al mejorarla

    El coste de adquisición de clientes (CAC) ya está pagado cuando el visitante llega a tu web. El ticket medio determina cuántos ingresos genera esa adquisición. Mejorarlo un 20 % sube los ingresos un 20 % sin gastar un dólar más en marketing.

    Compáralo con duplicar el tráfico: el mismo 20 % más de ingresos, pero el tráfico cuesta dinero. Las mejoras de ticket medio son gratis.

    ## Ticket medio, tasa de conversión e ingresos por visitante

    $$\text{Ingresos por visitante} = \text{Ticket medio} \times \text{Tasa de conversión}$$

    Por eso optimizar los ingresos por visitante recoge las dos dimensiones a la vez. Una tienda con ticket medio alto y poco tráfico puede facturar más que una con mucho tráfico y ticket medio bajo.

    ## Calcular el ticket medio por segmento

    El ticket medio total mezcla todas las cohortes de clientes. Segmenta por:
    - **Canal**: orgánico, de pago o email; cada uno suele tener un ticket medio distinto
    - **Clientes nuevos o recurrentes**: los recurrentes tienen de media un ticket un 30–50 % más alto en la mayoría de tiendas
    - **Categoría de producto**: las categorías generan pedidos de tamaños muy distintos
"cro-vs-traffic-growth-roi":
  "title": "CRO o crecimiento del tráfico: ¿qué tiene mejor ROI?"
  "description": "Comparación basada en datos entre optimizar la tasa de conversión y hacer crecer el tráfico o la adquisición, con la fórmula para saber cuál es más eficiente en tu caso."
  "body": |
    Al decidir dónde invertir para crecer, la elección suele reducirse a: ¿conseguir
    más tráfico o convertir más del tráfico que ya tienes?

    La respuesta depende de tu tasa de conversión actual, tu volumen de tráfico y
    el coste de cada enfoque.

    ## Las cuentas del crecimiento del tráfico

    Si gastas $10.000 al mes en anuncios para duplicar el tráfico de 10.000 a
    20.000 visitantes, con un 2 % de conversión y un ARPU de $99:

    - Conversiones adicionales: 200 al mes
    - Ingresos adicionales: $19.800 al mes
    - Coste: $10.000 al mes
    - ROI: 98 %

    ## Las cuentas de la CRO

    Si gastas $5.000 en rediseñar una landing page que sube la conversión del 2 %
    al 3,5 %:

    - Conversiones adicionales: 150 al mes (10.000 visitantes × 1,5 puntos más)
    - Ingresos adicionales: $14.850 al mes
    - Coste: $5.000 una sola vez
    - ROI del primer mes: 197 %, y la mejora es permanente

    ## Cuándo gana el crecimiento del tráfico

    - Tu tasa de conversión ya es alta (más del 5 %): mejorarla cuesta más
    - Tienes un buen product-market fit pero una distribución limitada
    - Tus canales de pago tienen CPC bajos en tu mercado objetivo
    - Quieres ganar cuota de mercado rápido antes de que aumente la competencia

    ## Cuándo gana la CRO

    - Tu conversión actual está por debajo de la referencia (menos del 2 % en la página de precios)
    - El tráfico es caro en tu sector (CPC de más de $5–10)
    - Tienes tráfico suficiente para tests estadísticamente válidos (más de 1.000 visitantes al mes)
    - Nunca has hecho CRO de forma sistemática: suele haber mejoras rápidas

    ## La regla práctica

    Si tu conversión es inferior al 2 %: invierte primero en CRO.
    Si supera el 3 %: invierte en tráfico en cuanto puedas sostener el volumen.
    Entre el 2 % y el 3 %: prueba ambos y mide el coste por conversión adicional.

    Usa la [calculadora de tasa de conversión](/tools/conversion-rate-calculator/)
    para modelar el aumento exacto de ingresos de mejorar la conversión frente a un
    aumento de tráfico equivalente.
"how-to-improve-saas-conversion-rate":
  "title": "Cómo mejorar la tasa de conversión de una SaaS: 5 tácticas probadas"
  "description": "Tácticas prácticas para mejorar la conversión de prueba a pago y de visitante a prueba de una SaaS, con referencias y las cuentas de ingresos detrás de cada mejora."
  "body": |
    Mejorar la conversión de una SaaS consiste en quitar fricción y añadir
    confianza en cada paso del embudo. Estas son las tácticas con más
    apalancamiento, ordenadas por impacto habitual y rapidez de implantación.

    ## 1. Reducir la fricción del registro al mínimo absoluto

    Cada campo que añades al formulario de registro reduce la conversión. La
    referencia: pedir solo email y contraseña al registrarse. Todo lo demás
    (empresa, puesto, tamaño del equipo) se recoge durante el onboarding, cuando el
    usuario ya se ha comprometido a explorar el producto.

    Regla: si el campo no es imprescindible para crear la cuenta o entregar el
    valor principal, quítalo.

    ## 2. Añadir prueba social concreta en la parte visible

    «500 empresas confían en nosotros» es débil. «Lo usan equipos de Stripe, Notion
    y otras 500 empresas» es más fuerte. «4,8/5 en G2 con más de 1.200 reseñas» es
    una prueba concreta.

    La concreción convierte mejor que los superlativos. «Reduce un 40 % el tiempo
    de reporting» gana a «Te ahorra horas cada semana».

    ## 3. Aclarar la página de precios antes de la prueba

    Los visitantes que no entienden qué obtendrán al acabar la prueba no
    convierten. Tres tácticas:
    - Mostrar el precio posterior a la prueba en la página de registro (la transparencia genera confianza)
    - Añadir una pregunta frecuente: «¿Qué pasa cuando termina tu prueba?»
    - Incluir la tabla comparativa de planes con el plan de prueba bien destacado

    ## 4. Acortar el tiempo hasta el valor en el onboarding

    La CRO con más apalancamiento en SaaS ocurre *dentro* del producto, no en la
    landing page. Los usuarios que llegan a su «momento aha» (la primera vez que
    el producto resuelve claramente su problema) convierten entre 3 y 5 veces más
    que los que no.

    Mapea tu ruta de activación: ¿cuál es el conjunto mínimo de acciones que lleva
    al usuario al momento aha? Elimina cada paso que no contribuya a ello.

    ## 5. Usar ventanas de intención de salida en la página de precios

    Una ventana de «espera, antes de irte» con una oferta concreta (demo gratis,
    prueba ampliada, caso de éxito) recupera un 2–5 % de los visitantes de la
    página de precios que se perderían. Suele ser la mejora de conversión más
    rápida de implantar.

    ## Impacto en ingresos de cada punto de conversión

    Usa la fórmula: **aumento de ingresos = visitantes × 0,01 × ARPU**

    Con 10.000 visitantes en la página de precios y un ARPU de $149, cada punto
    absoluto de conversión = $14.900 al mes de ingresos adicionales. Esas son las
    cuentas para priorizar la CRO.

    Usa la [calculadora de tasa de conversión](/tools/conversion-rate-calculator/)
    para modelar el impacto exacto en ingresos de la mejora de conversión que
    buscas.
"trial-to-paid-conversion-rate-benchmarks":
  "title": "Referencias de conversión de prueba a pago en SaaS"
  "description": "¿Qué es una buena tasa de conversión de prueba a pago en una SaaS? Referencias del sector por modelo de negocio, precio y tipo de prueba."
  "body": |
    La tasa de conversión de prueba a pago es el porcentaje de usuarios en prueba
    gratuita que se convierten en clientes de pago. Varía muchísimo según el tipo
    de prueba, la complejidad del producto y la estrategia de precios: sin
    contexto, las referencias en bruto engañan.

    ## Referencias por tipo de prueba

    | Tipo de prueba | Media | Cuartil superior |
    |---|---|---|
    | Prueba gratis (sin tarjeta) | 15–25 % | 35 %+ |
    | Prueba gratis (con tarjeta obligatoria) | 40–60 % | 70 %+ |
    | Freemium (gratis → pago) | 2–5 % | 8–15 % |
    | Por uso (pago por consumo) | No aplica, sin conversión diferenciada | |
    | Venta con demo obligatoria | 20–40 % | 50 %+ |

    Las pruebas con tarjeta convierten más porque filtran a los usuarios con poca
    intención. Las pruebas sin tarjeta tienen mejor retención a largo plazo por
    cliente convertido.

    ## Referencias por nivel de precio

    | Nivel de precio | Conversión media | Por qué |
    |---|---|---|
    | < $20/mes (pymes, self-serve) | 15–25 % | Mucho volumen, poco contacto, decisión rápida |
    | $20–100/mes (pro / crecimiento) | 20–35 % | Mezcla de self-serve y venta ligera |
    | $100–500/mes (mid-market) | 15–25 % | Más decisores, evaluación más larga |
    | $500+/mes (enterprise) | 30–50 % de las demos | Cualificados por ventas, alta intención |

    Enterprise parece convertir más de la demo a la prueba, pero es porque las
    demos ya están cualificadas por ventas. La conversión bruta de prueba a pago en
    enterprise es menor.

    ## Cómo diagnosticar una conversión de prueba a pago baja

    1. **Menos del 5 %**: problema de activación; los usuarios no llegan al momento de valor
    2. **5–15 %**: problema de fricción; ven el valor pero no logran completar el paso al pago
    3. **15–25 %**: problema de cualificación; parte de las pruebas son usuarios que no encajan
    4. **Más del 25 %**: céntrate en el volumen; el embudo funciona bien

    Usa la [calculadora de tasa de conversión](/tools/conversion-rate-calculator/)
    para calcular tu conversión actual de prueba a pago y modelar el impacto en
    ingresos de mejorarla.
"email-list-churn-rate-explained":
  "title": "Tasa de bajas de la lista de email: qué es y cómo reducirla"
  "description": "Las bajas de una lista de email son el porcentaje de suscriptores que se dan de baja o quedan inactivos cada mes. Conoce las referencias del sector y cómo reducir las tuyas."
  "body": |
    Las bajas de la lista son el asesino silencioso de los programas de email
    marketing. Aunque sumes suscriptores, muchas bajas pueden dejarte en el mismo
    sitio o, peor, hacer que tu lista mengüe mientras gastas en captación.

    ## Tipos de bajas en email

    **Bajas explícitas**: suscriptores que pulsan «darse de baja». Media del
    sector: 0,2–0,5 % por envío, o aproximadamente un 1–3 % al mes.

    **Bajas implícitas**: suscriptores que dejan de abrir los emails. No se dan de
    baja, pero quedan inactivos en la práctica. En 12 meses, el 20–40 % de una
    lista queda inactiva.

    **Rebotes**: direcciones que ya no existen. Los rebotes duros deben eliminarse
    de inmediato; los blandos, tras 3 intentos.

    ## Referencias

    | Métrica | Buena | Media | Mala |
    |--------|------|---------|------|
    | Tasa de bajas por envío | < 0,1 % | 0,2–0,3 % | > 0,5 % |
    | Bajas mensuales (combinadas) | < 1,5 % | 2–3 % | > 4 % |
    | Tasa de apertura | > 35 % | 20–25 % | < 15 % |

    ## Cómo reducir las bajas

    - **Secuencia de bienvenida**: fija expectativas desde el principio. Los
      suscriptores que interactúan la primera semana tienen 3 veces menos bajas a
      largo plazo.
    - **Frecuencia de envío constante**: enviar de forma errática (una vez al mes y
      luego 5 veces en una semana) dispara las bajas.
    - **Segmentación**: envía contenido relevante a cada segmento. El email
      irrelevante es el primer motivo de baja.
    - **Campañas de reactivación**: escribe a los inactivos con un «¿sigues
      interesado?» antes de eliminarlos.

    Usa la [calculadora de crecimiento de la lista de email](/tools/email-list-growth-calculator/)
    para ver cómo cambia tu trayectoria de crecimiento neto si reduces las bajas un
    punto.
"email-list-size-for-business":
  "title": "¿Qué tamaño de lista de email necesitas para un negocio rentable?"
  "description": "No necesitas una lista enorme para ganar dinero. Conoce las referencias de ingresos por suscriptor y el tamaño de lista necesario para alcanzar tus objetivos."
  "body": |
    El mito más extendido del email marketing: «necesitas una lista grande para
    ganar dinero». Necesitas una lista relevante. Una lista de 1.000 clientes
    ideales puede superar a una de 100.000 suscriptores con poca intención.

    ## Referencias de ingresos por suscriptor

    La mayoría de profesionales del email apuntan a $1 de ingresos por suscriptor y
    mes. Es una referencia aproximada: los ingresos reales por suscriptor varían
    muchísimo.

    | Nicho | Ingresos por suscriptor al mes |
    |-------|------------------------|
    | SaaS / herramientas B2B | $3–10 |
    | Servicios profesionales | $2–8 |
    | E-commerce | $0,50–3 |
    | Contenido / medios | $0,10–1 |
    | Interés general | $0,05–0,30 |

    ## Tamaño mínimo viable de la lista

    Para generar $5.000 al mes con tu lista a $2 por suscriptor: necesitas 2.500
    suscriptores. A $0,50 por suscriptor (habitual en e-commerce): necesitas
    10.000.

    Las cuentas son sencillas; lo difícil es elegir la audiencia y la oferta
    adecuadas.

    ## Calidad antes que cantidad

    Una lista de 5.000 suscriptores con un 45 % de apertura se monetiza mejor que
    una de 50.000 con un 8 %. Los algoritmos, la entregabilidad y la monetización
    mejoran con más interacción.

    Prioriza las fuentes de captación que generan suscriptores comprometidos:
    mejoras de contenido, lead magnets segmentados y referidos superan a los
    concursos en redes sociales y los sorteos.

    Usa la [calculadora de crecimiento de la lista de email](/tools/email-list-growth-calculator/)
    para modelar cuánto tardarás en alcanzar el tamaño de lista objetivo con
    distintos ritmos de crecimiento.
"how-to-grow-email-list-fast":
  "title": "Cómo hacer crecer rápido tu lista de email: 8 tácticas probadas"
  "description": "Haz crecer tu lista de email más rápido con lead magnets, bucles de referidos y formularios de suscripción optimizados. Incluye referencias de crecimiento y calculadora."
  "body": |
    Hacer crecer una lista de email es la actividad de marketing con más
    apalancamiento para un negocio autofinanciado. A diferencia del SEO (lento) o
    de los anuncios (caros), el crecimiento de la lista se acumula: cada
    suscriptor nuevo amplía la audiencia de todos los envíos futuros.

    ## 8 tácticas que funcionan de verdad

    **1. Lead magnets**: ofrece un recurso concreto y útil al instante a cambio de
    un email. Plantillas, calculadoras, checklists y minicursos son lo que mejor
    convierte. Un vago «suscríbete a mi newsletter» convierte al 1–2 %; un lead
    magnet bien segmentado, al 5–15 %.

    **2. Mejoras de contenido**: ofrece una descarga extra ligada a un artículo
    concreto. Quien lee «cómo calcular el MRR» es un prospecto caliente para una
    «plantilla de seguimiento del MRR». Las mejoras de contenido suelen multiplicar
    por 3–5 la conversión de los formularios laterales.

    **3. Ventanas de intención de salida**: se activan cuando el ratón va hacia la
    parte superior del navegador. Molestas si abusas, eficaces con la oferta
    adecuada para la audiencia adecuada. Conversión habitual: 3–7 % de los
    visitantes que se van.

    **4. Programas de referidos**: incentiva a los suscriptores para que
    recomienden a sus amigos. SparkLoop y ReferralHero lo facilitan. Los
    suscriptores referidos tienen un LTV 2–3 veces mayor.

    **5. Campañas de captación en redes sociales**: anuncios de formulario en
    Facebook/Instagram que llevan directamente a tu lead magnet. El coste por
    suscriptor va de $0,50 a más de $3 según el nicho.

    **6. Artículos invitados y podcasts**: generan suscripciones directas si
    enlazas a una landing de tu lead magnet. Calidad antes que cantidad.

    **7. Optimizar la suscripción en la página de inicio**: haz tests A/B del
    titular, el texto del botón y la posición del formulario. La mayoría de
    páginas de inicio convierten al 0,5–2 %; las optimizadas llegan al 5–10 %.

    **8. Dar de baja a los inactivos**: aunque parezca contradictorio, quitar
    contactos inactivos mejora la entregabilidad, lo que sube las aperturas y
    mejora la calidad de la lista.

    Usa la [calculadora de crecimiento de la lista de email](/tools/email-list-growth-calculator/)
    para modelar cómo se acumula cada centenar de suscriptores más al mes en 12–24
    meses.
"email-marketing-roi-benchmarks":
  "title": "ROI del email marketing: referencias del sector y cómo calcular el tuyo"
  "description": "Referencias medias de ROI del email marketing por sector y un método para calcular el retorno real de tus campañas de email."
  "body": |
    El email marketing produce de forma constante el ROI más alto de todos los
    canales digitales. La cifra más citada es de $36 por cada $1 invertido, pero esa
    media esconde una variación enorme. Así se calcula el tuyo.

    ## ROI medio del email por sector

    | Sector | ROI habitual |
    |---------|------------|
    | E-commerce / comercio minorista | $45–$60 por $1 |
    | SaaS / software | $35–$50 por $1 |
    | Servicios B2B | $20–$40 por $1 |
    | Editorial / medios | $30–$55 por $1 |
    | ONG | $25–$40 por $1 |

    ## La fórmula del ROI del email

    **ROI = (ingresos del email − coste del programa de email) / coste × 100**

    Lo difícil es atribuir los ingresos. Opciones:
    - **Último clic**: atribuir la venta al último email en el que se hizo clic antes de comprar
    - **Primer contacto**: dar el mérito al email que captó al suscriptor
    - **Multicontacto**: repartir el mérito entre todos los contactos por email

    La mayoría de marcas de e-commerce usan una ventana de atribución por clic de 7 o 30 días.

    ## Mejorar el ROI del email

    1. **La segmentación** aumenta las aperturas un 14,3 % y los clics un 100,9 % (Mailchimp)
    2. **La personalización** más allá del nombre mejora el CTR un 14 %
    3. **Optimizar la hora de envío** mejora las aperturas un 20–30 %
    4. **Limpieza de la lista**: quitar a los suscriptores sin interacción mejora la entregabilidad

    Calcula el ROI de tu programa de email con la [calculadora de ROI del email](/tools/email-roi-calculator/).
"email-marketing-roi-vs-other-channels":
  "title": "ROI del email marketing frente a redes sociales, publicidad de pago y SEO"
  "description": "Cómo se compara el ROI del email marketing con el de las redes sociales de pago, el PPC, el SEO y el marketing de contenidos, con datos de por qué el email supera de forma constante a los demás canales."
  "body": |
    El email ocupa sistemáticamente el primer puesto en los estudios de ROI de
    marketing. Así se compara con otros canales, y por qué.

    ## Comparación del ROI por canal

    | Canal | ROI habitual | Plazo |
    |---------|------------|-----------|
    | Email marketing | $36–$45 por $1 | Corto-medio |
    | SEO / búsqueda orgánica | $22–$40 por $1 | Medio-largo |
    | Búsqueda de pago (Google) | $2–$8 por $1 | Corto |
    | Redes sociales de pago (Meta/LinkedIn) | $2–$6 por $1 | Corto |
    | Marketing de contenidos | $15–$30 por $1 | Medio-largo |
    | Afiliación | $10–$20 por $1 | Medio |

    *Nota: el ROI varía muchísimo según el sector, la calidad de la audiencia y el método de medición.*

    ## Por qué el email supera a los canales de pago

    1. **Sin coste continuo por impresión**: con la lista ya creada, enviar es barato
    2. **Audiencia propia**: no depende de cambios de algoritmo ni del cierre de plataformas
    3. **Alta intención**: los suscriptores se apuntaron, quieren saber de ti
    4. **Segmentación**: puedes personalizar para cada segmento a escala

    ## Por qué el email decepciona en algunas comparaciones

    El ROI del email suele estar sobrestimado porque:
    - La atribución es generosa (una ventana de 30 días por clic infla los ingresos atribuidos)
    - El coste de construir la lista se excluye del denominador
    - Las bajas y el deterioro de la lista se ignoran en el modelo

    Para una comparación justa, incluye el coste de captar la lista en el
    presupuesto de tu programa de email.

    Usa la [calculadora de ROI del email](/tools/email-roi-calculator/) para
    calcular el retorno real de tu programa de email.
"how-to-improve-email-marketing-roi":
  "title": "Cómo mejorar el ROI del email marketing"
  "description": "Los cambios con más impacto para subir el ROI del email marketing (limpieza de la lista, hora de envío, segmentación y test de asuntos), ordenados por su impacto habitual."
  "body": |
    El email ya tiene el ROI medio más alto de todos los canales digitales, pero la
    diferencia entre un programa del cuartil superior y uno mediocre es enorme, y
    se explica casi por completo por unas pocas prácticas concretas.

    ## De dónde salen realmente los ingresos del email

    $$\text{Ingresos} = \text{Tamaño de la lista} \times \text{Tasa de apertura} \times \text{Tasa de clics} \times \text{Tasa de conversión} \times \text{Ticket medio}$$

    Como estos factores se multiplican, un 20 % más de apertura y un 20 % más de
    clics se combinan en un **44 % más** de ingresos: pequeñas mejoras en varias
    fases ganan a una gran mejora en una sola.

    ## Los cambios con más impacto, por orden

    1. **Limpieza de la lista**: excluye a los suscriptores sin aperturas en 90 días
       o más. Sube al instante la tasa de apertura medida (menos peso muerto en el
       denominador) y protege la llegada a la bandeja de entrada de toda la lista,
       porque los proveedores penalizan a los remitentes con poca interacción.
    2. **Optimizar la hora de envío**: probar horas de envío (de martes a jueves
       entre las 10:00 y las 14:00 en la hora local del destinatario suele
       funcionar bien, aunque varía según la audiencia) suele mover la apertura
       varios puntos sin tocar el contenido.
    3. **Test de asuntos**: haz tests A/B de asuntos con el 15–20 % de la lista antes
       de enviar el ganador al resto; solo esto suele subir la apertura un 10–20 %
       frente a un único asunto sin probar.
    4. **Segmentación**: enviar contenido relevante a un segmento más pequeño y
       concreto convierte siempre mejor que un envío único a toda la lista, aunque
       lo reciba menos gente.
    5. **Invertir en la secuencia de bienvenida**: las secuencias automáticas de
       bienvenida y onboarding suelen tener el mayor ROI de todos los tipos de
       email, porque llegan en el momento de más interacción de la relación.

    ## El efecto acumulado en un año

    Como estas palancas se suman, un programa que mejora apertura, clics y
    conversión un modesto 15 % cada una no produce un 45 % más de ingresos, sino
    cerca de un **52 %** (1,15³). Por eso trabajar el embudo de forma sistemática
    gana a perseguir una gran campaña.

    ## Preguntas frecuentes

    **¿Priorizo el crecimiento o la calidad de la lista?**
    La calidad, casi siempre: una lista más pequeña y comprometida supera siempre
    a una grande y sin interacción en todos los términos de la fórmula, incluida la
    entregabilidad.

    **¿Cada cuánto debo volver a probar las fórmulas de asunto?**
    Las preferencias de la audiencia cambian: revalida los patrones ganadores cada
    trimestre en lugar de dar por hecho que lo que funcionó hace un año sigue
    siendo lo mejor.

    Usa la [calculadora de ROI del email](/tools/email-roi-calculator/) para
    modelar el impacto en ingresos de mejorar cualquier fase de tu embudo de email.
"cost-per-lead-vs-cost-per-acquisition":
  "title": "Coste por lead frente a coste por adquisición: ¿en qué se diferencian?"
  "description": "CPL y CPA explicados: cómo calcular cada uno, cuándo importa cada uno y por qué confundirlos es uno de los errores de medición de marketing más habituales."
  "body": |
    El CPL y el CPA son métricas de coste, pero miden cosas muy distintas.
    Confundirlos es uno de los errores más habituales en los informes de marketing
    B2B.

    ## Definiciones

    **Coste por lead (CPL)** = inversión en marketing ÷ número de leads generados
    Un «lead» suele ser un contacto que ha mostrado interés (formulario, solicitud
    de demo, registro en la prueba). Todavía no ha generado ingresos.

    **Coste por adquisición (CPA)** = inversión en marketing ÷ número de clientes adquiridos
    Una «adquisición» es un cliente de pago. El CPA tiene en cuenta tu tasa de
    conversión de lead a cliente.

    ## La relación

    CPA = CPL ÷ tasa de conversión de lead a cliente

    Ejemplo: CPL de $200 y un 10 % de cierre → CPA = $200 / 10 % = $2.000

    ## Cuándo importa cada uno

    El **CPL** es la métrica adecuada cuando:
    - Quieres comparar la eficiencia de los canales en la parte alta del embudo
    - Tu equipo comercial se encarga de toda la cualificación y el cierre
    - El KPI de marketing es «leads cualificados entregados a ventas»

    El **CPA** es la métrica adecuada cuando:
    - Marketing gestiona todo el embudo, incluida la activación
    - Haces campañas de respuesta directa (por ejemplo, redes de pago → prueba → conversión)
    - Quieres compararlo con el LTV para el periodo de recuperación

    ## El peligro de optimizar solo el CPL

    Un canal con CPL bajo pero leads de mala calidad puede tener peor CPA que uno
    con CPL alto y señales de intención fuertes. Segmenta siempre por calidad del
    lead (puntuación de ICP, cargo, tamaño de empresa) antes de sacar conclusiones
    del CPL.

    Usa la [calculadora de coste por lead](/tools/revenue-per-lead-calculator/)
    para calcular el CPL y el CPL máximo aceptable a partir de tu inversión en
    marketing y tu LTV.
"how-to-calculate-revenue-per-lead":
  "title": "Cómo calcular los ingresos por lead: fórmula, atribución y comparación de canales"
  "description": "Ingresos por lead (RPL) = ingresos totales / leads totales. Aprende a calcularlo con precisión usando el modelo de atribución adecuado y a usarlo para comparar canales de marketing."
  "body": |
    Los ingresos por lead (RPL) son la métrica que conecta la inversión en
    marketing con los ingresos reales. Unen «hemos generado 1.000 leads» con «esos
    leads nos han dado $400k».

    **Fórmula: RPL = ingresos totales / leads totales**

    El reto es asociar los ingresos correctos a los leads correctos.

    ## Paso 1: elige el periodo de medición

    El RPL exige cruzar leads e ingresos de la misma cohorte de captación. Con
    ciclos de venta cortos (menos de 30 días), usa el mismo mes. Con ciclos más
    largos, desplaza la medición de ingresos.

    **Ejemplo para un ciclo de venta B2B de 90 días:**
    - Leads: T1 2026 (enero a marzo)
    - Ingresos: cierres del T2 2026 de leads captados en el T1

    ## Paso 2: define qué cuenta como «lead»

    No todas las definiciones valen lo mismo:
    - **Lead cualificado por marketing (MQL)**: cumple los criterios básicos, apto para nurturing
    - **Lead cualificado por ventas (SQL)**: aceptado por ventas, dentro del pipeline activo
    - **Oportunidad**: una venta definida con plazos

    El RPL calculado sobre SQL es más preciso y útil que sobre todos los MQL.
    Incluye solo leads cualificados en el denominador.

    ## Paso 3: elige el modelo de atribución

    Cómo atribuyes los ingresos a los leads importa:

    **Primer contacto**: los ingresos se atribuyen al primer punto de contacto de
    marketing. Útil para medir el valor de los canales en la parte alta del embudo.

    **Último contacto**: se atribuyen al último punto de contacto antes de la
    conversión. Útil para saber qué canales cierran ventas.

    **Multicontacto (lineal)**: se reparten a partes iguales entre todos los
    puntos de contacto. Más preciso, pero más difícil de calcular.

    Para la mayoría de negocios B2B: primer contacto para decidir la captación por
    canal y último contacto para optimizar campañas.

    ## Paso 4: calcula y compara por canal

    | Canal | Leads T1 | Ingresos T2 | RPL | Inversión T1 | CPL | RPL/CPL |
    |---|---|---|---|---|---|---|
    | Google Ads | 250 | $100k | $400 | $12,5k | $50 | 8× |
    | Contenidos / SEO | 400 | $160k | $400 | $8k | $20 | 20× |
    | LinkedIn | 50 | $60k | $1.200 | $10k | $200 | 6× |
    | Eventos | 50 | $30k | $600 | $10k | $200 | 3× |

    Contenidos/SEO tiene la mejor ratio RPL/CPL (20×) y el mayor número de leads
    (400). LinkedIn tiene el RPL absoluto más alto ($1.200) gracias a los leads
    enterprise. Asigna el presupuesto en consecuencia.

    Calcula el RPL de tus canales con la [calculadora de ingresos por lead](/tools/revenue-per-lead-calculator/).
"marketing-channel-roi-comparison":
  "title": "Comparar el ROI de los canales de marketing: cómo ordenar tus canales de captación"
  "description": "Compara los canales de marketing por ingresos por lead, coste por lead y ROI para decidir dónde subir o recortar la inversión. Incluye un marco de reparto del presupuesto."
  "body": |
    La mayoría de empresas tienen 3–6 canales de marketing activos a la vez. La
    pregunta nunca es «¿qué canal funciona?», sino «¿cómo repartimos el
    presupuesto entre canales para maximizar los ingresos?».

    Los ingresos por lead (RPL) y el coste por lead (CPL) juntos dan la imagen
    completa.

    ## Los cuatro arquetipos de canal

    **RPL alto, CPL bajo: escalar con decisión**
    Ejemplos: SEO orgánico en dominios consolidados, nurturing por email,
    programas de referidos. Son tus canales más eficientes. Si no los exprimes
    primero, estás dejando dinero sobre la mesa.

    **RPL alto, CPL alto: invertir de forma selectiva**
    Ejemplos: LinkedIn Ads para enterprise, ferias, campañas ABM.
    Leads de alta calidad pero captación cara. Rentables si el valor de vida del
    cliente lo justifica: modela como mínimo una ratio LTV:CAC de 3:1. Mantén una
    partida sin invertir de más respecto a canales más baratos.

    **RPL bajo, CPL bajo: canal de volumen**
    Ejemplos: Google Ads amplio, email en frío, redes sociales orgánicas.
    Mucho volumen y menos calidad. Útil para llenar el embudo, pero necesita
    filtros de cualificación para no saturar a ventas con leads no cualificados.

    **RPL bajo, CPL alto: recortar o arreglar**
    Ejemplos: redes de pago con la audiencia equivocada, prensa sectorial,
    llamadas en frío fuera del ICP. Son canales que pierden dinero. O reorientas la
    audiencia para mejorar la calidad de los leads, o recortas y reasignas el
    presupuesto a canales con mejor rendimiento.

    ## Un marco de reparto del presupuesto

    Con un presupuesto limitado entre N canales, reparte según rendimientos
    decrecientes:

    1. Financia primero los canales de mayor ROI hasta su capacidad natural
    2. Sube la inversión solo si el ROI marginal del gasto adicional es igual o superior a tu tasa mínima
    3. Prueba canales nuevos con presupuestos fijos (5–10 % del total) antes de escalar

    **Ejemplo de reparto para un presupuesto de marketing de $100k al mes:**
    - Contenidos/SEO: 20 % ($20k), mejor ROI, limitado por la capacidad de producir contenido
    - Google Ads: 40 % ($40k), buen ROI, muy escalable
    - LinkedIn/ABM: 25 % ($25k), segmento enterprise, rentable a esta escala
    - Eventos/patrocinios: 10 % ($10k), construcción de comunidad, difícil de medir
    - Prueba de canales nuevos: 5 % ($5k)

    ## Cuándo engaña la comparación por RPL

    El RPL funciona bien con canales que atienden segmentos similares. Deja de
    funcionar cuando:

    - **Los ICP son distintos**: LinkedIn genera leads enterprise ($5k de ACV) y
      Google leads de pymes ($500 de ACV). El RPL de LinkedIn parecerá mayor, pero
      los segmentos no son comparables.

    - **La duración del ciclo de venta es distinta**: los leads enterprise pueden
      tener 6 veces más RPL, pero un ciclo 3 veces más largo; la eficiencia del
      capital también cuenta.

    - **Los modelos de atribución no coinciden**: el orgánico «se lleva el mérito»
      de conversiones que pasaron antes por un anuncio de pago.

    Segmenta siempre el RPL por tipo de cliente o ICP antes de comparar canales.

    Calcula el RPL de tus canales con la [calculadora de ingresos por lead](/tools/revenue-per-lead-calculator/).
"reduce-cost-per-lead-b2b":
  "title": "Cómo reducir el coste por lead en marketing B2B"
  "description": "Tácticas probadas para bajar el CPL en B2B, desde el contenido y el SEO hasta mejorar el scoring de leads para que entren menos leads caros en el embudo."
  "body": |
    La forma más rápida de mejorar el ROI de marketing no es gastar más, sino
    reducir el coste de captar cada lead cualificado. Estas son las palancas con
    más impacto.

    ## Tácticas que bajan el CPL de forma fiable

    **Contenidos y SEO**: los leads de búsqueda orgánica cuestan de media $30–$80,
    frente a $150–$300 en pago. Un solo artículo atemporal bien posicionado para
    una búsqueda de fondo del embudo puede generar leads durante años con un coste
    marginal casi nulo.

    **Retargeting**: los visitantes que ya han interactuado con tu contenido
    convierten 3–5 veces mejor que el tráfico frío. El CPL de retargeting suele ser
    un 60–80 % más bajo que el de prospección.

    **Programas de referidos**: los leads recomendados por clientes cierran 3–4
    veces más que la prospección en frío y cuestan ~70 % menos captarlos.

    **Lead scoring**: añadir filtros de cualificación por ICP antes de que los
    leads entren en el CRM reduce el tiempo que ventas pierde con leads que no
    encajan, lo que baja en la práctica el coste por lead *cualificado* aunque el
    CPL bruto no cambie.

    ## La trampa del CPL

    Optimizar solo el CPL puede salir mal: los canales que dan leads baratos suelen
    tener poca intención de compra. Sigue siempre el CPL junto a la tasa de lead a
    oportunidad y la tasa de cierre por canal. Un lead de $200 que cierra al 20 %
    vale mucho más que uno de $30 que cierra al 1 %.

    Calcula la economía real de tus canales con la [calculadora de coste por lead](/tools/revenue-per-lead-calculator/).
"what-is-a-good-cost-per-lead":
  "title": "¿Qué es un buen coste por lead? Referencias por sector y canal"
  "description": "Las referencias de coste por lead van de $2 en email a más de $800 en LinkedIn para enterprise. Descubre el CPL típico de tu sector y cómo evaluarlo frente a los ingresos por lead."
  "body": |
    Las referencias de CPL (coste por lead) varían muchísimo según el sector, el
    canal y la definición de lead. Comparar tu CPL con una referencia genérica sin
    contexto engaña. La pregunta correcta es: ¿qué CPL es sostenible con tus
    ingresos por lead?

    ## La regla de sostenibilidad

    **CPL sostenible = RPL × (1 − margen bruto objetivo sobre la captación)**

    Si tu RPL es de $400 y quieres al menos un 70 % de margen bruto sobre los
    clientes captados: CPL máximo sostenible = $400 × 0,30 = **$120 por lead**

    Cualquier canal con un CPL superior a $120 no es rentable. Cualquiera por
    debajo sí lo es.

    ## Referencias de CPL por canal

    | Canal | Rango de CPL habitual |
    |---|---|
    | Email marketing (lista propia) | $0,10–$5 |
    | SEO orgánico | $5–$50 |
    | Redes sociales orgánicas | $5–$50 |
    | Google Ads (búsqueda) | $20–$150 |
    | Facebook/Instagram Ads | $10–$100 |
    | LinkedIn Ads | $100–$500+ |
    | Eventos / ferias | $200–$500 |
    | Prospección saliente en frío | $50–$200 |
    | Programas de referidos | $20–$100 |

    ## Referencias de CPL por sector

    | Sector | CPL bajo | CPL alto |
    |---|---|---|
    | E-commerce B2C | $5 | $50 |
    | SaaS para pymes | $30 | $200 |
    | SaaS mid-market | $100 | $500 |
    | Software enterprise | $300 | $1.500+ |
    | Servicios financieros | $100 | $400 |
    | Salud / medicina | $50 | $300 |

    El software enterprise tiene un CPL muy alto porque cuesta llegar a quienes
    deciden, los ciclos de venta son largos y el valor de los contratos justifica
    la inversión.

    ## Por qué un CPL bajo no siempre es bueno

    Un CPL de $5 en una campaña de display amplia de Google parece estupendo, hasta
    que ves que esos leads convierten al 0,5 % frente al 5 % de un lead de búsqueda
    de $50.

    100 leads de display a $5 = $500 invertidos, 0,5 clientes
    10 leads de búsqueda a $50 = $500 invertidos, 0,5 clientes

    Mismo resultado, mismo coste. Un CPL sin la tasa de conversión no significa
    nada. Mira siempre el RPL (ingresos por lead) junto al CPL.

    Usa la [calculadora de ingresos por lead](/tools/revenue-per-lead-calculator/)
    para calcular el RPL de cada canal y comprobar si tu CPL es sostenible.
"mql-vs-sql-difference":
  "title": "MQL frente a SQL: ¿cuál es la diferencia?"
  "description": "Un MQL (lead cualificado por marketing) cumple los criterios de interacción de marketing. Un SQL (lead cualificado por ventas) ha sido revisado por ventas y confirmado como una oportunidad viable a corto plazo."
  "body": |
    El traspaso de MQL a SQL es uno de los procesos más importantes, y más discutidos, de las operaciones de ingresos B2B. La falta de alineación aquí es una de las principales causas de mala conversión del embudo y de fricción entre ventas y marketing.

    ## Definición de MQL

    Un **lead cualificado por marketing** es un prospecto que ha interactuado lo suficiente con tu contenido o producto como para que marketing considere que vale la pena seguirlo. Criterios habituales de MQL:

    - El cargo encaja con tu perfil de cliente ideal (ICP)
    - El tamaño de la empresa está dentro del rango objetivo
    - Ha pedido una demo, descargado un recurso de alta intención o superado un umbral de scoring

    ## Definición de SQL

    Un **lead cualificado por ventas** es un MQL que un comercial ha revisado y confirmado que cumple los criterios BANT (o MEDDIC):

    - **Presupuesto**: hay presupuesto suficiente o se puede asignar
    - **Autoridad**: el contacto decide o influye en la decisión de compra
    - **Necesidad**: un problema de negocio real que tu producto resuelve
    - **Plazo**: un horizonte temporal accionable dentro de tu ciclo de ventas

    ## Referencia de conversión de MQL a SQL

    La mediana del sector de conversión de MQL a SQL es del 20–40 %. Por debajo del 20 %, los criterios de MQL son demasiado laxos (marketing cualifica demasiado). Por encima del 50 %, pueden ser demasiado estrictos (leads válidos se quedan demasiado tiempo en nurturing).

    ## Mejorar el traspaso

    Define los criterios de MQL en un acuerdo de nivel de servicio conjunto entre marketing y ventas. Revisa la tasa de conversión cada mes. Cuando baje, analiza los MQL rechazados para recalibrar el scoring, en lugar de buscar solo más volumen.
"what-is-a-sales-funnel":
  "title": "¿Qué es un embudo de ventas?"
  "description": "Un embudo de ventas es un modelo que muestra cómo pasan los prospectos del primer conocimiento a la venta cerrada, con cada fase convirtiendo un porcentaje de la anterior en la siguiente."
  "body": |
    Un **embudo de ventas** (también llamado embudo de ingresos o pipeline) recorre el camino del lead en bruto al cliente de pago. La forma de embudo refleja que solo una parte de los prospectos de cada fase avanza a la siguiente.

    ## Fases habituales de un embudo B2B

    **Lead** → **MQL** → **SQL** → **Oportunidad** → **Cliente**

    - **Lead**: cualquier contacto que ha mostrado un primer interés (descargó contenido, asistió a un webinar, rellenó un formulario).
    - **MQL (lead cualificado por marketing)**: se ha superado un umbral de scoring (encaje demográfico, señales de intención o nivel de interacción).
    - **SQL (lead cualificado por ventas)**: ventas ha revisado el MQL y confirmado que merece la pena (criterios BANT: presupuesto, autoridad, necesidad, plazo).
    - **Oportunidad**: se ha abierto una venta formal en el CRM con presupuesto identificado y plazo de decisión definido.
    - **Cliente**: la oportunidad se ha ganado y se reconoce el ingreso.

    ## Por qué importa modelar el embudo

    Modelar el embudo permite calcular hacia atrás, desde un objetivo de ingresos hasta el número de leads necesarios. Si necesitas 10 clientes nuevos al mes y tu conversión total es del 2 %, necesitas 500 leads. Si solo puedes generar 300, tienes que mejorar la conversión o encontrar más fuentes de leads.

    ## Errores habituales del embudo

    1. **Optimizar la parte alta cuando la baja está rota**: duplicar los leads con un 10 % de cierre genera los mismos ingresos que 500 leads con un 20 % de cierre.
    2. **Definiciones de MQL desalineadas**: cuando marketing y ventas no se ponen de acuerdo en qué es un MQL, el número de MQL se infla mientras se hunde la tasa de SQL.
    3. **Ignorar la duración del ciclo**: un embudo rápido (ciclo de 15 días) se acumula más deprisa que uno lento (90 días), aunque las tasas de conversión sean iguales.
"how-to-set-sales-quotas":
  "title": "Cómo fijar cuotas de ventas alcanzables y motivadoras"
  "description": "Un marco para fijar cuotas de ventas anuales y trimestrales basado en el potencial del territorio, la capacidad de los comerciales y los datos históricos de cumplimiento."
  "body": |
    Las cuotas de ventas son una de las decisiones con más consecuencias de la
    planificación de ingresos. Demasiado altas, destruyen la moral y la retención.
    Demasiado bajas, dejan dinero sobre la mesa. Este es un marco basado en datos.

    ## Los datos para fijar la cuota

    1. **Objetivo de ingresos total** (lo fija finanzas; normalmente un objetivo de crecimiento del ARR)
    2. **Número de comerciales con cuota**: excluye a los que están en rampa, de baja y a los mandos
    3. **Cumplimiento histórico**: ¿qué porcentaje de comerciales alcanzó la cuota el último periodo?
    4. **Capacidad por territorio o segmento**: TAM × tasa de penetración por territorio

    ## Modelos de cuota habituales

    **Descendente**: objetivo total ÷ número de comerciales + colchón de gestión (20–30 %)
    - Sencillo, pero ignora las diferencias entre territorios

    **Ascendente**: suma del potencial de los territorios × tasa de cierre esperada
    - Más preciso, requiere datos por territorio

    **Ascendente con modelo de cumplimiento**: fijar la cuota para que la alcance el 60–70 % de los comerciales
    - Los estudios muestran que así se maximizan los ingresos por comercial sin perder motivación

    ## Referencias de cumplimiento de cuota

    Una organización comercial sana tiene:
    - Un 60–70 % de comerciales en la cuota o por encima
    - Menos de un 5 % de comerciales muy por debajo (50 % de la cuota)
    - Un grupo claro de mejores comerciales (120 % o más) con resultados fuera de lo común

    Usa la [calculadora de cuota de ventas](/tools/sales-quota-calculator/) para
    modelar tus objetivos de ingresos y el reparto por comercial.
"sales-quota-attainment-analysis":
  "title": "Cumplimiento de cuota de ventas: cómo analizar y mejorar los números de tu equipo"
  "description": "Cómo medir y mejorar el cumplimiento de la cuota de ventas: interpretar las curvas de cumplimiento, identificar patrones de rendimiento y diagnosticar errores al fijar cuotas."
  "body": |
    Los datos de cumplimiento de cuota dicen más de la salud de tu organización
    comercial que cualquier métrica aislada. Así se leen las señales y se actúa.

    ## La distribución del cumplimiento

    Representa el cumplimiento de cada comercial como porcentaje de su cuota. Una
    distribución sana se parece a esto:

    - 5–10 % de comerciales entre el 0 % y el 50 % (con plan de mejora o en rampa)
    - 20–30 % entre el 50 % y el 90 % (mejorando; revisa el coaching)
    - 40–50 % entre el 90 % y el 120 % (zona de cuota: es la mayoría que quieres)
    - 10–20 % en el 120 % o más (los mejores)

    ## Qué te dice la curva

    **Distribución bimodal** (muchos entre el 0 % y el 50 % y muchos por encima del
    150 %, pocos en medio): las cuotas probablemente están mal; algunos
    territorios son demasiado grandes y otros demasiado pequeños.

    **Todos entre el 85 % y el 95 %**: las cuotas son demasiado altas. Los
    comerciales guardan ventas para evitar una cuota más alta el año siguiente, y
    los mejores se van a entornos con cuotas más bajas.

    **Todos por encima del 120 %**: las cuotas son demasiado bajas. Pagas de más en
    comisiones y dejas dinero sobre la mesa. Sube la cuota un 15–20 % en el
    siguiente ciclo.

    ## La cascada de análisis del cumplimiento

    1. **Análisis de rampa**: ¿las nuevas incorporaciones llegan al 80 % de la cuota en el mes 4?
    2. **Análisis por cohorte**: ¿el cumplimiento mejora, empeora o se mantiene trimestre a trimestre?
    3. **Por segmento**: el cumplimiento en enterprise y en pymes suele divergir; analízalos por separado
    4. **Por canal**: las ventas originadas por SDR y por marketing suelen tener tasas de cierre distintas

    Usa la [calculadora de cuota de ventas](/tools/sales-quota-calculator/) para
    modelar tu objetivo de ingresos total y el reparto por comercial.
"how-to-improve-win-rate":
  "title": "Cómo mejorar la tasa de cierre: tácticas de venta SaaS B2B que mueven la cifra"
  "description": "La tasa de cierre es la palanca con más retorno de la fórmula de velocidad de ventas. Descubre qué hacen distinto los equipos SaaS B2B con más de un 30 % de cierre, desde ajustar el ICP hasta estructurar las demos."
  "body": |
    La tasa de cierre es la palanca con más impacto de la fórmula de velocidad de
    ventas. Como está en el numerador, cada punto porcentual se combina con el ACV
    y el volumen de pipeline. Un equipo que pasa del 20 % al 25 % de cierre (+25 %)
    consigue el mismo efecto que con un 25 % más de pipeline, sin gasto en
    marketing.

    ## ¿Qué cuenta como oportunidad cualificada?

    Antes de optimizar la tasa de cierre, define bien el denominador:

    **Tasa de cierre = ventas ganadas / (ventas ganadas + ventas perdidas)**

    El denominador solo debe incluir **oportunidades cualificadas**: prospectos que
    encajan con tu ICP, tienen autoridad sobre el presupuesto y un problema
    definido que tu producto resuelve. Incluir leads no cualificados rebaja la tasa
    y oculta tu eficiencia comercial real.

    Error habitual: contar los leads de marketing como pipeline. Corrígelo exigiendo
    la fase 2 (llamada de descubrimiento hecha y necesidad confirmada) antes de que
    una oportunidad entre en el cálculo.

    ## Táctica 1: ajustar el ICP

    La forma más rápida de mejorar la tasa de cierre es descalificar con más
    decisión. Las ventas que entran en el pipeline y se pierden consumen tiempo que
    podría ir a prospectos que encajan mejor.

    Crea una hoja de puntuación de ICP de una página con 5–7 rasgos que comparten
    tus mejores clientes: tamaño, tecnología, estructura, tipo de problema. Puntúa
    cada oportunidad nueva antes de comprometer un ciclo completo. Descalifica todo
    lo que quede por debajo del 60 %.

    Los equipos que ajustan su ICP suelen ver subir su tasa de cierre 5–10 puntos en
    un trimestre, aunque baje el número absoluto de ventas.

    ## Táctica 2: reestructurar la llamada de descubrimiento

    La mayoría de tasas de cierre bajas vienen de un mal descubrimiento. Síntomas
    habituales:
    - Demos antes de confirmar un problema claro
    - Sin comprador económico en la llamada
    - Sin plazo ni urgencia establecidos

    Solución: exige que el descubrimiento responda a cuatro preguntas antes de
    agendar una demo:
    1. ¿Cuál es el problema concreto? (Con sus palabras, no las tuyas)
    2. ¿Cuánto cuesta no resolverlo? (Cuantificado en dólares o tiempo)
    3. ¿Quién toma la decisión de compra?
    4. ¿Cuál es el plazo y qué lo motiva?

    Si no puedes responder a las cuatro, alarga el descubrimiento; no avances.

    ## Táctica 3: reducir el tiempo hasta el valor en las pruebas

    En un modelo product-led con apoyo comercial, un menor tiempo hasta el valor va
    directamente unido a una mayor tasa de cierre. Si un prospecto activa las
    funciones clave la primera semana, su tasa de cierre suele ser 2–3 veces mayor
    que la de quien no ha activado nada en la segunda semana.

    Crea un plan de éxito de la prueba: secuencia de emails de bienvenida, una
    llamada de activación de 20 minutos y un hito claro («la primera vez que haces
    X, has validado el valor principal»). Sigue la consecución de ese hito como
    indicador adelantado de la tasa de cierre.

    ## Táctica 4: enseñar a los champions a vender dentro

    En mid-market y enterprise, tu champion tiene que vender tu solución a personas
    que nunca conocerás. La mayoría de ventas perdidas se pierden en reuniones
    internas en las que no estás.

    Dale a tu champion:
    - Un caso de negocio de una página en su lenguaje (no el tuyo)
    - Respuestas a las cinco objeciones que planteará su director financiero
    - Un cálculo de ROI con cifras de su propio negocio
    - Llamadas de referencia con clientes parecidos

    ## Impacto en la velocidad de ventas

    Si tu tasa de cierre pasa del 20 % al 30 %:
    (50 × 0,30 × $8.000) / 90 = $1.333 al día frente a (50 × 0,20 × $8.000) / 90 = $889 al día:
    un **50 % más de velocidad** con 10 puntos más de cierre.

    Calcula tu velocidad actual con la [calculadora de velocidad de ventas](/tools/sales-velocity-calculator/).
"sales-cycle-length-benchmarks":
  "title": "Referencias de duración del ciclo de ventas por tamaño de venta y sector"
  "description": "Duración media del ciclo de ventas por ACV, tamaño de empresa y segmento, y tácticas para acortar el denominador de la fórmula de velocidad de ventas sin tomar atajos."
  "body": |
    El ciclo de ventas está en el denominador de la fórmula de velocidad de ventas,
    así que acortarlo tiene el mismo efecto proporcional que aumentar el pipeline o
    la tasa de cierre, pero a menudo sin necesitar más plantilla ni presupuesto.

    **Velocidad de ventas = (oportunidades × tasa de cierre × ACV) / días del ciclo de ventas**

    Recortar el ciclo de 90 a 75 días: 90/75 = un 20 % más de velocidad.

    ## Referencias por tamaño de venta

    | Rango de ACV | Ciclo de ventas habitual |
    |---|---|
    | < $1.000 | 1–14 días |
    | $1.000–$5.000 | 14–45 días |
    | $5.000–$25.000 | 30–90 días |
    | $25.000–$100.000 | 60–180 días |
    | > $100.000 | 90–365+ días |

    Nota: son medianas. Los equipos de alto rendimiento tienen ciclos un 20–40 % más
    cortos que sus pares, una ventaja competitiva importante.

    ## Los tres mayores cuellos de botella del ciclo

    **1. Revisión legal / compras**: en ventas enterprise, la revisión legal puede
    añadir 30–60 días. Solución: ofrecer un contrato marco estándar ya aprobado al
    abrir la venta. Mantener un historial de cambios con términos negociados antes
    para agilizar revisiones futuras. Ofrecer tu propio acuerdo de tratamiento de
    datos (RGPD/CCPA).

    **2. Aprobaciones internas del prospecto**: las ventas se atascan esperando la
    firma del director financiero, un vicepresidente o el consejo. Solución:
    identificar pronto el umbral de aprobación (¿a partir de qué importe firma el
    director financiero?). Ayudar a tu champion a pedir presupuesto al principio
    del proceso, no al final.

    **3. Fases de prueba o prueba de concepto**: una prueba de 30 días que se
    convierte en 60 o más por no tener criterios de éxito claros. Solución: define
    los criterios de éxito por escrito al empezar la prueba. «Al final de los 30
    días habrás completado X y verás el resultado Y.» Cierra la prueba el día 30
    pase lo que pase; amplíala solo con una justificación escrita.

    ## Tácticas para acortar ciclos

    **Precios con fecha límite**: un descuento del 10–15 % con fecha de caducidad
    crea urgencia sin ser agresivo. «Nuestra próxima subida de precios es el
    [fecha]» es un plazo natural.

    **Planes de acción conjuntos**: un documento compartido con hitos y responsables
    de ambas partes. Cuando el prospecto ve sus propios plazos por escrito, los
    retrasos se hacen visibles.

    **Seguimientos semanales**: en ventas de más de $25k, fija una llamada fija de
    30 minutos hasta el cierre. Las ventas que se quedan en silencio se atascan. Una
    comunicación constante hace aflorar pronto las objeciones.

    **Eliminar fases innecesarias**: revisa las fases de tu pipeline. Cualquier fase
    con menos del 70 % de conversión o más de 14 días de media puede ser un cuello
    de botella que quitar o comprimir.

    ## Lo que no puedes acortar

    Parte de la duración del ciclo es estructural: compras enterprise, ciclos
    presupuestarios anuales, calendarios de consejos. Céntrate en las fases que
    controlas. No sacrifiques la calidad de las ventas persiguiendo velocidad: una
    venta perdida en 20 días sigue perdida.

    Usa la [calculadora de velocidad de ventas](/tools/sales-velocity-calculator/)
    para modelar el impacto de un ciclo más corto en tu previsión de ingresos
    anuales.
"what-is-sales-velocity":
  "title": "¿Qué es la velocidad de ventas? Fórmula, referencias y cómo mejorarla"
  "description": "La velocidad de ventas mide los ingresos que genera tu pipeline al día. Aprende la fórmula de las cuatro palancas, las referencias por segmento y las formas con más retorno de mejorarla."
  "body": |
    La velocidad de ventas responde a una pregunta: ¿a qué velocidad se convierte
    tu pipeline en ingresos? Es la métrica individual más útil en ventas B2B porque
    descompone el crecimiento de ingresos en exactamente cuatro palancas que puedes
    mejorar por separado.

    **Fórmula: velocidad de ventas = (oportunidades × tasa de cierre × ACV) / días del ciclo de ventas**

    El resultado son ingresos al día. Multiplica por 365 para el efecto anualizado.

    ## Por qué la velocidad importa más que el tamaño del pipeline

    El tamaño del pipeline por sí solo no predice los ingresos. La empresa A tiene
    100 oportunidades ($1M de pipeline) con un 20 % de cierre, $10k de ACV y un
    ciclo de 90 días:
    (100 × 0,20 × $10.000) / 90 = **$2.222 al día → $811k anualizados**

    La empresa B tiene la mitad de pipeline ($500k): 50 oportunidades con un 40 % de
    cierre, $10k de ACV y un ciclo de 30 días:
    (50 × 0,40 × $10.000) / 30 = **$6.667 al día → $2,43M anualizados**

    La mitad de pipeline y el triple de ingresos. La diferencia está en la calidad
    y la velocidad.

    ## Las cuatro palancas

    **1. Oportunidades**: más oportunidades cualificadas en el embudo. Aumentarlas
    un 20 % suma exactamente un 20 % de velocidad: impacto lineal. Suele ser la
    palanca más fácil de mover a corto plazo con más prospección saliente o
    captación de pago.

    **2. Tasa de cierre**: una mejor cualificación hace que dediques el tiempo a
    ventas que puedes cerrar. Mejorarla exige invertir en el proceso comercial:
    mejor descubrimiento, demos más sólidas, menos tiempo hasta el valor en las
    pruebas y un seguimiento más estructurado. Pasar del 25 % al 30 % (+5 puntos)
    suma un 20 % de velocidad.

    **3. ACV**: precios y paquetes. La palanca con más apalancamiento porque puede
    cambiar sin cambiar el esfuerzo comercial. Subir el tamaño medio de venta de
    $8k a $10k (+25 %) suma un 25 % de velocidad sin una venta más. El upsell al
    cierre, agrupar funciones o eliminar planes de bajo margen suben el ACV.

    **4. Ciclo de ventas**: el denominador. Recortar el ciclo de 90 a 75 días (+20 %
    de rapidez) suma un 20 % de velocidad. Tácticas: reducir los cuellos de botella
    de aprobación interna, ayudar a los champions a vender dentro y enviar antes las
    propuestas de prueba de concepto.

    ## Referencias por segmento

    | Segmento | ACV habitual | Tasa de cierre | Ciclo | Velocidad diaria |
    |---|---|---|---|---|
    | SaaS para pymes | $1k–$5k | 25–35 % | 14–30 días | $100–500 al día |
    | Mid-market | $5k–$50k | 20–30 % | 30–90 días | $500–3.000 al día |
    | Enterprise | $50k–$500k | 15–25 % | 90–270 días | $2.000–10.000+ al día |

    ## Cómo usarla como métrica semanal

    Sigue la velocidad cada semana. Si baja, averigua qué palanca se ha movido:
    ¿se ha reducido el pipeline? ¿Se ha disparado la duración del ciclo? ¿Hay
    ventas atascadas en una fase concreta? Como indicador adelantado, la velocidad
    muestra los problemas del pipeline 60–90 días antes de que lleguen a los
    ingresos.

    Calcula la tuya con la [calculadora de velocidad de ventas](/tools/sales-velocity-calculator/).
