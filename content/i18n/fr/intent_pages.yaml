"fixed-price-vs-time-and-materials-quoting":
  "title": "Forfait ou régie : comment choisir"
  "description": "Les compromis entre devis au forfait et facturation en régie pour un freelance, qui porte le risque dans chaque modèle, et comment choisir le bon pour chaque projet."
  "body": |
    Les deux grands modèles de tarification freelance placent le risque à des
    endroits différents. Choisir le mauvais pour un projet donné, c'est soit
    laisser de l'argent sur la table, soit travailler des heures supplémentaires
    non payées.

    ## Le compromis de fond

    **Forfait** : vous annoncez un prix unique pour des livrables définis. Si le
    projet prend plus de temps que prévu, vous absorbez le surplus. S'il en prend
    moins, vous gardez la différence.

    **Régie (temps passé)** : vous facturez les heures réellement travaillées à
    votre taux. Le client porte le risque d'un périmètre qui prend plus de temps
    que prévu ; vous êtes payé pour chaque heure, quel que soit l'écart entre
    estimation et réalité.

    ## Quand le forfait fonctionne bien

    - Le périmètre est clairement défini et peu susceptible de changer
    - Vous avez déjà mené des projets similaires et disposez de données fiables pour estimer
    - Le client veut une certitude budgétaire et accepte de la payer
    - Vous pouvez intégrer une marge pour imprévus (généralement 20 à 30 %) pour absorber un dépassement raisonnable

    ## Quand la régie est préférable

    - Les besoins évoluent encore ou sont réellement inconnus au départ (phases de
      cadrage, R&D, nouveaux domaines)
    - La collaboration est continue, façon abonnement, plutôt qu'un livrable ponctuel
    - Le client a besoin de souplesse pour changer de cap sans renégocier le
      contrat à chaque fois

    ## L'approche hybride

    Beaucoup de freelances chiffrent au forfait une phase bien définie (le cadrage
    ou la construction d'un MVP, par exemple) puis passent en régie pour la suite
    une fois les besoins stabilisés. Le risque du forfait se limite ainsi à la
    partie du projet que l'on sait vraiment estimer.

    ## La psychologie du prix compte aussi

    Certains clients préfèrent fermement le forfait quels que soient les
    compromis, parce qu'il correspond à leur façon de budgéter en interne : une
    proposition en régie bien argumentée peut perdre face à un concurrent au
    forfait pour cette seule raison. Tenez compte de la préférence du client, pas
    seulement du type de projet, pour choisir le modèle à mettre en avant.

    ## Questions fréquentes

    **Puis-je passer d'une régie à un forfait plus tard ?**
    Oui : une fois que vous connaissez assez bien un client, son périmètre
    habituel et sa façon de demander des changements, vous pouvez chiffrer les
    phases suivantes avec bien plus d'assurance qu'au début.

    **Comment gérer la dérive du périmètre sur un projet au forfait ?**
    Définissez explicitement les livrables dans le contrat et traitez tout ce qui
    en sort comme un avenant chiffré à part. Convenez de ce processus avant de
    commencer, pas une fois la dérive installée.

    Utilisez le [calculateur de devis freelance](/tools/freelance-project-estimate/)
    pour construire un devis au forfait à partir de votre taux horaire, de vos
    heures estimées et d'une marge pour imprévus.
"freelance-hourly-rate-calculator-guide":
  "title": "Fixer son taux horaire freelance : combien facturer en 2024"
  "description": "Comment calculer un taux horaire freelance durable qui couvre impôts, protection sociale, temps administratif non payé et laisse de la place pour l'épargne, selon le métier et le marché."
  "body": |
    L'erreur de tarification freelance la plus courante consiste à partir d'une
    comparaison avec un salaire. Voici une méthode qui prend en compte tout ce
    qu'un salaire ne couvre pas.

    ## Le vrai coût du freelance par rapport au salariat

    En freelance, vous ne bénéficiez plus :
    - Des charges sociales patronales (~8 %)
    - De l'assurance santé (500 à 1 500 $ par mois)
    - Des congés payés et jours de maladie (10 à 20 jours par an, soit 4 à 8 % du temps)
    - De l'abondement retraite 401(k) (3 à 5 % du salaire)
    - Du bureau et du matériel (variable)

    Ajoutez-les à votre revenu net souhaité pour obtenir le chiffre d'affaires
    brut nécessaire.

    ## Formule du taux freelance

    **Chiffre d'affaires annuel nécessaire = (revenu net souhaité + impôts + protection sociale + compensation des congés + frais généraux)**
    **Taux horaire = chiffre d'affaires annuel nécessaire ÷ heures facturables**

    Où heures facturables = heures travaillées × 65–75 % (pour tenir compte de
    l'administratif, de la prospection et du travail non payé)

    ## Exemple : objectif de 100 k$ net

    | Poste | Montant |
    |------|--------|
    | Revenu net souhaité | 100 000 $ |
    | Cotisations d'indépendant (15,3 %) | 20 000 $ |
    | Impôt fédéral/État (25 %) | 30 000 $ |
    | Assurance santé | 12 000 $ |
    | Congés (3 semaines) | 6 000 $ |
    | Chiffre d'affaires brut nécessaire | 168 000 $ |
    | Heures facturables (1 600 h × 70 %) | 1 120 |
    | **Taux horaire minimum** | **150 $/h** |

    À 150 $ de l'heure et 1 120 heures facturables, vous réalisez 168 k$ de chiffre
    d'affaires et gardez ~100 k$ net.

    Utilisez le [calculateur de devis freelance](/tools/freelance-project-estimate/)
    pour construire vos devis à partir de ce taux horaire.
"how-to-quote-a-freelance-project":
  "title": "Comment chiffrer un projet freelance : le guide complet"
  "description": "Un guide pas à pas pour construire un devis freelance qui couvre votre temps, protège votre marge et convainc le client."
  "body": |
    Chiffrer précisément un projet freelance est l'une des compétences les plus
    difficiles à acquérir. Sous-estimez et vous finissez par détester la mission.
    Surestimez et vous perdez le client. Voici une méthode qui mène à chaque fois à
    un chiffre défendable et rentable.

    ## Étape 1 : cadrer avant de chiffrer

    N'estimez jamais un temps sans périmètre écrit. Le « site simple » d'un client
    peut désigner un site statique de 5 pages comme une boutique en ligne de
    60 pages. Avant d'annoncer le moindre chiffre, notez les livrables, le nombre
    de tours de révision et ce qui est explicitement hors périmètre.

    ## Étape 2 : estimer les heures, puis multiplier par 1,3 à 1,5

    Mesurez vos heures sur vos projets passés pendant 30 jours. Vous verrez que
    vous sous-estimez systématiquement de 30 à 50 %. Intégrez cette marge à chaque
    devis.

    ## Étape 3 : appliquer votre taux

    Votre taux doit couvrir : le revenu net souhaité, les impôts (25 à 35 %), la
    protection sociale, le temps administratif non payé (20 à 30 % des heures
    travaillées) et le risque de périodes creuses.

    **Taux freelance minimum = (objectif de revenu annuel + impôts + frais) / heures facturables**

    ## Étape 4 : ajouter des frais de gestion de projet

    Ajoutez 10 à 15 % de gestion de projet en plus du temps de production.
    Réunions, e-mails, révisions et appels clients sont du vrai travail, même s'ils
    ressemblent à des frais généraux.

    Utilisez le [calculateur de devis freelance](/tools/freelance-project-estimate/)
    pour construire votre devis poste par poste.
"freelance-rate-by-experience":
  "title": "Taux freelance par niveau d'expérience et par technologie"
  "description": "Les taux horaires du marché pour les développeurs, designers et consultants freelances, du junior au senior, et comment calculer votre taux minimum viable."
  "body": |
    Les taux du marché pour les freelances varient énormément selon la
    compétence, l'expérience, la technologie et la géographie. Les chiffres
    ci-dessous proviennent de données agrégées de plateformes freelance,
    d'enquêtes et de retours directs de praticiens en 2024. Servez-vous-en pour
    situer votre taux, puis utilisez le calculateur ci-dessus pour trouver le taux
    minimum qui atteint vos objectifs de revenu.

    ## Taux des développeurs (USD, à distance)

    | Niveau | Dev généraliste | React/Node | Python/ML | Blockchain/Web3 |
    |-------|------------|-----------|----------|----------------|
    | Junior (0–2 ans) | 35–60 $ | 45–75 $ | 50–80 $ | 60–100 $ |
    | Confirmé (2–5 ans) | 60–100 $ | 75–130 $ | 90–150 $ | 100–180 $ |
    | Senior (5–10 ans) | 100–180 $ | 120–200 $ | 140–220 $ | 180–300 $ |
    | Principal/Staff | 180–300 $+ | 200–350 $+ | 200–350 $+ | 300–500 $+ |

    ## Taux des designers (USD, à distance)

    | Niveau | Design UI/UX | Marque/Identité | Motion/3D |
    |-------|-------------|--------------|----------|
    | Junior | 40–65 $ | 45–70 $ | 50–80 $ |
    | Confirmé | 70–110 $ | 80–130 $ | 90–150 $ |
    | Senior | 120–180 $ | 130–200 $ | 150–250 $ |

    ## Taux des consultants / stratégie (USD)

    Les consultants indépendants en stratégie, produit et croissance obtiennent des
    taux nettement plus élevés en raison de l'impact direct de leur travail sur
    l'activité :

    | Spécialité | Fourchette horaire |
    |-----------|------------|
    | Stratégie produit | 150–350 $ |
    | Croissance / acquisition payante | 100–250 $ |
    | Data / analytics | 100–200 $ |
    | CTO / conseiller technique | 150–400 $ |
    | DAF à temps partagé | 150–400 $ |

    ## Pourquoi votre taux minimum ne doit pas ancrer votre taux réel

    Le calculateur donne le plancher, le taux en dessous duquel vous perdez de
    l'argent. Votre taux réel doit refléter les taux du marché ci-dessus, plus la
    prime liée à votre spécialisation. Si le taux du marché pour vos compétences
    est bien supérieur à votre minimum calculé, facturez le taux du marché. Le
    calcul du minimum sert à ne jamais sous-facturer, pas à fixer votre plafond.
"freelance-rate-vs-salary":
  "title": "Faut-il passer freelance ? Comparer taux freelance et salaire"
  "description": "La vraie comparaison entre revenu freelance et salaire, en tenant compte des impôts, de la protection sociale, du temps non facturable et de la stabilité des revenus."
  "body": |
    La question « faut-il passer freelance ? » est presque toujours mal posée,
    sous la forme d'une comparaison entre votre salaire actuel et un taux horaire
    cible. La vraie comparaison est bien plus nuancée.

    ## Ce que votre employeur paie réellement pour vous

    Un salaire de 100 k$ coûte à l'employeur environ 130 à 145 k$ au total :

    | Poste | Coût |
    |-----------|------|
    | Salaire | 100 000 $ |
    | Charges sociales (part patronale, ~7,65 %) | 7 650 $ |
    | Assurance santé (part employeur) | 8 000–15 000 $ |
    | Abondement 401k (3–6 %) | 3 000–6 000 $ |
    | Matériel, bureaux | 3 000–8 000 $ |
    | Recrutement, intégration, encadrement | 5 000–15 000 $ |
    | **Coût total employeur** | **~127–152 k$** |

    En freelance, vous supportez vous-même tous ces coûts. Un chiffre d'affaires
    freelance de 100 k$, avant de les déduire, vaut nettement moins en revenu net
    qu'un salaire de 100 k$.

    ## Le multiplicateur du temps non facturable

    Un freelance facture en général 50 à 70 % de ses heures travaillées. Les 30 à
    50 % restants partent en développement commercial, administratif, facturation
    et périodes creuses entre deux projets. Si vous travaillez 2 000 heures par an
    et en facturez 65 %, vous disposez de 1 300 heures facturables pour couvrir
    l'ensemble de vos coûts annuels.

    Utilisez le calculateur de taux freelance ci-dessus pour faire ces calculs
    dans votre situation : le bon taux dépend de votre objectif de revenu, de
    votre taux d'imposition et de votre part de temps facturable.

    ## Quand le freelance est financièrement intéressant

    Le freelance bat le salariat financièrement quand :
    - Votre taux facturable vaut 2,5 à 3 fois le taux horaire salarié équivalent
    - Vous tenez plus de 60 % de temps facturable toute l'année
    - Vous accédez à une assurance santé équivalente à un coût raisonnable
    - Votre travail mobilise des compétences à forte valeur horaire (prime de spécialisation)
"how-to-raise-your-freelance-rate-with-existing-clients":
  "title": "Comment augmenter son taux freelance auprès de clients existants"
  "description": "Une démarche concrète pour augmenter votre taux auprès de clients avec qui vous travaillez déjà, sans perdre la relation : calendrier, formulation et réponse aux objections."
  "body": |
    Augmenter votre taux avec un nouveau client est simple : vous annoncez un prix
    plus élevé. L'augmenter avec quelqu'un avec qui vous travaillez depuis un an
    est une autre conversation, que la plupart des freelances repoussent bien
    trop longtemps.

    ## Pourquoi les freelances augmentent trop peu leurs clients existants

    L'aversion à la perte est plus forte que l'inconfort de sous-facturer : perdre
    un client connu et fiable semble plus risqué que le coût lent et invisible
    d'être sous-payé mois après mois. Pourtant, un client satisfait de votre
    travail au taux actuel restera très probablement après une hausse
    raisonnable ; la peur de le perdre dépasse généralement le risque réel.

    ## Une démarche simple

    1. **Prévenez 60 à 90 jours à l'avance** : le client a le temps de le budgéter,
       ce qui supprime totalement l'objection « on me l'impose d'un coup »
    2. **Appuyez-vous sur la valeur, pas sur le coût de la vie** : « mon taux passe
       à X » passe mieux que « je dois augmenter car mes coûts ont monté », qui
       ouvre une négociation sur vos dépenses personnelles plutôt que sur la
       valeur que vous apportez
    3. **Annoncez, ne demandez pas la permission** : « Mon taux sera de X à partir
       du [date] » est un fait sur la façon dont vous gérez votre activité, pas une
       demande que le client peut refuser
    4. **Tenez bon** : la plupart des clients qui protestent puis restent au
       nouveau taux respectent ensuite davantage votre temps et vos délais

    ## De combien augmenter, et à quelle fréquence

    Une hausse de 10 à 20 % une ou deux fois par an se défend et fait rarement
    partir un client à elle seule. Des hausses plus fortes (30 % et plus) se
    justifient plus facilement avec une nette augmentation du périmètre, de
    l'expérience ou des résultats démontrés depuis le dernier ajustement.

    ## Répondre aux objections

    Si un client ne peut pas suivre le nouveau taux, c'est une information utile :
    il a peut-être atteint le plafond de ce qu'il peut vous payer. C'est le signal
    qu'il faut investir davantage dans des clients capables d'accompagner la
    hausse de votre taux, plutôt que de rester sous-payé pour garder toutes vos
    relations existantes.

    ## Questions fréquentes

    **Faut-il augmenter tous les clients en même temps ?**
    Pas forcément : échelonnez selon les dates de renouvellement des contrats et
    testez d'abord la hausse avec votre relation la plus solide pour prendre
    confiance dans la démarche.

    **Et si un client dit qu'un concurrent est moins cher ?**
    Demandez ce dont il a précisément besoin à ce prix. Souvent, cela montre que
    la comparaison ne porte pas sur la même chose, ou cela ouvre une discussion
    sur un périmètre réduit plutôt que sur la fin de la relation.

    Utilisez le [calculateur de taux freelance](/tools/freelance-rate-calculator/)
    pour vérifier que votre nouveau taux dépasse toujours votre objectif de revenu
    minimum après impôts et frais.
"freelance-invoice-best-practices":
  "title": "Bonnes pratiques de facturation freelance : les mentions à inclure et comment être payé plus vite"
  "description": "Ce que doit contenir toute facture freelance (mentions obligatoires, conditions de paiement, pénalités de retard) et les techniques éprouvées pour réduire le délai de paiement."
  "body": |
    Une facture bien structurée fait deux choses : elle documente clairement ce
    que vous avez livré, et elle rend le paiement aussi simple que possible pour
    votre client.

    ## Mentions obligatoires

    Chaque facture doit comporter :
    - Le nom et l'adresse de votre entreprise (ou votre nom légal si vous êtes entrepreneur individuel)
    - Le nom et l'adresse de facturation du client
    - Un numéro de facture (séquentiel, jamais réutilisé)
    - La date de facture et la date d'échéance
    - Des lignes détaillées avec quantité, prix unitaire et total de ligne
    - Le sous-total, la remise éventuelle, la taxe et le total dû
    - Les instructions de paiement (coordonnées bancaires, PayPal, lien Stripe)
    - Les pénalités de retard (« 1,5 % par mois sur les sommes impayées »)

    ## Des conditions de paiement qui réduisent les retards

    Le paiement standard à 30 jours est trop lent pour un freelance. Plus efficace :
    - **14 jours** pour les clients établis qui paient bien
    - **50 % à la commande, 50 % à la livraison** pour les nouveaux clients ou les gros projets
    - **7 jours avec 2 % d'escompte pour paiement anticipé** : les clients qui auraient payé en retard paient en avance
    - **Prélèvement carte avec nouvelle tentative automatique** (via Stripe) pour les clients au forfait récurrent

    ## Les leviers psychologiques qui marchent

    1. **Utilisez des chiffres ronds** pour votre taux et arrondissez aux 5 $ près :
       plus simple à traiter pour les services comptables
    2. **Ajoutez un bouton « Payer maintenant »** qui mène à un lien de paiement :
       vous supprimez une friction
    3. **Envoyez la facture dans les 24 heures suivant la livraison** : plus c'est
       récent, plus le paiement est rapide
    4. **Relancez 7 jours avant l'échéance** : un rappel aimable, pas une traque

    Utilisez le [calculateur de facture](/tools/invoice-total-calculator/) pour
    calculer votre total avec remises et taxes correctement appliquées.
"how-to-calculate-invoice-total":
  "title": "Comment calculer le total d'une facture avec taxes et remises"
  "description": "Un guide pas à pas pour calculer correctement le total d'une facture : lignes, remises, taxes et pénalités de retard."
  "body": |
    Calculer correctement le total d'une facture évite les litiges, garantit que
    vous encaissez ce qui vous est dû et garde vos créances clients propres.

    ## Formule du total de facture

    **Sous-total** = somme de toutes les lignes (quantité × prix unitaire)
    **Après remise** = sous-total × (1 − % de remise)
    **Taxe** = montant après remise × taux de taxe
    **Total** = montant après remise + taxe

    ## Remise avant ou après taxe ?

    Appliquez toujours la remise au montant hors taxe. La taxe se calcule sur le
    prix remisé, pas sur le prix d'origine. Certaines juridictions l'exigent
    explicitement ; appliquer la taxe avant la remise est incorrect et fait payer
    trop cher votre client.

    ## Quand ajouter des pénalités de retard

    Indiquez les conditions de paiement sur chaque facture (par exemple « 30 jours,
    pénalité de 1,5 % par mois »). Pénalité = solde impayé × taux mensuel × mois de
    retard. Une facture de 5 000 $ en retard de 60 jours à 1,5 % par mois =
    5 000 $ × 1,5 % × 2 = 150 $ de pénalité.

    ## Bonnes pratiques de numérotation

    Utilisez des numéros séquentiels (INV-001, INV-002…) ou préfixés par l'année
    (2024-INV-001). Ne réutilisez jamais un numéro : cela sème la confusion en
    comptabilité et peut attirer l'attention en cas de contrôle fiscal.

    Construisez votre facture avec le [calculateur de facture](/tools/invoice-total-calculator/).
"contractor-vs-employee-hourly-rate":
  "title": "Prestataire ou salarié : le vrai taux horaire comparé"
  "description": "Comment comparer à égalité le taux journalier d'un prestataire et le salaire d'un employé : le détail complet du taux horaire, avantages et impôts compris."
  "body": |
    Comparer le taux journalier d'un prestataire à un poste salarié revient à
    comparer des pommes et des poires, sauf si l'on corrige toutes les différences
    cachées de rémunération totale.

    ## Ce que les salariés ont et pas les prestataires

    | Avantage | Valeur annuelle (estimation) |
    |---------|------------------------|
    | Assurance santé payée par l'employeur | 6 000–14 000 $ |
    | Abondement 401(k) de l'employeur (4 %) sur 75 k$ | 3 000 $ |
    | Congés payés (15 jours) | ~4 300 $ sur 75 k$ |
    | Charges sociales (part patronale FICA) | 7,65 % du salaire |
    | Congés maladie, congé parental | 1 000–5 000 $ |

    L'ensemble des avantages ajoute en général **25 à 40 % au salaire de base**.

    ## Convertir un taux journalier en salaire équivalent

    Un prestataire qui facture 220 jours à 500 $ par jour gagne 110 000 $ bruts. Après :
    - Cotisations d'indépendant : ~15 000 $
    - Absence d'avantages employeur : −20 000 $ par rapport au salariat
    - 20 % de marge pour l'administratif et les périodes creuses

    Valeur salariale équivalente : environ **75 000 à 85 000 $**.

    ## La règle empirique

    **Taux horaire du prestataire ≈ taux horaire salarié équivalent × 1,5 à 2**

    Un salarié à 75 k$ coûte ~36 $ de l'heure en salaire. Un prestataire qui fait
    un travail équivalent doit facturer 55 à 72 $ de l'heure pour être rémunéré
    autant, une fois tous les impôts et coûts payés.

    Modélisez vos chiffres exacts avec le [calculateur salaire en taux horaire](/tools/salary-to-hourly-calculator/).
"salary-to-hourly-conversion-guide":
  "title": "Salaire en taux horaire : comment bien convertir"
  "description": "Un guide pas à pas pour convertir un salaire annuel en taux horaire : temps partiel, heures supplémentaires et taux horaire effectif après impôt."
  "body": |
    Convertir un salaire annuel en taux horaire paraît simple : on divise par
    2 080 heures (52 semaines × 40 heures). Mais on obtient un chiffre brut qui
    ignore congés, jours fériés, coût des avantages et charges sociales. Voici le
    tableau complet.

    ## Formule de base : salaire ÷ 2 080

    Un salaire de 75 000 $ ÷ 2 080 heures travaillées = **36,06 $ de l'heure brut**.

    C'est le taux qu'un employeur utilise pour calculer les heures supplémentaires
    et celui qui figure sur la plupart des fiches de paie. Mais ce n'est pas ce que
    vous gagnez réellement par heure travaillée.

    ## Tenir compte des congés payés

    Avec 15 jours de congés + 10 jours fériés fédéraux = 25 jours non travaillés =
    200 heures. Vous travaillez 2 080 − 200 = 1 880 heures par an. Votre taux
    horaire effectif : 75 000 $ ÷ 1 880 = **39,89 $ de l'heure**. Vous êtes aussi
    payé pour le temps où vous ne travaillez pas, mais si vous voulez savoir ce que
    vous coûtez par heure productive, c'est ce chiffre qu'il faut prendre.

    ## Taux horaire après impôt

    Avec un taux effectif d'impôt fédéral de 22 % et 6,2 % de FICA :
    - Salaire net : 75 000 $ × (1 − 0,22 − 0,062) = ~53 850 $
    - Net horaire (÷ 2 080) : **25,89 $ de l'heure net**

    ## Taux freelance et taux salarié

    Un freelance doit ajouter les cotisations d'indépendant (15,3 %), la
    protection sociale, le temps administratif non payé et le risque de périodes
    creuses. Un freelance qui vise l'équivalent de 75 k$ doit en général facturer
    **55 à 70 $ de l'heure** pour égaler la rémunération totale d'un salarié.

    Utilisez le [calculateur salaire en taux horaire](/tools/salary-to-hourly-calculator/)
    pour modéliser votre situation.

"freelance-vs-w2-tax-comparison":
  "title": "Impôts freelance ou salarié (W-2) : le vrai coût de l'indépendance"
  "description": "Comment les impôts d'un freelance se comparent à ceux d'un salarié W-2 : les 15,3 % de SE tax expliqués, pourquoi mettre 25 à 30 % de côté, et quand cela vaut la peine."
  "body": |
    Quand on compare une mission freelance à 100 k$ à un salaire de 100 k$,
    l'option freelance entraîne un coût fiscal nettement plus élevé, mais aussi
    un revenu plus élevé avant déductions. Voici le tableau complet.

    ## La différence clé : la SE tax

    Un salarié W-2 à 100 k$ paie :
    - Social Security (6,2 %) + Medicare (1,45 %) = **7,65 %** prélevés sur sa paie
    - L'employeur paie 7,65 % de plus (invisibles pour le salarié)

    Un freelance à 100 k$ de bénéfice net paie :
    - Les deux parts : **15,3 %** de SE tax (15 300 $)
    - Il peut en déduire la moitié (7 650 $) de son revenu imposable

    L'indépendant paie donc ~7 650 $ de cotisations de plus que le salarié W-2 au
    même niveau de revenu.

    ## L'écart de taux

    | Revenu | Salarié W-2 | Freelance |
    |---|---|---|
    | 60 000 $ | ~9 000 $ d'impôts au total | ~16 000 $ d'impôts au total |
    | 100 000 $ | ~18 000 $ d'impôts au total | ~28 000 $ d'impôts au total |
    | 150 000 $ | ~32 000 $ d'impôts au total | ~44 000 $ d'impôts au total |

    *Estimations pour un célibataire, déduction forfaitaire, sans autre revenu.*

    ## Pourquoi les freelances s'en sortent souvent mieux

    1. **Des taux bruts plus élevés** : à travail équivalent, un prestataire gagne
       en général 20 à 40 % de plus qu'un salarié (l'entreprise n'a pas
       d'avantages à payer).
    2. **Les déductions** : les frais professionnels ramènent le revenu imposable
       sous l'équivalent W-2.
    3. **Les comptes retraite** : SEP-IRA et Solo 401(k) permettent d'abriter bien
       plus que le plafond 401(k) salarié de 23 000 $.
    4. **La souplesse** : vous pouvez choisir quand constater un revenu, le reporter
       sur une année moins imposée ou avancer des déductions sur une année forte.

    ## Le point d'équilibre

    Si un employeur propose 100 k$ en W-2 contre une mission freelance à 115 k$ :
    - SE tax supplémentaire ≈ 7 650 $
    - Revenu supplémentaire : 15 000 $
    - Avantage net du freelance : ~7 350 $ avant déductions

    Ajoutez les déductions (bureau à domicile, assurance santé, retraite) et
    l'option freelance à 115 k$ est en général nettement devant les 100 k$ salariés.

    Calculez vos impôts de freelance avec l'[estimateur d'impôts freelance](/tools/freelance-tax-estimator/).
"quarterly-estimated-tax-dates":
  "title": "Échéances des acomptes d'impôt trimestriels 2024–2025 (guide freelance)"
  "description": "Quand verser les acomptes trimestriels ? Les dates exactes de l'IRS pour 2024 et 2025, les règles de « safe harbor » et ce qui se passe si vous manquez un paiement."
  "body": |
    L'IRS impose aux travailleurs indépendants de verser des acomptes d'impôt
    quatre fois par an. Manquer une échéance déclenche des pénalités pour
    sous-paiement, actuellement autour de 8 % par an sur le manque.

    ## Échéances des acomptes 2024

    | Trimestre | Période couverte | Échéance |
    |---|---|---|
    | T1 | 1er janv. – 31 mars | **15 avril 2024** |
    | T2 | 1er avr. – 31 mai | **17 juin 2024** |
    | T3 | 1er juin – 31 août | **16 septembre 2024** |
    | T4 | 1er sept. – 31 déc. | **15 janvier 2025** |

    ## Échéances des acomptes 2025

    | Trimestre | Période couverte | Échéance |
    |---|---|---|
    | T1 | 1er janv. – 31 mars | **15 avril 2025** |
    | T2 | 1er avr. – 31 mai | **16 juin 2025** |
    | T3 | 1er juin – 31 août | **15 septembre 2025** |
    | T4 | 1er sept. – 31 déc. | **15 janvier 2026** |

    ## Les règles de « safe harbor »

    Vous évitez les pénalités pour sous-paiement si vous versez :
    - **Option A** : 90 % de l'impôt de l'année en cours, OU
    - **Option B** : 100 % de l'impôt de l'année précédente (110 % si l'AGI dépasse 150 000 $)

    L'option B est appréciée des freelances aux revenus irréguliers : versez ce que
    vous deviez l'an dernier en quatre parts égales, sans devoir prévoir
    précisément vos revenus de l'année.

    ## Comment payer

    Payez sur [IRS Direct Pay](https://www.irs.gov/payments/direct-pay) (gratuit,
    sans inscription) ou via EFTPS (Electronic Federal Tax Payment System). La
    plupart des États ont leurs propres acomptes avec des échéances similaires :
    consultez le site de l'administration fiscale de votre État.

    Estimez votre acompte avec l'[estimateur d'impôts freelance](/tools/freelance-tax-estimator/).
"self-employment-tax-deductions":
  "title": "Les principales déductions fiscales pour freelances et indépendants"
  "description": "Les déductions les plus intéressantes pour un freelance : bureau à domicile, assurance santé, retraite, matériel, et la déduction de la moitié de la SE tax expliquée."
  "body": |
    Chaque déduction professionnelle légitime réduit votre bénéfice net, et donc à
    la fois votre SE tax (15,3 %) et votre impôt sur le revenu. Une déduction de
    10 000 $ à un taux combiné de 30 % fait économiser 3 000 $ d'impôts.

    ## 1. La moitié de la SE tax

    L'IRS vous permet de déduire 50 % de votre SE tax du revenu brut avant le calcul
    de l'impôt sur le revenu. Si votre SE tax est de 12 240 $, vous déduisez
    6 120 $. C'est automatique : pas besoin de justificatifs.

    ## 2. Déduction pour bureau à domicile

    **Méthode simplifiée** : 5 $ par pied carré d'espace de bureau dédié (1 500 $ max)
    **Méthode des frais réels** : proratiser les dépenses du logement (prêt ou
    loyer, énergie, assurance) selon la part du logement utilisée exclusivement
    pour l'activité.

    Le bureau doit servir *régulièrement et exclusivement* à l'activité : un bureau
    dans un salon partagé ne compte pas.

    ## 3. Primes d'assurance santé

    Si vous payez votre propre assurance santé (pas via le contrat de l'employeur
    de votre conjoint), 100 % des primes sont déductibles du revenu brut (et pas
    seulement en déduction détaillée). Cela inclut les assurances dentaire et
    optique.

    ## 4. Épargne retraite

    - **SEP-IRA** : jusqu'à 25 % des revenus nets d'indépendant, 69 000 $ max (2024)
    - **Solo 401(k)** : 23 000 $ en part salarié + 25 % en part employeur
    - **Roth IRA** : 7 000 $ de versement, non déductible mais à croissance exonérée

    SEP-IRA et Solo 401(k) sont les déductions les plus puissantes pour un
    freelance. À 100 k$ de bénéfice net, un SEP-IRA versé au maximum fait
    économiser ~7 000 à 10 000 $ d'impôts.

    ## 5. Matériel et logiciels

    Ordinateurs, appareils photo, micros, abonnements logiciels, services cloud,
    coworking, livres et formations professionnels : tout est déductible s'il sert
    à l'activité. La section 179 permet de déduire le coût total dès la première
    année au lieu de l'amortir.

    ## 6. Services professionnels

    Honoraires comptables et de tenue de livres, frais juridiques liés à
    l'activité et primes d'assurance responsabilité civile professionnelle sont
    entièrement déductibles.

    Estimez votre impôt après déductions avec l'[estimateur d'impôts freelance](/tools/freelance-tax-estimator/).
"employer-payroll-tax-guide-us":
  "title": "Charges sociales patronales aux États-Unis : guide 2024"
  "description": "Le guide complet des charges sociales fédérales de l'employeur américain (Social Security, Medicare, FUTA) avec les taux 2024, les plafonds et des exemples de calcul."
  "body": |
    Aux États-Unis, l'employeur paie des charges sociales en plus du salaire brut
    de chaque salarié. Voici ce que vous devez et comment c'est calculé.

    ## Charges sociales fédérales de l'employeur (2024)

    ### Social Security (OASDI) : 6,2 %
    Taux : 6,2 % sur les salaires jusqu'à 168 600 $ (plafond 2024, à vérifier pour l'année en cours)
    Le salarié paie aussi 6,2 % ; la FICA totale fait 12,4 %, répartie à parts égales.

    ### Medicare : 1,45 %
    Taux : 1,45 % sur l'ensemble du salaire, sans plafond.
    Le salarié paie aussi 1,45 % (+ 0,9 % de Medicare additionnel au-delà de 200 k$, à la charge du salarié seul).

    ### FUTA (taxe chômage fédérale) : 0,6 %
    Taux : 6,0 % sur les 7 000 premiers dollars de salaire de chaque salarié.
    La plupart des employeurs bénéficient d'un crédit de 5,4 % pour le paiement de la taxe chômage de l'État (SUTA), ce qui ramène le taux effectif à **0,6 %**.

    ## Exemple de calcul : salaire de 80 000 $

    | Charge | Calcul | Coût employeur |
    |-----|-------------|--------------|
    | Social Security | 80 000 $ × 6,2 % | 4 960 $ |
    | Medicare | 80 000 $ × 1,45 % | 1 160 $ |
    | FUTA | 7 000 $ × 0,6 % | 42 $ |
    | **Total** | | **6 162 $** |

    Coût total de l'emploi = 80 000 $ + 6 162 $ = **86 162 $**

    Les taux SUTA varient selon l'État (0,1 % à plus de 10 %) et l'historique de
    licenciements. Modélisez toujours à part le taux de votre État.

    Utilisez le [calculateur de charges sociales](/tools/payroll-tax-calculator/)
    pour calculer le coût employeur de n'importe quel salaire.
"suta-futa-payroll-taxes-explained":
  "title": "SUTA et FUTA : les taxes chômage de l'État et fédérale expliquées"
  "description": "Comment FUTA et SUTA se combinent dans les taxes chômage de l'employeur : taux, assiettes, mécanisme de crédit et ce qui déclenche un ajustement du taux d'expérience."
  "body": |
    La plupart des employeurs américains paient deux régimes de taxe chômage en
    même temps : la FUTA (fédérale) et la SUTA (de l'État). Voici comment ils
    s'articulent.

    ## FUTA : taxe chômage fédérale

    **Taux** : 6,0 % sur les 7 000 premiers dollars de salaire de chaque salarié.
    **Taux effectif net** : 0,6 % pour la plupart des employeurs.
    **Pourquoi plus bas** : les employeurs qui paient la SUTA à temps et en totalité
    reçoivent un crédit de 5,4 %, ce qui ramène le taux effectif à 0,6 %.

    La FUTA finance le système fédéral d'assurance chômage et les prêts aux
    programmes des États.

    ## SUTA : taxe chômage de l'État

    Les taux varient selon l'État et le taux d'expérience de l'employeur :
    - Nouveaux employeurs : en général 1 à 4 % (selon l'État)
    - Employeurs établis : 0,1 % à plus de 10 % (selon l'historique des demandes)
    - Assiettes : de 7 000 $ (minimum fédéral) à plus de 62 500 $ (État de Washington)

    ## Le système du taux d'expérience

    Votre taux SUTA est recalculé chaque année selon votre historique de
    licenciements :
    - **Peu de licenciements** → le taux baisse (« expérience négative »)
    - **Beaucoup de licenciements** → le taux monte (« expérience positive » au sens fiscal)

    Les employeurs qui licencient massivement peuvent perdre le crédit FUTA (États
    à crédit réduit).

    ## L'impact sur les décisions de recrutement

    Avant de licencier, pensez-y : une seule demande d'allocation chômage peut
    augmenter votre taux SUTA pendant 3 ans ou plus. Pour un salaire de 100 k$
    avec 2 % de SUTA, une hausse d'un point = ~500 $ par an et par salarié sur
    l'assiette.

    Utilisez le [calculateur de charges sociales](/tools/payroll-tax-calculator/)
    pour calculer vos charges fédérales d'employeur. Ajoutez la SUTA à part selon
    le taux de votre État.
"vat-on-digital-services":
  "title": "TVA sur les services numériques : les règles pour le SaaS et le logiciel"
  "description": "Comment la TVA s'applique aux abonnements SaaS, aux logiciels et aux produits numériques vendus à des clients britanniques et européens, seuil du guichet unique (OSS) compris."
  "body": |
    Si vous vendez du SaaS, des licences logicielles ou d'autres services
    numériques, les règles de TVA sont nettement plus complexes que pour des biens
    physiques. Voici l'essentiel.

    ## TVA européenne sur les services numériques (« principe de destination »)

    Depuis 2015, les services numériques vendus à des consommateurs européens sont
    taxés là où se trouve le **client**, pas là où vous êtes établi. Concrètement :

    - Un SaaS américain qui facture un particulier français doit appliquer la TVA française (20 %)
    - Un SaaS britannique qui facture une entreprise allemande applique 0 % (autoliquidation B2B)
    - Un développeur australien qui vend une application à des particuliers italiens doit appliquer la TVA italienne (22 %)

    **Seuil OSS de l'UE** : si vos ventes numériques totales aux consommateurs
    européens dépassent 10 000 € par an, vous devez vous immatriculer à la TVA
    (localement ou via le guichet unique OSS de l'UE). En dessous, vous pouvez
    appliquer le taux de votre propre pays.

    ## B2B ou B2C : la distinction cruciale

    Les règles ci-dessus concernent le **B2C** (vente aux particuliers). En **B2B**
    (vente à d'autres entreprises assujetties), c'est l'autoliquidation qui
    s'applique :
    - Vous facturez 0 % (ou sans TVA)
    - Le client professionnel déclare lui-même la TVA dans son pays
    - Vous devez obtenir et vérifier son numéro de TVA

    ## Les règles britanniques après le Brexit

    Le Royaume-Uni applique son propre régime de TVA sur les services numériques.
    Les entreprises non britanniques dont les ventes numériques au Royaume-Uni
    dépassent 8 818 £ par an doivent s'immatriculer à la TVA britannique
    (actuellement 20 %) et déposer des déclarations distinctes de celles de l'UE.

    Utilisez notre [calculateur de TVA](/tools/vat-calculator/) pour calculer le
    bon montant à n'importe quel taux, et vérifiez les seuils en vigueur sur le
    site de l'administration fiscale de votre pays.
"vat-rates-by-country-2024":
  "title": "Taux de TVA par pays en 2024 : Royaume-Uni, UE, Australie, Canada"
  "description": "La liste complète des taux normaux de TVA/GST par pays en 2024, avec les taux réduits pour les produits essentiels et les règles sur les services numériques."
  "body": |
    La TVA, la GST (taxe sur les produits et services) et la sales tax sont toutes
    des taxes à la consommation, mais leurs taux, règles et noms varient selon les
    pays. Voici les taux normaux des destinations commerciales les plus courantes.

    ## Taux normaux de TVA/GST en 2024

    | Pays | Taux normal | Taux réduit | Remarques |
    |---------|--------------|--------------|-------|
    | Royaume-Uni | 20 % | 5 % | 0 % sur l'alimentation et les articles pour enfants |
    | Allemagne | 19 % | 7 % | |
    | France | 20 % | 5,5 % / 10 % | |
    | Italie | 22 % | 10 % / 5 % | |
    | Espagne | 21 % | 10 % | |
    | Pays-Bas | 21 % | 9 % | |
    | Suède | 25 % | 6 % / 12 % | Le plus élevé de l'UE |
    | Norvège | 25 % | 15 % | Hors UE |
    | Australie | GST 10 % | N/A | Taux unique |
    | Canada | GST 5 % | N/A | Plus la PST provinciale |
    | Nouvelle-Zélande | GST 15 % | N/A | |
    | Inde | GST 18 % | 5 % / 12 % | Plusieurs tranches |
    | États-Unis | 0 % (fédéral) | — | Sales tax des États uniquement |

    ## Règles de TVA sur les services numériques

    Si vous vendez des produits numériques (logiciels, livres numériques,
    abonnements SaaS) à des consommateurs européens, vous devez appliquer la TVA
    au taux du pays du client, pas à celui de votre pays, même si vous êtes établi
    hors de l'UE. Le guichet unique OSS de l'UE simplifie les choses en permettant
    de déposer une seule déclaration de TVA européenne.

    Le Royaume-Uni a des règles similaires depuis le Brexit : les entreprises non
    britanniques qui vendent des services numériques à des consommateurs
    britanniques doivent s'immatriculer à la TVA britannique si leurs ventes
    dépassent 8 818 £ par an.

    Utilisez notre [calculateur de TVA](/tools/vat-calculator/) pour ajouter ou
    retirer la TVA à n'importe quel taux.
"vat-reverse-charge-b2b-eu-explained":
  "title": "L'autoliquidation de la TVA pour les ventes B2B dans l'UE, expliquée"
  "description": "Comment fonctionne l'autoliquidation de la TVA européenne pour les ventes B2B transfrontalières, quand elle s'applique et ce qui doit figurer sur la facture."
  "body": |
    Si vous vendez des services numériques ou des biens en B2B à des clients
    d'autres pays de l'UE, vous avez sans doute vu « autoliquidation » sur un
    modèle de facture : c'est l'un des points les plus mal compris de la TVA
    européenne pour les vendeurs hors UE.

    ## Ce que signifie vraiment l'autoliquidation

    Normalement, le vendeur facture la TVA et la reverse à l'administration
    fiscale. Avec l'autoliquidation, c'est l'**acheteur** qui déclare lui-même la
    TVA : il l'inscrit sur sa propre déclaration à la fois comme TVA due et (en
    général) comme TVA déductible, ce qui donne zéro pour une entreprise
    entièrement assujettie. Le vendeur facture **0 % de TVA**.

    ## Quand elle s'applique

    - La vente est **B2B** (l'acheteur est immatriculé à la TVA dans un autre pays de l'UE)
    - L'acheteur fournit un **numéro de TVA valide** que vous vérifiez (via le système VIES de l'UE)
    - Elle ne s'applique **pas** aux ventes B2C, qui suivent les règles européennes
      de TVA sur les services numériques (taux du pays de l'acheteur)

    ## Ce qui doit figurer sur la facture

    - Les numéros de TVA des deux parties
    - La mention « Autoliquidation » ou « Autoliquidation de la TVA, article 196 de la directive TVA de l'UE »
    - Aucun montant de TVA facturé (0 %)

    ## Pourquoi ce mécanisme existe

    L'autoliquidation évite à un vendeur étranger de s'immatriculer à la TVA dans
    chaque pays acheteur pour ses ventes B2B. Sans elle, un SaaS américain ou
    britannique vendant à des entreprises dans les 27 États membres aurait besoin
    de dizaines d'immatriculations locales. La charge de conformité passe à
    l'acheteur, qui a déjà un numéro de TVA et est le mieux placé pour
    s'autoliquider correctement.

    ## Ce qui peut mal tourner

    Facturer la TVA alors que l'autoliquidation aurait dû s'appliquer empêche
    l'acheteur de la récupérer normalement, et vous avez collecté une taxe que
    vous n'auriez pas dû. À l'inverse, appliquer l'autoliquidation sans vérifier le
    numéro de TVA de l'acheteur (numéro invalide, acheteur pas réellement
    immatriculé) peut vous rendre redevable de la TVA que vous auriez dû facturer.

    ## Questions fréquentes

    **Faut-il vérifier le numéro de TVA à chaque fois ?**
    Oui : utilisez l'outil VIES de l'UE avant chaque nouveau client B2B, et
    conservez une trace de la vérification dans votre dossier de conformité.

    **Et les ventes depuis le Royaume-Uni après le Brexit ?**
    Les ventes B2B du Royaume-Uni vers l'UE bénéficient en général toujours d'un
    traitement à taux zéro similaire, mais les règles britanniques ont divergé du
    cadre européen : consultez les consignes actuelles du HMRC plutôt que de
    supposer que les règles de l'UE s'appliquent telles quelles.

    Utilisez le [calculateur de TVA](/tools/vat-calculator/) pour les calculs HT/TTC
    standards sur les transactions où la TVA s'applique.
