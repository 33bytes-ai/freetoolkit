what-is-free-cash-flow:
  title: "Qu'est-ce que le flux de trésorerie disponible ? Définition, formule et enjeux"
  description: "Le flux de trésorerie disponible, c'est le flux d'exploitation moins le capex : la vraie mesure de la trésorerie générée. Formule, repères, et pourquoi les investisseurs le préfèrent au résultat."
  body: |
    Le flux de trésorerie disponible (FCF) est la trésorerie qui reste une fois
    payées les dépenses d'investissement nécessaires pour maintenir ou développer
    l'outil de production. C'est l'argent disponible pour rémunérer les
    actionnaires, rembourser la dette ou réinvestir dans la croissance.

    **Formule : FCF = flux de trésorerie d'exploitation − dépenses d'investissement**

    ## Pourquoi les investisseurs regardent le FCF

    Le résultat comptable se manipule : plans d'amortissement, calendrier de
    reconnaissance du chiffre d'affaires, comptabilité d'engagement. La trésorerie
    est plus difficile à maquiller. Une entreprise qui gagne 10 M$ mais affiche un
    FCF négatif peut sembler rentable sur le papier tout en brûlant du cash.

    Le FCF est le dénominateur de l'un des multiples de valorisation les plus
    importants : **cours / FCF (P/FCF)**. Une entreprise valorisée 20 fois son FCF
    (20 $ de capitalisation par dollar de FCF) offre un rendement FCF de 5 % :
    c'est le taux de génération de trésorerie que vous achetez.

    ## Où trouver les données

    **Flux de trésorerie d'exploitation** : dans le tableau des flux de trésorerie,
    à la ligne « Flux liés à l'activité ». Il part du résultat net, réintègre les
    charges non décaissées (dotations aux amortissements) et corrige la variation
    du besoin en fonds de roulement.

    **Dépenses d'investissement (capex)** : dans le tableau des flux de trésorerie,
    sous « Flux liés aux opérations d'investissement », en général libellées
    « Acquisitions d'immobilisations corporelles ». Toujours un montant négatif
    (sortie de trésorerie).

    Pour une entreprise non cotée : flux d'exploitation = résultat net + dotations
    aux amortissements − augmentation du besoin en fonds de roulement.

    ## Le FCF face aux autres indicateurs

    | Indicateur | Ce qu'il mesure |
    |---|---|
    | Flux de trésorerie disponible | Trésorerie après capex, disponible pour les propriétaires |
    | EBITDA | Approximation du flux d'exploitation avant capex |
    | Résultat net | Bénéfice comptable, y compris éléments non décaissés |
    | Flux de trésorerie d'exploitation | Trésorerie issue de l'activité, avant capex |

    Pour un SaaS, le capex est en général faible (serveurs, ordinateurs), donc
    EBITDA et FCF sont proches. Dans les activités capitalistiques (industrie,
    immobilier), le FCF peut être bien inférieur à l'EBITDA.

    ## Repères de FCF

    Les SaaS de qualité génèrent 15 à 30 % de marge de FCF à grande échelle :
    - Veeva Systems : ~30 % de marge de FCF
    - Shopify : ~25 % de marge de FCF
    - HubSpot : ~18 % de marge de FCF
    - Salesforce : ~25 % de marge de FCF

    Les entreprises en phase d'amorçage (1 à 10 M$ d'ARR) ont souvent un FCF
    négatif ou proche de zéro. C'est normal si l'économie unitaire justifie
    l'investissement.

    Calculez le vôtre avec le [calculateur de flux de trésorerie disponible](/tools/free-cash-flow-calculator/).

fcf-vs-ebitda:
  title: "Flux de trésorerie disponible ou EBITDA : les différences clés pour un SaaS"
  description: "FCF et EBITDA mesurent tous deux la trésorerie générée, mais ne traitent pas le capex de la même façon. Quand utiliser chacun, et pourquoi le FCF est le signal le plus solide."
  body: |
    L'EBITDA et le FCF sont deux mesures courantes de la trésorerie générée, mais
    ils répondent à des questions différentes. Comprendre l'écart aide à présenter
    clairement vos chiffres aux investisseurs et à mieux allouer votre capital.

    ## Ce que mesure l'EBITDA

    **EBITDA = résultat net + intérêts + impôts + dotations aux amortissements**

    L'EBITDA neutralise :
    - les charges d'intérêts (choix de structure de capital)
    - les taux d'imposition (différences entre pays)
    - les dotations aux amortissements (charges non décaissées)

    Il permet de comparer la rentabilité d'entreprises dont la structure de
    capital, la politique d'amortissement ou la fiscalité diffèrent. C'est aussi
    une donnée courante des modèles de LBO et des covenants bancaires
    (dette nette / EBITDA).

    ## Ce que mesure le FCF

    **FCF = flux de trésorerie d'exploitation − dépenses d'investissement**

    Le FCF va plus loin que l'EBITDA : il retranche la trésorerie réellement
    investie en capex. Contrairement aux amortissements (que l'EBITDA réintègre),
    le capex est de l'argent qui sort vraiment de l'entreprise.

    Le FCF répond à la question : « une fois payés les investissements nécessaires
    pour maintenir et développer l'activité, combien de trésorerie reste-t-il ? »

    ## Pourquoi l'écart compte

    Pour un SaaS au capex minime (serveurs, ordinateurs), EBITDA ≈ FCF.
    L'écart représente en général 2 à 5 % du chiffre d'affaires.

    Dans les activités capitalistiques, l'écart devient énorme :

    | Type d'activité | Marge d'EBITDA | Capex / CA | Marge de FCF |
    |---|---|---|---|
    | SaaS cloud | 20 % | 2 % | 18 % |
    | Logiciel on-premise | 25 % | 5 % | 20 % |
    | Télécoms | 35 % | 20 % | 15 % |
    | Industrie | 15 % | 12 % | 3 % |

    ## Quand utiliser chacun

    **Utilisez l'EBITDA pour :**
    - comparer des entreprises d'un même secteur aux structures de capital différentes
    - calculer des ratios de levier (dette nette / EBITDA)
    - mener une analyse de LBO ou de fusion-acquisition

    **Utilisez le FCF pour :**
    - valoriser les fonds propres (multiple P/FCF)
    - juger la qualité réelle de la génération de trésorerie
    - décider d'une capacité de dividende ou de rachat d'actions
    - comparer un modèle à fort capex à un modèle peu capitalistique

    Face aux investisseurs, le FCF est le signal de meilleure qualité. L'EBITDA
    peut être enjolivé ; le FCF exige d'avoir vraiment de l'argent en banque.

    Calculez votre FCF avec le [calculateur de flux de trésorerie disponible](/tools/free-cash-flow-calculator/).

how-to-improve-fcf-margin:
  title: "Améliorer sa marge de FCF : 5 leviers pour les entreprises SaaS"
  description: "Marge de FCF = FCF / chiffre d'affaires. Les cinq leviers les plus efficaces pour l'augmenter, de la réduction de l'intensité du capex à la gestion du besoin en fonds de roulement."
  body: |
    La marge de FCF est le flux de trésorerie disponible divisé par le chiffre
    d'affaires. L'améliorer, c'est soit générer plus de trésorerie par euro de
    chiffre d'affaires, soit réduire les dépenses d'investissement. Voici les cinq
    leviers les plus efficaces pour un éditeur de logiciels.

    ## Levier 1 : passer les clients en facturation annuelle

    Le paiement annuel d'avance améliore fortement le FCF sans changer ni le
    chiffre d'affaires ni l'EBITDA. Quand un client paie 12 000 $ d'avance au lieu
    de 1 000 $/mois :
    - la reconnaissance du chiffre d'affaires est identique (1/12 par mois)
    - la trésorerie encaissée est 12 fois plus élevée dès le premier jour
    - le besoin en fonds de roulement s'améliore d'environ 11 mois de MRR par client converti

    Si vous convertissez 30 % de vos clients mensuels en annuel avec 10 % de
    remise, le FCF peut progresser de 15 à 20 % de l'ARR l'année de la transition.

    Tactique : proposez 1 à 2 mois offerts pour un prépaiement annuel. Présentez-le
    comme « 2 mois offerts » plutôt qu'en pourcentage : la valeur perçue est plus forte.

    ## Levier 2 : réduire le capex brut (efficacité des infrastructures)

    Dans un SaaS, les coûts d'infrastructure (calcul, stockage cloud) apparaissent
    souvent en charges d'exploitation plutôt qu'en capex. Mais gagner en efficacité
    sur l'infrastructure améliore directement le flux d'exploitation, donc le FCF.

    Améliorations courantes :
    - ajuster les engagements d'instances réservées (savings plans AWS/GCP)
    - repérer le calcul inutilisé et les occasions d'autoscaling
    - optimiser les requêtes de base de données pour réduire le calcul

    Un gain d'efficacité de 20 % sur 200 k$/an de dépenses cloud ajoute 40 k$ au
    flux d'exploitation : autant de FCF en plus.

    ## Levier 3 : mieux encaisser (réduire le DSO)

    Délai moyen de paiement clients (DSO) = créances clients / chiffre d'affaires × 365

    Un DSO élevé signifie que le chiffre d'affaires est reconnu avant d'être
    encaissé : du besoin en fonds de roulement qui pèse sur le flux d'exploitation.
    Passer de 45 à 30 jours de DSO à 5 M$ d'ARR libère environ 200 k$ de trésorerie.

    Tactiques :
    - exiger une carte bancaire ou un prélèvement avant l'activation
    - automatiser les relances après un échec de paiement
    - offrir 1 à 2 % d'escompte pour paiement anticipé sur les factures grands comptes

    ## Levier 4 : piloter le calendrier des paiements fournisseurs

    Délai moyen de paiement fournisseurs (DPO) = dettes fournisseurs / coût des ventes × 365

    Allonger les délais de paiement de 30 à 45 jours avec vos principaux
    fournisseurs améliore le fonds de roulement. Pour 500 k$/an de paiements
    fournisseurs, passer de 30 à 45 jours dégage environ 20 k$ de trésorerie.

    Attention : allonger les délais peut abîmer la relation fournisseur. Faites-le
    avec de grands fournisseurs capables d'offrir de meilleures conditions, pas avec
    de petits prestataires.

    ## Levier 5 : réduire l'intensité du capex

    Pour un SaaS pur, le capex est en général minime. S'il est significatif
    (matériel de data center, acquisitions de propriété intellectuelle), étudiez :
    - la location ou l'achat des équipements
    - le cloud ou l'hébergement en colocation
    - le report du capex non critique en période de faible croissance

    Passer de matériel en propre au cloud augmente les charges d'exploitation mais
    réduit le capex : la marge de FCF s'améliore en général même à coût total
    équivalent, car les coûts cloud sont déjà hors capex.

    Suivez l'évolution de votre marge de FCF avec le [calculateur de flux de trésorerie disponible](/tools/free-cash-flow-calculator/).

"favorable-vs-unfavorable-variance":
  "title": "Écart favorable ou défavorable : les différences clés"
  "description": "Comment savoir si un écart budgétaire est favorable ou défavorable, pourquoi le sens s'inverse entre lignes de chiffre d'affaires et de charges, et les erreurs d'étiquetage courantes."
  "body": |
    Un écart de même montant peut être une bonne ou une mauvaise nouvelle selon
    la ligne budgétaire concernée. Se tromper de sens est l'erreur la plus
    fréquente dans le reporting des écarts.

    ## La règle

    | Type de ligne | Réalisé > budget | Réalisé < budget |
    |-----------|-----------------|------------------|
    | Chiffre d'affaires | Favorable | Défavorable |
    | Charge | Défavorable | Favorable |

    Pour le chiffre d'affaires, plus c'est mieux : dépasser le budget est
    favorable. Pour les charges, moins c'est mieux : dépenser moins que prévu est
    favorable. L'étiquette décrit l'effet sur le résultat, pas le sens du chiffre.

    ## Pourquoi on s'y trompe

    Un tableur qui colore simplement en vert les écarts positifs et en rouge les
    écarts négatifs se trompe sur les charges : un écart de charge « positif »
    (dépassement) est une mauvaise nouvelle, mais une règle de couleur naïve
    l'afficherait en vert. Calculez toujours explicitement favorable/défavorable
    selon le type de ligne, au lieu de vous fier au seul signe.

    ## Un exemple chiffré

    Marketing budgété à 50 000 $, dépensé 58 000 $ → écart = +8 000 $ (16 % de
    dépassement) → **défavorable**, car c'est une ligne de charge qui dépasse.

    Chiffre d'affaires budgété à 200 000 $, réalisé 215 000 $ → écart = +15 000 $
    (7,5 % au-dessus) → **favorable**, car c'est une ligne de chiffre d'affaires
    qui dépasse.

    Les deux écarts sont positifs. L'un est une bonne nouvelle, l'autre une
    mauvaise.

    ## Les écarts favorables méritent aussi un examen

    Un gros écart favorable sur une charge n'est pas forcément bon : un projet a
    peut-être été retardé (l'argent sera dépensé plus tard) ou un plan de
    recrutement n'a pas été tenu, ce qui peut pénaliser la production. Analysez
    les gros écarts favorables avec la même rigueur que les défavorables.

    ## Questions fréquentes

    **« Favorable » veut-il toujours dire bon pour l'entreprise ?**
    Pas forcément. Sous-dépenser en marketing peut être favorable sur la ligne
    budgétaire mais défavorable pour la génération de pipeline. Vérifiez toujours
    l'effet en aval, pas seulement l'étiquette de la ligne.

    **Comment afficher favorable/défavorable dans un rapport ?**
    La plupart des équipes finance utilisent une colonne ou une icône dédiée
    (▲/▼ en couleur) calculée selon la règle ci-dessus, plutôt que le signe brut
    de l'écart : cela évite toute confusion entre chiffre d'affaires et charges.

    Utilisez le [calculateur d'écart budgétaire](/tools/budget-variance-calculator/) :
    il qualifie automatiquement chaque écart de favorable ou défavorable selon le
    type de ligne choisi.
"what-is-budget-variance-analysis":
  "title": "Qu'est-ce que l'analyse des écarts budgétaires ?"
  "description": "Un guide clair sur l'analyse des écarts budgétaires : ce qu'elle mesure, comment la calculer et comment les équipes finance l'utilisent pour repérer les problèmes tôt."
  "body": |
    L'analyse des écarts budgétaires consiste à comparer les résultats financiers
    réels au budget prévu, puis à expliquer les différences. C'est l'une des
    disciplines les plus élémentaires de la gestion financière, et l'une des plus
    souvent négligées.

    ## Le calcul de base

    $$\text{Écart} = \text{Réalisé} - \text{Budget}$$

    $$\text{Écart \%} = \frac{\text{Réalisé} - \text{Budget}}{|\text{Budget}|} \times 100$$

    Un écart seul n'est qu'un chiffre. L'analyse consiste à se demander *pourquoi*
    il existe et s'il se reproduira la période suivante.

    ## Pourquoi les équipes finance analysent les écarts chaque mois

    Une revue mensuelle des écarts repère les problèmes tant qu'ils coûtent peu à
    corriger. Une ligne marketing qui dépasse de 40 % au premier mois se règle en
    une conversation ; le même dépassement laissé sans suite pendant deux
    trimestres devient une crise de trésorerie. L'analyse des écarts est le
    système d'alerte précoce entre « nous avons fait un budget » et « nous l'avons
    réellement tenu ».

    ## Écarts de chiffre d'affaires et de charges se lisent en sens inverse

    Un écart de charge positif (plus dépensé que prévu) est défavorable. Un écart
    de chiffre d'affaires positif (plus encaissé que prévu) est favorable.
    Confondre les deux est l'erreur de reporting la plus courante dans les
    présentations financières : qualifiez toujours les écarts de
    favorables/défavorables, pas seulement de positifs/négatifs, pour éviter
    toute ambiguïté.

    ## Trois questions auxquelles toute revue d'écarts doit répondre

    1. **Est-ce un décalage de calendrier ou un vrai écart ?** Une dépense
       marketing tombée au mois 2 au lieu du mois 1 n'est pas un vrai
       dépassement, c'est un décalage.
    2. **Est-ce ponctuel ou structurel ?** Une grosse dépense exceptionnelle ne
       demande pas de changer les processus. Un dépassement récurrent de 15 % sur
       la même ligne chaque mois, si.
    3. **Cela change-t-il la prévision annuelle ?** Les écarts significatifs
       doivent mettre à jour votre reprévision, pas seulement être notés puis
       oubliés.

    ## Questions fréquentes

    **À partir de quelle taille un écart mérite-t-il d'être analysé ?**
    La plupart des équipes finance utilisent un seuil de matérialité, souvent 5 à
    10 % de la ligne budgétée, ou un montant fixe pour les petites lignes.
    En dessous, c'est du bruit normal ; au-dessus, creusez.

    **Chaque département doit-il revoir ses propres écarts ?**
    Oui : les responsables de département ont le contexte opérationnel que la
    finance n'a pas. Le rôle de la finance est de signaler l'écart et de poser
    la question ; le responsable du département en explique la cause.

    Utilisez le [calculateur d'écart budgétaire](/tools/budget-variance-calculator/)
    pour calculer instantanément l'écart en valeur et en pourcentage sur
    n'importe quelle ligne.
"how-to-reduce-days-sales-outstanding":
  "title": "Comment réduire le délai de paiement clients (DSO) dans un SaaS B2B"
  "description": "Un DSO élevé immobilise de la trésorerie dans des factures non encaissées. Ce guide présente les leviers les plus efficaces pour le réduire dans un SaaS B2B, des conditions de paiement aux relances automatisées."
  "body": |
    Le délai de paiement clients (DSO) est l'une des composantes les plus
    actionnables du cycle de conversion de trésorerie. Chaque jour gagné libère
    du fonds de roulement.

    À 5 M$ d'ARR avec un DSO de 30 jours : 5 M$ ÷ 365 × 30 = **411 k$ immobilisés en créances**.
    Ramenez le DSO à 15 jours : les créances tombent à 205 k$, soit **206 k$ libérés immédiatement**.

    ## Levier 1 : exiger un paiement annuel d'avance, contre une remise

    Le levier le plus puissant dans un SaaS : proposer 15 à 20 % de remise pour
    un prépaiement annuel. Un client annuel a un DSO de 0 dès qu'il paie. Un
    client mensuel facturé a un DSO de 30 à 60 jours.

    Faire passer 30 % des clients du mensuel à l'annuel peut diviser le DSO par
    deux.

    ## Levier 2 : passer de la facture au prélèvement automatique par carte

    Les factures mensuelles créent du DSO. Un prélèvement automatique par carte a
    un DSO ≈ 0 (hors délai de règlement, 1 à 2 jours).

    Pour les clients en libre-service et les TPE-PME : imposez la facturation
    automatique. Pour les grands comptes : gardez la facture, mais resserrez les
    conditions.

    ## Levier 3 : automatiser les séquences de relance

    Programmez des e-mails de relance automatiques :
    - 3 jours avant l'échéance : « Votre facture arrive à échéance »
    - Jour 0 (échéance) : « Votre facture est due aujourd'hui »
    - Jour 7 : « Facture en retard »
    - Jour 14 : « Second rappel : paiement requis pour éviter une interruption de service »

    Les séquences automatisées réduisent le DSO de 30 à 50 % par rapport à des
    relances manuelles.

    ## Levier 4 : raccourcir les délais de paiement standards

    60 jours → 30 jours → 15 jours → paiement à réception. Chaque réduction abaisse
    directement le DSO maximal. Les gros clients négocieront ; tenez bon sur les
    conditions standards pour les petits comptes.

    ## Levier 5 : exiger le virement pour les grands comptes

    Le risque de rétrofacturation sur carte pousse certains grands comptes à
    retarder leurs paiements. Les virements sont plus rapides et sans risque de
    rétrofacturation. Proposez-les par défaut sur les factures grands comptes.

    Utilisez le [calculateur de cycle de conversion de trésorerie](/tools/cash-conversion-cycle-calculator/)
    pour voir l'effet d'un DSO plus court sur votre CCC total.
"what-is-cash-conversion-cycle":
  "title": "Qu'est-ce que le cycle de conversion de trésorerie ? Guide du fonds de roulement"
  "description": "Le cycle de conversion de trésorerie (CCC) mesure combien de temps la trésorerie reste immobilisée dans l'exploitation. Ce guide explique le DIO, le DSO et le DPO, et comment utiliser le CCC pour optimiser le fonds de roulement."
  "body": |
    Le cycle de conversion de trésorerie (CCC) répond à une question : combien de
    jours s'écoulent entre le moment où vous dépensez pour vos achats et celui où
    vous encaissez vos clients ?

    **CCC = rotation des stocks (DIO) + délai de paiement clients (DSO) − délai de paiement fournisseurs (DPO)**

    Plus le CCC est bas, plus vite l'exploitation se transforme en trésorerie, ce
    qui libère du fonds de roulement pour la croissance sans financement
    supplémentaire.

    ## Les trois composantes

    ### DIO : rotation des stocks en jours

    Le temps pendant lequel les stocks restent en rayon avant d'être vendus.

    **DIO = stock moyen ÷ coût des ventes × 365**

    Avec 500 k$ de stock moyen et 3 M$ de coût des ventes annuel : DIO = 60,8 jours.

    DIO plus bas = rotation plus rapide = moins de trésorerie immobilisée en stock.

    ### DSO : délai de paiement clients

    Le temps nécessaire pour encaisser après une vente.

    **DSO = créances clients moyennes ÷ chiffre d'affaires × 365**

    Avec 400 k$ de créances moyennes et 5 M$ de chiffre d'affaires : DSO = 29,2 jours.

    Un DSO élevé signale un encaissement lent : conditions de paiement trop
    souples, facturation tardive ou clients qui paient en retard.

    ### DPO : délai de paiement fournisseurs

    Le temps que vous mettez à payer vos fournisseurs.

    **DPO = dettes fournisseurs moyennes ÷ coût des ventes × 365**

    Avec 200 k$ de dettes fournisseurs moyennes et 3 M$ de coût des ventes : DPO = 24,3 jours.

    DPO plus élevé = vous gardez la trésorerie plus longtemps = mieux pour le
    fonds de roulement.

    ## Utiliser le CCC pour planifier

    Les entreprises à CCC élevé ont besoin de plus de fonds de roulement (et
    souvent de lignes de crédit) pour financer leur croissance. Celles à CCC
    faible ou négatif peuvent croître avec très peu de financement externe.

    Si vous prévoyez de doubler votre chiffre d'affaires, votre besoin en fonds
    de roulement augmente à peu près proportionnellement au CCC : un CCC de
    65 jours avec un chiffre d'affaires doublé, c'est deux fois plus de
    trésorerie immobilisée dans l'exploitation.

    Calculez votre CCC avec le [calculateur de cycle de conversion de trésorerie](/tools/cash-conversion-cycle-calculator/).
"working-capital-management-saas":
  "title": "La gestion du fonds de roulement dans un SaaS"
  "description": "Les SaaS ont une dynamique de fonds de roulement particulière. Ce guide explique comment le CCC s'applique au SaaS, pourquoi la plupart ont un fonds de roulement négatif, et comment l'optimiser."
  "body": |
    Le fonds de roulement est la différence entre l'actif circulant et le passif
    circulant. Bien le gérer, c'est avoir la trésorerie quand il le faut sans
    se surfinancer.

    Pour un SaaS, la gestion du fonds de roulement est plus simple que pour une
    entreprise de produits physiques, mais elle reste importante, surtout à
    grande échelle.

    ## Pourquoi un SaaS a souvent un fonds de roulement négatif

    Un SaaS facturé à l'année, avec des dettes fournisseurs mensuelles, a :
    - **DIO = 0** (pas de stock : tout est numérique)
    - **DSO ≈ 0** (les clients paient d'avance ou par prélèvement automatique)
    - **DPO = 30 à 60 jours** (AWS, salaires, prestataires payés 30 à 60 jours après le service)

    **CCC = 0 + 0 − 45 = −45 jours**

    Un CCC négatif signifie que l'entreprise fonctionne sur le crédit
    fournisseurs : elle encaisse avant de devoir payer. C'est naturellement
    générateur de trésorerie.

    À comparer avec une société de services qui facture à 30 jours et paie ses
    fournisseurs à 60 :
    - DSO = 30 jours, DPO = 60 jours
    - CCC = 30 − 60 = −30 jours (toujours négatif, mais moins)

    ## Quand le fonds de roulement d'un SaaS devient positif

    Le fonds de roulement d'un SaaS peut devenir positif quand :
    - De gros contrats grands comptes sont facturés à 30–60 jours (les créances s'accumulent)
    - Les recrutements et les dépenses vont plus vite que les encaissements
    - Les produits constatés d'avance des contrats annuels ne sont pas adossés à des réserves de trésorerie

    Un SaaS à 10 M$ d'ARR dont 50 % en grands comptes (paiement à 45 jours) :
    - Créances grands comptes : 5 M$ ÷ 365 × 45 ≈ 616 k$ en attente à tout moment
    - Ce n'est pas négligeable, et cela double à 20 M$ d'ARR si les processus ne changent pas

    ## Optimiser le fonds de roulement d'un SaaS

    1. **Pousser la facturation annuelle d'avance** chez les grands comptes : moins de créances, meilleur DSO
    2. **Automatiser la facturation mensuelle** des TPE-PME et du mid-market : plus aucune créance
    3. **Allonger les délais fournisseurs** avec les prestataires clés (cloud, freelances) : DPO plus élevé
    4. **Utiliser une ligne de crédit pour les décalages** : couvrir les besoins de fonds de roulement
       à court terme sans dilution

    Calculez votre CCC et suivez votre fonds de roulement avec le
    [calculateur de cycle de conversion de trésorerie](/tools/cash-conversion-cycle-calculator/).
"accounts-receivable-turnover-ratio":
  "title": "Rotation des créances clients : formule, calcul et repères"
  "description": "Comment calculer la rotation des créances clients, ce qu'elle dit de l'efficacité de votre recouvrement, et les repères par type d'activité."
  "body": |
    ## Qu'est-ce que la rotation des créances clients ?

    La rotation des créances clients mesure combien de fois par période une
    entreprise encaisse son solde moyen de créances :

    **Rotation des créances = ventes nettes à crédit ÷ créances clients moyennes**

    Une rotation de 12× signifie que l'entreprise encaisse l'équivalent de tout
    son solde de créances 12 fois par an, soit environ tous les 30 jours.

    ## Rotation des créances et DSO

    Les deux indicateurs mesurent la vitesse d'encaissement sous des angles
    différents :

    | Rotation des créances | DSO équivalent |
    |---|---|
    | 18× | ~20 jours |
    | 12× | ~30 jours |
    | 8× | ~45 jours |
    | 6× | ~60 jours |
    | 4× | ~90 jours |

    **DSO = 365 ÷ rotation des créances**

    ## Comment calculer les créances moyennes

    Pour un trimestre : (créances en début + créances en fin) ÷ 2

    Exemple :
    - Créances au début du T3 : 120 000 $
    - Créances à la fin du T3 : 150 000 $
    - Créances moyennes : 135 000 $
    - Ventes nettes à crédit du T3 : 540 000 $
    - Rotation des créances (annualisée) : (540 000 $ × 4) ÷ 135 000 $ = 16×
    - DSO équivalent : 365 ÷ 16 = 22,8 jours

    ## Repères de rotation par secteur

    | Secteur | Rotation habituelle | DSO habituel |
    |---|---|---|
    | SaaS (abonnement) | 18–52× | 7–20 jours |
    | Services professionnels | 6–10× | 36–60 jours |
    | Industrie B2B | 5–8× | 45–73 jours |
    | BTP | 4–7× | 52–91 jours |
    | Santé | 5–9× | 40–73 jours |

    Calculez votre rotation des créances et votre DSO avec le
    [calculateur de délai de paiement clients](/tools/dso-calculator/).
"how-to-reduce-dso":
  "title": "Comment réduire le DSO et encaisser plus vite"
  "description": "Des leviers concrets pour réduire le délai de paiement clients, de la facturation à la politique de crédit en passant par les incitations au paiement."
  "body": |
    ## Pourquoi réduire le DSO

    Chaque jour de DSO en moins libère une trésorerie égale à votre chiffre d'affaires quotidien. Une entreprise à 5 M$ par an qui ramène son DSO de 45 à 30 jours libère ~205 k$ de fonds de roulement.

    ## Leviers concrets

    **Facturer plus vite :**
    - Envoyer la facture le jour de la livraison, pas en fin de mois
    - Passer à la facture électronique pour supprimer les délais postaux
    - Automatiser les factures récurrentes des abonnements

    **Relancer méthodiquement :**
    - J+1 après l'échéance : e-mail de rappel courtois
    - J+15 : relance téléphonique
    - J+30 : escalade vers un interlocuteur de direction
    - J+45 et au-delà : procédure de recouvrement ou règlement du litige

    **Inciter au paiement anticipé :**
    - Proposer un escompte pour paiement anticipé (voir le [calculateur d'escompte sur facture](/tools/invoice-discount-calculator/))
    - Appliquer des pénalités de retard (vérifiez d'abord la réglementation locale)
    - Programmes d'escompte dynamique via les plateformes de gestion fournisseurs et clients

    **Revoir la politique de crédit :**
    - Exiger un acompte ou un paiement d'avance des nouveaux clients
    - Raccourcir les délais des mauvais payeurs
    - Vérifier la solvabilité avant d'accorder un délai de paiement

    ## Le DSO selon le contexte

    Un « bon » DSO dépend beaucoup du secteur et du type de client :
    - **Commerce de détail** : proche de zéro (espèces, carte)
    - **Petit B2B** : 20 à 35 jours
    - **B2B grands comptes** : 45 à 75 jours
    - **Marchés publics** : 60 à 120 jours

    Suivez votre DSO chaque mois avec le [calculateur de rotation des créances](/tools/dso-calculator/).
"what-is-accounts-receivable-turnover":
  "title": "Qu'est-ce que la rotation des créances clients ?"
  "description": "Définition, formule et repères pour la rotation des créances clients et le délai de paiement clients (DSO)."
  "body": |
    ## Rotation des créances clients

    La rotation des créances mesure combien de fois par an une entreprise encaisse son solde moyen de créances clients :

    $$\text{Rotation des créances} = \frac{\text{Ventes nettes à crédit}}{\text{Créances clients moyennes}}$$

    Une rotation de 12 signifie que vous encaissez votre solde moyen de créances tous les 30 jours.

    ## DSO : délai de paiement clients

    Le DSO exprime la rotation des créances en jours, ce qui facilite la comparaison avec les conditions de paiement :

    $$\text{DSO} = \frac{\text{Créances moyennes}}{\text{Ventes nettes à crédit}} \times 365$$

    DSO et rotation des créances sont mathématiquement inverses : rotation élevée = DSO bas.

    ## Pourquoi la rotation des créances compte

    Un encaissement lent immobilise du fonds de roulement. Une entreprise qui a 500 k$ de créances au lieu de 300 k$ bloque inutilement 200 k$ de trésorerie, de l'argent qui pourrait financer l'exploitation ou rembourser la dette.

    Suivre la rotation des créances dans le temps révèle les tendances de recouvrement avant qu'elles ne tournent à la crise de trésorerie.

    Utilisez le [calculateur de rotation des créances](/tools/dso-calculator/) pour calculer votre ratio et votre DSO.
"working-capital-impact-of-dso":
  "title": "L'effet du DSO sur le fonds de roulement : encaisser plus vite pour libérer du cash"
  "description": "Comment calculer la trésorerie libérée en améliorant le DSO, et pourquoi l'efficacité du recouvrement est souvent le moyen le plus rapide d'améliorer le fonds de roulement sans lever de fonds."
  "body": |
    ## DSO et fonds de roulement

    Le fonds de roulement (actif circulant moins passif circulant) détermine si
    une entreprise peut financer son exploitation sans financement externe. Dans
    une entreprise B2B, les créances clients sont généralement le premier poste
    de l'actif circulant : le DSO pilote donc directement le besoin en fonds de
    roulement.

    ## Le calcul

    **Trésorerie libérée = chiffre d'affaires quotidien × jours de DSO gagnés**

    Chiffre d'affaires quotidien = chiffre d'affaires annuel ÷ 365

    Exemples :
    - Entreprise à 2 M$ d'ARR : 15 jours de DSO gagnés libèrent **82 000 $**
    - Entreprise à 5 M$ d'ARR : 15 jours de DSO gagnés libèrent **205 000 $**
    - Entreprise à 10 M$ d'ARR : 15 jours de DSO gagnés libèrent **411 000 $**

    ## Le DSO, une source de capital gratuite

    Améliorer le DSO équivaut économiquement à lever des fonds sans dette :
    - Aucune dilution (contrairement à une levée en capital)
    - Aucun intérêt (contrairement à un emprunt)
    - Une amélioration durable (contrairement à un prêt de trésorerie ponctuel)

    Une entreprise qui gagne 20 jours de DSO « lève » en fait l'équivalent de
    20 jours de chiffre d'affaires en fonds de roulement, sans aucun coût.

    ## Quand le DSO se dégrade

    Un DSO en hausse est l'un des premiers signaux de difficultés :

    1. **Clients sous tension** : des clients qui paient en retard faute de
       trésorerie, signe avant-coureur de créances irrécouvrables
    2. **Qualité des ventes** : de nouveaux clients moins solvables ajoutés pour
       faire croître le chiffre d'affaires
    3. **Erreurs de facturation** : des litiges qui bloquent les paiements
    4. **Recouvrement sous-dimensionné** : une équipe qui ne relance pas
       méthodiquement

    Suivez votre DSO chaque mois et analysez toute hausse de plus de 5 jours.
    Utilisez le [calculateur de délai de paiement clients](/tools/dso-calculator/).
"should-you-offer-an-early-payment-discount":
  "title": "Faut-il proposer un escompte pour paiement anticipé ?"
  "description": "Le calcul côté vendeur : un escompte comme 2/10 net 30 vaut-il son coût, et quand est-il pertinent d'en proposer un ?"
  "body": |
    L'escompte pour paiement anticipé accélère les encaissements, mais c'est en
    réalité un taux d'intérêt que vous payez pour être réglé plus tôt. Que
    l'échange en vaille la peine dépend de ce que vaut la trésorerie pour vous
    maintenant.

    ## Le coût annuel implicite d'un escompte standard

    Une condition 2/10 net 30 (2 % de remise si payé sous 10 jours, sinon
    échéance à 30) signifie que vous renoncez à 2 % pour être payé 20 jours plus
    tôt que l'échéance normale. Annualisé, cela donne environ :

    $$\text{Taux annuel implicite} = \frac{\text{Remise \%}}{100 - \text{Remise \%}} \times \frac{365}{\text{Jours d'avance}}$$

    Pour 2/10 net 30 : (2 ÷ 98) × (365 ÷ 20) ≈ **37 % annualisé**, un taux
    implicite étonnamment élevé pour ce qui ressemble à une petite remise de 2 %.

    ## Quand en proposer un reste pertinent

    - **Vous avez un meilleur usage de la trésorerie** : si un encaissement plus
      rapide vous évite un prêt ou une ligne de crédit à court terme plus chers,
      l'escompte peut coûter moins que le financement alternatif
    - **Votre trésorerie est tendue** : pour une entreprise réellement à court de
      fonds de roulement, être payé à 10 jours plutôt qu'à 30 (ou plus tard, tant
      « net 30 » veut souvent dire « net 45 et plus » en pratique) peut justifier
      un coût réel
    - **Vous voulez réduire le risque de recouvrement** : un paiement plus rapide
      réduit la fenêtre pendant laquelle la situation d'un client peut se
      dégrader avant qu'il ne vous paie

    ## Quand ça n'en vaut pas la peine

    Si votre trésorerie n'est pas tendue et que vous n'avez pas d'usage précis et
    rentable du cash 20 jours plus tôt, un taux annuel implicite de 37 % et plus
    est une façon coûteuse d'acheter de la vitesse. La plupart des entreprises
    dans cette situation feraient mieux de ne pas proposer d'escompte et de faire
    simplement respecter leurs conditions standards.

    ## Une alternative moins chère : des délais standards plus courts

    Plutôt qu'un escompte, raccourcissez vos délais standards (15 jours au lieu
    de 30) pour les nouveaux clients, ou exigez un acompte sur les grosses
    factures. Vous encaissez plus vite sans payer un taux implicite de 37 %.

    ## Questions fréquentes

    **La plupart des clients prennent-ils l'escompte ?**
    Le taux d'utilisation varie beaucoup selon le type de client et sa trésorerie.
    Les clients bien capitalisés l'ignorent souvent, car 2 % ne change rien pour
    eux, tandis que ceux qui manquent de trésorerie le prennent plus volontiers :
    vous risquez donc de subventionner précisément les clients les plus
    susceptibles de payer en retard autrement.

    **Existe-t-il un pourcentage d'escompte standard ?**
    2/10 net 30 est la convention la plus répandue, mais rien n'impose ce chiffre :
    calculez le taux annuel implicite de toute combinaison remise/jours avant de
    la proposer.

    Utilisez le [calculateur d'escompte sur facture](/tools/invoice-discount-calculator/)
    pour calculer le coût annualisé implicite de toute condition d'escompte que
    vous envisagez.
"what-is-2-10-net-30":
  "title": "Qu'est-ce que la condition de paiement 2/10 net 30 ?"
  "description": "La condition 2/10 net 30 expliquée : ce qu'elle signifie, comment calculer son coût annualisé et quand l'acheteur a intérêt à prendre l'escompte."
  "body": |
    ## 2/10 net 30 expliqué

    « 2/10 net 30 » est une condition de crédit commercial courante qui signifie :
    - **2 %** de remise si la facture est payée sous **10 jours**
    - Montant intégral dû sous **30 jours** si l'escompte n'est pas pris

    Elle figure sur les factures sous la forme « 2/10 N30 ».

    ## Le vrai coût du renoncement à l'escompte

    Renoncer à un escompte 2/10 net 30 revient à emprunter à un taux annuel de 37,2 % :

    $$\frac{2\%}{98\%} \times \frac{365}{20 \text{ jours}} = 37.2\%$$

    Vous payez en fait 2 % pour garder l'argent 20 jours de plus. C'est un financement extrêmement cher.

    ## Quand renoncer à l'escompte

    La seule raison rationnelle de renoncer à un escompte est que votre coût du capital soit inférieur à son coût annualisé, ce qui est rarement le cas pour un 2/10 net 30.

    Si vous ne pouvez vraiment pas payer plus tôt faute de trésorerie, c'est un problème de fonds de roulement à traiter à part. Envisagez une ligne de crédit renouvelable : emprunter à 8 % pour saisir un escompte à 37 % annualisé en vaut clairement la peine.

    Utilisez le [calculateur d'escompte sur facture](/tools/invoice-discount-calculator/) pour calculer le coût annualisé de n'importe quelle condition d'escompte.
"when-to-take-early-payment-discount":
  "title": "Quand prendre un escompte pour paiement anticipé ?"
  "description": "Une grille de décision pour savoir s'il faut prendre un escompte pour paiement anticipé, avec la comparaison du coût annualisé et les enjeux de fonds de roulement."
  "body": |
    ## Prendre ou refuser

    Prenez l'escompte quand : **coût annualisé de l'escompte > votre coût du capital**

    Refusez-le quand : **coût annualisé de l'escompte < votre coût du capital**

    Pour un 2/10 net 30 à 37,2 % de coût annualisé, presque toute entreprise devrait prendre l'escompte. La vraie question est de savoir si vous avez la trésorerie.

    ## Grille de décision

    | Trésorerie | Coût du capital | Recommandation |
    |--------------|----------------|----------------|
    | Solide | Quel que soit le taux | Toujours prendre l'escompte |
    | Tendue | Inférieur au coût de l'escompte | Emprunter pour prendre l'escompte |
    | Tendue | Supérieur au coût de l'escompte | Refuser : préserver la trésorerie coûte moins cher |
    | Crise | Sans objet | Refuser : la survie d'abord |

    ## Quand c'est vous qui proposez l'escompte

    Si vous proposez un escompte à vos clients (en tant que vendeur), le calcul s'inverse : c'est vous qui payez. Modélisez soigneusement le coût : proposer 2/10 net 30 réduit de 2 % le chiffre d'affaires réellement encaissé sur les clients qui paient tôt.

    Le [calculateur d'escompte sur facture](/tools/invoice-discount-calculator/) couvre le point de vue de l'acheteur comme celui du vendeur.
"free-cash-flow-formula-explained":
  "title": "Flux de trésorerie disponible : formule, exemples et enjeux"
  "description": "Ce qu'est le flux de trésorerie disponible (FCF), comment le calculer à partir de l'OCF et du capex, et pourquoi c'est l'indicateur clé de la valorisation d'une entreprise."
  "body": |
    Le flux de trésorerie disponible (FCF) est la trésorerie qui reste une fois
    couvertes les charges d'exploitation et les dépenses d'investissement. C'est
    ce qui est disponible pour investir dans la croissance, rembourser la dette,
    verser des dividendes ou constituer des réserves.

    **Flux de trésorerie disponible = flux de trésorerie d'exploitation − dépenses d'investissement**

    ## Pourquoi le FCF est la référence en valorisation

    La plupart des modèles de valorisation sérieux reposent sur l'actualisation
    des flux de trésorerie disponibles (DCF). Acquéreurs et fonds de private
    equity valorisent les entreprises sur un multiple du FCF plutôt que du chiffre
    d'affaires ou de l'EBITDA, car le FCF représente de l'argent réel et
    distribuable.

    Une entreprise valorisée à 15× un FCF de 500 k$ par an a une valeur
    d'entreprise de 7,5 M$.

    ## Le rendement FCF, raccourci de l'investisseur

    **Rendement FCF = FCF / valeur d'entreprise**

    Un rendement FCF de 5 % signifie que vous gagneriez chaque année 5 % du prix
    d'achat en trésorerie disponible, soit environ un multiple de 20× le FCF. La
    plupart des acheteurs visent au minimum 5 à 10 % de rendement FCF.

    ## Quel capex inclure

    Le capex comprend :
    - Les achats d'équipements
    - L'aménagement des bureaux et les agencements
    - Le développement logiciel immobilisé (important pour un SaaS B2B)
    - Les véhicules et machines

    Le capex ne comprend PAS :
    - L'entretien courant (passé en charges, non immobilisé)
    - Les abonnements logiciels (charges d'exploitation)
    - Les salaires de R&D (charges d'exploitation)

    ## La marge FCF comme repère de croissance

    **Marge FCF = FCF / chiffre d'affaires**

    Pour un SaaS, la marge FCF compte autant que la croissance du chiffre
    d'affaires. L'indicateur combiné (taux de croissance + marge FCF) est de plus
    en plus utilisé comme variante de la règle des 40.

    Utilisez le [calculateur de flux de trésorerie d'exploitation](/tools/operating-cash-flow-calculator/)
    pour calculer votre OCF et votre FCF à partir de votre compte de résultat.
"operating-cash-flow-vs-net-income":
  "title": "Flux de trésorerie d'exploitation ou résultat net : quelle différence ?"
  "description": "Pourquoi l'OCF et le résultat net divergent, ce que mesure chacun, et comment les lire ensemble pour comprendre la rentabilité réelle d'une entreprise."
  "body": |
    Le flux de trésorerie d'exploitation et le résultat net prétendent tous deux
    mesurer la rentabilité, mais ils racontent des histoires très différentes.
    Comprendre les deux est indispensable pour lire correctement des états
    financiers.

    ## Ce que mesure le résultat net

    Le résultat net (bénéfice) est le chiffre d'affaires moins l'ensemble des
    coûts, tel qu'inscrit au compte de résultat. Il suit la comptabilité
    d'engagement : le chiffre d'affaires est constaté quand il est acquis, et les
    charges sont rattachées à la période qui les concerne.

    Une entreprise peut donc afficher un résultat net élevé sans recevoir aucune
    trésorerie. Une société qui vend pour 1 M$ à crédit sans rien encaisser
    affichera 1 M$ de résultat net et 0 $ de trésorerie.

    ## Ce que mesure l'OCF

    Le flux de trésorerie d'exploitation corrige le résultat net :

    1. **Des charges non décaissées** (amortissements, rémunération en actions) :
    réintégrées, car elles réduisent le résultat sans consommer de trésorerie

    2. **De la variation du besoin en fonds de roulement** : créances clients,
    stocks et dettes fournisseurs, c'est-à-dire les décalages entre constatation
    du chiffre d'affaires et encaissement ou paiement

    OCF = résultat net + charges non décaissées + variation du BFR

    ## Pourquoi ils divergent

    **Cas 1 : entreprise A**, croissance rapide, grosses créances
    Résultat net : 500 k$. Les clients doivent 600 k$ (pas encore encaissés). OCF : négatif.
    Lecture : l'entreprise est rentable mais brûle de la trésorerie pour financer sa croissance.

    **Cas 2 : entreprise B**, activité mature et capitalistique
    Résultat net : 200 k$. Amortissement des équipements : 300 k$. OCF : 500 k$.
    Lecture : la génération réelle de trésorerie est bien supérieure à ce que montre le compte de résultat.

    ## La fiabilité de l'OCF

    Les investisseurs avertis préfèrent l'OCF et le flux de trésorerie disponible
    au résultat net, car :
    - La constatation du chiffre d'affaires peut être manipulée (avancée, différée)
    - Les plans d'amortissement relèvent de choix de la direction
    - L'OCF exige que l'argent arrive réellement en banque

    Une entreprise au résultat net durablement élevé mais à l'OCF faible mérite
    un examen attentif.

    Utilisez le [calculateur de flux de trésorerie d'exploitation](/tools/operating-cash-flow-calculator/)
    pour convertir votre compte de résultat en OCF et mesurer l'écart.
"working-capital-impact-on-cash-flow":
  "title": "Le besoin en fonds de roulement et son impact sur la trésorerie"
  "description": "Comment la variation des créances clients, des stocks et des dettes fournisseurs agit sur le flux de trésorerie d'exploitation, et comment piloter le fonds de roulement pour générer plus de cash."
  "body": |
    Le fonds de roulement est la différence entre l'actif circulant (trésorerie,
    créances, stocks) et le passif circulant (dettes fournisseurs, charges à
    payer). Sa variation est souvent le moteur caché de l'écart entre résultat
    net et flux de trésorerie d'exploitation.

    ## La formule du fonds de roulement

    **Fonds de roulement = actif circulant − passif circulant**

    **Effet d'une variation du fonds de roulement sur l'OCF :**
    - Créances **en hausse** → l'argent n'est pas encore encaissé → l'OCF baisse
    - Stocks **en hausse** → payés mais pas encore vendus → l'OCF baisse
    - Dettes fournisseurs **en hausse** → vous devez de l'argent sans l'avoir payé → l'OCF augmente

    ## Les fuites de trésorerie courantes liées au fonds de roulement

    **Encaissement lent** : un SaaS à 1 M$ d'ARR qui facture à 60 jours a en
    permanence ~165 k$ immobilisés en créances (deux mois de chiffre d'affaires).
    Passer à 15 jours libère 125 k$ de trésorerie immédiate sans changer le
    chiffre d'affaires.

    **Constitution de stocks** : un e-commerçant qui stocke avant la haute saison
    consomme de la trésorerie des mois avant d'encaisser. Une planification
    soignée des stocks réduit ce piège.

    **Paiements d'avance** : facturer les plans annuels d'avance (abonnement payé
    à l'avance) crée un fonds de roulement négatif : vous encaissez avant de
    constater le chiffre d'affaires. C'est l'une des raisons pour lesquelles les
    SaaS adorent le prépaiement annuel.

    ## Comment améliorer le fonds de roulement

    1. **Proposer un escompte pour paiement anticipé** : 1 à 2 % de remise pour
    un paiement sous 10 jours (au lieu de 30) est souvent rationnel pour
    l'acheteur et accélère nettement vos encaissements.

    2. **Passer à la facturation annuelle** : faire passer les clients du mensuel
    à l'annuel encaisse 12 mois d'avance au lieu d'un seul.

    3. **Négocier les délais fournisseurs** : passer de 30 à 60 jours vous offre
    un financement à court terme sans intérêts, aux frais de vos fournisseurs.

    4. **Stocks en flux tendu** : pour les produits physiques, réduire le coût de
    stockage en commandant au plus près de la demande réelle.

    Utilisez le [calculateur de flux de trésorerie d'exploitation](/tools/operating-cash-flow-calculator/)
    pour modéliser l'effet d'une amélioration du fonds de roulement sur votre
    trésorerie.
"how-to-improve-working-capital":
  "title": "Comment améliorer son fonds de roulement : 5 stratégies éprouvées"
  "description": "Améliorez votre fonds de roulement en accélérant les encaissements, en maîtrisant les stocks, en allongeant les délais fournisseurs et en optimisant votre cycle de conversion de trésorerie."
  "body": |
    Améliorer le fonds de roulement tient en trois leviers : encaisser plus vite,
    stocker moins et payer les fournisseurs plus tard (sans abîmer la relation).

    ## 1. Accélérer l'encaissement des créances

    Chaque jour où une créance reste impayée consomme du fonds de roulement.
    - Passer à la facturation automatique (abonnements Stripe, prélèvement)
    - Proposer 1 à 2 % d'escompte pour paiement anticipé (souvent rentable face aux intérêts d'une ligne de crédit)
    - Envoyer des relances automatiques à 15, 30 et 45 jours de retard
    - Exiger un acompte ou un paiement d'avance des nouveaux clients

    ## 2. Optimiser les niveaux de stock

    Un stock excédentaire, c'est du fonds de roulement bloqué dans un entrepôt.
    - Utiliser des prévisions de demande pour dimensionner le stock de sécurité
    - Négocier une gestion des stocks par le fournisseur (VMI) avec les fournisseurs clés
    - Repérer et écouler les références à faible rotation

    ## 3. Allonger les délais fournisseurs (sans abîmer la relation)

    Payer les fournisseurs au 45e jour plutôt qu'au 20e libère 25 jours de fonds de roulement.
    - Négocier des paiements à 45 ou 60 jours avec les principaux fournisseurs
    - Utiliser des cartes professionnelles à débit différé (30 jours) pour les petits achats
    - Allonger en priorité les délais des fournisseurs qui tiennent à votre volume

    ## 4. Utiliser une ligne de crédit renouvelable pour les creux

    Une ligne de crédit ne « répare » pas le fonds de roulement : c'est une
    passerelle pour les creux saisonniers. Gardez votre ratio de liquidité
    générale au-dessus de 1,5x même après tirage.

    ## 5. Passer à la facturation annuelle pour les abonnements

    La facturation annuelle d'avance transforme des créances futures en
    trésorerie immédiate. Les SaaS facturés à l'année encaissent en général 40 à
    60 % mieux que leurs pairs facturés au mois.

    Suivez vos progrès avec le [calculateur de fonds de roulement](/tools/working-capital-calculator/).
"what-is-working-capital":
  "title": "Qu'est-ce que le fonds de roulement ?"
  "description": "Définition, formule et guide pratique du fonds de roulement : ce qu'il signifie, comment le calculer et comment le piloter."
  "body": |
    ## Qu'est-ce que le fonds de roulement ?

    Le fonds de roulement est la différence entre l'actif circulant et le passif circulant d'une entreprise :

    $$\text{Fonds de roulement} = \text{Actif circulant} - \text{Passif circulant}$$

    Il représente le coussin financier à court terme disponible pour financer l'exploitation au quotidien.

    ## Composantes

    **Actif circulant** (convertible en trésorerie sous 12 mois) :
    - Trésorerie et équivalents
    - Créances clients
    - Stocks
    - Charges constatées d'avance

    **Passif circulant** (exigible sous 12 mois) :
    - Dettes fournisseurs
    - Dettes à court terme
    - Salaires et charges à payer
    - Produits constatés d'avance

    ## Fonds de roulement positif ou négatif

    Un **fonds de roulement positif** signifie que l'actif dépasse le passif : l'entreprise peut financer son exploitation sans financement externe.

    Un **fonds de roulement négatif** signifie que le passif dépasse l'actif. Certaines entreprises fonctionnent volontairement ainsi en encaissant avant de payer leurs fournisseurs (grande distribution, Amazon). Pour la plupart des entreprises, c'est un signal de risque de liquidité.

    ## Le fonds de roulement dans l'analyse financière

    La variation du fonds de roulement agit directement sur la trésorerie. Des créances ou des stocks en hausse consomment du cash ; des dettes fournisseurs en hausse en préservent. C'est pourquoi les entreprises en forte croissance ont souvent des problèmes de trésorerie alors qu'elles sont rentables : la croissance dévore du fonds de roulement.

    Utilisez le [calculateur de fonds de roulement](/tools/working-capital-calculator/) pour évaluer votre ratio de liquidité générale.
"working-capital-vs-cash-flow":
  "title": "Fonds de roulement ou flux de trésorerie : quelle différence ?"
  "description": "Le fonds de roulement est une photo du bilan ; le flux de trésorerie, c'est l'activité en mouvement. Comment ils sont liés et pourquoi il faut suivre les deux."
  "body": |
    Le fonds de roulement et le flux de trésorerie mesurent tous deux la santé
    financière, mais sous des angles différents. Beaucoup d'entreprises rentables
    ont échoué en pilotant l'un sans l'autre.

    ## Le fonds de roulement : la photo

    Le fonds de roulement se calcule à partir du bilan : il indique où vous en
    êtes à un instant donné.

    **Fonds de roulement = actif circulant − passif circulant**

    Il répond à la question : « Si je figeais tout aujourd'hui, pourrais-je
    payer mes échéances à court terme ? »

    ## Le flux de trésorerie : le mouvement

    Le flux de trésorerie (en particulier le flux d'exploitation) mesure la
    trésorerie nette générée par l'entreprise sur une période : mois, trimestre
    ou année.

    Une entreprise peut avoir un fonds de roulement solide et un flux de
    trésorerie faible si :
    - Ses créances sont importantes mais lentes à encaisser (DSO élevé)
    - Ses stocks sont élevés mais ne tournent pas

    À l'inverse, elle peut avoir un fonds de roulement faible et un flux de
    trésorerie solide si :
    - Ses clients paient d'avance (facturation annuelle d'un SaaS)
    - Ses fournisseurs accordent de longs délais de paiement

    ## Pourquoi suivre les deux ?

    Le fonds de roulement renseigne sur le risque de liquidité immédiat. Le flux
    de trésorerie renseigne sur la trajectoire : le fonds de roulement
    s'améliore-t-il ou se dégrade-t-il ?

    Les entreprises qui modélisent leur fonds de roulement avec une [analyse du CCC](/tools/cash-conversion-cycle-calculator/)
    en parallèle de leurs prévisions de trésorerie évitent les crises de
    trésorerie surprises.

    Calculez votre fonds de roulement avec le [calculateur de fonds de roulement](/tools/working-capital-calculator/).
"working-capital-vs-current-ratio":
  "title": "Fonds de roulement ou ratio de liquidité générale : les différences clés"
  "description": "Comment le fonds de roulement et le ratio de liquidité générale mesurent différemment la liquidité, et quand utiliser chacun."
  "body": |
    ## Fonds de roulement et ratio de liquidité générale

    Les deux indicateurs évaluent la liquidité à court terme à partir des mêmes données, mais expriment le résultat différemment :

    | Indicateur | Formule | Résultat |
    |--------|---------|--------|
    | Fonds de roulement | Actif circulant − passif circulant | Montant en dollars |
    | Ratio de liquidité générale | Actif circulant ÷ passif circulant | Ratio / multiple |

    ## Quand le fonds de roulement est plus utile

    Le fonds de roulement (le montant) est plus utile pour :
    - Comparer la liquidité absolue d'une même entreprise d'une période à l'autre
    - Estimer votre marge de trésorerie en valeur absolue
    - Calculer la variation du fonds de roulement pour l'analyse des flux de trésorerie

    ## Quand le ratio de liquidité générale est plus utile

    Le ratio de liquidité générale est plus utile pour :
    - Comparer des entreprises de tailles différentes
    - Se situer par rapport aux normes du secteur
    - Rendre compte du respect des covenants bancaires

    ## Exemple

    **Entreprise A** : 10 M$ d'actif circulant, 8 M$ de passif circulant
    - Fonds de roulement = 2 M$
    - Ratio de liquidité générale = 1,25×

    **Entreprise B** : 1 M$ d'actif circulant, 800 k$ de passif circulant
    - Fonds de roulement = 200 k$
    - Ratio de liquidité générale = 1,25×

    Les deux ont le même ratio de liquidité générale mais des positions de liquidité absolue très différentes. Le fonds de roulement les distingue.

    Utilisez le [calculateur de fonds de roulement](/tools/working-capital-calculator/) pour voir les deux.

"how-to-reduce-stripe-fees":
  "title": "Comment réduire ses frais Stripe : 5 méthodes concrètes"
  "description": "Stripe facture 2,9 % + 0,30 $ par défaut. Voici cinq moyens concrets de réduire votre taux effectif, de la facturation annuelle à la négociation sur volume."
  "body": |
    Le tarif standard de Stripe, **2,9 % + 0,30 $**, est fixe pour la plupart des
    entreprises. Mais le taux *effectif* que vous payez dépend de la façon dont vous
    structurez votre facturation et du volume que vous traitez. Voici cinq méthodes
    concrètes pour le faire baisser.

    ## 1. Passer de la facturation mensuelle à l'annuelle

    Sur un forfait à 99 $/mois, Stripe prélève ses frais 12 fois : 3,17 $ par
    renouvellement, soit 38,04 $ par an. Sur un forfait annuel équivalent à 990 $,
    vous payez une seule fois : 29,01 $. Vous économisez 9,03 $ par abonné et par an
    simplement en changeant de rythme de facturation, tout en améliorant votre
    trésorerie.

    ## 2. Augmenter le montant moyen des transactions

    La part fixe de 0,30 $ pèse surtout sur les petites transactions : 6 % à 5 $,
    0,6 % à 50 $, 0,06 % à 500 $. Les offres groupées, les forfaits annuels et les
    montants minimums de commande réduisent tous le poids de la part fixe par
    dollar encaissé.

    ## 3. Utiliser l'Optimized Checkout Suite de Stripe

    [Link](https://stripe.com/payments/link) (le paiement en un clic de Stripe)
    augmente en général la conversion de 7 à 30 %, sans frais supplémentaires. Plus
    de conversion, c'est plus de chiffre d'affaires pour le même coût de
    traitement : votre coût effectif par dollar encaissé baisse.

    ## 4. Négocier un tarif sur volume

    Stripe propose des tarifs sur mesure au-delà de **80 000 $ par mois** (environ
    1 M$ par an). La remise varie, mais se situe généralement 0,2 à 0,5 point
    sous le tarif standard. Contactez l'équipe commerciale de Stripe à l'approche
    de ce seuil : elle négociera.

    ## 5. Faire passer les paiements ACH à part

    Stripe ne facture que **0,8 % (plafonné à 5,00 $)** pour les virements
    bancaires américains (ACH). Si vos clients sont des entreprises américaines,
    proposer l'ACH pour les factures de plus de ~500 $ réduit fortement vos frais
    effectifs. À 1 000 $, les frais sont de 5 $ (0,5 %) contre 29,30 $ par carte.

    ## Ce que vous ne pouvez pas réduire

    Le tarif de Stripe n'est pas négociable pour la plupart des entreprises sous
    1 M$ par an. Changer complètement de prestataire (Shopify Payments, Paddle ou
    un acquéreur local) peut rapporter plus que l'optimisation : utilisez le
    [comparateur de frais de paiement](/tools/payment-fee-comparison/) pour voir
    les chiffres exacts à votre montant moyen de transaction.
"lowest-payment-processing-fees-small-business":
  "title": "Les frais de paiement les plus bas pour une petite entreprise (2026)"
  "description": "Stripe, PayPal et Shopify Payments comparés pour les petites entreprises. Quel prestataire a les frais les plus bas pour votre montant moyen de transaction ?"
  "body": |
    Pour la plupart des petites entreprises, les trois grands prestataires de
    paiement sont **Stripe**, **PayPal** et **Shopify Payments**. Le moins cher
    dépend presque entièrement de votre montant moyen de transaction et de votre
    volume mensuel.

    ## Les frais en un coup d'œil (2026)

    | Prestataire | Taux | Part fixe | Idéal pour |
    |-----------|------|-------|---------|
    | Stripe | 2,9 % | 0,30 $ | SaaS, profils techniques, API |
    | PayPal Standard | 2,99 % | 0,49 $ | Confiance des consommateurs, places de marché |
    | PayPal Checkout | 3,49 % | 0,49 $ | Conversion via le bouton PayPal |
    | Shopify Basic | 2,0 % | 0,25 $ | E-commerce, forfait à 39 $/mois |
    | Shopify | 1,7 % | 0,25 $ | E-commerce, forfait à 105 $/mois |
    | Shopify Advanced | 1,5 % | 0,25 $ | E-commerce à fort volume |

    ## Les seuils de rentabilité

    **Shopify Basic contre Stripe** : Shopify Basic (forfait à 39 $/mois) coûte
    autant que Stripe autour de **3 900 $ de volume mensuel** (l'abonnement de 39 $
    compense une économie d'environ 1 %). Au-delà, Shopify Basic est moins cher ;
    en dessous, Stripe l'emporte.

    **Shopify contre Stripe à 100 $ la transaction** :

    | Prestataire | Frais sur 100 $ | Vous gardez |
    |-----------|-------------|---------|
    | Stripe | 3,20 $ | 96,80 $ |
    | PayPal Standard | 3,48 $ | 96,52 $ |
    | Shopify Basic | 2,25 $ | 97,75 $ |
    | Shopify Advanced | 1,75 $ | 98,25 $ |

    ## Lequel choisir ?

    - **Moins de 2 000 $ de volume mensuel** → Stripe (pas d'abonnement, meilleure expérience développeur)
    - **E-commerce sur Shopify** → Shopify Payments (taux plus bas, pas de frais de transaction externe)
    - **Vente aux particuliers avec beaucoup de paniers abandonnés** → PayPal (le gain de conversion compense le taux)
    - **Plus de 80 000 $ par mois** → négocier avec Stripe ou comparer Stripe à Paddle/FastSpring

    Saisissez votre montant moyen de transaction dans le [comparateur de frais de paiement](/tools/payment-fee-comparison/)
    pour voir les frais exacts et l'option la moins chère dans votre cas.
"paypal-fees-for-online-payments":
  "title": "Frais PayPal pour les paiements en ligne : le détail complet"
  "description": "PayPal facture 2,99 à 3,49 % + 0,49 $ par transaction en ligne. Le détail complet des frais, quand PayPal est compétitif et quand il ne l'est pas."
  "body": |
    PayPal a deux grands niveaux de tarif pour l'acceptation des cartes en ligne :
    **PayPal Standard** à 2,99 % + 0,49 $ et **PayPal Checkout** (le bouton à la
    marque PayPal) à 3,49 % + 0,49 $. La différence compte pour les SaaS et les
    abonnements, où la part fixe de 0,49 $ grignote la marge sur les petites
    transactions.

    ## Quand PayPal est-il pertinent ?

    Le principal atout de PayPal est la **confiance des acheteurs** : les clients
    qui voient le bouton PayPal finalisent souvent des achats qu'ils auraient
    abandonnés, surtout au moment du paiement. Une étude du Baymard Institute
    montre que PayPal réduit l'abandon au paiement sans compte jusqu'à 14 % par
    rapport à un simple formulaire.

    Si votre panier moyen dépasse 30 $ et que vous vendez en direct aux
    consommateurs, le gain de conversion peut largement compenser le taux plus
    élevé par rapport à Stripe.

    ## Les frais PayPal comparés sur un paiement de 100 $

    | Prestataire | Frais | Vous recevez |
    |-----------|-----|------------|
    | Stripe | 3,20 $ | 96,80 $ |
    | PayPal Standard | 3,48 $ | 96,52 $ |
    | PayPal Checkout | 3,98 $ | 96,02 $ |

    Sur 100 $, Stripe économise 0,28 à 0,78 $ par transaction. À 1 000 transactions
    par mois, cela fait 280 à 780 $ par mois, qui s'accumulent vite à grande
    échelle.

    ## PayPal et les abonnements

    Les accords de facturation PayPal permettent des prélèvements récurrents sans
    que le client valide chaque paiement. Mais la gestion des abonnements
    (prorata, montées en gamme, relances) est plus limitée qu'avec Stripe
    Billing. Pour un pur SaaS, on préfère en général l'outillage développeur et la
    fiabilité des webhooks de Stripe.

    ## L'avantage transfrontalier de PayPal

    PayPal dispose d'une acquisition locale dans plus de 40 pays et gère nativement
    le règlement multidevise. Si une part importante de vos clients est à
    l'étranger, la conversion de PayPal peut rivaliser avec les frais de cartes
    internationales de Stripe (+1,5 % pour les cartes non américaines).

    Utilisez le [comparateur de frais de paiement](/tools/payment-fee-comparison/)
    avec votre montant moyen de transaction pour voir l'écart exact en dollars dans
    votre cas.
"stripe-vs-paypal-for-subscriptions":
  "title": "Stripe ou PayPal pour les abonnements : lequel coûte le moins ?"
  "description": "Les frais de Stripe et PayPal comparés pour la facturation d'abonnements, avec des exemples mensuels et annuels et un calcul du point d'équilibre."
  "body": |
    Pour un modèle d'abonnement, le choix entre Stripe et PayPal se joue sur les
    frais, la fiabilité et la richesse fonctionnelle. Voici la comparaison
    complète.

    ## Les frais sur un abonnement mensuel

    Les deux prestataires prélèvent leurs frais standards à chaque renouvellement :

    | Prestataire | Forfait mensuel à 49 $ | Forfait annuel à 490 $ |
    |-----------|-----------------|-----------------|
    | Stripe | 1,72 $/renouvellement | 14,51 $ une fois |
    | PayPal Standard | 1,96 $/renouvellement | 15,11 $ une fois |

    Sur un forfait à 49 $/mois, Stripe économise **2,88 $ par abonné et par an**
    par rapport à PayPal Standard. À 1 000 abonnés, cela fait **2 880 $ par an**,
    rien qu'avec l'écart de taux.

    ## Fonctions d'abonnement : Stripe l'emporte

    Stripe Billing est conçu pour le SaaS : prorata, facturation à l'usage,
    périodes d'essai, mise en pause des abonnements et relances automatiques des
    paiements échoués. Les API d'abonnement de PayPal fonctionnent, mais n'ont ni
    la même profondeur ni la même fiabilité.

    Le taux de rétrofacturation de PayPal sur les abonnements numériques est aussi
    plus élevé que celui de Stripe, un point critique car trop de
    rétrofacturations peuvent geler votre compte.

    ## Utilisez notre comparateur

    Saisissez le prix de votre forfait mensuel dans le [comparateur de frais de paiement](/tools/payment-fee-comparison/)
    pour voir l'économie mensuelle exacte d'un changement de prestataire pour votre
    montant d'abonnement.
"stripe-vs-shopify-payments-fees":
  "title": "Stripe ou Shopify Payments : quand Shopify Payments est vraiment moins cher"
  "description": "Shopify Payments peut coûter moins cher que Stripe pour une boutique en ligne. Ce guide donne les seuils de volume exacts et quand chaque prestataire l'emporte."
  "body": |
    Shopify Payments et Stripe se ressemblent en surface (les deux reposent sur
    l'infrastructure de Stripe), mais leurs grilles tarifaires diffèrent nettement
    pour les marchands Shopify.

    ## La différence clé : la surtaxe de passerelle Shopify

    Si vous utilisez Stripe directement sur Shopify (et non Shopify Payments),
    Shopify facture des **frais de transaction supplémentaires** en plus de ceux
    de Stripe :
    - Forfait Basic : +2,0 %
    - Forfait Shopify : +1,0 %
    - Forfait Advanced : +0,5 %

    Stripe devient ainsi **nettement plus cher** que Shopify Payments pour les
    marchands Shopify.

    ## Comparaison des taux : Shopify Payments ou Stripe sur Shopify

    Pour une boutique Shopify Basic (39 $/mois) à 10 000 $ de volume mensuel :

    | Option | Frais de traitement | Frais de passerelle | Total mensuel |
    |--------|---------------|-------------|---------------|
    | Stripe sur Shopify | 320 $ | +200 $ (2 %) | 520 $ |
    | Shopify Payments Basic | 225 $ | 0 $ | 225 $ |

    Shopify Payments économise **295 $ par mois** à 10 k$ de volume, ce qui couvre
    largement le forfait à 39 $/mois.

    ## Quand Stripe hors Shopify est préférable

    Si vous **ne vendez pas sur Shopify**, Stripe est le meilleur choix :
    - De meilleures API pour un tunnel de paiement sur mesure
    - Une facturation d'abonnements supérieure
    - Une meilleure couverture internationale
    - Aucune dépendance à une plateforme

    Comparez les frais exacts pour vos montants de transaction avec notre
    [comparateur de frais de paiement](/tools/payment-fee-comparison/).
"paypal-fee-on-100-dollars":
  "title": "Combien PayPal prend-il sur une transaction de 100 $ ?"
  "description": "Les frais PayPal exacts sur un paiement de 100 $ : Standard, Checkout et Biens et services, avec la comparaison Stripe."
  "body": |
    Sur un **paiement de 100 $** via PayPal Standard (carte), les frais sont de **3,49 $** (3,49 %) :
    - 2,99 % de 100 $ = 2,99 $
    - Part fixe = 0,49 $ (en USD, national)
    - **Total des frais = 3,48 $ | Vous recevez = 96,52 $**

    Avec PayPal Checkout (le parcours plus récent) : **3,98 $ de frais | 96,02 $ net**

    Avec PayPal Biens et services (« Entre proches » est réservé à un usage
    personnel : l'utiliser pour une activité enfreint les conditions de PayPal) :
    **3,48 $ de frais**.

    ## 100 $ comparés : PayPal, Stripe et Square

    | Prestataire | Frais sur 100 $ | Net reçu |
    |-----------|---------|-------------|
    | PayPal Standard | 3,49 $ | 96,52 $ |
    | PayPal Checkout | 3,98 $ | 96,02 $ |
    | Stripe (national) | 3,20 $ | 96,80 $ |
    | Square (en ligne) | 3,20 $ | 96,80 $ |

    Stripe et Square coûtent **0,29 à 0,78 $ de moins** par transaction de 100 $.
    À 100 transactions par mois, changer fait économiser 29 à 78 $ par mois. À
    1 M$ de volume annuel, l'écart atteint 2 900 à 7 800 $ par an.

    ## Pour recevoir exactement 100 $ net via PayPal
    Facturez **103,59 $** pour recevoir exactement 100 $ après les frais PayPal Standard :
    (100 $ + 0,49 $) / (1 − 0,0299) = 103,59 $.
"paypal-fee-on-1000-dollars":
  "title": "Combien PayPal prend-il sur une transaction de 1 000 $ ?"
  "description": "Les frais PayPal exacts sur un paiement de 1 000 $ et à partir de quand s'appliquent les remises sur volume."
  "body": |
    Sur un **paiement de 1 000 $** via PayPal Standard, les frais sont de **30,49 $** (3,05 %) :
    - 2,99 % de 1 000 $ = 29,90 $
    - Part fixe = 0,49 $
    - **Total des frais = 30,39 $ | Vous recevez = 969,61 $**

    Avec PayPal Checkout : **35,39 $ de frais | 964,61 $ net**

    ## À partir de quel volume PayPal baisse-t-il ses tarifs ?

    Le programme **tarif marchand** de PayPal réduit les frais selon le volume de ventes mensuel :
    - 0 à 3 000 $/mois : 2,99 % + 0,49 $ (standard)
    - 3 001 à 10 000 $/mois : 2,89 % + 0,49 $
    - 10 001 à 100 000 $/mois : 2,79 % + 0,49 $
    - Plus de 100 001 $/mois : contactez PayPal pour un tarif sur mesure

    Pour une transaction de 1 000 $ avec 50 k$ de volume mensuel (2,79 % + 0,49 $) :
    frais = **28,39 $ | net = 971,61 $**, soit environ 2 $ d'économie par transaction
    par rapport au tarif standard.

    ## Le virement ACH, alternative pour 1 000 $
    Pour des factures B2B de 1 000 $, un virement ACH coûte 0 $ (ou un forfait de 1 à
    5 $ chez certains prestataires), soit 30 fois moins que PayPal. Si votre acheteur
    est une entreprise, proposer l'ACH à côté de PayPal avec « 3 % de supplément pour
    PayPal » est de plus en plus courant et conforme dans la plupart des États
    américains.
"paypal-fees-australia":
  "title": "Frais PayPal en Australie : tarifs en AUD et comparaison avec Stripe"
  "description": "Les frais PayPal pour les entreprises australiennes : tarifs en AUD, exemples chiffrés et comparaison avec Stripe."
  "body": |
    Les marchands PayPal australiens paient **2,6 % + 0,30 A$** par transaction
    nationale. Pour PayPal Checkout, le taux est de **3,49 % + 0,49 A$**. Les
    transactions transfrontalières (cartes émises hors d'Australie) ajoutent 1,5 %.

    ## Exemples de frais PayPal en Australie (AUD)

    | Montant | PayPal Standard | PayPal Checkout | Stripe (national AU) |
    |--------|----------------|----------------|---------------------|
    | 25 A$  | 0,95 A$ (3,8 %) | 1,36 A$ (5,4 %) | 0,74 A$ (2,96 %) |
    | 100 A$ | 2,90 A$ (2,9 %) | 3,98 A$ (4,0 %) | 2,05 A$ (2,05 %) |
    | 500 A$ | 13,30 A$ (2,66 %) | 17,94 A$ (3,6 %) | 9,05 A$ (1,81 %) |

    ## BPAY et virement bancaire comme alternatives
    Pour les factures B2B en Australie, BPAY (virement via BSB + numéro de compte)
    est pratiquement gratuit pour le marchand. Pour les grosses factures (plus de
    2 000 A$), proposer le virement bancaire à côté de PayPal et de la carte peut
    économiser 2 à 3 % par transaction. Utilisez le calculateur de facture pour
    ajouter une ligne « remise pour virement bancaire » en guise d'incitation.
"paypal-fees-canada":
  "title": "Frais PayPal au Canada : tarifs en CAD et comparaison avec Stripe"
  "description": "Les frais PayPal pour les entreprises canadiennes : tarifs en CAD, frais transfrontaliers, et quand Stripe coûte moins cher."
  "body": |
    Les marchands PayPal canadiens paient **2,99 % + 0,49 C$** pour les
    transactions PayPal standards. Pour PayPal Checkout (le parcours de marque plus
    récent), le taux est de **3,49 % + 0,49 C$**. Les transactions
    transfrontalières ajoutent 1,5 %, et la conversion de devise ajoute un écart de
    3 à 4 % sur le taux de change.

    ## Exemples de frais PayPal au Canada (CAD)

    | Montant | PayPal Standard | PayPal Checkout | Stripe (national CA) |
    |--------|----------------|----------------|---------------------|
    | 25 C$  | 1,24 C$ (5,0 %) | 1,36 C$ (5,4 %) | 1,03 C$ (4,1 %) |
    | 100 C$ | 3,48 C$ (3,5 %) | 3,98 C$ (4,0 %) | 3,20 C$ (3,2 %) |
    | 500 C$ | 15,44 C$ (3,1 %) | 17,94 C$ (3,6 %) | 14,80 C$ (3,0 %) |

    ## TPS/TVH sur les frais PayPal
    PayPal applique la TPS ou la TVH aux frais de traitement des entreprises
    canadiennes selon la province d'immatriculation. Pour une entreprise inscrite,
    elle est en général récupérable sous forme de crédit de taxe sur les intrants.
    PayPal émet un relevé de frais chaque mois.

    ## PayPal ou Stripe pour une entreprise canadienne
    Stripe est moins cher pour le traitement carte standard (2,9 % + 0,30 C$ contre
    2,99 % + 0,49 C$ chez PayPal). L'écart grossit avec le volume : à 10 000 C$ par
    mois, Stripe économise environ 24 C$ par mois par rapport à PayPal Standard.
    Stripe offre aussi une meilleure gestion des abonnements, des webhooks plus
    fiables et de meilleurs outils pour les développeurs.
"paypal-fees-uk":
  "title": "Frais PayPal au Royaume-Uni : tarifs, exemples et comparaison avec Stripe"
  "description": "Les frais PayPal exacts pour les entreprises britanniques : tarifs nationaux et internationaux, exemples chiffrés et comparaison avec Stripe."
  "body": |
    PayPal facture aux entreprises britanniques **1,2 % + 30p** pour les paiements
    par carte de débit britannique, **2,99 % + 30p** pour les paiements par carte
    standard (Visa/Mastercard) et **3,49 % + 49p** pour PayPal Checkout. Les
    transactions internationales supportent en plus des frais transfrontaliers de
    1,5 % et un écart de conversion de devise de 3 à 4 %.

    ## Exemples de frais PayPal au Royaume-Uni (GBP)

    | Montant | PayPal Standard | PayPal Checkout | Stripe (national UK) |
    |--------|----------------|----------------|---------------------|
    | 10 £ | 0,60 £ (6,0 %) | 0,84 £ (8,4 %) | 0,35 £ (3,5 %) |
    | 50 £ | 1,80 £ (3,6 %) | 2,24 £ (4,5 %) | 0,95 £ (1,9 %) |
    | 100 £ | 3,29 £ (3,3 %) | 3,98 £ (4,0 %) | 1,70 £ (1,7 %) |
    | 500 £ | 15,30 £ (3,1 %) | 17,94 £ (3,6 %) | 7,70 £ (1,54 %) |

    ## Quand PayPal vaut ses frais plus élevés

    Le principal atout de PayPal pour une entreprise britannique est la **confiance
    des acheteurs et le taux de conversion**. Des études montrent que 56 % des
    acheteurs britanniques font davantage confiance à PayPal qu'à la saisie de leur
    carte sur un site inconnu. Pour une boutique au trafic froid (faible notoriété),
    le gain de conversion apporté par PayPal peut compenser le surcoût.

    **Règle empirique** : si votre panier moyen est inférieur à 30 £ et que vous
    envoyez du trafic depuis les réseaux sociaux vers une marque inconnue, le gain
    de conversion de PayPal justifie probablement son coût. Pour un SaaS par
    abonnement ou du B2B à panier élevé, Stripe est presque toujours moins cher et
    meilleur.
"shopify-basic-vs-shopify-plan-fees":
  "title": "Shopify Basic ou forfait Shopify : écart de frais et quand passer au supérieur"
  "description": "Les frais de Shopify Basic (39 $/mois) et Shopify Standard (105 $/mois) comparés : à partir de quand le changement de forfait se rembourse."
  "body": |
    Shopify propose trois forfaits principaux : **Basic** (39 $/mois), **Shopify**
    (105 $/mois) et **Advanced** (399 $/mois). Chaque palier réduit les frais de
    transaction et les taux carte.

    ## Tableau comparatif des frais

    | | Basic (39 $/mois) | Shopify (105 $/mois) | Advanced (399 $/mois) |
    |-|---------------|-----------------|-------------------|
    | **Taux Shopify Payments** | 2,0 % + 25¢ | 1,7 % + 25¢ | 1,5 % + 25¢ |
    | **Frais de passerelle tierce** | 2,0 % | 1,0 % | 0,5 % |
    | **Taux Amex / cartes internationales** | 3,5 % | 3,5 % | 3,5 % |

    ## Quand passer de Basic à Shopify est-il rentable ?

    Le changement coûte **66 $ de plus par mois** (105 $ − 39 $). La baisse de
    frais est de 0,3 point sur les transactions Shopify Payments.

    **Formule du point d'équilibre** : le volume d'affaires mensuel pour lequel
    0,3 % d'économie = 66 $ par mois, soit **22 000 $ de GMV mensuel** (avec
    Shopify Payments).

    Si votre boutique dépasse 22 000 $ par mois via Shopify Payments, passer au
    forfait Shopify vous fait gagner de l'argent net.

    ## Quand passer de Shopify à Advanced est-il rentable ?

    Surcoût : **294 $ par mois**. Baisse de frais : 0,2 point sur Shopify Payments.
    Point d'équilibre : **147 000 $ de GMV mensuel**

    La plupart des boutiques passent à Advanced pour les rapports personnalisés et
    des frais de passerelle tierce plus bas (0,5 % au lieu de 1,0 %), pas pour
    l'écart de taux carte.
"shopify-fees-vs-woocommerce":
  "title": "Frais Shopify ou WooCommerce : comparaison du coût total"
  "description": "Le coût complet de Shopify et de WooCommerce comparé : abonnement, frais de transaction, hébergement et GMV d'équilibre."
  "body": |
    Shopify et WooCommerce ont des structures de coûts fondamentalement
    différentes. Shopify facture un abonnement mensuel prévisible ; WooCommerce ne
    coûte rien en plateforme mais demande un hébergement et davantage de
    maintenance.

    ## Comparaison des coûts mensuels

    | Poste de coût | Shopify Basic | WooCommerce |
    |----------------|--------------|-------------|
    | Abonnement plateforme | 39 $/mois | 0 $ |
    | Hébergement | inclus | 10–25 $/mois |
    | Frais de transaction (Stripe) | 2,0 % (hors SP) ou 0 % (SP) | 0 % |
    | Traitement carte (Stripe) | 2,0 % + 25¢ (SP) | 2,9 % + 30¢ |
    | Nom de domaine | ~2 $/mois | ~2 $/mois |
    | Maintenance / extensions | 0 $ | 10–50 $/mois |

    ## À partir de quel GMV WooCommerce devient-il moins cher ?

    Avec Shopify Payments (sans frais de transaction), à 22 k$ de GMV mensuel sur Basic :
    - Shopify : 39 $ + (22 000 $ × 0,02) = 39 $ + 440 $ = **479 $/mois**
    - WooCommerce + Stripe : 20 $ + (22 000 $ × 0,029) = 20 $ + 638 $ = **658 $/mois**

    À ce volume, Shopify Basic avec Shopify Payments est en fait **moins cher** que
    WooCommerce + Stripe, car Shopify Payments (2,0 % + 25¢) coûte moins que le
    tarif standard de Stripe (2,9 % + 30¢).

    WooCommerce l'emporte sur :
    - **La flexibilité** : personnalisation illimitée, hébergement au choix, code entièrement à vous
    - **Les très petits volumes** : moins de 5 k$ par mois, là où l'abonnement pèse le plus
    - **L'absence de frais de transaction quel que soit le prestataire** (contrairement aux 2 % de Shopify pour les passerelles tierces)

    Utilisez le calculateur de frais Shopify ci-dessus pour modéliser votre forfait
    et votre volume.
"shopify-payments-vs-stripe":
  "title": "Shopify Payments ou Stripe : lequel est le moins cher, et quand ?"
  "description": "Comparaison détaillée des frais entre Shopify Payments et une intégration Stripe séparée, avec le calcul du GMV d'équilibre."
  "body": |
    Sur Shopify, vous avez deux grandes options pour encaisser par carte :
    **Shopify Payments** (intégré, supprime les frais de transaction) ou **Stripe
    via une passerelle tierce** (tarifs Stripe standards, plus 0,5 à 2 % de frais
    de transaction Shopify).

    ## Comparaison des frais : Shopify Payments ou Stripe sur Shopify

    | Forfait | Shopify Payments | Stripe + frais Shopify | Écart |
    |------|-----------------|---------------------|-----------|
    | Basic | 2,0 % + 25¢ | 2,9 % + 30¢ + 2,0 % = 4,9 % + 30¢ | +2,9 % |
    | Shopify | 1,7 % + 25¢ | 2,9 % + 30¢ + 1,0 % = 3,9 % + 30¢ | +2,2 % |
    | Advanced | 1,5 % + 25¢ | 2,9 % + 30¢ + 0,5 % = 3,4 % + 30¢ | +1,9 % |

    **Shopify Payments est presque toujours moins cher** pour les boutiques qui
    encaissent surtout des cartes Visa/Mastercard américaines. Les seuls frais de
    transaction Shopify (2 % sur Basic) pénalisent lourdement l'usage direct de
    Stripe.

    ## Quand Stripe hors Shopify a du sens

    - Vous quittez Shopify et voulez conserver vos données clients Stripe
    - Vous avez besoin de fonctions propres à Stripe (Radar, Connect, Issuing) absentes de Shopify Payments
    - Vous vendez dans un pays où Shopify Payments n'est pas disponible
    - Vous avez des revenus d'abonnement que Shopify Payments gère moins bien que Stripe Billing

    Pour la plupart des boutiques Shopify : **utilisez Shopify Payments**. La
    pénalité liée aux frais de transaction est trop lourde, sauf dans les cas
    ci-dessus.
"stripe-fee-on-10-dollars":
  "title": "Combien Stripe prend-il sur un paiement de 10 $ ?"
  "description": "Les frais Stripe exacts sur une transaction de 10 $, carte nationale et internationale."
  "body": |
    Sur un **paiement de 10 $** par carte américaine, Stripe prend **0,59 $** (taux effectif de 5,9 %) :
    - 2,9 % de 10 $ = 0,29 $
    - Part fixe = 0,30 $
    - **Total des frais = 0,59 $ | Vous recevez = 9,41 $**

    Avec une carte internationale (4,4 % + 0,30 $) : **0,74 $ de frais | 9,26 $ net**.

    ## Pourquoi les petits paiements ont un taux effectif élevé
    La part fixe de 0,30 $ pèse de façon disproportionnée sur les petites
    transactions. À 10 $, elle représente déjà 3 % avant même le pourcentage. C'est
    pourquoi Stripe propose un **tarif micropaiement (5 % + 0,05 $)**, réservé aux
    entreprises éligibles qui traitent surtout des transactions de moins de 10 $.
    À 10 $, ce tarif donne : 5 % × 10 $ + 0,05 $ = **0,55 $**, un peu moins que le
    tarif standard.

    ## Pour recevoir exactement 10 $ net
    Pour recevoir exactement 10 $ d'une carte nationale, il faut facturer **10,62 $**
    (la majoration : (10 $ + 0,30 $) / (1 − 0,029) = 10,617 $).

    Utilisez le calculateur ci-dessus en activant « facturer plus pour recevoir exactement ce montant ».
"stripe-fee-on-100-dollars":
  "title": "Combien Stripe prend-il sur un paiement de 100 $ ?"
  "description": "Les frais Stripe exacts sur une transaction de 100 $ : carte nationale (2,9 % + 0,30 $) et internationale (4,4 % + 0,30 $)."
  "body": |
    Sur un **paiement de 100 $** par carte américaine, Stripe prend **3,20 $** (taux effectif de 3,2 %) :
    - 2,9 % de 100 $ = 2,90 $
    - Part fixe = 0,30 $
    - **Total des frais = 3,20 $ | Vous recevez = 96,80 $**

    Avec une carte internationale (4,4 % + 0,30 $) : **4,70 $ de frais | 95,30 $ net**.

    ## Cas courants autour de 100 $

    | Type d'offre | Montant mensuel | Frais Stripe | Net par abonné |
    |-----------|---------------|-----------|-------------------|
    | SaaS mensuel | 99 $ | 3,17 $ | 95,83 $ |
    | SaaS mensuel | 100 $ | 3,20 $ | 96,80 $ |
    | E-commerce | 100 $ | 3,20 $ | 96,80 $ |

    ## Pour recevoir exactement 100 $ net
    Facturez **103,09 $** pour recevoir exactement 100 $ après les frais Stripe :
    (100 $ + 0,30 $) / (1 − 0,029) = 103,09 $.

    Utile si vous voulez fixer votre prix à « 100 $ pour moi » plutôt qu'à « 100 $ pour le client ».
"stripe-fee-on-1000-dollars":
  "title": "Combien Stripe prend-il sur un paiement de 1 000 $ ?"
  "description": "Les frais Stripe exacts sur une transaction de 1 000 $, et à partir de quand s'appliquent les remises sur volume."
  "body": |
    Sur un **paiement de 1 000 $** par carte américaine, Stripe prend **29,30 $** (taux effectif de 2,93 %) :
    - 2,9 % de 1 000 $ = 29,00 $
    - Part fixe = 0,30 $
    - **Total des frais = 29,30 $ | Vous recevez = 970,70 $**

    Avec une carte internationale : **44,30 $ de frais | 955,70 $ net**.

    ## À partir de quel volume obtient-on un tarif sur mesure ?

    Stripe négocie des tarifs sur mesure au-delà de **80 000 $ de volume mensuel**.
    Ils vont en général de 2,2 à 2,5 % + 0,10 à 0,20 $, selon le mix de transactions
    et le profil de risque. À 80 k$ par mois avec un tarif négocié de 2,4 % + 0,15 $,
    les frais sur 1 000 $ tombent à **24,15 $**, soit 5,15 $ d'économie par
    transaction par rapport au tarif standard.

    ## 1 000 $, le seuil de l'ACH

    Stripe accepte aussi les virements ACH à **0,8 % (plafonné à 5 $)**. Pour un
    virement de 1 000 $, l'ACH coûte **5,00 $**, soit 83 % de moins qu'une carte.
    Pour les factures B2B de plus de 500 $, proposer l'ACH à côté de la carte peut
    réduire fortement les frais. Attention : l'ACH met 2 à 5 jours ouvrés à être
    réglé, contre une autorisation carte immédiate.
"stripe-fee-per-10k-revenue":
  "title": "Combien Stripe prend-il sur 10 000 $ de chiffre d'affaires ?"
  "description": "Les frais Stripe exacts sur 10 000 $ de chiffre d'affaires, selon la taille des transactions et le type de carte."
  "body": |
    Les frais Stripe sur 10 000 $ de chiffre d'affaires dépendent entièrement de la
    façon dont ces 10 000 $ se répartissent entre les transactions, car la **part
    fixe de 0,30 $ par transaction** pèse bien plus sur les petits paiements que
    sur les gros.

    ## Détail des frais selon la taille des transactions

    Si vos 10 000 $ viennent d'une seule transaction :

    | Indicateur | Valeur |
    |--------|-------|
    | Chiffre d'affaires brut | 10 000 $ |
    | Frais Stripe (2,9 % + 0,30 $) | 290,30 $ |
    | Net versé | 9 709,70 $ |
    | Taux effectif | 2,903 % |

    Si vos 10 000 $ viennent de 100 transactions de 100 $ :

    | Indicateur | Valeur |
    |--------|-------|
    | Chiffre d'affaires brut | 10 000 $ |
    | Frais Stripe (2,9 % + 0,30 $ × 100) | 320,00 $ |
    | Net versé | 9 680,00 $ |
    | Taux effectif | 3,20 % |

    Si vos 10 000 $ viennent de 1 000 transactions de 10 $ :

    | Indicateur | Valeur |
    |--------|-------|
    | Chiffre d'affaires brut | 10 000 $ |
    | Frais Stripe (2,9 % + 0,30 $ × 1 000) | 590,00 $ |
    | Net versé | 9 410,00 $ |
    | Taux effectif | 5,90 % |

    ## À retenir : la part fixe de 0,30 $ est régressive

    Sur une transaction de 10 $, 0,30 $ représente à lui seul 3 % : le taux effectif
    de Stripe atteint donc 5,9 % avec le pourcentage. Sur une transaction de
    1 000 $, 0,30 $ ne pèse que 0,03 %.

    Si votre panier moyen est faible (moins de 20 $), envisagez :
    - De regrouper les achats (par exemple des recharges de crédits plutôt que des achats à l'unité)
    - D'utiliser Link, la fonction de Stripe qui peut réduire les frais de paiement
      à distance pour les clients récurrents
    - D'étudier Paddle ou Lemon Squeezy, dont les tarifs tout compris peuvent revenir
      moins cher pour les modèles de micro-transactions

    Utilisez le calculateur ci-dessus avec votre montant de transaction habituel pour
    voir les frais exacts et le net versé.
"stripe-fees-for-subscriptions":
  "title": "Les frais Stripe sur les abonnements récurrents"
  "description": "Comment fonctionnent les frais Stripe sur les abonnements mensuels et annuels, et comment calculer votre net par cycle de facturation."
  "body": |
    Quand vous gérez un modèle d'abonnement sur Stripe, vous payez les mêmes frais
    de **2,9 % + 0,30 $** sur chaque prélèvement récurrent réussi, comme pour un
    paiement ponctuel. Mais quelques subtilités propres aux abonnements méritent
    d'être comprises avant de fixer vos prix.

    ## Payez-vous des frais à chaque prélèvement ?

    Oui. Chaque renouvellement réussi déclenche des frais de transaction distincts.
    Si un client paie 99 $ par mois sur un forfait mensuel, Stripe prend 3,17 $ à
    chaque renouvellement (2,9 % × 99 $ + 0,30 $) et vous laisse 95,83 $. Sur
    12 mois, un seul abonné vous coûte 38,04 $ de frais pour 1 188 $ de chiffre
    d'affaires brut.

    Sur un forfait annuel à 990 $ (facturé une fois), Stripe prélève ses frais une
    seule fois : 29,01 $, et vous laisse 960,99 $. Le net est à peu près équivalent,
    mais avec une seule retenue de frais au lieu de douze.

    ## Facturation annuelle ou mensuelle : le calcul des frais

    Pour un forfait à 99 $/mois :

    | Facturation | Brut annuel | Frais annuels | Net annuel |
    |---------|-------------|------------|-----------|
    | Mensuelle | 1 188 $ | 38,04 $ | 1 149,96 $ |
    | Annuelle (990 $) | 990 $ | 29,01 $ | 960,99 $ |

    La facturation mensuelle génère 189 $ de chiffre d'affaires brut de plus par an
    et, même après les frais supplémentaires, rapporte 188,97 $ de plus par abonné.
    C'est pourquoi beaucoup de SaaS proposent une remise annuelle de 15 à 20 % :
    l'intérêt pour l'entreprise vient de la trésorerie, pas du net versé.

    ## Relances et paiements échoués

    Quand un renouvellement échoue (fonds insuffisants, carte expirée), Stripe peut
    retenter automatiquement le prélèvement selon un calendrier configurable. La
    tentative échouée n'est pas facturée, mais vous ne touchez pas le revenu. Des
    outils tiers comme Profitwell Retain améliorent de 40 à 60 % le taux de
    récupération des paiements échoués.

    ## Abonnés internationaux

    Les abonnés qui paient avec une carte émise hors des États-Unis entraînent des
    **frais transfrontaliers de 1,5 %** supplémentaires (soit 4,4 % + 0,30 $ au
    total). Si une part importante de vos abonnés est à l'étranger, modélisez votre
    taux de frais moyen en conséquence avec le calculateur ci-dessous.

    ## Et les remboursements ?

    Si vous remboursez un abonné, Stripe rend la part en pourcentage (2,9 %) mais
    pas les 0,30 $ fixes. Sur un remboursement complet de 99 $, vous perdez donc
    0,30 $ net.
"stripe-fees-france":
  "title": "Frais Stripe en France : tarifs en euros et exemples de versements"
  "description": "Les frais Stripe pour les entreprises françaises : 1,5 % + 0,25 € pour les cartes européennes, et les moyens de paiement propres à la France."
  "body": |
    Les entreprises françaises sur Stripe paient **1,5 % + 0,25 €** pour les cartes
    émises dans l'EEE et **2,5 % + 0,25 €** pour les cartes hors EEE (Royaume-Uni,
    États-Unis, international), comme dans les autres pays de l'UE. La France se
    distingue par la Carte Bancaire (CB), le réseau national utilisé par la plupart
    des consommateurs français, que Stripe prend en charge avec la même grille.

    ## Les spécificités françaises

    **Carte Bancaire (CB)** : Stripe accepte la CB dans le cadre de son acceptation
    des cartes européennes. Les frais sont les mêmes que pour Visa/Mastercard, car
    les cartes CB sont cobrandées. Aucun frais supplémentaire pour la CB.

    **Bancontact** (spécifique à la Belgique, peu utile en France) : sans objet.

    **3D Secure** : la France a l'un des taux d'utilisation du 3DS les plus élevés
    d'Europe. Stripe gère automatiquement la conformité 3DS, sans frais
    supplémentaires par transaction.

    ## Exemples de frais Stripe en France (EUR)

    | Montant | Carte EEE | Carte hors EEE |
    |--------|---------|-------------|
    | 50 € | 1,00 € (2,0 %) | 1,50 € (3,0 %) |
    | 150 € | 2,50 € (1,67 %) | 4,00 € (2,67 %) |
    | 1 000 € | 15,25 € (1,53 %) | 25,25 € (2,53 %) |

    Utilisez le calculateur ci-dessus avec 1,5 % et 0,25 € pour les transactions par carte EEE en France.
"stripe-fees-germany":
  "title": "Frais Stripe en Allemagne : tarifs en euros et net versé"
  "description": "Les frais Stripe pour les entreprises allemandes : 1,5 % + 0,25 € pour les cartes européennes, avec exemples et traitement de la TVA."
  "body": |
    Les entreprises allemandes sur Stripe paient **1,5 % + 0,25 €** pour les cartes
    européennes (Visa et Mastercard émises dans l'EEE). Pour les cartes émises hors
    EEE (États-Unis, Royaume-Uni, international), le taux passe à **2,5 % + 0,25 €**.
    Ce sont parmi les tarifs Stripe les plus bas au monde, grâce au plafonnement
    européen des commissions d'interchange (0,2 à 0,3 % pour les cartes de
    particuliers).

    ## Exemples de frais Stripe en Allemagne (EUR)

    | Montant | Carte EEE | Carte hors EEE |
    |--------|---------|-------------|
    | 25 € | 0,63 € (2,5 %) | 0,88 € (3,5 %) |
    | 100 € | 1,75 € (1,75 %) | 2,75 € (2,75 %) |
    | 500 € | 7,75 € (1,55 %) | 12,75 € (2,55 %) |

    ## TVA (Umsatzsteuer) sur les frais Stripe
    Stripe applique la TVA allemande (19 %) à ses frais pour les entreprises
    allemandes. Les entreprises assujetties (numéro de TVA intracommunautaire
    requis) peuvent la récupérer. Stripe émet chaque mois une facture de TVA en
    euros.

    ## Le prélèvement SEPA comme alternative
    Pour les clients allemands, le prélèvement SEPA est un moyen de paiement très
    répandu. Stripe le prend en charge pour seulement 0,8 % (plafonné à 5 €) par
    transaction, nettement moins cher pour les grosses factures B2B. Pour des
    abonnements récurrents avec de grands comptes allemands, activer SEPA vaut la
    peine.

    Utilisez le calculateur ci-dessus avec un taux personnalisé de 1,5 % et 0,25 € pour les transactions par carte EEE.
"stripe-vs-paypal-fees":
  "title": "Frais Stripe ou PayPal : la comparaison côte à côte"
  "description": "Les frais de Stripe et PayPal comparés précisément pour les transactions standards, les abonnements et les paiements internationaux en 2024."
  "body": |
    Stripe et PayPal sont les deux prestataires de paiement les plus courants pour
    les entreprises en ligne. Leurs tarifs standards se ressemblent en surface,
    mais les détails comptent quand on optimise ses marges.

    ## Frais de transaction standards (États-Unis, cartes nationales)

    | Prestataire | Taux | Part fixe | Frais sur 100 $ | Net sur 100 $ |
    |-----------|------|-----------|------------|------------|
    | Stripe | 2,9 % | 0,30 $ | 3,20 $ | **96,80 $** |
    | PayPal (PayPal Checkout) | 3,49 % | 0,49 $ | 3,98 $ | **96,02 $** |
    | PayPal (carte avancée) | 2,89 % | 0,49 $ | 3,38 $ | **96,62 $** |

    Sur une transaction type de 100 $, Stripe coûte **0,78 $ de moins** que PayPal
    Checkout standard. Sur 100 k$ de chiffre d'affaires, l'écart atteint 780 $.

    ## Pour les abonnements et la facturation récurrente

    | Prestataire | Taux abonnement | Remarques |
    |-----------|------------------|-------|
    | Stripe Billing | 2,9 % + 0,30 $ | Inclus ; relances avancées disponibles via Stripe Radar |
    | PayPal Subscriptions | 3,49 % + 0,49 $ | Taux par transaction plus élevé |

    Stripe est systématiquement moins cher pour les abonnements SaaS récurrents.

    ## Frais internationaux et transfrontaliers

    | Prestataire | Frais internationaux | Taux effectif total |
    |-----------|-----------------|---------------------|
    | Stripe | +1,5 % | 4,4 % + 0,30 $ |
    | PayPal | +1,5 % | ~5,0 % + 0,49 $ |

    ## Expérience développeur

    L'API et la documentation de Stripe sont largement considérées comme
    supérieures pour construire un tunnel de paiement sur mesure. Le principal
    atout de PayPal est sa notoriété et la familiarité des acheteurs avec « Payer
    avec PayPal », qui peut améliorer la conversion dans certains contextes B2C.

    **Recommandation :** pour le SaaS, les outils pour développeurs et les produits
    B2B, Stripe est le meilleur choix en frais, en qualité d'API et en écosystème
    (Stripe Atlas, Stripe Tax, Stripe Billing). Pour les places de marché ou les
    produits B2C où la familiarité de PayPal aide la conversion, le surcoût peut
    valoir la peine.

    Utilisez le calculateur de frais Stripe ci-dessus pour modéliser votre net
    exact. Pour PayPal, saisissez 3,49 % et 0,49 $ dans le champ de taux
    personnalisé.

