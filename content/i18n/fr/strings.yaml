? "Beginning Inventory + Purchases − Ending Inventory. The standard COGS formula from the income statement. Represents the cost of inventory actually sold in the period."
: "Stock initial + achats − stock final. La formule classique du coût des ventes au compte de résultat. Représente le coût des stocks réellement vendus sur la période."
