"stripe.com/pricing": "stripe.com/pricing"
"before relying on them for financial decisions.": "avant de vous appuyer dessus pour une décision financière."
? "Calculate Operating Cash Flow (OCF) from net income, depreciation, and working capital — plus free cash flow and cash conversion ratio."
: "Calculez le flux de trésorerie d'exploitation (OCF) à partir du résultat net, des amortissements et du fonds de roulement, ainsi que le flux de trésorerie disponible et le taux de conversion en trésorerie."
? "Calculate Days Sales Outstanding to measure how quickly you collect accounts receivable and how much cash is tied up in unpaid invoices."
: "Calculez le délai de paiement clients (DSO) pour mesurer la vitesse d'encaissement de vos créances et la trésorerie immobilisée dans les factures impayées."
? "Calculate early payment discount savings, net payment amount, and the annualized cost of passing on a {0}/{1} net {2} discount."
: "Calculez l'économie réalisée grâce à l'escompte, le montant net à payer et le coût annualisé de renoncer à un escompte {0}/{1} net {2}."
"Working Capital": "Fonds de roulement"
? "Calculate working capital, current ratio, and quick ratio from your balance sheet — the core liquidity metrics for measuring a business's short-term financial health."
: "Calculez le fonds de roulement, le ratio de liquidité générale et le ratio de liquidité réduite à partir de votre bilan : les indicateurs de base de la santé financière à court terme."
"Calculate current ratio, quick ratio, and cash ratio to measure your business's short-term liquidity.": "Calculez les ratios de liquidité générale, réduite et immédiate pour mesurer la liquidité à court terme de votre entreprise."
"Calculate debt-to-equity ratio, equity ratio, and financial leverage from your balance sheet figures.": "Calculez le ratio d'endettement, le ratio d'autonomie financière et le levier financier à partir de votre bilan."
"Calculate Debt Service Coverage Ratio and find the maximum loan your cash flow can support.": "Calculez le ratio de couverture du service de la dette (DSCR) et le prêt maximum que votre trésorerie peut supporter."
? "Calculate EBITDA from revenue, COGS, and operating expenses — plus EBITDA margin, EBIT after depreciation, and implied valuation at a given EBITDA multiple."
: "Calculez l'EBITDA à partir du chiffre d'affaires, du coût des ventes et des charges d'exploitation, ainsi que la marge d'EBITDA, l'EBIT après amortissements et la valorisation implicite pour un multiple donné."
? "Calculate six key financial ratios in one dashboard — profitability, liquidity, leverage, and efficiency from a single balance sheet and income statement."
: "Calculez six ratios financiers clés dans un seul tableau de bord : rentabilité, liquidité, endettement et efficacité, à partir d'un bilan et d'un compte de résultat."
"Calculate gross profit, gross margin %, and markup from revenue and COGS — with industry benchmark guidance.": "Calculez la marge brute en valeur et en %, et le taux de marque, à partir du chiffre d'affaires et du coût des ventes, avec des repères sectoriels."
"Calculate gross profit, operating income, and net profit with full margin breakdown from revenue through taxes.": "Calculez la marge brute, le résultat d'exploitation et le bénéfice net, avec le détail complet des marges du chiffre d'affaires jusqu'aux impôts."
? "Calculate your degree of operating leverage (DOL) — how much a percentage change in revenue amplifies your operating income."
: "Calculez votre degré de levier opérationnel (DOL) : de combien une variation du chiffre d'affaires amplifie votre résultat d'exploitation."
? "Calculate year-over-year revenue growth rate, multi-year CAGR, and Rule of {0} score for SaaS and business performance tracking."
: "Calculez la croissance annuelle du chiffre d'affaires, le TCAC sur plusieurs années et le score de la règle des {0} pour suivre la performance d'un SaaS ou d'une entreprise."
"Calculate Return on Assets (ROA) and decompose it into net margin and asset turnover using the DuPont framework.": "Calculez la rentabilité des actifs (ROA) et décomposez-la en marge nette et rotation des actifs avec la méthode DuPont."
"Calculate Return on Equity to measure how efficiently a company generates profit from shareholders' capital investment.": "Calculez la rentabilité des capitaux propres pour mesurer l'efficacité avec laquelle une entreprise génère du bénéfice à partir du capital investi par ses actionnaires."
"Calculate the Times Interest Earned (TIE) ratio to measure how comfortably your EBIT covers annual interest payments.": "Calculez le ratio de couverture des intérêts (TIE) pour mesurer la marge avec laquelle votre EBIT couvre les intérêts annuels."
"Calculate a client-ready project quote from your hourly rate, time estimate, and contingency buffer.": "Calculez un devis de projet prêt à envoyer à partir de votre taux horaire, de l'estimation du temps et d'une marge de sécurité."
"Convert annual salary to hourly, daily and weekly rates — including after-tax take-home for common US tax brackets.": "Convertissez un salaire annuel en taux horaire, journalier et hebdomadaire, y compris le net après impôts pour les tranches d'imposition américaines courantes."
"Calculate annual employee turnover rate, retention rate, and total cost of turnover including replacement costs.": "Calculez le taux de rotation annuel du personnel, le taux de rétention et le coût total du turnover, remplacement compris."
? "Calculate the true employer cost of hiring: salary plus payroll taxes (FICA, FUTA, SUTA) and benefits — so you know the real budget impact of each hire."
: "Calculez le vrai coût employeur d'une embauche : salaire plus charges sociales américaines (FICA, FUTA, SUTA) et avantages, pour connaître l'impact réel de chaque recrutement sur le budget."
? "Estimate the true cost of employee turnover — separation, vacancy, recruitment, and onboarding — as a total and as a percentage of payroll."
: "Estimez le vrai coût du turnover (départ, vacance du poste, recrutement et intégration) en total et en pourcentage de la masse salariale."
? "Calculate net present value from an initial investment and up to {0} years of cash flows — includes profitability index and simple payback period."
: "Calculez la valeur actuelle nette à partir d'un investissement initial et de {0} ans de flux de trésorerie maximum, avec l'indice de profitabilité et le délai de récupération simple."
? "Calculate payback period in years and months — simple and discounted — to determine how long until an investment breaks even and starts generating net returns."
: "Calculez le délai de récupération en années et en mois, simple et actualisé, pour savoir quand un investissement atteint l'équilibre et commence à rapporter."
? "Calculate return on investment (ROI), annualized ROI, net profit, and break-even period for any business investment, marketing campaign, or capital allocation decision."
: "Calculez le retour sur investissement (ROI), le ROI annualisé, le bénéfice net et le délai d'équilibre de n'importe quel investissement, campagne marketing ou décision d'allocation de capital."
? "Use the Rule of {0} to estimate how long it takes to double your money at a given annual return rate — and find the rate needed to double by a target date."
: "Utilisez la règle des {0} pour estimer le temps nécessaire pour doubler votre argent à un rendement annuel donné, et le taux nécessaire pour doubler à une date cible."
? "Calculate Weighted Average Cost of Capital — the blended rate a company must earn on its assets to satisfy all capital providers, equity and debt."
: "Calculez le coût moyen pondéré du capital (CMPC) : le taux qu'une entreprise doit dégager sur ses actifs pour satisfaire tous ses financeurs, actionnaires et prêteurs."
? "Calculate the revenue, ROI, and cost per conversion for any email campaign — from list size through opens, clicks, and conversions."
: "Calculez le chiffre d'affaires, le ROI et le coût par conversion de n'importe quelle campagne e-mail, de la taille de la liste jusqu'aux ouvertures, clics et conversions."
? "Calculate your email list growth rate, monthly decay, and how many new subscribers you need to reach your target list size."
: "Calculez le taux de croissance de votre liste e-mail, son érosion mensuelle et le nombre de nouveaux abonnés nécessaires pour atteindre votre objectif."
? "Calculate revenue per lead (RPL) by channel — compare marketing channel profitability, cost per lead vs revenue generated, and leads needed to hit revenue targets."
: "Calculez le revenu par lead (RPL) par canal : comparez la rentabilité des canaux marketing, le coût par lead face au revenu généré, et les leads nécessaires pour atteindre vos objectifs."
? "Calculate Return on Ad Spend (ROAS), breakeven ROAS from your gross margin, and target ROAS for any profit goal — for Google Ads, Meta, or any paid channel."
: "Calculez le retour sur dépenses publicitaires (ROAS), le ROAS d'équilibre selon votre marge brute et le ROAS cible pour n'importe quel objectif de profit, sur Google Ads, Meta ou tout canal payant."
"Model your full sales funnel — from leads to closed revenue — and find your weakest conversion stage.": "Modélisez votre tunnel de vente complet, des leads au chiffre d'affaires signé, et trouvez l'étape de conversion la plus faible."
"Calculate how many deals, leads, and pipeline you need to hit your annual revenue target based on ACV and close rate.": "Calculez le nombre d'affaires, de leads et le pipeline nécessaires pour atteindre votre objectif annuel de chiffre d'affaires selon l'ACV et le taux de closing."
"Sales Velocity": "Vélocité commerciale"
? "Calculate sales velocity — the revenue your pipeline generates per day — from opportunities, win rate, ACV, and sales cycle length."
: "Calculez la vélocité commerciale, c'est-à-dire le chiffre d'affaires généré par votre pipeline chaque jour, à partir des opportunités, du taux de réussite, de l'ACV et de la durée du cycle de vente."
"Calculate Shopify processing fees and transaction fees for any plan — with and without Shopify Payments.": "Calculez les frais de traitement et de transaction Shopify pour chaque formule, avec et sans Shopify Payments."
"Calculate exactly how much Stripe takes and what you actually receive, for any charge amount and card type.": "Calculez exactement ce que Stripe prélève et ce que vous touchez réellement, pour n'importe quel montant et type de carte."
? "Calculate the exact revenue needed to cover your fixed costs given your contribution margin — plus safety margin when you enter current revenue."
: "Calculez le chiffre d'affaires exact nécessaire pour couvrir vos coûts fixes selon votre marge sur coûts variables, et votre marge de sécurité si vous saisissez votre CA actuel."
"Calculate unit contribution margin, CM ratio, and the exact number of units needed to break even or hit a profit target.": "Calculez la marge sur coût variable unitaire, le taux de marge sur coûts variables et le nombre exact d'unités pour atteindre l'équilibre ou un objectif de profit."
? "Calculate sale price, discount amount, or reverse-calculate the discount percentage from any original price — plus margin impact after discount."
: "Calculez le prix soldé, le montant de la remise ou, à l'inverse, le pourcentage de remise à partir d'un prix d'origine, avec l'impact sur la marge après remise."
? "Calculate gross margin %, gross profit, and markup from revenue and COGS — plus the revenue needed to hit any target margin."
: "Calculez la marge brute en %, la marge brute en valeur et le taux de marque à partir du chiffre d'affaires et du coût des ventes, ainsi que le CA nécessaire pour atteindre une marge cible."
? "Calculate inventory turnover ratio (COGS ÷ average inventory), days sales of inventory (DSI), and sell-through rate — the core metrics for inventory health."
: "Calculez le taux de rotation des stocks (coût des ventes ÷ stock moyen), la durée de stockage en jours (DSI) et le taux d'écoulement : les indicateurs de base de la santé des stocks."
"Calculate markup percentage, gross margin, and gross profit from cost and selling price — and understand the difference.": "Calculez le taux de marque, la marge brute et le bénéfice brut à partir du coût et du prix de vente, et comprenez la différence."
? "Calculate how a price change affects demand and revenue based on price elasticity — see whether raising your price will increase or decrease total revenue."
: "Calculez l'effet d'un changement de prix sur la demande et le chiffre d'affaires selon l'élasticité-prix : voyez si une hausse de prix augmentera ou réduira votre CA total."
? "See how a price increase affects your MRR and calculate the minimum retention rate needed to break even on a pricing change."
: "Voyez comment une hausse de prix affecte votre MRR et calculez le taux de rétention minimum pour qu'un changement de tarif reste à l'équilibre."
"Calculate and compare price per unit for different package sizes or supplier quotes to find the best value option.": "Calculez et comparez le prix unitaire de différents conditionnements ou devis fournisseurs pour trouver l'option la plus avantageuse."
"Calculate gross profit, gross margin %, net profit and net margin % from revenue and cost inputs.": "Calculez la marge brute en valeur et en %, le bénéfice net et la marge nette en % à partir du chiffre d'affaires et des coûts."
"Compare gross margin and gross profit across up to {0} product lines or business segments side by side.": "Comparez la marge brute en valeur et en % de {0} gammes de produits ou segments d'activité maximum, côte à côte."
? "Compare {0}–{1} SaaS pricing tiers and find which tier maximizes revenue at different conversion rates — before you commit to a pricing page."
: "Comparez {0} à {1} offres tarifaires SaaS et trouvez celle qui maximise le chiffre d'affaires selon différents taux de conversion, avant de figer votre page de prix."
"Weighted Average": "Moyenne pondérée"
? "Calculate weighted averages for grades, prices, rates, or any metrics — see each component's contribution to the overall result instantly."
: "Calculez des moyennes pondérées pour des notes, des prix, des taux ou n'importe quel indicateur, et voyez instantanément la contribution de chaque élément au résultat."
"Instantly convert between Monthly Recurring Revenue and Annual Recurring Revenue, plus daily and weekly breakdowns.": "Convertissez instantanément le revenu récurrent mensuel en revenu récurrent annuel, et inversement, avec le détail par jour et par semaine."
? "Break down monthly cash burn by department — engineering, sales, marketing, G&A — and see which teams are consuming the most runway."
: "Répartissez votre burn mensuel par service (tech, ventes, marketing, frais généraux) et voyez quelles équipes consomment le plus d'autonomie."
? "Calculate your burn multiple — net cash burn divided by net new ARR — the capital efficiency metric VCs use to evaluate how efficiently you're converting spending into growth."
: "Calculez votre burn multiple, c'est-à-dire le cash brûlé net divisé par le nouvel ARR net : l'indicateur d'efficacité du capital utilisé par les VC pour juger comment vos dépenses se transforment en croissance."
? "Calculate your SaaS Magic Number — net new ARR divided by prior quarter S&M spend — to measure how efficiently your go-to-market converts sales investment into revenue."
: "Calculez votre Magic Number SaaS, c'est-à-dire le nouvel ARR net divisé par les dépenses ventes et marketing du trimestre précédent, pour mesurer l'efficacité de votre go-to-market."
"Calculate monthly recurring revenue, annual recurring revenue and MRR growth rate from your subscriber plan mix.": "Calculez le revenu récurrent mensuel, le revenu récurrent annuel et la croissance du MRR à partir de la répartition de vos abonnés par formule."
"Quick Ratio": "Quick Ratio"
? "Calculate your SaaS Quick Ratio — growth MRR divided by lost MRR — to measure whether your business is growing efficiently or just replacing churn."
: "Calculez votre Quick Ratio SaaS, c'est-à-dire le MRR gagné divisé par le MRR perdu, pour savoir si vous croissez efficacement ou si vous ne faites que compenser le churn."
"Calculate MoM, QoQ, and YoY revenue growth rates, CAGR, and time-to-double to benchmark your startup's trajectory.": "Calculez la croissance du chiffre d'affaires sur un mois, un trimestre et un an, le TCAC et le temps de doublement pour situer la trajectoire de votre startup."
? "Benchmark your ARR per FTE against SaaS industry quartiles — and calculate the revenue or headcount needed to hit a target efficiency ratio."
: "Comparez votre ARR par ETP aux quartiles du secteur SaaS et calculez le chiffre d'affaires ou l'effectif nécessaire pour atteindre un ratio d'efficacité cible."
? "Calculate your SaaS Rule of {0} score — the sum of revenue growth rate and profit margin that investors use to benchmark health."
: "Calculez votre score de la règle des {0} en SaaS : la somme du taux de croissance et de la marge bénéficiaire, que les investisseurs utilisent pour juger la santé d'une entreprise."
? "Calculate annual revenue run rate from any period's revenue — project ARR from Q{0} earnings, monthly revenue, or partial-year figures with optional growth rate compounding."
: "Calculez le run rate annuel à partir du chiffre d'affaires de n'importe quelle période : projetez l'ARR depuis les résultats du T{0}, le CA mensuel ou des chiffres partiels, avec un taux de croissance composé en option."
"Calculate how many months of runway you have left, your burn rate, and when you need to raise or break even.": "Calculez le nombre de mois d'autonomie qu'il vous reste, votre burn rate et le moment où vous devrez lever des fonds ou atteindre l'équilibre."
? "The complete SaaS unit economics dashboard: CAC payback, LTV:CAC ratio, gross margin, and magic number in one place, for a full efficiency review."
: "Le tableau de bord complet de l'économie unitaire SaaS : retour sur CAC, ratio LTV:CAC, marge brute et Magic Number au même endroit, pour une revue complète de l'efficacité."
? "Calculate how many months it takes to recover your customer acquisition cost. One of the key unit economics metrics VCs check before investing."
: "Calculez le nombre de mois nécessaires pour récupérer votre coût d'acquisition client. L'un des indicateurs d'économie unitaire que les VC vérifient avant d'investir."
"See exactly how monthly churn erodes your MRR over {0} months and what reducing churn by {1} is worth.": "Voyez exactement comment le churn mensuel érode votre MRR sur {0} mois, et ce que vaut une réduction du churn de {1}."
"Analyze cohort retention, calculate LTV from churn rate, and project how many customers remain after any number of months.": "Analysez la rétention par cohorte, calculez la LTV à partir du taux de churn et projetez le nombre de clients restants après n'importe quel nombre de mois."
? "Calculate customer concentration risk — % revenue from top customers, Herfindahl-Hirschman Index (HHI), and single-customer exposure — a key due diligence metric."
: "Calculez le risque de concentration client (% du chiffre d'affaires des principaux clients, indice de Herfindahl-Hirschman (HHI) et exposition à un seul client) : un indicateur clé de due diligence."
? "Calculate Gross Revenue Retention (GRR) from starting MRR, churn, and contraction — excluding expansion to isolate pure retention."
: "Calculez la rétention brute du revenu (GRR) à partir du MRR de départ, du churn et de la contraction, hors expansion, pour isoler la rétention pure."
"Health Score": "Score de santé"
"Score your SaaS customers by usage, engagement, and NPS to predict churn risk and identify expansion opportunities.": "Notez vos clients SaaS selon l'usage, l'engagement et le NPS pour prédire le risque de churn et repérer les opportunités d'expansion."
? "The fastest way to get your LTV:CAC ratio — enter ARPU, margin, churn, and spend once and get both LTV and CAC together, without filling in two separate calculators."
: "Le moyen le plus rapide d'obtenir votre ratio LTV:CAC : saisissez une seule fois ARPU, marge, churn et dépenses, et obtenez LTV et CAC ensemble, sans remplir deux calculateurs."
? "Calculate Customer Lifetime Value (LTV), LTV:CAC ratio, and CAC payback period from your ARPU, gross margin, and monthly churn rate."
: "Calculez la valeur vie client (LTV), le ratio LTV:CAC et le délai de retour sur CAC à partir de votre ARPU, de votre marge brute et de votre taux de churn mensuel."
"NPS Score": "Score NPS"
"Calculate your Net Promoter Score from promoter, passive, and detractor counts — with benchmark context.": "Calculez votre Net Promoter Score à partir du nombre de promoteurs, de passifs et de détracteurs, avec des repères de comparaison."
? "Calculate Net Revenue Retention and Gross Revenue Retention from starting MRR, expansion, contraction, and churn — the core SaaS retention health metric."
: "Calculez la rétention nette et la rétention brute du revenu à partir du MRR de départ, de l'expansion, de la contraction et du churn : l'indicateur de base de la santé de la rétention en SaaS."
"Calculate customer retention rate, churn rate, and implied LTV from your period start, end, and new customer counts.": "Calculez le taux de rétention client, le taux de churn et la LTV implicite à partir du nombre de clients en début et fin de période et des nouveaux clients."
"Add or remove VAT / sales tax at any rate. Switch between countries or enter a custom rate.": "Ajoutez ou retirez la TVA ou la taxe de vente à n'importe quel taux. Choisissez un pays ou saisissez un taux personnalisé."
? "Calculate Enterprise Value (EV) and key acquisition multiples — EV/EBITDA and EV/Revenue — from market cap, debt, and cash."
: "Calculez la valeur d'entreprise (VE) et les principaux multiples d'acquisition (VE/EBITDA et VE/chiffre d'affaires) à partir de la capitalisation, de la dette et de la trésorerie."
? "Model how a funding round dilutes founder and investor ownership — calculate post-money valuation, new shares issued, and your diluted ownership percentage."
: "Modélisez la dilution des fondateurs et des investisseurs lors d'une levée : valorisation post-money, nouvelles actions émises et votre pourcentage de détention après dilution."
"Calculate trailing and forward P/E ratios, earnings yield, and PEG ratio to assess stock valuation relative to earnings.": "Calculez le PER historique et prévisionnel, le rendement bénéficiaire et le ratio PEG pour juger la valorisation d'une action par rapport à ses bénéfices."
"P/S Ratio": "Ratio P/S"
"Calculate P/S ratio, implied valuation at any multiple, and growth-adjusted P/S for startup and SaaS company comparisons.": "Calculez le ratio cours / chiffre d'affaires, la valorisation implicite pour n'importe quel multiple et le P/S ajusté de la croissance, pour comparer des startups et des SaaS."
? "Calculate Total Addressable Market (TAM), Serviceable Addressable Market (SAM), and Serviceable Obtainable Market (SOM) for investor presentations and market sizing."
: "Calculez le marché total adressable (TAM), le marché adressable accessible (SAM) et le marché réellement atteignable (SOM) pour vos présentations aux investisseurs et vos études de marché."
