: "DIO + DSO − DPO. Le nombre de jours entre le paiement des stocks et l'encaissement des clients. Négatif = vous encaissez avant de payer vos fournisseurs (comme Amazon)."
"Cash Conversion Cycle (CCC)": "Cycle de conversion de trésorerie (CCC)"
? "(Avg Inventory ÷ COGS) × {0}. How many days of inventory you hold on average. Lower is better — excess inventory ties up working capital."
: "(stock moyen ÷ coût des ventes) × {0}. Le nombre de jours de stock détenus en moyenne. Plus c'est bas, mieux c'est : un excès de stock immobilise du fonds de roulement."
"Days Inventory Outstanding (DIO)": "Durée de stockage (DIO)"
? "(Avg Accounts Receivable ÷ Revenue) × {0}. Average days to collect payment after a sale. Benchmark: {1}–{2} days for B{3}; SaaS with upfront billing: ~{4}."
: "(créances clients moyennes ÷ chiffre d'affaires) × {0}. Le délai moyen d'encaissement après une vente. Repère : {1}–{2} jours en B{3} ; SaaS facturé d'avance : ~{4}."
"Days Sales Outstanding (DSO)": "Délai de paiement clients (DSO)"
? "(Avg Accounts Payable ÷ COGS) × {0}. Average days before you pay suppliers. Higher DPO improves CCC — but don't exceed supplier terms."
: "(dettes fournisseurs moyennes ÷ coût des ventes) × {0}. Le délai moyen avant de payer vos fournisseurs. Un DPO plus élevé améliore le CCC, sans dépasser les conditions fournisseurs."
"Days Payable Outstanding (DPO)": "Délai de paiement fournisseurs (DPO)"
