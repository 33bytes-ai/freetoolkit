? "Compare Stripe, PayPal, and Shopify Payments fees side by side — enter any sale amount and see the exact net payout for each processor instantly."
: "Comparez les frais de Stripe, PayPal et Shopify Payments côte à côte : saisissez un montant de vente et voyez instantanément le montant net versé par chaque prestataire."
"Calculate exactly how much PayPal takes per transaction and what you actually receive, for any payment type.": "Calculez exactement ce que PayPal prélève par transaction et ce que vous touchez réellement, quel que soit le type de paiement."
? "Calculate Average Revenue Per User (ARPU) from MRR and active users — the core SaaS pricing metric for benchmarking, forecasting, and identifying pricing opportunities."
: "Calculez le revenu moyen par utilisateur (ARPU) à partir du MRR et des utilisateurs actifs : l'indicateur de tarification SaaS de référence pour se comparer, prévoir et repérer des opportunités de prix."
? "Convert MRR to Annual Recurring Revenue, calculate YoY growth against last year's ARR, and project ARR {0} and {1} months out at a given monthly growth rate."
: "Convertissez le MRR en revenu récurrent annuel, calculez la croissance sur un an par rapport à l'ARR de l'an dernier et projetez l'ARR à {0} et {1} mois selon un taux de croissance mensuel."
? "Break down Customer Acquisition Cost by marketing channel to find which channels are most efficient and where to shift budget."
: "Décomposez le coût d'acquisition client par canal marketing pour voir les canaux les plus efficaces et où réallouer le budget."
? "Calculate blended Customer Acquisition Cost from ad spend, sales payroll, and tools — plus CAC payback period, and your LTV:CAC ratio if you already know your LTV."
: "Calculez le coût d'acquisition client global à partir des dépenses publicitaires, des salaires commerciaux et des outils, ainsi que le délai de retour sur CAC et votre ratio LTV:CAC si vous connaissez déjà votre LTV."
? "Calculate the minimum hourly rate you need to charge to hit your income target, accounting for taxes, expenses and non-billable time."
: "Calculez le taux horaire minimum à facturer pour atteindre votre objectif de revenu, en tenant compte des impôts, des frais et du temps non facturable."
"Build and total an invoice with multiple line items, discount, and tax — then copy the full breakdown with one click.": "Composez une facture avec plusieurs lignes, remise et taxe, puis copiez le détail complet en un clic."
"Calculate percentage change, absolute change, and CAGR between any two values.": "Calculez la variation en pourcentage, la variation absolue et le TCAC entre deux valeurs."
"Find how many units or customers you need to cover fixed costs, and calculate your break-even revenue.": "Trouvez combien d'unités ou de clients il vous faut pour couvrir vos coûts fixes, et calculez votre CA de seuil de rentabilité."
"Calculate average order value (AOV), revenue per visitor, and the revenue impact of raising your AOV.": "Calculez le panier moyen, le revenu par visiteur et l'impact d'une hausse du panier moyen sur le chiffre d'affaires."
? "Calculate your website conversion rate and model the exact revenue impact of improving it — for any funnel stage, from visitor to paid customer."
: "Calculez le taux de conversion de votre site et mesurez l'impact exact d'une amélioration sur le chiffre d'affaires, à chaque étape du tunnel, du visiteur au client payant."
? "Calculate monthly payment, total interest, and total cost of a business loan — model SBA loans, term loans, and lines of credit with standard amortization."
: "Calculez la mensualité, le total des intérêts et le coût total d'un prêt professionnel : prêts SBA, prêts à terme et lignes de crédit, avec amortissement classique."
"Calculate Cost of Goods Sold (COGS) from inventory and purchases, then compute gross profit and gross margin.": "Calculez le coût des ventes (COGS) à partir des stocks et des achats, puis la marge brute en valeur et en pourcentage."
? "Calculate budget variance in dollars and percentage, and determine whether the variance is favorable or unfavorable for revenue or expense lines."
: "Calculez l'écart budgétaire en valeur et en pourcentage, et déterminez s'il est favorable ou défavorable pour une ligne de revenus ou de charges."
? "Calculate Days Inventory Outstanding, Days Sales Outstanding, and Days Payable Outstanding — and combine them into the Cash Conversion Cycle to measure working capital efficiency."
: "Calculez la rotation des stocks en jours, le délai de paiement clients et le délai de paiement fournisseurs, puis combinez-les en cycle de conversion de trésorerie pour mesurer l'efficacité du fonds de roulement."
? "Calculate the Internal Rate of Return (IRR) for any series of cash flows — evaluates the profitability of investments, projects, and business decisions."
: "Calculez le taux de rentabilité interne (TRI) de n'importe quelle série de flux de trésorerie, pour juger la rentabilité d'un investissement, d'un projet ou d'une décision."
? "Calculate Modified Internal Rate of Return — a more accurate investment return metric that corrects IRR's reinvestment rate assumption."
: "Calculez le taux de rentabilité interne modifié : une mesure de rendement plus juste qui corrige l'hypothèse de réinvestissement du TRI."
? "Calculate the present value of future cash flows using your discount rate — get intrinsic value, NPV, and terminal value in seconds."
: "Calculez la valeur actuelle de flux de trésorerie futurs avec votre taux d'actualisation : valeur intrinsèque, VAN et valeur terminale en quelques secondes."
"Estimate enterprise value and equity value using EV/EBITDA and EV/Revenue multiples.": "Estimez la valeur d'entreprise et la valeur des fonds propres avec les multiples VE/EBITDA et VE/chiffre d'affaires."
? "Estimate your annual self-employment tax, federal income tax, and quarterly estimated payments as a freelancer or independent contractor."
: "Estimez vos cotisations de travailleur indépendant, votre impôt fédéral sur le revenu et vos acomptes trimestriels en tant que freelance ou prestataire (règles américaines)."
? "Estimate employer payroll taxes — FICA (Social Security + Medicare), FUTA, and total employment cost — for any employee salary in the US."
: "Estimez les charges patronales américaines (FICA, soit Social Security + Medicare, et FUTA) et le coût total employeur pour n'importe quel salaire."
"Calculate sales commission earned, total compensation, and OTE attainment from revenue and commission rate.": "Calculez la commission gagnée, la rémunération totale et l'atteinte de l'OTE à partir du chiffre d'affaires et du taux de commission."
? "Calculate the true total cost of an employee — salary plus payroll taxes, benefits, and bonus — and see the cost multiplier over base pay."
: "Calculez le vrai coût total d'un salarié (salaire, charges, avantages et bonus) et le multiplicateur de coût par rapport au salaire de base."
