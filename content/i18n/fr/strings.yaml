: "Calculez les offres tarifaires SaaS optimales selon vos coûts, votre marge cible et la disposition à payer, avec l'analyse des formules mensuelles et annuelles."
"Calculate your Annual Recurring Revenue growth rate, T{0}D{1} trajectory, and years to reach your ARR target.": "Calculez le taux de croissance de votre revenu récurrent annuel, votre trajectoire T{0}D{1} et le nombre d'années pour atteindre votre objectif d'ARR."
"Magic Number": "Magic Number"
"Forecast monthly and annual revenue lost to churn — and the MRR needed to break even.": "Prévoyez le chiffre d'affaires mensuel et annuel perdu à cause du churn, et le MRR nécessaire pour atteindre l'équilibre."
"Retention Rate": "Taux de rétention"
"{0}{1}{2} — {3} tool added": "{0}{1}{2} — {3} outil ajouté"
