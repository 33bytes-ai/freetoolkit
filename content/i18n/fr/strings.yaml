"Revenue × Commission Rate. Gross commission earned before any clawbacks, splits, or draw deductions.": "Chiffre d'affaires × taux de commission. La commission brute gagnée avant reprises, partages ou déductions d'avances."
"Commission Earned": "Commission gagnée"
"Base salary + Commission. Total cash compensation for the period. Compare to OTE to measure quota performance.": "Salaire de base + commission. La rémunération totale en numéraire sur la période. À comparer à l'OTE pour mesurer l'atteinte du quota."
"Total Compensation": "Rémunération totale"
