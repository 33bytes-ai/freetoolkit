? "Current Assets ÷ Current Liabilities. Measures ability to cover short-term obligations. Healthy range: {0}–{1}×. Below {2} = liabilities exceed liquid assets."
: "Actif circulant ÷ passif circulant. Mesure la capacité à couvrir les engagements à court terme. Zone saine : {0}–{1}×. En dessous de {2}, les dettes dépassent les actifs liquides."
