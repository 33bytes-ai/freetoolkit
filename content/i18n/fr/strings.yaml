? "Price − Variable Cost per unit. The revenue remaining per unit after variable costs. This is what pays for fixed costs and profit."
: "Prix − coût variable unitaire. Le revenu restant par unité après les coûts variables. C'est ce qui paie les coûts fixes et le bénéfice."
