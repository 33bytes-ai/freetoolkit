? "(End − New) ÷ Start × {0}. The % of starting customers still active at period end. B{1} SaaS benchmark: {2}–{3} monthly; {4}–{5} annual."
: "(fin − nouveaux) ÷ début × {0}. La part des clients de départ encore actifs en fin de période. Repère SaaS B{1} : {2}–{3} par mois ; {4}–{5} par an."
"{0} − Retention Rate. The % of starting customers lost in the period. Monthly churn of {1} compounds to ~{2} annual churn.": "{0} − taux de rétention. La part des clients de départ perdus sur la période. Un churn mensuel de {1} se cumule en ~{2} de churn annuel."
