? "(Fixed Costs + Target Profit) ÷ Unit Contribution Margin. Units needed to cover fixed costs AND hit your desired profit figure."
: "(coûts fixes + bénéfice cible) ÷ marge sur coût variable unitaire. Les unités nécessaires pour couvrir les coûts fixes ET atteindre le bénéfice visé."
"Units for Target Profit": "Unités pour le bénéfice cible"
"Conversions this month": "Conversions ce mois-ci"
"Revenue per conversion (": "Revenu par conversion ("
