? "Current Assets − Current Liabilities. Dollar amount of short-term liquidity buffer. Positive = solvent; negative = technical short-term insolvency."
: "Actif circulant − passif circulant. Le coussin de liquidité à court terme, en valeur. Positif = solvable ; négatif = insolvabilité technique à court terme."
