? "COGS ÷ Average Inventory. How many times you sell through your average inventory in the period. Higher = more efficient inventory management."
: "Coût des ventes ÷ stock moyen. Combien de fois vous écoulez votre stock moyen sur la période. Plus c'est haut, plus la gestion des stocks est efficace."
