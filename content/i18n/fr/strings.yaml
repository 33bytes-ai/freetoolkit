"Current CR": "Taux de conversion actuel"
"Conversions × revenue per conversion. Monthly revenue generated by your current conversion rate.": "Conversions × revenu par conversion. Le chiffre d'affaires mensuel généré par votre taux de conversion actuel."
"Monthly Revenue": "Chiffre d'affaires mensuel"
