? "Score each dimension {0}–{1} based on your customer's behaviour. Weights: Usage {2}, Engagement {3}, NPS {4}, Support {5}, Growth {6}."
: "Notez chaque dimension de {0} à {1} selon le comportement du client. Pondérations : usage {2}, engagement {3}, NPS {4}, support {5}, croissance {6}."
