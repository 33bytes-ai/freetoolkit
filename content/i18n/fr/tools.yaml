# slug -> {body}: French version of the tool body in content/tools.yaml.
# Same markdown structure (headings, tables, FAQ bold questions) as English.

free-cash-flow-calculator:
  body: |
    Le flux de trésorerie disponible (FCF) est la trésorerie qu'une entreprise
    génère une fois ses dépenses d'investissement payées. C'est la mesure la plus
    fidèle de sa capacité à produire du cash : plus fiable que le résultat (que
    les choix comptables peuvent déformer) et plus utile que la seule croissance
    du chiffre d'affaires.

    ## La formule

    **FCF = flux de trésorerie d'exploitation − dépenses d'investissement**

    Une entreprise avec 500 k$ de flux d'exploitation et 80 k$ de capex génère
    **420 k$ de FCF**.

    ## Pourquoi le FCF compte plus que l'EBITDA

    L'EBITDA réintègre les charges non décaissées pour comparer des résultats
    entre structures de capital différentes. Le FCF va plus loin : il tient compte
    du réinvestissement nécessaire pour faire tourner l'entreprise. Une société qui
    investit lourdement en équipement peut afficher un bel EBITDA et un FCF
    négatif : elle ne conserve pas de trésorerie.

    Pour un SaaS, l'écart entre EBITDA et FCF est en général faible (peu de capex).
    Dans le matériel, l'industrie ou les infrastructures, le capex peut absorber
    30 à 50 % du flux d'exploitation, et le FCF s'éloigne alors nettement de
    l'EBITDA.

    ## Repères de marge de FCF

    | Type d'entreprise | Marge de FCF |
    |---|---|
    | SaaS de premier plan (Shopify, Veeva) | 20–30 % |
    | SaaS rentable typique | 10–20 % |
    | SaaS en amorçage / en croissance | 0–10 % |
    | Activités à fort capex | -10 à +5 % |

    ## Le rendement FCF pour valoriser

    Rendement FCF = FCF / capitalisation boursière × 100

    Un rendement FCF de 5 % signifie que vous payez 20 fois le FCF. Un rendement
    de 2 % signifie 50 fois le FCF. En règle générale, un rendement supérieur à
    4–5 % est jugé bon marché, inférieur à 1,5 % cher. Tenez compte de la
    croissance attendue : une entreprise en forte croissance justifie un rendement
    plus bas.

    ## FCF et flux de trésorerie disponible pour l'actionnaire (FCFE)

    Le FCF mesure la trésorerie générée au niveau de l'entreprise, avant service
    de la dette. Le FCFE retranche les flux de dette :
    FCFE = FCF − (remboursements − nouvelles dettes). Pour un investisseur en
    capital qui valorise une entreprise endettée, le FCFE est plus pertinent.

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule le flux de trésorerie disponible à partir du flux d'exploitation
    et du capex, ainsi que la marge de FCF et, en option, le rendement FCF pour
    situer la valorisation.

"budget-variance-calculator":
  "body": |
    ## Formule de l'écart budgétaire

    $$\text{Écart} = \text{Réalisé} - \text{Budget}$$

    $$\text{Écart \%} = \frac{\text{Réalisé} - \text{Budget}}{|\text{Budget}|} \times 100$$

    ### Favorable ou défavorable

    Le sens qui rend un écart « favorable » dépend du type de ligne :

    | Type de ligne | Condition favorable |
    |-----------|---------------------|
    | Chiffre d'affaires | Réalisé > budget (plus encaissé que prévu) |
    | Charge | Réalisé < budget (moins dépensé que prévu) |

    ### Seuils de matérialité

    La plupart des organisations fixent des seuils de matérialité au-delà desquels un écart doit être analysé. Règles courantes :
    - Analyser les écarts > 5–10 % sur les lignes budgétaires de plus de 10 k$
    - Toujours analyser les écarts de chiffre d'affaires > 10 %
    - Signaler les écarts cumulés même si chaque période reste dans la tolérance

    ### Types d'écarts budgétaires

    - **Écart sur prix** : le prix unitaire diffère du budget
    - **Écart sur volume** : la quantité vendue ou consommée diffère
    - **Écart de rendement** : la consommation de main-d'œuvre ou de matière par unité diffère
    - **Écart de mix** : la combinaison de produits ou services vendus diffère du mix prévu

    Comprendre l'origine d'un écart détermine l'action corrective adaptée.

    ### Guides

    - [Qu'est-ce que l'analyse des écarts budgétaires ?](/tools/budget-variance-calculator/#what-is-budget-variance-analysis)
    - [Écart favorable ou défavorable : les différences clés](/tools/budget-variance-calculator/#favorable-vs-unfavorable-variance)
"cash-conversion-cycle-calculator":
  "body": |
    Le cycle de conversion de trésorerie (CCC) mesure combien de jours la
    trésorerie d'une entreprise reste immobilisée dans l'exploitation, entre le
    paiement des stocks ou des achats et l'encaissement des clients.

    ## La formule du CCC

    **CCC = DIO + DSO − DPO**

    Où :
    - **DIO** (rotation des stocks en jours) = stock moyen ÷ [coût des ventes](/glossary/#cogs) × 365
    - **DSO** (délai moyen de paiement clients) = créances clients moyennes ÷ chiffre d'affaires × 365
    - **DPO** (délai moyen de paiement fournisseurs) = dettes fournisseurs moyennes ÷ coût des ventes × 365

    ## Exemple de calcul

    Une entreprise avec :
    - Stock moyen : 500 k$
    - Coût des ventes annuel : 3 M$
    - Créances clients moyennes : 400 k$
    - Chiffre d'affaires annuel : 5 M$
    - Dettes fournisseurs moyennes : 200 k$

    - DIO = 500 k$ ÷ 3 M$ × 365 = 60,8 jours
    - DSO = 400 k$ ÷ 5 M$ × 365 = 29,2 jours
    - DPO = 200 k$ ÷ 3 M$ × 365 = 24,3 jours
    - **CCC = 60,8 + 29,2 − 24,3 = 65,7 jours**

    En moyenne, l'entreprise a 65,7 jours de trésorerie immobilisés dans son
    fonds de roulement.

    ## Un CCC négatif : le graal

    Certaines entreprises, notamment les SaaS (les clients paient d'avance) et les
    géants de la distribution (ils vendent avant de payer leurs fournisseurs),
    atteignent un CCC négatif : elles encaissent avant de devoir payer leurs
    fournisseurs.

    Amazon a longtemps fonctionné avec un CCC négatif, utilisant de fait le crédit
    fournisseur comme un fonds de roulement gratuit pour financer sa croissance.

    ## Le CCC d'un SaaS

    Un pur SaaS a généralement :
    - DIO = 0 (pas de stock physique)
    - DSO = selon les conditions de paiement (0 pour un abonnement mensuel, 30 à 60 pour des grands comptes facturés)
    - DPO = selon les conditions fournisseurs (en général 30 à 60 jours)

    Un SaaS facturé mensuellement par carte, avec des délais fournisseurs
    standards, a souvent un CCC proche de 0 ou négatif.

    ## Comment améliorer le CCC

    **Réduire le DIO** : accélérer la rotation des stocks grâce à de meilleures
    prévisions, moins de stock de sécurité ou des achats en flux tendu.

    **Réduire le DSO** : proposer un escompte pour paiement anticipé, automatiser
    les relances, raccourcir les délais des nouveaux clients, passer au
    prélèvement automatique.

    **Augmenter le DPO** : négocier des délais fournisseurs plus longs (60 à
    90 jours au lieu de 30). Les grands groupes le font systématiquement.

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule la rotation des stocks en jours (DIO), le délai de paiement clients
    (DSO) et le délai de paiement fournisseurs (DPO), puis les combine en cycle de
    conversion de trésorerie.
"dso-calculator":
  "body": |
    ## Qu'est-ce que le délai moyen de paiement clients (DSO) ?

    Le DSO (Days Sales Outstanding) mesure le nombre moyen de jours qu'il faut à
    votre entreprise pour encaisser une vente. C'est l'un des indicateurs de
    fonds de roulement les plus importants, car il chiffre directement la
    trésorerie immobilisée dans les créances à un instant donné.

    **DSO = (créances clients ÷ ventes à crédit totales) × nombre de jours**

    Plus le DSO est bas, plus l'encaissement est rapide et moins il y a de
    trésorerie bloquée dans des factures impayées. Un DSO qui monte est un signal
    précoce de problèmes de recouvrement ou de tensions de trésorerie chez vos
    clients.

    ## Comment lire votre DSO

    | DSO | Lecture |
    |---|---|
    | Moins de 30 jours | Excellent : les clients paient rapidement |
    | 30–45 jours | Bon : conforme à un paiement à 30 jours |
    | 45–60 jours | Acceptable : surveillez la tendance |
    | 60–90 jours | Élevé : revoyez votre processus de recouvrement |
    | Plus de 90 jours | Très élevé : fort impact sur le fonds de roulement |

    ## Taux de rotation des créances clients

    La rotation des créances est l'inverse du DSO :

    **Rotation des créances = ventes à crédit totales ÷ créances clients moyennes**

    Plus la rotation est élevée, plus vous encaissez vite. Elle complète le DSO :
    une rotation de 12× correspond à un DSO moyen d'environ 30 jours.

    ## Comment réduire le DSO

    1. **Raccourcir les délais de paiement** : passer de 60 à 30 jours pour les nouveaux clients
    2. **Proposer un escompte pour paiement anticipé** : « 2/10 net 30 » (2 % de remise si payé sous 10 jours)
    3. **Automatiser les relances** : relancer à 7, 14 et 30 jours après l'échéance
    4. **Demander un acompte** : pour les gros projets, encaisser 25 à 50 % d'avance
    5. **Accepter plus de moyens de paiement** : réduire les frictions avec virement, prélèvement et carte

    ## Impact sur le fonds de roulement

    Chaque jour de DSO gagné libère une trésorerie égale à vos ventes
    quotidiennes. Si vous réalisez 450 000 $ par trimestre et ramenez le DSO de
    45 à 30 jours, vous libérez 15 × (450 000 $ ÷ 90) = **75 000 $ de trésorerie**
    sans aucun changement de chiffre d'affaires.

    ## Questions fréquentes

    **Quel est un bon DSO pour un SaaS B2B ?**
    Les SaaS B2B en abonnement mensuel ont souvent un DSO proche de zéro, car
    l'abonnement est prélevé d'avance. Pour des contrats annuels facturés d'avance,
    le DSO tourne généralement autour de 30 à 45 jours après facture. Si vous avez
    à la fois des abonnements et des services, votre DSO combiné peut se situer
    entre 35 et 55 jours.

    **Quel est l'effet du DSO sur ma ligne de crédit ?**
    Les prêteurs regardent le DSO pour les financements adossés aux actifs et
    l'affacturage. Un DSO élevé ou en hausse peut signaler des difficultés de
    recouvrement et réduire le taux d'avance sur vos créances. Un DSO sous
    45 jours rend en général vos créances finançables aux taux d'avance standards
    (souvent 80 à 85 %).
"invoice-discount-calculator":
  "body": |
    ## Formule de l'escompte pour paiement anticipé

    Pour une condition « 2/10 net 30 » (2 % de remise si payé sous 10 jours, sinon échéance à 30) :

    $$\text{Coût annualisé} = \frac{\text{Remise \%}}{100 - \text{Remise \%}} \times \frac{365}{\text{Jours net} - \text{Jours d'escompte}}$$

    **Exemple (2/10 net 30) :**

    $$\frac{2}{98} \times \frac{365}{20} = 37.2\%$$

    Renoncer à un escompte 2/10 net 30 revient à emprunter à 37,2 % de taux annuel : cela vaut presque toujours la peine de le prendre si vous avez la trésorerie.

    ### Quand prendre l'escompte

    Prenez l'escompte quand le **coût annualisé du renoncement** dépasse votre **coût du capital** (coût d'une ligne de crédit, coût d'opportunité de la trésorerie).

    | Votre taux d'emprunt | Coût annualisé de l'escompte | Décision |
    |--------------------|--------------------------|---------- |
    | 8 % | 37,2 % | Prendre l'escompte |
    | 8 % | 6 % | Refuser : emprunter coûte moins cher que perdre l'escompte |

    ### Escompte dynamique

    Certaines plateformes fournisseurs proposent un escompte dynamique : un taux variable selon le nombre de jours d'avance. Utilisez ce calculateur pour évaluer n'importe quelle offre en calculant son coût annualisé implicite.

    ### Guides

    - [Qu'est-ce qu'une condition de paiement 2/10 net 30 ?](/tools/invoice-discount-calculator/#what-is-2-10-net-30)
    - [Quand prendre un escompte pour paiement anticipé ?](/tools/invoice-discount-calculator/#when-to-take-early-payment-discount)
"operating-cash-flow-calculator":
  "body": |
    Le flux de trésorerie d'exploitation (OCF) mesure la trésorerie réellement
    générée par l'activité principale de l'entreprise. Contrairement au résultat
    net, il se prête mal aux choix comptables : l'argent est arrivé sur le compte
    bancaire, ou pas.

    ## La formule de la méthode indirecte

    **OCF = résultat net + dotations aux amortissements + variation du besoin en fonds de roulement**

    C'est la méthode la plus courante (méthode indirecte), car elle part du
    résultat net, facile à obtenir, puis corrige les éléments non décaissés et les
    décalages de calendrier.

    ## Pourquoi l'OCF diffère du résultat net

    **Les amortissements** réduisent le bénéfice comptable sans consommer de
    trésorerie. Un serveur à 10 k$ amorti sur 5 ans réduit le résultat net de
    2 k$ par an, mais il a été payé la première année. Réintégrer les
    amortissements transforme le bénéfice comptable en bénéfice de trésorerie.

    **La variation du besoin en fonds de roulement** reflète le décalage entre la
    constatation du chiffre d'affaires et son encaissement :
    - Créances clients **en hausse** → vous avez facturé mais pas encore encaissé → l'OCF est inférieur au résultat net
    - Dettes fournisseurs **en hausse** → vous avez reçu les biens sans les payer encore → l'OCF est supérieur au résultat net

    ## Flux de trésorerie disponible (FCF)

    **FCF = OCF − dépenses d'investissement**

    Le flux de trésorerie disponible est ce qui reste après avoir entretenu et
    développé les actifs. C'est l'indicateur qu'utilisent les fonds de private
    equity et les investisseurs avertis pour valoriser une entreprise, car il
    représente la trésorerie réellement distribuable.

    | OCF | Capex | FCF | Lecture |
    |---|---|---|---|
    | +100 k$ | 5 k$ | +95 k$ | Sain : l'entreprise génère du cash |
    | +100 k$ | 50 k$ | +50 k$ | Acceptable : forts investissements en actifs |
    | +100 k$ | 120 k$ | −20 k$ | Phase d'investissement de croissance |
    | −50 k$ | 10 k$ | −60 k$ | Hémorragie de trésorerie : financement externe nécessaire |

    ## Taux de conversion en trésorerie

    **Taux de conversion en trésorerie = OCF ÷ résultat net**

    Au-dessus de 1×, l'entreprise génère plus de trésorerie que de bénéfice
    comptable (bon signe). En dessous de 1×, le bénéfice progresse plus vite que
    les encaissements : surveillez les créances clients. Au-dessus de 1,5×, c'est
    souvent le signe d'amortissements élevés par rapport au capex.

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule le flux de trésorerie d'exploitation à partir du résultat net, des amortissements et de la variation du BFR, ainsi que le flux de trésorerie disponible et le taux de conversion en trésorerie.
"working-capital-calculator":
  "body": |
    Le fonds de roulement est la différence entre l'actif circulant et le passif
    circulant d'une entreprise. Il mesure la liquidité à court terme : le coussin
    opérationnel qui permet de fonctionner au quotidien sans crise de trésorerie.

    ## La formule

    **Fonds de roulement = actif circulant − passif circulant**

    Avec 500 k$ d'actif circulant et 200 k$ de passif circulant, le fonds de
    roulement est de 300 k$. Ces 300 k$ constituent le coussin de trésorerie
    opérationnel.

    ## Ratio de liquidité générale

    **Ratio de liquidité générale = actif circulant / passif circulant**

    500 k$ / 200 k$ = 2,5x. Pour chaque dollar d'obligations à court terme,
    l'entreprise dispose de 2,50 $ d'actifs liquides.

    ## Ratio de liquidité réduite (test acide)

    **Ratio de liquidité réduite = (actif circulant − stocks) / passif circulant**

    Ce ratio exclut les stocks, car les transformer en trésorerie prend du temps.
    C'est une mesure plus prudente de la liquidité immédiate.

    ## Repères

    | Liquidité générale | Lecture |
    |---|---|
    | > 2,0x | Solide : large coussin à court terme |
    | 1,5–2,0x | Sain : liquidité confortable |
    | 1,0–1,5x | Serré : peu de marge d'erreur |
    | < 1,0x | Alerte : risque de liquidité possible |

    ## Fonds de roulement négatif

    Certaines entreprises, en particulier les SaaS et les modèles d'abonnement,
    peuvent fonctionner avec un fonds de roulement négatif. Si les clients paient
    l'année d'avance (ce qui crée des produits constatés d'avance, donc un passif
    circulant), le fonds de roulement est négatif alors que l'entreprise est en
    parfaite santé.

    Amazon a longtemps fonctionné avec un fonds de roulement négatif : les clients
    payaient immédiatement, et Amazon réglait ses fournisseurs à 30–45 jours.
    L'écart finançait l'exploitation.

    ## Fonds de roulement et cycle de conversion de trésorerie

    Le fonds de roulement est un solde statique ; le [cycle de conversion de trésorerie](/tools/cash-conversion-cycle-calculator/)
    est le flux dynamique. Une entreprise peut avoir un fonds de roulement positif
    et un CCC désastreux si ses créances mettent plus de 90 jours à rentrer.
    Suivez les deux ensemble.

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule le fonds de roulement, le ratio de liquidité générale, le ratio de
    liquidité réduite et le fonds de roulement en jours à partir de votre actif et
    passif circulants.

"payment-fee-comparison":
  "body": |
    Choisir le prestataire de paiement le moins cher devient simple dès qu'on voit
    les chiffres côte à côte. Saisissez votre montant de vente habituel ci-dessous
    et le tableau comparatif se met à jour instantanément avec les frais exacts et
    le net versé pour **Stripe**, **PayPal Standard**, **PayPal Checkout** et
    **Shopify Payments** sur chacun de ses trois forfaits.

    ## Comment fonctionne la comparaison

    La grille tarifaire de chaque prestataire est fixée à ses tarifs publics américains :

    | Prestataire | Taux | Part fixe |
    |-----------|------|-----------|
    | Stripe | 2,9 % | + 0,30 $ |
    | PayPal Standard | 2,99 % | + 0,49 $ |
    | PayPal Checkout | 3,49 % | + 0,49 $ |
    | Shopify Basic | 2,0 % | + 0,25 $ |
    | Shopify (forfait Shopify) | 1,7 % | + 0,25 $ |
    | Shopify Advanced | 1,5 % | + 0,25 $ |

    ## Quand Shopify Payments est moins cher

    Shopify Payments bat Stripe sur les transactions Visa/Mastercard nationales
    américaines au-delà d'environ 12 $. À 100 $, Shopify Basic économise 0,95 $
    par transaction par rapport à Stripe. À 500 $ de volume mensuel sur le forfait
    Basic (39 $/mois), le calcul est à peu près neutre ; mais à 50 000 $ par mois,
    l'économie sur le taux écrase le coût du forfait.

    ## Quand rester sur Stripe

    Stripe l'emporte pour : la facturation d'abonnements, les API SaaS, les
    paiements internationaux (plus de 135 devises), le prélèvement ACH, la
    facturation B2B et les entreprises qui ne sont pas sur Shopify. Son écosystème
    pour développeurs est sans équivalent. Utilisez cet outil pour chiffrer
    l'écart de frais, puis mettez-le en balance avec le coût d'un changement et
    vos besoins fonctionnels.

    ## Questions fréquentes

    **Quel prestataire de paiement a les frais les plus bas ?**
    Shopify Payments (forfait Advanced) a le taux le plus bas, 1,5 % + 0,25 $, mais
    il faut une boutique Shopify et un abonnement à 399 $/mois. Hors Shopify,
    Stripe (2,9 % + 0,30 $) bat PayPal Standard (2,99 % + 0,49 $) sur les
    transactions de plus de 15 $.

    **Combien Shopify Payments coûte-t-il de moins que Stripe ?**
    Sur une transaction de 100 $ : 2,25 $ de frais chez Shopify Basic contre
    3,20 $ chez Stripe, soit 0,95 $ d'économie. Mais Shopify Basic exige un
    forfait à 39 $/mois. Il faut plus de 4 100 $ de volume mensuel pour que
    l'économie par rapport à Stripe couvre le forfait.

    **PayPal coûte-t-il plus cher que Stripe ?**
    Oui. PayPal Standard facture 2,99 % + 0,49 $ contre 2,9 % + 0,30 $ chez
    Stripe. Sur une transaction de 100 $, PayPal Standard prend 3,48 $ contre
    3,20 $ pour Stripe : 0,28 $ de plus. PayPal Checkout (3,49 % + 0,49 $) est
    nettement plus cher que les deux.

    **Puis-je utiliser Stripe sur Shopify sans frais supplémentaires ?**
    Oui, mais Shopify prélève des frais de transaction tiers (0,5 à 2 % selon
    votre forfait) si vous utilisez un autre prestataire que Shopify Payments.
    À 10 000 $ par mois, cela ajoute 50 à 200 $ de surcoût Shopify. Shopify
    Payments (qui repose sur l'infrastructure de Stripe) supprime ces frais.
"paypal-fee-calculator":
  "body": |
    PayPal facture **3,49 % + 0,49 $** par transaction en ligne nationale, un peu
    plus que les 2,9 % + 0,30 $ de Stripe. Pour les paiements internationaux, les
    frais passent à **4,99 % + 0,49 $**. Les micropaiements (moins de 10 $) ont un
    tarif spécial : **5 % + 0,05 $**, moins cher sur de très petits montants mais
    élevé en pourcentage.

    ## Frais PayPal et Stripe comparés

    | Cas | PayPal | Stripe |
    |---|---|---|
    | 10 $ national | 0,84 $ (8,4 %) | 0,59 $ (5,9 %) |
    | 100 $ national | 3,98 $ (4,0 %) | 3,20 $ (3,2 %) |
    | 1 000 $ national | 35,39 $ (3,5 %) | 32,30 $ (3,2 %) |
    | 100 $ international | 5,48 $ (5,5 %) | 4,70 $ (4,7 %) |

    Pour la plupart des montants, Stripe est moins cher. L'atout de PayPal, c'est
    la familiarité des consommateurs : proposer PayPal peut améliorer la
    conversion au paiement.

    ## Mode report des frais
    Si vous devez recevoir un montant net précis, le calculateur fait la
    majoration : pour recevoir exactement 100 $ via un paiement PayPal national,
    il faut facturer **104,66 $**.

    ## PayPal « Entre proches »
    Les paiements entre particuliers (« Entre proches ») sont gratuits au niveau
    national s'ils sont financés par compte bancaire ou solde PayPal, mais les
    utiliser pour des paiements professionnels enfreint les conditions
    d'utilisation de PayPal. Vous risquez la fermeture du compte, sans la
    protection vendeur des transactions standards.

    ## Questions fréquentes

    **PayPal facture-t-il les remboursements ?**
    PayPal rend la part fixe de 0,49 $ mais garde la part en pourcentage (3,49 %)
    lors d'un remboursement. Stripe, lui, rend la part fixe mais garde aussi le
    pourcentage.

    **Peut-on éviter les frais PayPal ?**
    Pour des virements depuis un compte bancaire national vers des proches, oui.
    Pour les transactions professionnelles, le seul moyen de réduire les frais est
    le programme de tarif marchand de PayPal, qui exige une demande et un volume
    de transactions élevé. En général, Stripe coûte moins cher pour la plupart des
    usages professionnels.
"shopify-fee-calculator":
  "body": |
    Shopify prélève deux types de frais sur chaque vente : des **frais de
    traitement du paiement** (proches du tarif de Stripe) et des **frais de
    transaction** distincts si vous utilisez une passerelle de paiement tierce au
    lieu de Shopify Payments. Comprendre les deux est indispensable pour calculer
    votre marge avec précision.

    ## Grille de frais Shopify par forfait

    | Forfait | Abonnement mensuel | Taux de traitement | Frais de transaction (tiers) |
    |---|---|---|---|
    | Basic | 39 $ | 2,9 % + 0,30 $ | 2,0 % |
    | Shopify | 105 $ | 2,6 % + 0,30 $ | 1,0 % |
    | Advanced | 399 $ | 2,4 % + 0,30 $ | 0,5 % |

    Les frais de transaction s'appliquent *uniquement* si vous utilisez un autre
    prestataire que Shopify Payments (Stripe, PayPal, etc.). Avec Shopify
    Payments, ils disparaissent complètement.

    ## Shopify Payments ou passerelle tierce

    Pour la plupart des marchands, Shopify Payments est l'option la moins chère
    car elle supprime les frais de transaction. Une vente de 100 $ sur le forfait
    Basic via Stripe coûte **2,90 $ + 0,30 $ + 2,00 $ = 5,20 $**, contre seulement
    **3,20 $** avec Shopify Payments, soit 62 % d'écart.

    Raisons d'utiliser malgré tout une passerelle tierce :
    - Votre pays n'est pas couvert par Shopify Payments (disponible dans plus de 17 pays)
    - Vous avez besoin d'outils antifraude, d'abonnements ou de fonctions propres à votre passerelle actuelle
    - Catégories de produits à risque que Shopify Payments n'accepte pas

    ## Questions fréquentes

    **L'abonnement mensuel entre-t-il dans le coût par vente ?**
    Le calculateur affiche uniquement les frais par transaction. Pour un coût
    complet par vente incluant l'abonnement, divisez l'abonnement mensuel par
    votre nombre de transactions mensuelles et ajoutez-le au total par
    transaction. À 100 ventes par mois sur le forfait Basic, l'abonnement pèse
    0,39 $ par vente.

    **Faut-il passer à un forfait supérieur pour payer moins de frais ?**
    Le calcul : si passer de Basic à Shopify (66 $ de plus par mois) économise
    0,3 % et supprime 1 % de frais de transaction (avec une passerelle tierce),
    vous atteignez l'équilibre à 66 $ / 0,013 = 5 077 $ de ventes mensuelles.
    Au-delà, le changement de forfait est rentable.
"stripe-fee-calculator":
  "body": |
    Stripe est le prestataire de paiement de référence pour la plupart des
    produits SaaS, des places de marché et des entreprises indépendantes, mais sa
    grille tarifaire piège sans cesse les fondateurs. Le tarif standard est de
    **2,9 % + 0,30 $** par paiement carte réussi, mais ce n'est qu'un point de
    départ.

    Les cartes internationales (émises hors des États-Unis) entraînent des
    **frais transfrontaliers de 1,5 %** supplémentaires, soit **4,4 % + 0,30 $**
    au total. Si vous utilisez Stripe Connect (la plateforme de Stripe qui répartit
    les paiements entre une place de marché et ses vendeurs) pour encaisser pour le
    compte de comptes connectés, les frais et le partage des revenus se
    compliquent. Ce calculateur couvre tous les cas courants.

    ## Comment fonctionne le calcul des frais Stripe
    1. Saisissez le montant à facturer au client.
    2. Indiquez si la carte est nationale ou internationale.
    3. Choisissez si vous absorbez les frais ou si vous les répercutez au client
       (mode « facturer ce qu'il faut pour recevoir »).
    4. Le calculateur affiche le montant exact des frais, le net versé sur votre
       compte bancaire et, en mode report, le montant à facturer pour recevoir
       votre cible.

    ## Pourquoi « facturer plus pour recevoir exactement ce qu'il faut » compte
    Si vous devez recevoir exactement 100 $ d'une carte américaine, vous ne pouvez
    pas simplement facturer 100 $ : vous recevriez 96,80 $ après les 2,9 % + 0,30 $
    de Stripe. Pour recevoir exactement 100 $, il faut facturer **103,09 $** (si le
    client paie les frais). Ce calculateur fait cette majoration automatiquement.

    ## Questions fréquentes

    **Le tarif de Stripe varie-t-il selon le volume ?**
    Oui. Stripe négocie des tarifs sur mesure au-delà d'environ 80 k$ encaissés
    par mois. Pour la plupart des fondateurs indépendants et des jeunes
    entreprises, le tarif standard de 2,9 % + 0,30 $ s'applique. Le calculateur
    utilise le tarif standard ; modifiez le champ du pourcentage pour votre taux
    négocié.

    **Et les frais annexes de Stripe (litiges, remboursements, international) ?**
    Les remboursements rendent les frais en pourcentage mais pas la part fixe de
    0,30 $. Un litige coûte 15 $ quelle que soit son issue (les 15 $ sont rendus si
    vous gagnez). Ces cas particuliers ne figurent pas dans le calcul par
    transaction, mais il vaut la peine de les budgéter.

    **Puis-je l'utiliser pour Stripe Connect ?**
    Oui. Stripe Connect répercute les mêmes frais de base à la plateforme ou au
    compte connecté selon votre configuration. Saisissez le montant total et le
    taux combiné applicable dans le champ de taux personnalisé.

"freelance-project-estimate":
  "body": |
    Chiffrer précisément un projet freelance, c'est à la fois du calcul et de la
    gestion du risque. Sous-estimez et vous travaillez des heures non payées.
    Surestimez sans justification et vous perdez la mission. Ce calculateur part
    de ce que vous savez (votre taux, vos heures estimées et une marge pour
    imprévus) et produit un devis que vous pouvez remettre directement au client.

    ## La formule en deux temps

    **Estimation de base** = taux horaire × heures estimées
    **Devis total** = estimation de base × (1 + % d'imprévus)

    La marge pour imprévus n'est ni du rembourrage ni de la malhonnêteté : c'est
    un coussin de risque qui couvre l'inévitable, à savoir des besoins flous, la
    dérive du périmètre, les allers-retours de révision et le temps de gestion de
    projet que vous n'avez pas estimé explicitement.

    ## Quelle marge pour imprévus retenir

    | Type de projet | Marge recommandée |
    |---|---|
    | Cahier des charges clair, travail maîtrisé | 10–15 % |
    | Projet standard, quelques inconnues | 20–25 % |
    | Nouveau domaine, besoins flous | 30–40 % |
    | Phases de R&D / cadrage | 50 % et plus |

    Les études sur les projets logiciels montrent des dépassements de 50 à 80 %
    par rapport aux estimations initiales. Une marge de 20 % n'a rien d'agressif :
    c'est une hypothèse prudente. Un client qui conteste la marge vous dit qu'il
    s'attend à des changements de périmètre et ne compte pas les payer.

    ## Forfait ou régie

    Ce calculateur produit un **devis au forfait**. Les alternatives :
    - **Régie (temps passé)** : vous facturez les heures réelles à votre taux. Moins
      de risque pour vous, plus de risque perçu pour le client. Idéal pour du
      travail continu ou ouvert.
    - **Tarification à la valeur** : le prix suit la valeur perçue par le client
      plutôt que vos heures. Plus délicat à positionner, mais sans plafond de
      revenus.

    ## Questions fréquentes

    **Faut-il montrer le détail ou seulement le total ?**
    Pour la plupart des clients, montrez seulement le total. Détailler taux horaire
    × heures invite à négocier chaque composante et pousse le client à comparer
    votre taux au marché. Le total suffit pour décider d'acheter.

    **Comment gérer les demandes hors périmètre ?**
    Ajoutez une clause de périmètre à votre contrat : tout travail en dehors des
    livrables définis fait l'objet d'un devis séparé. Invoquez-la calmement quand
    le périmètre dérive (« Avec plaisir, je vous envoie un petit devis pour ce
    travail supplémentaire ») plutôt que de l'absorber en silence.
"freelance-rate-calculator":
  "body": |
    Fixer un taux freelance sans calcul méthodique est l'une des façons les plus
    courantes de sous-facturer. Le chiffre qu'il vous faut n'est pas votre ancien
    salaire divisé par 2 080 : c'est ce chiffre *plus* les impôts, *plus* les frais
    professionnels, *plus* un ajustement pour le fait que vous ne pourrez sans
    doute pas facturer toutes les heures travaillées.

    Ce calculateur part de votre **objectif de revenu annuel** et remonte jusqu'au
    taux horaire minimum à facturer pour l'atteindre, en tenant compte de trois
    facteurs :

    **1. Le temps non facturable.** Répondre aux e-mails, rédiger des propositions,
    tenir la comptabilité et se former prennent du temps qu'on ne peut pas facturer.
    La plupart des freelances facturent 60 à 70 % de leurs heures travaillées.

    **2. Les impôts.** Un indépendant paie l'impôt sur le revenu *plus* des
    cotisations d'indépendant (Sécurité sociale + Medicare aux États-Unis ≈ 15,3 %),
    car l'employeur paie normalement la moitié des charges sociales pour ses
    salariés. En freelance, vous payez les deux moitiés.

    **3. Les frais professionnels.** Abonnements logiciels, matériel, bureau ou
    coworking, assurance santé, formation et frais comptables réduisent tous le
    chiffre d'affaires qui vous reste une fois les dépenses payées.

    ## Questions fréquentes

    **Pourquoi mon « vrai taux » paraît-il tellement plus élevé que ce que gagnent les salariés ?**
    Parce qu'il l'est. Un salarié à temps plein payé 100 k$ coûte à son employeur
    environ 130 à 145 k$ au total (avantages, charges sociales, matériel, bureau).
    En freelance, vous couvrez tout cela vous-même, et vous portez en plus le
    risque du temps non facturable et des creux de revenus entre deux clients.

    **Faut-il parfois facturer sous son taux minimum ?**
    Pour un client stratégique qui vous apporte des références, des
    recommandations ou un accès à des missions mieux payées, une remise temporaire
    est une décision d'affaires valable, à condition de la prendre en conscience,
    et pas parce que vous avez oublié les impôts.

    **Comment augmenter mon taux auprès de clients existants ?**
    Prévenez 60 à 90 jours à l'avance, appuyez-vous sur la valeur (« mon taux passe
    à X car je livre désormais Y ») et tenez bon. La plupart des clients qui restent
    au nouveau taux finissent par respecter davantage votre temps.
"invoice-total-calculator":
  "body": |
    Les logiciels de facturation sont parfaits pour les clients récurrents, mais
    quand il vous faut un total rapide pour une proposition, un détail de coût de
    projet pour un e-mail client ou une vérification avant d'envoyer une facture,
    un simple calculateur va plus vite que d'ouvrir votre outil de facturation.

    Ce calculateur gère jusqu'à quatre lignes, une remise et une taxe/TVA
    facultatives, et produit un récapitulatif texte du détail complet, prêt à
    copier-coller.

    ## Quand utiliser ce calculateur

    - **Au stade de la proposition** : modéliser rapidement le total avant de s'engager par écrit sur un prix
    - **Points d'étape avec le client** : montrer le cumul du travail réalisé en cours de projet
    - **Vérification multidevise** : contrôler le calcul avant de le coller dans votre outil de facturation
    - **Vérification fiscale** : confirmer le montant de TVA ou de taxe avant l'envoi

    ## Stratégies de lignes de facture pour freelances

    **Lignes orientées valeur** : plutôt que « 40 heures de développement », écrivez
    « Refonte et développement du site ». L'attention du client passe du temps au
    livrable.

    **Facturation par jalons** : découpez les projets en deux ou trois factures
    (par exemple 50 % à la commande, 25 % à mi-parcours, 25 % à la livraison). Vous
    vous protégez des impayés et le client gère mieux sa trésorerie.

    **Frais** : ajoutez des lignes pour les débours (photos, polices, outils,
    déplacements) avec une courte description. Refacturez-les à prix coûtant sauf
    si votre contrat prévoit une marge.

    ## TVA et taxes

    Pour les prestations B2B au sein de l'UE, l'autoliquidation de la TVA
    s'applique en général : vous ne facturez pas de TVA aux clients professionnels
    des autres États membres, mais la facture doit porter la mention
    « Autoliquidation ». Pour les prestations B2C dans l'UE, vous devrez peut-être
    collecter la TVA au taux du pays du client. Consultez votre expert-comptable
    pour votre situation.

    Aux États-Unis, la taxe de vente ne s'applique généralement pas aux services
    dans la plupart des États (exceptions : certains services numériques).
    Vérifiez les règles de votre État avant de facturer une taxe.

    ## Questions fréquentes

    **Comment ajouter plus de 4 lignes ?**
    Pour des factures plus longues, utilisez un vrai outil de facturation (Bonsai,
    FreshBooks ou HoneyBook sont pensés pour les freelances). Ce calculateur est
    optimisé pour les estimations rapides et les factures simples.

    **Faut-il afficher le taux horaire ou seulement le total de la ligne ?**
    Pour la plupart des clients, affichez seulement le total par livrable.
    « 40 heures × 125 $ » invite à négocier le taux ; « Développement : 5 000 $ »
    vous positionne comme quelqu'un qui livre un résultat.
"salary-to-hourly-calculator":
  "body": |
    Que vous soyez freelance et compariez votre taux aux salaires, employeur
    chiffrant un poste en mission, ou simplement curieux de savoir ce que votre
    salaire annuel représente à l'heure, ce calculateur fait la conversion
    instantanément, sans inscription.

    Le calcul est simple pour les montants bruts :
    **Taux horaire** = salaire annuel ÷ (semaines par an × heures par semaine)

    Par défaut, on suppose 52 semaines par an et 40 heures par semaine. Le
    calculateur permet d'ajuster les deux, ce qui est utile pour :
    - Les temps partiels (par exemple 20 heures par semaine)
    - Les personnes avec plus ou moins de 52 semaines payées (congés sans solde, par exemple)
    - Les salariés dont les congés payés sont inclus dans le salaire

    ## Taux horaire avant et après impôt

    Le calculateur propose un taux horaire estimé après impôt pour les tranches
    courantes de l'impôt fédéral américain (10 %, 12 %, 22 %, 24 %, 32 %, 35 %,
    37 %). Attention : c'est une estimation simplifiée qui ne tient compte ni des
    impôts des États, ni des déductions, ni de la situation familiale. Utilisez-la
    pour des comparaisons approximatives, pas pour votre planification fiscale.

    ## Questions fréquentes

    **Comment reconvertir un taux horaire en salaire annuel ?**
    Annuel = horaire × heures par semaine × semaines par an. Pour 40 h et 52
    semaines : horaire × 2 080 = annuel.

    **Mon contrat indique X $ par jour : comment convertir ?**
    Divisez par vos heures quotidiennes pour obtenir le taux horaire, puis
    multipliez par vos heures hebdomadaires et vos semaines par an pour l'annuel.
    Pour une journée de 8 heures : taux journalier × 260 jours travaillés = annuel.

    **Pourquoi les freelances facturent-ils 2 à 3 fois le taux horaire d'un salarié équivalent ?**
    Parce que la part patronale des charges sociales, les avantages, le matériel,
    les frais de gestion et le risque de creux de revenus sont supportés par le
    freelance et non par l'entreprise. Voir le calculateur de taux freelance pour
    le détail complet.

"freelance-tax-estimator":
  "body": |
    En tant que freelance ou prestataire indépendant, vous payez à la fois la part
    salariale ET la part patronale des cotisations Social Security et Medicare,
    appelées ensemble **self-employment tax (SE tax)**, soit 15,3 % du bénéfice
    net.

    Contrairement aux salariés (W-2), personne ne prélève d'impôt à la source sur
    vos paiements. Vous devez verser des acomptes trimestriels (15 avril, 16 juin,
    15 septembre, 15 janvier) pour éviter les pénalités de l'IRS pour
    sous-paiement.

    ## Comment se calculent les impôts d'un freelance

    **Étape 1 : bénéfice net** = revenus bruts − frais professionnels

    **Étape 2 : SE tax** = bénéfice net × 15,3 %
    (Social Security 12,4 % jusqu'à 168 600 $ + Medicare 2,9 %, sans plafond)

    **Étape 3 : déduction de la SE tax** = SE tax × 50 %
    (La moitié de la SE tax est déductible du revenu imposable)

    **Étape 4 : revenu imposable** = bénéfice net − déduction SE + autres revenus

    **Étape 5 : impôt fédéral sur le revenu** = barème marginal 2024 appliqué au revenu imposable

    **Étape 6 : acompte trimestriel** = (SE tax + impôt fédéral) ÷ 4

    ## Les déductions qui réduisent la facture

    - **Frais professionnels** : logiciels, matériel, formation, bureau à domicile
    - **Primes d'assurance santé** : entièrement déductibles si vous payez votre propre contrat
    - **Épargne retraite** : SEP-IRA (jusqu'à 25 % du bénéfice net, 69 k$ max),
      Solo 401(k) (jusqu'à 23 k$ en part salarié + 25 % en part employeur) ou Roth IRA (7 k$)
    - **La moitié de la SE tax** : calculée et déduite automatiquement

    ## L'option S-Corp

    Au-delà d'environ 80 000 $ de bénéfice net, certains freelances économisent en
    optant pour le statut S-Corp. Vous vous versez un « salaire raisonnable »
    (soumis à la SE tax) et prenez le reste en distribution (non soumis à la SE
    tax). L'économie peut dépasser 5 000 $ par an, mais impose de gérer une paie et
    de déposer une déclaration supplémentaire. Consultez un expert-comptable (CPA)
    avant de vous décider.

    ## Questions fréquentes

    **Quand dois-je verser des acomptes trimestriels ?**
    Si vous prévoyez de devoir 1 000 $ d'impôt ou plus sur l'année, l'IRS exige des
    acomptes trimestriels. Les échéances sont le 15 avril, le 15 juin, le
    15 septembre et le 15 janvier. Un oubli ou un sous-paiement entraîne une
    pénalité (actuellement ~8 % par an sur le montant sous-payé).

    **Quels frais un freelance peut-il déduire ?**
    Toute dépense professionnelle courante et nécessaire : bureau à domicile
    (espace dédié), logiciels et abonnements professionnels, formation, matériel,
    accès internet (part professionnelle), assurance responsabilité civile
    professionnelle, honoraires comptables et juridiques, et déplacements
    professionnels.
"payroll-tax-calculator":
  "body": |
    Les charges sociales patronales ajoutent environ 8 à 12 % au coût de chaque
    salarié, en plus de son salaire de base. Pour un salarié à 75 000 $, cela
    représente 6 000 à 9 000 $ de charges obligatoires supplémentaires par an.

    ## Charges sociales patronales aux États-Unis (2024)

    | Charge | Taux | Assiette |
    |----|------|-----------|
    | Social Security (part employeur) | 6,2 % | Premiers 160 200 $ |
    | Medicare (part employeur) | 1,45 % | Sans plafond |
    | FUTA (chômage fédéral) | 0,6 %* | Premiers 7 000 $ |

    *Après crédit pour la taxe chômage de l'État. Le taux FUTA réel est de 6 %,
    réduit d'un crédit pouvant aller jusqu'à 5,4 %.

    ## Taxes des États non incluses

    Ce calculateur ne couvre que les charges fédérales. La plupart des États
    appliquent en plus une taxe chômage (SUTA) dont le taux va de 0,1 % à plus de
    10 % selon l'historique de l'employeur.

    ## Coût total d'un salarié

    Le coût complet d'un salarié comprend :
    - Le salaire de base
    - Les charges sociales patronales (~8–10 %)
    - La participation à l'assurance santé (5 000–15 000 $ par an)
    - L'abondement 401(k) (3–5 % du salaire)
    - Le matériel, les logiciels, les bureaux

    Pour budgéter, comptez **1,25 à 1,40 fois le salaire de base** en coût total.
"vat-calculator":
  "body": |
    Quand vous facturez un client dans un pays assujetti à la TVA (Royaume-Uni, UE,
    Australie, etc.), vous devez savoir si votre prix est HT (net) ou TTC (brut) et
    calculer l'autre. Se tromper de sens, c'est soit sous-facturer le client, soit
    absorber la taxe par inadvertance.

    Ce calculateur gère les deux sens :

    **Ajouter la taxe :** prix HT × (1 + taux) = prix TTC
    **Retirer la taxe :** prix TTC ÷ (1 + taux) = prix HT

    Les taux standards sont préremplis pour les régions courantes (Royaume-Uni :
    20 %, UE par défaut : 20 %/23 %, GST australienne : 10 %, GST canadienne :
    5 %, États-Unis : personnalisé). Vous pouvez aussi saisir n'importe quel taux.

    ## Notions clés

    **Prix HT (hors taxe) :** le prix avant taxe. C'est ce que vous encaissez comme
    chiffre d'affaires. La TVA payée par le client revient à l'État, pas à vous.

    **Prix TTC (toutes taxes comprises) :** le total payé par le client, taxe
    incluse.

    **Seuil d'immatriculation à la TVA / GST :** au Royaume-Uni, l'immatriculation
    à la TVA est obligatoire quand le chiffre d'affaires taxable sur 12 mois
    dépasse 90 000 £ (en 2024). En dessous, vous ne facturez pas de TVA et n'avez
    pas à la reverser. La sales tax américaine n'a pas de seuil fédéral et varie
    selon les États.

    ## Questions fréquentes

    **Faut-il facturer la TVA sur les produits numériques vendus à l'étranger ?**
    Les règles de l'UE imposent de facturer la TVA au taux du pays de l'acheteur
    pour les ventes B2C de produits numériques à des clients européens (règles
    « services numériques » de l'UE). Des plateformes comme Stripe Tax, Paddle et
    Lemon Squeezy s'en chargent automatiquement en tant que « merchant of record ».
    Les ventes B2B dans l'UE relèvent en général de l'autoliquidation (le client
    déclare lui-même la TVA).

    **Quelle différence entre TVA et sales tax ?**
    La TVA est collectée à chaque étape de la production et les clients
    professionnels peuvent la récupérer. La sales tax américaine n'est collectée
    qu'à la vente finale au détail et les entreprises ne peuvent pas la récupérer.
    Le consommateur final supporte les deux ; seule la mécanique pour les
    entreprises diffère.

"commission-calculator":
  "body": |
    ## Qu'est-ce qu'une commission commerciale ?

    Une commission commerciale est une rémunération variable versée en pourcentage du chiffre d'affaires généré. Elle aligne les intérêts du commercial sur les objectifs de chiffre d'affaires de l'entreprise.

    $$\text{Commission} = \text{Chiffre d'affaires} \times \text{Taux de commission}$$

    ### Atteinte de l'OTE

    L'OTE (On-Target Earnings, rémunération cible) est la rémunération totale d'un commercial à 100 % de son quota :

    $$\text{Atteinte} = \frac{\text{Rémunération totale}}{\text{OTE}} \times 100$$

    ### Structures de commission courantes en SaaS B2B

    | Poste | Taux de commission habituel | Répartition de l'OTE |
    |------|------------------------|-----------|
    | Account Executive | 8–12 % de l'[ARR](/glossary/#arr) | 50/50 fixe/variable |
    | SDR/BDR (développement commercial) | 4–8 % sur le pipeline | 70/30 fixe/variable |
    | Responsable commercial | 2–4 % sur l'équipe | 60/40 fixe/variable |
    | CSM (Customer Success Manager) / Account Manager | 5–10 % sur l'expansion | 70/30 fixe/variable |

    ### Accélérateurs

    La plupart des plans prévoient des accélérateurs au-delà de 100 % de l'OTE : le taux de commission augmente pour le chiffre d'affaires au-delà du quota. Cela récompense la surperformance et retient les meilleurs commerciaux.

    ### Guides

    - [Qu'est-ce que l'OTE (rémunération cible) ?](/tools/commission-calculator/#what-is-on-target-earnings)
    - [Comment structurer un plan de commissions commerciales](/tools/commission-calculator/#how-to-structure-sales-commission-plan)
"employee-cost-calculator":
  "body": |
    L'erreur la plus courante quand on budgète des recrutements est de retenir le
    salaire de base comme coût. Le vrai coût employeur d'un salarié est de
    **salaire de base × 1,25 à 1,45** pour la plupart des cadres américains, sous
    l'effet des charges sociales obligatoires et des avantages.

    ## Ce qui compose le coût total d'un salarié

    **1. Charges sociales patronales (~7,65 %)**
    - FICA : 6,2 % de Social Security (sur les 168 600 premiers dollars) + 1,45 % de Medicare (sans plafond)
    - FUTA : 0,6 % effectif de taxe chômage fédérale (sur les 7 000 premiers dollars de salaire)
    - SUTA : ~2,7 % en moyenne de taxe chômage de l'État (sur les 7 000 à 56 500 premiers dollars, selon l'État)

    **2. Assurance santé**
    - Coût moyen pour l'employeur : 8 000 à 18 000 $ par an et par salarié (données KFF 2024)
    - Couverture familiale : 14 000 à 22 000 $ par an
    - Couverture individuelle : 7 000 à 10 000 $ par an

    **3. Épargne retraite (facultative)**
    - Abondement 401(k) : en général 3 à 6 % du salaire
    - Pour 100 k$ de salaire avec 4 % d'abondement : 4 000 $ par an

    **4. Primes et actions**
    - Prime cible des cadres : 10 à 20 % du fixe
    - Attributions d'actions (RSU, actions gratuites) : 5 000 à 50 000 $ par an selon le niveau

    ## La règle empirique de 1,25 à 1,4

    Un modèle mental rapide : multipliez n'importe quel salaire par **1,3** pour
    estimer le coût complet (charges + assurance santé + abondement 401k, sans
    prime). Ajoutez 15 à 20 % pour les postes éligibles à une prime.

    | Salaire | Charges (~8 %) | Avantages (~12 %) | Total (1,2x) | + 10 % de prime (1,3x) |
    |---|---|---|---|---|
    | 80 000 $ | 6 120 $ | 9 600 $ | 95 720 $ | 103 720 $ |
    | 120 000 $ | 9 180 $ | 14 400 $ | 143 580 $ | 155 580 $ |
    | 150 000 $ | 11 475 $ | 18 000 $ | 179 475 $ | 194 475 $ |

    ## Prestataires ou salariés

    Quand vous comparez une embauche W-2 à un prestataire, rappelez-vous que le
    taux du prestataire inclut ses propres impôts et sa protection sociale. Un
    prestataire à 75 $ de l'heure n'est pas 1,3 fois plus cher qu'un salarié : il
    paie lui-même ses 15,3 % de SE tax et ses avantages. Pour une vraie
    comparaison, ajoutez d'abord au salaire le coût complet de l'emploi.

    ## Questions fréquentes

    **Quelles charges sociales l'employeur paie-t-il ?**
    L'employeur paie la FICA (7,65 % : 6,2 % de Social Security + 1,45 % de
    Medicare), la FUTA (0,6 % effectif sur les 7 000 premiers dollars de salaire)
    et la SUTA (taxe chômage de l'État, de 0,6 % à 8,5 % selon l'État et
    l'historique).

    **Combien l'assurance santé coûte-t-elle à l'employeur ?**
    Selon l'enquête 2024 de la Kaiser Family Foundation, les employeurs paient en
    moyenne 8 435 $ par an pour une couverture individuelle et 17 393 $ par an pour
    une couverture familiale. C'est la plus grosse variable du multiplicateur de
    coût après les charges sociales.
"employee-turnover-calculator":
  "body": |
    ## Formule du taux de turnover

    $$\text{Taux de turnover} = \frac{\text{Départs}}{\text{Effectif moyen}} \times 100$$

    $$\text{Effectif moyen} = \frac{\text{Effectif initial} + \text{Effectif final}}{2}$$

    ### Repères par secteur

    | Secteur | Turnover annuel moyen |
    |----------|------------------------|
    | Tech / logiciel | 10–15 % |
    | Finance / assurance | 10–15 % |
    | Santé | 15–25 % |
    | Commerce de détail | 25–60 % |
    | Restauration et hôtellerie | 50–75 % |
    | Agences d'intérim | 100 % et plus |

    ### Le vrai coût du turnover

    La SHRM (Society for Human Resource Management) estime le coût de remplacement entre 33 % et 200 % du salaire annuel selon le poste :

    | Poste | Coût de remplacement |
    |------|-----------------|
    | Débutant / horaire | 33–50 % du salaire |
    | Contributeur confirmé | 50–100 % du salaire |
    | Senior / spécialisé | 100–150 % du salaire |
    | Direction / comité exécutif | 150–200 % du salaire et plus |

    Ces coûts comprennent : annonces, honoraires de recruteurs, temps d'entretien, perte de productivité pendant la vacance, intégration et montée en compétence du nouvel arrivant.

    ### Guides

    - [Comment calculer le taux de turnover](/tools/employee-turnover-calculator/#how-to-calculate-employee-turnover-rate)
    - [Le vrai coût du turnover](/tools/employee-turnover-calculator/#true-cost-of-employee-turnover)
"employee-turnover-cost-calculator":
  "body": |
    Le turnover est l'un des coûts les plus sous-estimés en entreprise. Les études
    de la SHRM (Society for Human Resource Management) et de Gallup situent
    systématiquement le vrai coût de remplacement à **6 à 9 mois de salaire
    annuel** pour les postes courants, et jusqu'à **200 %** pour les postes seniors
    ou très spécialisés.

    ## Les composantes du coût du turnover

    | Composante | Coût habituel |
    |-----------|-------------|
    | Départ (administratif RH, entretien de sortie, indemnités) | 3–5 % du salaire annuel |
    | Vacance (productivité perdue tant que le poste est ouvert) | 50–150 % du salaire journalier × jours |
    | Recrutement (annonces, cabinets, temps d'entretien) | 5–30 % du salaire annuel |
    | Intégration et formation | 10–20 % du salaire annuel |
    | Montée en compétence jusqu'à la pleine productivité | 25–50 % du salaire annuel × mois de montée |

    ## Repères SHRM

    - **Débutant / horaire** : ~50 % du salaire annuel
    - **Technique / professionnel** : 100–150 % du salaire annuel
    - **Senior / direction** : 200–400 % du salaire annuel

    ## Réduire le coût du turnover

    Les leviers les plus efficaces : une intégration structurée (qui divise par
    deux le temps de montée en compétence), la formation des managers (premier
    facteur de départ volontaire), un alignement des salaires sur le marché, et
    des entretiens de maintien plutôt que des entretiens de sortie.
"payroll-cost-calculator":
  "body": |
    Embaucher un salarié coûte nettement plus que le salaire proposé. L'employeur
    paie des charges sociales, finance des avantages et supporte des frais
    généraux qui ajoutent 20 à 40 % au salaire de base. Ce calculateur chiffre le
    coût réel total.

    ## Les charges sociales payées par l'employeur (États-Unis)

    **FICA (Federal Insurance Contributions Act)**
    - Social Security : 6,2 % du salaire (sur les 168 600 premiers dollars en 2024)
    - Medicare : 1,45 % de l'ensemble du salaire (plus 0,9 % de Medicare additionnel au-delà de 200 k$)
    - FICA totale : 7,65 % du salaire

    **FUTA (taxe chômage fédérale)**
    - 6,0 % sur les 7 000 premiers dollars de salaire, ramenés à 0,6 % après le crédit pour taxe chômage de l'État
    - Taux effectif : en général 42 $ par salarié et par an après crédit

    **SUTA (taxe chômage de l'État)**
    - Variable selon l'État : 0,2 % à plus de 8 % sur une assiette propre à l'État (en général les 10 000 à 40 000 premiers dollars)
    - Le taux par défaut d'un nouvel employeur est souvent de 2,7 %

    ## Ce que les avantages coûtent en général à l'employeur

    | Avantage | Coût employeur habituel |
    |---|---|
    | Assurance santé (individuelle) | 7 000–15 000 $ par an |
    | Assurance santé (famille) | 18 000–28 000 $ par an |
    | Abondement 401(k) (3–5 % du salaire) | 3 600–6 000 $ sur un salaire de 120 k$ |
    | Dentaire + optique | 600–1 500 $ par an |
    | Assurance décès | 200–500 $ par an |
    | Congés payés (15 jours) | ~5,8 % du salaire en coût |

    ## La règle empirique de 1,25 à 1,40

    Règle souvent citée : coût employeur total = 1,25 à 1,40 fois le salaire
    annuel pour un salarié américain à temps plein avec des avantages standards.
    Pour un salaire de 120 k$ :
    - 1,25x : 150 000 $ de coût total par an
    - 1,35x : 162 000 $ de coût total par an

    Plus élevé pour les seniors avec des avantages complets ; plus bas pour les
    prestataires (pas de charges sociales s'ils sont correctement classés en 1099).

    ## Salarié ou prestataire : la comparaison des coûts

    Les prestataires (1099) coûtent plus cher à l'heure mais sans charges ni
    avantages. Pour une mission à 40 heures par semaine, le point d'équilibre :
    - Salarié à 120 k$ = ~58 $ de l'heure en coût effectif
    - Un prestataire à 75–90 $ de l'heure peut coûter plus, mais sans engagement de long terme

    Utilisez ce calculateur avec le calculateur de taux freelance pour comparer
    les options.

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule le coût employeur total, charges sociales (FICA, FUTA, SUTA) et avantages compris.

"irr-calculator":
  "body": |
    Le taux de rendement interne (TRI) est le taux de rendement annualisé qui
    annule la valeur actuelle nette (VAN) de l'ensemble des flux de trésorerie.
    C'est l'un des indicateurs les plus utilisés en choix d'investissement et en
    analyse financière.

    ## Formule du TRI

    Le TRI est la valeur de r qui vérifie :

    **0 = CF₀ + CF₁/(1+r) + CF₂/(1+r)² + ... + CFₙ/(1+r)ⁿ**

    Il n'existe pas de solution analytique : le TRI se calcule par itérations
    (méthode de Newton-Raphson).

    ## Règle de décision

    - **TRI > CMPC (taux de rentabilité minimal)** : accepter le projet, il crée de la valeur
    - **TRI < CMPC** : rejeter le projet, il détruit de la valeur
    - **TRI = CMPC** : équilibre, indifférent

    ## Limites du TRI

    - **TRI multiples** : des flux qui changent de signe plus d'une fois peuvent donner plusieurs TRI
    - **Insensibilité à la taille** : le TRI ignore la taille du projet ; 50 % de TRI sur 1 000 $ valent moins que 20 % sur 1 M$
    - **Hypothèse de réinvestissement** : il suppose que les flux intermédiaires sont réinvestis au TRI, ce qui peut être irréaliste

    C'est pourquoi on utilise souvent le TRI avec la VAN plutôt que seul.
"mirr-calculator":
  "body": |
    Le TRIM (taux de rendement interne modifié) corrige un défaut majeur du TRI
    classique : l'hypothèse que toutes les rentrées de trésorerie sont réinvesties
    au TRI lui-même, ce qui est en général irréaliste.

    ## Formule du TRIM

    **TRIM = (VF des flux positifs au taux de réinvestissement / VA des flux négatifs au taux de financement) ^ (1/n) − 1**

    Où n = nombre de périodes.

    ## TRIM ou TRI

    | Aspect | TRI | TRIM |
    |--------|-----|------|
    | Hypothèse de réinvestissement | Au TRI (souvent trop élevé) | Au taux de réinvestissement que vous choisissez |
    | Problème des TRI multiples | Plusieurs solutions possibles | Toujours une seule solution |
    | Résultat habituel | Plus élevé | Plus bas, plus réaliste |
    | Usage | Premier tri rapide | Choix d'investissement plus rigoureux |

    ## Quand utiliser le TRIM

    Utilisez le TRIM quand :
    - Les flux du projet alternent entre positifs et négatifs (problème des TRI multiples)
    - Le taux de réinvestissement est très différent du TRI
    - Vous devez comparer des projets de durées différentes
    - Des prêteurs ou des investisseurs avertis l'exigent

    Seuils de TRIM habituels : 15 % et plus pour le capital-risque et les
    startups, 12 à 18 % pour le private equity, 8 à 12 % pour l'immobilier, 6 à
    10 % pour les infrastructures.
"npv-calculator":
  "body": |
    La valeur actuelle nette (VAN) indique si un investissement crée ou détruit de
    la valeur, en comparant la valeur actuelle des flux futurs au coût initial.

    ## La formule

    **VAN = −investissement initial + Σ [flux de trésorerie_t / (1 + r)^t]**

    Où r est le taux d'actualisation et t la période en années.

    Pour un investissement de 100 k$ à 10 % d'actualisation, avec des flux annuels
    de 30 k$, 35 k$, 40 k$, 40 k$ et 40 k$ :
    VAN = −100k + 30k/1,1 + 35k/1,21 + 40k/1,331 + 40k/1,464 + 40k/1,611
    VAN = −100k + 27,3k + 28,9k + 30,0k + 27,3k + 24,8k = **38,3 k$**

    Une VAN positive signifie que l'investissement crée de la valeur au-delà du
    rendement exigé.

    ## Règles de décision

    | VAN | Décision |
    |---|---|
    | Positive (VAN > 0) | Accepter : crée de la valeur au-delà du rendement exigé |
    | Nulle (VAN = 0) | Équilibre : rapporte exactement le rendement exigé |
    | Négative (VAN < 0) | Rejeter : détruit de la valeur à ce taux d'actualisation |

    ## Indice de profitabilité (IP)

    IP = (VAN + investissement initial) / investissement initial

    L'IP mesure la valeur créée par dollar investi. IP > 1 = VAN positive. Il sert
    à classer des projets concurrents quand le capital est limité : plus l'IP est
    élevé, plus chaque dollar engagé crée de valeur.

    | IP | Lecture |
    |---|---|
    | > 1,5 | Excellent rendement |
    | 1,1–1,5 | Bon rendement |
    | 1,0–1,1 | Rendement marginal |
    | < 1,0 | Détruit de la valeur |

    ## Choisir le bon taux d'actualisation

    Le taux d'actualisation est la donnée la plus critique : de petits écarts ont
    de gros effets.

    **CMPC de l'entreprise** : moyenne pondérée du coût de la dette (après impôt)
    et du coût des capitaux propres. Fourchette habituelle : 8 à 12 % pour une
    entreprise établie.

    **Capital-risque / startup** : des taux plus élevés (20 à 30 %) reflètent un
    risque plus fort. Une startup peut exiger 25 % de rendement pour rémunérer les
    investisseurs du risque d'échec.

    **Taux de rentabilité minimal** : beaucoup d'entreprises fixent un TRI minimum
    acceptable (15 à 20 %) pour que les projets se disputent l'allocation du
    capital.

    En cas de doute, calculez la VAN à plusieurs taux (analyse de sensibilité).

    ## VAN ou TRI

    Le TRI (taux de rendement interne) est le taux d'actualisation qui annule la
    VAN. Les deux mesurent la valeur d'un projet ; on préfère en général la VAN
    car :
    - La VAN s'exprime en dollars (plus facile à interpréter)
    - Le TRI peut donner plusieurs valeurs pour des flux non conventionnels
    - La VAN gère correctement des taux d'actualisation variables dans le temps

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule la VAN à partir d'un investissement initial et de 5 ans de flux au
    maximum. Saisissez votre taux d'actualisation (coût du capital) et vos flux
    annuels prévus.
"payback-period-calculator":
  "body": |
    Le délai de récupération est le temps nécessaire pour qu'un investissement
    génère assez de trésorerie pour couvrir son coût initial. C'est l'un des
    indicateurs de choix d'investissement les plus utilisés, car il répond
    directement à la question : « Quand est-ce que je récupère mon argent ? »

    ## Formule du délai de récupération simple

    **Délai de récupération (années) = investissement initial / flux net annuel**

    Pour 200 k$ d'investissement et 80 k$ de flux net annuel : 200k / 80k = **2,5 ans**.

    ## Délai de récupération actualisé

    Le délai actualisé tient compte de la valeur temps de l'argent en actualisant
    le flux de chaque année :

    **VA du flux de l'année N = flux annuel / (1 + taux d'actualisation) ^ N**

    Le délai actualisé est toujours plus long que le délai simple. À 10 %
    d'actualisation, un investissement de 200 k$ avec 80 k$ par an, récupéré en
    2,5 ans en simple, passe à environ 3,1 ans en actualisé.

    ## Repères

    | Délai de récupération | Lecture |
    |---|---|
    | < 6 mois | Exceptionnel : rare, surtout en logiciel/SaaS |
    | 6–12 mois | Excellent : retour rapide sur capital |
    | 1–2 ans | Bon : standard pour les investissements marketing |
    | 2–4 ans | Acceptable : courant pour les équipements |
    | > 4 ans | Long : exige des flux stables et prévisibles |

    ## Les limites du délai de récupération

    Le délai de récupération ignore les flux après le point mort. Un
    investissement de 200 k$ récupéré en 2 ans qui rapporte ensuite 100 k$ par an
    pendant 8 ans vaut bien plus qu'un autre qui rapporte exactement 80 k$ par an,
    alors qu'ils affichent le même délai.

    **Utilisez le délai de récupération avec le ROI et la VAN pour une analyse
    d'investissement complète.**

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule le délai de récupération simple et actualisé à partir de
    l'investissement initial et des flux nets annuels, ainsi que le ROI à la fin
    de votre période d'analyse.
"roi-calculator":
  "body": |
    Le ROI (retour sur investissement) est la mesure la plus universelle de
    l'efficacité d'un investissement. Il exprime le bénéfice en pourcentage du
    capital engagé pour le générer.

    ## La formule

    **ROI = (bénéfice net / coût de l'investissement) × 100**

    Où bénéfice net = chiffre d'affaires − coûts d'exploitation

    Avec 150 k$ de chiffre d'affaires, 50 k$ de coûts et 100 k$ d'investissement :
    - Bénéfice net = 100 k$
    - ROI = (100 k$ / 100 k$) × 100 = **100 %**

    ## ROI annualisé

    **ROI annualisé = ((1 + ROI/100) ^ (1/années) − 1) × 100**

    Le ROI annualisé permet de comparer des horizons différents. Un ROI de 50 % sur
    2 ans équivaut à ~22,5 % par an, et non 25 %. La capitalisation compte.

    ## Qu'est-ce qu'un bon ROI ?

    Tout dépend du contexte :
    - **Marketing** : un rapport de 5 pour 1 (5 $ de chiffre d'affaires par dollar dépensé) = 400 % de ROI, considéré comme bon
    - **Immobilier** : 8 à 12 % de ROI annualisé, habituel
    - **Moyenne du S&P 500** : ~10 % par an, la référence du capital placé passivement
    - **Investissement SaaS** : viser plus de 30 % annualisé sous 3 ans

    Tout ROI inférieur à votre coût du capital (en général 8 à 15 %) signifie que
    l'investissement détruit de la valeur.

    ## Le ROI et les autres indicateurs

    | Indicateur | Mesure | Quand l'utiliser |
    |---|---|---|
    | ROI | Rendement total du capital | Comparer l'efficacité des investissements |
    | ROAS | Chiffre d'affaires par dollar publicitaire | Spécifique au marketing |
    | Délai de récupération | Mois pour récupérer l'investissement | Planification de trésorerie |
    | VAN | Valeur actuelle des rendements futurs | Allocation du capital à long terme |

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule le ROI, le ROI annualisé, le bénéfice net et le délai de
    récupération à partir du chiffre d'affaires, des coûts et de l'investissement
    initial.
"rule-of-72-calculator":
  "body": |
    La règle de 72 est un raccourci de calcul mental pour estimer en combien de
    temps les intérêts composés doublent un placement.

    ## Formule

    **Temps de doublement (années) ≈ 72 ÷ taux annuel (%)**

    **Taux nécessaire ≈ 72 ÷ nombre d'années visé**

    ## Pourquoi 72 ?

    72 est divisible par 1, 2, 3, 4, 6, 8, 9, 12 et 24, ce qui facilite le calcul
    mental. La formule exacte est **ln(2) ÷ ln(1 + r)**, mais 72/r est précis à 1 à
    2 % près pour des taux compris entre 2 et 20 %.

    ## Temps de doublement selon le taux

    | Taux annuel | Temps de doublement |
    |------------|--------------|
    | 2 % | 36 ans |
    | 4 % | 18 ans |
    | 6 % | 12 ans |
    | 8 % | 9 ans |
    | 10 % | 7,2 ans |
    | 12 % | 6 ans |
    | 24 % | 3 ans |
    | 72 % | 1 an |

    ## La règle de 72 et l'inflation

    La règle vaut aussi pour l'inflation. À 3 % d'inflation, le pouvoir d'achat
    est divisé par deux en 24 ans. C'est pourquoi il est indispensable de gagner
    plus que l'inflation pour préserver un patrimoine réel.

    ## Applications à la croissance exponentielle

    La règle de 72 fonctionne pour tout processus exponentiel :
    - Taux de croissance de l'[ARR](/glossary/#arr) d'un SaaS → années pour doubler le chiffre d'affaires
    - Croissance d'une population → temps de doublement
    - Dette à un taux d'intérêt donné → années pour doubler ce que vous devez
"wacc-calculator":
  "body": |
    Le CMPC (coût moyen pondéré du capital, ou WACC) est le rendement minimal
    qu'une entreprise doit obtenir sur ses actifs pour satisfaire ses bailleurs de
    fonds, actionnaires comme créanciers. Il sert de taux de rentabilité minimal
    pour les décisions d'investissement et les valorisations par DCF.

    ## Formule du CMPC

    **CMPC = (E/V) × Rₑ + (D/V) × Rᵈ × (1 − Tᶜ)**

    Où :
    - **E** = valeur de marché des capitaux propres (capitalisation)
    - **D** = valeur de marché de la dette
    - **V** = E + D (capital total)
    - **Rₑ** = coût des capitaux propres (%)
    - **Rᵈ** = coût de la dette avant impôt (%)
    - **Tᶜ** = taux d'impôt sur les sociétés (%)

    Le coût des capitaux propres s'estime en général avec le MEDAF : taux sans
    risque + bêta × prime de risque actions. Le bêta mesure la volatilité d'une
    action par rapport au marché : un bêta de 1,5 signifie que l'action bouge en
    général 50 % de plus que le marché dans un sens comme dans l'autre, ce pour
    quoi les investisseurs exigent un rendement plus élevé.

    ## Pourquoi le taux d'impôt compte

    Les intérêts de la dette sont déductibles, ce qui crée un « bouclier fiscal ».
    Le coût de la dette après impôt est Rᵈ × (1 − Tᶜ). Une entreprise avec 6 % de
    coût de la dette et 25 % d'impôt a un coût effectif de la dette de 4,5 %.

    ## Repères de CMPC

    | Secteur | CMPC habituel |
    |----------|-------------|
    | SaaS / logiciel | 8–14 % |
    | Biens de consommation | 6–10 % |
    | Services publics | 4–8 % |
    | Biotech | 12–20 % |

    ## Le CMPC en pratique

    - **Valorisation par DCF** : le CMPC est le taux d'actualisation appliqué aux flux de trésorerie disponibles futurs
    - **Choix d'investissement** : n'accepter que les projets dont le TRI dépasse le CMPC
    - **Structure du capital** : optimiser la répartition dette/capitaux propres pour minimiser le CMPC
    - **Mesure de la performance** : un ROIC supérieur au CMPC signifie que l'entreprise crée de la valeur économique

"dcf-calculator":
  "body": |
    Un modèle DCF (actualisation des flux de trésorerie) valorise une entreprise
    ou un investissement en additionnant la valeur actuelle de tous les flux de
    trésorerie futurs attendus. C'est la méthode de valorisation de base de la
    finance d'entreprise.

    ## La formule du DCF

    **Valeur d'entreprise = Σ (FCF_t / (1 + r)^t) + valeur terminale / (1 + r)^n**

    Où FCF_t = flux de trésorerie disponible de l'année t, r = taux d'actualisation (CMPC), n = nombre d'années de prévision.

    **Valeur terminale (modèle de Gordon, qui suppose une croissance constante des flux à l'infini) = FCF_n × (1 + g) / (r − g)**

    Où g = taux de croissance terminal (obligatoirement < r).

    ## Repères de taux d'actualisation

    | Type d'entreprise | Taux d'actualisation habituel |
    |-------------|----------------------|
    | Grande capitalisation cotée | 8–10 % |
    | Moyenne capitalisation cotée | 10–14 % |
    | Non cotée en phase de croissance | 15–25 % |
    | Startup en phase d'amorçage | 25–40 % |
    | Amorçage / avant chiffre d'affaires | 40–60 % |

    ## L'importance de la valeur terminale

    Dans un DCF sur 10 ans, la valeur terminale représente souvent 70 à 90 % de la
    valeur d'entreprise totale. L'hypothèse de croissance terminale est donc la
    variable la plus sensible : de petits changements de g entraînent de gros
    écarts de valeur. Faites toujours une analyse de sensibilité.

    ## Les limites du DCF

    Un DCF ne vaut que ce que valent vos prévisions de flux. Il est le plus fiable
    pour :
    - Les entreprises stables et matures aux flux prévisibles
    - Les entreprises que l'on peut projeter sur 5 à 10 ans avec une confiance raisonnable

    Il l'est le moins pour les entreprises sans chiffre d'affaires, les activités
    très cycliques et celles dont la valeur est surtout immatérielle.
"ebitda-multiple-calculator":
  "body": |
    ## Qu'est-ce que le multiple d'EBITDA ?

    Le multiple VE/EBITDA (ou multiple d'EBITDA) est l'indicateur de valorisation le plus courant en fusions-acquisitions et en private equity. Il exprime la valeur d'entreprise en multiple de l'EBITDA (résultat avant intérêts, impôts, dépréciations et amortissements).

    $$\text{Valeur d'entreprise} = \text{EBITDA} \times \text{Multiple VE/EBITDA}$$

    ### Repères de multiples d'EBITDA par secteur (2024)

    | Secteur | VE/EBITDA habituel |
    |--------|-------------------|
    | SaaS / tech à forte croissance | 15–30× |
    | Logiciel B2B (mature) | 8–15× |
    | Industrie | 5–8× |
    | Commerce de détail | 4–7× |
    | Services / conseil | 4–7× |
    | Distribution | 5–8× |

    ### Valeur d'entreprise et valeur des capitaux propres

    La valeur d'entreprise inclut les créanciers. La valeur des capitaux propres est ce que les actionnaires reçoivent réellement :

    $$\text{Valeur des capitaux propres} = \text{VE} - \text{Dette totale} + \text{Trésorerie}$$

    ### Multiples d'EBITDA et de chiffre d'affaires

    Les multiples de chiffre d'affaires (VE/CA) servent quand l'EBITDA est négatif ou proche de zéro, fréquent dans le SaaS à forte croissance. Comparez les deux pour encadrer votre fourchette de valorisation.

    ### Guides

    - [Qu'est-ce que le multiple VE/EBITDA ?](/tools/ebitda-multiple-calculator/#what-is-ev-ebitda)
    - [Multiples d'EBITDA par secteur](/tools/ebitda-multiple-calculator/#ebitda-multiple-by-industry)
"enterprise-value-calculator":
  "body": |
    ## Formule de la valeur d'entreprise

    $$\text{VE} = \text{Capitalisation} + \text{Dette totale} - \text{Trésorerie}$$

    La valeur d'entreprise est le prix théorique d'acquisition : ce qu'un acheteur paierait pour racheter toute l'entreprise, en reprenant ses dettes et en récupérant sa trésorerie.

    ### Pourquoi la VE plutôt que la capitalisation ?

    La capitalisation ne reflète que la valeur des capitaux propres. La VE tient compte de la structure du capital :

    - **Entreprise A** : 1 Md$ de capitalisation, 500 M$ de dette, 100 M$ de trésorerie → VE = 1,4 Md$
    - **Entreprise B** : 1 Md$ de capitalisation, 0 $ de dette, 100 M$ de trésorerie → VE = 900 M$

    L'entreprise A coûte en réalité 56 % de plus à racheter, alors que les deux ont la même capitalisation. La VE corrige ce biais.

    ### Repères VE/EBITDA

    | VE/EBITDA | Contexte |
    |-----------|---------|
    | < 5× | Décote / entreprise en difficulté |
    | 6–10× | Secteurs traditionnels |
    | 10–15× | Croissance, mid-market |
    | 15–25× | Entreprises à forte croissance |
    | 25× et plus | SaaS premium / hypercroissance |

    ### Repères VE/chiffre d'affaires

    | VE/CA | Contexte |
    |------------|---------|
    | < 1× | Forte décote / déclin |
    | 1–3× | Entreprises traditionnelles |
    | 3–10× | Entreprises en croissance |
    | 10× et plus | SaaS à forte croissance |

    ### Guides

    - [Qu'est-ce que la valeur d'entreprise ?](/tools/enterprise-value-calculator/#what-is-enterprise-value)
    - [Le multiple VE/EBITDA : signification et repères par secteur](/tools/enterprise-value-calculator/#ev-ebitda-multiple-benchmarks)
"equity-dilution-calculator":
  "body": |
    La dilution se produit chaque fois qu'une entreprise émet de nouvelles
    actions. Quand des investisseurs reçoivent de nouvelles actions en échange de
    leur investissement, le nombre total d'actions augmente et chaque actionnaire
    existant détient un pourcentage plus faible, même si son nombre d'actions ne
    change pas.

    ## Le calcul

    **Valorisation pre-money** : 5 000 000 $
    **Investissement** : 1 000 000 $
    **Valorisation post-money** : 6 000 000 $
    **Part de l'investisseur** : 1 M$ / 6 M$ = **16,7 %**

    Si vous déteniez 60 % avant le tour (6 M d'actions sur 10 M), vous détenez
    désormais : 6 M / (10 M + 2 M d'actions nouvelles) = **50 %**

    Votre part est passée de 60 % à 50 % : une **dilution de 10 points**.

    ## Valorisation pre-money et post-money

    Ces termes créent beaucoup de confusion dans les négociations de levée :

    **Pre-money** : la valeur de l'entreprise avant l'investissement.
    **Post-money** : pre-money + montant investi.

    Quand un investisseur dit « j'investis 1 M$ sur une valorisation de 5 M$ »,
    précisez : 5 M$ pre-money ou post-money ? La différence est importante :
    - 5 M$ pre-money : l'investisseur obtient 1 M / 6 M = **16,7 %**
    - 5 M$ post-money : l'investisseur obtient 1 M / 5 M = **20 %**

    Précisez toujours la valorisation pre-money dans la lettre d'intention.

    ## La dilution cumulée au fil des tours

    La dilution se cumule. Dilution habituelle par stade :

    | Tour | Dilution | Part cumulée des fondateurs |
    |---|---|---|
    | Pré-amorçage (500 k$) | 10–15 % | 85–90 % |
    | Amorçage (1–2 M$) | 15–25 % | 65–75 % |
    | Série A (5–10 M$) | 20–30 % | 45–55 % |
    | Série B (20–40 M$) | 15–25 % | 35–45 % |

    À chaque tour, la dilution s'applique à la [table de capitalisation](/glossary/#cap-table)
    post-tour, pas à celle d'origine. Un fondateur à 85 % après l'amorçage qui lève
    une série A diluant de 20 % conserve 85 % × 80 % = **68 %**.

    ## Le « option pool shuffle »

    Les investisseurs exigent souvent de créer ou d'élargir un pool d'options
    avant la clôture du tour, ce qui accroît la dilution des fondateurs. Un « pool
    d'options de 20 % post-money » sur un tour de 6 M$ signifie créer des actions
    égales à 20 % de la table post-tour. Cela dilue les fondateurs avant les
    investisseurs et augmente la dilution effective en pre-money.

    Modélisez-le en ajoutant les actions du pool au « nombre d'actions en
    circulation » avant de lancer le calculateur.

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il modélise la dilution des fondateurs et des investisseurs lors d'une levée :
    valorisation post-money, actions nouvelles émises et votre pourcentage de
    détention après le tour.
"pe-ratio-calculator":
  "body": |
    ## Formule du PER

    $$\text{PER} = \frac{\text{Cours de l'action}}{\text{BPA}}$$

    ### PER historique et PER prévisionnel

    - **PER historique** : utilise les bénéfices réels des 12 derniers mois. Plus fiable, mais tourné vers le passé.
    - **PER prévisionnel** : utilise les estimations des analystes pour les 12 prochains mois. Plus pertinent pour les entreprises en croissance : il montre ce que le marché anticipe.

    Si le PER prévisionnel est inférieur au PER historique, le marché attend une hausse des bénéfices. S'il est supérieur, il attend une baisse.

    ### Rendement bénéficiaire

    $$\text{Rendement bénéficiaire} = \frac{1}{\text{PER}} \times 100$$

    Le rendement bénéficiaire est l'inverse du PER : il transforme une valorisation en taux de rendement comparable à celui des obligations. Un PER de 20× = 5 % de rendement bénéficiaire. Comparez-le au rendement des emprunts d'État à 10 ans pour juger de l'attrait relatif.

    ### Ratio PEG (PER rapporté à la croissance)

    $$\text{PEG} = \frac{\text{PER}}{\text{Croissance attendue du BPA (\%)}}$$

    Peter Lynch a popularisé le PEG comme indicateur de valorisation ajusté de la croissance. PEG = 1 signifie que le PER égale le taux de croissance : valorisation « juste ». Un PEG < 1 suggère une possible sous-valorisation ; un PEG > 2 indique que le cours intègre des attentes de croissance très élevées.

    ### Le PER historique du S&P 500

    - Moyenne de long terme : ~15–17×
    - Moyenne depuis 2010 (ère des taux bas) : ~20–25×
    - En récession : souvent 10–12×
    - Sommets de bulle : 30–40× et plus

    ### Guides

    - [Qu'est-ce que le PER et comment l'utiliser ?](/tools/pe-ratio-calculator/#what-is-pe-ratio)
    - [PEG ou PER : lequel est le meilleur pour valoriser ?](/tools/pe-ratio-calculator/#peg-ratio-vs-pe-ratio)
"price-to-sales-calculator":
  "body": |
    Le ratio cours/chiffre d'affaires (P/S) est l'un des indicateurs de
    valorisation les plus utilisés pour les logiciels et SaaS à forte croissance,
    dont les bénéfices ne reflètent pas encore la valeur de façon fiable.

    **Ratio P/S** = capitalisation ÷ chiffre d'affaires annuel

    Ou, de façon équivalente : **VE/CA** = valeur d'entreprise ÷ chiffre d'affaires annuel

    Pour une entreprise non cotée, le numérateur est la valorisation post-money du
    dernier tour de financement.

    ## Repères de P/S par stade (2024)

    | Stade | Fourchette de P/S habituelle | Remarques |
    |---|---|---|
    | SaaS en amorçage (croissance de 50 % et plus) | 8–20x l'ARR | De l'amorçage à la série A |
    | SaaS en croissance (30–50 %) | 5–12x l'ARR | Séries B à C |
    | SaaS en phase avancée (20–30 %) | 3–8x l'ARR | Avant l'introduction en bourse |
    | SaaS coté (10–20 %) | 2–6x le chiffre d'affaires | Médiane ~4x en 2024 |
    | Logiciel en déclin / mature | 0,5–2x le chiffre d'affaires | Fourchette des LBO |

    Après la compression des multiples de 2021–2022, les P/S des SaaS cotés sont
    passés de 20–30x à 4–8x avec la hausse des taux. La médiane actuelle (2024) des
    SaaS cotés est d'environ 4 à 6x le chiffre d'affaires prévisionnel.

    ## Le lien avec la règle des 40

    Des multiples de P/S élevés se justifient quand le score de la [règle des 40](/glossary/#rule-of-40)
    est solide. Une entreprise qui croît de 50 % avec une marge FCF de −5 % (règle
    des 40 = 45 %) se valorise plus cher qu'une autre qui croît de 20 % avec −15 %
    de marge (règle des 40 = 5 %).

    **P/S ajusté de la croissance** = P/S ÷ taux de croissance

    Un P/S de 10x pour 50 % de croissance donne un P/S ajusté de 0,2x, souvent
    considéré comme une juste valeur. Au-delà de 0,3x, c'est tendu ; sous 0,15x, il
    peut y avoir une opportunité.

    ## VE/CA ou P/S

    Pour une entreprise endettée ou disposant de beaucoup de trésorerie, le ratio
    valeur d'entreprise / chiffre d'affaires est plus juste que le P/S :

    **VE** = capitalisation + dette totale − trésorerie et équivalents

    La plupart des jeunes startups ont peu de dette et une trésorerie qui fond, donc
    VE ≈ capitalisation. Pour une entreprise riche en trésorerie ou ayant de la
    dette venture, l'ajustement compte.

    ## Questions fréquentes

    **Quel P/S viser pour valoriser ma startup ?**
    En série A, 8 à 15x l'ARR est courant pour un SaaS qui croît de plus de 80 %. En
    série B, 10 à 20x l'ARR pour une entreprise à fort NRR (120 % et plus) et à plus
    de 50 % de croissance. Ces chiffres baissent nettement quand la croissance
    ralentit : une entreprise à 30 % obtient en général 4 à 8x.

    **Comment utiliser le P/S pour se comparer à la concurrence ?**
    Trouvez 5 à 10 comparables cotés aux taux de croissance et modèles similaires.
    Prenez le P/S médian. Appliquez-le à votre ARR pour une fourchette de
    valorisation approximative. Retirez 20 à 30 % de décote d'illiquidité pour une
    entreprise non cotée. C'est la méthode la plus utilisée par les VC pour les
    valorisations à partir de la série B.
"tam-sam-som-calculator":
  "body": |
    TAM, SAM et SOM définissent votre opportunité de marché à trois niveaux de
    précision. Toute présentation aux investisseurs en a besoin, et la façon dont
    vous les définissez montre si vous comprenez votre marché.

    ## Les trois niveaux

    **TAM (marché total adressable)** : l'opportunité de chiffre d'affaires
    mondiale totale si vous captiez 100 % du marché. C'est un plafond, pas un
    objectif réaliste.

    **SAM (marché adressable accessible)** : la part du TAM que vous pouvez
    réellement servir compte tenu des capacités actuelles du produit, de votre
    couverture géographique et de votre stratégie commerciale.

    **SOM (marché réellement atteignable)** : la part du SAM que vous pouvez
    raisonnablement capter en 3 à 5 ans, compte tenu de la concurrence et de vos
    moyens commerciaux.

    ## Dimensionnement descendant ou ascendant

    **Descendant (top-down)** : des études sectorielles estiment la taille totale
    du marché et vous en déduisez votre part. Rapide, mais imprécis. « Le marché
    du CRM pèse 50 Md$ et nous visons 1 %. »

    **Ascendant (bottom-up)** : compter les clients réels et multiplier par
    l'[ACV](/glossary/#acv). Plus crédible. « Il y a 500 000 entreprises de taille
    intermédiaire aux États-Unis, 30 % ont ce problème, nous pouvons en atteindre
    15 % avec notre dispositif commercial (GTM) actuel, à 15 k$ d'ACV = 337 M$ de
    SAM. »

    Les investisseurs préfèrent l'approche ascendante, car elle montre que vous
    connaissez le vivier réel de clients.

    ## Les attentes des investisseurs par stade

    | Stade | TAM minimum | Remarques |
    |---|---|---|
    | Amorçage | 500 M$ | Les VC ont besoin de marge pour une sortie de plus de 50 M$ |
    | Série A | 1 Md$ et plus | La logique du fonds exige un gros marché potentiel |
    | Série B et au-delà | 5 Md$ et plus | Pour justifier une croissance à grande échelle et un récit d'introduction en bourse |

    Un TAM inférieur à 500 M$ n'est pas éliminatoire en soi : les entreprises de
    services et le SaaS vertical peuvent bâtir des activités très rentables de 50
    à 100 M$ de chiffre d'affaires sur des marchés plus petits. Mais une
    hypercroissance financée par des VC exige des marchés énormes.

    ## Erreurs courantes de dimensionnement

    **Gonfler le TAM** : « Le marché mondial du logiciel d'entreprise pèse
    500 Md$, nous faisons du logiciel, donc notre TAM est de 500 Md$. » Faux. Le
    TAM doit être le marché de votre catégorie de produit précise.

    **Confondre TAM et SAM** : « Notre SAM, c'est tout le marché américain. » Le SAM
    doit se limiter à ceux à qui vous pouvez vendre aujourd'hui, votre
    [ICP](/glossary/#icp), pas tout le pays.

    **Un SOM irréaliste** : « Nous capterons 10 % du marché en année 3. » Sans le
    calcul commercial (effectifs, canaux, CAC), ce n'est pas crédible.

    ## Questions fréquentes

    **Que fait ce calculateur ?**
    Il calcule le TAM (clients totaux × dépense), le SAM (filtré selon votre
    portée) et le SOM (votre part atteignable) pour dimensionner un marché dans une
    présentation aux investisseurs.
