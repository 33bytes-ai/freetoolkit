# French finance vocabulary: every translation batch uses these, so a term
# reads the same on every page. Acronyms investors use as-is stay in English.
free cash flow: flux de trésorerie disponible (FCF)
operating cash flow: flux de trésorerie d'exploitation (OCF)
capital expenditures (capex): dépenses d'investissement (capex)
revenue: chiffre d'affaires
annual revenue: chiffre d'affaires annuel
market cap: capitalisation boursière
margin: marge
gross margin: marge brute
yield: rendement
runway: autonomie de trésorerie (runway)
burn / burn rate: consommation de trésorerie (burn)
churn: attrition (churn)
MRR / ARR: MRR / ARR (unchanged)
EBITDA: EBITDA (unchanged)
working capital: besoin en fonds de roulement (BFR)
accounts receivable: créances clients
accounts payable: dettes fournisseurs
DSO / DPO: DSO / DPO (unchanged; délai de paiement clients / fournisseurs)
net income: résultat net
depreciation & amortization: dotations aux amortissements
cash flow statement: tableau des flux de trésorerie
unit economics: économie unitaire
pricing: tarification
founder: fondateur / fondatrice
calculator: calculateur
