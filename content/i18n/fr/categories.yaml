"Cash Flow":
  "body": |
    Des entreprises rentables font faillite faute de trésorerie. Le bénéfice est un
    résultat comptable ; la trésorerie est un solde bancaire, et c'est dans l'écart
    entre les deux que se jouent la plupart des défaillances évitables. Ces
    calculateurs mesurent cet écart.

    ## Lequel choisir

    **Flux de trésorerie d'exploitation** et **Flux de trésorerie disponible**
    montrent ce que l'entreprise génère réellement une fois pris en compte le
    besoin en fonds de roulement et les dépenses d'investissement ; le FCF est le
    chiffre qui finance la croissance ou rembourse la dette. **Cycle de conversion
    de trésorerie** et **DSO** mesurent combien de temps la trésorerie reste
    bloquée entre le paiement des fournisseurs et l'encaissement des clients ;
    raccourcir ce cycle libère du cash sans lever de fonds. **Fonds de roulement**
    dimensionne le coussin dont l'entreprise a besoin pour fonctionner, **Escompte
    sur facture** chiffre le coût d'un escompte pour paiement anticipé, et **Écart
    budgétaire** compare le prévu au réalisé pour repérer un manque au deuxième
    mois plutôt qu'au sixième.

    ## Ce que disent les chiffres

    Un DSO qui grimpe est l'un des premiers signaux d'alerte fiables dans une
    petite entreprise : soit le recouvrement s'est relâché, soit les clients sont
    eux-mêmes sous pression, et les deux s'aggravent sans bruit. Un cycle de
    conversion négatif (encaisser les clients avant de payer les fournisseurs) est
    un vrai avantage structurel : c'est en grande partie pour cela que les modèles
    d'abonnement et les places de marché peuvent financer leur croissance par
    l'exploitation, ce qu'un distributeur classique ne peut pas faire.

"Payments":
  "body": |
    Les frais de paiement sont souvent le premier poste de dépense qu'une petite
    entreprise ne négocie jamais. À 2,9 % + 0,30 $, une activité qui encaisse
    30 000 $ par mois par carte cède environ 10 500 $ par an, plus que ce que la
    plupart des fondateurs dépensent en logiciels. Ces calculateurs existent pour
    que ce chiffre ne soit plus une surprise sur le relevé mensuel.

    ## Lequel choisir

    Commencez par le **Comparateur de frais** si vous choisissez un prestataire
    ou envisagez d'en changer : il place Stripe, PayPal et les trois forfaits
    Shopify Payments côte à côte pour un même montant de vente et affiche le net
    exact versé par chacun. Utilisez les calculateurs **Stripe**, **PayPal** et
    **Shopify** quand vous connaissez déjà votre prestataire et voulez un chiffre
    précis : chacun gère les détails que la vue comparative simplifie, dont les
    cartes internationales, les taux négociés et la majoration d'un montant pour
    recevoir une somme exacte après frais.

    ## Les erreurs qu'ils évitent

    Deux erreurs reviennent sans cesse. La première consiste à comparer les
    pourcentages affichés en oubliant la part fixe : sur une vente de 5 $, les
    0,30 $ de Stripe représentent à eux seuls 6 %, ce qui explique pourquoi les
    micro-transactions détruisent des marges qui paraissent correctes dans un
    tableur. La seconde est d'oublier les suppléments pour paiement
    transfrontalier et conversion de devise (respectivement 1,5 % et 1 % de plus
    chez Stripe), qui rendent discrètement un client étranger nettement moins
    rentable qu'un client national au même prix.
