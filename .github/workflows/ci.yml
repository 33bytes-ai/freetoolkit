name: CI

on:
  # `push` on main only. With `branches: ["**"]` on both triggers, every push
  # to a PR branch started two identical 17-minute runs -- a push run and a
  # pull_request run -- doubling the minutes and the failure emails. Branch
  # pushes are still covered: they arrive through the pull_request trigger.
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # No cache: this project has no package.json and no npm
          # dependencies -- the JS tests run on `node --test` alone. Asking
          # setup-node to cache npm against a **/package-lock.json glob that
          # matches nothing fails the step outright ("Some specified paths
          # were not resolved"), which is what has been failing CI.
          node-version: "20"

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Run JS tests
        run: make test-js

      - name: Run Python tests
        run: make test-py

      - name: Run Python build
        run: make build

      - name: Check performance budgets
        run: make check-perf

      # staticDistDir and urls are alternatives, not a pair: with
      # staticDistDir the action serves dist/ on an ephemeral port and
      # auto-discovers pages, so the relative "/" entries below reached
      # Lighthouse verbatim and it rejected them with INVALID_URL. Auto-
      # discovery is no answer either -- it would audit all 400+ built pages.
      # So: serve dist/ ourselves on a known port and give absolute URLs.
      - name: Serve dist for Lighthouse
        run: |
          python -m http.server 8080 --directory dist &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/tools/
            http://localhost:8080/tools/dcf-calculator/
            http://localhost:8080/tools/stripe-fee-calculator/stripe-fees-for-subscriptions/
            http://localhost:8080/tools/stripe-fee-calculator/stripe-fees-uk/
          configPath: "./.lighthouserc.json"
          # Three passes per URL, asserted on the median (see .lighthouserc.json).
          # One pass was not a measurement: the same content scored 0.90+ on main
          # and 0.63 on a branch, because Lighthouse's performance score is CPU
          # time on a shared runner. The thresholds are unchanged -- moving them
          # would hide regressions; this makes the number worth asserting on.
          # Costs ~2.5 min: the step takes 77s, not the 17 minutes, which are
          # the Python suite.
          runs: 3
          uploadArtifacts: false
          temporaryPublicStorage: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: dist/
          retention-days: 7
