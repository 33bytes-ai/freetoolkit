name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # No cache: this project has no package.json and no npm
          # dependencies -- the JS tests run on `node --test` alone. Asking
          # setup-node to cache npm against a **/package-lock.json glob that
          # matches nothing fails the step outright ("Some specified paths
          # were not resolved"), which is what has been failing CI.
          node-version: "20"

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Run JS tests
        run: make test-js

      - name: Run Python tests
        run: make test-py

      - name: Run Python build
        run: make build

      - name: Check performance budgets
        run: make check-perf

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: "./dist"
          urls: |
            /
            /tools/
            /tools/dcf-calculator/
            /tools/stripe-fee-calculator/stripe-fees-for-subscriptions/
            /tools/stripe-fee-calculator/stripe-fees-uk/
          configPath: "./.lighthouserc.json"
          uploadArtifacts: false
          temporaryPublicStorage: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: dist/
          retention-days: 7
